<script type="text/babel">
// =========================================================================
// 📊 MODULE: BÁO CÁO KẾT QUẢ KINH DOANH & P&L TOÀN DOANH NGHIỆP (Tab_BusinessReport.html)
// RICH FISH AQUARIUM - EXECUTIVE P&L SUITE (HALLMARK ROYAL WORKBENCH v3.0)
// =========================================================================

const ReportMetricField = React.memo(({ label, field, value, isEditing, disabled, onChange, color, canView = true }) => (
    <div className={`p-3 rounded-xl border transition-all ${
        isEditing && !disabled ? 'bg-[#09090b] border-amber-500/50 shadow-inner' : 'bg-[#09090b]/60 border-zinc-800/80'
    }`}>
        <div className="text-[10px] font-bold uppercase text-zinc-400 mb-1 tracking-wider">{label}</div>
        {isEditing && !disabled ? (
            <input 
                type="number" 
                value={value === 0 ? '' : value} 
                onChange={e => onChange(field, e.target.value)} 
                className={`w-full bg-transparent border-b border-zinc-700 focus:border-amber-400 outline-none text-[15px] font-mono font-black ${color} pb-1 transition-colors`} 
                placeholder="0" 
            />
        ) : (
            <div className={`text-[15px] font-mono font-black ${color} truncate`}>
                {field === 'orderCount' ? (value || 0) : (canView ? (Number(value) || 0).toLocaleString('vi-VN') + 'đ' : '******')}
            </div>
        )}
    </div>
));

const BusinessReportTab = React.memo(function BusinessReportTab({ erpData, pushDeltas, userRole: propUserRole, currentUser: propCurrentUser, hasPerm: propHasPerm, triggerToast }) {
    const currentRole = propUserRole || localStorage.getItem('rf_role') || '';
    const currentUser = propCurrentUser || localStorage.getItem('rf_user') || '';
    const isBoss = localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO' || currentUser.includes('Tiến');

    const hasPerm = React.useCallback((actionCode) => {
        if (isBoss || currentRole === 'TỐI CAO') return true;
        if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
        if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
        return isBoss;
    }, [propHasPerm, currentRole, currentUser, isBoss]);

    // Phân quyền bảo mật: Chỉ Boss và Kế toán
    const canViewFinanceReport = isBoss || currentRole === 'TỐI CAO' || ['KẾ TOÁN', 'KIỂM TOÁN'].includes(currentRole) || hasPerm('REPORT_FINANCE_VIEW') || hasPerm('FINANCE_ADMIN');

    const REPORT_CHANNELS = [
        { id: 'Shopee VN', name: 'Shopee VN', icon: 'fa-shopping-bag', color: 'text-orange-400', bg: 'bg-orange-500/10', border: 'border-orange-500/30' },
        { id: 'Tiktok Shop', name: 'TikTok Shop', icon: 'fa-music', color: 'text-rose-400', bg: 'bg-rose-500/10', border: 'border-rose-500/30' },
        { id: 'Bán Lẻ', name: 'Bán Lẻ Trực Tiếp', icon: 'fa-store', color: 'text-sky-400', bg: 'bg-sky-500/10', border: 'border-sky-500/30' },
        { id: 'Bán Sỉ', name: 'Bán Sỉ Đại Lý', icon: 'fa-boxes-stacked', color: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/30' },
        { id: 'Cộng Tác Viên', name: 'Cộng Tác Viên (CTV)', icon: 'fa-users', color: 'text-purple-400', bg: 'bg-purple-500/10', border: 'border-purple-500/30' },
        { id: 'Xuất Khẩu', name: 'Xuất Khẩu (USD)', icon: 'fa-globe-americas', color: 'text-cyan-400', bg: 'bg-cyan-500/10', border: 'border-cyan-500/30' }
    ];

    // Format tiền tệ
    const formatMoney = (val) => {
        const num = Math.round(Number(val || 0));
        return num.toLocaleString('vi-VN');
    };

    // Danh sách kỳ báo cáo động
    const filterOptions = React.useMemo(() => {
        const currentM = new Date().getMonth() + 1;
        const baseMonths = [];
        for (let m = currentM; m >= 1; m--) {
            baseMonths.push(`Tháng ${m}`);
        }

        const dbPeriods = (erpData?.ProfitReports || [])
            .map(r => String(r.period || '').trim())
            .filter(p => p && p !== 'Năm Nay' && p !== 'Tất Cả');

        const allMonthsSet = new Set([...baseMonths, ...dbPeriods]);
        const sortedMonths = Array.from(allMonthsSet).sort((a, b) => {
            const numA = parseInt(a.replace(/\D/g, '')) || 0;
            const numB = parseInt(b.replace(/\D/g, '')) || 0;
            return numB - numA;
        });

        return [...sortedMonths, 'Năm Nay', 'Tất Cả'];
    }, [erpData?.ProfitReports]);

    const [filter, setFilter] = React.useState(() => `Tháng ${new Date().getMonth() + 1}`);
    const [subTab, setSubTab] = React.useState('STATEMENT'); // 'STATEMENT' | 'DAILY_LEDGER' | 'EDITOR'
    const [selectedChannelTab, setSelectedChannelTab] = React.useState('Shopee VN');
    const [localReports, setLocalReports] = React.useState({}); 
    const [editingReport, setEditingReport] = React.useState(null);
    const [reportForm, setReportForm] = React.useState({});
    const [isSavingAll, setIsSavingAll] = React.useState(false);

    // Side Drawer chi tiết ngày
    const [selectedDayDrawer, setSelectedDayDrawer] = React.useState(null);

    React.useEffect(() => {
        if (erpData?.ProfitReports?.length > 0) {
            const serverMap = {};
            erpData.ProfitReports.forEach(r => { 
                if (r.period && r.channel) { 
                    serverMap[`PROFIT_${r.period}_${r.channel}`] = r; 
                } 
            });
            setLocalReports(prev => ({ ...serverMap, ...prev }));
        }
    }, [erpData?.ProfitReports]);

    // Tính toán tổng hợp số liệu cho từng kênh
    const getAggregatedReport = React.useCallback((channelName) => {
        let agg = { revenue: 0, orderCount: 0, platformFee: 0, returns: 0, discount: 0, ads: 0, cogs: 0, salary: 0, operation: 0 };
        const currentYear = new Date().getFullYear();
        const reportId = `PROFIT_${filter}_${channelName}`;
        
        const saved = localReports[reportId] || (erpData?.ProfitReports || []).find(r => 
            (String(r.period || '').trim() === String(filter || '').trim() && String(r.channel || '').trim() === String(channelName || '').trim()) || 
            String(r.id || '').trim() === reportId
        ) || {};

        const hasSavedData = saved && (
            Number(saved.revenue || 0) > 0 || 
            Number(saved.orderCount || 0) > 0 || 
            Number(saved.cogs || 0) > 0 || 
            Number(saved.platformFee || 0) > 0 ||
            Number(saved.salary || 0) > 0 ||
            Number(saved.operation || 0) > 0 ||
            Number(saved.ads || 0) > 0 ||
            Number(saved.discount || 0) > 0 ||
            Number(saved.returns || 0) > 0
        );

        if (hasSavedData) {
            agg.revenue = Number(saved.revenue || 0);
            agg.orderCount = Number(saved.orderCount || 0);
            agg.platformFee = Number(saved.platformFee || 0);
            agg.returns = Number(saved.returns || 0);
            agg.discount = Number(saved.discount || 0);
            agg.ads = Number(saved.ads || 0);
            agg.cogs = Number(saved.cogs || 0);
            agg.salary = Number(saved.salary || 0);
            agg.operation = Number(saved.operation || 0);
            agg.isLocked = true;
            return agg;
        }

        if (channelName === 'COMPANY_GENERAL') {
            agg.cogs = Number(saved.cogs || 0);
            let dynamicSalary = Number(saved.salary || 0);
            if (dynamicSalary === 0) {
                let targetMonthStr = '';
                const mMatch = filter.match(/\d+/);
                if (mMatch) {
                    const mNum = String(parseInt(mMatch[0], 10)).padStart(2, '0');
                    targetMonthStr = `${currentYear}-${mNum}`;
                }
                if (targetMonthStr) {
                    const allSnaps = (erpData?.Monthly_Snapshots || erpData?.monthlySnapshots || []);
                    const snapSum = allSnaps.filter(s => String(s.month || '').trim() === targetMonthStr).reduce((sum, s) => sum + (Number(s.totalSalary) || 0), 0);
                    if (snapSum > 0) dynamicSalary = snapSum;
                }
            }
            agg.salary = dynamicSalary;
            agg.operation = Number(saved.operation || 0);
            agg.isLocked = false;
            return agg;
        }

        // Quét trực tiếp từ Orders
        let dynamicRev = 0, dynamicRet = 0, dynamicCount = 0;
        const orders = erpData?.Orders || [];

        let filterMonthNum = null;
        if (filter.startsWith('Tháng')) {
            const mMatch = filter.match(/\d+/);
            if (mMatch) filterMonthNum = parseInt(mMatch[0], 10);
        }

        for (let i = 0; i < orders.length; i++) {
            const o = orders[i];
            const rawCh = String(o.channel || '').trim();
            if (rawCh === 'Sản Xuất Tồn' || rawCh === 'Sản Xuất Bù Kho') continue;

            const oDate = new Date(o.date || o.createdAt);
            if (isNaN(oDate.getTime())) continue;

            let isMatch = false;
            if (filterMonthNum !== null) {
                isMatch = (oDate.getMonth() + 1) === filterMonthNum && oDate.getFullYear() === currentYear;
            } else if (filter === 'Năm Nay') {
                isMatch = oDate.getFullYear() === currentYear;
            } else {
                isMatch = true;
            }

            if (isMatch) {
                let ch = String(o.channel || '').trim().toUpperCase();
                let rate = 1;
                let rawVal = Number(String(o.revenue || 0).replace(/[^\d.]/g, '')) || 0;

                if ((ch.includes('USD') || ch.includes('EXPORT')) && rawVal > 0 && rawVal < 10000) {
                    rate = 25500;
                }

                let mappedChannel = 'Bán Lẻ';
                if (ch.includes('XUẤT KHẨU') || ch.includes('USD')) mappedChannel = 'Xuất Khẩu';
                else if (ch.includes('SHOPEE')) mappedChannel = 'Shopee VN';
                else if (ch.includes('TIKTOK')) mappedChannel = 'Tiktok Shop';
                else if (ch.includes('CỘNG TÁC VIÊN') || ch.includes('CTV')) mappedChannel = 'Cộng Tác Viên';
                else if (ch.includes('BÁN SỈ') || ch.includes('SỈ')) mappedChannel = 'Bán Sỉ';
                else if (REPORT_CHANNELS.some(c => c.id === o.channel)) mappedChannel = o.channel;

                if (mappedChannel === channelName) {
                    const status = String(o.status || '').toUpperCase();
                    const val = Math.round(rawVal * rate);
                    if (status === 'ĐƠN HỦY' || status === 'ĐƠN HUỶ') continue;
                    else if (status === 'HÀNG HOÀN') dynamicRet += val;
                    else { dynamicRev += val; dynamicCount++; }
                }
            }
        }

        agg.revenue = dynamicRev;
        agg.returns = dynamicRet;
        agg.orderCount = dynamicCount;
        agg.platformFee = Number(saved.platformFee || 0);
        agg.discount = Number(saved.discount || 0);
        agg.ads = Number(saved.ads || 0);
        agg.cogs = Number(saved.cogs || 0);
        agg.salary = Number(saved.salary || 0);
        agg.operation = Number(saved.operation || 0);
        agg.isLocked = false;

        return agg;
    }, [erpData?.ProfitReports, erpData?.Orders, filter, localReports]);

    // Financial breakdown toàn diện
    const financialStats = React.useMemo(() => {
        let grossSales = 0;
        let totalReturns = 0;
        let totalDiscounts = 0;
        let totalPlatformFees = 0;
        let totalAds = 0;
        let totalOrders = 0;

        REPORT_CHANNELS.forEach(channel => {
            const d = getAggregatedReport(channel.id);
            grossSales += Number(d.revenue || 0);
            totalReturns += Number(d.returns || 0);
            totalDiscounts += Number(d.discount || 0);
            totalPlatformFees += Number(d.platformFee || 0);
            totalAds += Number(d.ads || 0);
            totalOrders += Number(d.orderCount || 0);
        });

        const genData = getAggregatedReport('COMPANY_GENERAL');
        const cogs = Number(genData.cogs || 0);
        const salary = Number(genData.salary || 0);
        const operation = Number(genData.operation || 0);

        const totalDeductions = totalReturns + totalDiscounts;
        const netRevenue = Math.max(0, grossSales - totalDeductions);
        const grossProfit = netRevenue - cogs;
        const operatingExpenses = totalPlatformFees + totalAds + salary + operation;
        const netProfit = grossProfit - operatingExpenses;

        const netMarginOnNet = netRevenue > 0 ? ((netProfit / netRevenue) * 100) : 0;
        const cirAds = netRevenue > 0 ? ((totalAds / netRevenue) * 100) : 0;

        return {
            grossSales,
            totalReturns,
            totalDiscounts,
            totalDeductions,
            netRevenue,
            cogs,
            grossProfit,
            totalPlatformFees,
            totalAds,
            salary,
            operation,
            operatingExpenses,
            netProfit,
            totalOrders,
            netMarginOnNet,
            cirAds
        };
    }, [getAggregatedReport]);

    // Bảng Daily P&L Ledger theo từng ngày
    const dailyLedgerData = React.useMemo(() => {
        const orders = erpData?.Orders || [];
        const txs = erpData?.Transactions || [];

        let filterMonthNum = null;
        const currentYear = new Date().getFullYear();
        if (filter.startsWith('Tháng')) {
            const mMatch = filter.match(/\d+/);
            if (mMatch) filterMonthNum = parseInt(mMatch[0], 10);
        }

        const dayMap = {};

        // Quét đơn
        orders.forEach(o => {
            const dateStr = String(o.date || o.createdAt || '').slice(0, 10);
            if (!dateStr) return;
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return;

            if (filterMonthNum !== null) {
                if (d.getMonth() + 1 !== filterMonthNum || d.getFullYear() !== currentYear) return;
            }

            if (!dayMap[dateStr]) {
                dayMap[dateStr] = {
                    date: dateStr,
                    orderCount: 0,
                    revenue: 0,
                    platformFee: 0,
                    cogs: 0,
                    ads: 0,
                    laborPackaging: 0,
                    returnsCount: 0,
                    ordersList: [],
                    txsList: []
                };
            }

            const st = String(o.status || '').toUpperCase().trim();
            if (st.includes('HỦY') || st.includes('HUỶ') || st === 'CANCELLED') return;

            let rev = Number(String(o.revenue || 0).replace(/[^\d.]/g, '')) || 0;
            let pFee = Number(o.feeFixed || 0) + Number(o.feeService || 0) + Number(o.feePayment || 0) + Number(o.feeAffiliate || 0) + Number(o.tax || 0);
            let cogsVal = Number(o.cogs || 0);

            if (st.includes('HOÀN') && !st.includes('HOÀN THÀNH')) {
                dayMap[dateStr].returnsCount += 1;
            } else {
                dayMap[dateStr].orderCount += 1;
                dayMap[dateStr].revenue += rev;
                dayMap[dateStr].platformFee += pFee;
                dayMap[dateStr].cogs += cogsVal;
                dayMap[dateStr].laborPackaging += 25000;
            }

            dayMap[dateStr].ordersList.push(o);
        });

        // Quét chi phí Ads & Vận hành
        txs.forEach(t => {
            const tDate = String(t.date || t.createdAt || '').slice(0, 10);
            if (!tDate) return;
            const d = new Date(tDate);
            if (isNaN(d.getTime())) return;

            if (filterMonthNum !== null) {
                if (d.getMonth() + 1 !== filterMonthNum || d.getFullYear() !== currentYear) return;
            }

            const amt = Math.abs(Number(t.amount || 0));
            const cat = String(t.category || '').toLowerCase();
            const title = String(t.title || t.note || '').toLowerCase();

            if (!dayMap[tDate]) {
                dayMap[tDate] = {
                    date: tDate,
                    orderCount: 0,
                    revenue: 0,
                    platformFee: 0,
                    cogs: 0,
                    ads: 0,
                    laborPackaging: 0,
                    returnsCount: 0,
                    ordersList: [],
                    txsList: []
                };
            }

            if (cat.includes('quảng cáo') || cat.includes('ads') || title.includes('ads')) {
                dayMap[tDate].ads += amt;
            }

            dayMap[tDate].txsList.push(t);
        });

        const list = Object.values(dayMap).map(row => {
            const netProfit = row.revenue - row.platformFee - row.ads - row.cogs - row.laborPackaging;
            const margin = row.revenue > 0 ? ((netProfit / row.revenue) * 100).toFixed(1) : '0.0';
            const cir = row.revenue > 0 ? ((row.ads / row.revenue) * 100).toFixed(1) : '0.0';
            return {
                ...row,
                netProfit,
                margin,
                cir
            };
        });

        list.sort((a, b) => b.date.localeCompare(a.date));
        return list;
    }, [erpData?.Orders, erpData?.Transactions, filter]);

    // Xử lý Form chỉnh sửa
    const handleEditReport = (channelId) => {
        const reportId = `PROFIT_${filter}_${channelId}`;
        const saved = localReports[reportId] || (erpData?.ProfitReports || []).find(r => 
            (String(r.period || '').trim() === String(filter || '').trim() && String(r.channel || '').trim() === String(channelId || '').trim()) || 
            String(r.id || '').trim() === reportId
        ) || {};
        const agg = getAggregatedReport(channelId);
        setReportForm({ 
            revenue: agg.revenue || 0, 
            orderCount: agg.orderCount || 0, 
            platformFee: saved.platformFee || agg.platformFee || 0, 
            returns: agg.returns || 0, 
            discount: saved.discount || agg.discount || 0, 
            ads: saved.ads || agg.ads || 0, 
            cogs: saved.cogs || agg.cogs || 0, 
            salary: saved.salary || agg.salary || 0, 
            operation: saved.operation || agg.operation || 0 
        });
        setEditingReport(channelId);
    };

    const handleFormChange = React.useCallback((field, value) => { 
        setReportForm(prev => ({ ...prev, [field]: Number(value) || 0 })); 
    }, []);

    const handleSaveReport = async (channelId) => {
        const reportId = `PROFIT_${filter}_${channelId}`;
        try {
            const payload = { 
                id: reportId, 
                period: filter, 
                channel: channelId, 
                ...reportForm, 
                updatedAt: new Date().toISOString() 
            };
            await pushDeltas({ ProfitReports: [payload] }, `Đã lưu số liệu ${channelId} (${filter})`, 'fa-save');
            setLocalReports(prev => ({ ...prev, [reportId]: payload }));
            setEditingReport(null); 
            if (typeof triggerToast === 'function') triggerToast(`Đã lưu báo cáo ${channelId} (${filter})!`, 'fa-check', 'success');
        } catch(e) { 
            if (typeof triggerToast === 'function') triggerToast('Lỗi khi lưu báo cáo!', 'fa-times', 'danger'); 
        }
    };

    // Chốt sổ toàn bộ các kênh
    const handleSaveAllChannels = async () => {
        if (!window.confirm(`Xác nhận chốt sổ & lưu toàn bộ dữ liệu KQKD cho kỳ ${filter}?`)) return;
        setIsSavingAll(true);
        try {
            const allPayloads = [];
            const timestamp = new Date().toISOString();
            
            REPORT_CHANNELS.forEach(c => {
                const reportId = `PROFIT_${filter}_${c.id}`;
                const d = getAggregatedReport(c.id);
                allPayloads.push({
                    id: reportId,
                    period: filter,
                    channel: c.id,
                    revenue: d.revenue || 0,
                    orderCount: d.orderCount || 0,
                    platformFee: d.platformFee || 0,
                    returns: d.returns || 0,
                    discount: d.discount || 0,
                    ads: d.ads || 0,
                    cogs: 0,
                    salary: 0,
                    operation: 0,
                    updatedAt: timestamp
                });
            });

            const genData = getAggregatedReport('COMPANY_GENERAL');
            const genId = `PROFIT_${filter}_COMPANY_GENERAL`;
            allPayloads.push({
                id: genId,
                period: filter,
                channel: 'COMPANY_GENERAL',
                revenue: 0,
                orderCount: 0,
                platformFee: 0,
                returns: 0,
                discount: 0,
                ads: 0,
                cogs: genData.cogs || 0,
                salary: genData.salary || 0,
                operation: genData.operation || 0,
                updatedAt: timestamp
            });

            await pushDeltas({ ProfitReports: allPayloads }, `Đã chốt sổ toàn bộ KQKD (${filter})`, 'fa-check-double');
            
            const updatedMap = { ...localReports };
            allPayloads.forEach(p => updatedMap[p.id] = p);
            setLocalReports(updatedMap);
            if (typeof triggerToast === 'function') triggerToast(`Đã chốt sổ thành công kỳ ${filter}!`, 'fa-check-double', 'success');
        } catch(e) {
            if (typeof triggerToast === 'function') triggerToast('Lỗi khi chốt sổ dữ liệu!', 'fa-exclamation-triangle', 'danger');
        } finally {
            setIsSavingAll(false);
        }
    };

    // Xuất Excel / CSV
    const handleExportExcel = () => {
        let csv = '\uFEFFNgày,Số Đơn,Doanh Thu,Phí Sàn,Chi Phí Ads,CIR (%),Giá Vốn COGS,Công KCS & Bao Bì,Lợi Nhuận Ròng,Biên LN (%)\n';
        dailyLedgerData.forEach(row => {
            csv += `"${row.date}","${row.orderCount}","${row.revenue}","${row.platformFee}","${row.ads}","${row.cir}%","${row.cogs}","${row.laborPackaging}","${row.netProfit}","${row.margin}%"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Bao_Cao_P&L_${filter.replace(/\s+/g, '_')}.csv`;
        link.click();
        if (typeof triggerToast === 'function') triggerToast('Đã xuất file báo cáo Excel!', 'fa-file-excel', 'success');
    };

    // In Báo Cáo A4
    const handlePrint = () => {
        window.print();
    };

    // ==========================================
    // GATEKEEPER CHECK (ĐẶT SAU TẤT CẢ REACT HOOKS)
    // ==========================================
    if (!canViewFinanceReport) {
        return (
            <div className="flex flex-col items-center justify-center min-h-[70vh] text-center p-6 bg-[#09090b]">
                <div className="w-20 h-20 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center mb-5 text-rose-500 text-3xl shadow-sm">
                    <i className="fas fa-lock animate-pulse"></i>
                </div>
                <h2 className="text-xl font-black text-white uppercase tracking-wider mb-2 font-mono">
                    403 TRUY CẬP BỊ TỪ CHỐI
                </h2>
                <p className="text-zinc-400 text-xs max-w-md leading-relaxed font-sans">
                    Báo Cáo Kết Quả Kinh Doanh & P&L chứa thông tin tài chính bảo mật tối cao của xưởng.<br/>
                    Chỉ dành riêng cho <strong className="text-white">Ban Giám Đốc</strong> và <strong className="text-amber-400">Kế Toán Trưởng</strong>.
                </p>
                <div className="mt-5 text-[10px] font-mono text-zinc-600 bg-white/[0.02] px-3 py-1 rounded border border-white/[0.04]">
                    User: {currentUser || 'N/A'} • Role: {currentRole || 'N/A'}
                </div>
            </div>
        );
    }

    return (
        <div className="space-y-4 sm:space-y-5 pb-8 w-full relative bg-[#09090b] text-zinc-100 font-sans">
            
            {/* 1. HEADER & SUB-TABS NAVIGATION */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/[0.06] pb-3.5">
                <div>
                    <div className="flex items-center gap-2">
                        <h1 className="text-xl sm:text-2xl font-black text-white tracking-tight uppercase">
                            Báo Cáo Kết Quả Kinh Doanh (P&L)
                        </h1>

                                        <div className="text-xs font-black font-mono text-amber-400 mt-0.5">
                                            {formatMoney(selectedDayDrawer.ads)}đ
                                        </div>
                                    </div>
                                    <div className="bg-white/[0.02] border border-white/[0.04] p-2.5 rounded-lg">
                                        <div className="text-[9.5px] text-zinc-400 uppercase font-mono">Lợi Nhuận</div>
                                        <div className="text-xs font-black font-mono text-[#d4af37] mt-0.5">
                                            {formatMoney(selectedDayDrawer.netProfit)}đ
                                        </div>
                                    </div>
                                </div>

                                {/* Danh sách đơn hàng trong ngày */}
                                <div className="space-y-3 mb-4">
                                    <div className="text-xs font-black uppercase tracking-wider text-zinc-300 flex items-center justify-between">
                                        <span>Đơn Hàng Trong Ngày ({selectedDayDrawer.ordersList?.length || 0})</span>
                                    </div>
                                    <div className="space-y-1.5 max-h-56 overflow-y-auto custom-scrollbar pr-1">
                                        {(selectedDayDrawer.ordersList || []).map((o, idx) => (
                                            <div key={idx} className="p-2 bg-white/[0.02] border border-white/[0.04] rounded-lg flex items-center justify-between text-xs">
                                                <div className="min-w-0 pr-2">
                                                    <div className="font-bold text-zinc-200 truncate">{o.orderCode || o.id}</div>
                                                    <div className="text-[9.5px] font-mono text-zinc-500">{o.channel} • {o.customer || 'Khách TMĐT'}</div>
                                                </div>
                                                <div className="text-right font-mono font-bold text-emerald-400 text-xs">
                                                    {formatMoney(o.revenue)}đ
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Danh sách phiếu chi phát sinh */}
                                <div className="space-y-3">
                                    <div className="text-xs font-black uppercase tracking-wider text-zinc-300 flex items-center justify-between">
                                        <span>Phiếu Chi / Giao Dịch ({selectedDayDrawer.txsList?.length || 0})</span>
                                    </div>
                                    <div className="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                                        {(selectedDayDrawer.txsList || []).length === 0 ? (
                                            <div className="text-zinc-500 italic text-[11px] py-2">Không có giao dịch sổ quỹ trong ngày.</div>
                                        ) : (
                                            selectedDayDrawer.txsList.map((t, idx) => (
                                                <div key={idx} className="p-2 bg-white/[0.02] border border-white/[0.04] rounded-lg flex items-center justify-between text-xs">
                                                    <div className="min-w-0 pr-2">
                                                        <div className="font-bold text-zinc-200 truncate">{t.title || t.note || 'Chi phí'}</div>
                                                        <div className="text-[9.5px] font-mono text-zinc-500">{t.category}</div>
                                                    </div>
                                                    <div className="text-right font-mono font-bold text-rose-400 text-xs">
                                                        -{formatMoney(t.amount)}đ
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Footer Drawer */}
                            <div className="pt-3 border-t border-white/[0.06] mt-4">
                                <button
                                    onClick={() => setSelectedDayDrawer(null)}
                                    className="w-full py-2 bg-white/[0.06] hover:bg-white/[0.1] text-zinc-300 font-bold text-xs rounded-xl transition-colors cursor-pointer"
                                >
                                    Đóng Chi Tiết
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {/* 5. MODAL SỬA SỐ LIỆU TỪNG KÊNH */}
            {editingReport && (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-xs animate-fade-in" onClick={() => setEditingReport(null)}>
                    <div className="bg-[#121214] border border-white/[0.1] w-full max-w-lg rounded-2xl p-5 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-white/[0.06] pb-3">
                            <h3 className="text-white font-black text-sm uppercase tracking-wider flex items-center gap-2">
                                <i className="fas fa-edit text-[#d4af37]"></i>
                                Điều Chỉnh Số Liệu: {editingReport} ({filter})
                            </h3>
                            <button onClick={() => setEditingReport(null)} className="text-zinc-400 hover:text-white cursor-pointer"><i className="fas fa-times"></i></button>
                        </div>

                        <div className="grid grid-cols-2 gap-3 bg-[#09090b] p-3.5 rounded-xl border border-white/[0.06]">
                            <ReportMetricField label="Doanh thu" field="revenue" value={reportForm.revenue} isEditing={true} onChange={handleFormChange} color="text-emerald-400" />
                            <ReportMetricField label="Số lượng đơn" field="orderCount" value={reportForm.orderCount} isEditing={true} onChange={handleFormChange} color="text-zinc-100" />
                            <ReportMetricField label="Phí sàn" field="platformFee" value={reportForm.platformFee} isEditing={true} onChange={handleFormChange} color="text-rose-400" />
                            <ReportMetricField label="Chi phí Ads" field="ads" value={reportForm.ads} isEditing={true} onChange={handleFormChange} color="text-amber-400" />
                            <ReportMetricField label="Hàng hoàn" field="returns" value={reportForm.returns} isEditing={true} onChange={handleFormChange} color="text-rose-400" />
                            <ReportMetricField label="Chiết khấu" field="discount" value={reportForm.discount} isEditing={true} onChange={handleFormChange} color="text-zinc-400" />
                        </div>

                        <div className="flex items-center justify-end gap-2 pt-1">
                            <button onClick={() => setEditingReport(null)} className="px-3.5 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:bg-[#27272a] transition-colors cursor-pointer">Hủy</button>
                            <button onClick={() => handleSaveReport(editingReport)} className="px-4 py-1.5 rounded-lg text-xs font-black text-black bg-[#d4af37] hover:brightness-110 transition-all cursor-pointer shadow-sm active:scale-95">
                                Lưu Số Liệu
                            </button>
                        </div>
                    </div>
                </div>
            )}

        </div>
    );
});
</script>
