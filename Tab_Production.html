                    };
                    upd.qc_status = (aiKcsResult && (aiKcsResult.erp_qc_status || (aiKcsResult.inspection && mapAiQcStatusToErp(aiKcsResult.inspection.qc_status, aiKcsResult.inspection.passed_kpi)))) || 'Khung đã nộp';
                    upd.qc_note = (aiKcsResult && aiKcsResult.inspection)
                        ? `[AI-KCS ${aiKcsResult.inspection.confidence_score || 0}%]: ${aiKcsResult.inspection.kcs_note || ''}`
                        : (upd.qc_note || '');
                    upd.qc_front_photo = url;
                    upd.status = 'In Progress';

                    if (aiKcsResult && aiKcsResult.inspection && !aiKcsResult.inspection.passed_kpi) {
                        if (typeof window.triggerRealtimeWarRoom === 'function') {
                            window.triggerRealtimeWarRoom(`Khâu 1 của sản phẩm "${item.name}" vừa bị AI KCS từ chối: "${aiKcsResult.inspection.kcs_note || 'Chưa đạt chuẩn'}". Ban Điều Hành hãy cho hướng giải quyết?`);
                        }
                        if (typeof window.openWorkshopAssistant === 'function') {
                            window.openWorkshopAssistant({
                                message: `Khâu 1 của sản phẩm "${item.name}" vừa bị AI KCS báo lỗi: "${aiKcsResult.inspection.kcs_note || ''}". Hướng dẫn tôi cách xử lý khắc phục?`,
                                phase: 'Khâu 1',
                                product: item.name || '',
                                defect: aiKcsResult.inspection.kcs_note || ''
                            });
                        }
                    }
                } else {
                    upd.phases[c.k] = {
                        ...upd.phases[c.k],
                        status: 'Done',
                        user: currentUser,
                        date: currentDateTime.split(' ')[0],
                        start: data.start || currentDateTime,
                        endTime: currentDateTime,
                        photo: url
                    };

                    if (aiKcsResult && aiKcsResult.inspection) {
                        const insp = aiKcsResult.inspection;
                        upd.qc_status = aiKcsResult.erp_qc_status || mapAiQcStatusToErp(insp.qc_status, insp.passed_kpi);
                        upd.qc_note = `[AI-KCS ${insp.confidence_score || 0}%]: ${insp.kcs_note || ''}`;
                        if (insp.passed_kpi) {
                            triggerToast(`✅ AI KCS: Đạt chuẩn (${insp.confidence_score}%)! Đã duyệt tự động.`, 'fa-shield-alt', 'success');
                        } else {
                            triggerToast(`⚠️ AI KCS TỪ CHỐI: ${insp.kcs_note || 'Chưa đạt chuẩn'}`, 'fa-exclamation-triangle', 'warning');
                            if (typeof window.triggerRealtimeWarRoom === 'function') {
                                window.triggerRealtimeWarRoom(`Sản phẩm "${item.name}" bị AI KCS từ chối (${insp.qc_status || 'Need_Repair'}): "${insp.kcs_note || 'Chưa đạt chuẩn'}". Ban Điều Hành chỉ đạo xử lý khẩn cấp!`);
                            }
                            if (typeof window.openWorkshopAssistant === 'function') {
                                window.openWorkshopAssistant({
                                    message: `Sản phẩm "${item.name}" vừa bị AI KCS đánh giá Chưa Đạt (${insp.qc_status || 'Need_Repair'}): "${insp.kcs_note || ''}". Hãy chỉ dẫn tôi cách khắc phục chi tiết?`,
                                    phase: c.n || 'Khâu sản xuất',
                                    product: item.name || '',
                                    defect: insp.kcs_note || ''
                                });
                            }
                        }
                    }

                    // BỂ KÍNH: TỰ ĐỘNG SINH MÃ SERIAL 4 SỐ GÓC ĐÁY BỂ KHI THỢ GỌT KEO (KHÂU 2) HOÀN THÀNH
                    if (isGlassProduct && (c.k === 'phase2' || configs.length === 1)) {
                        let serial = item.serialCode || upd.serialCode;
                        if (!serial) {
                            const rawId = String(item.id || '');
                            const numOnly = rawId.replace(/\D/g, '');
                            const shortDigits = numOnly.length >= 4 ? numOnly.slice(-4) : String(Math.floor(1000 + Math.random() * 9000));
                            serial = '#' + shortDigits;
                        }
                        upd.serialCode = serial;
                    }
                }

                let penaltyPayload = null;
                let payloadDeltas = { prodItems: [upd] };

                let durationMins = 0;
                let isLate = false;
                let slaPenaltyRatio = 0;

                if (upd.phases[c.k].start) {
                    const startMs = parseDateSafe(upd.phases[c.k].start);
                    const endMs = parseDateSafe(currentDateTime);
                    if (!isNaN(startMs) && !isNaN(endMs)) {
                        durationMins = Math.round((endMs - startMs) / 60000);

                        // Anti-cheat (< 2 phút)
                        if (durationMins < 2) {
                            if (!window.confirm(`CẢNH BÁO ANTI-CHEAT: Bạn bấm Hoàn thành khi chưa đủ 2 phút làm việc. Hệ thống sẽ ghi nhận lỗi vi phạm thao tác (phạt 10.000đ). Vẫn tiếp tục?`)) {

                            }
                            penaltyPayload = {
                                id: 'BP_ANTICHEAT_' + Date.now(),

                                type: 'Phạt Vi Phạm',
                                note: `Bấm hoàn thành quá nhanh (< 2 phút) cho khâu ${c.n}`,

                            };

                }
                upd.phases[c.k].reward_vnd = baseReward;

                const p1 = upd.phases['phase1']?.status || 'Pending';
                const p2 = upd.phases['phase2']?.status || 'Pending';
                const isAllDone = isTwoPhaseProduct ? (p1 === 'Done' && p2 === 'Done') : (p1 === 'Done');
                if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';

                if ((c.k === 'phase2' || configs.length === 1) && isAllDone) {

                            body: JSON.stringify({ action: 'deductInventoryBOM', pin: localStorage.getItem('rf_pin'), prodId: upd.id, materialUsageData: finalMatList })
                        }).catch(console.error);
                    } else if (typeof window.runGAS === 'function') {
                        window.runGAS('deductInventoryBOM', { prodId: upd.id, pin: localStorage.getItem('rf_pin'), materialUsageData: finalMatList }).catch(console.error);
                    }
                }

                // GHI NHẬN HỘP ĐEN CỤC BỘ (BLACKBOX LOG) TRÊN MÁY THỢ
                recordWorkerActionLog({
                    user: currentUser,
                    action: 'Chụp ảnh & hoàn thành ' + c.n,
                    phaseKey: c.k,
                    phaseName: c.n,
                    itemId: item.id,

                payloadDeltas.Tracking_Log = [{

                if (isLate || durationMins < 2) {

                // CẢNH BÁO TỒN KHO THÔNG MINH
                if (erpProducts && Array.isArray(erpProducts)) {
                    const sku = String(item.sku || '').trim().toLowerCase();
                    const pName = String(item.name || '').trim().toLowerCase();
                    const matchedProd = erpProducts.find(p =>
                        (sku && String(p.sku).trim().toLowerCase() === sku) ||
                        (pName && String(p.name).trim().toLowerCase() === pName)
                    );
                    if (matchedProd) {
                        const qty = Number(matchedProd.quantity) || 0;
                        const minStk = Number(matchedProd.minStock) || 0;
                        if (qty <= minStk) {
                            setTimeout(() => {
                                triggerToast(`🚨 KHO SẮP CẠN: ${matchedProd.name} (Còn ${qty} - Định mức ${minStk}). Cần bổ sung!`, 'fa-exclamation-triangle', 'danger');
                            }, 1500);
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                triggerToast(`Lỗi tải ảnh!`, 'fa-times', 'danger');
            } finally {
                if (e && e.target) e.target.value = '';
                setProcessing(false);
            }
        };

        // ==========================================
        // CHỐT CHẶN TIỀN TRẠM (PRE-FLIGHT CHECK) KHI HOÀN THÀNH KCS
        // ==========================================
        const checkAndToggleOrderReadiness = async (targetOrder, allProdItems, currentErpProducts) => {
            // Lọc ra toàn bộ các sản phẩm con cùng thuộc đơn hàng gốc này (khớp cả id, orderCode và baseCode)
            const isOrderMatch = (pOrderId, ord) => {
                if (!pOrderId || !ord) return false;
                const pStr = String(pOrderId).trim();
                const oId = String(ord.id || '').trim();
                const oCode = String(ord.orderCode || '').trim();
                const oBase = oCode.split(' | ')[0].split('|')[0].trim();
                return pStr === oId || (oCode && pStr === oCode) || (oBase && pStr === oBase);
            };
            const orderProds = (allProdItems || []).filter(p => isOrderMatch(p.orderId, targetOrder) && !p.fulfilledFromStock);
            const isAllProdDone = orderProds.every(p => {
                if (p.id === item.id) return true;
                const s = String(p.status).toUpperCase().trim();
                return s === 'DONE' || s === 'ĐÃ XONG' || s === 'HỦY/VỠ' || s === 'HOÀN KHO ĐẠT';
            });

            if (isAllProdDone && (targetOrder.status === 'Chờ Sản Xuất' || targetOrder.status === 'Quét Tự Động' || targetOrder.status === 'Đang Sản Xuất')) {
                // Giải mã mảng phụ kiện đi kèm đơn hàng an toàn toàn cục
                let accList = typeof window.safeParseAccessories === 'function'
                    ? window.safeParseAccessories(targetOrder.accessories)
                    : [];

                if (!accList || accList.length === 0) {
                    try { accList = JSON.parse(targetOrder.accessories); } catch (e) { accList = []; }
                }

                let isShortOfAccessories = false;
                let warningDetails = [];

                // Duyệt qua từng phụ kiện để đối soát số lượng tồn kho thực tế (bỏ qua hàng sản xuất Layout/Bể kính)
                accList.forEach(acc => {
                    if (!acc) return;
                    if (acc.hasProduction === true || acc.hasProduction === 'true') return;

                    const aName = String(acc.name || acc.Name || '').trim();
                    if (!aName) return;

                    const cleanAName = aName.toLowerCase().replace(/\s+/g, ' ');
                    const matchProduct = (currentErpProducts || []).find(p => String(p.name || '').trim().toLowerCase().replace(/\s+/g, ' ') === cleanAName);
                    if (matchProduct) {
                        const cat = String(matchProduct.category || '').toUpperCase().trim();
                        const subCat = String(matchProduct.sub_category || '').toUpperCase().trim();
                        if (cat === 'LAYOUT' || cat === 'BỂ KÍNH' || subCat === 'LAYOUT' || subCat === 'BỂ KÍNH') return;

                        const availableQty = Number(matchProduct.quantity) || 0;
                        const requiredQty = Number(acc.quantity || acc.qty) || 1;

                        if (availableQty < requiredQty) {
                            isShortOfAccessories = true;
                            warningDetails.push(`${aName} (Thiếu ${requiredQty - availableQty})`);
                        }
                    }
                });

                let updatedOrder = { ...targetOrder };
                const finalStatus = 'Sẵn Sàng Đóng Gói';
                updatedOrder.status = finalStatus;
                updatedOrder.note = String(updatedOrder.note || '').replace(/\s*\[Cảnh báo: Thiếu phụ kiện đóng gói:[^\]]*\]/g, '').trim();

                await pushDeltas(
                    { orders: [updatedOrder] },
                    `Đơn hàng #${targetOrder.orderCode || targetOrder.id} đã chuyển trạng thái sang: ${finalStatus}`,
                    'fa-check-double'
                );
            }
        };

        const submitQC = async (b64Front) => {
            const targetB64 = b64Front || qcFront;
            if (!targetB64) return;
            setProcessing(true);
            try {
                const urlFront = await runGAS('uploadQCImage', targetB64, `QC_FRONT_${item.id}.jpg`);
                const urlSide = '';
                if (!urlFront) throw new Error("Không thể tải ảnh QC");

                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

                const upd = JSON.parse(JSON.stringify(item));
                upd.phases[c.k].photo = urlFront;
                upd.phases[c.k].endTime = currentDateTime;
                upd.phases[c.k].status = 'Done';

                let payload = { prodItems: [upd] };

                if (c.k === 'phase1' && upd.phases['phase2']) {
                    const p2RawUser = String(upd.phases['phase2'].user || '').trim();
                    if (p2RawUser === 'Kho Hàng' || p2RawUser === 'Hàng') {
                        upd.phases['phase2'].user = '';
                    }
                    if (upd.phases['phase2'].status !== 'Done') {
                        upd.phases['phase2'].status = 'Pending';
                        upd.phases['phase2'].start = '';
                    }
                }

                const p1 = upd.phases['phase1']?.status || 'Pending';
                const p2 = upd.phases['phase2']?.status || 'Pending';
                const isAllDone = (p1 === 'Done' && p2 === 'Done');
                if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';

                if (isAllDone) {
                    upd.status = 'Done';
                    upd.qc_status = 'Đã duyệt';
                    upd.qc_front_photo = urlFront;
                    upd.qc_side_photo = urlSide;
                    // Khấu trừ BOM được giao duy nhất cho backend Code.js (syncDeltas) tự động thực thi khi status = 'Done'

                    if (order && order.id) {
                        await checkAndToggleOrderReadiness(order, prodItems, erpProducts);
                    }
                }

                let msg = `Hoàn thành ${c.n}`;
                let icon = 'fa-check-double';

                await pushDeltas(payload, msg, icon);
                triggerToast(`Hoàn thành ${c.n} thành công!`, 'fa-check', 'success');

                // CẢNH BÁO TỒN KHO THÔNG MINH
                if (erpProducts && Array.isArray(erpProducts)) {
                    const sku = String(item.sku || '').trim().toLowerCase();
                    const pName = String(item.name || '').trim().toLowerCase();
                    const matchedProd = erpProducts.find(p =>
                        (sku && String(p.sku).trim().toLowerCase() === sku) ||
                        (pName && String(p.name).trim().toLowerCase() === pName)
                    );
                    if (matchedProd) {
                        const qty = Number(matchedProd.quantity) || 0;
                        const minStk = Number(matchedProd.minStock) || 0;
                        if (qty <= minStk) {
                            setTimeout(() => {
                                triggerToast(`🚨 KHO SẮP CẠN: ${matchedProd.name} (Còn ${qty} - Định mức ${minStk}). Cần bổ sung!`, 'fa-exclamation-triangle', 'danger');
                            }, 1500);
                        }
                    }
                }
                setQcFront(null); setQcSide(null);
            } catch (err) {
                console.error(err);
                triggerToast(`Lỗi tải ảnh QC!`, 'fa-times', 'danger');
            } finally {
                setProcessing(false);
            }
        };

        const adminAutoPass = async () => {
            setProcessing(true);
            try {
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

                const upd = JSON.parse(JSON.stringify(item));
                upd.phases[c.k] = {
                    ...upd.phases[c.k],
                    status: 'Done',
                    user: currentUser,
                    date: currentDateTime.split(' ')[0],
                    start: data.start || currentDateTime,
                    endTime: currentDateTime,
                    photo: 'AUTO-PASS',
                    adminCompleted: true
                };

                let durationMins = 0;
                if (upd.phases[c.k].start) {
                    const startMs = parseDateSafe(upd.phases[c.k].start);
                    const endMs = parseDateSafe(currentDateTime);
                    if (!isNaN(startMs) && !isNaN(endMs)) {
                        durationMins = Math.round((endMs - startMs) / 60000);
                    }
                }

                upd.phases[c.k].reward_vnd = (item.note === 'Chất Lượng Kém') ? 0 : (kpiData.reward || 0);

                let payloadDeltas = { prodItems: [upd] };

                if (c.k === 'phase1' && upd.phases['phase2']) {
                    const p2RawUser = String(upd.phases['phase2'].user || '').trim();
                    if (p2RawUser === 'Kho Hàng' || p2RawUser === 'Hàng') {
                        upd.phases['phase2'].user = '';
                    }
                    if (upd.phases['phase2'].status !== 'Done') {
                        upd.phases['phase2'].status = 'Pending';
                        upd.phases['phase2'].start = '';
                    }
                }

                const p1 = upd.phases['phase1']?.status || 'Pending';
                const p2 = upd.phases['phase2']?.status || 'Pending';
                const isAllDone = (p1 === 'Done' && p2 === 'Done');
                if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';

                if (isAllDone) {
                    upd.status = 'Done';
                    upd.qc_status = 'Đã duyệt';
                    window.safeFetchJSON(window.SCRIPT_URL || '', {
                        method: 'POST',
                        body: JSON.stringify({ action: 'deductInventoryBOM', pin: localStorage.getItem('rf_pin'), prodId: upd.id })
                    }).catch(console.error);

                    if (order && order.id) {
                        await checkAndToggleOrderReadiness(order, prodItems, erpProducts);
                    }
                }

                await pushDeltas(payloadDeltas, `Auto-Pass khâu ${c.n}`, 'fa-check-double');
                triggerToast(`Đã Auto-Pass thành công!`, 'fa-check', 'success');

                // CẢNH BÁO TỒN KHO THÔNG MINH
                if (erpProducts && Array.isArray(erpProducts)) {
                    const sku = String(item.sku || '').trim().toLowerCase();
                    const pName = String(item.name || '').trim().toLowerCase();
                    const matchedProd = erpProducts.find(p =>
                        (sku && String(p.sku).trim().toLowerCase() === sku) ||
                        (pName && String(p.name).trim().toLowerCase() === pName)
                    );
                    if (matchedProd) {
                        const qty = Number(matchedProd.quantity) || 0;
                        const minStk = Number(matchedProd.minStock) || 0;
                        if (qty <= minStk) {
                            setTimeout(() => {
                                triggerToast(`🚨 KHO SẮP CẠN: ${matchedProd.name} (Còn ${qty} - Định mức ${minStk}). Cần bổ sung!`, 'fa-exclamation-triangle', 'danger');
                            }, 1500);
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                triggerToast(`Lỗi Auto-Pass!`, 'fa-times', 'danger');
            } finally {
                setProcessing(false);
            }
        };

        const userName = effectiveUser ? effectiveUser.split(' ').pop() : 'Chờ nhận việc';
        const phaseAvatar = effectiveUser ?
            <Avatar name={effectiveUser} userConfigs={userConfigs} className="w-[32px] h-[32px] shrink-0 border border-[#333] shadow-sm rounded-full" />
            :
            <div className="w-[32px] h-[32px] rounded-full bg-[#222] border border-[#333] flex items-center justify-center text-gray-500"><i className="fas fa-user text-[14px]"></i></div>;

        return (
            <div className={`w-full py-2.5 rounded-xl px-3 border transition-all flex flex-col gap-1.5 bg-transparent ${isDone
                    ? 'border-emerald-500/30 shadow-sm'
                    : isInProgress
                        ? 'border-blue-500/40 shadow-sm'
                        : 'border-white/[0.05]'
                }`}>
                <div className="flex items-center justify-between w-full">
                    <div className="flex items-center gap-2.5 min-w-0 pr-2">
                        {phaseAvatar}
                        <div className="flex flex-col min-w-0">
                            <div className="flex items-center gap-1.5">
                                <span className={`font-black text-[10px] uppercase tracking-wider flex items-center gap-1 ${isDone
                                        ? 'text-emerald-400'
                                        : isInProgress
                                            ? 'text-blue-400'
                                            : 'text-zinc-400'
                                    }`}>
                                    {isDone && <i className="fas fa-check-circle text-[9px] text-emerald-400"></i>}
                                    {isInProgress && <span className="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>}
                                    {c.n}
                                </span>
                            </div>
                            <div className="flex items-center gap-1.5 relative mt-0.5">
                                {isEditingUser ? (
                                    <select
                                        autoFocus
                                        className="bg-[#141414] text-amber-400 font-bold text-[12px] border border-[#d4af37] rounded outline-none py-0.5 px-1 max-w-[120px]"
                                        defaultValue={effectiveUser}
                                        onChange={(e) => {
                                            const newName = e.target.value;
                                            const upd = JSON.parse(JSON.stringify(item));
                                            const previousRejectedUser = String(item.phases?.phase1?.user || item.p1_user || '').trim();

                                            if (newName === "") {
                                                upd.phases[c.k].user = "";
                                                upd.phases[c.k].status = "Pending";
                                                if (upd.status === "In Progress" && upd.phases[c.k === 'phase1' ? 'phase2' : 'phase1']?.status !== "In Progress") {
                                                    upd.status = "Pending";
                                                }
                                                // Bỏ nhận việc -> xoá ghi chú từ chối khâu 1
                                                upd.note = cleanRejectionNote(upd.note);
                                                upd.qc_status = '';
                                                upd.qc_note = '';
                                            } else {
                                                upd.phases[c.k].user = newName;
                                                // Nếu giao cho nhân sự khác (không phải người vừa bị từ chối khâu 1) -> xoá ghi chú từ chối
                                                if (previousRejectedUser && newName.trim() !== previousRejectedUser) {
                                                    upd.note = cleanRejectionNote(upd.note);
                                                    upd.qc_status = '';
                                                    upd.qc_note = '';
                                                }
                                            }
                                            pushDeltas({ prodItems: [upd] }, 'Đã đổi người nhận việc', 'fa-user-edit');
                                            setIsEditingUser(false);
                                        }}
                                        onBlur={() => setIsEditingUser(false)}
                                        onClick={e => e.stopPropagation()}
                                    >
                                        <option value="">-- Bỏ nhận việc --</option>
                                        {availableWorkers.map(wName => (
                                            <option key={wName} value={wName}>{wName}</option>
                                        ))}
                                    </select>
                                ) : (
                                    <React.Fragment>
                                        <span className={`font-black text-[13px] truncate ${isOwner && !isDone && isInProgress ? 'text-amber-300' : (isDone ? 'text-zinc-200' : 'text-zinc-400')}`}>{userName}</span>
                                        {isAdmin && !isDone && (
                                            <button onClick={(e) => { e.stopPropagation(); setIsEditingUser(true); }} className="w-5 h-5 bg-zinc-800/80 hover:bg-zinc-700 text-zinc-400 hover:text-white rounded flex items-center justify-center transition-colors" title="Giao thợ / Đổi người làm">
                                                <i className="fas fa-pencil-alt text-[8.5px]"></i>
                                            </button>
                                        )}
                                    </React.Fragment>
                                )}
                            </div>
                            {isDone && completedDurationText && (
                                <span className="text-[9px] text-zinc-400 font-bold leading-tight flex items-center flex-wrap gap-1 mt-0.5">
                                    <i className="fas fa-clock text-[8px] text-zinc-500"></i> {completedDurationText}
                                    {data.reward_vnd === 0 ? (
                                        <span className="text-rose-400 font-black ml-1">(Trễ - Cắt Thưởng)</span>
                                    ) : (data.reward_vnd > 0 && (
                                        <span className="text-emerald-400 font-black font-mono ml-0.5">
                                            (+{(localStorage.getItem('rf_role') === 'CTV') ? '***' : data.reward_vnd.toLocaleString()}đ {item.status === 'Done' || String(item.status).toUpperCase() === 'ĐÃ XONG' ? 'Đã duyệt' : 'Tạm tính'})
                                        </span>
                                    ))}
                                </span>
                            )}
                        </div>
                    </div>

                    <div className="shrink-0 w-[130px]">
                        {item.qc_note && (isPending || isInProgress) && (
                            <button onClick={(e) => { e.stopPropagation(); window.dispatchEvent(new CustomEvent('openAnnotationModal', { detail: { item, readOnly: true } })); }} className="w-full py-1.5 mb-1.5 bg-rose-500/15 text-rose-300 border border-rose-500/40 hover:bg-rose-500 hover:text-white rounded-lg font-black text-[10px] uppercase tracking-wider flex justify-center items-center gap-1.5 shadow-sm active:scale-95 transition-all">
                                <i className="fas fa-exclamation-circle text-[11px]"></i> XEM LỖI KCS
                            </button>
                        )}
                        {isPending && !isCTV && (
                            (!effectiveUser || effectiveUser === String(currentUser).trim() || isAdmin) ? (
                                <button onClick={(e) => { e.stopPropagation(); act('In Progress'); }} disabled={processing} className="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-black text-[11px] uppercase tracking-wider active:scale-95 shadow-sm flex justify-center items-center gap-1.5 transition-all">
                                    {processing ? <i className="fas fa-spinner fa-spin text-[14px]"></i> : <><i className="fas fa-play text-[9.5px]"></i> NHẬN LÀM</>}
                                </button>
                            ) : (
                                <div className="w-full py-2 bg-zinc-800/80 text-rose-400 rounded-lg font-black text-[10px] uppercase tracking-wider text-center border border-rose-500/30 flex justify-center items-center gap-1">
                                    <i className="fas fa-lock text-[9px]"></i> KHOÁ: {effectiveUser.split(' ').pop().toUpperCase()}
                                </div>
                            )
                        )}
                        {isPending && isCTV && (
                            <div className="w-full py-2 bg-zinc-900 text-zinc-500 rounded-lg font-bold text-[10px] uppercase tracking-wider text-center border border-zinc-800">CHỜ LÀM</div>
                        )}

                        {isInProgress && isOwner && !isCTV && (
                            c.k === 'phase1' ? (
                                item.qc_status === 'Chờ duyệt khung' ? (
                                    <div className="w-full py-2 bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 rounded-lg text-center font-black text-[10px] uppercase tracking-wider flex items-center justify-center gap-1">
                                        <i className="fas fa-spinner fa-spin text-[10px]"></i> CHỜ DUYỆT KHÂU 1
                                    </div>
                                ) : (
                                    <label onClick={(e) => e.stopPropagation()} className="w-full m-0 py-2 bg-amber-500 hover:bg-amber-400 text-black rounded-lg cursor-pointer flex items-center justify-center active:scale-95 shadow-sm font-black text-[10px] uppercase tracking-wider gap-1.5 transition-all">
                                        {processing ? <i className="fas fa-spinner fa-spin text-[14px]"></i> : <><i className="fas fa-camera text-[12px]"></i> CHỤP/TẢI ẢNH</>}
                                        <input type="file" accept="image/png, image/jpeg, image/jpg" capture="environment" className="hidden" onChange={handlePhotoUpload} disabled={processing} />
                                    </label>
                                )
                            ) : (
                                <div className="flex gap-1.5 w-full">
                                    <label onClick={(e) => e.stopPropagation()} className="flex-1 m-0 py-2 bg-amber-500 hover:bg-amber-400 text-black rounded-lg cursor-pointer flex items-center justify-center active:scale-95 shadow-sm font-black text-[11px] uppercase tracking-wider gap-1.5 transition-all">
                                        {processing ? <i className="fas fa-spinner fa-spin text-[14px]"></i> : <><i className="fas fa-camera text-[12px]"></i> CHỤP ẢNH</>}
                                        <input type="file" accept="image/png, image/jpeg, image/jpg" capture="environment" className="hidden" onChange={handlePhotoUpload} disabled={processing} />
                                    </label>
                                </div>
                            )
                        )}

                        {isInProgress && (!isOwner || isCTV) && (
                            <div className="w-full py-2 bg-zinc-900 text-amber-400 rounded-lg font-black text-[10px] uppercase tracking-wider text-center border border-amber-500/30 flex items-center justify-center gap-1">
                                <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span> ĐANG LÀM
                            </div>
                        )}

                        {isDone && data.photo && (
                            <div className="flex gap-1 w-full">
                                <button onClick={(e) => { e.stopPropagation(); window.dispatchEvent(new CustomEvent('triggerInternalPreview', { detail: data.photo })); }} className="flex-1 py-1.5 bg-zinc-800/90 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 rounded-lg font-black text-[10.5px] flex items-center justify-center shadow-sm gap-1 uppercase active:scale-95 transition-all">
                                    <i className="fas fa-image text-[11px] text-zinc-400"></i> XEM ẢNH
                                </button>
                                {isAdmin && c.k === 'phase1' && (
                                    <button onClick={(e) => {
                                        e.stopPropagation();
                                        const reason = window.prompt('Vị trí/chi tiết cần sửa (để trống nếu không có):');
                                        if (reason !== null) {
                                            const upd = JSON.parse(JSON.stringify(item));
                                            upd.phases[c.k].status = 'Pending';
                                            upd.status = 'Pending';
                                            const prefix = reason.trim() ? `YÊU CẦU LÀM LẠI ${c.n} (Sửa: ${reason.trim()})` : `YÊU CẦU LÀM LẠI ${c.n}`;
                                            upd.note = prefix + (upd.note ? ' | ' + upd.note : '');
                                            pushDeltas({ prodItems: [upd] }, 'Yêu cầu làm lại khâu 1', 'fa-undo');
                                        }
                                    }} className="w-[30px] shrink-0 py-1.5 bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500 hover:text-white rounded-lg flex items-center justify-center text-[10px] shadow-sm uppercase active:scale-95 transition-all" title="Yêu cầu làm lại">
                                        <i className="fas fa-undo"></i>
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>

                {/* Progress Bar đếm ngược khi đang làm việc */}
                {isInProgress && (
                    <div className="w-full border-t border-zinc-900 pt-1.5 mt-1 space-y-1">
                        <div className="flex justify-between items-center text-[9px] font-bold">
                            <span className="text-zinc-500">Định mức: {limitMins} phút</span>
                            <span className={timeColorClass}>{timeText}</span>
                        </div>
                        <div className="w-full bg-zinc-900 rounded-full h-1 overflow-hidden">
                            <div
                                className={`h-full transition-all duration-1000 ${progressPercent > 25 ? 'bg-emerald-500' : (progressPercent > 0 ? 'bg-amber-500' : 'bg-rose-500')
                                    }`}
                                style={{ width: `${progressPercent}%` }}
                            ></div>
                        </div>
                    </div>

    function lookupItemKPI(itemOrName, kpiConfig = [], channel = '') {
        const rawName = typeof itemOrName === 'string' ? itemOrName : (itemOrName?.name || itemOrName?.type || '');
        const nameLower = String(rawName).toLowerCase().trim();
        const isExport = typeof isExportChannel === 'function' ? isExportChannel(channel) : /SG|MY|TH|PH|MA|TW|Quốc Tế|Xuất Khẩu/i.test(channel);
        const mult = isExport ? 3 : 1;

        // 1. Quét tìm trong kpiConfig động từ Google Sheets trước
        let matchedRow = null;
        if (kpiConfig && kpiConfig.length > 0) {
            // A. Khớp chính xác Từ Khoá hoặc Tên Hàng
            matchedRow = kpiConfig.find(row => {
                const sku = String(row['Từ Khoá'] || '').toLowerCase().trim();
                const name = String(row['Tên Hàng'] || '').toLowerCase().trim();
                if (sku && nameLower.includes(sku)) return true;
                if (name && (nameLower === name || nameLower.includes(name))) return true;
                return false;
            });

            // B. Khớp theo Size Layout (Size 20, 30, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150)
            if (!matchedRow) {
                const sizeMatch = nameLower.match(/size\s*(\d{2,3})|(\d{2,3})\s*(cm|x|×|\*|\s|$)/i);
                const size = sizeMatch ? parseInt(sizeMatch[1] || sizeMatch[2]) : 0;
                if (size > 0) {
                    matchedRow = kpiConfig.find(row => {
                        const rowGroup = String(row['Nhóm Hàng'] || '').toUpperCase();
                        const rowName = String(row['Tên Hàng'] || row['Từ Khoá'] || '').toLowerCase();
                        if (rowGroup.includes('BỂ') || rowGroup.includes('KÍNH')) return false;
                        if (size >= 150 && rowName.includes('150')) return true;
                        if (size >= 140 && rowName.includes('140')) return true;
                        if (size >= 130 && rowName.includes('130')) return true;
                        if (size >= 120 && rowName.includes('120')) return true;
                        if (size >= 110 && rowName.includes('110')) return true;
                        if (size >= 100 && rowName.includes('100')) return true;
                        if (size >= 90 && rowName.includes('90')) return true;
                        if (size >= 80 && rowName.includes('80')) return true;
                        if (size >= 70 && rowName.includes('70')) return true;
                        if (size >= 60 && rowName.includes('60')) return true;
                        if (size >= 50 && rowName.includes('50')) return true;
                        if (size >= 40 && rowName.includes('40')) return true;
                        if (size >= 30 && rowName.includes('30')) return true;
                        if (size >= 20 && rowName.includes('20')) return true;
                        return false;
                    });
                }
            }
        }

        if (matchedRow) {
            const isGlass = String(matchedRow['Nhóm Hàng'] || '').toUpperCase().includes('BỂ') || nameLower.includes('bể') || nameLower.includes('terra');
            return {
                p1Name: isGlass ? 'Cắt Dán' : 'Dựng Khung',
                p1Time: Number(matchedRow['Thời gian Khâu 1']) || (isGlass ? 19 : 45),
                p1Reward: (Number(matchedRow['Tiền Khâu 1']) || (isGlass ? 5000 : 14600)) * mult,
                p2Name: isGlass ? 'Gọt Keo' : 'Gia Cố',
                p2Time: Number(matchedRow['Thời gian Khâu 2']) || (isGlass ? 11 : 20),
                p2Reward: (Number(matchedRow['Tiền Khâu 2']) || (isGlass ? 2500 : 7000)) * mult,
                packTime: Number(matchedRow['Thời gian Đóng Gói']) || (isGlass ? 16 : 12),
                packReward: (Number(matchedRow['Thưởng Đóng Gói']) || Number(matchedRow['Tiền Đóng Gói']) || (isGlass ? 1800 : 1400)) * mult
            };
        }

        // 2. Tra cứu từ bảng chuẩn tĩnh (Fallback Table)
        let fb = KPI_FALLBACK_TABLE.find(f => {
            const sku = f.sku.toLowerCase();
            const name = f.name.toLowerCase();
            return nameLower.includes(sku) || nameLower.includes(name);
        });

        if (!fb) {
            const sizeMatch = nameLower.match(/size\s*(\d{2,3})|(\d{2,3})\s*(cm|x|×|\*|\s|$)/i);
            const size = sizeMatch ? parseInt(sizeMatch[1] || sizeMatch[2]) : 0;
            if (size > 0) {
                fb = KPI_FALLBACK_TABLE.filter(f => f.isLayout).reduce((prev, curr) => {
                    return (Math.abs(curr.size - size) < Math.abs(prev.size - size) ? curr : prev);
                }, KPI_FALLBACK_TABLE[1]);
            }
        }

        if (!fb) {
            const isGlass = nameLower.includes('bể') || nameLower.includes('terra') || nameLower.includes('kính');
            fb = isGlass ? KPI_FALLBACK_TABLE[17] : KPI_FALLBACK_TABLE[1]; // BE402020 hoặc LAY-30
        }

        const isGlass = fb.sku.startsWith('BE') || fb.sku.startsWith('BC') || fb.sku.startsWith('TERA') || nameLower.includes('bể');
        return {
            p1Name: isGlass ? 'Cắt Dán' : 'Dựng Khung',
            p1Time: fb.t1,
            p1Reward: fb.r1 * mult,
            p2Name: isGlass ? 'Gọt Keo' : 'Gia Cố',
            p2Time: fb.t2,
            p2Reward: fb.r2 * mult,
            packTime: fb.tp,
            packReward: fb.rp * mult
        };
    }

    // -------------------------------------------------------------------------
    // HÀM TÍNH TOÁN ĐỊNH MỨC VẬT TƯ (BOM) & GIÁ VỐN CHUẨN XÁC THEO 3 ENGINE HỆ THỐNG
    // -------------------------------------------------------------------------
    function getProductBOMAndCosts(item, order, erpProducts = [], kpiConfig = [], erpData = {}) {
        if (!item) return { bomItems: [], totalMaterialCost: 0, p1Reward: 0, p2Reward: 0, packReward: 0, totalLaborCost: 0, totalCOGS: 0, sellingPrice: 0, grossProfit: 0, profitMargin: 0 };

        const prodList = erpProducts || erpData?.Products || [];
        const bomConfigList = erpData?.BOM_Config || [];
        const effectiveKpi = kpiConfig || erpData?.Config_KPI || [];

        // 1. Tìm thông tin sản phẩm trong danh mục Products
        const prodInfo = (prodList || []).find(p =>
            (item.productId && p.id === item.productId) ||
            (p.name && p.name.trim().toLowerCase() === String(item.name || '').trim().toLowerCase())
        ) || {};

        const prodSku = String(prodInfo.sku || item.sku || '').trim().toUpperCase();
        const itemName = String(item.name || prodInfo.name || '').trim();
        const itemNameLower = itemName.toLowerCase();
        const itemTypeUpper = String(item.type || item.category || prodInfo.category || '').toUpperCase();
        const isGlass = itemTypeUpper.includes('BỂ KÍNH') || itemNameLower.includes('bể kính') || itemNameLower.includes('bể');

        let matchedBomRows = [];

        // 2. Tìm trong BOM_Config (khớp SKU, ID hoặc Tên Layout)
        if (bomConfigList.length > 0) {
            matchedBomRows = bomConfigList.filter(b => {
                const bCode = String(b.layoutCode || '').trim();
                const bCodeUpper = bCode.toUpperCase();
                const bCodeLower = bCode.toLowerCase();

                if (b.product_id && item.productId && b.product_id === item.productId) return true;
                if (prodSku && bCodeUpper === prodSku) return true;
                if (prodSku && prodSku.startsWith(bCodeUpper)) return true;
                if (bCodeUpper && prodSku.includes(bCodeUpper)) return true;

                if (bCodeLower && itemNameLower === bCodeLower) return true;
                if (bCodeLower && bCodeLower.length >= 4 && (itemNameLower.includes(bCodeLower) || bCodeLower.includes(itemNameLower))) return true;

                return false;
            });
        }

        let bomItems = [];

        if (matchedBomRows.length > 0) {
            // Có sẵn cấu hình trong BOM_Config
            bomItems = matchedBomRows.map((b, idx) => {
                const matSku = String(b.materialSku || '').trim();
                const matId = b.material_id;
                const mat = typeof findMaterialInProducts === 'function'
                    ? findMaterialInProducts(matSku, matId, prodList)
                    : (prodList || []).find(p => (matId && p.id === matId) || (matSku && String(p.sku || '').trim().toUpperCase() === matSku.toUpperCase()));

                const rawQty = Number(b.defaultQty ?? b.quantity ?? 0);
                const bomUnit = b.unit || mat?.unit || 'cái';

                // Tên BẮT BUỘC chuẩn 100% theo tên trong Kho Nguyên Liệu (Products.name)
                const matDisplayName = mat?.name || matSku || 'Nguyên liệu';
                const matActualSku = mat?.sku || matSku;

                const costCalc = typeof calculateBomItemCost === 'function'
                    ? calculateBomItemCost(mat, rawQty, bomUnit)
                    : { unitPrice: Number(mat?.costPrice || 0), convertedPrice: Number(mat?.costPrice || 0), subTotal: Math.round(rawQty * Number(mat?.costPrice || 0)), conversionNote: '' };

                return {
                    id: b.id || idx,
                    sku: matActualSku,
                    name: matDisplayName,
                    qty: rawQty,
                    unit: bomUnit,
                    costPrice: costCalc.convertedPrice || costCalc.unitPrice || 0,
                    unitPriceDisplay: costCalc.unitPrice || 0,
                    conversionNote: costCalc.conversionNote || '',
                    totalCost: Math.round(costCalc.subTotal || 0)
                };
            });
        } else if (isGlass) {
            // Engine Bể Kính: Phân tích kích thước L x W x H
            const dims = itemName.match(/(\d+)\s*[xX*×]\s*(\d+)\s*[xX*×]\s*(\d+)/);
            let L = 40, W = 20, H = 20;
            if (dims) {
                L = parseFloat(dims[1]);
                W = parseFloat(dims[2]);
                H = parseFloat(dims[3]);
            }

            const areaM2 = Number((((L * W) + 2 * (L * H) + 2 * (W * H)) / 10000 * 1.1).toFixed(4));
            const perimeterM = Number(((2 * (L + W)) / 100).toFixed(2));
            const priceGlassM2 = 180000;
            const costGlass = Math.round(areaM2 * priceGlassM2);
            const costGrinding = Math.round(perimeterM * 25000);
            const glueQty = Number((((L + W + H) / 100) * 0.15).toFixed(2));
            const costGlue = Math.round(glueQty * 65000);

            bomItems = [
                {
                    sku: 'NLSX-KINH-5LI',
                    name: `Kính Siêu Trong 5li (${L}x${W}x${H}cm)`,
                    qty: areaM2,
                    unit: 'm²',
                    costPrice: priceGlassM2,
                    totalCost: costGlass
                },
                {

            if (rawBaseName) {
                match = prodList.find(x => {
                    const xBase = norm(String(x.name || '').split(' - ')[0].split('–')[0].split('—')[0]);
                    const xNorm = norm(x.name);
                    return (xBase === rawBaseName || xNorm === rawBaseName) && (x.image || x.realImage);
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            const verMatch = normRaw.match(/ver\s*(\d+)/);
            if (verMatch && verMatch[1]) {
                const targetVer = `ver${verMatch[1]}`;
                match = prodList.find(x => {
                    const xNorm = norm(x.name);
                    return xNorm.includes(targetVer) && (x.image || x.realImage);
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            if (normRaw.length >= 3) {
                const sorted = [...prodList].filter(x => x.image || x.realImage).sort((a, b) => (b.name || '').length - (a.name || '').length);
                match = sorted.find(x => {
                    const xNorm = norm(x.name);
                    const xBase = norm(String(x.name || '').split(' - ')[0].split('–')[0].split('—')[0]);
                    if (rawBaseName && rawBaseName.includes('ver') && !xBase.includes('ver')) return false;
                    return xNorm && xNorm.length >= 3 && (normRaw.includes(xNorm) || xNorm.includes(normRaw));
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            const finalFallback = match || prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower) || null;
            if (finalFallback) {
                return { ...finalFallback, image: fmtImg(finalFallback.image || finalFallback.realImage), realImage: fmtImg(finalFallback.realImage || finalFallback.image) };
            }
            return null;
        };

        const productInfo = getProductInfoSmart(_item.name) || {};

        let displayCoverImage = _item.realCoverImage;
        let rawNote = String(_item.note || '');
        if (!displayCoverImage) {
            const match = rawNote.match(/\|\s*Cover:\s*(https?:\/\/[^\s|]+)/i);
            if (match && match[1]) {
                displayCoverImage = match[1];
            }
        }
        const realImage = displayCoverImage || productInfo.realImage || productInfo.image;
        const productImage = displayCoverImage || productInfo.image || productInfo.realImage;
        const rawItemOrder = String(_item.orderId || '').trim();
        const oCode = (order && order.orderCode) 
            ? (order.orderCode.split(' | MVĐ: ')[0].split(' | ')[0] || order.orderCode) 
            : (rawItemOrder && rawItemOrder !== 'SẢN XUẤT TỒN' ? rawItemOrder : 'LỆNH SẢN XUẤT');
        const isBuKho = order.channel === 'Sản Xuất Bù Kho' || order.channel === 'Sản Xuất Tồn' || _item.fulfilledFromStock;

        const p1Status = _item.phases?.phase1?.status || 'Pending';
        const p2Status = _item.phases?.phase2?.status || 'Pending';
        const isAnyInProgress = p1Status === 'In Progress' || p2Status === 'In Progress';
        const isPhase2Pending = p1Status === 'Done' && p2Status === 'Pending' && _item.status !== 'Done' && _item.status !== 'Đã Huỷ' && _item.qc_status !== 'Yêu cầu làm lại' && _item.qc_status !== 'Need_Repair';
        const isReadyForInspection = _item.status === 'Kiểm Định' || (p1Status === 'Done' && p2Status === 'Done' && _item.status !== 'Done' && _item.status !== 'Đã Huỷ');

        const isBothDone = (p1Status === 'Done' && p2Status === 'Done');
        const isItemDone = (isBothDone && (_item.status === 'Done' || String(_item.status).toUpperCase() === 'ĐÃ XONG')) || ((_item.fulfilledFromStock === true || String(_item.fulfilledFromStock).toUpperCase() === 'TRUE') && !String(_item.note || '').toLowerCase().includes('kho âm'));
        const noteStr = String(_item.note || '').toUpperCase();
        const qcStatusStr = String(_item.qc_status || '').toUpperCase();
        const isRejected = noteStr.includes('CHẤT LƯỢNG KÉM') ||
            noteStr.includes('TỪ CHỐI') ||
            noteStr.includes('LÀM LẠI') ||
            qcStatusStr.includes('TỪ CHỐI') ||
            qcStatusStr.includes('LÀM LẠI');

        const assignedUser = (_item.phases?.phase1?.user || _item.phases?.phase2?.user || '').trim();

        const cleanItemNote = (note) => {
            if (!note) return '';
            let n = String(note);
            const p1User = String(_item.phases?.phase1?.user || _item.p1_user || '').trim();
            // Nếu khâu 1 đang chờ nhận việc -> bỏ ghi chú từ chối
            if (!p1User) {
                n = n.split(' | ')
                    .filter(part => {
                        const p = part.trim().toUpperCase();
                        return !p.startsWith('TỪ CHỐI KHUNG') &&
                            !p.startsWith('YÊU CẦU LÀM LẠI') &&
                            !p.startsWith('TỪ CHỐI') &&
                            !p.includes('BÁO LỖI KHUNG');
                    })
                    .join(' | ');
            }
            n = n.replace(/Sản xuất bù kho cho đơn \S+ \(Tự động bốc từ kho tồn\)/gi, '');
            n = n.replace(/\|?\s*\[TỰ ĐỘNG BÙ KHO\] Trả hàng cho đơn \S+/gi, '');
            n = n.replace(/\[TỰ ĐỘNG BÙ KHO\] Trả hàng cho đơn \S+/gi, '');
            n = n.replace(/SẢN XUẤT MỚI CHO ĐƠN \S+/gi, '');
            n = n.replace(/SẢN XUẤT BÙ KHO CHO ĐƠN \S+/gi, '');
            n = n.replace(/\|\s*Cover:\s*https?:\/\/[^\s|]+/gi, '');
            // Bỏ chuỗi dạng "Tên SP | MVĐ: SPX... (Cái 1/1)"
            n = n.replace(/[^|]*\|\s*MVĐ:\s*[A-Za-z0-9]+(?:\s*\(Cái\s*\d+\/\d+\))?/gi, '');

            // Nếu lệnh chưa xong (đang chờ làm / kiểm định), triệt tiêu các nhãn tồn kho tự sinh gây hiểu lầm
            if (!isItemDone) {
                n = n.replace(/\|?\s*Lấy từ tồn kho có sẵn/gi, '');
                n = n.replace(/Lấy từ tồn kho có sẵn\s*\|?/gi, '');
                n = n.replace(/\|?\s*Có sẵn ở kho[^|]*/gi, '');
                n = n.replace(/Có sẵn ở kho[^|]*\|?/gi, '');
                n = n.replace(/\|?\s*Sản xuất BỂ LẺ SIZE cho đơn [^|]*/gi, '');
                n = n.replace(/Sản xuất BỂ LẺ SIZE cho đơn [^|]*\|?/gi, '');
                n = n.replace(/\|?\s*Sản xuất ĐƠN XUẤT KHẨU [^|]*/gi, '');
                n = n.replace(/Sản xuất ĐƠN XUẤT KHẨU [^|]*\|?/gi, '');
            }

            n = n.replace(/^\|\s*/, '');
            n = n.replace(/\s*\|$/, '');
            return n.trim();
        };

        const cleanOrderNote = (note) => {
            if (!note) return '';
            return String(note).replace(/\|?\s*Link Bill Cọc:.*$/, '').trim();
        };

        const isStockAvailable = (erpProducts || []).some(prd => prd.name === _item.name && Number(prd.quantity || 0) > 0);
        const isStock = (_item.fulfilledFromStock === true || String(_item.fulfilledFromStock).toUpperCase() === 'TRUE') && isStockAvailable;

        return (
            <React.Fragment>
                <div className={`rf-card relative transition-all duration-200 rounded-2xl overflow-hidden bg-[#121214] ${
                        isUrgent
                            ? 'border-2 border-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.35)] animate-pulse'
                            : isItemDone
                            ? 'border border-emerald-500/30 hover:border-emerald-500/50'
                            : isRejected
                                ? 'border border-rose-500/50 hover:border-rose-500/70 shadow-lg'
                                : isReadyForInspection
                                    ? 'border border-indigo-500/40 hover:border-indigo-500/60 shadow-lg'
                                    : isAnyInProgress
                                        ? 'border border-blue-500/40 hover:border-blue-500/60 shadow-lg'
                                        : isPhase2Pending
                                            ? 'border border-emerald-500/40 hover:border-emerald-500/60 shadow-lg'
                                            : 'border border-white/[0.08] hover:border-white/[0.14] shadow-sm'
                    }`}>
                    <div className="flex flex-col w-full cursor-pointer relative p-3" onClick={() => setIsExpanded(!isExpanded)}>

                        {/* HUY HIỆU HỎA TỐC / ƯU TIÊN LÀM NGAY NỔI BẬT (BẤM ĐỂ TẮT) */}
                        {isUrgent && (
                            <div 
                                onClick={handleToggleUrgent}
                                className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-rose-500/20 border border-rose-500/50 text-rose-400 text-[12px] font-black uppercase tracking-wider mb-2 animate-bounce w-fit cursor-pointer hover:bg-rose-500/30 transition-colors shadow-sm"
                                title="Đang bật HỎA TỐC — Bấm vào đây hoặc nút ⚡ để tắt ưu tiên"
                            >
                                <span>🔥 ƯU TIÊN LÀM NGAY</span>
                                <span className="text-[10px] text-rose-300/80 font-normal ml-1">(Bấm để tắt)</span>
                            </div>
                        )}

                        {/* === KHU VỰC 1: HEADER TRÊN CÙNG (GIỐNG TAB ĐƠN HÀNG) === */}
                        <div className="flex items-center justify-between gap-2 mb-2.5 w-full">
                            {/* Left: Checkbox + Kênh Bán + Mã Đơn + Hạn SLA + Tag Trạng Thái */}
                            <div className="flex items-center gap-1.5 flex-wrap min-w-0">
                                {/* CHECKBOX CHỌN HÀNG LOẠT (QUYỀN QUẢN LÝ) */}
                                {(localStorage.getItem('rf_role') === 'QUẢN LÝ SẢN XUẤT' || localStorage.getItem('rf_role') === 'QUẢN LÝ KHO VẬN' || localStorage.getItem('rf_role') === 'TỐI CAO') && toggleSelectProd && (
                                    <div onClick={e => e.stopPropagation()} className="shrink-0 mr-0.5">
                                        <input
                                            type="checkbox"
                                            checked={selectedProdIds && selectedProdIds.includes(_item.id)}
                                            onChange={(e) => { e.stopPropagation(); toggleSelectProd(_item.id); }}
                                            className="w-4 h-4 accent-rose-500 rounded cursor-pointer border border-[#333] shadow-sm hover:scale-110 transition-transform bg-[#1a1a1a]"
                                            title="Chọn lệnh để xoá"
                                        />
                                    </div>
                                )}

                                {(() => {
                                    const resolveItemChannelTag = () => {
                                        if (order?.channel && order.channel !== 'KHÁC') return order.channel;
                                        if (order?.channel === 'KHÁC') return 'XUẤT KHẨU';
                                        const rawOrd = String(_item.orderId || '');
                                        const rawN = String(_item.note || '').toUpperCase();
                                        if (rawOrd === 'SẢN XUẤT TỒN' || rawN.includes('TỰ ĐỘNG TẠO LỆNH BÙ KHO') || rawN.includes('SẢN XUẤT TỒN')) return 'SẢN XUẤT TỒN';
                                        if (rawN.includes('TIKTOK') || rawOrd.includes('TT')) return 'TikTok Shop';
                                        if (rawN.includes('SHOPEE') || rawN.includes('SPX') || rawOrd.includes('SPX')) return 'Shopee VN';
                                        return order?.channel || 'SẢN XUẤT';
                                    };
                                    const channelTag = resolveItemChannelTag();
                                    const chBadgeClass = typeof getChannelBadge === 'function' ? getChannelBadge(channelTag) : 'bg-[#f97316] text-black font-black border border-[#ea580c] shadow-sm';
                                    return (
                                        <span className={`text-[8.5px] font-black px-2 py-0.5 rounded border uppercase tracking-wider shadow-sm truncate flex items-center gap-1 shrink-0 ${chBadgeClass}`}>
                                            {channelTag}
                                        </span>
                                    );
                                })()}
                                <span className="text-[10.5px] font-black text-gray-300 truncate uppercase font-mono">{oCode}</span>

                                {/* HẠN BÀN GIAO NẰM CẠNH MÃ ĐƠN HÀNG */}
                                {_item.deadline && (
                                    <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase shadow-sm flex items-center gap-1 shrink-0 ${new Date(_item.deadline) < new Date()
                                        ? 'bg-rose-500/20 text-rose-300 border-rose-500/30'
                                        : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
                                        }`}>
                                        <i className="fas fa-clock text-[8px]"></i> HẠN: {String(_item.deadline).replace('T', ' ').slice(0, 16)}
                                    </span>
                                )}

                                {/* TAG TRẠNG THÁI GIAI ĐOẠN TINH TẾ (LÀM NỔI BẬT KHÂU ĐANG LÀM GÌ) */}
                                {isItemDone ? (
                                    <span className="text-[8.5px] font-black px-2 py-0.5 bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 rounded-md uppercase tracking-wider flex items-center gap-1 shrink-0">
                                        <i className="fas fa-check-circle text-[9px] text-emerald-400"></i> {(_item.fulfilledFromStock === true || String(_item.fulfilledFromStock).toUpperCase() === 'TRUE') ? 'ĐÃ LẤY TỪ KHO' : 'ĐẠT KCS'}
                                    </span>
                                ) : isRejected ? (
                                    <span className="text-[8.5px] font-black px-2 py-0.5 bg-rose-500/20 text-rose-300 border border-rose-500/40 rounded-md uppercase tracking-wider flex items-center gap-1 shrink-0">
                                        <span className="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span> YÊU CẦU LÀM LẠI
                                    </span>
                                ) : isAnyInProgress ? (
                                    (() => {
                                        const activeP = p1Status === 'In Progress' ? (configs[0]?.n || 'Khâu 1') : (configs[1]?.n || 'Khâu 2');
                                        const activeWorker = p1Status === 'In Progress' ? _item.phases?.phase1?.user : _item.phases?.phase2?.user;
                                        return (
                                            <span className="text-[8.5px] font-black px-2 py-0.5 bg-blue-500/15 text-blue-300 border border-blue-500/30 rounded-md uppercase tracking-wider flex items-center gap-1 shrink-0">
                                                <span className="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span> ĐANG LÀM: {activeP.toUpperCase()}{activeWorker ? ` (${activeWorker.split(' ').pop().toUpperCase()})` : ''}
                                            </span>
                                        );
                                    })()
                                ) : isPhase2Pending ? (
                                    (() => {
                                        const p2Name = configs[1]?.n || 'Khâu 2';
                                        return (
                                            <span className="text-[8.5px] font-black px-2 py-0.5 bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 rounded-md uppercase tracking-wider flex items-center gap-1 shrink-0">
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> CHỜ {p2Name.toUpperCase()}
                                            </span>
                                        );
                                    })()
                                ) : (_item.qc_status === 'Chờ duyệt khung' || _item.qc_status === 'Khung đã nộp') ? (
                                    <span className="text-[8.5px] font-black px-2 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 rounded-md uppercase tracking-wider flex items-center gap-1 shrink-0">
                                        <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span> CHỜ DUYỆT KHÂU 1
                                    </span>
                                ) : (
                                    <span className="text-[8.5px] font-bold px-2 py-0.5 bg-zinc-800 text-zinc-400 border border-zinc-700/60 rounded-md uppercase tracking-wider flex items-center gap-1 shrink-0">
                                        <span className="w-1.5 h-1.5 rounded-full bg-zinc-500"></span> CHỜ NHẬN VIỆC
                                    </span>
                                )}

                                {_item.assignee && (
                                    <span className="text-[8.5px] font-black px-2 py-0.5 bg-amber-500/15 text-amber-300 border border-amber-500/30 rounded-md uppercase tracking-wider flex items-center gap-1 shrink-0 shadow-sm" title={`Lệnh sản xuất chỉ định riêng cho ${_item.assignee}`}>
                                        <i className="fas fa-lock text-[8.5px] text-amber-400"></i> CHỈ ĐỊNH: {_item.assignee}
                                    </span>
                                )}
                            </div>

                            {/* Right: CỤM NÚT THAO TÁC CỐ ĐỊNH (ACTION BUTTON STRIP) */}
                            <div className="flex items-center gap-1 shrink-0 z-30" onClick={e => e.stopPropagation()}>
                                {/* NÚT BẬT/TẮT HỎA TỐC ⚡ (1-CHẠM ĐỒNG BỘ 2 CHIỀU) */}
                                <button
                                    type="button"
                                    onClick={handleToggleUrgent}
                                    className={`w-6 h-6 rounded flex items-center justify-center transition-all shadow-sm active:scale-95 cursor-pointer border ${
                                        isUrgent
                                            ? 'text-amber-400 drop-shadow-[0_0_8px_rgba(251,191,36,0.6)] bg-amber-400/20 border-amber-400/40'
                                            : 'text-zinc-500 hover:text-amber-400 bg-black/40 border-white/10'
                                    }`}
                                    title={isUrgent ? "Đang bật HỎA TỐC (Bấm để tắt)" : "Bật HỎA TỐC / Ưu tiên làm ngay"}
                                >
                                    <i className="fas fa-bolt text-[10px]"></i>
                                </button>

                                {/* NÚT THẢ XUỐNG XEM ĐỊNH MỨC VẬT TƯ (BOM) & GIÁ VỐN */}
                                <button
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        setShowBOMDrawer(prev => !prev);
                                    }}
                                    className={`h-6 px-2 rounded flex items-center justify-center gap-1 transition-all shadow-sm text-[9.5px] font-black uppercase tracking-wider active:scale-95 cursor-pointer border ${showBOMDrawer
                                            ? 'bg-indigo-600 text-white border-indigo-400 shadow-md shadow-indigo-500/30'
                                            : 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30 hover:bg-indigo-500 hover:text-white'
                                        }`}
                                    title="Bấm để mở/đóng danh sách định mức vật tư và giá vốn"
                                >
                                    <i className="fas fa-layer-group text-[10px]"></i>
                                    <span className="hidden sm:inline">Định Mức</span>
                                    <i className={`fas fa-chevron-${showBOMDrawer ? 'up' : 'down'} text-[8px] ml-0.5`}></i>
                                </button>

                                {realImage && (
                                    <button onClick={(e) => {
                                        e.stopPropagation();
                                        const m3d = getModelForProduct(_item.productId);
                                        if (m3d && m3d.url) {
                                            setPreview3DUrl(m3d.url);
                                        } else {
                                            setPreviewImg(realImage);
                                        }
                                    }} className="w-6 h-6 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500 hover:text-black rounded flex items-center justify-center transition-colors shadow-sm active:scale-95 cursor-pointer" title="Xem ảnh thật/mẫu 3D">
                                        <i className="fas fa-camera text-[10px]"></i>
                                    </button>
                                )}

                                {(localStorage.getItem('rf_role') === 'QUẢN LÝ SẢN XUẤT' || localStorage.getItem('rf_role') === 'QUẢN LÝ KHO VẬN' || localStorage.getItem('rf_role') === 'TỐI CAO') && onEditItem && (
                                    <button onClick={(e) => { e.stopPropagation(); onEditItem(_item); }} className="w-6 h-6 bg-[#1a1a1a] text-[#d4af37] border border-[#333] hover:border-[#d4af37]/50 rounded flex items-center justify-center transition-colors shadow-sm active:scale-95 cursor-pointer" title="Sửa lệnh">
                                        <i className="fas fa-edit text-[10px]"></i>
                                    </button>
                                )}

                                {/* NÚT HUỶ / XOÁ LỆNH TÍCH HỢP TẠI ĐÂY */}
                                {((isBossRole || isAdmin || userRole === 'QUẢN LÝ SẢN XUẤT' || userRole === 'QUẢN LÝ KHO' || userRole === 'QUẢN LÝ KHO VẬN' || userRole === 'TỐI CAO' || (_item.orderId === 'SẢN XUẤT TỒN' || String(_item.note || '').includes('tự động tạo lệnh bù kho'))) && _item.status !== 'Đã Huỷ') && (
                                    <button
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            if (window.confirm("Bạn có chắc chắn muốn huỷ/xoá lệnh sản xuất này?")) {
                                                if (_item.orderId === 'SẢN XUẤT TỒN' || String(_item.note || '').includes('tự động tạo lệnh bù kho')) {
                                                    const upd = { ..._item, status: 'Đã Huỷ' };
                                                    wrappedPushDeltas({ prodItems: [upd] }, 'Huỷ lệnh kho dư thừa', 'fa-trash');
                                                } else {
                                                    const parentOrder = (order && order.id) ? order : (typeof getParentOrder === 'function' ? getParentOrder(_item.orderId) : null);
                                                    const payload = { deletes: { prodItems: [_item.id] } };

                                                    if (parentOrder && parentOrder.id) {
                                                        const shouldCancelOrder = window.confirm(
                                                            "Lệnh này thuộc đơn hàng [" + (parentOrder.orderCode || parentOrder.id) + "].\n\n" +
                                                            "- Bấm OK: HUỶ LUÔN ĐƠN HÀNG này.\n" +
                                                            "- Bấm CANCEL: Giữ đơn và chuyển về CHỜ SẢN XUẤT (để tạo lại lệnh mới)."
                                                        );
                                                        if (shouldCancelOrder) {
                                                            payload.orders = [{ ...parentOrder, status: 'Đơn Huỷ' }];
                                                        } else {
                                                            payload.orders = [{ ...parentOrder, status: 'Chờ Sản Xuất', hasProduction: true }];
                                                        }
                                                    }
                                                    wrappedPushDeltas(payload, 'Đã xoá lệnh sản xuất & đồng bộ đơn hàng', 'fa-trash');
                                                }
                                            }
                                        }}
                                        className="w-6 h-6 bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500 hover:text-white rounded flex items-center justify-center transition-all shadow-sm active:scale-95 cursor-pointer"
                                        title="Huỷ/Xoá lệnh này"
                                    >
                                        <i className="fas fa-trash-alt text-[10px]"></i>
                                    </button>
                                )}

                                {/* NÚT THU GỌN / MỞ RỘNG THẺ */}
                                <button
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        setIsExpanded(prev => !prev);
                                    }}
                                    className="w-6 h-6 bg-zinc-800/60 hover:bg-zinc-700 text-zinc-400 hover:text-zinc-200 border border-zinc-700/50 rounded flex items-center justify-center transition-all shadow-sm active:scale-95 cursor-pointer"
                                    title={isExpanded ? 'Thu gọn thẻ' : 'Mở rộng thẻ'}
                                >
                                    <i className={`fas fa-chevron-${isExpanded ? 'up' : 'down'} text-[9px]`}></i>
                                </button>
                            </div>

    const ProductionTab = React.memo(function ProductionTab({ attendance, orders, prodItems, packings, erpProducts, currentUser, userRole: propUserRole, hasPerm: propHasPerm, pushDeltas, userConfigs, triggerToast, kpiConfig, erpData, models3D, documents }) {

        const outOfStockCount = React.useMemo(() => {

        const isAdmin = isBossRole || ['QUẢN LÝ SẢN XUẤT', 'QUẢN LÝ KHO', 'QUẢN LÝ KHO VẬN', 'ADMIN', 'FOUNDER'].includes(userRole);

        const isCTV = localStorage.getItem('rf_role') === 'CTV';
        const checkTimeFilter = (dateStr, filterStr, customM) => {
            if (!dateStr) return false;
            const d = new Date(dateStr);
            const today = new Date();
            if (filterStr === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            if (filterStr === 'Tháng Trước') {
                const lastMonth = new Date(today);
                lastMonth.setMonth(lastMonth.getMonth() - 1);
                return d.getMonth() === lastMonth.getMonth() && d.getFullYear() === lastMonth.getFullYear();
            }
            if (filterStr === 'Chọn Tháng') {
                if (!customM) return true;
                const [year, month] = customM.split('-');
                return d.getFullYear() === parseInt(year, 10) && d.getMonth() === (parseInt(month, 10) - 1);
            }
            return true;
        };

        const orderMap = React.useMemo(() => {
            const map = {};
            (orders || []).forEach(o => {
                if (!o) return;
                if (o.id) map[o.id] = o;
                if (o.orderCode) {
                    map[o.orderCode] = o;
                    const cleanCode = String(o.orderCode).split(' | ')[0].split('|')[0].trim();
                    if (cleanCode) map[cleanCode] = o;
                }
            });
            return map;
        }, [orders]);

        const getParentOrder = React.useCallback((orderId) => {
            if (!orderId) return {};
            if (orderMap[orderId]) return orderMap[orderId];
            
            const raw = String(orderId).trim();
            const clean = raw.split('_')[0].trim();
            if (clean && clean !== 'ORD' && clean !== 'PROD' && clean.length > 3 && orderMap[clean]) {
                return orderMap[clean];
            }
            
            // Xử lý các tiền tố ORD_timestamp_index: dò theo ORD_timestamp
            const underParts = raw.split('_');
            if (underParts.length >= 3 && underParts[0] === 'ORD') {
                const baseTimestampId = underParts[0] + '_' + underParts[1];
                if (orderMap[baseTimestampId]) return orderMap[baseTimestampId];
            }

            const codeParts = raw.split('|').map(x => x.trim());
            for (let part of codeParts) {
                if (orderMap[part]) return orderMap[part];
                const sub = part.split('_')[0].trim();
                if (sub && sub !== 'ORD' && sub !== 'PROD' && sub.length > 3 && orderMap[sub]) {
                    return orderMap[sub];
                }
            }

            // Dò tìm vét cạn trong orders và GLOBAL_ALL_ORDERS
            const allOrderSources = [
                ...(orders || []),
                ...(typeof window !== 'undefined' ? (window.GLOBAL_ALL_ORDERS || window.ALL_ORDERS || []) : [])

            const foundDirect = allOrderSources.find(o => o && (String(o.id).trim() === raw || String(o.orderCode).trim() === raw || (o.orderCode && String(o.orderCode).includes(raw))));
            if (foundDirect) return foundDirect;

            return {};
        }, [orderMap, orders]);

        const baseFiltered = React.useMemo(() => {
            return (prodItems || []).filter(i => {
                if (!i || i.orderId === 'SHARED_TASK' || i.orderId === 'REMINDER' || i.orderId === 'MATERIAL_REQ' || i.type === 'Báo Nhập Hàng' || String(i.id || '').startsWith('MAT_REQ_') || String(i.name || '').includes('[DANH MỤC SẢN XUẤT]')) return false;
                const o = getParentOrder(i.orderId);
                const isCtvOrder = String(o.channel || '').toUpperCase().includes('CỘNG TÁC VIÊN') || String(o.channel || '').toUpperCase() === 'CTV';
                if (isCTV && o.createdBy !== currentUser && o.sale !== currentUser && o.responsibleUser !== currentUser && !isCtvOrder) return false;

                if (deferredSearchQuery) {
                    const q = deferredSearchQuery.toLowerCase();

                    const matchOrder = String(o.orderCode || '').toLowerCase().includes(q);

                const deadlineStr = i.deadline || o.createdAt || o.date;

                if (filterTime === 'Tháng Này' && !isTimeMatch) {
                    const statusUpper = String(i.status || '').toUpperCase();
                    const isFinished = statusUpper === 'DONE' || statusUpper === 'ĐÃ XONG' || statusUpper === 'ĐÃ HUỶ' || statusUpper === 'CANCEL' || statusUpper === 'HUỶ' || statusUpper === 'HỦY' || statusUpper === 'HOÀN KHO ĐẠT';
                    // Lệnh CHƯA HOÀN THÀNH (Đang chờ sản xuất / Kiểm định) bắt buộc luôn hiển thị trên xưởng để thợ làm, kể cả hạn rơi vào đầu tháng sau hoặc tháng trước tồn sang

        const countBeKinh = baseFiltered.filter(i => {
            const searchStr = String(i.type || '') + ' ' + String(i.name || '');

                const searchStr = String(i.type || '') + ' ' + String(i.name || '');
                const isG = searchStr.toLowerCase().includes('bể');

                if (typeTab === 'Bể Kính' && !isG) return false;
                if (typeTab === 'Layout' && isG) return false;
                return true;

        }, [baseFiltered, typeTab]);

        const listWithStatus = typeFiltered.map(i => {
            let curSt = 'CHỜ SẢN XUẤT';

            const p2 = i.phases?.phase2?.status || 'Pending';
