    // Dynamic accounts list
    const accountsData = React.useMemo(() => {
        let accs = [...(erpData?.Accounts || [])];
        Object.values(localAccounts).forEach(localAcc => {
            if (!accs.find(a => a.id === localAcc.id)) accs.push(localAcc);
        });
        return accs.map(acc => { 
            const cached = localAccounts[acc.id]; 
            return cached ? { ...acc, ...cached } : acc; 
        });
    }, [erpData?.Accounts, localAccounts]);

    // Helper kiểm tra giao dịch điều chỉnh số dư kỹ thuật
    const isAdjustmentTx = React.useCallback((t) => {
        if (!t) return false;
        const cat = String(t.category || '').toLowerCase();
        const title = String(t.title || '').toLowerCase();
        const note = String(t.note || '').toLowerCase();
        const id = String(t.id || '');
        return id.startsWith('TX_ADJ_') || 
               cat.includes('điều chỉnh') || 
               cat.includes('cân đối') || 
               title.includes('điều chỉnh số dư') || 
               note.includes('điều chỉnh số dư') ||
               note.includes('sinh phiếu điều chỉnh');
    }, []);

    // Helper bóc tách tên đối tác / người nhận / người gửi thông minh
    const formatTxDisplayTitle = React.useCallback((t) => {
        if (!t) return '';
        let title = String(t.title || '').trim();
        const note = String(t.note || '').trim();
        
        // Nếu title bị ngắn dạng MB, SMB, ke toan hoặc rỗng
        if (!title || title === 'MB' || title === 'SMB' || title.toLowerCase() === 'ke toan' || title.length <= 3) {
            // 1. Pattern MB-TKThe <number>_<NAME>, tai <Bank>
            const m1 = note.match(/(?:MB-)?TKThe\s+[^_]*_([^,]+?)(?:,\s*tai|\.|\s*$)/i);
            if (m1 && m1[1] && isNaN(Number(m1[1]))) {
                return `Người nhận: ${m1[1].trim()}`;
            }
            // 2. Pattern SMB-TkThe :<acc>, tai <bank>. <content>
            const m2 = note.match(/SMB-TkThe\s*:[^,]+,\s*tai\s+[^.]+\.\s*([^;.\-]+)/i);
            if (m2 && m2[1] && m2[1].trim()) {
                return m2[1].trim().slice(0, 50);
            }
            // 3. Customer name via @VA_
            const m3 = note.match(/@VA_[^_]+_HO KINH DOANH RICHFISH AQUARIUM_([^_@]+)/i);
            if (m3 && m3[1]) {
                return `Khách: ${m3[1].trim()}`;
            }
            // 4. Pattern NGUYEN NGOC TIEN Chuyen tien <content>
            if (note.includes('NGUYEN NGOC TIEN Chuyen tien')) {
                const parts = note.split('NGUYEN NGOC TIEN Chuyen tien');
                if (parts[1] && parts[1].trim()) return parts[1].split('-')[0].trim().slice(0, 45);
            }
            // 5. Pattern HO KINH DOANH RICHFISH AQUARIUM Chuyen tien <content>
            if (note.includes('HO KINH DOANH RICHFISH AQUARIUM Chuyen tien')) {
                const parts = note.split('HO KINH DOANH RICHFISH AQUARIUM Chuyen tien');
                if (parts[1] && parts[1].trim()) return parts[1].split('-')[0].trim().slice(0, 45);
            }
        }
        return title || 'Giao dịch không tên';
    }, []);

    // Helper sao chép nội dung giao dịch 1-click
    const handleCopyNote = React.useCallback((text, txId, e) => {
        if (e) e.stopPropagation();
        if (!text) return;
        const content = String(text).trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(content).then(() => {
                setCopiedTxId(txId);
                setTimeout(() => setCopiedTxId(null), 2000);
            }).catch(() => {});
        } else {
            try {
                const ta = document.createElement('textarea');
                ta.value = content;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                setCopiedTxId(txId);
                setTimeout(() => setCopiedTxId(null), 2000);
            } catch (err) {}
        }
    }, []);

    // All transactions combined & chronologically sorted
    const allTxs = React.useMemo(() => {
        const serverTxs = erpData?.Transactions || []; 
        const merged = [...serverTxs];
        localTxs.forEach(ltx => { 
            if (!merged.find(s => s.id === ltx.id)) merged.push(ltx); 
        });
        return merged.sort((a, b) => parseTxTimestamp(b) - parseTxTimestamp(a));
    }, [erpData?.Transactions, localTxs]);

    // Time window calculation
    const timeRange = React.useMemo(() => {
        const today = new Date();
        if (filterTime === 'Hôm Nay') {
            const start = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 0, 0, 0, 0).getTime();
            const end = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 23, 59, 59, 999).getTime();
            return { start, end };
        }
        if (filterTime === '7 Ngày Qua') {
            const end = today.getTime();
            const start = end - (7 * 24 * 60 * 60 * 1000);
            return { start, end };
        }
        if (filterTime === 'Tháng Này') {
            const start = new Date(today.getFullYear(), today.getMonth(), 1).getTime();
            const end = new Date(today.getFullYear(), today.getMonth() + 1, 0, 23, 59, 59, 999).getTime();
            return { start, end };
        }
        if (filterTime === 'Tháng Trước') {
            const start = new Date(today.getFullYear(), today.getMonth() - 1, 1).getTime();
            const end = new Date(today.getFullYear(), today.getMonth(), 0, 23, 59, 59, 999).getTime();
            return { start, end };
        }
        if (filterTime === 'Chọn Tháng' && customMonth) {
            const [year, month] = customMonth.split('-');
            const y = parseInt(year, 10);
            const m = parseInt(month, 10) - 1;
            const start = new Date(y, m, 1).getTime();
            const end = new Date(y, m + 1, 0, 23, 59, 59, 999).getTime();
            return { start, end };
        }
        return null; // All
    }, [filterTime, customMonth]);

    // Bảng tính toán Quỹ Đầu Kỳ, Thu, Chi, Chuyển và Quỹ Cuối Kỳ chuẩn kế toán
    const accountPeriodStats = React.useMemo(() => {
        const accStats = {};
        accountsData.forEach(a => {
            accStats[a.id] = {
                id: a.id,
                name: parseAccountInfo(a).name,
                type: parseAccountInfo(a).type,
                number: parseAccountInfo(a).number,
                owner: parseAccountInfo(a).owner,
                currentBalance: Number(a.balance || 0),
                inflow: 0,
                outflow: 0,
                transferIn: 0,
                transferOut: 0,
                adjIn: 0,
                adjOut: 0,
                afterDelta: 0,
                inPeriodDelta: 0
            };
        });

        let totalAfterDelta = 0;
        let totalInPeriodDelta = 0;
        let totalInflow = 0;
        let totalOutflow = 0;
        let totalTransfer = 0;

        const getAccStatBucket = (accRef) => {
            if (!accRef) return null;
            if (accStats[accRef]) return accStats[accRef];
            const resolved = resolveAccount(accRef, accountsData);
            if (resolved && accStats[resolved.id]) return accStats[resolved.id];
            return null;
        };

        allTxs.forEach(t => {
            const amt = Number(t.amount || 0);
            const ts = parseTxTimestamp(t);
            const isAdj = isAdjustmentTx(t);
            const isAfter = timeRange ? (ts > timeRange.end) : false;
            const isInPeriod = timeRange ? (ts >= timeRange.start && ts <= timeRange.end) : true;
            const toBucket = getAccStatBucket(t.toAccount);
            const fromBucket = getAccStatBucket(t.fromAccount);

            if (t.type === 'Thu') {
                if (isAfter) totalAfterDelta += amt;
                if (isInPeriod) {
                    totalInPeriodDelta += amt;
                    if (!isAdj) totalInflow += amt;
                }
                if (toBucket) {
                    if (isAfter) toBucket.afterDelta += amt;
                    if (isInPeriod) {
                        toBucket.inPeriodDelta += amt;
                        if (!isAdj) toBucket.inflow += amt;
                        else toBucket.adjIn += amt;
                    }
                }
            } else if (t.type === 'Chi') {
                if (isAfter) totalAfterDelta -= amt;
                if (isInPeriod) {
                    totalInPeriodDelta -= amt;
                    if (!isAdj) totalOutflow += amt;
                }
                if (fromBucket) {
                    if (isAfter) fromBucket.afterDelta -= amt;
                    if (isInPeriod) {
                        fromBucket.inPeriodDelta -= amt;
                        if (!isAdj) fromBucket.outflow += amt;
                        else fromBucket.adjOut += amt;
                    }
                }
            } else if (t.type === 'Chuyển') {
                if (isInPeriod) totalTransfer += amt;
                if (fromBucket) {
                    if (isAfter) fromBucket.afterDelta -= amt;
                    if (isInPeriod) {
                        fromBucket.inPeriodDelta -= amt;
                        fromBucket.transferOut += amt;
                    }
                }
                if (toBucket) {
                    if (isAfter) toBucket.afterDelta += amt;
                    if (isInPeriod) {
                        toBucket.inPeriodDelta += amt;
                        toBucket.transferIn += amt;
                    }
                }
            }
        });

        const byAccount = {};
        let sumAccountCurrent = 0;
        accountsData.forEach(a => {
            const s = accStats[a.id];
            sumAccountCurrent += s.currentBalance;
            const endingBalance = s.currentBalance - s.afterDelta;
            const openingBalance = endingBalance - s.inPeriodDelta;

            s.endingBalance = endingBalance;
            s.openingBalance = openingBalance;
            s.netChange = endingBalance - openingBalance;

            byAccount[a.id] = s;
        });

        // Nếu đang chọn lọc 1 tài khoản/quỹ cụ thể
        if (filterAccount !== 'ALL' && byAccount[filterAccount]) {
            const sel = byAccount[filterAccount];
            return {
                byAccount,
                totalOpening: sel.openingBalance,
                totalEnding: sel.endingBalance,
                totalInflow: sel.inflow,
                totalOutflow: sel.outflow,
                totalTransfer: sel.transferIn,
                netCashflow: sel.inflow - sel.outflow,
                selectedAccountName: sel.name
            };
        }

        // Nếu xem Tất Cả Quỹ
        const totalEnding = sumAccountCurrent - totalAfterDelta;
        const totalOpening = totalEnding - totalInPeriodDelta;

        return {
            byAccount,
            totalOpening,
            totalEnding,
            totalInflow,
            totalOutflow,
            totalTransfer,
            netCashflow: totalInflow - totalOutflow,
            selectedAccountName: 'Tất Cả Quỹ'
        };
    }, [accountsData, allTxs, timeRange, filterAccount, isAdjustmentTx]);

    // Base Time & Account Filtered List
    const basePeriodTxs = React.useMemo(() => {
        return allTxs.filter(t => {
            if (timeRange) {
                const ts = parseTxTimestamp(t);
                if (ts < timeRange.start || ts > timeRange.end) return false;
            }
            if (filterAccount !== 'ALL') {
                const targetAcc = accountsData.find(a => a.id === filterAccount);
                const isFromMatch = t.fromAccount === filterAccount || (targetAcc && isAccountMatch(t.fromAccount, targetAcc));
                const isToMatch = t.toAccount === filterAccount || (targetAcc && isAccountMatch(t.toAccount, targetAcc));
                if (!isFromMatch && !isToMatch) return false;
            }
            return true;
        });
    }, [allTxs, timeRange, filterAccount, accountsData]);

    // Filtered transaction list based on Quick Filter (Thu / Chi / Chuyển / Điều Chỉnh)
    const filteredTxs = React.useMemo(() => {
        return basePeriodTxs.filter(t => {
            if (filterTxType === 'THU') return t.type === 'Thu' && !isAdjustmentTx(t);
            if (filterTxType === 'CHI') return t.type === 'Chi' && !isAdjustmentTx(t);
            if (filterTxType === 'CHUYEN') return t.type === 'Chuyển';
            if (filterTxType === 'DIEU_CHINH') return isAdjustmentTx(t);
            return true;
        });
    }, [basePeriodTxs, filterTxType, isAdjustmentTx]);

    // Running balances computed in single pass
    const txBalances = React.useMemo(() => {
        let running = {};
        accountsData.forEach(a => running[a.id] = Number(a.balance) || 0);
        const balances = {};

        allTxs.forEach(t => {
            const amt = Number(t.amount || 0);
            const fromId = resolveAccountId(t.fromAccount, accountsData);
            const toId = resolveAccountId(t.toAccount, accountsData);

            balances[t.id] = {
                from: fromId ? (running[fromId] != null ? running[fromId] : null) : null,
                to: toId ? (running[toId] != null ? running[toId] : null) : null
            };
            if (t.type === 'Thu') {
                if (toId && running[toId] != null) running[toId] -= amt;
            } else if (t.type === 'Chi') {
                if (fromId && running[fromId] != null) running[fromId] += amt;
            } else if (t.type === 'Chuyển') {
                if (fromId && running[fromId] != null) running[fromId] += amt;
                if (toId && running[toId] != null) running[toId] -= amt;
            }
        });
        return balances;
    }, [allTxs, accountsData]);

    // Financial summaries
    const { totalThu, totalChi, countThu, countChi, countChuyen, countAdj } = React.useMemo(() => {
        let thu = 0, chi = 0, cThu = 0, cChi = 0, cChuyen = 0, cAdj = 0;
        basePeriodTxs.forEach(t => {
            const isAdj = isAdjustmentTx(t);
            if (isAdj) {
                cAdj++;
                return;
            }

            const amt = Number(t.amount || 0);
            if (t.type === 'Thu') {
                thu += amt;
                cThu++;
            } else if (t.type === 'Chi') {
                chi += amt;
                cChi++;
            } else if (t.type === 'Chuyển') {
                cChuyen++;
            }
        });
        return { totalThu: thu, totalChi: chi, countThu: cThu, countChi: cChi, countChuyen: cChuyen, countAdj: cAdj };
    }, [basePeriodTxs, isAdjustmentTx]);

    const totalDebtSuppliers = React.useMemo(() => {
        return (erpData?.Suppliers || []).reduce((s, x) => s + (Number(x.totalDebt) || 0), 0);
    }, [erpData?.Suppliers]);

    const selectedTotalAmount = React.useMemo(() => {
        return allTxs.filter(t => selectedTxIds.has(t.id)).reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
    }, [allTxs, selectedTxIds]);

    // Batch Action Handlers
    const handleToggleSelectTx = React.useCallback((id, e) => {
        if (e) e.stopPropagation();
        setSelectedTxIds(prev => {
            const next = new Set(prev);
            if (next.has(id)) next.delete(id);
            else next.add(id);
            return next;
        });
    }, []);

    const handleSelectAllVisible = React.useCallback(() => {
        const visibleTxs = filteredTxs.slice(0, displayLimit);
        const allSelected = visibleTxs.length > 0 && visibleTxs.every(t => selectedTxIds.has(t.id));
        if (allSelected) {
            setSelectedTxIds(new Set());
        } else {
            const next = new Set(selectedTxIds);
            visibleTxs.forEach(t => next.add(t.id));
            setSelectedTxIds(next);
        }
    }, [filteredTxs, displayLimit, selectedTxIds]);

    const handleClearSelection = React.useCallback(() => {
        setSelectedTxIds(new Set());
    }, []);

    const handleBatchDeleteTxs = async () => {
        if (selectedTxIds.size === 0) return;
        const count = selectedTxIds.size;
        if (!window.confirm(`XÁC NHẬN XOÁ HÀNG LOẠT:\n\nBạn có chắc chắn muốn xoá ${count} giao dịch đã chọn?\nSố dư các tài khoản quỹ liên quan sẽ được tự động hoàn lại tương ứng.`)) return;

        const txsToDelete = allTxs.filter(t => selectedTxIds.has(t.id));
        let updatedAccsMap = {};
        const getAcc = (id) => {
            if (!id) return null;
            let found = updatedAccsMap[id] || accountsData.find(a => a.id === id);
            return found ? { ...found } : null;
        };

        txsToDelete.forEach(t => {
            const amt = Number(t.amount || 0);
            if (t.fromAccount) {
                let acc = getAcc(t.fromAccount);
                if (acc) { acc.balance = Number(acc.balance) + amt; updatedAccsMap[acc.id] = acc; }
            }
            if (t.toAccount) {
                let acc = getAcc(t.toAccount);
                if (acc) { acc.balance = Number(acc.balance) - amt; updatedAccsMap[acc.id] = acc; }
            }
        });

        const deleteIds = Array.from(selectedTxIds);
        let payload = { 
            deletes: { Transactions: deleteIds }, 
            Accounts: Object.values(updatedAccsMap) 
        };

        if (payload.Accounts.length > 0) {
            const newLocal = { ...localAccounts };
            payload.Accounts.forEach(u => newLocal[u.id] = u);
            setLocalAccounts(newLocal);
        }
        setLocalTxs(prev => prev.filter(tx => !selectedTxIds.has(tx.id)));
        setSelectedTxIds(new Set());

        await pushDeltas(payload, `Đã xoá ${count} giao dịch và hoàn số dư quỹ!`, 'fa-trash');
    };

    const handleBatchAssignCategory = async (newCategory) => {
        if (selectedTxIds.size === 0 || !newCategory) return;
        const count = selectedTxIds.size;
        const txsToUpdate = allTxs.filter(t => selectedTxIds.has(t.id)).map(t => ({
            ...t,
            category: newCategory
        }));

        let payload = { Transactions: txsToUpdate };

        setLocalTxs(prev => prev.map(t => {
            if (selectedTxIds.has(t.id)) {
                return { ...t, category: newCategory };
            }
            return t;
        }));

        setShowBatchCategoryModal(false);
        setSelectedTxIds(new Set());
        await pushDeltas(payload, `Đã phân bổ danh mục "${newCategory}" cho ${count} giao dịch!`, 'fa-tags');
    };

    // Handlers
    const handleOpenAddTx = () => {
        const stored = getStoredCategories();
        setEditingTxData({
            type: 'Chi',
            category: stored.CHI?.[0]?.value || 'Chi Phí Khác',
            amount: '',
            title: '',
            note: '',
            fromAccount: accountsData[0]?.id || '',
            toAccount: '',
            date: new Date().toISOString().slice(0, 10),
            time: formatTime24h()
        });
        setShowAddTx(true);
    };

    const handleReceiptScanned = (scanned) => {
        setEditingTxData({
            type: 'Chi',
            category: scanned.category || 'Chi Phí Khác',
            amount: scanned.amount ? String(scanned.amount) : '',
            title: scanned.title || 'Chi chuyển khoản',
            note: scanned.note || '',
            fromAccount: scanned.accId || accountsData[0]?.id || '',
            toAccount: '',
            date: scanned.date || new Date().toISOString().slice(0, 10),
            time: scanned.time || formatTime24h(),
            proofImage: scanned.proofImage
        });
        setShowReceiptScanner(false);
        setShowAddTx(true);
    };

    const handleSaveTx = async (formData) => {
        const amt = Number(String(formData.amount).replace(/[^0-9]/g, ''));
        if (!amt || !formData.title?.trim()) {
            return triggerToast('Vui lòng điền đủ Số tiền và Tiêu đề!', 'fa-exclamation', 'warning');
        }
        if (formData.type !== 'Thu' && !formData.fromAccount) {
            return triggerToast('Vui lòng chọn Từ tài khoản!', 'fa-exclamation', 'warning');
        }
        if (formData.type !== 'Chi' && !formData.toAccount) {
            return triggerToast('Vui lòng chọn Đến tài khoản!', 'fa-exclamation', 'warning');
        }

        setIsSavingTx(true);
        try {
            const isEdit = !!formData.id;
            const oldTx = isEdit ? allTxs.find(t => t.id === formData.id) : null;

            const formattedTime = formatTime24h(formData.time);
            const dateWithTime = formData.date ? `${formData.date} ${formattedTime}` : new Date().toISOString();

            const newTx = { 
                id: isEdit ? formData.id : 'TX_' + Date.now(), 
                type: formData.type, 
                category: formData.category, 
                amount: amt, 
                title: formData.title.trim(), 
                date: dateWithTime, 
                time: formattedTime, 
                note: formData.note || '', 
                proofImage: formData.proofImage || null,
                fromAccount: formData.type !== 'Thu' ? formData.fromAccount : '',
                toAccount: formData.type !== 'Chi' ? formData.toAccount : '',
                isAuto: formData.isAuto || false
            };
            
            let payload = { Transactions: [newTx] };
            let updatedAccsMap = {};
            const getAcc = (id) => {
                if (!id) return null;
                let found = updatedAccsMap[id] || accountsData.find(a => a.id === id);
                return found ? { ...found } : null;
            };

            if (oldTx) {
                if (oldTx.fromAccount) { 
                    let acc = getAcc(oldTx.fromAccount); 
                    if (acc) { acc.balance = Number(acc.balance) + Number(oldTx.amount); updatedAccsMap[acc.id] = acc; } 
                }
                if (oldTx.toAccount) { 
                    let acc = getAcc(oldTx.toAccount); 
                    if (acc) { acc.balance = Number(acc.balance) - Number(oldTx.amount); updatedAccsMap[acc.id] = acc; } 
                }
            }

            if (newTx.fromAccount) { 
                let acc = getAcc(newTx.fromAccount); 
                if (acc) { acc.balance = Number(acc.balance) - Number(newTx.amount); updatedAccsMap[acc.id] = acc; } 
            }
            if (newTx.toAccount) { 
                let acc = getAcc(newTx.toAccount); 
                if (acc) { acc.balance = Number(acc.balance) + Number(newTx.amount); updatedAccsMap[acc.id] = acc; } 
            }

            payload.Accounts = Object.values(updatedAccsMap);

            // Snapshot để rollback nếu server từ chối ghi (chống tạo phiếu ảo / ghost transaction)
            const prevTxsSnapshot = [...localTxs];
            const prevAccsSnapshot = { ...localAccounts };

            if (isEdit) setLocalTxs(prev => prev.map(t => t.id === newTx.id ? newTx : t));
            else setLocalTxs(prev => [newTx, ...prev]);

            if (payload.Accounts.length > 0) {
                const newLocal = { ...localAccounts };
                payload.Accounts.forEach(u => newLocal[u.id] = u);
                setLocalAccounts(newLocal);
            }

            const res = await pushDeltas(payload, isEdit ? `Đã cập nhật phiếu thành công!` : `Đã thêm giao dịch!`, 'fa-check-circle');
            if (res && res.success === false) {
                // Rollback lại state cũ để điện thoại không bị lưu phiếu rác khi máy tính không có
                setLocalTxs(prevTxsSnapshot);
                setLocalAccounts(prevAccsSnapshot);
                return;
            }

            setShowAddTx(false);
            setEditingTxData(null);
        } catch(e) {
            triggerToast('Lỗi khi lưu giao dịch!', 'fa-times', 'danger');
        } finally {
            setIsSavingTx(false);
        }
    };

    const handleDeleteTx = (t) => {
        if (!window.confirm('Xoá giao dịch này? Số dư tài khoản sẽ được hoàn lại tương ứng.')) return;
        
        let payload = { deletes: { Transactions: [t.id] }, Accounts: [] };
        let updatedAccsMap = {};
        const getAcc = (id) => {
            if (!id) return null;
            let found = updatedAccsMap[id] || accountsData.find(a => a.id === id);
            return found ? { ...found } : null;
        };

        if (t.fromAccount) { 
            let acc = getAcc(t.fromAccount); 
            if (acc) { acc.balance = Number(acc.balance) + Number(t.amount); updatedAccsMap[acc.id] = acc; } 
        }
        if (t.toAccount) { 
            let acc = getAcc(t.toAccount); 
            if (acc) { acc.balance = Number(acc.balance) - Number(t.amount); updatedAccsMap[acc.id] = acc; } 
        }
        payload.Accounts = Object.values(updatedAccsMap);
        
        if (payload.Accounts.length > 0) {
            const newLocal = { ...localAccounts };
            payload.Accounts.forEach(u => newLocal[u.id] = u);
            setLocalAccounts(newLocal);
        }
        setLocalTxs(prev => prev.filter(tx => tx.id !== t.id));
        
        pushDeltas(payload, 'Đã xoá giao dịch và hoàn số dư!', 'fa-trash');
    };

    const handleSaveAccount = async (payload) => {
        try { 
            const newAcc = payload.Accounts[0];
            setLocalAccounts(prev => ({ ...prev, [newAcc.id]: newAcc }));
            await pushDeltas(payload, editingAccount ? 'Cập nhật quỹ thành công!' : 'Tạo quỹ thành công!', 'fa-check'); 
            setShowAccountModal(false); 
            setEditingAccount(null);
        } catch(e) { 
            triggerToast('Lỗi khi lưu quỹ', 'fa-times', 'danger'); 
        }
    };

    const handlePrintK58 = (tx) => {

        if (tx.type === 'Thu') accDisplay = getAccountDisplayName(tx.toAccount, accountsData);
        else if (tx.type === 'Chi') accDisplay = getAccountDisplayName(tx.fromAccount, accountsData);

        const printWin = window.open('', '', 'width=350,height=600');

    const handleExportExcel = () => {
        if (typeof exportToExcel !== 'function') return triggerToast('Tính năng xuất Excel chưa sẵn sàng!', 'fa-info', 'warning');
        const columns = [
            { key: 'date', label: 'Ngày GD' },
            { key: 'time', label: 'Giờ (24h)' },

                <div className="space-y-3.5 animate-fade-in w-full">
                    {/* BẢNG TỔNG HỢP ĐẦU KỲ / BIẾN ĐỘNG / CUỐI KỲ */}
                    <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-2 bg-[#121216] border border-white/[0.08] p-3.5 rounded-3xl shadow-sm">
                        <div>
                            <h3 className="font-black text-[13.5px] text-zinc-100 uppercase tracking-wider">Danh Sách Quỹ & Quỹ Đầu Kỳ</h3>
                            <p className="text-[10.5px] text-zinc-400 font-medium">Bảng theo dõi số dư ban đầu, phát sinh thu chi và tồn quỹ thực tế ({filterTime})</p>
                        </div>

                        {canManageFinance && (
                            <button 
                                onClick={() => { setEditingAccount(null); setShowAccountModal(true); }} 
                                className="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-zinc-950 text-[11px] font-black px-4 py-2.5 rounded-xl shadow-md shadow-amber-950/40 transition-all cursor-pointer flex items-center justify-center gap-1.5 shrink-0 uppercase tracking-wider active:scale-95"
                            >
                                <i className="fas fa-plus text-xs"></i>
                                <span>Thêm Quỹ Mới</span>
                            </button>
                        )}
                    </div>

                    {/* LƯỚI THẺ TÀI KHOẢN CHUẨN KẾ TOÁN */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
                        {accountsData.map(a => {
                            const parsed = parseAccountInfo(a);
                            const visuals = getBankVisuals(parsed.name, parsed.type);
                            const accStat = accountPeriodStats.byAccount[a.id] || {
                                openingBalance: Number(a.balance || 0),
                                endingBalance: Number(a.balance || 0),
                                inflow: 0,
                                outflow: 0,
                                transferIn: 0,
                                transferOut: 0
                            };

                            return (
                                <div key={a.id} className="bg-[#121216] border border-white/[0.08] p-4 rounded-3xl flex flex-col justify-between shadow-sm hover:border-zinc-700 transition-all group relative overflow-hidden">
                                    <div className="flex items-start justify-between mb-3">
                                        <div className={`w-11 h-11 rounded-2xl ${visuals.bg} border ${visuals.border} flex items-center justify-center ${visuals.color} text-lg shrink-0 shadow-inner`}>
                                            <i className={`fas ${visuals.icon}`}></i>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-[9px] font-extrabold text-zinc-400 uppercase tracking-wider block mb-0.5">Số Dư Sổ Sách (Cuối Kỳ)</span>
                                            <span className="text-[17px] sm:text-[19px] font-mono font-black text-amber-300">{secureMoney(accStat.endingBalance)}đ</span>
                                        </div>
                                    </div>

                                    <div className="mb-3">
                                        <h4 className="font-black text-[14px] text-zinc-100 truncate mb-1">{parsed.name}</h4>
                                        {parsed.type !== 'Tiền mặt' ? (
                                            <div className="text-[11px] font-mono text-zinc-400 flex items-center gap-2 flex-wrap">
                                                <span>STK: <b className="text-sky-400">{parsed.number || '---'}</b></span>
                                                <span>·</span>
                                                <span>Chủ: <b className="text-zinc-300">{parsed.owner || '---'}</b></span>
                                            </div>
                                        ) : (
                                            <span className="text-teal-400 text-[11px] font-bold flex items-center gap-1.5">
                                                <i className="fas fa-lock text-[10px]"></i> Quỹ Tiền Mặt (Két Sắt Xưởng)
                                            </span>
                                        )}
                                    </div>

                                    {/* KHỐI SỐ DƯ ĐẦU KỲ & BIẾN ĐỘNG TRONG KỲ */}
                                    <div className="bg-[#09090b] border border-zinc-800/80 rounded-2xl p-2.5 mb-3 space-y-1.5">
                                        <div className="flex items-center justify-between text-[11px]">
                                            <span className="text-zinc-400 font-bold flex items-center gap-1">
                                                <i className="fas fa-hourglass-start text-[9.5px] text-amber-400/80"></i> Quỹ Đầu Kỳ:
                                            </span>
                                            <span className="font-mono font-black text-amber-300/90">{secureMoney(accStat.openingBalance)}đ</span>
                                        </div>

                                        <div className="flex items-center justify-between text-[10.5px] pt-1 border-t border-zinc-800/50">
                                            <span className="text-emerald-400 font-semibold">Thu: +{secureMoney(accStat.inflow)}đ</span>
                                            <span className="text-rose-400 font-semibold">Chi: -{secureMoney(accStat.outflow)}đ</span>
                                            {(accStat.transferIn > 0 || accStat.transferOut > 0) && (
                                                <span className="text-sky-400 font-semibold font-mono">
                                                    ↔{accStat.transferIn - accStat.transferOut >= 0 ? '+' : ''}{secureMoney(accStat.transferIn - accStat.transferOut)}đ
                                                </span>
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex gap-2 items-center pt-2.5 border-t border-zinc-800/80">
                                        <button 
                                            onClick={() => setViewingAccountTxs(a)} 
                                            className={`flex-1 text-[11px] font-bold ${visuals.color} bg-zinc-900 hover:bg-zinc-800 px-3 py-2 rounded-xl border border-zinc-800 transition-all text-center cursor-pointer flex items-center justify-center gap-1.5 active:scale-95`}
                                        >
                                            <i className="fas fa-history text-xs"></i> <span>Sổ Cái</span>
                                        </button>
                                        {canManageFinance && (
                                            <>
                                                <button 
                                                    onClick={() => { setEditingAccount(a); setShowAccountModal(true); }} 
                                                    className="h-8 px-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-amber-400 border border-zinc-800 flex items-center justify-center gap-1 transition-colors cursor-pointer text-[11px] font-bold active:scale-95"
                                                    title="Chỉnh sửa hoặc điều chỉnh quỹ"
                                                >
                                                    <i className="fas fa-sliders-h text-xs"></i>
                                                    <span className="hidden sm:inline">Điều Chỉnh</span>
                                                </button>
                                                {isAdmin && (
                                                    <button 
                                                        onClick={() => { 
                                                            if (window.confirm(`Xoá vĩnh viễn quỹ [${parsed.name}]?`)) {
                                                                pushDeltas({ deletes: { Accounts: [a.id] } });
                                                            } 
                                                        }} 
                                                        className="w-8 h-8 rounded-xl bg-zinc-900 hover:bg-rose-950/60 text-zinc-400 hover:text-rose-400 border border-zinc-800 flex items-center justify-center transition-colors cursor-pointer shrink-0 active:scale-95"
                                                        title="Xóa quỹ"
                                                    >
                                                        <i className="fas fa-trash text-xs"></i>
                                                    </button>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}

            {/* 6. SUB-TAB 3: THỐNG KÊ CƠ CẤU (THONG_KE) */}
            {activeSubTab === 'THONG_KE' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5 animate-fade-in">
                    {/* Tỷ trọng Thu */}
                    <div className="bg-[#121216] border border-white/[0.08] rounded-3xl p-4 sm:p-5 shadow-sm">
                        <div className="text-[12.5px] font-black text-emerald-400 uppercase tracking-wider mb-3.5 border-b border-zinc-800 pb-2.5 flex items-center gap-2">
                            <i className="fas fa-arrow-down"></i> Cơ Cấu Doanh Thu & Tiền Thu ({filterTime})
                        </div>
                        <div className="space-y-3">
                            {(() => {
                                let catThu = {};
                                basePeriodTxs.filter(t => t.type === 'Thu' && !isAdjustmentTx(t)).forEach(t => {
                                    catThu[t.category || 'Khác'] = (catThu[t.category || 'Khác'] || 0) + Number(t.amount || 0);
                                });
                                const entries = Object.entries(catThu).sort((a, b) => b[1] - a[1]);
                                if (entries.length === 0) return <div className="text-zinc-500 text-[11px] italic py-4 text-center">Không có dữ liệu thu trong kỳ</div>;
                                return entries.map(([cat, val]) => {
                                    const pct = totalThu > 0 ? (val / totalThu) * 100 : 0;
                                    return (
                                        <div key={cat} className="space-y-1">
                                            <div className="flex justify-between items-center text-[12px]">
                                                <span className="text-zinc-200 font-bold">{cat}</span>
                                                <div className="flex items-center gap-2">
                                                    <span className="text-emerald-400 font-mono font-bold">{secureMoney(val)}đ</span>
                                                    <span className="text-[10px] text-zinc-400 bg-[#09090b] px-1.5 py-0.5 rounded border border-zinc-800 font-mono font-bold">
                                                        {pct.toFixed(0)}%
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="w-full h-1.5 bg-[#09090b] rounded-full overflow-hidden border border-white/[0.04]">
                                                <div className="h-full bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full transition-all duration-500" style={{ width: `${Math.min(100, Math.max(2, pct))}%` }}></div>
                                            </div>
                                        </div>
                                    );
                                });
                            })()}
                        </div>
                    </div>

                    {/* Tỷ trọng Chi */}
                    <div className="bg-[#121216] border border-white/[0.08] rounded-3xl p-4 sm:p-5 shadow-sm">
                        <div className="text-[12.5px] font-black text-rose-400 uppercase tracking-wider mb-3.5 border-b border-zinc-800 pb-2.5 flex items-center gap-2">
                            <i className="fas fa-arrow-up"></i> Cơ Cấu Chi Phí ({filterTime})
                        </div>
                        <div className="space-y-3">
                            {(() => {
                                let catChi = {};
                                basePeriodTxs.filter(t => t.type === 'Chi' && !isAdjustmentTx(t)).forEach(t => {
                                    catChi[t.category || 'Khác'] = (catChi[t.category || 'Khác'] || 0) + Number(t.amount || 0);
                                });
                                const entries = Object.entries(catChi).sort((a, b) => b[1] - a[1]);
                                if (entries.length === 0) return <div className="text-zinc-500 text-[11px] italic py-4 text-center">Không có dữ liệu chi trong kỳ</div>;
                                return entries.map(([cat, val]) => {
                                    const pct = totalChi > 0 ? (val / totalChi) * 100 : 0;
                                    return (
                                        <div key={cat} className="space-y-1">
                                            <div className="flex justify-between items-center text-[12px]">
                                                <span className="text-zinc-200 font-bold">{cat}</span>
                                                <div className="flex items-center gap-2">
                                                    <span className="text-rose-400 font-mono font-bold">{secureMoney(val)}đ</span>
                                                    <span className="text-[10px] text-zinc-400 bg-[#09090b] px-1.5 py-0.5 rounded border border-zinc-800 font-mono font-bold">
                                                        {pct.toFixed(0)}%
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="w-full h-1.5 bg-[#09090b] rounded-full overflow-hidden border border-white/[0.04]">
                                                <div className="h-full bg-gradient-to-r from-rose-500 to-amber-500 rounded-full transition-all duration-500" style={{ width: `${Math.min(100, Math.max(2, pct))}%` }}></div>
                                            </div>
                                        </div>
                                    );
                                });
                            })()}
                        </div>
                    </div>
                </div>
            )}

            {/* MODALS */}
            {viewingTxDetail && (
                <TransactionDetailModal 
                    tx={viewingTxDetail} 
                    accountsData={accountsData} 
                    onClose={() => setViewingTxDetail(null)} 
                    onEdit={(t) => { setEditingTxData(t); setShowAddTx(true); }} 
                    onDelete={handleDeleteTx} 
                    onPrint={handlePrintK58} 
                    secureMoney={secureMoney} 
                    canManageFinance={canManageFinance} 
                />
            )}
            {showAddTx && (
                <TransactionFormModal 
                    initialData={editingTxData} 
                    categories={categories} 
                    accountsData={accountsData} 
                    onClose={() => { setShowAddTx(false); setEditingTxData(null); }} 
                    onSave={handleSaveTx} 
                    isSaving={isSavingTx} 
                />
            )}
            {showImportScanner && (
                <ImportStatementModal 
                    categories={categories} 
                    erpData={erpData} 
                    onClose={() => setShowImportScanner(false)} 
                    pushDeltas={pushDeltas} 
                    triggerToast={triggerToast} 
                />
            )}
            {showShopeeWalletScanner && (
                <ShopeeWalletScannerModal 
                    categories={categories} 
                    erpData={erpData} 
                    onClose={() => setShowShopeeWalletScanner(false)} 
                    pushDeltas={pushDeltas} 
                    triggerToast={triggerToast} 
                    accountsData={accountsData} 
                />
            )}
            {showReceiptScanner && (
                <ReceiptScannerModal 
                    accountsData={accountsData} 
                    onClose={() => setShowReceiptScanner(false)} 
                    triggerToast={triggerToast} 
                    onComplete={handleReceiptScanned} 
                />
            )}
            {viewingProofImage && (
                <ProofViewerModal 
                    imageUrl={viewingProofImage} 
                    onClose={() => setViewingProofImage(null)} 
                />
            )}
            {showBatchCategoryModal && (
                <BatchCategoryModal 
                    selectedCount={selectedTxIds.size} 
                    categories={categories} 
                    onClose={() => setShowBatchCategoryModal(false)} 
                    onApply={handleBatchAssignCategory} 
                />
            )}
            {showAccountModal && (
                <AccountModal 
                    initialData={editingAccount} 
                    onClose={() => { setShowAccountModal(false); setEditingAccount(null); }} 
                    onSubmit={handleSaveAccount} 
                />
            )}
            {viewingAccountTxs && (
                <AccountHistoryModal 
                    account={viewingAccountTxs} 
                    allTxs={allTxs} 
                    onClose={() => setViewingAccountTxs(null)} 
                    secureMoney={secureMoney} 
                    canManageFinance={canManageFinance} 
                    onDeleteTx={handleDeleteTx} 
                />
            )}
        </div>
    );
});
</script>
