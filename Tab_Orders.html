<script type="text/babel">
    // =========================================================================
    // 📦 FILE: Tab_Orders.txt
    // CHỨC NĂNG: Quản lý danh sách đơn hàng, bộ lọc trạng thái, bàn giao hàng loạt
    // NGUYÊN TẮC: Bảo toàn 100% logic hoàn kho, nhập bù tồn kho và các state bộ lọc
    // =========================================================================
    // -------------------------------------------------------------------------

    // HÀM PARSE NGÀY ĐA NĂNG (HỖ TRỢ DD/MM/YYYY, YYYY-MM-DD, TIMESTAMP, TIẾNG VIỆT)
    window.parseOrderDateSafe = function(dateInput) {
        if (!dateInput) return null;
        if (dateInput instanceof Date) return isNaN(dateInput.getTime()) ? null : dateInput;

        var str = String(dateInput).trim();
        if (!str || str === '0' || str === '') return null;

        // Lấy phần ngày (bỏ phần giờ nếu có)
        var datePart = str.split(' ')[0].split('T')[0];

        // 1. Xử lý định dạng DD/MM/YYYY hoặc DD-MM-YYYY
        if (datePart.indexOf('/') !== -1 || (datePart.indexOf('-') !== -1 && datePart.split('-')[0].length !== 4)) {
            var sep = datePart.indexOf('/') !== -1 ? '/' : '-';
            var parts = datePart.split(sep);
            if (parts.length === 3) {
                var d = parseInt(parts[0], 10);
                var m = parseInt(parts[1], 10) - 1;
                var y = parseInt(parts[2], 10);
                if (parts[0].length === 4) { // Trường hợp YYYY/MM/DD
                    y = parseInt(parts[0], 10);
                    m = parseInt(parts[1], 10) - 1;
                    d = parseInt(parts[2], 10);
                }
                var res = new Date(y, m, d);
                return isNaN(res.getTime()) ? null : res;
            }
        }

        // 2. Xử lý định dạng YYYY-MM-DD (ISO standard)
        if (datePart.indexOf('-') !== -1) {
            var parts2 = datePart.split('-');
            if (parts2.length === 3 && parts2[0].length === 4) {
                var res2 = new Date(parseInt(parts2[0], 10), parseInt(parts2[1], 10) - 1, parseInt(parts2[2], 10));
                return isNaN(res2.getTime()) ? null : res2;
            }
        }

        var fallback = new Date(str);
        return isNaN(fallback.getTime()) ? null : fallback;
    };

    // ---------------------------------// COMPONENT: MÁY QUÉT ĐƠN HOÀN (EMAIL, FILE EXCEL ORDER.ALL, FILE PDF BIÊN BẢN, SÚNG MÃ VẠCH)
    function ReturnScannerModal({ onClose, orders, pushDeltas, triggerToast }) {
        const [scanVal, setScanVal] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);

        const [preview, setPreview] = React.useState('');
        const [scannedOrders, setScannedOrders] = React.useState([]);
        const [unmatchedCodes, setUnmatchedCodes] = React.useState([]);

        // Quản lý lý do hoàn hàng (Hallmark UI)
        const [returnReason, setReturnReason] = React.useState('');
        const [selectedReasonChip, setSelectedReasonChip] = React.useState('');

        const PRESET_RETURN_REASONS = [
            { label: 'Bom hàng / Khách không nhận', icon: 'fa-box-archive', color: 'text-amber-300 border-amber-500/30' },
            { label: 'Bể vỡ khi vận chuyển', icon: 'fa-heart-crack', color: 'text-rose-300 border-rose-500/30' },
            { label: 'Giao sai mẫu / Thiếu hàng', icon: 'fa-triangle-exclamation', color: 'text-yellow-300 border-yellow-500/30' },
            { label: 'Khách đổi ý / Trả qua sàn', icon: 'fa-rotate-left', color: 'text-sky-300 border-sky-500/30' },
            { label: 'Giao chậm / Quá hạn nhận', icon: 'fa-clock', color: 'text-indigo-300 border-indigo-500/30' }
        ];

        const handleSelectPreset = (presetLabel) => {
            if (selectedReasonChip === presetLabel && returnReason === presetLabel) {
                setSelectedReasonChip('');
                setReturnReason('');
            } else {
                setSelectedReasonChip(presetLabel);
                setReturnReason(presetLabel);
            }
        };

        const inputRef = React.useRef(null);
        const fileInputRef = React.useRef(null);
        const lastScanRef = React.useRef({ code: '', time: 0 });

        React.useEffect(() => {
            if (inputRef.current && !isProcessing && !preview) inputRef.current.focus();
        }, [isProcessing, preview]);

        const processCode = async (rawCode) => {
            if (!rawCode) return;
            let originalRaw = String(rawCode).trim();
            let extractedCode = originalRaw;
            const isUrl = originalRaw.indexOf('http') > -1;

            if (isUrl) {
                const urlMatches = originalRaw.match(/(?:id|orderId|order_id|tracking_number|mvd|key)=([A-Za-z0-9_-]+)/i);
                if (urlMatches && urlMatches[1]) extractedCode = urlMatches[1];
            } else if (originalRaw.indexOf('|') > -1 || originalRaw.indexOf(';') > -1 || originalRaw.indexOf(':') > -1) {
                const parts = originalRaw.split(/[\s|;:,-]+/);
                const candidate = parts.find(p => p.trim().length >= 8 && /^[A-Za-z0-9_-]+$/.test(p.trim()));
                if (candidate) extractedCode = candidate;
            }

            const code = String(extractedCode).trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (!code || code.length < 4) return;

            const now = Date.now();
            if (lastScanRef.current.code === code && (now - lastScanRef.current.time) < 3000) return;
            lastScanRef.current = { code, time: now };

            setIsProcessing(true);

            const order = orders.find(o => {
                const rawOrderCode = String(o.orderCode || '').toUpperCase();
                const rawShippingCode = String(o.shippingCode || '').toUpperCase();
                const phone = String(o.phone || '').replace(/[^0-9]/g, '');
                let maDon = rawOrderCode.replace(/[^A-Z0-9]/g, '');
                let mvd = rawShippingCode.replace(/[^A-Z0-9]/g, '');
                if (rawOrderCode.indexOf('MVĐ') > -1) {
                    const parts = rawOrderCode.split('MVĐ');
                    maDon = parts[0].replace(/[^A-Z0-9]/g, '');
                    if (parts[1]) mvd = parts[1].replace(/[^A-Z0-9]/g, '') || mvd;
                }
                if (mvd && (mvd === code || mvd.indexOf(code) > -1 || code.indexOf(mvd) > -1)) return true;
                if (maDon && (maDon === code || maDon.indexOf(code) > -1 || code.indexOf(maDon) > -1)) return true;
                if (phone && phone.length >= 8 && (phone.indexOf(code) > -1 || code.indexOf(phone) > -1)) return true;
                const cleanOrderCode = rawOrderCode.replace(/[^A-Z0-9]/g, '');
                if (cleanOrderCode.indexOf(code) > -1 || code.indexOf(cleanOrderCode) > -1) return true;
                return false;
            });

            if (order) {
                const currentStatus = String(order.status || '').toUpperCase().trim();
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                const returnedAt = safeDateFull.replace('T', ' ').slice(0, 19);
                const safeDateOnly = safeDateFull.slice(0, 10);
                const now = new Date();
                const curY = now.getFullYear();
                const curM = now.getMonth() + 1;
                const curYm = `${curY}-${String(curM).padStart(2, '0')}`;

                const origDateStr = String(order.date || order.createdAt || '').slice(0, 10);
                const isOldMonth = origDateStr && !origDateStr.startsWith(curYm);
                const origMonthMatch = origDateStr.match(/\d{4}-(\d{2})/);
                const origMonthNum = origMonthMatch ? parseInt(origMonthMatch[1], 10) : '';

                // Kiểm tra đơn đã từng quét nhận hoàn trong chính ngày hôm nay chưa (chống tít đúp vô tình)
                const isAlreadyReturn = (currentStatus === 'HÀNG HOÀN' || currentStatus.indexOf('HOÀN CHỜ XỬ') > -1 || currentStatus.indexOf('HOÀN KHO') > -1);
                const alreadyScannedToday = isAlreadyReturn && String(order.returnedAt || '').includes(safeDateOnly);

                if (alreadyScannedToday) {
                    triggerToast(`Đơn [${order.orderCode}] đã quét nhận hoàn hôm nay rồi!`, 'fa-info-circle', 'warning');
                } else {
                    try {
                        const effectiveReason = String(returnReason || '').trim();
                        let updatedNote = String(order.note || '').trim();
                        if (effectiveReason) {
                            if (updatedNote.includes('[Hoàn:')) {
                                updatedNote = updatedNote.replace(/\[Hoàn:[^\]]*\]/g, `[Hoàn: ${effectiveReason}]`).trim();
                            } else {
                                updatedNote = updatedNote ? `${updatedNote} | [Hoàn: ${effectiveReason}]` : `[Hoàn: ${effectiveReason}]`;
                            }
                        }

                        // Nếu là đơn tháng cũ (T8): ghi chú vết và chuyển ngày về tháng này để Diệu Hương kiểm
                        if (isOldMonth) {
                            const tag = `[Đơn cũ T${origMonthNum || 'trước'} đưa về Hoàn T${curM}: gốc ${origDateStr}]`;
                            if (!updatedNote.includes('đưa về Hoàn T')) {
                                updatedNote = updatedNote ? `${tag} ${updatedNote}` : tag;
                            }
                        }

                        const newOrder = { 
                            ...order, 
                            date: isOldMonth ? safeDateOnly : (order.date || safeDateOnly),
                            status: 'Hàng Hoàn', 
                            _effectiveStatus: 'HÀNG HOÀN CHỜ XỬ LÝ',
                            returnReason: effectiveReason || order.returnReason || '',
                            note: updatedNote,
                            returnedAt: returnedAt, 
                            reconciledAt: order.reconciledAt || returnedAt,
                            updatedAt: safeDateFull,
                            isReconciled: false
                        };
                        await pushDeltas({ orders: [newOrder] }, `Đã nhận hoàn đơn: ${order.orderCode} (Hoàn T${curM})${effectiveReason ? ` (${effectiveReason})` : ''}!`, 'fa-undo');
                        if (isOldMonth) {
                            triggerToast(`Thành công! Đơn [${order.orderCode}] (T${origMonthNum || 'cũ'}) đã được đưa về mục Hoàn Tháng ${curM} để Diệu Hương kiểm!`, 'fa-check-circle', 'success');
                        } else {
                            triggerToast(`Thành công! Đơn [${order.orderCode}] đã chuyển về Kho Hoàn Tháng ${curM} để Diệu Hương kiểm!`, 'fa-check-circle', 'success');
                        }
                    } catch (err) { triggerToast('Lỗi kết nối đồng bộ kho hoàn!', 'fa-times', 'danger'); }
                }
            } else {
                triggerToast(`Không tìm thấy đơn khớp mã: ${code}`, 'fa-exclamation-triangle', 'danger');
            }

            if (typeof setScanVal === 'function') setScanVal('');
            setIsProcessing(false);
        };

        const handleManualReturn = () => {
            const raw = String(scanVal || '').trim();
            if (!raw) return;

            const tokens = raw.split(/[\s,;\n\t]+/).map(t => t.trim().toUpperCase()).filter(t => t.length >= 3);
            if (tokens.length === 0) return;

            if (tokens.length === 1 && !tokens[0].includes(' ') && tokens[0].length <= 20) {
                processCode(tokens[0]);
                return;
            }

            let foundOrders = [];
            let notFound = [];

            tokens.forEach(tok => {
                const cleanTok = tok.split(' | ')[0].trim();
                const match = (orders || []).find(o => {
                    const dbCode = String(o.orderCode || '').toUpperCase();
                    const dbShipping = String(o.shippingCode || '').toUpperCase();
                    const dbId = String(o.id || '').toUpperCase();
                    const dbPhone = String(o.phone || '').toUpperCase();
                    return dbCode === cleanTok || dbCode.includes(cleanTok) || 
                           dbShipping === cleanTok || (cleanTok.length >= 6 && dbShipping.includes(cleanTok)) ||
                           dbId === cleanTok || (cleanTok.length >= 6 && dbPhone.includes(cleanTok));
                });

                if (match) {
                    if (!foundOrders.find(fo => fo.id === match.id)) foundOrders.push(match);
                } else {
                    if (!notFound.includes(cleanTok)) notFound.push(cleanTok);
                }
            });

            if (foundOrders.length === 0) {
                triggerToast(`Không tìm thấy đơn hàng nào khớp với danh sách mã đã dán!`, 'fa-exclamation-triangle', 'warning');
                return;
            }

            setScannedOrders(foundOrders);
            setUnmatchedCodes(notFound);
            setPreview('manual_loaded');
            setScanVal('');
        };

        const handleScanInput = (e) => { if (e.key === 'Enter') handleManualReturn(); };

        const handleScanEmailReturn = async () => {
            if (isProcessing) return;
            setIsProcessing(true);
            triggerToast("Đang quét hòm thư Gmail tìm email hoàn hàng...", "fa-spinner fa-spin", "info");
            try {
                if (typeof runGAS === 'function') {
                    const gasPromise = runGAS('scanReturnedOrdersFromEmail');
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Quá thời gian phản hồi từ máy chủ Gmail (15s)")), 15000));
                    const res = await Promise.race([gasPromise, timeoutPromise]);
                    if (res && res.success) {
                        if (res.count > 0) {
                            triggerToast(`Thành công! Đã tự động cập nhật ${res.count} đơn hoàn từ email.`, "fa-check", "success");
                            window.dispatchEvent(new CustomEvent('triggerReloadData'));
                            onClose();
                        } else {
                            triggerToast(res.message || "Không có email hoàn trả mới nào cần xử lý!", "fa-info-circle", "info");
                        }
                    } else {
                        triggerToast(res?.message || "Lỗi khi quét email!", "fa-times", "danger");
                    }
                } else {
                    triggerToast("Chức năng chỉ hoạt động trên môi trường Google Apps Script!", "fa-exclamation-triangle", "warning");
                }
            } catch (err) {
                triggerToast(err.message || "Lỗi kết nối hòm thư Gmail!", "fa-times", "danger");
            } finally {
                setIsProcessing(false);
            }
        };

        const handleFileUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fName = file.name.toLowerCase();
            setIsProcessing(true);

            if (fName.endsWith('.xlsx') || fName.endsWith('.xls') || fName.endsWith('.csv')) {
                if (typeof window.ensureXLSXLoaded === 'function') await window.ensureXLSXLoaded();
                triggerToast("Đang phân tích file Excel Order.all...", "fa-spinner fa-spin", "info");
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = window.XLSX.read(data, { type: 'array' });
                        let sheetName = wb.SheetNames[0];
                        const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });

                        if (rows.length < 2) throw new Error("File rỗng");
                        let headerIdx = 0;
                        for (let i = 0; i < Math.min(20, rows.length); i++) {
                            const rStr = (rows[i] || []).join(' ').toLowerCase();
                            if (rStr.includes('mã đơn') || rStr.includes('order id') || rStr.includes('order no') || rStr.includes('หมายเลขคำสั่งซื้อ') || rStr.includes('คำสั่งซื้อ')) { headerIdx = i; break; }
                        }
                        const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());
                        const iCode = headers.findIndex(h => h.includes('mã đơn') || h.includes('order id') || h.includes('order no') || h.includes('หมายเลขคำสั่งซื้อ') || h.includes('คำสั่งซื้อ'));
                        
                        // Định vị chính xác các cột trạng thái theo chuẩn Shopee / TikTok
                        const iOrderStatus = headers.findIndex(h => h === 'trạng thái đơn hàng' || h === 'trạng thái' || h === 'order status' || h === 'status' || h.includes('trạng thái đơn hàng') || h.includes('สถานะ'));
                        const iReturnStatus = headers.findIndex(h => h.includes('trạng thái trả hàng') || h.includes('trả hàng/hoàn tiền') || h.includes('trả hàng / hoàn tiền') || h.includes('return / refund status') || h.includes('return status'));
                        const iCancelReason = headers.findIndex(h => h.includes('lý do hủy') || h.includes('lý do huỷ') || h.includes('cancellation reason') || h.includes('cancel reason'));
                        const iReturnReason = headers.findIndex(h => h.includes('lý do trả hàng') || h.includes('lý do hoàn') || h.includes('lý do khiếu nại') || h.includes('return reason') || h.includes('refund reason') || h.includes('lý do yêu cầu'));

                        const isActualReturnOrder = (cols) => {
                            const orderStatus = String((iOrderStatus >= 0 ? cols[iOrderStatus] : '') || '').trim();
                            const returnStatus = String((iReturnStatus >= 0 ? cols[iReturnStatus] : '') || '').trim();
                            const cancelReason = String((iCancelReason >= 0 ? cols[iCancelReason] : '') || '').trim();

                            const lowerOrderStatus = orderStatus.toLowerCase();
                            const lowerReturnStatus = returnStatus.toLowerCase();
                            const lowerCancelReason = cancelReason.toLowerCase();

                            // 1. NẾU LÀ ĐƠN KHÁCH ĐÃ NHẬN HÀNG -> TUYỆT ĐỐI KHÔNG PHẢI ĐƠN HOÀN!
                            if (lowerOrderStatus.includes('người mua xác nhận đã nhận được hàng') || 
                                lowerOrderStatus.includes('đã nhận được hàng') ||
                                lowerOrderStatus === 'hoàn thành' || 
                                lowerOrderStatus === 'đã giao' ||
                                lowerOrderStatus === 'completed' ||
                                lowerOrderStatus === 'delivered') {
                                // Chỉ là đơn hoàn nếu cột Trả hàng/Hoàn tiền thực sự có yêu cầu khiếu nại được chấp thuận/chờ xử lý:
                                if (returnStatus && (
                                    lowerReturnStatus.includes('đã chấp thuận') || 
                                    lowerReturnStatus.includes('yêu cầu chờ xử lý') || 
                                    lowerReturnStatus.includes('đã giải quyết khiếu nại') ||
                                    lowerReturnStatus.includes('approved') ||
                                    lowerReturnStatus.includes('pending')
                                )) {
                                    return true;
                                }
                                return false; // Đơn giao thành công bình thường
                            }

                            // 2. NẾU LÀ TRẢ HÀNG/HOÀN TIỀN TRỰC TIẾP
                            if (lowerOrderStatus === 'trả hàng/hoàn tiền' || lowerOrderStatus === 'trả hàng / hoàn tiền' || lowerOrderStatus === 'trả hàng' || lowerOrderStatus === 'hàng hoàn' || lowerOrderStatus === 'return/refund' || lowerOrderStatus === 'returned') {
                                return true;
                            }

                            // 3. NẾU LÀ ĐƠN HỦY DO GIAO HÀNG THẤT BẠI (Boom hàng hoàn về)
                            if ((lowerOrderStatus.includes('hủy') || lowerOrderStatus.includes('huỷ') || lowerOrderStatus.includes('cancelled')) && 
                                (lowerCancelReason.includes('giao hàng thất bại') || lowerCancelReason.includes('không thể giao') || lowerCancelReason.includes('delivery failed') || lowerCancelReason.includes('buyer rejected'))) {
                                return true;
                            }

                            // 4. CỘT TRẢ HÀNG/HOÀN TIỀN CÓ NỘI DUNG YÊU CẦU HỢP LỆ
                            if (returnStatus && returnStatus !== '' && returnStatus !== '0' && returnStatus !== 'N/A' && returnStatus !== '-' && !lowerReturnStatus.includes('không có') && !lowerReturnStatus.includes('none')) {
                                return true;
                            }

                            return false;
                        };

                        let foundOrders = [];
                        let notFound = [];

                        for (let i = headerIdx + 1; i < rows.length; i++) {
                            const cols = rows[i];
                            if (iCode < 0 || !cols[iCode]) continue;
                            let oCode = String(cols[iCode]).trim();
                            if (oCode.length < 5) {
                                for (let c = 0; c < cols.length; c++) {
                                    const val = String(cols[c] || '').trim();
                                    if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                        oCode = val; break;
                                    }
                                }
                            }
                            if (!oCode || oCode.length < 5 || oCode.toLowerCase().includes('mã đơn')) continue;

                            if (isActualReturnOrder(cols)) {
                                const cleanCode = oCode.split(' | ')[0].trim().toUpperCase();
                                const matchOrder = orders.find(o => {
                                    const dbCode = String(o.orderCode || '').toUpperCase();
                                    if (cleanCode.length < 5) return dbCode === cleanCode;
                                    return dbCode === cleanCode || dbCode.includes(cleanCode);
                                });
                                if (matchOrder) {
                                    const currentStatus = String(matchOrder.status || '').toUpperCase().trim();
                                    if (currentStatus !== 'HÀNG HOÀN' && !currentStatus.includes('HOÀN CHỜ XỬ') && !currentStatus.includes('HOÀN KHO')) {
                                        const detectedFileReason = (iReturnReason >= 0 && cols[iReturnReason]) ? String(cols[iReturnReason]).trim() : 
                                                                   ((iCancelReason >= 0 && cols[iCancelReason]) ? String(cols[iCancelReason]).trim() : '');
                                        if (!foundOrders.find(fo => fo.id === matchOrder.id)) {
                                            foundOrders.push({
                                                ...matchOrder,
                                                fileReturnReason: detectedFileReason
                                            });
                                        }
                                    }
                                } else {
                                    if (!notFound.includes(cleanCode)) notFound.push(cleanCode);
                                }
                            }
                        }

                        setScannedOrders(foundOrders);
                        setUnmatchedCodes(notFound);
                        setPreview('file_loaded');
                        if (foundOrders.length > 0) {
                            const firstFileReason = foundOrders.find(fo => fo.fileReturnReason)?.fileReturnReason;
                            if (firstFileReason && !returnReason) {
                                setReturnReason(firstFileReason);
                            }
                            triggerToast(`Phân tích xong! Khớp ${foundOrders.length} đơn hoàn hợp lệ.`, "fa-check", "success");
                        } else {
                            triggerToast(`Không tìm thấy đơn hoàn mới nào cần cập nhật trong file!`, "fa-info", "warning");
                        }
                    } catch (err) {
                        triggerToast("Lỗi đọc tệp Excel!", "fa-times", "danger");
                    } finally {
                        e.target.value = '';
                        setIsProcessing(false);
                    }
                };
                reader.readAsArrayBuffer(file);
                return;
            }

            if (fName.endsWith('.pdf')) {
                triggerToast("AI đang đọc dữ liệu PDF biên bản...", "fa-spinner fa-spin", "info");
                try {
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });

                    setPreview('file_loaded');
                    let textResult = "";
                    if (typeof runGAS === 'function') {
                        try { textResult = await runGAS('processOCR', base64Data); } catch (e) { textResult = ""; }
                    }

                    const matches = textResult.match(/(SPXVN[\s-]*[A-Z0-9]+|SPX[\s-]*[A-Z0-9]+|GYX[\s-]*[A-Z0-9]+|JT[\s-]*[A-Z0-9]+|GHN[\s-]*[A-Z0-9]+|[0-9]{6}[\s-]*[A-Z0-9]{8,9})/gi) || [];
                    const uniqueCodes = [...new Set(matches.map(c => c.replace(/[^A-Z0-9]/gi, '').toUpperCase()))];

                    let foundOrders = []; let notFound = [];
                    uniqueCodes.forEach(code => {
                        const order = orders.find(o => String(o.orderCode || '').toUpperCase().includes(code) || String(o.shippingCode || '').toUpperCase().includes(code));
                        if (order) {
                            const currentStatus = String(order.status || '').toUpperCase().trim();
                            if (currentStatus !== 'HÀNG HOÀN' && !currentStatus.includes('HOÀN KHO')) {
                                if (!foundOrders.find(fo => fo.id === order.id)) foundOrders.push(order);
                            }
                        } else { notFound.push(code); }
                    });

                    setScannedOrders(foundOrders);
                    setUnmatchedCodes(notFound);
                } catch (err) { triggerToast("Lỗi phân tích tệp PDF!", "fa-times", "danger"); }
                finally { e.target.value = ''; setIsProcessing(false); }
                return;
            }

            triggerToast("Vui lòng chọn file Excel Order.all (.xlsx/.xls) hoặc PDF!", "fa-times", "danger");
            e.target.value = ''; setIsProcessing(false);
        };

        const confirmBulkReturn = async () => {
            if (scannedOrders.length === 0) return;
            setIsProcessing(true);
            try {
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                const returnedAt = safeDateFull.replace('T', ' ').slice(0, 19);
                const safeDateOnly = safeDateFull.slice(0, 10);
                const now = new Date();
                const curY = now.getFullYear();
                const curM = now.getMonth() + 1;
                const curYm = `${curY}-${String(curM).padStart(2, '0')}`;

                let oldMonthCount = 0;
                const updatedOrders = scannedOrders.map(o => {
                    const effectiveReason = String(returnReason || o.fileReturnReason || '').trim();
                    let updatedNote = String(o.note || '').trim();
                    if (effectiveReason) {
                        if (updatedNote.includes('[Hoàn:')) {
                            updatedNote = updatedNote.replace(/\[Hoàn:[^\]]*\]/g, `[Hoàn: ${effectiveReason}]`).trim();
                        } else {
                            updatedNote = updatedNote ? `${updatedNote} | [Hoàn: ${effectiveReason}]` : `[Hoàn: ${effectiveReason}]`;
                        }
                    }

                    const origDateStr = String(o.date || o.createdAt || '').slice(0, 10);
                    const isOldMonth = origDateStr && !origDateStr.startsWith(curYm);
                    const origMonthMatch = origDateStr.match(/\d{4}-(\d{2})/);
                    const origMonthNum = origMonthMatch ? parseInt(origMonthMatch[1], 10) : '';

                    if (isOldMonth) {
                        oldMonthCount++;
                        const tag = `[Đơn cũ T${origMonthNum || 'trước'} đưa về Hoàn T${curM}: gốc ${origDateStr}]`;
                        if (!updatedNote.includes('đưa về Hoàn T')) {
                            updatedNote = updatedNote ? `${tag} ${updatedNote}` : tag;
                        }
                    }

                    return {
                        ...o,
                        date: isOldMonth ? safeDateOnly : (o.date || safeDateOnly),
                        status: 'Hàng Hoàn',
                        _effectiveStatus: 'HÀNG HOÀN CHỜ XỬ LÝ',
                        returnReason: effectiveReason || o.returnReason || '',
                        note: updatedNote,
                        returnedAt: returnedAt,
                        reconciledAt: o.reconciledAt || returnedAt,
                        updatedAt: safeDateFull,
                        isReconciled: false
                    };
                });

                const logMsg = returnReason ? `Đã chuyển ${updatedOrders.length} đơn về Hàng Hoàn T${curM} (${returnReason})!` : `Đã chuyển ${updatedOrders.length} đơn về Hàng Hoàn T${curM}!`;
                await pushDeltas({ orders: updatedOrders }, logMsg, 'fa-undo');
                if (oldMonthCount > 0) {
                    triggerToast(`Thành công! Đã chuyển ${updatedOrders.length} đơn (có ${oldMonthCount} đơn tháng cũ) về mục Hoàn Tháng ${curM} cho Diệu Hương kiểm.`, 'fa-check-circle', 'success');
                } else {
                    triggerToast(`Thành công! Đã chuyển ${updatedOrders.length} đơn sang Hàng Hoàn Tháng ${curM}.`, 'fa-check-circle', 'success');
                }
                onClose();
            } catch (err) { triggerToast('Lỗi đồng bộ!', 'fa-times', 'danger'); }
            setIsProcessing(false);
        };

        const resetScan = () => {
            setPreview('');
            setScannedOrders([]);
            setUnmatchedCodes([]);
            setReturnReason('');
            setSelectedReasonChip('');
        };

        return (
            <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-[9999] p-4 backdrop-blur-md animate-fade-in" onClick={() => onClose()}>
                <div className="bg-[#141414] border border-purple-500/50 w-full max-w-lg rounded-3xl p-6 shadow-[0_0_50px_rgba(168,85,247,0.2)] text-center relative animate-slide-up flex flex-col" onClick={e => e.stopPropagation()}>
                    <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white hover:bg-rose-500 flex items-center justify-center transition-all z-20 cursor-pointer"><i className="fas fa-times text-sm"></i></button>

                    <h3 className="font-black text-white text-[15px] uppercase tracking-widest mb-1 flex items-center justify-center gap-2 mt-2">
                        <i className="fas fa-undo text-purple-400"></i> Quét Đơn Hoàn Tự Động
                    </h3>

                    {preview ? (
                        <div className="mt-4 flex flex-col space-y-3.5 animate-fade-in text-left">
                            <div className="relative w-full h-20 bg-black rounded-xl border border-[#333] overflow-hidden flex items-center justify-center shadow-inner">
                                <div className="flex flex-col items-center justify-center text-purple-400">
                                    <i className="fas fa-file-excel text-2xl mb-0.5"></i>
                                    <span className="text-[11px] font-black uppercase tracking-widest text-white">Đã Tải & Đọc File Báo Cáo</span>
                                </div>
                                <button onClick={resetScan} disabled={isProcessing} className="absolute top-2.5 right-2.5 w-7 h-7 bg-black/80 rounded-full text-white border border-white/20 flex items-center justify-center hover:bg-rose-500 transition-colors shadow-md cursor-pointer"><i className="fas fa-redo text-xs"></i></button>
                            </div>

                            {/* Danh sách đơn khớp */}
                            <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-3">
                                <div className="text-[10px] font-black text-purple-400 uppercase tracking-widest border-b border-[#333] pb-2 mb-2 flex justify-between items-center">
                                    <span><i className="fas fa-check-circle mr-1"></i> Khớp {scannedOrders.length} Đơn Hoàn</span>
                                    <span className="text-[9px] text-zinc-400 font-normal">Sẵn sàng chuyển kho hoàn</span>
                                </div>
                                {scannedOrders.length > 0 ? (
                                    <div className="max-h-[130px] overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                                        {scannedOrders.map((o, idx) => (
                                            <div key={idx} className="bg-[#141414] border border-[#333] p-2 rounded-lg flex justify-between items-center hover:border-purple-500/50 transition-colors">
                                                <div className="flex flex-col min-w-0 pr-2">
                                                    <span className="text-[10px] text-white font-mono font-black truncate">{o.orderCode.split(' | ')[0]}</span>
                                                    {o.fileReturnReason && (
                                                        <span className="text-[8.5px] text-purple-300 font-semibold truncate flex items-center gap-1 mt-0.5">
                                                            <i className="fas fa-tag text-[7.5px] text-purple-400"></i> {o.fileReturnReason}
                                                        </span>
                                                    )}
                                                </div>
                                                <span className="text-[9px] bg-[#222] px-1.5 py-0.5 rounded text-gray-400 truncate max-w-[120px] shrink-0">{o.customer}</span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-gray-500 text-[10px] font-bold py-2 text-center">Không có đơn hoàn mới nào khớp!</div>
                                )}
                            </div>

                            {/* KHU VỰC NHẬP LÝ DO HOÀN (HALLMARK DESIGN) */}
                            <div className="bg-[#0b0b10] border border-purple-500/30 rounded-2xl p-3.5 shadow-[0_0_20px_rgba(168,85,247,0.08)]">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-[10px] font-black text-purple-300 uppercase tracking-widest flex items-center gap-1.5">
                                        <i className="fas fa-clipboard-question text-purple-400"></i> Lý Do Hoàn Hàng
                                    </span>
                                    {returnReason ? (
                                        <span className="text-[9px] bg-purple-500/20 text-purple-300 font-bold px-2 py-0.5 rounded-full border border-purple-500/40 truncate max-w-[180px] flex items-center gap-1">
                                            <i className="fas fa-check text-[8px] text-emerald-400"></i> {returnReason}
                                        </span>
                                    ) : (
                                        <span className="text-[9px] text-zinc-500 italic">Chọn nhanh hoặc tự nhập</span>
                                    )}
                                </div>

                                {/* Preset Chips */}
                                <div className="flex flex-wrap gap-1.5 mb-2.5">
                                    {PRESET_RETURN_REASONS.map((p, idx) => {
                                        const isSelected = selectedReasonChip === p.label || returnReason === p.label;
                                        return (
                                            <button
                                                key={idx}
                                                type="button"
                                                onClick={() => handleSelectPreset(p.label)}
                                                className={`text-[9.5px] font-bold px-2.5 py-1 rounded-lg border transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 ${
                                                    isSelected
                                                        ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white border-purple-400 shadow-[0_0_12px_rgba(168,85,247,0.5)] scale-[1.02]'
                                                        : `bg-[#161620] text-zinc-300 ${p.color} hover:bg-[#1e1e2c]`
                                                }`}
                                            >
                                                <i className={`fas ${p.icon} text-[9px]`}></i>
                                                <span>{p.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Custom Text Input */}
                                <div className="relative">
                                    <i className="fas fa-pen-to-square absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
                                    <input
                                        type="text"
                                        value={returnReason}
                                        onChange={e => {
                                            setReturnReason(e.target.value);
                                            setSelectedReasonChip('');
                                        }}
                                        placeholder="Nhập lý do hoàn chi tiết (áp dụng cho toàn bộ đơn khớp)..."
                                        className="w-full bg-[#060608] border border-[#262630] focus:border-purple-500 rounded-xl pl-8 pr-8 py-2 text-[11px] text-zinc-100 placeholder:text-zinc-500 outline-none focus:shadow-[0_0_15px_rgba(168,85,247,0.25)] transition-all font-medium"
                                    />
                                    {returnReason && (
                                        <button
                                            type="button"
                                            onClick={() => { setReturnReason(''); setSelectedReasonChip(''); }}
                                            className="absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-rose-400 text-xs cursor-pointer p-0.5 transition-colors"
                                            title="Xóa lý do"
                                        >
                                            <i className="fas fa-times-circle"></i>
                                        </button>
                                    )}
                                </div>
                            </div>

                            {unmatchedCodes.length > 0 && (
                                <div className="bg-rose-500/5 border border-rose-500/20 rounded-xl p-3">
                                    <div className="text-[10px] font-black text-rose-400 uppercase tracking-widest border-b border-rose-500/20 pb-1 mb-1.5">
                                        <i className="fas fa-exclamation-triangle mr-1"></i> Không Khớp {unmatchedCodes.length} Mã Trong File
                                    </div>
                                    <div className="flex flex-wrap gap-1 max-h-[50px] overflow-y-auto custom-scrollbar">
                                        {unmatchedCodes.map((code, idx) => (
                                            <span key={idx} className="text-[9px] bg-rose-500/10 text-rose-400 px-1 py-0.5 rounded font-mono">{code}</span>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <button onClick={confirmBulkReturn} disabled={isProcessing || scannedOrders.length === 0} className={`w-full py-3.5 rounded-xl font-black text-[12px] tracking-wide shadow-md flex items-center justify-center gap-2 transition-all active:scale-95 mt-1 cursor-pointer ${isProcessing || scannedOrders.length === 0 ? 'bg-[#333] text-gray-500' : 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white hover:opacity-90 shadow-purple-900/30'}`}>
                                {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG CẬP NHẬT TRẠNG THÁI...</> : `XÁC NHẬN ĐƯA ${scannedOrders.length} ĐƠN VỀ HOÀN THÁNG ${new Date().getMonth() + 1} CHO HƯƠNG KIỂM`}
                            </button>
                        </div>
                    ) : (
                        <>
                            <p className="text-gray-400 text-[11px] mb-1.5 leading-relaxed mt-1">Dùng súng bắn mã vạch hoặc ném file Excel Order.all / PDF vào đây.</p>
                            <div className="flex items-center justify-center gap-1.5 text-[9.5px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-xl w-fit mx-auto mb-2.5 font-bold shadow-sm">
                                <i className="fas fa-magic text-amber-400"></i>
                                <span>Đơn tháng cũ (T8) khi quét sẽ tự động đưa về mục Hoàn Tháng Này (T{new Date().getMonth() + 1}) để Hương kiểm tra</span>
                            </div>

                            {/* Preset Lý Do Khi Tít Súng Mã Vạch */}
                            <div className="w-full mb-3 bg-[#0d0d12] border border-purple-500/20 rounded-xl p-2.5 text-left">
                                <div className="flex items-center justify-between mb-1.5 px-0.5">
                                    <span className="text-[9px] font-black text-purple-300 uppercase tracking-widest flex items-center gap-1">
                                        <i className="fas fa-tag text-purple-400"></i> Lý do hoàn mặc định khi tít:
                                    </span>
                                    {returnReason && (
                                        <button
                                            type="button"
                                            onClick={() => { setReturnReason(''); setSelectedReasonChip(''); }}
                                            className="text-[8.5px] text-zinc-400 hover:text-rose-400 transition-colors cursor-pointer"
                                        >
                                            Bỏ chọn
                                        </button>
                                    )}
                                </div>
                                <div className="flex flex-wrap gap-1">
                                    {PRESET_RETURN_REASONS.map((p, idx) => {
                                        const isSelected = selectedReasonChip === p.label || returnReason === p.label;
                                        return (
                                            <button
                                                key={idx}
                                                type="button"
                                                onClick={() => handleSelectPreset(p.label)}
                                                className={`text-[8.5px] font-bold px-2 py-0.5 rounded-lg border transition-all cursor-pointer flex items-center gap-1 ${
                                                    isSelected
                                                        ? 'bg-purple-600 text-white border-purple-400 shadow-sm'
                                                        : `bg-[#161620] text-zinc-400 border-zinc-700/60 hover:text-zinc-200`
                                                }`}
                                            >
                                                <i className={`fas ${p.icon} text-[8px]`}></i>
                                                <span>{p.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="w-full flex flex-col items-center">
                                <div className="relative w-full mb-2">
                                    <input
                                        ref={inputRef} type="text" value={scanVal} onChange={e => setScanVal(e.target.value)} onKeyDown={handleScanInput} disabled={isProcessing}
                                        placeholder="Dán danh sách mã đơn / MVĐ hoặc dùng Súng Tít..."
                                        className="w-full bg-[#0a0a0a] border-2 border-[#333] focus:border-purple-500 rounded-xl pl-10 pr-24 py-3 text-center font-mono text-[12px] font-black text-white outline-none focus:shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all uppercase placeholder:font-sans placeholder:font-medium placeholder:normal-case placeholder:text-[11px]"
                                    />
                                    <i className="fas fa-barcode absolute left-3.5 top-1/2 -translate-y-1/2 text-purple-400 text-base"></i>
                                    <button
                                        onClick={handleManualReturn}
                                        disabled={isProcessing || !scanVal.trim()}
                                        className="absolute right-1.5 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-lg font-black text-[11px] bg-purple-600 hover:bg-purple-500 text-white transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed uppercase cursor-pointer"
                                    >
                                        QUÉT HOÀN
                                    </button>
                                </div>
                            </div>

                            <div className="mt-3 border-t border-[#333] pt-4 flex flex-col gap-2.5">
                                <button 
                                    onClick={handleScanEmailReturn} 
                                    disabled={isProcessing} 
                                    className={`w-full py-3 rounded-xl font-black text-[12px] uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 bg-gradient-to-br from-amber-500/20 to-purple-500/20 border border-amber-500/40 text-amber-300 hover:bg-amber-600 hover:text-white active:scale-95 ${isProcessing ? 'opacity-70 cursor-wait' : ''}`}
                                >
                                    <i className={`fas ${isProcessing ? 'fa-spinner fa-spin' : 'fa-envelope-open-text'} text-base`}></i> {isProcessing ? 'ĐANG QUÉT GMAIL...' : 'QUÉT EMAIL ĐƠN HOÀN (GMAIL)'}
                                </button>
                                <button onClick={() => fileInputRef.current?.click()} disabled={isProcessing} className="w-full py-3 rounded-xl font-black text-[12px] uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 bg-gradient-to-br from-purple-500/20 to-indigo-500/20 border border-purple-500/40 text-purple-300 hover:bg-purple-600 hover:text-white active:scale-95 disabled:opacity-50">
                                    <i className="fas fa-file-excel text-base"></i> TẢI FILE EXCEL (ORDER.ALL) / PDF
                                </button>
                                <input ref={fileInputRef} type="file" accept=".xlsx, .xls, .csv, .pdf" className="hidden" onChange={handleFileUpload} disabled={isProcessing} />
                            </div>
                        </>
                    )}
                </div>
            </div>
        );
    }

    // COMPONENT: MÁY QUÉT ĐƠN HỦY (NHẬP/DÁN MÃ, EMAIL, FILE EXCEL ORDER.ALL)
    function CancelScannerModal({ onClose, orders, prodItems, pushDeltas, triggerToast }) {
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [preview, setPreview] = React.useState('');
        const [scanVal, setScanVal] = React.useState('');
        const [scannedOrders, setScannedOrders] = React.useState([]);
        const [unmatchedCodes, setUnmatchedCodes] = React.useState([]);
        const fileInputRef = React.useRef(null);
        const inputRef = React.useRef(null);

        React.useEffect(() => {
            if (inputRef.current) inputRef.current.focus();
        }, []);

        const handleManualCancel = () => {
            const raw = String(scanVal || '').trim();
            if (!raw) return;

            const tokens = raw.split(/[\s,;\n\t]+/).map(t => t.trim().toUpperCase()).filter(t => t.length >= 3);
            if (tokens.length === 0) return;

            let foundOrders = [];
            let notFound = [];

            tokens.forEach(tok => {
                const cleanTok = tok.split(' | ')[0].trim();
                const match = (orders || []).find(o => {
                    const dbCode = String(o.orderCode || '').toUpperCase();
                    const dbId = String(o.id || '').toUpperCase();
                    const dbPhone = String(o.phone || '').toUpperCase();
                    return dbCode === cleanTok || dbCode.includes(cleanTok) || dbId === cleanTok || (cleanTok.length >= 6 && dbPhone.includes(cleanTok));
                });

                if (match) {
                    if (!foundOrders.find(fo => fo.id === match.id)) foundOrders.push(match);
                } else {
                    if (!notFound.includes(cleanTok)) notFound.push(cleanTok);
                }
            });

            if (foundOrders.length === 0) {
                triggerToast(`Không tìm thấy đơn hàng nào khớp với mã "${raw}"!`, 'fa-exclamation-triangle', 'warning');
                return;
            }

            setScannedOrders(foundOrders);
            setUnmatchedCodes(notFound);
            setPreview('manual_loaded');
            setScanVal('');
        };

        const handleScanEmailCancel = async () => {
            if (isProcessing) return;
            setIsProcessing(true);
            triggerToast("Đang quét hòm thư Gmail tìm email thông báo hủy đơn...", "fa-spinner fa-spin", "info");
            try {
                if (typeof runGAS === 'function') {
                    const gasPromise = runGAS('scanCancelledOrdersFromEmail');
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Quá thời gian phản hồi từ máy chủ Gmail (15s)")), 15000));
                    const res = await Promise.race([gasPromise, timeoutPromise]);
                    if (res && res.success) {
                        if (res.count > 0) {
                            triggerToast(`Thành công! Đã tự động cập nhật ${res.count} đơn huỷ từ email.`, "fa-check", "success");
                            window.dispatchEvent(new CustomEvent('triggerReloadData'));
                            onClose();
                        } else {
                            triggerToast(res.message || "Không có email hủy đơn mới nào cần xử lý!", "fa-info-circle", "info");
                        }
                    } else {
                        triggerToast(res?.message || "Lỗi khi quét email!", "fa-times", "danger");
                    }
                } else {
                    triggerToast("Chức năng chỉ hoạt động trên môi trường Google Apps Script!", "fa-exclamation-triangle", "warning");
                }
            } catch (err) {
                triggerToast(err.message || "Lỗi kết nối hòm thư Gmail!", "fa-times", "danger");
            } finally {
                setIsProcessing(false);
            }
        };

        const handleFileUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            setIsProcessing(true);
            if (typeof window.ensureXLSXLoaded === 'function') await window.ensureXLSXLoaded();
            triggerToast("Đang đọc file Excel Order.all...", "fa-spinner fa-spin", "info");

            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const wb = window.XLSX.read(data, { type: 'array' });
                    let sheetName = wb.SheetNames[0];
                    const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });

                    if (rows.length < 2) throw new Error("File rỗng");
                    let headerIdx = 0;
                    for (let i = 0; i < Math.min(20, rows.length); i++) {
                        const rStr = (rows[i] || []).join(' ').toLowerCase();
                        if (rStr.includes('mã đơn') || rStr.includes('order id') || rStr.includes('order no') || rStr.includes('หมายเลขคำสั่งซื้อ') || rStr.includes('คำสั่งซื้อ')) { headerIdx = i; break; }
                    }
                    const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());
                    const iCode = headers.findIndex(h => h.includes('mã đơn') || h.includes('order id') || h.includes('order no') || h.includes('หมายเลขคำสั่งซื้อ') || h.includes('คำสั่งซื้อ'));
                    let statusCols = [];
                    headers.forEach((h, idx) => {
                        if (h.includes('trạng thái') || h.includes('lý do') || h.includes('status') || h.includes('hủy') || h.includes('huỷ') || h.includes('cancel') || h.includes('สถานะ') || h.includes('ยกเลิก')) statusCols.push(idx);
                    });

                    let foundOrders = [];
                    let notFound = [];

                    for (let i = headerIdx + 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (iCode < 0 || !cols[iCode]) continue;
                        let oCode = String(cols[iCode]).trim();
                        if (oCode.length < 5) {
                            for (let c = 0; c < cols.length; c++) {
                                const val = String(cols[c] || '').trim();
                                if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                    oCode = val; break;
                                }
                            }
                        }
                        if (!oCode || oCode.length < 5 || oCode.toLowerCase().includes('mã đơn')) continue;

                        let rowStatus = '';
                        statusCols.forEach(idx => { if (cols[idx]) rowStatus += String(cols[idx]).toLowerCase() + ' '; });

                        if (rowStatus.includes('hủy') || rowStatus.includes('huỷ') || rowStatus.includes('cancel')) {
                            const cleanCode = oCode.split(' | ')[0].trim().toUpperCase();
                            const matchOrder = orders.find(o => {
                                const dbCode = String(o.orderCode || '').toUpperCase();
                                if (cleanCode.length < 5) return dbCode === cleanCode;
                                return dbCode === cleanCode || dbCode.includes(cleanCode);
                            });
                            if (matchOrder) {
                                const currentStatus = String(matchOrder.status || '').toUpperCase().trim();
                                if (currentStatus !== 'ĐƠN HUỶ' && !currentStatus.includes('HỦY') && !currentStatus.includes('HUỶ')) {
                                    if (!foundOrders.find(fo => fo.id === matchOrder.id)) foundOrders.push(matchOrder);
                                }
                            } else {
                                if (!notFound.includes(cleanCode)) notFound.push(cleanCode);
                            }
                        }
                    }

                    setScannedOrders(foundOrders);
                    setUnmatchedCodes(notFound);
                    setPreview('file_loaded');
                    if (foundOrders.length > 0) {
                        triggerToast(`Phân tích xong! Khớp ${foundOrders.length} đơn hủy hợp lệ.`, "fa-check", "success");
                    } else {
                        triggerToast(`Không tìm thấy đơn hủy mới nào cần cập nhật trong file!`, "fa-info", "warning");
                    }
                } catch (err) {
                    triggerToast("Lỗi đọc tệp Excel!", "fa-times", "danger");
                } finally {
                    e.target.value = '';
                    setIsProcessing(false);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        const confirmBulkCancel = async () => {
            if (scannedOrders.length === 0) return;
            setIsProcessing(true);
            try {
                const updatedOrders = scannedOrders.map(o => ({ ...o, status: 'Đơn Huỷ' }));

                let updatedProdItems = [];
                scannedOrders.forEach(order => {
                    const oId = String(order.id || '').trim();
                    const oCode = String(order.orderCode || '').trim();
                    const oBaseCode = oCode.split(' | ')[0].trim();

                    const relatedProds = (prodItems || []).filter(p => {
                        if (!p || !p.orderId) return false;
                        const pOrd = String(p.orderId).trim();
                        return (
                            (oId && pOrd === oId) || 
                            (oCode && pOrd === oCode) || 
                            (oBaseCode && (pOrd === oBaseCode || pOrd.includes(oBaseCode) || oBaseCode.includes(pOrd))) ||
                            (pOrd.includes(oId))
                        );
                    });

                    relatedProds.forEach(p => {
                        const pStatus = String(p.status || '').toUpperCase().trim();
                        if (pStatus !== 'DONE' && pStatus !== 'ĐÃ XONG') {
                            updatedProdItems.push({ ...p, status: 'Đã Huỷ' });
                        }
                    });
                });

                let payload = { orders: updatedOrders };
                if (updatedProdItems.length > 0) payload.prodItems = updatedProdItems;

                await pushDeltas(payload, `Đã chuyển ${updatedOrders.length} đơn sang Đơn Hủy và hủy các lệnh sản xuất liên quan!`, 'fa-ban');
                triggerToast(`Thành công! Đã chuyển ${updatedOrders.length} đơn sang Đơn Hủy.`, 'fa-check', 'success');
                onClose();
            } catch (err) { triggerToast('Lỗi đồng bộ!', 'fa-times', 'danger'); }
            setIsProcessing(false);
        };

        const confirmBulkAsReturn = async () => {

            try {
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();

                const updatedOrders = scannedOrders.map(o => ({ ...o, status: 'Hàng Hoàn', returnedAt: returnedAt, reconciledAt: o.reconciledAt || returnedAt }));

        };

            setUnmatchedCodes([]);

                            </div>

                            <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-3">

                                    <span><i className="fas fa-check-circle mr-1"></i> Khớp {scannedOrders.length} Đơn Hàng</span>
                                </div>
                                {scannedOrders.length > 0 ? (
                                    <div className="max-h-[140px] overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                                        {scannedOrders.map((o, idx) => (

                            <div className="flex flex-col gap-2 mt-1">

                                    {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG CẬP NHẬT TRẠNG THÁI...</> : `XÁC NHẬN ĐƯA ${scannedOrders.length} ĐƠN VỀ ĐƠN HỦY`}
                                </button>
                                <button onClick={confirmBulkAsReturn} disabled={isProcessing || scannedOrders.length === 0} className="w-full py-2.5 rounded-xl font-black text-[11px] tracking-wide border border-purple-500/50 bg-purple-950/40 text-purple-300 hover:bg-purple-900/60 hover:text-white flex items-center justify-center gap-1.5 transition-all active:scale-95 cursor-pointer">
                                    <i className="fas fa-undo"></i> CHUYỂN {scannedOrders.length} ĐƠN NÀY SANG HÀNG HOÀN
                                </button>
                            </div>
                        </div>
                    ) : (
                        <>

                            {/* Ô DÁN / NHẬP MÃ ĐƠN HOẶC DÙNG SÚNG BẮN MÃ */}
                            <div className="w-full flex flex-col items-center mb-1">
                                <div className="relative w-full">
                                    <input

                                    />

                                    <button
                                        onClick={handleManualCancel}
                                        disabled={isProcessing || !scanVal.trim()}

    function ArchiveEngineModal({ onClose, triggerToast }) {
        const [cutoffDays, setCutoffDays] = React.useState(60);
        const [isArchiving, setIsArchiving] = React.useState(false);
        const [isSettingTrigger, setIsSettingTrigger] = React.useState(false);
        const [stats, setStats] = React.useState(null);
        const [isLoadingStats, setIsLoadingStats] = React.useState(true);

        const loadStats = React.useCallback(async () => {
            setIsLoadingStats(true);
            try {
                if (typeof runGAS === 'function') {
                    const pin = localStorage.getItem('rf_pin') || '';
                    const res = await runGAS('getArchiveStats', { pin: pin });
                    if (res && res.success) {
                        setStats(res);
                    }
                }
            } catch (e) {
                console.error("Lỗi nạp Archive Stats:", e);
            } finally {
                setIsLoadingStats(false);
            }
        }, []);

        React.useEffect(() => {
            loadStats();
        }, [loadStats]);

        const handleRunArchive = async () => {
            if (!window.confirm(`Bạn có chắc chắn muốn chuyển toàn bộ đơn hàng đã hoàn tất / đối soát cũ hơn ${cutoffDays} ngày sang bảng lưu trữ Orders_Archive?\n\nThao tác này giúp giải phóng bộ nhớ RAM và duy trì thời gian tải ứng dụng < 1.5 giây.`)) {
                return;
            }
            setIsArchiving(true);
            triggerToast(`Đang quét nén và chuyển đơn cũ > ${cutoffDays} ngày sang Orders_Archive...`, 'fa-spinner fa-spin', 'info');
            try {
                if (typeof runGAS === 'function') {
                    const pin = localStorage.getItem('rf_pin') || '';
                    const res = await runGAS('archiveReconciledOrders', { cutoffDays: parseInt(cutoffDays, 10), pin: pin });
                    if (res && res.success) {
                        triggerToast(res.message || `Đã chuyển ${res.movedCount || 0} đơn sang Orders_Archive!`, 'fa-check-circle', 'success');
                        window.dispatchEvent(new CustomEvent('triggerReloadData'));
                        loadStats();
                    } else {
                        triggerToast(res?.message || 'Lỗi xử lý lưu trữ đơn hàng!', 'fa-times', 'danger');
                    }
                } else {
                    triggerToast('Môi trường Dev: Chưa kết nối máy chủ Google Apps Script', 'fa-info-circle', 'warning');
                }
            } catch (err) {
                triggerToast('Lỗi kết nối khi lưu trữ: ' + (err?.message || err), 'fa-times', 'danger');
            } finally {
                setIsArchiving(false);
            }
        };

        const handleSetupTrigger = async () => {
            setIsSettingTrigger(true);
            try {
                if (typeof runGAS === 'function') {
                    const pin = localStorage.getItem('rf_pin') || '';
                    const res = await runGAS('setupAutoArchiveTrigger', { pin: pin });
                    if (res && res.success) {
                        triggerToast(res.message || 'Đã cài đặt Auto-Archive hàng đêm 02:00 AM!', 'fa-check-circle', 'success');
                        loadStats();
                    } else {
                        triggerToast(res?.message || 'Không thể cài đặt trigger tự động.', 'fa-times', 'danger');
                    }
                }
            } catch (err) {
                triggerToast('Lỗi cài đặt trigger: ' + (err?.message || err), 'fa-times', 'danger');
            } finally {
                setIsSettingTrigger(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">

                    {/* HEADER */}
                    <div className="flex justify-between items-center border-b border-white/[0.08] pb-3">
                        <div className="flex items-center gap-2.5">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#d4af37]/20 to-amber-600/10 flex items-center justify-center text-[#d4af37] border border-[#d4af37]/30 shadow-inner">

                    <div className="bg-[#09090b] border border-white/[0.08] rounded-xl p-3.5 space-y-2 text-[11px] leading-relaxed text-zinc-300">

                            >
                                <i className={isSettingTrigger ? "fas fa-spinner fa-spin" : "fas fa-bolt"}></i>

                        <p>
                            Đơn hàng hoàn tất (<strong className="text-white">Đối Soát Thành Công</strong>, <strong className="text-white">Đã Bàn Giao</strong>, <strong className="text-white">Đơn Huỷ</strong>) cũ hơn mốc thời gian sẽ tự động di chuyển sang <code className="text-[#d4af37] bg-white/[0.06] px-1 py-0.5 rounded font-mono">Orders_Archive</code>, giúp file vận hành chính duy trì dung lượng tối ưu, đảm bảo thời gian tải app <strong className="text-emerald-400">&lt; 1.5 giây</strong>.
