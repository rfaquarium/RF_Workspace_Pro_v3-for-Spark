    // -------------------------------------------------------------------------
    // 7. COMPONENT MODAL DUYỆT TRẠNG THÁI LỊCH NGHỈ & CHẤM CÔNG NHANH
    // -------------------------------------------------------------------------
    const LeaveManagementModal = React.memo(function LeaveManagementModal({
        leaveData,
        onClose,
        pushDeltas,
        triggerToast,
        currentUser
    }) {
        if (!leaveData) return null;
        const { user, date, attRecord } = leaveData;
        const currentStatus = String(attRecord?.status || 'Chưa điểm danh');
        const [status, setStatus] = React.useState(() => {
            if (currentStatus.includes('không phép')) return 'Nghỉ không phép';
            if (currentStatus.includes('có phép') || attRecord?.shift === 'Nghỉ Phép' || attRecord?.leaveType) return 'Nghỉ có phép';
            if (currentStatus.includes('Đi muộn')) return 'Đi muộn';
            if (currentStatus === 'Hoàn thành' || Number(attRecord?.totalHours) > 0) return 'Hoàn thành';
            return currentStatus;
        });
        const [penalty, setPenalty] = React.useState(() => Number(attRecord?.penalty || 0));
        const [note, setNote] = React.useState(() => String(attRecord?.note || ''));
        const [isSaving, setIsSaving] = React.useState(false);

        const handleSelectStatus = (newSt) => {
            setStatus(newSt);
            if (newSt === 'Nghỉ có phép' || newSt === 'Hoàn thành') {
                setPenalty(0);
            } else if (newSt === 'Nghỉ không phép') {
                setPenalty(200000);
            } else if (newSt === 'Đi muộn') {
                if (penalty === 0) setPenalty(50000);
            }
        };

        const handleSave = async () => {
            setIsSaving(true);
            const attId = attRecord?.id || `ATT_${user}_${date.replace(/-/g, '')}`;
            const isLeave = status.includes('Nghỉ');
            const leaveTypeVal = status.includes('có phép') ? 'Có phép' : (status.includes('không phép') ? 'Không phép' : (isLeave ? 'Nghỉ Phép' : ''));
            const preservedShift = (attRecord?.shift && attRecord.shift !== 'Nghỉ Phép') ? attRecord.shift : (attRecord?.leaveShift || 'Cả Ngày');

            const updatedAtt = {
                id: attId,
                user: user,
                date: date,
                status: status,
                penalty: Number(penalty) || 0,
                note: note,
                isEdited: true,
                leaveType: leaveTypeVal,
                shift: isLeave ? preservedShift : (attRecord?.shift || 'Sáng'),
                timeIn: isLeave ? '' : (attRecord?.timeIn || '08:00'),
                timeOut: isLeave ? '' : (attRecord?.timeOut || '17:00'),
                totalHours: isLeave ? 0 : (attRecord?.totalHours || 8)
            };

            const deltas = { Attendance: [updatedAtt] };

            if (Number(penalty) > 0) {
                deltas.BonusPenalty = [{
                    id: 'BP_PEN_' + Date.now(),
                    user: user,
                    amount: -Math.abs(Number(penalty)),
                    type: 'Phạt Quy Định',
                    note: note || `Phạt vi phạm ngày ${date} (${status})`,
                    date: date,
                    orderCode: ''
                }];
            }

            try {
                if (typeof window.runGAS === 'function') {
                    window.runGAS('api_updateLeaveStatus', attId, status, penalty, note);
                } else if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.api_updateLeaveStatus(attId, status, penalty, note);
                }
                if (pushDeltas) {
                    await pushDeltas(deltas, `Đã cập nhật trạng thái ${user} ngày ${date} thành "${status}"`, 'fa-calendar-check');
                }
                if (triggerToast) {
                    triggerToast(`Đã duyệt trạng thái "${status}" cho ${user}!`, 'fa-check', 'success');
                }
                onClose();
            } catch (e) {
                if (triggerToast) triggerToast('Lỗi cập nhật trạng thái!', 'fa-times', 'danger');
            } finally {
                setIsSaving(false);
            }
        };

        return (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
                <div className="bg-[#121214] border border-[#333] w-full max-w-md rounded-2xl p-5 shadow-2xl flex flex-col relative overflow-hidden">
                    <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-3">
                        <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                                <i className="fas fa-user-clock text-sm"></i>
                            </div>
                            <div>
                                <h3 className="font-black text-white text-[13px] uppercase tracking-wider">Duyệt Trạng Thái Chấm Công & Lịch Nghỉ</h3>
                                <div className="text-[10px] text-gray-400 font-bold">{user} • Ngày: <span className="text-amber-400 font-mono">{date}</span></div>
                            </div>
                        </div>
                        <button onClick={onClose} disabled={isSaving} className="w-7 h-7 rounded-lg bg-[#222] text-gray-400 hover:text-white flex items-center justify-center transition-colors"><i className="fas fa-times text-xs"></i></button>
                    </div>

                    <div className="space-y-3.5 text-[11px]">
                        {/* Chọn trạng thái nhanh */}
                        <div>
                            <label className="text-gray-400 font-bold block mb-1.5 uppercase text-[10px] tracking-wider">Chọn Trạng Thái Chấm Công / Lịch Nghỉ:</label>
                            <div className="grid grid-cols-2 gap-2">
                                <button
                                    type="button"
                                    onClick={() => handleSelectStatus('Nghỉ có phép')}
                                    className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all cursor-pointer ${status === 'Nghỉ có phép' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300 font-black shadow-[0_0_10px_rgba(6,182,212,0.2)]' : 'bg-[#121214] border-[#27272a] text-gray-400 hover:text-white'}`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                                    <span>Nghỉ có phép (P)</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => handleSelectStatus('Nghỉ không phép')}
                                    className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all cursor-pointer ${status === 'Nghỉ không phép' ? 'bg-rose-500/20 border-rose-500 text-rose-300 font-black shadow-[0_0_10px_rgba(244,63,94,0.2)]' : 'bg-[#121214] border-[#27272a] text-gray-400 hover:text-white'}`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                                    <span>Nghỉ không phép (KP)</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => handleSelectStatus('Hoàn thành')}
                                    className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all cursor-pointer ${status === 'Hoàn thành' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 font-black shadow-[0_0_10px_rgba(16,185,129,0.2)]' : 'bg-[#121214] border-[#27272a] text-gray-400 hover:text-white'}`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                    <span>Đi làm đủ (8h)</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => handleSelectStatus('Đi muộn')}
                                    className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all cursor-pointer ${status === 'Đi muộn' ? 'bg-amber-500/20 border-amber-500 text-amber-300 font-black shadow-[0_0_10px_rgba(245,158,11,0.2)]' : 'bg-[#121214] border-[#27272a] text-gray-400 hover:text-white'}`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                                    <span>Đi muộn (M)</span>
                                </button>
                            </div>
                        </div>

                        {/* Mức phạt vi phạm */}
                        <div>
                            <label className="text-gray-400 font-bold block mb-1 uppercase text-[10px] tracking-wider">Mức Phạt Vi Phạm (VNĐ):</label>
                            <div className="relative">
                                <input
                                    type="number"
                                    value={penalty}
                                    onChange={e => setPenalty(e.target.value)}
                                    className="w-full bg-[#0a0a0c] border border-[#27272a] focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-rose-400 font-black text-[13px] font-mono outline-none"
                                    placeholder="0"
                                />
                                <span className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 font-bold text-[10px]">VNĐ</span>
                            </div>
                        </div>

                        {/* Ghi chú */}
                        <div>
                            <label className="text-gray-400 font-bold block mb-1 uppercase text-[10px] tracking-wider">Lý Do / Ghi Chú Của Quản Lý:</label>
                            <textarea
                                rows="2"
                                value={note}
                                onChange={e => setNote(e.target.value)}
                                className="w-full bg-[#0a0a0c] border border-[#27272a] focus:border-amber-500 rounded-xl p-2.5 text-white text-[11px] outline-none"
                                placeholder="Ghi chú lý do nghỉ, đi muộn hoặc giải trình..."
                            />
                        </div>
                    </div>

                    <div className="flex gap-2 mt-5 pt-3 border-t border-[#222]">
                        <button type="button" onClick={onClose} disabled={isSaving} className="flex-1 py-2.5 bg-[#222] hover:bg-[#2a2a2a] text-gray-300 font-black rounded-xl text-[11px] transition-all cursor-pointer">HỦY</button>
                        <button type="button" onClick={handleSave} disabled={isSaving} className="flex-[2] py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-black font-black rounded-xl text-[11px] transition-all shadow-lg active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer">
                            {isSaving ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-check"></i>}
                            <span>LƯU & DUYỆT TRẠNG THÁI</span>
                        </button>
                    </div>
                </div>
            </div>
        );
    });

    // =========================================================================
    // 6. COMPONENT MODAL: LỊCH SỬ TÍCH LŨY EXP & ĐẠI SẢNH 100 CẤP ĐỘ QUÂN HÀM
    // =========================================================================
    const ExpHistoryRoadmapModal = React.memo(function ExpHistoryRoadmapModal({
        user,
        userConfigs,
        rawAttData,
        bpData,
        kpiData,
        safeProdItems,
        safePackings,
        erpData,
        onClose,
        formatMoney,
        renderSafeAvatar,
        getLevelColorStyle,
        get100LevelInfo
    }) {
        const [activeTab, setActiveTab] = React.useState('HISTORY'); // 'HISTORY' | 'ROADMAP'
        const [filterType, setFilterType] = React.useState('ALL'); // 'ALL' | 'ATT' | 'PROD' | 'PACK' | 'KPI' | 'XU'

        const u = user;
        const uRole = userConfigs?.titles?.[u] || 'Nhân Sự';

        // 1. NGUỒN CHẤM CÔNG & CHUYÊN CẦN
        const userAttRecords = (rawAttData || []).filter(a => matchUser(a.user, u));
        const userSal = userConfigs?.salaries?.[u] || userConfigs?.pins?.[u] || (userConfigs?.raw || []).find(ns => matchUser(ns['Tên Nhân Sự'] || ns.name, u)) || {};
        const rawBaseSalary = Number(userSal?.baseSalary || userSal?.['Lương Cơ Bản'] || 0);
        const baseHourlyRate = Number(userSal?.hourlyRate || (rawBaseSalary > 0 ? Math.round(rawBaseSalary / 208 / 1000) * 1000 : 20000)) || 20000;
        
        let totalAttHours = 0;
        const attLogs = [];
        userAttRecords.forEach(a => {
            const hrs = Number(a.totalHours) || ((a.morningIn && a.morningOut ? 4 : 0) + (a.afternoonIn && a.afternoonOut ? 4 : 0));
            if (hrs > 0) {
                totalAttHours += hrs;
                const earned = Math.round(hrs * baseHourlyRate);
                attLogs.push({
                    id: a.id || `ATT_${a.date}_${a.shift}`,
                    type: 'ATT',
                    sourceName: 'Chấm Công & Chuyên Cần',
                    title: `Ca ${a.shift || 'Làm việc'} - Ngày ${a.date ? a.date.split('-').reverse().join('/') : '---'}`,
                    subtitle: `${hrs} giờ làm việc (${a.timeIn || '--:--'} ➔ ${a.timeOut || '--:--'}) • Đơn giá: ${formatMoney(baseHourlyRate)}đ/h`,
                    date: a.date || '',
                    exp: earned,
                    icon: 'fa-user-clock',
                    color: 'text-sky-400',
                    badgeBg: 'bg-sky-500/10 border-sky-500/30 text-sky-400'
                });
            }
        });
        const totalAttendanceSalary = Math.round(totalAttHours * baseHourlyRate);

        // 2. NGUỒN SẢN XUẤT ĐẠT CHUẨN KCS
        let totalProdReward = 0;
        const prodLogs = [];
        (safeProdItems || []).forEach(item => {
            ['phase1', 'phase2'].forEach(phKey => {
                const ph = item?.phases?.[phKey];
                if (ph && ph.status === 'Done' && matchUser(ph.user, u)) {
                    const rwd = Number(ph.reward_vnd) || 0;
                    totalProdReward += rwd;
                    prodLogs.push({
                        id: `${item.id || item.orderId}_${phKey}`,
                        type: 'PROD',
                        sourceName: 'Sản Xuất Chuẩn KCS',
                        title: `${phKey === 'phase1' ? 'Khâu 1 (Cắt/Dán/Khung)' : 'Khâu 2 (Gia Cố/Gọt Keo)'}: ${item.name || item.sku || 'Lệnh SX'}`,
                        subtitle: `Mã đơn: ${item.orderCode || item.orderId || '---'} • Nghiệm thu đạt chuẩn KCS`,
                        date: ph.endTime || ph.start || item.createdAt || '',
                        exp: rwd,
                        icon: 'fa-hammer',
                        color: 'text-amber-400',
                        badgeBg: 'bg-amber-500/10 border-amber-500/30 text-amber-400'
                    });
                }
            });
        });

        // 3. NGUỒN ĐÓNG GÓI & XUẤT KHO
        const userPackings = (safePackings || erpData?.Packings || []).filter(p => matchUser(p.user, u) && (p.status === 'Done' || p.status === 'Đã đóng gói'));
        const packLogs = userPackings.map(p => {
            const rwd = Number(p.reward_vnd) || 0;
            return {
                id: p.id || `PACK_${p.orderId}`,
                type: 'PACK',
                sourceName: 'Đóng Gói & Xuất Kho',
                title: `Đóng gói kiện hàng: ${p.orderId || p.orderCode || 'Đơn hàng'}`,
                subtitle: `Hoàn tất kiểm tra 6 mặt & dán tem nhãn giao vận`,
                date: p.endTime || p.start || '',
                exp: rwd,
                icon: 'fa-box-open',
                color: 'text-emerald-400',
                badgeBg: 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
            };
        });
        const totalPackingReward = packLogs.reduce((sum, p) => sum + p.exp, 0);

        // 4. NGUỒN KPI ĐÃ CLAIM THƯỞNG
        const claimedKPIs = (kpiData || []).filter(k => matchUser(k.user, u) && (k.isClaimed === 'true' || k.isClaimed === true));
        const kpiVndList = claimedKPIs.filter(k => !(String(k.unit || '').toLowerCase() === 'xu' || String(k.id || '').startsWith('KPI_XU_')));
        const kpiLogs = kpiVndList.map(k => {
            const rwd = Number(k.reward) || 0;
            return {
                id: k.id,
                type: 'KPI',
                sourceName: 'Thưởng KPI Đạt Mốc',
                title: `KPI: ${k.kpiName}`,
                subtitle: `Chỉ tiêu đạt: ${k.target} ${k.unit || ''} • Nghiệm thu & duyệt thưởng`,
                date: k.lastUpdated || k.endTime || k.startTime || '',
                exp: rwd,
                icon: 'fa-trophy',
                color: 'text-purple-400',
                badgeBg: 'bg-purple-500/10 border-purple-500/30 text-purple-400'
            };
        });
        const totalKPIVnd = kpiLogs.reduce((sum, k) => sum + k.exp, 0);

        // 5. NGUỒN XU THƯỞNG & QUỸ TÍCH LŨY (TỪ THỐNG KÊ TÍCH LŨY XU, KPI VÀ BONUSPENALTY)
        const xuFromSheet = (erpData?.ThongKe_TichLuyXu || erpData?.xuTransactions || []).filter(x => matchUser(x.user, u)).map(x => ({
            id: String(x.id || `XU_${Math.random()}`),
            type: 'XU',
            sourceName: 'Quỹ Xu Tích Lũy',
            title: x.note || x.title || (x.type === 'XU_REWARD' ? 'Boss tặng xu khởi nghiệp' : 'Thưởng Xu Tích Lũy'),
            subtitle: x.orderCode ? `Gắn với đơn/nhiệm vụ: ${x.orderCode}` : `Thưởng cống hiến xưởng`,
            date: x.date || x.timestamp || '',
            exp: Number(x.amount_xu !== undefined && x.amount_xu !== '' ? x.amount_xu : (x.amount || 0)),
            icon: 'fa-coins',
            color: 'text-amber-300',
            badgeBg: 'bg-amber-500/15 border-amber-500/40 text-amber-300'
        }));

        const xuTasksKPI = claimedKPIs.filter(k => String(k.unit || '').toLowerCase() === 'xu' || String(k.id || '').startsWith('KPI_XU_')).map(k => ({
            id: String(k.id),
            type: 'XU',
            sourceName: 'Nhiệm Vụ Xu KPI',
            title: k.kpiName,
            subtitle: `Nhiệm vụ Xu hoàn thành`,
            date: k.lastUpdated || k.endTime || k.startTime || '',
            exp: Number(k.reward) || 0,
            icon: 'fa-coins',
            color: 'text-amber-300',
            badgeBg: 'bg-amber-500/15 border-amber-500/40 text-amber-300'
        }));

        const xuTasksBP = (bpData || []).filter(b => matchUser(b.user, u) && (b.type === 'XU_REWARD' || b.type === 'Thưởng Xu' || b.type === 'XU' || (String(b.note || '').toLowerCase().includes('xu') && !String(b.note || '').toLowerCase().includes('xuất')))).map(b => ({
            id: String(b.id),
            type: 'XU',
            sourceName: 'Nhiệm Vụ Xu Thưởng',
            title: b.note || 'Thưởng Xu Cống Hiến',
            subtitle: `Phần thưởng cống hiến xưởng`,
            date: b.date || '',
            exp: Number(b.amount) || 0,
            icon: 'fa-coins',
            color: 'text-amber-300',
            badgeBg: 'bg-amber-500/15 border-amber-500/40 text-amber-300'
        }));

        // Khử trùng lặp theo ID
        const seenModalXuIds = new Set();
        const xuLogs = [...xuFromSheet, ...xuTasksKPI, ...xuTasksBP].filter(x => {
            if (!x.id || seenModalXuIds.has(x.id)) return false;
            seenModalXuIds.add(x.id);
            return Number(x.exp) > 0;
        });
        const totalXu = xuLogs.reduce((sum, x) => sum + x.exp, 0);

        // TỔNG EXP VÀ LEVEL INFO
        const totalUserExp = totalAttendanceSalary + totalProdReward + totalPackingReward + totalKPIVnd + totalXu;
        const levelInfo = get100LevelInfo(totalUserExp);

        // DANH SÁCH TIMELINE GIAO DỊCH
        const allTimelineLogs = [...attLogs, ...prodLogs, ...packLogs, ...kpiLogs, ...xuLogs].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
        const filteredLogs = filterType === 'ALL' ? allTimelineLogs : allTimelineLogs.filter(x => x.type === filterType);

        // 9 BẬC QUÂN HÀM ĐỂ RENDER ĐẠI SẢNH
        const allTiers = [1, 10, 15, 20, 25, 30, 35, 40, 50].map(lvl => getLevelColorStyle(lvl));

        return (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-[9999] p-3 sm:p-5 backdrop-blur-md animate-fade-in">
                <div className="bg-[#0e1015] border border-zinc-700/70 w-full max-w-4xl max-h-[92vh] rounded-3xl shadow-2xl flex flex-col relative overflow-hidden">
                    {/* MODAL HEADER */}
                    <div className={`p-4 sm:p-6 border-b border-zinc-800 relative z-10 ${levelInfo.colorStyle.cardBg}`}>
                        {/* Corner Deco */}
                        {levelInfo.colorStyle.cornerDeco && (
                            <div className={`absolute top-0 right-0 w-8 h-8 ${levelInfo.colorStyle.cornerDeco} rounded-tr-3xl pointer-events-none`}></div>
                        )}

                        <div className="flex items-start justify-between gap-4">
                            <div className="flex items-center gap-3.5 sm:gap-4 min-w-0">
                                <div className="relative shrink-0">
                                    {renderSafeAvatar(u, `w-14 h-14 sm:w-16 sm:h-16 rounded-full ${levelInfo.colorStyle.avatarRing} shadow-2xl`)}
                                    <div className="absolute -bottom-1.5 -right-1.5 text-base sm:text-lg">
                                        {levelInfo.colorStyle.iconEmoji}
                                    </div>
                                </div>
                                <div className="min-w-0">
                                    {/* TÊN + PRESTIGE DUAL BADGE TO RÕ */}
                                    <div className="flex items-center gap-2.5 flex-wrap">
                                        <h2 className="font-black text-lg sm:text-2xl text-white tracking-wide uppercase truncate">
                                            {u}
                                        </h2>
                                        <div className="inline-flex items-center gap-1.5 p-0.5 bg-black/90 rounded-xl border border-white/20 shadow-md">
                                            <span className={`px-2.5 py-0.5 rounded-lg bg-zinc-950 border ${levelInfo.colorStyle.lvlBorder || 'border-amber-400'} text-white font-black text-xs sm:text-sm font-mono flex items-center gap-1`}>
                                                <span>{levelInfo.colorStyle.iconEmoji}</span>
                                                <span className="text-amber-300 font-black">CẤP {levelInfo.level}</span>
                                            </span>
                                            <span className={`px-2 py-0.5 rounded-lg font-black text-[10px] sm:text-[11px] uppercase tracking-wider ${levelInfo.colorStyle.tierPillStyle}`}>
                                                {levelInfo.colorStyle.tierLabel}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="text-xs text-zinc-400 font-semibold flex items-center gap-2 mt-1 flex-wrap">
                                        <span className="text-zinc-300">{uRole}</span>
                                        <span className="text-zinc-600">•</span>
                                        <span className="text-amber-400 font-bold">{levelInfo.title}</span>
                                        <span className="text-zinc-600">•</span>
                                        <span className="text-emerald-400 font-mono font-bold">Tổng EXP: {formatMoney(totalUserExp)}</span>
                                    </div>
                                </div>
                            </div>
                            <button
                                type="button"
                                onClick={onClose}
                                className="w-8 h-8 sm:w-9 sm:h-9 rounded-2xl bg-zinc-900/90 border border-zinc-700/80 text-zinc-400 hover:text-white hover:bg-zinc-800 flex items-center justify-center transition-all cursor-pointer shrink-0"
                            >
                                <i className="fas fa-times text-sm"></i>
                            </button>
                        </div>

                        {/* THANH TIẾN TRÌNH LÊN CẤP TIẾP THEO */}
                        <div className="mt-4 bg-black/70 p-3 rounded-2xl border border-white/10 shadow-inner">
                            <div className="flex justify-between items-center text-xs mb-1.5">
                                <span className={`font-mono font-black flex items-center gap-1.5 ${levelInfo.colorStyle.expText || "text-zinc-300"}`}>
                                    <i className="fas fa-bolt text-amber-400 animate-pulse"></i>
                                    <span>{formatMoney(levelInfo.expInLevel)} / {formatMoney(levelInfo.neededForNext)} EXP để lên Cấp {Math.min(100, levelInfo.level + 1)}</span>
                                </span>
                                <span className="font-bold text-amber-400">
                                    {levelInfo.progressPct.toFixed(1)}%
                                </span>
                            </div>
                            <div className="w-full h-3 bg-zinc-900 rounded-full overflow-hidden border border-white/5 relative">
                                <div
                                    className={`h-full bg-gradient-to-r ${levelInfo.colorStyle.bar} rounded-full transition-all duration-700 relative overflow-hidden`}
                                    style={{ width: `${Math.min(100, Math.max(2, levelInfo.progressPct))}%` }}
                                >
                                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent translate-x-[-100%] animate-[shine_1.5s_infinite]"></div>
                                </div>
                            </div>
                        </div>

                        {/* 2 MAIN TABS */}
                        <div className="flex gap-2 mt-4">
                            <button
                                type="button"
                                onClick={() => setActiveTab('HISTORY')}
                                className={`flex-1 py-2 px-3 rounded-xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all cursor-pointer ${activeTab === 'HISTORY' ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20' : 'bg-zinc-900/90 text-zinc-400 hover:text-white border border-zinc-800'}`}
                            >
                                <i className="fas fa-history"></i>
                                <span>Lịch Sử Tích Lũy EXP ({allTimelineLogs.length})</span>
                            </button>
                            <button
                                type="button"
                                onClick={() => setActiveTab('ROADMAP')}
                                className={`flex-1 py-2 px-3 rounded-xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all cursor-pointer ${activeTab === 'ROADMAP' ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20' : 'bg-zinc-900/90 text-zinc-400 hover:text-white border border-zinc-800'}`}
                            >
                                <i className="fas fa-crown"></i>
                                <span>Đại Sảnh 100 Cấp Độ & Quân Hàm</span>
                            </button>
                        </div>
                    </div>

                    {/* MODAL BODY */}
                    <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 space-y-5">
                        {activeTab === 'HISTORY' ? (
                            <>
                                {/* BENTO 5 NGUỒN CỐNG HIẾN */}
                                <div>
                                    <div className="text-[11px] font-black text-zinc-400 uppercase tracking-widest flex items-center gap-1.5 mb-3">
                                        <i className="fas fa-cubes text-amber-400"></i>
                                        <span>Bento 5 Nguồn Tích Lũy EXP Cống Hiến:</span>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5">
                                        {/* 1. Chấm công */}
                                        <div className="bg-[#12141a] p-3 rounded-2xl border border-sky-500/20 flex flex-col justify-between">
                                            <div className="flex items-center justify-between text-sky-400 text-xs mb-1">
                                                <i className="fas fa-user-clock text-base"></i>
                                                <span className="text-[9px] font-bold uppercase bg-sky-500/10 px-1.5 py-0.5 rounded">Chuyên cần</span>
                                            </div>
                                            <div>
                                                <div className="text-white font-black text-sm sm:text-base font-mono">{formatMoney(totalAttendanceSalary)}</div>
                                                <div className="text-[10px] text-zinc-400 font-semibold">{totalAttHours.toFixed(1)} giờ làm việc</div>
                                            </div>
                                        </div>

                                        {/* 2. Sản xuất */}
                                        <div className="bg-[#12141a] p-3 rounded-2xl border border-amber-500/20 flex flex-col justify-between">
                                            <div className="flex items-center justify-between text-amber-400 text-xs mb-1">
                                                <i className="fas fa-hammer text-base"></i>
                                                <span className="text-[9px] font-bold uppercase bg-amber-500/10 px-1.5 py-0.5 rounded">Khâu 1 & 2</span>
                                            </div>
                                            <div>
                                                <div className="text-white font-black text-sm sm:text-base font-mono">{formatMoney(totalProdReward)}</div>
                                                <div className="text-[10px] text-zinc-400 font-semibold">{prodLogs.length} lệnh hoàn tất KCS</div>
                                            </div>
                                        </div>

                                        {/* 3. Đóng gói */}
                                        <div className="bg-[#12141a] p-3 rounded-2xl border border-emerald-500/20 flex flex-col justify-between">
                                            <div className="flex items-center justify-between text-emerald-400 text-xs mb-1">
                                                <i className="fas fa-box-open text-base"></i>
                                                <span className="text-[9px] font-bold uppercase bg-emerald-500/10 px-1.5 py-0.5 rounded">Gói hàng</span>
                                            </div>
                                            <div>
                                                <div className="text-white font-black text-sm sm:text-base font-mono">{formatMoney(totalPackingReward)}</div>
                                                <div className="text-[10px] text-zinc-400 font-semibold">{packLogs.length} kiện xuất kho</div>
                                            </div>
                                        </div>

                                        {/* 4. KPI */}
                                        <div className="bg-[#12141a] p-3 rounded-2xl border border-purple-500/20 flex flex-col justify-between">
                                            <div className="flex items-center justify-between text-purple-400 text-xs mb-1">
                                                <i className="fas fa-trophy text-base"></i>
                                                <span className="text-[9px] font-bold uppercase bg-purple-500/10 px-1.5 py-0.5 rounded">KPI Tháng</span>
                                            </div>
                                            <div>
                                                <div className="text-white font-black text-sm sm:text-base font-mono">{formatMoney(totalKPIVnd)}</div>
                                                <div className="text-[10px] text-zinc-400 font-semibold">{kpiLogs.length} chỉ tiêu đạt mốc</div>
                                            </div>
                                        </div>

                                        {/* 5. Xu Thưởng */}
                                        <div className="bg-[#12141a] p-3 rounded-2xl border border-amber-500/30 flex flex-col justify-between col-span-2 sm:col-span-1">
                                            <div className="flex items-center justify-between text-amber-300 text-xs mb-1">
                                                <i className="fas fa-coins text-base"></i>
                                                <span className="text-[9px] font-bold uppercase bg-amber-500/20 px-1.5 py-0.5 rounded">Ví Xu</span>
                                            </div>
                                            <div>
                                                <div className="text-amber-300 font-black text-sm sm:text-base font-mono">{formatMoney(totalXu)} Xu</div>
                                                <div className="text-[10px] text-zinc-400 font-semibold">{xuLogs.length} lần nhận thưởng</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* FILTER CHIPS */}
                                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 custom-scrollbar text-[11px] font-black">
                                    <button
                                        type="button"
                                        onClick={() => setFilterType('ALL')}
                                        className={`px-3 py-1.5 rounded-xl transition-all cursor-pointer shrink-0 ${filterType === 'ALL' ? 'bg-zinc-200 text-black font-black' : 'bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800'}`}
                                    >
                                        Tất Cả ({allTimelineLogs.length})
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setFilterType('ATT')}
                                        className={`px-3 py-1.5 rounded-xl transition-all cursor-pointer shrink-0 flex items-center gap-1 ${filterType === 'ATT' ? 'bg-sky-500 text-black font-black' : 'bg-zinc-900 text-sky-400 hover:text-white border border-zinc-800'}`}
                                    >
                                        <i className="fas fa-user-clock text-[10px]"></i> Chấm Công ({attLogs.length})
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setFilterType('PROD')}
                                        className={`px-3 py-1.5 rounded-xl transition-all cursor-pointer shrink-0 flex items-center gap-1 ${filterType === 'PROD' ? 'bg-amber-500 text-black font-black' : 'bg-zinc-900 text-amber-400 hover:text-white border border-zinc-800'}`}
                                    >
                                        <i className="fas fa-hammer text-[10px]"></i> Sản Xuất ({prodLogs.length})
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setFilterType('PACK')}
                                        className={`px-3 py-1.5 rounded-xl transition-all cursor-pointer shrink-0 flex items-center gap-1 ${filterType === 'PACK' ? 'bg-emerald-500 text-black font-black' : 'bg-zinc-900 text-emerald-400 hover:text-white border border-zinc-800'}`}
                                    >
                                        <i className="fas fa-box-open text-[10px]"></i> Đóng Gói ({packLogs.length})
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setFilterType('KPI')}
                                        className={`px-3 py-1.5 rounded-xl transition-all cursor-pointer shrink-0 flex items-center gap-1 ${filterType === 'KPI' ? 'bg-purple-500 text-white font-black' : 'bg-zinc-900 text-purple-400 hover:text-white border border-zinc-800'}`}
                                    >
                                        <i className="fas fa-trophy text-[10px]"></i> KPI Tháng ({kpiLogs.length})
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setFilterType('XU')}
                                        className={`px-3 py-1.5 rounded-xl transition-all cursor-pointer shrink-0 flex items-center gap-1 ${filterType === 'XU' ? 'bg-amber-400 text-black font-black' : 'bg-zinc-900 text-amber-300 hover:text-white border border-zinc-800'}`}
                                    >
                                        <i className="fas fa-coins text-[10px]"></i> Nhiệm Vụ Xu ({xuLogs.length})
                                    </button>
                                </div>

                                {/* TIMELINE GIAO DỊCH EXP */}
                                <div className="space-y-2">
                                    {filteredLogs.length === 0 ? (
                                        <div className="text-center py-10 text-zinc-500 font-bold text-xs bg-[#12141a] rounded-2xl border border-zinc-800">
                                            Chưa có dữ liệu tích lũy EXP trong danh mục này.
                                        </div>
                                    ) : (
                                        filteredLogs.map((log, idx) => (
                                            <div
                                                key={log.id || idx}
                                                className="bg-[#12141a] hover:bg-[#161922] p-3 rounded-2xl border border-zinc-800/80 flex items-center justify-between gap-3 transition-all"
                                            >
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 border ${log.badgeBg}`}>
                                                        <i className={`fas ${log.icon} text-sm`}></i>
                                                    </div>
                                                    <div className="min-w-0">
                                                        <div className="text-xs font-black text-white truncate">
                                                            {log.title}
                                                        </div>
                                                        <div className="text-[10px] text-zinc-400 truncate mt-0.5">
                                                            {log.subtitle}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="text-right shrink-0">
                                                    <div className="font-mono font-black text-xs sm:text-sm text-emerald-400">
                                                        +{formatMoney(log.exp)} EXP
                                                    </div>
                                                    <div className="text-[9.5px] text-zinc-500 mt-0.5">
                                                        {log.date ? (log.date.includes('T') ? log.date.split('T')[0] : log.date) : '---'}
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </>
                        ) : (
                            /* TAB 2: ĐẠI SẢNH 100 CẤP ĐỘ & 9 BẬC QUÂN HÀM */
                            <div className="space-y-4">
                                <div className="text-[11px] font-black text-zinc-400 uppercase tracking-widest flex items-center gap-1.5">
                                    <i className="fas fa-award text-amber-400"></i>
                                    <span>Hệ Thống 9 Bậc Quân Hàm & Lộ Trình 100 Cấp Độ Cống Hiến (Max 2 Tỷ EXP):</span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
                                    {allTiers.map((t) => {
                                        const isCurrentTier = Math.floor((levelInfo.level - 1) / 5) === t.tier;
                                        return (
                                            <div
                                                key={t.tier}
                                                className={`p-4 rounded-2xl border transition-all relative overflow-hidden flex flex-col justify-between ${t.cardBg} ${isCurrentTier ? "ring-2 ring-amber-400 shadow-[0_0_30px_rgba(251,191,36,0.3)] scale-[1.02]" : "border-zinc-800 opacity-80 hover:opacity-100"}`}
                                            >
                                                {/* Corner Bracket */}
                                                {t.cornerDeco && (
                                                    <div className={`absolute top-0 right-0 w-6 h-6 ${t.cornerDeco} rounded-tr-2xl pointer-events-none`}></div>
                                                )}

                                                <div>
                                                    <div className="flex items-center justify-between gap-2 mb-2">
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xl">{t.iconEmoji}</span>
                                                            <div>
                                                                <span className={`text-[10px] font-black px-2 py-0.5 rounded-full uppercase ${t.badge}`}>
                                                                    BẬC {t.tier + 1} • {t.tierLabel}
                                                                </span>
                                                                <h4 className="font-black text-sm text-white mt-1">
                                                                    {t.tierTitle}
                                                                </h4>
                                                            </div>
                                                        </div>
                                                        {isCurrentTier && (
                                                            <span className="bg-amber-500 text-black text-[9px] font-black px-2 py-0.5 rounded-full uppercase shadow-md animate-pulse">
                                                                📍 BẬC CỦA BẠN
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div className="space-y-1.5 my-3 text-[11px]">
                                                        <div className="flex justify-between text-zinc-300">
                                                            <span className="text-zinc-500">Phạm vi cấp:</span>
                                                            <span className="font-black text-amber-300">{t.levelRange}</span>
                                                        </div>
                                                        <div className="flex justify-between text-zinc-300">
                                                            <span className="text-zinc-500">Yêu cầu EXP:</span>
                                                            <span className="font-mono font-bold text-emerald-400">{t.expRangeText}</span>
                                                        </div>
                                                    </div>

                                                    <p className="text-[10.5px] text-zinc-400 leading-relaxed italic border-t border-white/5 pt-2">
                                                        "{t.desc}"
                                                    </p>
                                                </div>

                                                <div className="w-full h-1.5 bg-black/60 rounded-full overflow-hidden mt-3">
                                                    <div className={`h-full bg-gradient-to-r ${t.bar} w-full`}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODAL FOOTER */}
                    <div className="p-4 border-t border-zinc-800 bg-[#090a0d] flex items-center justify-between text-xs">
                        <div className="text-zinc-400 text-[11px]">
                            <i className="fas fa-shield-alt text-amber-400 mr-1"></i> Hệ thống EXP tự động cập nhật theo thời gian thực từ 5 nguồn cống hiến.
                        </div>
                        <button
                            type="button"
                            onClick={onClose}
                            className="px-5 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white font-black uppercase text-[11px] transition-all cursor-pointer"
                        >
                            ĐÓNG
                        </button>
                    </div>
                </div>
            </div>
        );
    });
</script>
