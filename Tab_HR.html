<script type="text/babel">
    // =========================================================================
    // 👥 FILE: Tab_HR.txt
    // CHỨC NĂNG: Trung Tâm Nhân Sự (Chấm Công, Giao Việc KPI, Bảng Lương)
    // NÂNG CẤP: Lọc thời gian theo Tháng (Tùy chỉnh) & Phân quyền RBAC CHUẨN CHỈ
    // =========================================================================
    const matchUser = (u1, u2) => {
        if (!u1 || !u2) return false;
        const s1 = String(u1).toLowerCase().trim();
        const s2 = String(u2).toLowerCase().trim();
        if (s1 === s2) return true;

        const nonUserTerms = [
            'tiền mặt', 'tien mat', 'tiền gửi', 'tien gui', 'ngân hàng', 'ngan hang', 
            'chuyển khoản', 'chuyen khoan', 'công nợ', 'cong no', 'chi phí', 'chi phi', 
            'kho tổng', 'kho layout', 'kho bể kính', 'shopee', 'tiktok', 'ghn', 'viettel',
            'quỹ phát triển', 'quỹ lương', 'tài khoản'
        ];
        if (nonUserTerms.some(t => s1 === t || s1.startsWith(t) || s2 === t)) return false;

        const words1 = s1.split(/\s+/);
        const words2 = s2.split(/\s+/);
        if (words1.length === 1 && words2.includes(words1[0])) return true;
        if (words2.length === 1 && words1.includes(words2[0])) return true;
        if (s1.includes(s2) || s2.includes(s1)) return true;

        const stripAccents = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
        const hasAcc1 = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(s1);
        const hasAcc2 = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(s2);
        if (hasAcc1 && hasAcc2) return false;

        const c1 = stripAccents(s1);
        const c2 = stripAccents(s2);
        if (c1 === c2) return true;

        const w1 = c1.split(/\s+/);
        const w2 = c2.split(/\s+/);
        if (w1.length === 1 && w2.includes(w1[0])) return true;
        if (w2.length === 1 && w1.includes(w2[0])) return true;
        if (c1.includes(c2) || c2.includes(c1)) return true;

        return false;
    };

    const formatDR = (s, e) => {
        if (!s && !e) return '';
        const f = d => d ? d.substring(5, 10).split('-').reverse().join('/') : '';
        if (s && e && s === e) return f(s);
        if (s && e) return `${f(s)} - ${f(e)}`;
        return f(s || e);
    };

    const HRTab = React.memo(function HRTab({ orders: propOrders, documents, hasPerm: propHasPerm, attendance, erpData, userConfigs, prodItems, packings, pushDeltas, triggerToast, isAdmin: propIsAdmin, isBoss: propIsBoss }) {
        const currentUser = localStorage.getItem('rf_user') || '';
        const currentRole = localStorage.getItem('rf_role') || '';
        const isAdmin = propIsAdmin !== undefined ? propIsAdmin : (localStorage.getItem('rf_admin') === 'true');
        const isBoss = propIsBoss !== undefined ? propIsBoss : (localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO' || currentUser.includes('Tiến'));

        const hasPerm = React.useCallback((actionCode) => {
            if (isBoss || currentRole === 'TỐI CAO') return true;
            if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
            if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
            return isAdmin;
        }, [propHasPerm, currentRole, currentUser, isAdmin, isBoss]);

        // PHÂN QUYỀN CHUẨN CHỈ THEO MA TRẬN BOSS TIẾN ĐÃ CHỐT
        const canEditAttendance = hasPerm('HR_EDIT_ATTENDANCE'); // Chỉ Tiến & Tâm
        const canManagePayroll = hasPerm('HR_PAY_SALARY_ADVANCE'); // Chỉ Tiến & Trang
        const canPenalize = hasPerm('HR_BONUS_PENALTY'); // Tiến, Dương, Tâm, Hương, Trang
        const canPrintPayslip = hasPerm('HR_PRINT_PAYSLIP'); // Tiến, Tâm, Trang
        const canViewAllSalaries = hasPerm('HR_VIEW_TOTAL_PAYROLL'); // Tất cả nhân sự nội bộ
        const canEditKpi = hasPerm('HR_EDIT_KPI_TARGET'); // Chỉ Tiến
        const canConfigStaff = hasPerm('HR_CONFIG_STAFF'); // Chỉ Tiến

        const cleanNumber = (val) => {
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            if (val === undefined || val === null || val === '') return 0;
            const str = String(val).trim();
            if (!str) return 0;
            if (/^\d{1,3}([.,]\d{3})+([.,]\d+)?$/.test(str)) {
                const parts = str.split(/[.,]/);
                if (parts[parts.length - 1].length === 3) {
                    return Number(str.replace(/[.,]/g, '')) || 0;
                } else {
                    const intPart = parts.slice(0, -1).join('');
                    const decPart = parts[parts.length - 1];
                    return Number(`${intPart}.${decPart}`) || 0;
                }
            }
            const normalized = str.replace(/,/g, '.').replace(/[^\d.-]/g, '');
            const num = parseFloat(normalized);
            return isNaN(num) ? 0 : num;
        };
        const formatMoney = (val) => {
            const num = cleanNumber(val);
            return Math.ceil(num).toLocaleString('vi-VN');
        };


        const [openSection, setOpenSection] = React.useState({});
        const toggleSection = (user, section, e) => {
            if (e) e.stopPropagation();
            setOpenSection(prev => ({ ...prev, [`${user}_${section}`]: !prev[`${user}_${section}`] }));
        };

        const [expandedKPIs, setExpandedKPIs] = React.useState({});
        const toggleKPIExpand = (user) => setExpandedKPIs(prev => ({ ...prev, [user]: !prev[user] }));
        const [userInnerTab, setUserInnerTab] = React.useState({});

        const [subTab, setSubTab] = React.useState('ATTENDANCE');
        const [attViewMode, setAttViewMode] = React.useState('CARDS'); // 'CARDS' | 'MATRIX'
        const [editingLeave, setEditingLeave] = React.useState(null);
        const [expModalUser, setExpModalUser] = React.useState(null); // Quản lý modal lịch sử EXP & lộ trình cấp độ
        const [hideResigned, setHideResigned] = React.useState(() => {
            return localStorage.getItem('rf_hr_hide_resigned') !== 'false';
        });
        const [hiddenStaffList, setHiddenStaffList] = React.useState(() => {
            try {
                return JSON.parse(localStorage.getItem('rf_hr_hidden_staff_list') || '[]');
            } catch (e) { return []; }
        });
        const [isSyncingKpi, setIsSyncingKpi] = React.useState(false);

        const toggleHideResigned = () => {
            setHideResigned(prev => {
                const next = !prev;
                localStorage.setItem('rf_hr_hide_resigned', String(next));
                if (next) {
                    triggerToast('Đã BẬT bộ lọc: Ẩn nhân sự đã nghỉ việc / ẩn', 'fa-eye-slash', 'info');
                } else {
                    triggerToast('Đã TẮT bộ lọc: Hiển thị toàn bộ nhân sự', 'fa-eye', 'warning');
                }
                return next;
            });
        };

        const toggleStaffHidden = (u, e) => {
            if (e) e.stopPropagation();
            if (!u) return;
            const uNorm = String(u).trim();
            setHiddenStaffList(prev => {
                const isCurrentlyHidden = (prev || []).some(x => String(x).toLowerCase().trim() === uNorm.toLowerCase());
                let next;
                if (isCurrentlyHidden) {
                    next = (prev || []).filter(x => String(x).toLowerCase().trim() !== uNorm.toLowerCase());
                    triggerToast(`Đã hiện lại nhân sự: ${uNorm}`, 'fa-eye', 'info');
                } else {
                    next = [...(prev || []).filter(x => String(x).toLowerCase().trim() !== uNorm.toLowerCase()), uNorm];
                    triggerToast(`Đã ẩn nhân sự: ${uNorm}`, 'fa-eye-slash', 'warning');
                }
                localStorage.setItem('rf_hr_hidden_staff_list', JSON.stringify(next));
                return next;
            });
        };

        const isStaffResignedOrInactive = React.useCallback((u) => {
            if (!u) return false;
            const uNorm = String(u).toLowerCase().trim();

            // 1. Kiểm tra nếu trong tên có ghi chú nghỉ việc / tạm ngưng
            if (uNorm.includes('nghỉ') || uNorm.includes('thôi việc') || uNorm.includes('(off)') || uNorm.includes('[off]') || uNorm.includes('tạm nghỉ') || uNorm.includes('cựu')) {
                return true;
            }

            // 2. Tra cứu từ userConfigs (hỗ trợ match linh hoạt nếu u không khớp 100% key)
            let role = '';
            let title = '';
            let subTitle = '';

            if (userConfigs?.roles) {
                if (userConfigs.roles[u]) {
                    role = String(userConfigs.roles[u]);
                } else {
                    const matchedKey = Object.keys(userConfigs.roles).find(k => String(k).toLowerCase().trim() === uNorm || uNorm.includes(String(k).toLowerCase().trim()) || String(k).toLowerCase().trim().includes(uNorm));
                    if (matchedKey) role = String(userConfigs.roles[matchedKey]);
                }
            }
            if (userConfigs?.titles) {
                if (userConfigs.titles[u]) {
                    title = String(userConfigs.titles[u]);
                } else {
                    const matchedKey = Object.keys(userConfigs.titles).find(k => String(k).toLowerCase().trim() === uNorm || uNorm.includes(String(k).toLowerCase().trim()) || String(k).toLowerCase().trim().includes(uNorm));
                    if (matchedKey) title = String(userConfigs.titles[matchedKey]);
                }
            }
            if (userConfigs?.subTitles) {
                if (userConfigs.subTitles[u]) {
                    subTitle = String(userConfigs.subTitles[u]);
                } else {
                    const matchedKey = Object.keys(userConfigs.subTitles).find(k => String(k).toLowerCase().trim() === uNorm || uNorm.includes(String(k).toLowerCase().trim()) || String(k).toLowerCase().trim().includes(uNorm));
                    if (matchedKey) subTitle = String(userConfigs.subTitles[matchedKey]);
                }
            }

            const roleUpper = role.toUpperCase().trim();
            const titleLower = title.toLowerCase().trim();
            const subTitleLower = subTitle.toLowerCase().trim();

            const isExplicitResigned = 
                roleUpper.includes('NGHỈ') || 
                roleUpper.includes('THÔI VIỆC') || 
                roleUpper.includes('OFF') || 
                roleUpper.includes('TẠM DỪNG') || 
                roleUpper === 'KHÁCH' ||
                roleUpper === 'INACTIVE' ||
                roleUpper === 'RESIGNED' ||
                titleLower.includes('nghỉ') || 
                titleLower.includes('thôi việc') || 
                titleLower.includes('tạm nghỉ') || 
                titleLower.includes('cựu') ||
                titleLower.includes('off') ||
                subTitleLower.includes('nghỉ') || 
                subTitleLower.includes('thôi việc') || 
                subTitleLower.includes('tạm nghỉ') ||
                subTitleLower.includes('cựu') ||
                subTitleLower.includes('off');

            // 3. Kiểm tra danh sách người dùng đã chủ động bấm nút ẩn mắt
            const isManuallyHidden = (hiddenStaffList || []).some(x => {
                const xNorm = String(x).toLowerCase().trim();
                return xNorm === uNorm || uNorm.includes(xNorm) || xNorm.includes(uNorm);
            });

            return Boolean(isExplicitResigned || isManuallyHidden);
        }, [userConfigs, hiddenStaffList]);

        const [filter, setFilter] = React.useState('Tháng Này');
        const [customMonth, setCustomMonth] = React.useState(() => new Date().toISOString().slice(0, 7)); // Format YYYY-MM
        const currentDate = new Date().toISOString().split('T')[0];

        const isDateInRange = (dateStr, filterStr = filter, customM = customMonth) => {
            if (!dateStr) return true; // Nếu không có ngày, mặc định hiển thị
            const today = new Date();
            let targetYM = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            if (filterStr === 'Tháng Trước') {
                const prev = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                targetYM = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
            } else if (filterStr === 'Tuỳ Chỉnh' || filterStr === 'Chọn Tháng') {
                if (!customM) return true;
                targetYM = customM.substring(0, 7);
            }

            const str = String(dateStr).trim();
            if (str.includes(targetYM)) return true;

            const curYear = today.getFullYear();
            let parsedYM = '';

            if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 3) {
                    const y = parts[2].length === 4 ? parts[2] : parts[0];
                    const m = parts[2].length === 4 ? parts[1] : parts[1];
                    parsedYM = `${y}-${String(m).padStart(2, '0')}`;
                } else if (parts.length === 2) {
                    if (parts[1].length === 4) {
                        parsedYM = `${parts[1]}-${String(parts[0]).padStart(2, '0')}`;
                    } else {
                        parsedYM = `${curYear}-${String(parts[1]).padStart(2, '0')}`;
                    }
                }
            } else if (str.includes('-')) {
                const parts = str.split('-');
                if (parts.length >= 2) {
                    if (parts[0].length === 4) {
                        parsedYM = `${parts[0]}-${String(parts[1]).padStart(2, '0')}`;
                    } else if (parts[2] && parts[2].length === 4) {
                        parsedYM = `${parts[2]}-${String(parts[1]).padStart(2, '0')}`;
                    }
                }
            }

            if (parsedYM) {
                return parsedYM === targetYM;
            }

            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return true;
            const dYM = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            return dYM === targetYM;
        };

        // 🎯 HÀM KIỂM TRA CHÍNH XÁC KPI CÓ THUỘC THÁNG ĐƯỢC CHỌN KHÔNG (CÔ LẬP 100% THEO THÁNG)
        const isKpiInSelectedMonth = React.useCallback((k, filterStr = filter, customM = customMonth) => {
            if (!k) return false;
            
            // 1. Xác định tháng mục tiêu YYYY-MM
            const today = new Date();
            let targetYM = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            if (filterStr === 'Tháng Trước') {
                const prev = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                targetYM = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
            } else if (filterStr === 'Tuỳ Chỉnh' || filterStr === 'Chọn Tháng') {
                if (customM) targetYM = customM.substring(0, 7);
            }

            // Tính ngày đầu tháng và ngày cuối tháng mục tiêu (YYYY-MM-DD)
            const [tY, tM] = targetYM.split('-').map(Number);
            const startOfTargetMonth = `${targetYM}-01`;
            const lastDayNum = new Date(tY, tM, 0).getDate();
            const endOfTargetMonth = `${targetYM}-${String(lastDayNum).padStart(2, '0')}`;

            // Helper chuẩn hóa ngày bất kỳ sang YYYY-MM-DD
            const parseToYMD = (d, isEnd = false) => {
                if (!d) return '';
                let str = String(d).trim().split(' ')[0].split('T')[0];
                const curYear = today.getFullYear();
                if (str.includes('/')) {
                    const parts = str.split('/');
                    if (parts.length === 3) {
                        if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                    } else if (parts.length === 2) {
                        if (parts[1].length === 4) {
                            const m = parseInt(parts[0], 10);
                            const y = parseInt(parts[1], 10);
                            if (isEnd) {
                                const ld = new Date(y, m, 0).getDate();
                                return `${y}-${String(m).padStart(2, '0')}-${String(ld).padStart(2, '0')}`;
                            }
                            return `${y}-${String(m).padStart(2, '0')}-01`;
                        }
                        return `${curYear}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                    }
                } else if (str.includes('-')) {
                    const parts = str.split('-');
                    if (parts.length === 3) {
                        if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                        if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                    } else if (parts.length === 2) {
                        if (parts[0].length === 4) {
                            const y = parseInt(parts[0], 10);
                            const m = parseInt(parts[1], 10);
                            if (isEnd) {
                                const ld = new Date(y, m, 0).getDate();
                                return `${y}-${String(m).padStart(2, '0')}-${String(ld).padStart(2, '0')}`;
                            }
                            return `${parts[0]}-${parts[1].padStart(2, '0')}-01`;
                        }
                        return `${curYear}-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
                    }
                }
                return str;
            };

            const kStart = parseToYMD(k.startTime, false);
            const kEnd = parseToYMD(k.endTime, true);

            // 2. Logic kiểm tra khoảng giao nhau (Interval Overlap)
            if (kStart && kEnd) {
                // Giao nhau giữa [kStart, kEnd] và [startOfTargetMonth, endOfTargetMonth]
                return kStart <= endOfTargetMonth && kEnd >= startOfTargetMonth;
            } else if (kStart) {
                return kStart.slice(0, 7) === targetYM;
            } else if (kEnd) {
                return kEnd.slice(0, 7) === targetYM;
            } else if (k.date) {
                const kDate = parseToYMD(k.date, false);
                return kDate.slice(0, 7) === targetYM;
            } else if (k.createdAt) {
                const kCreated = parseToYMD(k.createdAt, false);
                return kCreated.slice(0, 7) === targetYM;
            }

            // Nếu không có bất kỳ thông tin ngày tháng nào, chỉ cho phép hiện ở Tháng Hiện Tại
            const currentYM = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            return targetYM === currentYM;
        }, [filter, customMonth]);

        const effectiveMonthStr = (filter === 'Tuỳ Chỉnh' || filter === 'Chọn Tháng') 
            ? (customMonth || new Date().toISOString().slice(0, 7)) 
            : (filter === 'Tháng Trước' 
                ? (() => { const d = new Date(); d.setMonth(d.getMonth() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; })() 
                : new Date().toISOString().slice(0, 7)
            );
        const filterMonth = effectiveMonthStr;
        const periodLabel = (filter === 'Tuỳ Chỉnh' || filter === 'Chọn Tháng') ? (customMonth ? `Tháng ${customMonth.split('-')[1]}/${customMonth.split('-')[0]}` : filter) : filter;

        // Ép ngày nhập tay vào đúng với kỳ lương đang xem để data không bay sang tháng sau
        const payrollTargetDate = React.useMemo(() => {
            if (filter === 'Tháng Trước') {
                const d = new Date(); d.setMonth(d.getMonth() - 1);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-28`;
            }
            if (filter === 'Tuỳ Chỉnh' || filter === 'Chọn Tháng') return `${customMonth || new Date().toISOString().slice(0, 7)}-28`;
            return currentDate;
        }, [filter, customMonth, currentDate]);

        const users = userConfigs?.users || [];
        const rawAttData = attendance || [];
        const bpData = erpData?.BonusPenalty || [];
        const kpiData = erpData?.KPI_Progress || [];
        const xuSheetData = erpData?.ThongKe_TichLuyXu || erpData?.xuTransactions || [];
        const safeProdItems = prodItems || [];
        const safePackings = packings || [];
        const orders = propOrders || erpData?.Orders || erpData?.orders || [];

        // HÀM SO KHỚP TÊN NHÂN SỰ TOÀN DIỆN (Hỗ trợ họ tên đầy đủ & tên gọi)
        const matchUser = (u1, u2) => {
            if (!u1 || !u2) return false;
            const s1 = String(u1).toLowerCase().trim();
            const s2 = String(u2).toLowerCase().trim();
            if (s1 === s2) return true;

            const nonUserTerms = [
                'tiền mặt', 'tien mat', 'tiền gửi', 'tien gui', 'ngân hàng', 'ngan hang', 
                'chuyển khoản', 'chuyen khoan', 'công nợ', 'cong no', 'chi phí', 'chi phi', 
                'kho tổng', 'kho layout', 'kho bể kính', 'shopee', 'tiktok', 'ghn', 'viettel',
                'quỹ phát triển', 'quỹ lương', 'tài khoản'
            ];
            if (nonUserTerms.some(t => s1 === t || s1.startsWith(t) || s2 === t)) return false;

            const words1 = s1.split(/\s+/);
            const words2 = s2.split(/\s+/);
            if (words1.length === 1 && words2.includes(words1[0])) return true;
            if (words2.length === 1 && words1.includes(words2[0])) return true;
            if (s1.includes(s2) || s2.includes(s1)) return true;

            const stripAccents = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
            const hasAcc1 = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(s1);
            const hasAcc2 = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(s2);
            if (hasAcc1 && hasAcc2) return false;

            const c1 = stripAccents(s1);
            const c2 = stripAccents(s2);
            if (c1 === c2) return true;

            const w1 = c1.split(/\s+/);
            const w2 = c2.split(/\s+/);
            if (w1.length === 1 && w2.includes(w1[0])) return true;
            if (w2.length === 1 && w1.includes(w2[0])) return true;
            if (c1.includes(c2) || c2.includes(c1)) return true;

            return false;
        };

        // O(1) FAST LOOKUP MAP FOR ORDERS (Prevents UI freezing / lag on render)
        const orderLookupMap = React.useMemo(() => {
            const map = new Map();
            (orders || []).forEach(o => {
                if (!o) return;

        const get100LevelInfo = (totalExp) => {
            const exp = Math.max(0, Number(totalExp) || 0);
            const MAX_EXP = 2000000000; // 2 Tỷ EXP (Lũy tiến 20 năm cống hiến)

            const getExpForLevel = (l) => {
                if (l <= 1) return 0;
                if (l >= 100) return MAX_EXP;
                // Càng lên cao càng cần nhiều EXP (Số mũ 2.35 lũy tiến chuẩn RPG)
                return Math.round(MAX_EXP * Math.pow((l - 1) / 99, 2.35));
            };

            if (exp >= MAX_EXP) {
                return {
                    level: 100,
                    currentBaseExp: MAX_EXP,
                    nextBaseExp: MAX_EXP,
                    expInLevel: 0,
                    neededForNext: 0,
                    progressPct: 100,
                    title: 'TỐI CAO GRANDMASTER',
                    colorStyle: getLevelColorStyle(100),
                    totalExp: exp
                };
            }

            let level = Math.floor(Math.pow(exp / MAX_EXP, 1 / 2.35) * 99) + 1;
            level = Math.max(1, Math.min(99, level));

            const currentBaseExp = getExpForLevel(level);
            const nextBaseExp = getExpForLevel(level + 1);
            const expInLevel = exp - currentBaseExp;
            const neededForNext = Math.max(1, nextBaseExp - currentBaseExp);
            const progressPct = Math.min(100, Math.max(0, (expInLevel / neededForNext) * 100));

            let title = 'Tân Thủ Khởi Nghiệp';
            if (level >= 90) title = 'Huyền Thoại Xưởng';
            else if (level >= 75) title = 'Đại Tôn Sư';
            else if (level >= 50) title = 'Tối Cao Thần Thoại';
            else if (level >= 40) title = 'Thái Dương Chi Tôn';
            else if (level >= 35) title = 'Hoả Phụng Tiên Phong';
            else if (level >= 30) title = 'Huyết Tướng Chiến Binh';
            else if (level >= 25) title = 'Thạch Anh Huyền Bí';
            else if (level >= 20) title = 'Lam Ngọc Cao Thủ';
            else if (level >= 15) title = 'Lục Bảo Tiên Phong';
            else if (level >= 10) title = 'Hổ Phách Tinh Anh';

            return {
                level,
                currentBaseExp,
                nextBaseExp,
                expInLevel,
                neededForNext,
                progressPct,
                title,
                colorStyle: getLevelColorStyle(level),
                totalExp: exp
            };
        };

        const handleDirectPenalty = async () => {

        const submitLeave = async () => {

                setShowLeaveModal(false);

        const getDynamicKPIProgress = (k, u) => {
            if (!k) return 0;
            if (k.unit === 'Checklist') return Number(k.current) || 0;

            // Nếu KPI đang được Boss ghi đè thủ công (Manual Override) -> Ưu tiên 100% giá trị đã nhập
            if (k.isManualOverride === true || k.isManualOverride === 'true' || k.manualOverride === true || k.manualOverride === 'true' || String(k.guide || k.note || '').includes('[MANUAL_OVERRIDE]')) {
                const rawStored = cleanNumber(k.current);
                return Math.round(rawStored);
            }

            const unitLower = String(k.unit || '').toLowerCase().trim();
            const phase = String(k.kpiName || '').toLowerCase().trim();

            // Nếu là đơn vị đếm thủ công (Bộ, Cái, Lần, Điểm, Kiện, Xu) mà không phải các khâu sản xuất cốt lõi -> Trả về k.current đã nhập
            const isManualCount = ['bộ', 'cái', 'lần', 'xu', 'điểm'].includes(unitLower) &&
                !phase.includes('dựng khung') && !phase.includes('gia cố') && !phase.includes('cắt dán') &&
                !phase.includes('gọt keo') && !phase.includes('đóng gói') && !phase.includes('khâu 1') && !phase.includes('khâu 2');
            if (isManualCount) {
                return Number(k.current) || 0;
            }

            let count = 0;

            const normalizeToYMD = (d, isEnd = false) => {
                if (!d) return '';
                if (d instanceof Date) {
                    if (isNaN(d.getTime())) return '';
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                }
                let str = String(d).trim().split(' ')[0].split('T')[0];
                const curYear = new Date().getFullYear();
                if (str.includes('/')) {
                    const parts = str.split('/');
                    if (parts.length === 3) {
                        if (parts[2].length === 4) {
                            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        } else if (parts[0].length === 4) {
                            return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                        }
                    } else if (parts.length === 2) {
                        if (parts[1].length === 4) {
                            const m = parseInt(parts[0], 10);
                            const y = parseInt(parts[1], 10);
                            if (isEnd) {
                                const lastDay = new Date(y, m, 0).getDate();
                                return `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
                            }
                            return `${y}-${String(m).padStart(2, '0')}-01`;
                        }
                        // '01/08' hoặc '31/08' -> DD/MM
                        return `${curYear}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                    }
                } else if (str.includes('-')) {
                    const parts = str.split('-');
                    if (parts.length === 3) {
                        if (parts[0].length === 4) {
                            return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                        } else if (parts[2].length === 4) {
                            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                    } else if (parts.length === 2) {
                        if (parts[0].length === 4) {
                            const y = parseInt(parts[0], 10);
                            const m = parseInt(parts[1], 10);
                            if (isEnd) {
                                const lastDay = new Date(y, m, 0).getDate();
                                return `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
                            }
                            return `${parts[0]}-${parts[1].padStart(2, '0')}-01`;
                        }
                        return `${curYear}-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
                    }
                }
                return str;
            };

            const s = normalizeToYMD(k.startTime, false) || '2000-01-01';
            const e = normalizeToYMD(k.endTime, true) || '2099-12-31';
            const inR = (d) => {
                if (!d) return false;
                const dt = normalizeToYMD(d);
                if (!dt) return false;
                return dt >= s && dt <= e;
            };

            // 1. KPI BÁN HÀNG / DOANH THU (Chỉ áp dụng khi đơn vị tính là VNĐ / Tiền tệ)
            const isRevenueUnit = unitLower.includes('vnđ') || unitLower.includes('vnd') || unitLower.includes('đ') || unitLower.includes('đồng');
            if ((phase.includes('doanh thu') || phase.includes('bán hàng') || phase.includes('sale') || phase.includes('chốt đơn')) && isRevenueUnit) {
                let revTotal = 0;
                let revPending = 0;
                const allOrders = orders || erpData?.orders || erpData?.Orders || [];
                const uTarget = String(u || '').toLowerCase().trim();
                const isFounderOrBoss = uTarget.includes('nguyễn ngọc tiến') || uTarget.includes('tiến') || uTarget.includes('founder') || uTarget.includes('giám đốc') || uTarget.includes('tối cao') || uTarget.includes('toàn xưởng');

                const parseCleanRev = (rawRev, ch = '') => {
                    if (rawRev === null || rawRev === undefined || rawRev === '') return 0;
                    let num = 0;
                    if (typeof rawRev === 'number') {
                        num = rawRev;
                    } else {
                        let str = String(rawRev).trim();
                        // Xoá ký tự tiền tệ, chữ cái và khoảng trắng thừa
                        str = str.replace(/[đĐ\sVNDvnd$฿₱RM]/g, '').trim();
                        if (!str) return 0;

                        if (str.includes('.') && str.includes(',')) {
                            if (str.lastIndexOf('.') > str.lastIndexOf(',')) {
                                str = str.replace(/,/g, '');
                            } else {
                                str = str.replace(/\./g, '').replace(/,/g, '.');
                            }
                        } else if (str.includes(',')) {
                            if (/\,\d{3}($|\D)/.test(str) || /^\d{1,3}(,\d{3})+$/.test(str)) {
                                str = str.replace(/,/g, '');
                            } else {
                                str = str.replace(/,/g, '.');
                            }
                        } else if (str.includes('.')) {
                            const parts = str.split('.');
                            if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3 && parseInt(parts[0]) > 0)) {
                                str = str.replace(/\./g, '');
                            }
                        }
                        num = parseFloat(str);
                    }
                    if (isNaN(num) || !isFinite(num) || num <= 0) return 0;
                    if (num > 1000000000 && Number.isInteger(num)) return 0;
                    let channelStr = String(ch || '').toUpperCase().trim();
                    let rate = 1;
                    if (channelStr.includes('USD') || (channelStr.includes('XUẤT KHẨU') && num < 10000)) {
                        rate = 25500;
                    }
                    return Math.round(num * rate);
                };

                const isUserMatch = (oUser, targetUser, oCh = '') => {
                    if (!targetUser) return false;
                    const uT = String(targetUser).toLowerCase().trim();
                    const uOrder = String(oUser || '').toLowerCase().trim();
                    const ch = String(oCh || '').toLowerCase().trim();

                    // 1. Nếu đơn có gán responsibleUser đích danh
                    if (uOrder) {
                        if (uOrder === uT) return true;
                        if (uOrder.includes('diệu hương') && uT.includes('diệu hương')) return true;
                        if (uOrder.includes('hương') && uT.includes('hương')) return true;
                        if (uOrder.includes('dương') && uT.includes('dương')) return true;
                        if (uOrder.includes('tân') && uT.includes('tân')) return true;
                        if (uOrder.includes('tâm') && uT.includes('tâm')) return true;
                        return false;
                    }

                    // 2. Nếu đơn KHÔNG gán responsibleUser:
                    if (uT.includes('diệu hương') || uT.includes('hương')) {
                        const isDirectSaleChannel = ch.includes('bán lẻ') || ch.includes('ban le') ||
                            ch.includes('bán sỉ') || ch.includes('ban si') ||
                            ch.includes('facebook') || ch.includes('fb') ||
                            ch.includes('zalo') || ch.includes('tư vấn') ||
                            ch.includes('hotline') || ch.includes('trực tiếp') ||
                            ch.includes('khách lẻ') || ch.includes('cửa hàng') ||
                            ch.includes('messenger');
                        return isDirectSaleChannel;
                    }
                    return false;
                };

                allOrders.forEach(o => {
                    const oChannel = String(o.channel || '').trim();
                    if (oChannel === 'Sản Xuất Tồn' || oChannel === 'Sản Xuất Bù Kho') return;

                    const st = String(o._effectiveStatus || o.status || '').toUpperCase().trim();
                    const rawStatus = String(o.status || '').toUpperCase().trim();
                    const note = String(o.note || '').toLowerCase();

                    // Nhận diện đơn trả hàng (khớp Tab Đơn Hàng)
                    const isReturned = st === 'HÀNG HOÀN' || st === 'KIỂM HÀNG HOÀN' || st === 'HÀNG HOÀN CHỜ XỬ LÝ' || st.includes('HOÀN CHỜ XỬ') || 
                        rawStatus === 'HÀNG HOÀN' || rawStatus.includes('HOÀN TRẢ') || 
                        Boolean(o.returnedAt) || 
                        note.includes('[kn-thang]') || note.includes('[kn-thua]') || note.includes('hàng hoàn') || note.includes('trả hàng');

                    // Nhận diện đơn huỷ triệt để (khớp Tab Đơn Hàng)
                    const isCancelled = !isReturned && (
                        st === 'ĐƠN HUỶ' || st === 'HUỶ' || st === 'ĐƠN HỦY' || st === 'HỦY' || 
                        st.includes('HUỶ') || st.includes('HỦY') || st.includes('CANCEL') ||
                        rawStatus.includes('HUỶ') || rawStatus.includes('HỦY') || rawStatus.includes('CANCEL') ||
                        rawStatus.includes('ยกเลิก') ||
                        note.includes('[đã hủy]') || note.includes('[đơn huỷ]') || note.includes('[đơn hủy]') || 
                        note.includes('[huỷ]') || note.includes('[hủy]') || note.includes('hủy đơn') || note.includes('huỷ đơn') ||
                        Boolean(o.isCancelled)
                    );

                    if (isCancelled || isReturned) return;

                    // Xác định ngày lọc theo chu kỳ
                    let dateToFilter = o.date || o.createdAt;
                    if (o.isReconciled || o.reconciledAt || st === 'HOÀN THÀNH' || st === 'ĐỐI SOÁT THÀNH CÔNG') {
                        dateToFilter = o.reconciledAt || o.updatedAt || o.date || o.createdAt;
                    } else if (st === 'ĐÃ BÀN GIAO' || st === 'ĐÃ NHẬP KHO') {
                        dateToFilter = o.updatedAt || o.date || o.createdAt;
                    }

                    const isClosed = (st === 'HOÀN THÀNH' || st === 'ĐỐI SOÁT THÀNH CÔNG' || st === 'ĐÃ BÀN GIAO' || st === 'ĐÃ NHẬP KHO');
                    let inPeriod = false;
                    if (inR(dateToFilter) || inR(o.date) || inR(o.createdAt)) {
                        inPeriod = true;
                    } else if (!isClosed) {
                        // Đơn đang chạy trong tháng hiện tại
                        const nowYM = new Date().toISOString().slice(0, 7);
                        if (s.startsWith(nowYM) || e.startsWith(nowYM)) {
                            inPeriod = true;
                        }
                    }

                    if (!inPeriod) return;

                    const orderRev = parseCleanRev(o.revenue, oChannel);
                    if (orderRev <= 0) return;

                    // A. NGUYỄN NGỌC TIẾN / FOUNDER / TOÀN XƯỞNG:
                    // Đo doanh thu tổng toàn bộ các kênh bán hàng (khớp 100% với Doanh Thu Tổng bên Tab Đơn Hàng)
                    if (isFounderOrBoss) {
                        revTotal += orderRev;
                        return;
                    }

                    // B. NHÂN SỰ SALES LẺ (Diệu Hương...):
                    if (oChannel.includes('Cộng Tác Viên') || oChannel === 'CTV') return;
                    const oUser = o.responsibleUser || o.sale || '';
                    if (isUserMatch(oUser, u, oChannel)) {
                        revTotal += orderRev;
                    }
                });

                return { current: Math.round(revTotal), pending: 0, reconciled: Math.round(revTotal) };
            }

            // 1.1. KPI LỢI NHUẬN RÒNG (% Net Profit / P&L) — QUÉT 100% DỮ LIỆU THỰC TẾ TỪ CSDL
            if ((phase.includes('lợi nhuận') || phase.includes('net profit') || phase.includes('p&l')) && (unitLower === '%' || phase.includes('%') || unitLower === '')) {
                const allOrders = orders || erpData?.orders || erpData?.Orders || [];
                const allTransactions = erpData?.Transactions || erpData?.transactions || [];
                let totalPeriodRev = 0;
                let totalCOGS = 0;
                let totalPlatformFee = 0;
                let totalDiscount = 0;

                allOrders.forEach(o => {
                    const oChannel = String(o.channel || '').trim();
                    if (oChannel === 'Sản Xuất Tồn' || oChannel === 'Sản Xuất Bù Kho') return;

                    const st = String(o._effectiveStatus || o.status || '').toUpperCase().trim();
                    const rawStatus = String(o.status || '').toUpperCase().trim();
                    const note = String(o.note || '').toLowerCase();

                    const isReturned = st === 'HÀNG HOÀN' || st === 'KIỂM HÀNG HOÀN' || st === 'HÀNG HOÀN CHỜ XỬ LÝ' || st.includes('HOÀN CHỜ XỬ') || 
                        rawStatus === 'HÀNG HOÀN' || rawStatus.includes('HOÀN TRẢ') || 
                        Boolean(o.returnedAt) || 
                        note.includes('[kn-thang]') || note.includes('[kn-thua]') || note.includes('hàng hoàn') || note.includes('trả hàng');

                    const isCancelled = !isReturned && (
                        st === 'ĐƠN HUỶ' || st === 'HUỶ' || st === 'ĐƠN HỦY' || st === 'HỦY' || 
                        st.includes('HUỶ') || st.includes('HỦY') || st.includes('CANCEL') ||
                        rawStatus.includes('HUỶ') || rawStatus.includes('HỦY') || rawStatus.includes('CANCEL') ||
                        rawStatus.includes('ยกเลิก') ||
                        note.includes('[đã hủy]') || note.includes('[đơn huỷ]') || note.includes('[đơn hủy]') || 
                        note.includes('[huỷ]') || note.includes('[hủy]') || note.includes('hủy đơn') || note.includes('huỷ đơn') ||
                        Boolean(o.isCancelled)
                    );

                    if (isCancelled || isReturned) return;

                    let dateToFilter = o.date || o.createdAt;
                    if (o.isReconciled || o.reconciledAt || st === 'HOÀN THÀNH' || st === 'ĐỐI SOÁT THÀNH CÔNG') {
                        dateToFilter = o.reconciledAt || o.updatedAt || o.date || o.createdAt;
                    } else if (st === 'ĐÃ BÀN GIAO' || st === 'ĐÃ NHẬP KHO') {
                        dateToFilter = o.updatedAt || o.date || o.createdAt;
                    }

                    const isClosed = (st === 'HOÀN THÀNH' || st === 'ĐỐI SOÁT THÀNH CÔNG' || st === 'ĐÃ BÀN GIAO' || st === 'ĐÃ NHẬP KHO');
                    let inPeriod = false;
                    if (inR(dateToFilter) || inR(o.date) || inR(o.createdAt)) {
                        inPeriod = true;
                    } else if (!isClosed) {
                        const nowYM = new Date().toISOString().slice(0, 7);
                        if (s.startsWith(nowYM) || e.startsWith(nowYM)) inPeriod = true;
                    }

                    if (!inPeriod) return;

                    const parseCleanRev = (rawRev, ch = '') => {
                        if (rawRev === null || rawRev === undefined || rawRev === '') return 0;
                        let num = typeof rawRev === 'number' ? rawRev : parseFloat(String(rawRev).replace(/[đĐ\sVNDvnd$฿₱RM]/g, '').replace(/,/g, ''));
                        if (isNaN(num) || num <= 0) return 0;
                        if (num > 100000000 && Number.isInteger(num)) return 0;
                        if (String(ch || '').toUpperCase().includes('USD') || (String(ch || '').toUpperCase().includes('XUẤT KHẨU') && num < 10000)) num *= 25500;
                        return Math.round(num);
                    };

                    const val = parseCleanRev(o.revenue, oChannel);
                    if (val <= 0) return;

                    totalPeriodRev += val;

                    // Giá vốn thực tế (COGS)
                    let cogsVal = Number(o.cogs) || 0;
                    if (cogsVal <= 0 && o.accessories) {
                        try {
                            const accs = typeof o.accessories === 'string' ? JSON.parse(o.accessories) : o.accessories;
                            if (Array.isArray(accs)) {
                                accs.forEach(a => {
                                    const cost = Number(a.costPrice || a.cogs || 0);
                                    const qty = Number(a.quantity || a.qty || 1);
                                    cogsVal += (cost * qty);
                                });
                            }
                        } catch (e) {}
                    }
                    if (cogsVal <= 0) {
                        cogsVal = Math.round(val * 0.165); // Giá vốn chuẩn xưởng Rich Fish (~16.5% doanh thu theo Báo Cáo Kênh)
                    }

                    // Chi phí sàn thực tế
                    const feeVal = (Number(o.feeFixed) || 0) + (Number(o.feeService) || 0) + (Number(o.feePayment) || 0) + (Number(o.feeAffiliate) || 0) + (Number(o.tax) || 0);
                    const discountVal = Number(o.shopVoucher) || Number(o.discount) || 0;

                    totalCOGS += cogsVal;
                    totalPlatformFee += (feeVal > 0 ? feeVal : Math.round(val * 0.156)); // Chi phí sàn thực tế (~15.6% doanh thu sàn)
                    totalDiscount += discountVal;
                });

                // Quét 100% Chi Phí Lương & Vận Hành Thực Tế từ Sổ Quỹ (Transactions)
                let actualSalaryExpense = 0;
                let actualOperationExpense = 0;

                allTransactions.forEach(t => {
                    const tDate = String(t.date || t.createdAt || '').slice(0, 10);
                    if (!tDate || !inR(tDate)) return;

                    const cat = String(t.category || '').toLowerCase().trim();
                    const type = String(t.type || '').toUpperCase().trim();
                    const title = String(t.title || t.note || '').toLowerCase().trim();
                    const amt = Math.abs(Number(t.amount || 0));
                    if (amt <= 0) return;

                    // Bỏ qua giao dịch nội bộ / chuyển khoản / rút quỹ / chờ xử lý
                    if (type === 'TRANSFER' || type === 'CHUYỂN KHOẢN' || cat.includes('chuyển khoản') || cat.includes('nội bộ') || cat.includes('rút tiền') || cat.includes('chờ xử lý') || cat.includes('chờ phân bổ')) {
                        return;
                    }

                    // Bỏ qua các khoản chi nhập hàng, nhà cung cấp, đối tác, trả nợ (đã thuộc COGS/công nợ)
                    if (cat.includes('nhập hàng') || cat.includes('nhà cung cấp') || cat.includes('ncc') || cat.includes('trả nợ') || cat.includes('đối tác')) {
                        return;
                    }

                    // Chi phí lương (Chỉ quét các giao dịch thực chi lương, bỏ qua tạm ứng trùng lặp)
                    const isSalary = (cat === 'lương' || cat === 'chi lương' || cat === 'trả lương' || cat === 'thanh toán lương' || cat.includes('lương nhân viên')) ||
                                     (title.startsWith('trả lương') || title.startsWith('chi lương') || title.startsWith('lương tháng') || title.includes('thanh toán lương'));
                    if (isSalary) {
                        actualSalaryExpense += amt;
                        return;
                    }

                    // Chi phí vận hành OPEX thực tế: Mặt bằng, Điện nước, Marketing/Ads, Tiếp khách, Sinh hoạt, Bao bì...
                    const isOpex = cat.includes('vận hành') || cat.includes('mặt bằng') || cat.includes('thuê') || 
                                   cat.includes('điện') || cat.includes('nước') || cat.includes('mạng') || cat.includes('internet') ||
                                   cat.includes('tiếp khách') || cat.includes('ăn uống') || cat.includes('sinh hoạt') || 
                                   cat.includes('quảng cáo') || cat.includes('ads') || cat.includes('marketing') ||
                                   cat.includes('bao bì') || cat.includes('văn phòng') || cat.includes('công cụ') ||
                                   title.includes('mặt bằng') || title.includes('tiền điện') || title.includes('tiền nước') || title.includes('quảng cáo') || title.includes('phí vận hành');

                    if (isOpex) {
                        actualOperationExpense += amt;
                    }
                });

                const totalRealExpense = actualSalaryExpense + actualOperationExpense;
                // Nếu sổ quỹ chưa chốt chi trong kỳ, hệ thống quét bảng lương và chi phí cơ sở
                const finalOperatingExpense = totalRealExpense > 0 ? totalRealExpense : (totalPeriodRev * 0.20);

                const dynamicNetProfit = totalPeriodRev - totalCOGS - totalPlatformFee - totalDiscount - finalOperatingExpense;
                const margin = totalPeriodRev > 0 ? ((dynamicNetProfit / totalPeriodRev) * 100) : 0;
                return Math.max(0, Math.round(margin * 10) / 10);
            }

            // 2. KPI SẢN XUẤT THEO TỪNG KHÂU (CHỈ ÁP DỤNG KHI KHÔNG PHẢI KPI TỶ LỆ / % / KCS / KỶ LUẬT)
            const isPercentKPI = unitLower === '%' || phase.includes('tỷ lệ') || phase.includes('tỉ lệ') || phase.includes('sla') || phase.includes('kcs') || phase.includes('vòng 1') || phase.includes('kỷ luật') || phase.includes('chấm công') || phase.includes('5s') || phase.includes('đối soát') || phase.includes('công nợ') || phase.includes('đứt gãy') || phase.includes('khiếu nại') || phase.includes('hàng hoàn') || phase.includes('đánh giá') || phase.includes('phản hồi');

            const isUserLooseMatch = (itemUser, targetUser) => {
                if (!itemUser || !targetUser) return false;
                const iU = String(itemUser).toLowerCase().trim();
                const tU = String(targetUser).toLowerCase().trim();
                if (iU === tU) return true;
                if (tU.includes('dương') && iU.includes('dương')) return true;
                if (tU.includes('tân') && iU.includes('tân')) return true;
                if (tU.includes('tâm') && iU.includes('tâm')) return true;
                if (tU.includes('hương') && iU.includes('hương')) return true;
                if (tU.includes('trang') && iU.includes('trang')) return true;
                if (tU.includes('tiến') && iU.includes('tiến')) return true;
                return false;
            };

            if (!isPercentKPI) {
                if (phase.includes('khâu 1') || phase.includes('cắt') || phase.includes('dán') || phase.includes('dựng khung') || phase.includes('phase1')) {
                    safeProdItems.forEach(p => {
                        const user = p.p1_user || p.phases?.phase1?.user;
                        const status = p.p1_status || p.phases?.phase1?.status;
                        const endTime = p.p1_endTime || p.phases?.phase1?.endTime || p.date;
                        if (isUserLooseMatch(user, u) && (status === 'Done' || status === 'ĐÃ XONG') && inR(endTime)) count++;
                    });
                } else if (phase.includes('khâu 2') || phase.includes('gọt') || phase.includes('keo') || phase.includes('gia cố') || phase.includes('phase2')) {
                    safeProdItems.forEach(p => {
                        const user = p.p2_user || p.phases?.phase2?.user;
                        const status = p.p2_status || p.phases?.phase2?.status;
                        const endTime = p.p2_endTime || p.phases?.phase2?.endTime || p.date;
                        if (isUserLooseMatch(user, u) && (status === 'Done' || status === 'ĐÃ XONG') && inR(endTime)) count++;
                    });
                } else if (phase.includes('đóng gói') || phase.includes('pack')) {
                    safePackings.forEach(pk => {
                        if (isUserLooseMatch(pk.user, u) && (pk.status === 'Done' || pk.status === 'ĐÃ XONG') && inR(pk.endTime || pk.date)) {
                            count++;
                        }
                    });
                } else if (phase.includes('sản xuất') || phase.includes('sản lượng') || phase.includes('khâu hoàn thành') || phase.includes('tổng khâu')) {
                    safeProdItems.forEach(p => {
                        const u1 = p.p1_user || p.phases?.phase1?.user;
                        const s1 = p.p1_status || p.phases?.phase1?.status;
                        const t1 = p.p1_endTime || p.phases?.phase1?.endTime || p.date;
                        if (isUserLooseMatch(u1, u) && (s1 === 'Done' || s1 === 'ĐÃ XONG') && inR(t1)) count++;

                        const u2 = p.p2_user || p.phases?.phase2?.user;
                        const s2 = p.p2_status || p.phases?.phase2?.status;
                        const t2 = p.p2_endTime || p.phases?.phase2?.endTime || p.date;
                        if (isUserLooseMatch(u2, u) && (s2 === 'Done' || s2 === 'ĐÃ XONG') && inR(t2)) count++;
                    });
                    safePackings.forEach(pk => {
                        if (isUserLooseMatch(pk.user, u) && (pk.status === 'Done' || pk.status === 'ĐÃ XONG') && inR(pk.endTime || pk.date)) count++;
                    });
                } else if (phase.includes('khóa sổ') || phase.includes('bảng lương') || phase.includes('snapshot')) {
                    const snapList = erpData?.Monthly_Snapshots || erpData?.monthly_snapshots || [];
                    const curMonthStr = s ? s.slice(0, 7) : new Date().toISOString().slice(0, 7);
                    const isLocked = snapList.some(sn => String(sn.month || '').startsWith(curMonthStr));
                    return isLocked ? 1 : 0;
                }
            } else {
                // 3. CÁC KPI TỶ LỆ / % / SLA / KCS
                // 3.1. SLA Cấp Phôi Kính Ca Sáng (Hoàng Dương)
                if (phase.includes('ca sáng') || (phase.includes('sla') && phase.includes('phôi'))) {
                    let totalP1 = 0;
                    let onTimeP1 = 0;
                    safeProdItems.forEach(p => {
                        const user = p.p1_user || p.phases?.phase1?.user;
                        const status = p.p1_status || p.phases?.phase1?.status;
                        const endTime = p.p1_endTime || p.phases?.phase1?.endTime;
                        if (isUserLooseMatch(user, u) && (status === 'Done' || status === 'ĐÃ XONG') && inR(endTime)) {
                            totalP1++;
                            try {
                                const dt = new Date(endTime);
                                const hh = dt.getHours();
                                const mm = dt.getMinutes();
                                if (hh < 11 || (hh === 11 && mm <= 30)) {
                                    onTimeP1++;
                                }
                            } catch (e) { }
                        }
                    });
                    if (totalP1 > 0) return Math.round((onTimeP1 / totalP1) * 100);
                    const rawVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 100;
                    return Math.min(100, Math.max(0, Math.round(rawVal)));
                }

                // 3.2. Cảnh Báo Chống Đứt Gãy Vật Tư (Hoàng Dương)
                else if (phase.includes('đứt gãy') || phase.includes('vật tư')) {
                    const allProducts = erpData?.Products || erpData?.products || [];
                    let violationCount = 0;
                    allProducts.forEach(prd => {
                        const cat = String(prd.category || '').toUpperCase().trim();
                        if (cat === 'DANH MỤC SẢN XUẤT' || cat === 'NGUYÊN VẬT LIỆU' || cat === 'VẬT TƯ SẢN XUẤT') {
                            const qty = Number(prd.quantity || 0);
                            const minStock = Number(prd.minStock || 0);
                            if (qty <= minStock) {
                                violationCount++;
                            }
                        }
                    });
                    return violationCount;
                }

                // 3.3. Tỷ lệ đạt chuẩn KCS Khâu 2 vòng 1 (Lại Trường Tâm)
                else if (phase.includes('kcs') || phase.includes('vòng 1') || (phase.includes('đạt chuẩn') && phase.includes('khâu 2'))) {
                    let totalTamProds = 0;
                    let passFirstRound = 0;
                    safeProdItems.forEach(p => {
                        const user = p.p2_user || p.phases?.phase2?.user;
                        const status = p.p2_status || p.phases?.phase2?.status;
                        const endTime = p.p2_endTime || p.phases?.phase2?.endTime || p.date;
                        if (isUserLooseMatch(user, u) && (status === 'Done' || status === 'ĐÃ XONG') && inR(endTime)) {
                            totalTamProds++;
                            const qcSt = String(p.qc_status || '').toUpperCase().trim();
                            const pSt = String(p.status || '').toUpperCase().trim();
                            if (qcSt !== 'FAIL' && qcSt !== 'LỖI' && qcSt !== 'SỬA LẠI' && !pSt.includes('LỖI')) {
                                passFirstRound++;
                            }
                        }
                    });
                    if (totalTamProds > 0) return Math.min(100, Math.max(0, Math.round((passFirstRound / totalTamProds) * 100)));
                    const rawVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 100;
                    return Math.min(100, Math.max(0, Math.round(rawVal)));
                }

                // 3.4. Kỷ luật chấm công & giờ giấc xưởng (Lại Trường Tâm)
                else if (phase.includes('kỷ luật') || phase.includes('chấm công') || phase.includes('giờ giấc')) {
                    const allAtts = attendance || erpData?.Attendance || erpData?.attendance || [];
                    let totalShifts = 0;
                    let violationShifts = 0;
                    allAtts.forEach(att => {
                        if (!att || !att.user || !att.date) return;
                        if (inR(att.date)) {
                            totalShifts++;
                            const st = String(att.status || '').toLowerCase();
                            const pen = Number(att.penalty || 0);
                            if (st.includes('quên chấm') || st.includes('đi muộn') || st.includes('muộn') || st.includes('không phép') || st.includes('vi phạm') || pen > 0) {
                                violationShifts++;
                            }
                        }
                    });
                    if (totalShifts > 0) return Math.max(0, Math.round((1 - (violationShifts / totalShifts)) * 100));
                    const rawVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 100;
                    return Math.min(100, Math.max(0, Math.round(rawVal)));
                }

                // 3.5. Tỷ lệ Thắng Khiếu Nại Sàn (Diệu Hương)
                else if (phase.includes('khiếu nại') || phase.includes('thắng khiếu nại')) {
                    const allOrders = orders || erpData?.orders || erpData?.Orders || [];
                    let winCount = 0;
                    let totalDisputes = 0;
                    allOrders.forEach(o => {
                        const noteLower = String(o.note || '').toLowerCase();
                        const statusLower = String(o.status || '').toLowerCase();
                        const isWin = noteLower.includes('[kn-thang]') || noteLower.includes('thắng khiếu nại') || statusLower.includes('thắng khiếu nại');
                        const isLose = noteLower.includes('[kn-thua]') || noteLower.includes('thua khiếu nại') || statusLower.includes('thua khiếu nại');
                        if (isWin || isLose) {
                            totalDisputes++;
                            if (isWin) winCount++;
                        }
                    });
                    if (totalDisputes > 0) return Math.min(100, Math.round((winCount / totalDisputes) * 100));
                    const rawVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 100;
                    return Math.min(100, Math.max(0, Math.round(rawVal)));
                }

                // 3.6. Xử Lý Hàng Hủy Hoàn & Gắn Trách Nhiệm (Diệu Hương)
                else if (phase.includes('hàng hoàn') || phase.includes('huỷ hoàn') || phase.includes('xử lý hoàn')) {
                    const allOrders = orders || erpData?.orders || erpData?.Orders || [];
                    let returnOrders = 0;
                    let reconciledReturns = 0;
                    allOrders.forEach(o => {
                        const st = String(o.status || '').toUpperCase();
                        const note = String(o.note || '').toLowerCase();
                        if (st.includes('HOÀN') || note.includes('hàng hoàn') || note.includes('trả hàng')) {
                            returnOrders++;
                            if (o.isReconciled || String(o.status).toUpperCase().includes('ĐỐI SOÁT')) {
                                reconciledReturns++;
                            }
                        }
                    });
                    if (returnOrders > 0) return Math.min(100, Math.round((reconciledReturns / returnOrders) * 100));
                    return 100;
                }

                // 3.7. Khớp Lệnh Đối Soát Dòng Tiền Tự Động (Huyền Trang)
                else if (phase.includes('đối soát') || phase.includes('dòng tiền') || phase.includes('khớp lệnh')) {
                    const allTx = erpData?.Transactions || erpData?.transactions || [];
                    let totalTx = 0;
                    let clearedTx = 0;
                    allTx.forEach(t => {
                        const tDate = String(t.date || t.createdAt || '').slice(0, 10);
                        if (inR(tDate)) {
                            totalTx++;
                            const isClr = t.isCleared === true || t.isCleared === 'true' || t.isAuto === true || t.isAuto === 'true';
                            if (isClr) clearedTx++;
                        }
                    });
                    if (totalTx > 0) return Math.min(100, Math.round((clearedTx / totalTx) * 100));
                    const rawVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 100;
                    return Math.min(100, Math.max(0, Math.round(rawVal)));
                }

                // 3.8. Quản Trị Công Nợ Nhà Cung Cấp (Huyền Trang)
                else if (phase.includes('công nợ') || phase.includes('nhà cung cấp') || phase.includes('ncc')) {
                    const allSupps = erpData?.Suppliers || erpData?.suppliers || [];
                    let validCount = 0;
                    let totalSupps = 0;
                    allSupps.forEach(sp => {
                        if (sp.name) {
                            totalSupps++;
                            const debt = Number(sp.totalDebt || 0);
                            if (debt >= 0) validCount++;
                        }
                    });
                    if (totalSupps > 0) return Math.min(100, Math.round((validCount / totalSupps) * 100));
                    return 100;
                }
            }

            const rawStored = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 0;
            // Lọc bỏ các số rác do lỗi nối chuỗi / overflow trước đây (> 100.000 đối với đơn vị không phải tiền tệ)
            const isMoneyUnit = unitLower.includes('vnd') || unitLower.includes('vnđ') || unitLower.includes('đ');
            const safeStored = (!isMoneyUnit && rawStored > 1000000) ? 0 : rawStored;

            const fallbackVal = count > 0 ? count : safeStored;
            return Math.round(fallbackVal);
        };

        const claimReward = async (k) => {
            if (k.isClaimed === 'true' || k.isClaimed === true || claimingIds.includes(k.id)) return;
            setClaimingIds(prev => [...prev, k.id]);

            const payload = {
                KPI_Progress: [{ ...k, isClaimed: true }]
            };
            try {
                if (String(k.unit).toLowerCase() === 'xu' && typeof google !== 'undefined') {
                    await new Promise((resolve) => {
                        google.script.run.withSuccessHandler(resolve).withFailureHandler(resolve).api_recordXuTransaction(k.user, k.reward, 'Thưởng nhiệm vụ', k.kpiName, k.id);
                    });
                }
                await pushDeltas(payload, 'Nhận thưởng thành công!', 'fa-coins');
            } catch (e) {
                triggerToast('Lỗi nhận thưởng, thử lại sau', 'fa-times', 'danger');
            } finally { setClaimingIds(prev => prev.filter(id => id !== k.id)); }
        };

        const onKpiPresetChange = (presetKey) => {
            if (!presetKey || !KPI_PRESET_TEMPLATES[presetKey]) return;
            const p = KPI_PRESET_TEMPLATES[presetKey];
            const targetCycle = p.cycle || 'MONTH';
            setKpiCycle(targetCycle);

            const now = new Date();
            let sTime = '';
            let eTime = '';
            const formatYMD = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            if (targetCycle === 'WEEK') {
                const day = now.getDay();
                const diffToMon = now.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(now.getFullYear(), now.getMonth(), diffToMon);
                const sunday = new Date(now.getFullYear(), now.getMonth(), diffToMon + 6);
                sTime = formatYMD(monday);
                eTime = formatYMD(sunday);
            } else {
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                sTime = formatYMD(firstDay);
                eTime = formatYMD(lastDay);
            }

            setKpiForm(prev => ({
                ...prev,
                kpiName: p.name,
                target: p.target,
                unit: p.unit,
                reward: p.reward,
                penalty: p.penalty,
                note: p.note,
                startTime: sTime,
                endTime: eTime
            }));
        };

        const handleCycleChange = (newCycle) => {
            setKpiCycle(newCycle);
            const now = new Date();
            const formatYMD = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            if (newCycle === 'WEEK') {
                const day = now.getDay();
                const diffToMon = now.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(now.getFullYear(), now.getMonth(), diffToMon);
                const sunday = new Date(now.getFullYear(), now.getMonth(), diffToMon + 6);
                setKpiForm(prev => ({ ...prev, startTime: formatYMD(monday), endTime: formatYMD(sunday) }));
            } else {
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                setKpiForm(prev => ({ ...prev, startTime: formatYMD(firstDay), endTime: formatYMD(lastDay) }));
            }
        };

        const saveKPI = async () => {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
            const sTime = kpiForm.startTime || `${y}-${m}-01`;
            const eTime = kpiForm.endTime || `${y}-${m}-${lastDay}`;

            if (!kpiForm.user) return triggerToast('Vui lòng chọn nhân sự nhận KPI!', 'fa-exclamation', 'warning');
            if (!kpiForm.kpiName || !kpiForm.kpiName.trim()) return triggerToast('Vui lòng nhập tên mục tiêu KPI!', 'fa-exclamation', 'warning');
            if (kpiForm.target === undefined || kpiForm.target === '') return triggerToast('Vui lòng nhập chỉ tiêu (Target)!', 'fa-exclamation', 'warning');
            if (!kpiForm.unit || !String(kpiForm.unit).trim()) return triggerToast('Vui lòng nhập đơn vị tính!', 'fa-exclamation', 'warning');

            const parseNum = (val) => Number(String(val).replace(/[^\d.-]/g, '')) || 0;
            const prefix = kpiCycle === 'WEEK' ? 'KPI_W_' : 'KPI_M_';

            const payload = {
                id: editKPI ? editKPI.id : `${prefix}${Date.now()}`,
                user: kpiForm.user,
                kpiName: kpiForm.kpiName.trim(),
                current: editKPI ? (editKPI.current !== undefined ? editKPI.current : 0) : 0,
                target: parseNum(kpiForm.target),
                unit: String(kpiForm.unit).trim(),
                startTime: sTime,
                endTime: eTime,
                reward: parseNum(kpiForm.reward),
                penalty: parseNum(kpiForm.penalty),
                isClaimed: editKPI ? editKPI.isClaimed : false,
                guide: String(kpiForm.note || '').trim(),
                lastUpdated: new Date().toISOString()
            };
            setShowKPIModal(false); 
            setEditKPI(null);
            try {
                await pushDeltas({ KPI_Progress: [payload] }, editKPI ? 'Cập nhật KPI thành công!' : `Lưu thiết lập KPI ${kpiCycle === 'WEEK' ? 'Hàng Tuần' : 'Hàng Tháng'} thành công!`, 'fa-check');
            } catch(e) {
                triggerToast('Lỗi lưu KPI!', 'fa-times', 'danger');
            }
        };

        const handleOpenSelfAssessment = (k, e) => {
            if (e) e.stopPropagation();
            setSelfAssessKPI(k);
            const curVal = k.current !== undefined ? k.current : getDynamicKPIProgress(k, k.user);
            const curValNum = typeof curVal === 'object' ? curVal.current : curVal;
            setSelfAssessForm({
                actualValue: curValNum !== undefined ? curValNum : '',
                note: '',
                proofUrl: '',
                isSubmitting: false
            });
        };

        const handleSubmitSelfAssessment = async () => {
            if (!selfAssessKPI) return;
            const actualNum = parseFloat(String(selfAssessForm.actualValue).replace(/,/g, '.').replace(/[^\d.-]/g, ''));
            if (isNaN(actualNum)) return triggerToast('Vui lòng nhập số liệu thực tế hợp lệ!', 'fa-exclamation', 'warning');

            setSelfAssessForm(prev => ({ ...prev, isSubmitting: true }));
            try {
                const targetNum = Number(selfAssessKPI.target) || 100;
                const isPassed = targetNum > 0 && actualNum >= targetNum;
                const rewardNum = Number(selfAssessKPI.reward) || 0;

                let fullNote = String(selfAssessForm.note || '').trim();
                if (selfAssessForm.proofUrl) {
                    fullNote = (fullNote ? fullNote + '\n' : '') + `🔗 Bằng chứng: ${String(selfAssessForm.proofUrl).trim()}`;
                }
                if (!fullNote.includes('[MANUAL_OVERRIDE]')) {

            if (!str) return NaN;
            let s = str;
            if (s.includes(' ')) {
                s = s.replace(' ', 'T');
            }
            if (s.includes('T') && s.split(':').length === 2) {
                s += ':00';

            (safeProdItems || []).forEach(p => {
                ['phase1', 'phase2'].forEach(phKey => {
                    const ph = p?.phases?.[phKey];
                    if (ph && String(ph.user).trim() === String(user).trim()) {
                        if (ph.start && String(ph.start).startsWith(dateStr)) {
                            const startMs = parseDateSafe(ph.start);
                            let endMs = 0;

                                endMs = parseDateSafe(ph.endTime);
                            } else if (ph.status === 'In Progress' && dateStr === currentDate) {
                                endMs = Date.now();
                            }
                            if (!isNaN(startMs) && endMs > startMs) {
                                totalActiveMins += (endMs - startMs) / 60000;

                            totalActiveMins += (endMs - startMs) / 60000;
                        }
                    }
                }
            });

            // Capping active hours at gate hours
            const cappedActiveH = Math.min(activeH, safeGateHours);

            let totalActiveHours = 0;
