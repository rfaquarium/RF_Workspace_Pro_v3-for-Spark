    // ==========================================
    function QuickExpenseModal({ visible, onClose, pushDeltas, triggerToast, accounts = [] }) {
        const [amount, setAmount] = React.useState('');
        const [category, setCategory] = React.useState('Mua Vật Tư');
        const [fromAccount, setFromAccount] = React.useState('');
        const [receiver, setReceiver] = React.useState('');
        const [note, setNote] = React.useState('');
        const [submitting, setSubmitting] = React.useState(false);

        const accountsList = React.useMemo(() => {
            if (accounts && accounts.length > 0) return accounts;
            return [
                { id: 'ACC_TIENMAT', accountName: 'Tiền Mặt', balance: 0 },
                { id: 'ACC_BANK', accountName: 'Tài Khoản Ngân Hàng', balance: 0 }
            ];
        }, [accounts]);

        React.useEffect(() => {
            if (accountsList.length > 0 && !fromAccount) {
                setFromAccount(accountsList[0].id || accountsList[0].accountName);
            }
        }, [accountsList, fromAccount]);

        if (!visible) return null;

        const SYSTEM_EXPENSE_CATEGORIES = [
            { value: 'Mua Vật Tư', label: 'Mua vật tư sản xuất' },
            { value: 'Mua Nguyên Liệu', label: 'Mua nguyên liệu' },
            { value: 'Thanh Toán Hoá Đơn', label: 'Thanh toán hoá đơn / NCC' },
            { value: 'Trả Lương', label: 'Trả lương nhân sự' },
            { value: 'Dịch Vụ Phần Mềm', label: 'Dịch vụ phần mềm' },
            { value: 'Quảng Cáo & Marketing', label: 'Quảng cáo & Marketing' },
            { value: 'Trang Thiết Bị', label: 'Trang thiết bị' },
            { value: 'Máy Móc & Công Cụ', label: 'Máy móc & công cụ' },
            { value: 'Hoạt Động & Sự Kiện', label: 'Hoạt động & sự kiện' },
            { value: 'Chi Phí Khác', label: 'Chi phí khác' }
        ];

        const handleSubmit = async () => {
            const finalAmount = Number(amount) || 0;
            if (finalAmount <= 0) {
                if (triggerToast) triggerToast('Vui lòng nhập số tiền chi lớn hơn 0!', 'fa-exclamation-circle', 'warning');
                return;
            }
            if (!receiver.trim()) {
                if (triggerToast) triggerToast('Vui lòng nhập Người Nhận / Đối Tác nhận tiền!', 'fa-exclamation-circle', 'warning');
                return;
            }

            setSubmitting(true);
            try {
                const safeDateOnly = typeof getLocalISODate === 'function' ? getLocalISODate().split('T')[0] : new Date().toISOString().split('T')[0];
                const nowIso = new Date().toISOString().replace('T', ' ').slice(0, 19);
                const logId = 'TX_EXP_' + Date.now();
                
                const selectedAcc = accountsList.find(a => (a.id && a.id === fromAccount) || (a.accountName && a.accountName === fromAccount));
                const fromAccName = selectedAcc ? (selectedAcc.id || selectedAcc.accountName) : fromAccount;

                const txRecord = {
                    id: logId,
                    type: 'Chi',
                    category: category,
                    amount: finalAmount,
                    fromAccount: fromAccName,
                    toAccount: '',
                    title: receiver.trim(),
                    date: nowIso,
                    note: note.trim() || `Chi ${category} cho ${receiver.trim()}`,
                    isAuto: 'FALSE'
                };

                const payload = { Transactions: [txRecord] };
                if (selectedAcc && selectedAcc.id) {
                    payload.Accounts = [{
                        ...selectedAcc,
                        balance: Number(selectedAcc.balance || 0) - finalAmount
                    }];
                }

                await pushDeltas(payload, `Đã lập phiếu chi -${finalAmount.toLocaleString('vi-VN')}đ cho ${receiver.trim()}!`, 'fa-file-invoice-dollar');
                if (triggerToast) triggerToast('Đã lưu phiếu chi tiền thành công!', 'fa-check', 'success');
                setAmount('');
                setReceiver('');
                setNote('');
                onClose();
            } catch (err) {
                if (triggerToast) triggerToast('Lỗi khi lưu phiếu chi!', 'fa-times', 'danger');
            } finally {
                setSubmitting(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                <div className="bg-[#111015] border border-cyan-900/50 rounded-2xl p-5 max-w-md w-full shadow-2xl relative text-white animate-scale-up">
                    <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-[#1e1c24] text-gray-400 hover:text-white hover:bg-cyan-600 transition-colors">
                        <i className="fas fa-times"></i>
                    </button>

                    <div className="flex items-center gap-2.5 mb-4 pb-3 border-b border-[#221f2b]">
                        <div className="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
                            <i className="fas fa-file-invoice-dollar"></i>
                        </div>
                        <div>
                            <h3 className="text-sm font-black text-cyan-400 uppercase tracking-wider">Phiếu Chi Tiền Nhanh</h3>
                            <p className="text-[10px] text-zinc-400">Ghi nhận tức thì dòng tiền chi của xưởng vào sổ quỹ</p>
                        </div>
                    </div>

                    <div className="space-y-3.5">
                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Số tiền chi (VNĐ) *</label>
                            <input 
                                type="number" 
                                value={amount} 
                                onChange={e => setAmount(e.target.value)} 
                                placeholder="VD: 50000" 
                                className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-sm font-mono font-bold text-cyan-400 outline-none focus:border-cyan-500 transition-colors" 
                            />
                        </div>

                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Người / Đối Tác Nhận Tiền *</label>
                            <input 
                                type="text" 
                                value={receiver} 
                                onChange={e => setReceiver(e.target.value)} 
                                placeholder="VD: Nguyễn Hoàng Dương, NCC Keo Apolo, Grab..." 
                                className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-xs text-white font-bold outline-none focus:border-cyan-500 transition-colors" 
                            />
                        </div>

                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Hạng mục chi *</label>
                            <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-xs font-bold text-white outline-none focus:border-cyan-500 cursor-pointer">
                                {SYSTEM_EXPENSE_CATEGORIES.map(c => (
                                    <option key={c.value} value={c.value}>{c.value} ({c.label})</option>
                                ))}
                            </select>
                        </div>

                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Nguồn tiền chi (Tài khoản / Quỹ) *</label>
                            <select value={fromAccount} onChange={e => setFromAccount(e.target.value)} className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-xs font-bold text-white outline-none focus:border-cyan-500 cursor-pointer">
                                {accountsList.map(a => (
                                    <option key={a.id || a.accountName} value={a.id || a.accountName}>
                                        {a.accountName} {a.balance !== undefined ? `(Sẵn có: ${Math.round(Number(a.balance)).toLocaleString('vi-VN')}đ)` : ''}
                                    </option>
                                ))}
                            </select>
                        </div>

                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Lý do / Diễn giải chi tiết</label>
                            <input 
                                type="text" 
                                value={note} 
                                onChange={e => setNote(e.target.value)} 
                                placeholder="VD: Mua 10 chai keo dán bể, cước xe chở cát..." 
                                className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-cyan-500 transition-colors" 
                            />
                        </div>

                        <div className="pt-2 flex gap-2">
                            <button type="button" onClick={onClose} className="w-1/3 py-2.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[11px] font-bold uppercase transition-colors cursor-pointer">
                                Huỷ
                            </button>
                            <button type="button" disabled={submitting} onClick={handleSubmit} className="w-2/3 py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-black text-[11px] font-black uppercase transition-all shadow-[0_0_15px_rgba(6,182,212,0.3)] flex items-center justify-center gap-1.5 cursor-pointer">
                                <i className="fas fa-check"></i> {submitting ? 'Đang lưu...' : 'Lập Phiếu Chi Ngay'}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }
    // =========================================================================
    // 14. QUICK NOTES MODAL (BẢNG GHI CHÚ & NHẮC VIỆC NỘI BỘ THEO PHÂN HỆ)
    // =========================================================================
    function QuickNotesModal({ visible, onClose, documents = [], pushDeltas, currentUser, isAdmin, isBoss, triggerToast, initialTabFilter = 'ALL' }) {
        if (!visible) return null;

        const [activeFilter, setActiveFilter] = React.useState(initialTabFilter || 'ALL');
        const [search, setSearch] = React.useState('');
        const [isFormOpen, setIsFormOpen] = React.useState(false);
        const [editingNoteId, setEditingNoteId] = React.useState(null);

        // Form state
        const [formTab, setFormTab] = React.useState(initialTabFilter !== 'ALL' && initialTabFilter !== 'UNREAD' ? initialTabFilter : 'KHO_HANG');
        const [formPriority, setFormPriority] = React.useState('NORMAL'); // PINNED, URGENT, NORMAL
        const [formTitle, setFormTitle] = React.useState('');
        const [formContent, setFormContent] = React.useState('');
        const [submitting, setSubmitting] = React.useState(false);

        React.useEffect(() => {
            if (initialTabFilter) {
                setActiveFilter(initialTabFilter);
                if (initialTabFilter !== 'ALL' && initialTabFilter !== 'UNREAD') {
                    setFormTab(initialTabFilter);
                }
            }
        }, [initialTabFilter, visible]);

        const TAB_CONFIGS = {
            'ALL': { label: 'Tất Cả', icon: 'fa-layer-group', color: 'text-zinc-300', bg: 'bg-zinc-800/40', border: 'border-zinc-700' },
            'KHO_HANG': { label: 'Kho Hàng', icon: 'fa-boxes-stacked', color: 'text-amber-400', bg: 'bg-amber-500/10', border: 'border-amber-500/30' },
            'SAN_XUAT': { label: 'Sản Xuất', icon: 'fa-tools', color: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/30' },
            'DON_HANG': { label: 'Đơn Hàng', icon: 'fa-shopping-cart', color: 'text-sky-400', bg: 'bg-sky-500/10', border: 'border-sky-500/30' },
            'TAI_CHINH': { label: 'Tài Chính', icon: 'fa-sack-dollar', color: 'text-purple-400', bg: 'bg-purple-500/10', border: 'border-purple-500/30' },
            'NHAN_SU': { label: 'Nhân Sự', icon: 'fa-users', color: 'text-blue-400', bg: 'bg-blue-500/10', border: 'border-blue-500/30' },
            'UNREAD': { label: 'Chưa Đọc', icon: 'fa-bell', color: 'text-rose-400', bg: 'bg-rose-500/10', border: 'border-rose-500/30' }
        };

        // Parse list of notes from documents
        const allNotes = React.useMemo(() => {
            return (documents || [])
                .filter(d => d && (d.category === 'GHI_CHU_VAN_HANH' || d.category === 'Ghi Chú Nhanh' || String(d.id).startsWith('NOTE_')))
                .map(d => {
                    let meta = {};
                    try {
                        if (d.link && typeof d.link === 'string' && d.link.startsWith('{')) {
                            meta = JSON.parse(d.link);
                        } else if (d.link) {
                            meta = { targetTab: d.link, priority: 'NORMAL' };
                        }
                    } catch (e) {
                        meta = { targetTab: d.link || 'ALL', priority: 'NORMAL' };
                    }
                    let readList = [];
                    try {
                        if (d.readBy && typeof d.readBy === 'string' && d.readBy.startsWith('[')) {
                            readList = JSON.parse(d.readBy);
                        } else if (Array.isArray(d.readBy)) {
                            readList = d.readBy;
                        } else if (d.readBy) {
                            readList = [d.readBy];
                        }
                    } catch (e) {
                        readList = [];
                    }

                    const targetTab = meta.targetTab || 'ALL';
                    const priority = meta.priority || (d.testLink === 'PINNED' ? 'PINNED' : (d.testLink === 'URGENT' ? 'URGENT' : 'NORMAL'));
                    const isReadByMe = currentUser ? readList.some(u => String(u).trim().toLowerCase() === String(currentUser).trim().toLowerCase()) : false;

                    return {
                        ...d,
                        targetTab,
                        priority,
                        readList,
                        isReadByMe,
                        dateFormatted: d.createdAt ? String(d.createdAt).slice(0, 16).replace('T', ' ') : ''
                    };
                })
                .sort((a, b) => {
                    // Pinned first, then Urgent, then newest
                    const score = (item) => (item.priority === 'PINNED' ? 3 : (item.priority === 'URGENT' ? 2 : 1));
                    const diffScore = score(b) - score(a);
                    if (diffScore !== 0) return diffScore;
                    return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
                });
        }, [documents, currentUser]);

        // Filter by tab and search
        const filteredNotes = React.useMemo(() => {
            return allNotes.filter(n => {
                if (activeFilter === 'UNREAD') {
                    if (n.isReadByMe) return false;
                } else if (activeFilter !== 'ALL') {
                    if (n.targetTab !== activeFilter && n.targetTab !== 'ALL') return false;
                }
                if (search.trim()) {
                    const q = search.toLowerCase();
                    const matchTitle = (n.title || '').toLowerCase().includes(q);
                    const matchDesc = (n.description || '').toLowerCase().includes(q);
                    const matchAuthor = (n.createdBy || '').toLowerCase().includes(q);
                    if (!matchTitle && !matchDesc && !matchAuthor) return false;
                }
                return true;
            });
        }, [allNotes, activeFilter, search]);

        const unreadTotal = React.useMemo(() => allNotes.filter(n => !n.isReadByMe).length, [allNotes]);

        const handleOpenEdit = (note) => {
            setEditingNoteId(note.id);
            setFormTab(note.targetTab || 'KHO_HANG');
            setFormPriority(note.priority || 'NORMAL');
            setFormTitle(note.title || '');
            setFormContent(note.description || '');
            setIsFormOpen(true);
        };

        const handleResetForm = () => {
            setEditingNoteId(null);
            setFormTitle('');
            setFormContent('');
            setFormPriority('NORMAL');
            setIsFormOpen(false);
        };

        const handleSaveNote = async () => {
            if (!formTitle.trim()) {
                if (triggerToast) triggerToast('Vui lòng nhập tiêu đề ghi chú!', 'fa-exclamation-triangle', 'warning');
                return;
            }
            if (!formContent.trim()) {
                if (triggerToast) triggerToast('Vui lòng nhập nội dung ghi chú!', 'fa-exclamation-triangle', 'warning');
                return;
            }

            setSubmitting(true);
            try {
                const nowStr = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().replace('T', ' ').slice(0, 19);
                const metaJson = JSON.stringify({ targetTab: formTab, priority: formPriority });
                
                let docPayload;
                if (editingNoteId) {
                    const oldNote = allNotes.find(n => n.id === editingNoteId);
                    docPayload = {
                        id: editingNoteId,
                        category: 'GHI_CHU_VAN_HANH',
                        title: formTitle.trim(),
                        description: formContent.trim(),
                        link: metaJson,
                        createdAt: oldNote?.createdAt || nowStr,
                        createdBy: oldNote?.createdBy || currentUser || 'Rich Fish',
                        attachments: oldNote?.attachments || '',
                        testLink: formPriority,
                        readBy: JSON.stringify(oldNote?.readList || [])
                    };
                } else {
                    const newId = `NOTE_${Date.now()}_${Math.random().toString(36).substr(2, 4).toUpperCase()}`;
                    docPayload = {
                        id: newId,
                        category: 'GHI_CHU_VAN_HANH',
                        title: formTitle.trim(),
                        description: formContent.trim(),
                        link: metaJson,
                        createdAt: nowStr,
                        createdBy: currentUser || 'Rich Fish',
                        attachments: '',
                        testLink: formPriority,
                        readBy: JSON.stringify(currentUser ? [currentUser] : [])
                    };
                }

                await pushDeltas({ documents: [docPayload] }, editingNoteId ? 'Đã cập nhật ghi chú!' : 'Đã đăng ghi chú mới!', 'fa-check');
                handleResetForm();
            } catch (e) {
                if (triggerToast) triggerToast('Lỗi khi lưu ghi chú: ' + (e.message || e), 'fa-times', 'danger');
            } finally {
                setSubmitting(false);
            }
        };

        const handleToggleRead = async (note) => {
            if (!currentUser) return;
            try {
                let updatedList = [...(note.readList || [])];
                const myIdx = updatedList.findIndex(u => String(u).trim().toLowerCase() === String(currentUser).trim().toLowerCase());
                if (myIdx >= 0) {
                    updatedList.splice(myIdx, 1);
                } else {
                    updatedList.push(currentUser);
                }
                const updatedDoc = {
                    ...note,
                    category: 'GHI_CHU_VAN_HANH',
                    readBy: JSON.stringify(updatedList)
                };
                await pushDeltas({ documents: [updatedDoc] });
            } catch (e) {
                if (triggerToast) triggerToast('Lỗi cập nhật trạng thái đọc!', 'fa-times', 'danger');
            }
        };

        const handleDeleteNote = async (note) => {
            const isOwner = currentUser && note.createdBy === currentUser;
            if (!isAdmin && !isBoss && !isOwner) {
                if (triggerToast) triggerToast('Bạn không có quyền xoá ghi chú này!', 'fa-lock', 'warning');
                return;
            }
            if (!window.confirm(`Bạn có chắc muốn xoá ghi chú: "${note.title}"?`)) return;
            try {
                await pushDeltas({ deletes: { documents: [note.id] } }, 'Đã xoá ghi chú!', 'fa-trash');
            } catch (e) {
                if (triggerToast) triggerToast('Lỗi khi xoá: ' + (e.message || e), 'fa-times', 'danger');
            }
        };

        const handleTogglePin = async (note) => {
            try {
                const newPriority = note.priority === 'PINNED' ? 'NORMAL' : 'PINNED';
                const metaJson = JSON.stringify({ targetTab: note.targetTab, priority: newPriority });
                const updatedDoc = {
                    ...note,
                    category: 'GHI_CHU_VAN_HANH',
                    link: metaJson,
                    testLink: newPriority
                };
                await pushDeltas({ documents: [updatedDoc] }, newPriority === 'PINNED' ? 'Đã ghim ghi chú lên đầu!' : 'Đã bỏ ghim ghi chú!', 'fa-thumbtack');
            } catch (e) {
                if (triggerToast) triggerToast('Lỗi khi đổi trạng thái ghim!', 'fa-times', 'danger');
            }
        };

        return (
            <div className="fixed inset-0 z-[1200] flex items-center justify-center p-2 sm:p-4 bg-black/80 backdrop-blur-md animate-fade-in">
                <div className="bg-[#101014] border border-white/[0.12] rounded-3xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden animate-scale-up">
                    
                    {/* MODAL HEADER */}
                    <div className="p-4 sm:p-5 border-b border-white/[0.08] flex items-center justify-between bg-gradient-to-r from-[#18181f] via-[#121216] to-[#18181f] shrink-0">
                        <div className="flex items-center gap-3 min-w-0">
                            <div className="w-10 h-10 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400 text-lg shadow-sm shrink-0">
                                <i className="fas fa-sticky-note"></i>
                            </div>
                            <div className="min-w-0">
                                <h3 className="text-[15px] sm:text-[17px] font-black text-white uppercase tracking-wider flex items-center gap-2 flex-wrap">
                                    <span>Bảng Ghi Chú & Nhắc Việc Nội Bộ</span>
                                    {unreadTotal > 0 && (
                                        <span className="text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded-full font-bold animate-pulse">
                                            {unreadTotal} chưa đọc
                                        </span>
                                    )}
                                </h3>
                                <p className="text-[11px] text-zinc-400 font-medium truncate">Lưu ý quan trọng cho nhân sự theo từng khâu vận hành</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 shrink-0">
                            <button
                                type="button"
                                onClick={() => {
                                    if (isFormOpen) handleResetForm();
                                    else setIsFormOpen(true);
                                }}

                        {/* Search input */}
                        <div className="bg-[#141418] border border-white/[0.08] rounded-xl flex items-center px-3 py-1 focus-within:border-[#d4af37]/60 transition-all sm:w-60">

                    {/* MODAL BODY */}
                    <div className="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3 sm:p-5 space-y-3.5">
                        
                        {/* FORM TẠO / SỬA GHI CHÚ */}
                        {isFormOpen && (

                        {/* DANH SÁCH GHI CHÚ */}
                        {filteredNotes.length === 0 ? (

                                                        {isPinned && (
                                                            <span className="px-2 py-0.5 rounded-lg text-[9px] font-black uppercase bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center gap-1">
                                                                <i className="fas fa-thumbtack text-[8px]"></i> Đã Ghim

                                                            <span className="px-2 py-0.5 rounded-lg text-[9px] font-black uppercase bg-rose-500/20 text-rose-300 border border-rose-500/40 flex items-center gap-1 animate-pulse">

                                                    <div className="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">

                                                                title="Xoá ghi chú"

                                                    {note.title}

                                                    {note.description}

                                            </div>

                                            {/* Footer Card: Author, Time, Read Status */}
                                            <div className="pt-2.5 border-t border-white/[0.06] flex items-center justify-between gap-2 mt-2">
                                                <div className="text-[10px] text-zinc-400">
                                                    <span className="font-bold text-zinc-300"><i className="fas fa-user-circle mr-1 text-zinc-500"></i>{note.createdBy}</span>
                                                    {note.dateFormatted && (

                                                </div>

                                                <div className="flex items-center gap-2">

                                                        <span className="font-mono font-bold text-zinc-300">{note.readList?.length || 0}</span>
                                                    </div>

                                                    {/* Nút xác nhận Đã Đọc */}
                                                    {currentUser && (
                                                        <button
                                                            type="button"

                                                                note.isReadByMe
                                                                    ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30'
                                                                    : 'bg-white/[0.06] hover:bg-emerald-500/20 text-zinc-300 hover:text-emerald-300 border border-white/[0.1]'
                                                            }`}
                                                            title={note.isReadByMe ? 'Bấm để đánh dấu chưa đọc' : 'Bấm để xác nhận bạn đã đọc & nắm thông tin'}
                                                        >
                                                            <i className={`fas ${note.isReadByMe ? 'fa-check-double text-emerald-400' : 'fa-check'}`}></i>
                                                            <span>{note.isReadByMe ? 'Đã đọc' : 'Đã hiểu'}</span>
                                                        </button>
                                                    )}

                                    );

                        )}
                    </div>

                    {/* MODAL FOOTER */}
                    <div className="p-3 sm:p-4 border-t border-white/[0.08] bg-[#0c0c0e] flex items-center justify-between text-[11px] text-zinc-400 shrink-0">
                        <div className="flex items-center gap-2">
                            <i className="fas fa-info-circle text-[#d4af37]"></i>
                            <span>Ghi chú được lưu trữ & đồng bộ trực tiếp lên cơ sở dữ liệu hệ thống.</span>

                </div>
            </div>
        );
    }
    function QuickNotesPanel({ targetTab, documents = [], pushDeltas, currentUser, isBoss, triggerToast }) {
        const [isFormOpen, setIsFormOpen] = React.useState(false);
        const [editingNoteId, setEditingNoteId] = React.useState(null);
        const [formTitle, setFormTitle] = React.useState('');
        const [formContent, setFormContent] = React.useState('');
        const [expandedNoteId, setExpandedNoteId] = React.useState(null);

        // Optimistic UI local queues
        const [localAddedNotes, setLocalAddedNotes] = React.useState([]);
        const [localDeletedIds, setLocalDeletedIds] = React.useState([]);

        const isBossEffective = isBoss !== undefined ? isBoss : (
            localStorage.getItem('rf_boss') === 'true' || 
            localStorage.getItem('rf_role') === 'TỐI CAO' || 
            currentUser === 'Đỗ Tiến' || 
            currentUser === 'Tối Cao'
        );

        // Fallback to window._rf_documents if documents is empty
        const sourceDocs = (Array.isArray(documents) && documents.length > 0) 
            ? documents 
            : (window._rf_documents || []);

        // Filter notes for this tab strictly
        const notes = React.useMemo(() => {
            const tabAliasMap = {
                'DON_HANG': ['DON_HANG', 'ĐƠN HÀNG', 'orders', 'Đơn Hàng'],
                'SAN_XUAT': ['SAN_XUAT', 'SẢN XUẤT', 'production', 'Sản Xuất'],
                'KHO_HANG': ['KHO_HANG', 'KHO HÀNG', 'warehouse', 'Kho Hàng'],
                'TAI_CHINH': ['TAI_CHINH', 'TÀI CHÍNH', 'cashflow', 'Tài Chính'],
                'NHAN_SU': ['NHAN_SU', 'NHÂN SỰ', 'hr', 'Nhân Sự']
            };
            const validAliases = (tabAliasMap[targetTab] || [targetTab]).map(s => String(s).toUpperCase());

            // Merge prop documents + localAddedNotes and filter out localDeletedIds
            const merged = [...localAddedNotes, ...sourceDocs].filter(
                (d, idx, arr) => arr.findIndex(x => String(x.id) === String(d.id)) === idx && !localDeletedIds.includes(String(d.id))
            );

            return merged
                .filter(d => {
                    if (!d || !d.title) return false;
                    
                    let noteTab = '';
                    if (d.link) {
                        try {
                            const parsed = JSON.parse(d.link);
                            if (parsed && parsed.targetTab) noteTab = String(parsed.targetTab).toUpperCase();
                        } catch(e) {
                            noteTab = String(d.link).toUpperCase();
                        }
                    }

                    // 1. If note explicitly defines targetTab in link, match strictly
                    if (noteTab) {
                        return validAliases.includes(noteTab);
                    }

                    // 2. Otherwise match category strictly for legacy notes
                    const catUpper = String(d.category || '').toUpperCase();
                    if (validAliases.includes(catUpper)) {
                        return true;
                    }

                    return false;
                })
                .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        }, [sourceDocs, localAddedNotes, localDeletedIds, targetTab]);

        const handleEdit = (note, e) => {
            if (e) e.stopPropagation();
            setEditingNoteId(note.id);
            setFormTitle(note.title || '');
            setFormContent(note.description || '');
            setIsFormOpen(true);
            if (expandedNoteId !== note.id) {
                setExpandedNoteId(note.id);
            }
        };

        const handleCancelForm = () => {
            setIsFormOpen(false);
            setEditingNoteId(null);
            setFormTitle('');
            setFormContent('');
        };

        const handleSave = () => {
            if (!formTitle.trim() || !formContent.trim()) {
                if (triggerToast) triggerToast('Vui lòng nhập đủ Tiêu đề và Nội dung!', 'fa-exclamation', 'warning');
                return;
            }
            
            const nowStr = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().replace('T', ' ').slice(0, 19);
            
            if (editingNoteId) {
                const existingNote = notes.find(n => String(n.id) === String(editingNoteId)) || sourceDocs.find(n => String(n.id) === String(editingNoteId)) || {};
                const updatedPayload = {
                    ...existingNote,
                    id: editingNoteId,
                    category: existingNote.category || 'GHI_CHU_VAN_HANH',
                    title: formTitle.trim(),
                    description: formContent.trim(),
                    link: existingNote.link || JSON.stringify({ targetTab }),
                    createdAt: existingNote.createdAt || nowStr,
                    updatedAt: nowStr,
                    createdBy: existingNote.createdBy || currentUser || 'Rich Fish',
                    attachments: existingNote.attachments || '',
                    testLink: existingNote.testLink || 'NORMAL',
                    readBy: existingNote.readBy || '[]'
                };

                // OPTIMISTIC: Immediately update UI
                setLocalAddedNotes(prev => {
                    const filtered = prev.filter(x => String(x.id) !== String(editingNoteId));
                    return [updatedPayload, ...filtered];
                });
                setIsFormOpen(false);
                setEditingNoteId(null);
                setFormTitle('');
                setFormContent('');
                if (triggerToast) triggerToast('Đã cập nhật ghi chú thành công!', 'fa-check', 'success');

                // ASYNC BACKGROUND SYNC
                if (pushDeltas) {
                    pushDeltas({ documents: [updatedPayload], Documents: [updatedPayload] }).catch(err => {
                        console.error('Background sync failed:', err);
                    });
                }
            } else {
                const newId = `NOTE_${Date.now()}_${Math.random().toString(36).substr(2, 4).toUpperCase()}`;
                const docPayload = {
                    id: newId,
                    category: 'GHI_CHU_VAN_HANH',
                    title: formTitle.trim(),
                    description: formContent.trim(),
                    link: JSON.stringify({ targetTab }),
                    createdAt: nowStr,
                    createdBy: currentUser || 'Rich Fish',
                    attachments: '',
                    testLink: 'NORMAL',
                    readBy: '[]'
                };

                // OPTIMISTIC: Immediately update UI (0ms latency)
                setLocalAddedNotes(prev => [docPayload, ...prev]);
                setIsFormOpen(false);
                setFormTitle('');
                setFormContent('');
                if (triggerToast) triggerToast('Đã lưu ghi chú mới!', 'fa-check', 'success');

                // ASYNC BACKGROUND SYNC (Không chặn UI)
                if (pushDeltas) {
                    pushDeltas({ documents: [docPayload], Documents: [docPayload] }).catch(err => {
                        console.error('Background sync failed:', err);
                    });
                }
            }
        };

        const handleDelete = (noteId, e) => {
            e.stopPropagation();
            if (!window.confirm('Xoá ghi chú này?')) return;
            
            // OPTIMISTIC: Immediately remove from UI
            setLocalDeletedIds(prev => [...prev, String(noteId)]);
            if (editingNoteId === noteId) {
                handleCancelForm();
            }
            if (triggerToast) triggerToast('Đã xoá ghi chú', 'fa-trash', 'info');

            // ASYNC BACKGROUND SYNC
            if (pushDeltas) {
                pushDeltas({ deletes: { documents: [noteId], Documents: [noteId] } }).catch(err => {
                    console.error('Background delete sync failed:', err);
                });
            }
        };

        return (
            <div className="bg-[#121216] border border-amber-500/30 rounded-2xl p-4 my-2 animate-fade-in shadow-[0_5px_20px_rgba(245,158,11,0.05)] w-full shrink-0">
                <div className="flex justify-between items-center mb-3">
                    <h3 className="text-amber-400 font-black text-[13px] uppercase flex items-center gap-2">
                        <i className="fas fa-sticky-note"></i> Ghi Chú Nhanh
                    </h3>
                    {isBossEffective && (
                        <button 
                            onClick={() => {
                                if (isFormOpen && !editingNoteId) {
                                    handleCancelForm();
                                } else {
                                    setEditingNoteId(null);
                                    setFormTitle('');
                                    setFormContent('');
                                    setIsFormOpen(true);
                                }
                            }} 
                            className="bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 px-3 py-1.5 rounded-xl text-[11px] font-bold transition-colors shadow-sm active:scale-95 cursor-pointer"
                        >
                            {isFormOpen && !editingNoteId ? 'Đóng form' : '+ Tạo Ghi Chú'}
                        </button>
                    )}
                </div>

                {isFormOpen && isBossEffective && (
                    <div className="bg-[#0a0a0c] border border-amber-500/30 rounded-xl p-3.5 mb-4 space-y-3 animate-fade-in shadow-lg">
                        <div className="flex items-center justify-between border-b border-white/[0.06] pb-2">
                            <span className="text-[11px] font-black uppercase text-amber-400 flex items-center gap-1.5">
                                <i className={`fas ${editingNoteId ? 'fa-pen-to-square' : 'fa-plus-circle'}`}></i>
                                {editingNoteId ? 'Chỉnh Sửa Ghi Chú' : 'Tạo Ghi Chú Mới'}
                            </span>
                            {editingNoteId && (
                                <span className="text-zinc-500 text-[10px] font-mono">Đang sửa #{editingNoteId}</span>
                            )}
                        </div>
                        <input type="text" value={formTitle} onChange={e=>setFormTitle(e.target.value)} placeholder="Tiêu đề ghi chú..." className="w-full bg-[#121216] border border-white/[0.1] rounded-lg px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-amber-500/50" autoFocus />
                        <textarea value={formContent} onChange={e=>setFormContent(e.target.value)} rows={3} placeholder="Nội dung chi tiết..." className="w-full bg-[#121216] border border-white/[0.1] rounded-lg px-3 py-2.5 text-[12px] text-zinc-300 outline-none focus:border-amber-500/50 resize-none leading-relaxed" />
                        <div className="flex justify-end gap-2 pt-1">
                            <button onClick={handleCancelForm} className="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[11px] font-bold active:scale-95 transition-all cursor-pointer">Huỷ</button>
                            <button onClick={handleSave} className="px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:brightness-110 text-[#111] font-black text-[11px] uppercase tracking-wide active:scale-95 transition-all shadow-md flex items-center gap-1.5 cursor-pointer">
                                <i className="fas fa-save"></i> {editingNoteId ? 'Cập Nhật Ghi Chú' : 'Lưu Ghi Chú'}
                            </button>
                        </div>
                    </div>
                )}

                {notes.length === 0 ? (
                    <div className="text-center py-5 text-zinc-500/60 bg-[#18181b] rounded-xl border border-white/[0.03]">
                        <i className="fas fa-folder-open text-2xl mb-2 block opacity-50"></i>
                        <span className="text-[11px] font-bold">Chưa có ghi chú nào cho tab này</span>
                    </div>
                ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                        {notes.map(note => {
                            const isExpanded = expandedNoteId === note.id;
                            const isBeingEdited = editingNoteId === note.id;
                            return (
                                <div 
                                    key={note.id} 
                                    onClick={() => setExpandedNoteId(isExpanded ? null : note.id)} 
                                    className={`bg-[#18181b] border rounded-xl p-3.5 cursor-pointer transition-all flex flex-col group ${
                                        isBeingEdited 
                                            ? 'border-amber-400 bg-amber-500/10 shadow-[0_0_15px_rgba(245,158,11,0.15)] ring-1 ring-amber-400/50' 
                                            : (isExpanded ? 'border-amber-500/30 bg-[#1c1c1f] shadow-md' : 'border-white/[0.05] hover:border-amber-500/40')
                                    }`}
                                >
                                    <div className="flex justify-between items-start gap-2">
                                        <div className="font-bold text-[12.5px] text-zinc-200 leading-snug select-none flex-1">
                                            {note.title}
                                        </div>
                                        {isBossEffective && (
                                            <div className="flex items-center gap-1 shrink-0">
                                                <button 
                                                    type="button"
                                                    onClick={(e) => handleEdit(note, e)} 
                                                    className="w-6 h-6 rounded-lg bg-zinc-800/80 hover:bg-amber-500/20 text-zinc-400 hover:text-amber-300 flex items-center justify-center transition-all cursor-pointer shadow-sm active:scale-90" 
                                                    title="Sửa ghi chú"
                                                >
                                                    <i className="fas fa-pen text-[10px]"></i>
                                                </button>
                                                <button 
                                                    type="button"
                                                    onClick={(e) => handleDelete(note.id, e)} 
                                                    className="w-6 h-6 rounded-lg bg-zinc-800/80 hover:bg-rose-500/20 text-zinc-400 hover:text-rose-400 flex items-center justify-center transition-all cursor-pointer shadow-sm active:scale-90" 
                                                    title="Xoá ghi chú"
                                                >
                                                    <i className="fas fa-trash-alt text-[10px]"></i>
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                    {isExpanded && (
                                        <div className="mt-3 pt-3 border-t border-white/[0.06] text-[11.5px] text-zinc-400 whitespace-pre-wrap leading-relaxed animate-fade-in select-text">
                                            {note.description}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
        );
    }

    window.QuickNotesModal = QuickNotesModal;
    window.QuickNotesPanel = QuickNotesPanel;

    window.QuickExpenseModal = QuickExpenseModal;
    window.AdminApprovalModal = AdminApprovalModal;


    function NtfySettingsModal({ visible, onClose, triggerToast }) {
        if (!visible) return null;

        const [topic, setTopic] = React.useState(() => localStorage.getItem('rf_ntfy_topic') || 'rfworkspace');
        const [testing, setTesting] = React.useState(false);
        const [saveStatus, setSaveStatus] = React.useState(false);

        const handleSave = () => {
            const cleanTopic = topic.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'rfworkspace';
            localStorage.setItem('rf_ntfy_topic', cleanTopic);
            setTopic(cleanTopic);
            setSaveStatus(true);
            setTimeout(() => setSaveStatus(false), 2000);
            if (triggerToast) triggerToast(`Đã lưu kênh thông báo: ${cleanTopic}`, 'fa-check', 'success');
        };

        const handleTestNotification = async () => {
            setTesting(true);
            try {
                const cleanTopic = topic.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'rfworkspace';
                localStorage.setItem('rf_ntfy_topic', cleanTopic);
                if (typeof window.sendNtfyNotification === 'function') {
                    const res = await window.sendNtfyNotification(
                        'TEST THÔNG BÁO RF WORKSPACE',
                        'Kết nối thành công! Thiết bị của bạn đã sẵn sàng nhận thông báo đơn hàng và sản xuất tức thì.',
                        cleanTopic
                    );
                    if (res && res.success) {
                        if (triggerToast) triggerToast(`Đã bắn thông báo tới kênh [${cleanTopic}]!`, 'fa-paper-plane', 'success');
                    } else {
                        if (triggerToast) triggerToast('Lỗi khi bắn thông báo, vui lòng kiểm tra kết nối mạng!', 'fa-exclamation-triangle', 'danger');
                    }
                }
            } catch (err) {
                if (triggerToast) triggerToast('Lỗi: ' + err.message, 'fa-exclamation-triangle', 'danger');
            } finally {
                setTesting(false);
            }
        };

        const ntfyUrl = 'https:' + '/' + '/ntfy.sh/' + (topic.trim() || 'rfworkspace');

        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-md animate-fade-in">
                <div className="bg-[#121218] border border-white/10 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                    <div className="p-4 border-b border-white/[0.08] flex items-center justify-between bg-gradient-to-r from-[#d4af37]/15 via-transparent to-transparent">
                        <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 rounded-xl bg-[#d4af37]/20 border border-[#d4af37]/40 flex items-center justify-center text-[#d4af37] text-sm shadow-sm">
                                <i className="fas fa-bell"></i>
                            </div>
                            <div>
                                <h3 className="text-[13px] font-black text-white uppercase tracking-wider">Cài Đặt Thông Báo Di Động (ntfy.sh)</h3>
                                <p className="text-[10px] text-zinc-400">Nhận thông báo đơn hàng & vận hành tức thì 0ms trên iOS/Android</p>
                            </div>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition-colors">
                            <i className="fas fa-times text-xs"></i>
                        </button>
                    </div>

                    <div className="p-4 sm:p-5 overflow-y-auto space-y-4 text-[12px] text-zinc-300">
                        <div className="space-y-1.5">
                            <label className="text-[11px] font-black uppercase tracking-wider text-zinc-400 flex items-center justify-between">
                                <span>Tên Kênh Thông Báo (Topic Name)</span>
                                <span className="text-[9px] text-[#d4af37] font-normal">Miễn phí 100% không cần tài khoản</span>
                            </label>
                            <div className="flex gap-2">
                                <div className="relative flex-1">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs font-mono">ntfy.sh/</span>
                                    <input 
                                        type="text" 
                                        value={topic}
                                        onChange={(e) => setTopic(e.target.value)}
                                        placeholder="rfworkspace"
                                        className="w-full bg-[#181822] border border-white/10 rounded-xl pl-20 pr-3 py-2.5 text-[12px] font-mono text-white placeholder-zinc-600 focus:outline-none focus:border-[#d4af37]/60 transition-colors"
                                    />
                                </div>
                                <button 
                                    onClick={handleSave}
                                    className="px-4 py-2.5 bg-white/10 hover:bg-white/20 border border-white/15 text-white font-bold rounded-xl text-[11px] uppercase tracking-wider transition-all shrink-0 active:scale-95 flex items-center gap-1.5"
                                >
                                    <i className={saveStatus ? "fas fa-check text-emerald-400" : "fas fa-save"}></i>
                                    <span>{saveStatus ? 'Đã Lưu' : 'Lưu Kênh'}</span>
                                </button>
                            </div>
                            <p className="text-[10px] text-zinc-500">Mẹo: Nên đặt tên kênh độc nhất (VD: rf_xuong_aquarium) để tránh bị lẫn thông báo.</p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
                            <button
                                onClick={handleTestNotification}
                                disabled={testing}
                                className="w-full py-3 bg-gradient-to-r from-[#d4af37] to-amber-500 hover:brightness-110 text-black font-black rounded-xl text-[11px] uppercase tracking-wider transition-all shadow-lg shadow-amber-950/30 flex items-center justify-center gap-2 active:scale-95 cursor-pointer disabled:opacity-50"
                            >
                                <i className={testing ? "fas fa-spinner fa-spin" : "fas fa-paper-plane"}></i>
                                <span>{testing ? 'Đang Bắn...' : 'Bắn Thử Thông Báo'}</span>
                            </button>
                            <a
                                href={ntfyUrl}
                                target="_blank"
                                rel="noreferrer"
                                className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 border border-white/10 text-zinc-200 font-bold rounded-xl text-[11px] uppercase tracking-wider transition-all flex items-center justify-center gap-2 active:scale-95 text-center"
                            >
                                <i className="fas fa-external-link-alt text-zinc-400"></i>
                                <span>Mở Kênh Trên Web</span>
                            </a>
                        </div>

                        <div className="bg-[#181822] border border-white/[0.08] rounded-xl p-3.5 space-y-2 mt-2">
                            <div className="text-[11px] font-black text-[#d4af37] uppercase tracking-wider flex items-center gap-1.5">
                                <i className="fas fa-mobile-alt"></i> 3 Bước Nhận Thông Báo Trên Điện Thoại:
                            </div>
                            <div className="space-y-2 text-[11px] text-zinc-400 leading-relaxed">
                                <div className="flex items-start gap-2">
                                    <span className="w-4 h-4 rounded-full bg-[#d4af37]/20 text-[#d4af37] text-[9px] font-black flex items-center justify-center shrink-0 mt-0.5">1</span>
                                    <span>Tải ứng dụng ntfy miễn phí trên App Store (iOS) hoặc Google Play (Android).</span>
                                </div>
                                <div className="flex items-start gap-2">
                                    <span className="w-4 h-4 rounded-full bg-[#d4af37]/20 text-[#d4af37] text-[9px] font-black flex items-center justify-center shrink-0 mt-0.5">2</span>
                                    <span>Mở app, bấm dấu cộng (Subscribe) và nhập tên kênh: {topic || 'rfworkspace'}</span>
                                </div>
                                <div className="flex items-start gap-2">
                                    <span className="w-4 h-4 rounded-full bg-[#d4af37]/20 text-[#d4af37] text-[9px] font-black flex items-center justify-center shrink-0 mt-0.5">3</span>
                                    <span>Bấm nút Bắn Thử Thông Báo ở trên để điện thoại rung và nhận thông báo ngay lập tức!</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="p-3 bg-black/30 border-t border-white/[0.08] flex justify-end">
                        <button onClick={onClose} className="px-5 py-2 bg-white/10 hover:bg-white/15 text-white font-bold rounded-xl text-[11px] transition-colors">
                            Đóng
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    window.NtfySettingsModal = NtfySettingsModal;
    window.ImageAnnotationModal = ImageAnnotationModal;
</script>
