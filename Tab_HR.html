            const userAttsWithRealTime = userAtts.map(a => {
                const gateHours = cleanNumber(a.totalHours);
                const { activeHours, idleHours } = calcActiveHoursForDay(u, a.date, gateHours);
                totalActiveHours += cleanNumber(activeHours);
                totalIdleHours += cleanNumber(idleHours);
                return {
                    ...a,
                    activeHours: cleanNumber(activeHours).toFixed(2),
                    idleHours: cleanNumber(idleHours).toFixed(2),
                    totalHours: cleanNumber(a.totalHours).toFixed(2),
                    gateHours: gateHours.toFixed(2)
                };
            });

            const daysWorked = new Set(userAtts.filter(a => cleanNumber(a.totalHours) >= 2 && a.shift !== 'Nghỉ Phép').map(a => String(a.date).slice(0, 10))).size;
            const hoursWorked = totalActiveHours;
            const totalGateHours = userAtts.reduce((sum, a) => sum + cleanNumber(a.totalHours), 0);
            const baseSalary = cleanNumber(sal.baseSalary) || cleanNumber(sal['Lương Cơ Bản']) || 0;
            let hourlyRate = baseSalary > 1000000 ? Math.round(baseSalary / standardWorkDays / 8) : baseSalary;

            // I. CÁC KHOẢN THU NHẬP
            const luongChinh = Math.round(hourlyRate * totalGateHours) || 0;
            const luongLamThemGio = userBPs.filter(b => b.type === 'Lương Làm Thêm Giờ').reduce((sum, b) => sum + cleanNumber(b.amount), 0);

            let prodSalary = 0;
            let kpiSanXuatDetails = [];
            let kpiDongGoiDetails = [];
            let kpiBanHangDetails = [];
            let thuongDetails = [];

            let hoaHongBanHang = 0;
            userBPs.filter(b => b.type === 'Thưởng Bán Hàng').forEach(b => {
                let amt = cleanNumber(b.amount);
                hoaHongBanHang += amt;
                const detailName = (b.note || b.orderCode) ? `Chốt đơn: ${b.orderCode || ''} ${b.note || ''}`.trim() : 'Thưởng chốt đơn bán hàng';
                if (amt !== 0) kpiBanHangDetails.push({ name: detailName, amount: amt, time: b.date });
            });

            let hoTroSanLuong = 0;
            userBPs.filter(b => b.type === 'Hỗ Trợ Sản Lượng').forEach(b => {
                let amt = cleanNumber(b.amount);
                hoTroSanLuong += amt;
                if (amt !== 0) thuongDetails.push({ name: b.note ? `Hỗ trợ: ${b.note}` : 'Hỗ trợ năng suất kho', amount: amt, time: b.date });
            });

            safeProdItems.forEach(p => {
                const k1Time = p.phases?.phase1?.endTime || p.date || p.deadline;
                const k2Time = p.phases?.phase2?.endTime || p.date || p.deadline;

                const orderMatch = getOrderMatch(p.orderId);

                const channel = String(p.channel || p.orderChannel || orderMatch?.channel || '').toUpperCase().trim();
                const isIntl = (typeof isExportChannel === 'function' && isExportChannel(channel)) || (
                    channel.includes('XUẤT KHẨU') || channel.includes('EXPORT') || channel.includes('QUỐC TẾ') ||
                    /\bSHOPEE\s*[-_]?\s*(TH|MA|MY|SG|TW|PH|MALAYSIA|THAILAND|PHILIPPINES|SINGAPORE|TAIWAN)\b/i.test(channel) ||
                    /\b(SHOPEE_TH|SHOPEE_MA|SHOPEE_MY|SHOPEE_SG|SHOPEE_TW|SHOPEE_PH)\b/i.test(channel) ||
                    (/\b(MY|TH|PH|SG|TW|MA)\b/i.test(channel) && channel.includes('SHOPEE'))
                );

                const isStockItem = p.fulfilledFromStock === true || String(p.fulfilledFromStock).toUpperCase() === 'TRUE';
                if (isStockItem) return; 

                const isItemCompleted = p.status === 'Done' || String(p.status).toUpperCase() === 'ĐÃ XONG' || String(p.status).toUpperCase() === 'HOÀN KHO ĐẠT';

                if (isUserMatch(p.phases?.phase1?.user, u) && p.phases?.phase1?.status === 'Done' && isItemCompleted && k1Time && isDateInRange(k1Time, filter, customMonth)) {
                    let amt = 0;
                    let isAppliedX3 = false;
                    if (typeof getSopAndReward === 'function') {
                        const kInfo = getSopAndReward(p, p.phases?.phase1?.name || 'phase1', window.kpiConfig || erpData?.Config_KPI || [], channel);
                        if (kInfo && kInfo.reward) {
                            amt = cleanNumber(kInfo.reward);
                            isAppliedX3 = isIntl;
                        }
                    }
                    if (amt === 0) {
                        amt = cleanNumber(p.phases?.phase1?.reward_vnd);
                        if (isIntl && amt > 0) {
                            amt = amt * 3;
                            isAppliedX3 = true;
                        }
                    }
                    prodSalary += amt;
                    if (amt > 0) kpiSanXuatDetails.push({ name: `[K1] ${p.name}`, amount: amt, time: k1Time, isX3: isAppliedX3 });
                }

                if (isUserMatch(p.phases?.phase2?.user, u) && p.phases?.phase2?.status === 'Done' && isItemCompleted && k2Time && isDateInRange(k2Time, filter, customMonth)) {
                    let amt = 0;
                    let isAppliedX3 = false;
                    if (typeof getSopAndReward === 'function') {
                        const kInfo = getSopAndReward(p, p.phases?.phase2?.name || 'phase2', window.kpiConfig || erpData?.Config_KPI || [], channel);
                        if (kInfo && kInfo.reward) {
                            amt = cleanNumber(kInfo.reward);
                            isAppliedX3 = isIntl;
                        }
                    }
                    if (amt === 0) {
                        amt = cleanNumber(p.phases?.phase2?.reward_vnd);
                        if (isIntl && amt > 0) {
                            amt = amt * 3;
                            isAppliedX3 = true;
                        }
                    }
                    prodSalary += amt;
                    if (amt > 0) kpiSanXuatDetails.push({ name: `[K2] ${p.name}`, amount: amt, time: k2Time, isX3: isAppliedX3 });
                }
            });

            safePackings.forEach(pk => {
                if (isUserMatch(pk.user, u) && pk.status === 'Done' && (pk.endTime || pk.date) && isDateInRange(pk.endTime || pk.date, filter, customMonth)) {
                    const orderMatch = getOrderMatch(pk.orderId);

                    const orderStatus = String(orderMatch?.status || '').toUpperCase().trim();
                    if (orderStatus.includes('HỦY') || orderStatus.includes('HUỶ') || orderStatus.includes('HOÀN') || orderStatus === 'CANCELLED') {
                        return;
                    }

                    const channel = String(pk.channel || pk.orderChannel || orderMatch?.channel || '').toUpperCase().trim();
                    const isIntl = (typeof isExportChannel === 'function' && isExportChannel(channel)) || (
                        channel.includes('XUẤT KHẨU') || channel.includes('EXPORT') || channel.includes('QUỐC TẾ') ||
                        /\bSHOPEE\s*[-_]?\s*(TH|MA|MY|SG|TW|PH|MALAYSIA|THAILAND|PHILIPPINES|SINGAPORE|TAIWAN)\b/i.test(channel) ||
                        /\b(SHOPEE_TH|SHOPEE_MA|SHOPEE_MY|SHOPEE_SG|SHOPEE_TW|SHOPEE_PH)\b/i.test(channel) ||
                        (/\b(MY|TH|PH|SG|TW|MA)\b/i.test(channel) && channel.includes('SHOPEE'))
                    );

                    let amt = 0;
                    let isAppliedX3 = false;
                    const kpiList = window.kpiConfig || erpData?.Config_KPI || [];

                    if (String(pk.id).includes('PK_WH_')) {
                        amt = cleanNumber(pk.reward_vnd || 10000);
                        prodSalary += amt;
                        if (amt > 0) kpiDongGoiDetails.push({ name: 'Chở ra kho', amount: amt, time: pk.endTime || pk.date });
                    } else {
                        const candidateItems = [];

                        // Quét sản phẩm sản xuất (Production) thuộc đơn này
                        const matchedProds = (safeProdItems || []).filter(p => p.orderId === pk.orderId || (orderMatch?.id && p.orderId === orderMatch.id));
                        matchedProds.forEach(p => { if (p?.name) candidateItems.push(p.name); });

                        if (orderMatch?.items && Array.isArray(orderMatch.items)) {
                            orderMatch.items.forEach(i => { if (i?.name) candidateItems.push(i.name); });
                        }
                        if (orderMatch?.products) {
                            if (typeof orderMatch.products === 'string' && orderMatch.products.startsWith('[')) {
                                try {
                                    const parsed = JSON.parse(orderMatch.products);
                                    if (Array.isArray(parsed)) parsed.forEach(i => { if (i?.name) candidateItems.push(i.name); });
                                    else candidateItems.push(orderMatch.products);
                                } catch (e) { candidateItems.push(orderMatch.products); }
                            } else {
                                candidateItems.push(String(orderMatch.products));
                            }
                        }
                        if (orderMatch?.accessories) {
                            const parsedAcc = typeof safeParseAccessories === 'function' ? safeParseAccessories(orderMatch.accessories) : [];
                            if (parsedAcc && parsedAcc.length > 0) {
                                parsedAcc.forEach(a => {
                                    if (a?.name) candidateItems.push(a.name);
                                    if (a?.sku) candidateItems.push(a.sku);
                                });
                            } else if (typeof orderMatch.accessories === 'string') {
                                candidateItems.push(orderMatch.accessories);
                            }
                        }
                        if (orderMatch?.note) candidateItems.push(String(orderMatch.note));

                        const recordedReward = cleanNumber(pk.reward_vnd);
                        // Cố định 1.100đ/đơn: Ưu tiên recordedReward trong Packings, nếu chưa có thì mặc định 1.100đ
                        amt = recordedReward > 0 ? recordedReward : 1100;
                        if (isIntl) isAppliedX3 = true;

                        prodSalary += amt;
                        const pkgLabel = orderMatch?.orderCode ? `Đóng gói (${orderMatch.orderCode})` : 'Đóng gói';
                        if (amt > 0) kpiDongGoiDetails.push({ name: pkgLabel, amount: amt, time: pk.endTime || pk.date, isX3: isAppliedX3 });
                    }
                }
            });

            const hoaHongSanXuat = cleanNumber(prodSalary);

            const isXuKPI = (k) => {
                const uStr = String(k.unit || '').toLowerCase().trim();
                const idStr = String(k.id || '').toUpperCase();
                const typeStr = String(k.type || '').toUpperCase();
                const nameStr = String(k.kpiName || '').toLowerCase();
                return uStr === 'xu' || uStr.includes('xu') || idStr.startsWith('KPI_XU_') || typeStr === 'XU_REWARD' || nameStr.includes('nhận xu') || nameStr.includes('thưởng xu');
            };

            const isKpiInSelectedPeriod = (k) => {
                if (!matchUser(k.user, u)) return false;
                if (isXuKPI(k)) return false;
                return isKpiInSelectedMonth(k, filter, customMonth);
            };

            const devKpisClaimed = (erpData?.KPI_Progress || []).filter(k =>
                isKpiInSelectedPeriod(k) &&
                (k.isClaimed === true || String(k.isClaimed).toLowerCase() === 'true' || (Number(k.target) > 0 && Number(k.current) >= Number(k.target)))
            );
            const funcSalary = devKpisClaimed.reduce((sum, k) => sum + cleanNumber(k.reward), 0);

            const allAssignedKpis = (erpData?.KPI_Progress || []).filter(k =>
                isKpiInSelectedPeriod(k)
            );
            const funcSalaryTarget = allAssignedKpis.reduce((sum, k) => sum + cleanNumber(k.reward), 0);

            const allowanceConfig = cleanNumber(sal.allowance) || cleanNumber(sal['Phụ Cấp Xăng Xe']) || 0;
            const phuCapKhac = userBPs.filter(b => b.type === 'Phụ Cấp Khác').reduce((sum, b) => sum + cleanNumber(b.amount), 0);
            const tongPhuCap = funcSalary + allowanceConfig + phuCapKhac;
            const tongPhuCapTarget = funcSalaryTarget + allowanceConfig + phuCapKhac;

            // 1. Phụ Cấp Khác (Ghi rõ từng khoản theo ghi chú / lý do riêng)
            userBPs.filter(b => b.type === 'Phụ Cấp Khác').forEach(b => {
                const amt = cleanNumber(b.amount);
                if (amt !== 0) {
                    const detailName = (b.note && b.note.trim()) ? b.note.trim() : 'Phụ cấp khác';
                    thuongDetails.push({ id: b.id, name: detailName, amount: amt, time: b.date, type: b.type, note: b.note });
                }
            });

            // 2. Thưởng Nóng / Thưởng (Ghi rõ từng khoản riêng biệt kèm Lý do / Ghi chú / Mã đơn, TUYỆT ĐỐI không cộng dồn gộp)
            const thuongNong = userBPs.filter(b => b.type === 'Thưởng Nóng' || b.type === 'Thưởng').reduce((sum, b) => sum + cleanNumber(b.amount), 0);
            userBPs.filter(b => b.type === 'Thưởng Nóng' || b.type === 'Thưởng').forEach(b => {
                const amt = cleanNumber(b.amount);
                if (amt !== 0) {
                    let detailName = (b.note && b.note.trim()) ? b.note.trim() : (b.orderCode ? `Thưởng đơn ${b.orderCode}` : 'Thưởng nóng');
                    thuongDetails.push({ id: b.id, name: detailName, amount: amt, time: b.date, type: b.type, orderCode: b.orderCode, note: b.note });
                }
            });

            // 3. Thưởng Chuyên Cần
            const manualChuyenCanRec = userBPs.find(b => b.type === 'Thưởng Chuyên Cần');
            const chuyenCan = manualChuyenCanRec ? cleanNumber(manualChuyenCanRec.amount) : ((daysWorked >= 28 || totalGateHours >= 216) ? 500000 : 0);
            const tongThuong = thuongNong + chuyenCan;

            userBPs.filter(b => b.type === 'Thưởng Chuyên Cần').forEach(b => {
                const amt = cleanNumber(b.amount);
                if (amt !== 0) {
                    const detailName = (b.note && b.note.trim()) ? b.note.trim() : 'Thưởng Chuyên Cần';
                    thuongDetails.push({ id: b.id, name: detailName, amount: amt, time: b.date, type: b.type, note: b.note });
                }
            });
            if (!manualChuyenCanRec && chuyenCan > 0) {
                thuongDetails.push({ name: 'Thưởng Chuyên Cần (Đạt chuẩn công)', amount: chuyenCan, time: '' });
            }

            // 4. Các Khoản Thu Nhập Khác
            const cacKhoanThuKhacRec = userBPs.find(b => b.type === 'Thu Nhập Khác' || b.type === 'Các Khoản Thu Khác');
            const cacKhoanThuKhac = userBPs.filter(b => b.type === 'Thu Nhập Khác' || b.type === 'Các Khoản Thu Khác').reduce((sum, b) => sum + cleanNumber(b.amount), 0);
            const cacKhoanThuKhacNote = cacKhoanThuKhacRec ? cacKhoanThuKhacRec.note : '';

            userBPs.filter(b => b.type === 'Thu Nhập Khác' || b.type === 'Các Khoản Thu Khác').forEach(b => {
                const amt = cleanNumber(b.amount);
                if (amt !== 0) {
                    const detailName = (b.note && b.note.trim()) ? b.note.trim() : 'Khoản thu nhập khác';
                    thuongDetails.push({ id: b.id, name: detailName, amount: amt, time: b.date, type: b.type, note: b.note });
                }
            });

            // 5. Bổ sung các khoản thưởng dương phát sinh khác chưa nằm trong danh mục trên
            const excludeBonusTypes = [
                'Lương Làm Thêm Giờ', 'Thưởng Bán Hàng', 'Hỗ Trợ Sản Lượng', 'Phụ Cấp Khác',
                'Thưởng Nóng', 'Thưởng', 'Thưởng Chuyên Cần', 'Thu Nhập Khác', 'Các Khoản Thu Khác',
                'Nhận Xét', 'Tạm Ứng', 'Thanh Toán Lương', 'Đã Trả', 'Phạt Quy Định', 'Chi Phí Bảo Hành'
            ];
            userBPs.filter(b => !excludeBonusTypes.includes(b.type) && cleanNumber(b.amount) > 0).forEach(b => {
                const amt = cleanNumber(b.amount);
                const detailName = (b.note && b.note.trim()) ? b.note.trim() : (b.type || 'Khoản thưởng khác');
                thuongDetails.push({ id: b.id, name: detailName, amount: amt, time: b.date, type: b.type, note: b.note });
            });

            // Tính chính xác số ngày nghỉ trong chu kỳ (ví dụ Tháng 8 có 31 ngày, đi làm 23 ngày -> nghỉ 8 ngày)
            const [fYearStr, fMonthStr] = filterYM.split('-');
            const fYear = parseInt(fYearStr, 10);
            const fMonth = parseInt(fMonthStr, 10);
            const daysInMonth = new Date(fYear, fMonth, 0).getDate(); // Tháng 8 = 31 ngày, Tháng 9 = 30 ngày
            const isCurrentMonthRunning = (fYear === today.getFullYear() && fMonth === (today.getMonth() + 1));
            
            const todayIsoStr = typeof getLocalISODate === 'function' ? getLocalISODate().slice(0, 10) : new Date().toISOString().slice(0, 10);
            const isTodayWorked = userAtts.some(a => cleanNumber(a.totalHours) >= 2 && a.shift !== 'Nghỉ Phép' && String(a.date).slice(0, 10) === todayIsoStr);
            const daysElapsed = isCurrentMonthRunning ? (isTodayWorked ? today.getDate() : Math.max(0, today.getDate() - 1)) : daysInMonth;

            const allowedLeaveDays = Math.max(2, daysInMonth - standardWorkDays);
            const soNgayNghi = Math.max(0, daysElapsed - daysWorked);

            const phatVuotNgayNghi = 0; // Không tự động phạt cứng để tránh tính sai lệch
            const phatQuyDinhRec = userBPs.find(b => b.type === 'Phạt Quy Định' || String(b.type).toLowerCase().includes('phạt'));
            const phatQuyDinh = Math.abs(userBPs.filter(b => (b.type === 'Phạt Quy Định' || String(b.type).toLowerCase().includes('phạt')) && cleanNumber(b.amount) !== 0).reduce((sum, b) => sum + cleanNumber(b.amount), 0)) + userAtts.reduce((sum, a) => sum + cleanNumber(a.penalty), 0);
            const phatQuyDinhNote = phatQuyDinhRec ? phatQuyDinhRec.note : '';
            const phiCongDoan = 100000;
            const chiPhiBaoHanh = Math.abs(userBPs.filter(b => b.type === 'Chi Phí Bảo Hành').reduce((sum, b) => sum + cleanNumber(b.amount), 0));
            const tamUng = Math.abs(userBPs.filter(b => b.type === 'Tạm Ứng').reduce((sum, b) => sum + cleanNumber(b.amount), 0));
            const excludeGiamTru = ['Phạt Quy Định', 'Chi Phí Bảo Hành', 'Tạm Ứng', 'Thanh Toán Lương', 'Đã Trả'];
            const giamTruKhac = Math.abs(userBPs.filter(b => !excludeGiamTru.includes(b.type) && !String(b.type).toLowerCase().includes('phạt') && cleanNumber(b.amount) < 0).reduce((sum, b) => sum + cleanNumber(b.amount), 0));
            const tongGiamTru = cleanNumber(phatQuyDinh + phiCongDoan + chiPhiBaoHanh + tamUng + giamTruKhac);

            // Lương cơ bản chuẩn nếu đi làm đủ công (Tháng 8: 28 công, Tháng 9 trở đi: 26 công)
            const targetBaseSalary = baseSalary > 0
                ? (baseSalary > 1000000 ? baseSalary : Math.round(baseSalary * standardWorkDays * 8))
                : (isFromSept2026 ? 3900000 : 4200000);

            // Tổng lương mục tiêu = Lương chuẩn đủ công + Thưởng KPI đạt 100% + Trợ cấp + KPI Sản xuất, đóng gói, bán hàng + Thưởng khác - Công đoàn - Các khoản phạt
            const targetPhuCap = allowanceConfig + phuCapKhac;
            const targetGiamTru = phiCongDoan + phatQuyDinh + chiPhiBaoHanh + giamTruKhac;
            const rawTongThuNhapTarget = targetBaseSalary + funcSalaryTarget + targetPhuCap + hoaHongSanXuat + hoaHongBanHang + hoTroSanLuong + luongLamThemGio + tongThuong + cacKhoanThuKhac - targetGiamTru;
            const tongThuNhapTarget = Math.max(0, cleanNumber(rawTongThuNhapTarget));

            const rawTongThuNhap = luongChinh + luongLamThemGio + hoaHongSanXuat + hoTroSanLuong + tongPhuCap + tongThuong + hoaHongBanHang + cacKhoanThuKhac;
            const tongThuNhap = cleanNumber(rawTongThuNhap);

            const totalSalary = cleanNumber(tongThuNhap - tongGiamTru);
            const daTraNhanVien = Math.abs(userBPs.filter(b => b.type === 'Đã Trả' || b.type === 'Thanh Toán Lương').reduce((sum, b) => sum + cleanNumber(b.amount), 0));
            const conCanTra = cleanNumber(totalSalary - daTraNhanVien);

            const nhanXetRec = userBPs.find(b => b.type === 'Nhận Xét');
            const nhanXetText = nhanXetRec ? nhanXetRec.note : 'Không có nhận xét nào được viết tại đây.';
            const soGioNghiKhongPhep = userAtts.filter(a => String(a.status).includes('không phép')).length * 8;

            let penaltyDetails = [];
            userBPs.filter(b => (b.type === 'Phạt Quy Định' || String(b.type).toLowerCase().includes('phạt')) && cleanNumber(b.amount) !== 0).forEach(b => {
                penaltyDetails.push({ id: b.id, name: b.note || b.type, amount: Math.abs(cleanNumber(b.amount)), time: b.date, type: b.type, isAttendance: false });
            });
            userAtts.forEach(a => { if (cleanNumber(a.penalty) > 0) penaltyDetails.push({ id: a.id, name: a.note || 'Vi phạm giờ công', amount: cleanNumber(a.penalty), time: a.date, record: a, isAttendance: true }); });

            let tamUngDetails = [];
            userBPs.filter(b => b.type === 'Tạm Ứng').forEach(b => {
                const amt = Math.abs(cleanNumber(b.amount));
                if (amt > 0) tamUngDetails.push({ name: b.note ? `Tạm ứng: ${b.note}` : 'Tạm ứng lương', amount: amt, time: b.date, type: b.type, id: b.id });
            });

            let chiPhiBaoHanhDetails = [];
            userBPs.filter(b => b.type === 'Chi Phí Bảo Hành').forEach(b => {
                const amt = Math.abs(cleanNumber(b.amount));
                if (amt > 0) chiPhiBaoHanhDetails.push({ name: b.note ? `Bảo hành: ${b.note}` : 'Chi phí bảo hành, đền bù', amount: amt, time: b.date, type: b.type, id: b.id });
            });

            let giamTruKhacDetails = [];
            userBPs.filter(b => !excludeGiamTru.includes(b.type) && !String(b.type).toLowerCase().includes('phạt') && cleanNumber(b.amount) < 0).forEach(b => {
                const amt = Math.abs(cleanNumber(b.amount));
                if (amt > 0) giamTruKhacDetails.push({ name: b.note ? `${b.type || 'Giảm trừ'}: ${b.note}` : (b.type || 'Khoản giảm trừ khác'), amount: amt, time: b.date, type: b.type, id: b.id });
            });

            const periodLabel = `Tháng ${fMonthStr}/${fYearStr}`;
            const payslipCode = `PL-${u.replace(/\s+/g, '')}-${fMonthStr}${fYearStr}`;
            const soLanDiMuon = userAtts.filter(a => String(a.status).includes('Đi muộn')).length;
            const soLanPhat = penaltyDetails.length;
            let leaveRecords = userAtts.filter(a => a.leaveStart || a.shift === 'Nghỉ Phép');
            let lastLeave = leaveRecords.length > 0 ? leaveRecords[leaveRecords.length - 1] : null;

            kpiSanXuatDetails.sort((a, b) => new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime());
            kpiDongGoiDetails.sort((a, b) => new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime());
            kpiBanHangDetails.sort((a, b) => new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime());

                    const fullDayStr = `${matrixYear}-${String(matrixMonthNum).padStart(2, '0')}-${d}`;
                    const dayRecords = userAtts.filter(a => String(a.date).startsWith(fullDayStr));
                    const workShifts = dayRecords.filter(a => a.shift !== 'Nghỉ Phép' && !a.leaveType);
                    const leaveRecords = dayRecords.filter(a => a.shift === 'Nghỉ Phép' || a.leaveType || String(a.status || '').toLowerCase().includes('nghỉ'));

                    const totalDayHours = workShifts.reduce((sum, a) => {
                        let h = Number(a.gateHours || a.totalHours || 0);
                        if (h <= 0 && a.timeIn && a.timeOut) {
                            const [inH, inM] = String(a.timeIn).split(':').map(Number);
                            const [outH, outM] = String(a.timeOut).split(':').map(Number);
                            if (!isNaN(inH) && !isNaN(outH)) {
                                let startMins = inH * 60 + (inM || 0);
                                let endMins = outH * 60 + (outM || 0);
                                if (endMins < startMins) endMins += 24 * 60;
                                h = Math.max(0, (endMins - startMins) / 60);
                            }
                        }
                        return sum + h;
                    }, 0);

                    const hasLate = workShifts.some(a => {
                        const st = String(a.status || '').toLowerCase();
                        return st.includes('muộn') || Number(a.penalty || 0) > 0 || (a.note && a.note.toLowerCase().includes('muộn'));
                    });

                    if (totalDayHours > 0) totalHoursWorker += totalDayHours;

                    let cellBg = '';
                    let cellColor = '#666';

                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}

                                {hideResigned && (

                                        <span>{isSyncingKpi ? 'Đang Tính Toán...' : '⚡ Đồng Bộ KPI Ngay'}</span>
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={toggleHideResigned}

                                        hideResigned 
                                            ? 'bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border-amber-500/40 shadow-[0_0_10px_rgba(245,158,11,0.2)]' 
                                            : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border-zinc-700'
                                    }`}
                                    title={hideResigned ? "Đang BẬT bộ lọc ẩn nhân sự đã nghỉ. Bấm để hiển thị toàn bộ." : "Đang TẮT bộ lọc. Bấm để ẩn nhân sự đã nghỉ việc."}

                                    <i className={`fas ${hideResigned ? 'fa-eye-slash text-amber-400' : 'fa-eye text-zinc-400'} text-[11px]`}></i>

                                    title="In Báo Cáo Tổng Hợp Nhiệm Vụ & Tiến Độ KPI Toàn Xưởng (Khổ A4 Dọc)"
                                >
                                    <i className="fas fa-print text-[11px]"></i>
                                    <span>In Báo Cáo Nhiệm Vụ</span>

                        {(() => {

                            const pendingXuTasksKPI = kpiData.filter(k => (String(k.unit).toLowerCase() === 'xu' || String(k.id).startsWith('KPI_XU_')) && !(k.isClaimed === 'true' || k.isClaimed === true) && isKpiInSelectedMonth(k, filter, customMonth)).map(k => ({ id: k.id, name: k.kpiName, amount: k.reward, date: formatDR(k.startTime, k.endTime), user: k.user, isDone: false, desc: k.guide || k.Guide || k.desc || k.note, startTime: k.startTime, endTime: k.endTime }));

                                    </div>

                                            const isExp = expandedTaskMap[t.id];

                                    // Thưởng KPI trọn đời: lấy từ allClaimedKPIs để cấp độ không bị tụt khi sang tháng mới
                                    const allKpiVndList = allClaimedKPIs.filter(k => !(String(k.unit || '').toLowerCase() === 'xu' || String(k.id || '').startsWith('KPI_XU_')));
                                    const totalKPIVnd = allKpiVndList.reduce((sum, k) => sum + (Number(k.reward) || 0), 0);

                                    const userAttRecords = (rawAttData || []).filter(a => matchUser(a.user, u));

                                    const rawBaseSalary = Number(userSal?.baseSalary || userSal?.['Lương Cơ Bản'] || 0);
                                    const baseHourlyRate = Number(userSal?.hourlyRate || (rawBaseSalary > 0 ? Math.round(rawBaseSalary / 208 / 1000) * 1000 : 20000)) || 20000;
                                    const totalAttendanceSalary = userAttRecords.reduce((sum, a) => {
                                        const hrs = Number(a.totalHours) || ((a.morningIn && a.morningOut ? 4 : 0) + (a.afternoonIn && a.afternoonOut ? 4 : 0));
                                        return sum + (hrs * baseHourlyRate);
                                    }, 0);

                                    let totalProdReward = 0;
                                    (prodItems || []).forEach(item => {

                                            if (ph && ph.status === 'Done' && matchUser(ph.user, u)) {

                                    const userPackings = (packings || erpData?.Packings || []).filter(p => matchUser(p.user, u) && (p.status === 'Done' || p.status === 'Đã đóng gói'));

                                        return false;

                                    const isExpanded = expandedKPIs[u]; const uRole = userConfigs?.titles?.[u] || 'Nhân Sự';
                                    const rank = ur.monthly > 0 ? index + 1 : 0;

                                    const totalActive = activeKPIs.length;
                                    const totalClaimed = claimedKPIs.length;
                                    const totalTasks = totalActive + totalClaimed;
                                    const manaPct = totalTasks > 0 ? Math.round((totalClaimed / totalTasks) * 100) : 0;
                                    const manaColor = manaPct >= 80 ? 'emerald' : manaPct >= 40 ? 'amber' : 'rose';
                                    const isCritical = totalActive > 0 && manaPct < 30;

                                    const renderTaskRow = (k, workerName) => {
                                        const progResult = getDynamicKPIProgress(k, workerName);
                                        const currentProg = Math.round(typeof progResult === 'object' ? progResult.current : (typeof progResult === 'number' ? progResult : cleanNumber(progResult)));
                                        const pendingProg = Math.round(typeof progResult === 'object' ? (progResult.pending || 0) : 0);
                                        const target = Number(k.target) || 1;
                                        const pct = Math.min(100, Math.max(0, (currentProg / target) * 100));
                                        const barColor = pct >= 100 ? 'from-emerald-600 to-emerald-400' : (pct >= 50 ? 'from-blue-600 to-blue-400' : 'from-rose-600 to-orange-400');
                                        const textColor = pct >= 100 ? 'text-emerald-400' : (pct >= 50 ? 'text-blue-400' : 'text-rose-400');
                                        const isOverdue = k.endTime && k.endTime < currentDate;
                                        const isFailed = currentProg < target;
                                        const isCompleted = currentProg >= target;
                                        const isPercentage = String(k.unit || '').trim() === '%';
                                        const canClaim = isCompleted && (!isPercentage || (k.endTime && currentDate >= k.endTime.substring(0, 10)));
                                        const isClaiming = claimingIds.includes(k.id);
                                        const isTaskOpen = openSection[`task_${k.id}`];

                                        const isManualUnit = ['bộ', 'cái', 'lần', 'xu', 'điểm', 'checklist'].includes(unitLower);
                                        const isAutoTracked = !isManualUnit && (
                                            ['dựng khung', 'gia cố', 'cắt dán', 'gọt keo', 'đóng gói', 'bán hàng', 'khâu 1', 'khâu 2', 'sản xuất', 'khâu hoàn thành', 'tổng khâu'].includes(kNameLower) ||

                                            kNameLower.includes('sản xuất') ||

                                        );
                                        const isManualKPI = !isAutoTracked;

                                        const formatKpiDate = (dStr) => {

                                                return s;

                                                return String(dStr).split(' ')[0];
                                            }

                                                                    <span>{dateRangeStr}</span>
                                                                </span>

                                                                <span className="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-500/30 shrink-0">

    // -------------------------------------------------------------------------
    // 5. COMPONENT MODAL CẬP NHẬT CHI TIẾT SỐ LIỆU LƯƠNG ĐỘC LẬP CHUẨN CHỈ
    // -------------------------------------------------------------------------
    const PayrollEditModal = React.memo(function PayrollEditModal({ p, onClose, pushDeltas, filterMonth, currentDate }) {
        const [form, setForm] = React.useState({
            luongLamThemGio: p.luongLamThemGio || '',
            hoTroSanLuong: p.hoTroSanLuong || '',
            cacKhoanThuKhac: p.cacKhoanThuKhac || '',
            cacKhoanThuKhacNote: p.cacKhoanThuKhacNote || '',
            phatQuyDinh: p.phatQuyDinh || '',
            phatQuyDinhNote: p.phatQuyDinhNote || '',
            chiPhiBaoHanh: p.chiPhiBaoHanh || '',
            daTraNhanVien: p.daTraNhanVien || '',
            nhanXetText: p.nhanXetText || ''
        });
        const [isSaving, setIsSaving] = React.useState(false);

        const handleSave = async () => {
            setIsSaving(true);
            const buildBP = (amt, type, defaultNote) => ({
                id: `BP_${type.toUpperCase()}_${p.user}_${filterMonth}`.replace(/[^A-Z0-9_]/g, ''),
                user: p.user,
                amount: Number(amt) || 0,
                type: type,
                note: type === 'Thu Nhập Khác' ? (form.cacKhoanThuKhacNote || defaultNote) :
                    type === 'Phạt Quy Định' ? (form.phatQuyDinhNote || defaultNote) :
                        type === 'Nhận Xét' ? (form.nhanXetText || defaultNote) : defaultNote,
                date: currentDate,
                orderCode: ''
            });

            const payload = {
                monthStr: filterMonth,
                BonusPenalty_Updates: [
                    buildBP(form.luongLamThemGio, 'Lương Làm Thêm Giờ', 'Tăng ca nội bộ xưởng'),
                    buildBP(form.hoTroSanLuong, 'Hỗ Trợ Sản Lượng', 'Hỗ trợ định mức kho sản lượng'),
                    buildBP(form.cacKhoanThuKhac, 'Thu Nhập Khác', 'Khoản điều chỉnh bổ sung'),
                    buildBP(-Math.abs(Number(form.phatQuyDinh)), 'Phạt Quy Định', 'Trừ vi phạm nội quy KCS'),
                    buildBP(-Math.abs(Number(form.chiPhiBaoHanh)), 'Chi Phí Bảo Hành', 'Khấu trừ đền bù hàng hỏng vỡ lỗi'),
                    buildBP(-Math.abs(Number(form.daTraNhanVien)), 'Đã Trả', 'Ứng quyết toán lương kỳ trước'),
                    buildBP(0, 'Nhận Xét', 'Đạt chỉ tiêu khối lượng xưởng đề ra.')
                ]
            };

            try {
                if (typeof window.runGAS === 'function') {
                    const res = await window.runGAS('api_syncMasterPayroll', payload);
                    if (res && res.success) {
                        if (typeof triggerToast === 'function') triggerToast(`Đã nhồi số và đồng bộ lương cho ${p.user} thành công!`, 'fa-check', 'success');
                        // Background merge thay vì full-reload
                        setTimeout(() => { window.dispatchEvent(new CustomEvent('triggerReloadData')); }, 2000);
                        onClose();
                    } else {
                        alert('Lỗi đồng bộ lương: ' + (res ? res.message : 'Không rõ'));
                    }
                } else {
                    await pushDeltas({ BonusPenalty: payload.BonusPenalty_Updates }, `Đã nhồi số bảng lương của ${p.user} thành công!`, 'fa-save');
                    onClose();
                }
            } catch (e) { alert('Lỗi đồng bộ dữ liệu mạng!'); }
            setIsSaving(false);
        };

        return (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
                <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-[24px] p-5 shadow-2xl flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-2.5">
                        <h3 className="font-black text-[#3b82f6] text-[13px] uppercase tracking-wider"><i className="fas fa-edit mr-2"></i>Sửa số liệu lương: {p.user}</h3>
                        <button onClick={onClose} disabled={isSaving} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center"><i className="fas fa-times text-xs"></i></button>
                    </div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3.5 pr-1 text-[11px]">
                        {p.isLocked && (
                            <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 font-bold flex items-center gap-2">
                                <i className="fas fa-lock text-sm"></i>
                                <span>Kỳ lương này đã Khóa Sổ / Đã Trả. Hệ thống khóa quyền chỉnh sửa để đảm bảo tính toàn vẹn tài chính!</span>
                            </div>
                        )}
                        <div className="grid grid-cols-2 gap-3">
                            <div><label className="text-gray-400 font-bold block mb-1">Lương Làm Thêm Giờ</label><input type="number" disabled={p.isLocked} value={form.luongLamThemGio} onChange={e => setForm({ ...form, luongLamThemGio: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white font-bold disabled:opacity-50" /></div>
                            <div><label className="text-gray-400 font-bold block mb-1">Hỗ Trợ Sản Lượng</label><input type="number" disabled={p.isLocked} value={form.hoTroSanLuong} onChange={e => setForm({ ...form, hoTroSanLuong: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white font-bold disabled:opacity-50" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2 p-2.5 bg-zinc-900/30 rounded-xl border border-white/5">
                            <div className="col-span-2 font-black text-blue-400">THU NHẬP KHÁC</div>
                            <div><label className="text-gray-500 block mb-1">Số tiền</label><input type="number" disabled={p.isLocked} value={form.cacKhoanThuKhac} onChange={e => setForm({ ...form, cacKhoanThuKhac: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                            <div><label className="text-gray-500 block mb-1">Ghi chú</label><input type="text" disabled={p.isLocked} value={form.cacKhoanThuKhacNote} onChange={e => setForm({ ...form, cacKhoanThuKhacNote: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2 p-2.5 bg-zinc-900/30 rounded-xl border border-white/5">
                            <div className="col-span-2 font-black text-rose-400">PHẠT QUY ĐỊNH MỤC</div>
                            <div><label className="text-gray-500 block mb-1">Tiền phạt</label><input type="number" disabled={p.isLocked} value={form.phatQuyDinh} onChange={e => setForm({ ...form, phatQuyDinh: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-rose-400 font-bold disabled:opacity-50" /></div>
                            <div><label className="text-gray-500 block mb-1">Lý do phạt lỗi</label><input type="text" disabled={p.isLocked} value={form.phatQuyDinhNote} onChange={e => setForm({ ...form, phatQuyDinhNote: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div><label className="text-gray-400 block mb-1">Chi Phí Bảo Hành</label><input type="number" disabled={p.isLocked} value={form.chiPhiBaoHanh} onChange={e => setForm({ ...form, chiPhiBaoHanh: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                            <div><label className="text-gray-400 block mb-1">Đã Chi Trả Trước</label><input type="number" disabled={p.isLocked} value={form.daTraNhanVien} onChange={e => setForm({ ...form, daTraNhanVien: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                        </div>
                        <div><label className="text-gray-400 block mb-1">Nhận Xét Năng Suất Phiếu</label><textarea rows="2" disabled={p.isLocked} value={form.nhanXetText} onChange={e => setForm({ ...form, nhanXetText: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none disabled:opacity-50" placeholder="Đạt tiến độ..."></textarea></div>
                    </div>
                    <div className="flex gap-2 mt-4 pt-2 border-t border-[#222]">
                        <button onClick={onClose} className="flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl">HỦY</button>
                        <button onClick={handleSave} disabled={isSaving || p.isLocked} className="flex-[2] py-2.5 bg-blue-500 text-black font-black rounded-xl disabled:opacity-50">{isSaving ? 'ĐANG GHI...' : (p.isLocked ? 'ĐÃ KHÓA SỔ' : 'LƯU SỐ LIỆU')}</button>
                    </div>
                </div>
            </div>
        );
    });

    // -------------------------------------------------------------------------
    // 6. COMPONENT MODAL TÍNH KPI QUẢN LÝ BÁN HÀNG
    // -------------------------------------------------------------------------
    const SalesKPIModal = React.memo(function SalesKPIModal({ onClose, pushDeltas, triggerToast }) {
        const [form, setForm] = React.useState({
            userName: 'Nguyễn Thị Diệu Hương',

        const [isSaving, setIsSaving] = React.useState(false);

        const handleSave = async () => {

                    if (res && res.success) {

                    <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-2.5">
                        <h3 className="font-black text-amber-500 text-[13px] uppercase tracking-wider"><i className="fas fa-calculator mr-2"></i>TÍNH KPI BÁN HÀNG: {form.userName}</h3>
                        <button onClick={onClose} disabled={isSaving} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center"><i className="fas fa-times text-xs"></i></button>

                            <div><label className="text-gray-400 font-bold block mb-1">TL Hàng hoàn xử lý (0 - 1.0)</label><input type="number" step="0.01" value={form.refundHandlingRate} onChange={e => setForm({ ...form, refundHandlingRate: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white font-bold" /></div>
