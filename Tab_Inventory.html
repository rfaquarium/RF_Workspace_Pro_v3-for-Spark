<script type="text/babel">
/* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 */
// =========================================================================
// 📦 FILE: Tab_Inventory.html
// CHỨC NĂNG: Quản lý Danh mục Hàng hoá, Tồn kho, Định mức BOM, Giá vốn & Giá bán
// THIẾT KẾ: Chuẩn Royal Workbench Dark (Hallmark Anti-AI-Slop System)
// =========================================================================

const formatImageUrl = (url) => {
    if (!url || typeof url !== 'string') return '';
    const str = url.trim();
    if (str.includes('drive.google.com/file/d/')) {
        const match = str.match(/\/d\/([^/]+)/);
        return match ? ('https://drive.google.com/uc?export=view&id=' + match[1]) : str;
    }
    if (str.includes('drive.google.com/open?id=')) {
        const match = str.match(/id=([^&]+)/);
        return match ? ('https://drive.google.com/uc?export=view&id=' + match[1]) : str;
    }
    return str;
};

// Helper lấy icon đại diện cho từng danh mục con layout / vật tư nếu chưa có ảnh
const getSubCategoryIcon = (name = '') => {
    const s = String(name).toUpperCase();
    if (s.includes('LINH THÚ') || s.includes('THÚ')) return 'fa-dragon';
    if (s.includes('VÁCH SUỐI') || s.includes('SUỐI')) return 'fa-water';
    if (s.includes('HẺM NÚI') || s.includes('NÚI') || s.includes('HẺM')) return 'fa-mountain';
    if (s.includes('NATURE') || s.includes('TỰ NHIÊN') || s.includes('RỪNG')) return 'fa-leaf';
    if (s.includes('NHẤT TRỤ') || s.includes('TRỤ')) return 'fa-monument';
    if (s.includes('TRĂNG') || s.includes('MOON')) return 'fa-moon';
    if (s.includes('BỂ') || s.includes('KÍNH')) return 'fa-cubes';
    if (s.includes('ĐÁ') || s.includes('LŨA')) return 'fa-gem';
    if (s.includes('CÂY') || s.includes('RÊU')) return 'fa-seedling';
    if (s.includes('ĐÈN') || s.includes('LỌC') || s.includes('PHỤ KIỆN')) return 'fa-plug';
    return 'fa-layer-group';
};

// =========================================================================
// 1. COMPONENT: THẺ SẢN PHẨM & PHÂN LOẠI (VariantGroupCard)
// =========================================================================
const VariantGroupCard = React.memo(function VariantGroupCard({ group, setEditProd, setAddVarGroup, pushData, data }) { 
    const [selectedVarId, setSelectedVarId] = React.useState(group.items[0]?.id);
    const selectedVar = group.items.find(item => item.id === selectedVarId) || group.items[0] || {};
    const [previewImg, setPreviewImg] = React.useState(null); 
    const [preview3D, setPreview3D] = React.useState(null);
    const [showBomModal, setShowBomModal] = React.useState(false);
    const formatMoney = (val) => Math.round(Number(val || 0)).toLocaleString('vi-VN');
    const isBoss = localStorage.getItem('rf_boss') === 'true';
    const currentRole = localStorage.getItem('rf_role');
    const isAdminRole = isBoss || ['TỐI CAO', 'QUẢN LÝ KHO VẬN'].includes(String(currentRole || '').toUpperCase());
    const canEdit = isAdminRole && currentRole !== 'CTV';
    const canViewCost = ['QUẢN LÝ KHO VẬN', 'TỐI CAO', 'KẾ TOÁN'].includes(String(currentRole || '').toUpperCase()) || isBoss;

    const bomItems = React.useMemo(() => {
        if (!selectedVar || (!selectedVar.id && !selectedVar.sku)) return [];
        const varSku = String(selectedVar.sku || '').trim().toUpperCase();
        return (data?.BOM_Config || []).filter(b => 
            (b.product_id && b.product_id === selectedVar.id) ||
            (b.layoutCode && String(b.layoutCode).trim().toUpperCase() === varSku)
        );
    }, [selectedVar, data]);

    const isGlassCategory = String(selectedVar.category || '').trim().toUpperCase() === 'BỂ KÍNH' || 
                            String(group.category || '').trim().toUpperCase() === 'BỂ KÍNH' ||
                            String(selectedVar.sub_category || '').trim().toUpperCase().includes('BỂ');

    // Nhận diện hàng hoá thuộc Kho Nguyên Liệu / Vật Tư
    const isMaterialGroup = String(group.category || selectedVar.category || '').trim().toUpperCase() === 'DANH MỤC SẢN XUẤT' ||
                            String(selectedVar.sub_category || '').trim().toUpperCase().includes('NGUYÊN LIỆU') ||
                            String(selectedVar.sub_category || '').trim().toUpperCase().includes('VẬT TƯ');

    const [expanded, setExpanded] = React.useState(false);
    const currentImg = formatImageUrl(selectedVar.image || selectedVar.realImage || group.image);
    const rawQty = Number(selectedVar.quantity || 0);
    const qty = Math.round(rawQty * 1000) / 1000;
    const minQty = Number(selectedVar.minStock || 0);
    const isOutOfStock = qty <= 0;
    const isLowStock = !isOutOfStock && minQty > 0 && qty <= minQty;

    return ( 
        <React.Fragment>
        <div className={`bg-[#121215] border ${expanded ? 'border-[#d4af37]/50 shadow-[0_0_20px_rgba(212,175,55,0.12)]' : 'border-white/[0.08] hover:border-white/[0.16]'} rounded-2xl transition-all duration-200 mb-2.5 overflow-hidden group/card`}> 
            {/* Header / Summary row */}
            <div className="p-3 sm:p-3.5 flex items-center gap-3.5 cursor-pointer select-none" onClick={() => setExpanded(!expanded)}>
                {/* Thumbnail Frame */}
                <div className="w-14 h-14 sm:w-16 sm:h-16 shrink-0 bg-[#09090b] rounded-xl overflow-hidden border border-white/[0.08] flex items-center justify-center relative shadow-sm">
                    {currentImg ? (
                        <img 
                            src={typeof rfOptimizeImageUrl === 'function' ? rfOptimizeImageUrl(currentImg, 'sm') : currentImg} 
                            className="w-full h-full object-cover transition-transform duration-300 group-hover/card:scale-105" 
                            alt="product thumbnail" 
                            loading="lazy" 
                            decoding="async" 
                        />
                    ) : (
                        <div className="w-full h-full flex items-center justify-center bg-white/[0.02]">
                            <i className="fas fa-box-open text-zinc-600 text-xl"></i>
                        </div>
                    )}
                    {currentRole !== 'CTV' && (
                        isOutOfStock ? (
                            <div className="absolute bottom-0 inset-x-0 bg-rose-600/90 text-white font-black uppercase text-[7.5px] tracking-wider text-center py-0.5 backdrop-blur-xs">
                                HẾT HÀNG
                            </div>
                        ) : isLowStock ? (
                            <div className="absolute bottom-0 inset-x-0 bg-amber-500/95 text-zinc-950 font-black uppercase text-[7.5px] tracking-wider text-center py-0.5 backdrop-blur-xs">
                                CẦN NHẬP
                            </div>
                        ) : null
                    )}
                </div>

                {/* Primary Info */}
                <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                        <span className="font-mono text-[10px] sm:text-[11px] font-bold text-[#d4af37] bg-[#d4af37]/10 border border-[#d4af37]/25 px-2 py-0.5 rounded-md">
                            {selectedVar.sku || 'CHƯA CÓ SKU'}
                        </span>
                        {group.items.length > 1 && (
                            <span className="text-[9.5px] font-bold text-zinc-400 bg-white/[0.04] border border-white/[0.08] px-1.5 py-0.5 rounded">
                                {group.items.length} phân loại
                            </span>
                        )}
                        {bomItems.length > 0 && (
                            <span className="text-[9.5px] font-bold text-indigo-400 bg-indigo-950/40 border border-indigo-500/30 px-1.5 py-0.5 rounded flex items-center gap-1">
                                <i className="fas fa-layer-group text-[8.5px]"></i> BOM {bomItems.length}
                            </span>
                        )}
                    </div>
                    <h4 className="font-bold text-zinc-100 text-[13px] sm:text-[14px] leading-snug truncate group-hover/card:text-[#d4af37] transition-colors">
                        {group.baseName}
                    </h4>
                    {!expanded && (
                        <div className="flex items-center gap-3 mt-1 text-[12px]">
                            {isMaterialGroup ? (
                                <span className="font-mono font-black text-amber-400">
                                    {formatMoney(selectedVar.costPrice)}đ <span className="text-[9.5px] text-zinc-500 font-bold uppercase">(Giá nhập)</span>
                                </span>
                            ) : (
                                <span className="font-mono font-black text-emerald-400">{formatMoney(selectedVar.price)}đ</span>
                            )}
                            {currentRole !== 'CTV' && (
                                <span className={`font-medium ${isOutOfStock ? 'text-rose-400' : isLowStock ? 'text-amber-400' : 'text-zinc-400'}`}>
                                    Tồn: <b className="font-mono font-bold text-zinc-200">{formatStockQty(qty)}</b> <span className="text-[11px] opacity-75">{selectedVar.unit || ''}</span>
                                </span>
                            )}
                        </div>
                    )}
                </div>

                {/* Right chevron */}
                <div className="text-zinc-500 hover:text-zinc-300 w-7 h-7 rounded-lg flex items-center justify-center bg-white/[0.02] border border-white/[0.08] transition-all">
                    <i className={`fas fa-chevron-${expanded ? 'up' : 'down'} text-[11px]`}></i>
                </div>
            </div>

            {/* Expanded details */}
            {expanded && (
                <div className="px-3.5 pb-3.5 pt-2.5 border-t border-white/[0.08] bg-[#0c0c0e]/90 space-y-3 animate-fade-in">
                    {/* Variants selector strip */}
                    {group.items.length > 1 && (
                        <div className="space-y-1.5">
                            <span className="text-[9.5px] font-bold text-zinc-400 uppercase tracking-wider block">Chọn Phân Loại:</span>
                            <div className="flex flex-wrap gap-1.5">
                                {group.items.map(item => {
                                    const isSel = selectedVar.id === item.id;
                                    const itemQty = Number(item.quantity || 0);
                                    return (
                                        <button 
                                            key={item.id} 
                                            onClick={(e) => { e.stopPropagation(); setSelectedVarId(item.id); }} 
                                            className={`px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 ${
                                                isSel 
                                                    ? 'bg-gradient-to-r from-[#d4af37] to-[#f0ca5e] text-zinc-950 font-black shadow-[0_0_12px_rgba(212,175,55,0.35)] ring-1 ring-[#d4af37]/60' 
                                                    : 'bg-[#121216] hover:bg-white/[0.06] text-zinc-300 border border-white/[0.08] hover:border-white/[0.16]'
                                            }`}
                                        >
                                            <span>{item.variantLabel || 'Mặc định'}</span>
                                            {currentRole !== 'CTV' && (
                                                <span className={`text-[10px] font-mono ${isSel ? 'text-zinc-950 font-black' : itemQty <= 0 ? 'text-rose-400' : 'text-zinc-400'}`}>
                                                    ({formatStockQty(item.quantity)})
                                                </span>
                                            )}
                                        </button>
                                    );
                                })}
                                {canEdit && (
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); setAddVarGroup(group); }} 
                                        className="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-white/[0.04] hover:bg-white/[0.08] text-sky-400 border border-sky-500/30 flex items-center gap-1 cursor-pointer transition-colors"
                                        title="Thêm phân loại mới"
                                    >
                                        <i className="fas fa-plus text-[10px]"></i> Thêm
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Financials & Stock metrics */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1">
                        {currentRole !== 'CTV' && (
                            <div className="bg-[#121215] border border-white/[0.08] rounded-xl p-2.5">
                                <span className="text-[9.5px] font-bold text-zinc-400 uppercase tracking-wider block mb-0.5">
                                    {isMaterialGroup ? 'Giá Nhập (Vốn)' : 'Giá Vốn'}
                                </span>
                                <span className={`text-[13px] font-mono font-bold ${isMaterialGroup ? 'text-amber-400' : 'text-zinc-300'}`}>
                                    {canViewCost ? <>{formatMoney(selectedVar.costPrice)}<span className="text-[10px] text-zinc-500">đ</span></> : '******'}
                                </span>
                            </div>
                        )}
                        <div className="bg-[#121215] border border-white/[0.08] rounded-xl p-2.5">
                            <span className="text-[9.5px] font-bold text-zinc-400 uppercase tracking-wider block mb-0.5">Giá Bán</span>
                            <span className={`text-[14px] font-mono font-black ${isMaterialGroup ? 'text-zinc-400' : 'text-emerald-400'}`}>
                                {isMaterialGroup ? (
                                    selectedVar.price > 0 ? <>{formatMoney(selectedVar.price)}<span className="text-[10px] text-zinc-500">đ</span></> : <span className="text-zinc-500 text-xs italic">N/A</span>
                                ) : (
                                    <>{formatMoney(selectedVar.price)}<span className="text-[10px] text-emerald-500">đ</span></>
                                )}
                            </span>
                        </div>
                        {!isMaterialGroup && selectedVar.price > 0 && selectedVar.costPrice > 0 && canViewCost && currentRole !== 'CTV' && (
                            <div className="bg-[#121215] border border-white/[0.08] rounded-xl p-2.5">
                                <span className="text-[9.5px] font-bold text-zinc-400 uppercase tracking-wider block mb-0.5">Lợi Nhuận Gộp</span>
                                <span className="text-[13px] font-mono font-black text-[#d4af37]">
                                    {formatMoney(selectedVar.price - selectedVar.costPrice)}đ <span className="text-[10px] text-emerald-400 font-bold">({((selectedVar.price - selectedVar.costPrice) / selectedVar.price * 100).toFixed(0)}%)</span>
                                </span>
                            </div>
                        )}
                        {currentRole !== 'CTV' && (
                            <div className="bg-[#121215] border border-white/[0.08] rounded-xl p-2.5">
                                <div className="flex justify-between items-center mb-0.5">
                                    <span className="text-[9.5px] font-bold text-zinc-400 uppercase tracking-wider">Tồn Kho</span>
                                    <span className="text-[9.5px] text-zinc-500 font-mono">Min {formatStockQty(selectedVar.minStock)} / Max {formatStockQty(selectedVar.maxStock)}</span>
                                </div>
                                <div className={`text-[14px] font-mono font-black leading-none ${isOutOfStock ? 'text-rose-400' : isLowStock ? 'text-amber-400' : 'text-zinc-100'}`}>
                                    {formatStockQty(qty)} <span className="text-[11px] font-normal text-zinc-400 font-sans">{selectedVar.unit || ''}</span>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Action Bar */}
                    <div className="flex items-center justify-between gap-2 pt-2 border-t border-white/[0.08] flex-wrap">
                        <div className="flex items-center gap-1.5 flex-wrap">
                            {(isGlassCategory || bomItems.length > 0 || String(selectedVar.category || '').toUpperCase() === 'LAYOUT') && (
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setShowBomModal(true); }}
                                    className={`px-3 py-1.5 rounded-xl border text-[11px] font-bold flex items-center gap-1.5 transition-all cursor-pointer ${
                                        bomItems.length > 0 
                                            ? 'bg-indigo-950/50 text-indigo-300 border-indigo-500/40 hover:bg-indigo-900/60' 
                                            : 'bg-white/[0.03] text-zinc-400 border-white/[0.08] hover:text-zinc-200'
                                    }`}
                                    title="Xem định mức vật tư (BOM)"
                                >
                                    <i className="fas fa-layer-group text-indigo-400"></i>
                                    <span>BOM ({bomItems.length})</span>
                                </button>
                            )}

                            {selectedVar.realImage && (
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setPreviewImg(selectedVar.realImage); }}
                                    className="px-3 py-1.5 rounded-xl bg-[#d4af37]/10 hover:bg-[#d4af37]/20 text-[#d4af37] border border-[#d4af37]/30 text-[11px] font-bold flex items-center gap-1.5 transition-all cursor-pointer"
                                    title="Xem ảnh thực tế Layout cho thợ"
                                >
                                    <i className="fas fa-camera text-[#d4af37]"></i>
                                    <span>Ảnh Thợ</span>
                                </button>
                            )}
                            
                            {selectedVar.model3D && (
                                <button 
                                    onClick={(e) => { 
                                        e.stopPropagation(); 
                                        if (typeof window.ensureModelViewerLoaded === 'function') window.ensureModelViewerLoaded();
                                        setPreview3D(selectedVar.model3D); 
                                    }}
                                    className="px-3 py-1.5 rounded-xl bg-sky-950/40 hover:bg-sky-900/50 text-sky-300 border border-sky-500/30 text-[11px] font-bold flex items-center gap-1.5 transition-all cursor-pointer"
                                    title="Xem mô hình 3D"
                                >
                                    <i className="fas fa-cube text-sky-400"></i>
                                    <span>3D</span>
                                </button>
                            )}
                            
                            {currentRole !== 'CTV' && (
                                <button 
                                    onClick={() => window.dispatchEvent(new CustomEvent('openStockHistory', {detail: selectedVar}))} 
                                    className="px-3 py-1.5 rounded-xl bg-emerald-950/40 hover:bg-emerald-900/50 text-emerald-300 border border-emerald-500/30 text-[11px] font-bold flex items-center gap-1.5 transition-all cursor-pointer"
                                    title="Xem thẻ kho"
                                >
                                    <i className="fas fa-history text-emerald-400"></i>
                                    <span>Thẻ Kho</span>
                                </button>
                            )}
                        </div>

                        {canEdit && ( 
                            <div className="flex items-center gap-1.5 ml-auto"> 
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setEditProd(selectedVar); }} 
                                    className="px-3 py-1.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 hover:text-white border border-white/[0.1] text-[11px] font-bold flex items-center gap-1.5 transition-all cursor-pointer" 
                                    title="Chỉnh sửa sản phẩm"
                                > 
                                    <i className="fas fa-pencil-alt text-[#d4af37]"></i>
                                    <span>Sửa</span>
                                </button> 
                                {isBoss && (
                                    <button 
                                        onClick={(e) => { 
                                            e.stopPropagation();
                                            if(window.confirm(`Bạn có chắc muốn XÓA VĨNH VIỄN mã [${selectedVar.sku}] và tất cả các mục bị trùng lặp của nó?`)) { 
                                                pushData({deletes: {Products: selectedVar._allIds || [selectedVar.id]}});
                                            } 
                                        }} 
                                        className="px-2.5 py-1.5 rounded-xl bg-rose-950/30 hover:bg-rose-950/60 text-zinc-400 hover:text-rose-400 border border-rose-500/20 hover:border-rose-500/40 text-[11px] transition-all cursor-pointer" 
                                        title="Xóa sản phẩm"
                                    > 
                                        <i className="fas fa-trash text-xs"></i> 
                                    </button> 
                                )}
                            </div> 
                        )}
                    </div>
                </div>
            )}
        </div>

        {/* Modal Xem Ảnh Thợ Fullscreen */}
        {previewImg && (
            <div className="fixed inset-0 z-[9999] bg-black/90 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in" onClick={() => setPreviewImg(null)}>
                <div className="relative max-w-2xl w-full flex flex-col items-center animate-slide-up" onClick={e => e.stopPropagation()}>
                    <button className="absolute -top-12 right-0 text-white/70 hover:text-rose-400 text-2xl w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-full transition-all cursor-pointer" onClick={() => setPreviewImg(null)}>
                        <i className="fas fa-times"></i>
                    </button>
                    <img src={previewImg} alt="Preview" className="w-full h-auto max-h-[80vh] object-contain rounded-2xl shadow-[0_0_40px_rgba(212,175,55,0.25)] border border-white/10" />
                    <div className="mt-4 flex items-center justify-center gap-2 text-[#d4af37] text-[11px] font-black uppercase tracking-[0.2em] bg-[#121215] px-6 py-2.5 rounded-full border border-[#d4af37]/30 shadow-md">
                        <i className="fas fa-eye"></i> GÓC NHÌN THỰC TẾ TỪ THỢ LAYOUT
                    </div>
                </div>
            </div>
        )}
        
        {/* Modal Xem Model 3D */}
        {preview3D && (
            <div className="fixed inset-0 z-[9999] bg-black/95 flex flex-col items-center justify-center p-0 backdrop-blur-md animate-fade-in" onClick={() => setPreview3D(null)}>
                <div className="relative w-full h-full flex flex-col items-center animate-slide-up" onClick={e => e.stopPropagation()}>
                    <button className="absolute top-4 right-4 z-10 text-white/70 hover:text-rose-400 text-3xl w-12 h-12 flex items-center justify-center bg-black/50 hover:bg-black/80 rounded-full transition-all border border-white/10 cursor-pointer" onClick={() => setPreview3D(null)}>
                        <i className="fas fa-times"></i>
                    </button>
                    <model-viewer 
                        key={preview3D}
                        src={preview3D} 
                        auto-rotate="true" 
                        camera-controls="true" 
                        shadow-intensity="1"
                        style={{width: '100%', height: '85vh', minHeight: '400px', backgroundColor: '#09090b', outline: 'none'}}
                    >
                    </model-viewer>
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center justify-center gap-2 text-sky-400 text-[11px] font-black uppercase tracking-[0.2em] bg-[#121215]/90 backdrop-blur px-6 py-2.5 rounded-full border border-sky-500/30 shadow-lg whitespace-nowrap">
                        <i className="fas fa-cube"></i> CỔNG HIỂN THỊ 3D TRỰC QUAN
                    </div>
                </div>
            </div>
        )}

        {/* Modal Xem Định Mức BOM */}
        {showBomModal && (
            <div className="fixed inset-0 z-[9999] bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in" onClick={() => setShowBomModal(false)}>
                <div className="bg-[#121215] border border-white/[0.1] w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-slide-up" onClick={e => e.stopPropagation()}>
                    {/* Modal Header */}
                    <div className="p-4 bg-gradient-to-r from-indigo-950/40 via-[#181822] to-[#121215] border-b border-white/[0.08] flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-lg shadow-sm">
                                <i className="fas fa-layer-group"></i>
                            </div>
                            <div>
                                <h3 className="text-white font-black text-[14px] uppercase tracking-wide">ĐỊNH MỨC VẬT TƯ (BOM)</h3>
                                <p className="text-indigo-300 text-[11px] font-bold truncate max-w-[280px]">
                                    {selectedVar.name} <span className="text-zinc-400 font-mono text-[10px]">({selectedVar.sku})</span>
                                </p>
                            </div>
                        </div>
                        <button onClick={() => setShowBomModal(false)} className="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>

                    {/* Modal Content */}
                    <div className="p-4 max-h-[60vh] overflow-y-auto custom-scrollbar">
                        {bomItems.length === 0 ? (
                            <div className="text-center py-8 bg-[#09090b] rounded-xl border border-dashed border-white/[0.08]">
                                <i className="fas fa-cubes-stacked text-zinc-600 text-3xl mb-2"></i>
                                <p className="text-zinc-400 text-xs font-bold">Chưa thiết lập định mức vật tư cho sản phẩm này.</p>
                                {canEdit && (
                                    <button 
                                        onClick={() => { setShowBomModal(false); setEditProd(selectedVar); }} 
                                        className="mt-3 px-3.5 py-1.5 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-400 hover:text-white text-[11px] font-black rounded-xl border border-indigo-500/30 transition-all cursor-pointer"
                                    >
                                        <i className="fas fa-plus mr-1.5"></i>THIẾT LẬP BOM NGAY
                                    </button>
                                )}
                            </div>
                        ) : (
                            <div className="space-y-3">
                                <div className="bg-[#09090b] border border-white/[0.08] rounded-xl overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-white/[0.02] border-b border-white/[0.08] text-[10px] font-black text-zinc-400 uppercase tracking-wider">
                                                <th className="py-2.5 px-3">Vật Tư</th>
                                                <th className="py-2.5 px-3 text-center">Định Mức</th>
                                                {canViewCost && <th className="py-2.5 px-3 text-right">Đơn Giá Vốn</th>}
                                                {canViewCost && <th className="py-2.5 px-3 text-right">Thành Tiền</th>}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-white/[0.04]">
                                            {bomItems.map((b, idx) => {
                                                const matSku = b.materialSku;
                                                const matId = b.material_id;
                                                const mat = typeof findMaterialInProducts === 'function'
                                                    ? findMaterialInProducts(matSku, matId, data?.Products)
                                                    : (data?.Products || []).find(p => 
                                                        (matId && p.id === matId) || 
                                                        (matSku && String(p.sku || '').trim().toUpperCase() === String(matSku).trim().toUpperCase()) ||
                                                        (matSku && String(p.name || '').trim().toLowerCase() === String(matSku).trim().toLowerCase())
                                                    );

                                                const name = mat?.name || b.materialSku || b.material_id || 'Vật tư chưa chọn';
                                                const skuStr = mat?.sku || b.materialSku || '';
                                                const rawQty = Number(b.defaultQty ?? b.quantity ?? 0);
                                                const bomUnit = b.unit || mat?.unit || '';
                                                
                                                const { unitPrice, convertedPrice, subTotal, conversionNote } = typeof calculateBomItemCost === 'function'
                                                    ? calculateBomItemCost(mat, rawQty, bomUnit)
                                                    : { unitPrice: Number(mat?.costPrice || 0), convertedPrice: Number(mat?.costPrice || 0), subTotal: rawQty * Number(mat?.costPrice || 0), conversionNote: '' };

                                                return (
                                                    <tr key={b.id || idx} className="hover:bg-white/[0.02] text-[11px]">
                                                        <td className="py-2.5 px-3">
                                                            <div className="font-bold text-zinc-200">{name}</div>
                                                            {skuStr && <div className="text-[9.5px] text-sky-400 font-mono">{skuStr}</div>}
                                                        </td>
                                                        <td className="py-2.5 px-3 text-center font-bold text-indigo-400 font-mono whitespace-nowrap">
                                                            {rawQty} <span className="text-[9px] text-zinc-400 font-normal font-sans">{bomUnit}</span>
                                                        </td>
                                                        {canViewCost && (
                                                            <td className="py-2.5 px-3 text-right font-medium text-zinc-400 whitespace-nowrap font-mono">
                                                                {unitPrice > 0 ? (
                                                                    <div>
                                                                        <div>{formatMoney(unitPrice)}đ<span className="text-[9px] opacity-60">/{mat?.unit || 'ĐV'}</span></div>
                                                                        {conversionNote && (
                                                                            <div className="text-[8px] text-indigo-400 font-mono">({formatMoney(convertedPrice)}đ/{bomUnit})</div>
                                                                        )}
                                                                    </div>
                                                                ) : '-'}
                                                            </td>
                                                        )}
                                                        {canViewCost && (
                                                            <td className="py-2.5 px-3 text-right font-bold text-emerald-400 whitespace-nowrap font-mono">
                                                                {subTotal > 0 ? formatMoney(subTotal) + 'đ' : '-'}
                                                            </td>
                                                        )}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>

                                {canViewCost && (
                                    <div className="bg-indigo-950/30 border border-indigo-500/20 p-3 rounded-xl flex justify-between items-center">
                                        <div className="flex items-center gap-2">
                                            <i className="fas fa-calculator text-indigo-400 text-sm"></i>
                                            <span className="text-[11px] font-black text-indigo-300 uppercase tracking-wider">Ước tính tổng chi phí:</span>
                                        </div>
                                        <span className="text-[15px] font-black text-emerald-400 font-mono">
                                            {formatMoney(bomItems.reduce((sum, b) => {
                                                const mat = (data?.Products || []).find(p => (b.material_id && p.id === b.material_id) || (b.materialSku && String(p.sku).toUpperCase() === String(b.materialSku).toUpperCase()));
                                                const rawQty = Number(b.defaultQty ?? b.quantity ?? 0);
                                                const bomUnit = b.unit || mat?.unit || '';
                                                const { subTotal } = typeof calculateBomItemCost === 'function'
                                                    ? calculateBomItemCost(mat, rawQty, bomUnit)
                                                    : { subTotal: rawQty * Number(mat?.costPrice || 0) };
                                                return sum + subTotal;
                                            }, 0))}đ
                                        </span>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Modal Footer */}
                    <div className="p-3 bg-[#0e0e12] border-t border-white/[0.08] flex justify-between items-center gap-2">
                        {canEdit ? (
                            <button 
                                onClick={() => { setShowBomModal(false); setEditProd(selectedVar); }} 
                                className="px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white text-[11px] font-bold rounded-xl border border-indigo-500/30 transition-all flex items-center gap-1.5 cursor-pointer"
                            >
                                <i className="fas fa-pencil-alt text-[10px]"></i> CHỈNH SỬA BOM
                            </button>
                        ) : <div />}
                        <button 
                            onClick={() => setShowBomModal(false)}
                            className="px-5 py-2 bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 text-[11px] font-bold rounded-xl transition-all border border-white/[0.08] cursor-pointer"
                        >
                            ĐÓNG
                        </button>
                    </div>
                </div>
            </div>
        )}
        </React.Fragment>
    );
});

// =========================================================================
// 2. COMPONENT: MODAL CHỈNH SỬA / TẠO SẢN PHẨM (ProductEditModal)
// =========================================================================
function ProductEditModal({ prod, onClose, pushData, currentCat, data }) {
  const isNew = !prod || !prod.id;
  const targetProd = React.useMemo(() => {
    if (isNew || !data?.Products) return prod;
    return (data.Products || []).find(p => p.id === prod.id) ||
           (prod.sku && (data.Products || []).find(p => String(p.sku).trim().toUpperCase() === String(prod.sku).trim().toUpperCase())) ||
           (prod.name && (data.Products || []).find(p => String(p.name).trim().toLowerCase() === String(prod.name).trim().toLowerCase())) ||
           prod;
  }, [prod, data, isNew]);

  const [form, setForm] = React.useState({
    id: targetProd?.id || ('PROD_' + Date.now()),
    sku: targetProd?.sku ? String(targetProd.sku).trim() : (prod?.sku ? String(prod.sku).trim() : ''),
    name: targetProd?.name || prod?.name || '',
    category: targetProd?.category || prod?.category || currentCat || 'PHỤ KIỆN',
    sub_category: targetProd?.sub_category || prod?.sub_category || '',
    costPrice: targetProd?.costPrice !== undefined ? targetProd.costPrice : (prod?.costPrice || 0),
    price: targetProd?.price !== undefined ? targetProd.price : (prod?.price || 0),
    quantity: targetProd?.quantity !== undefined ? targetProd.quantity : (prod?.quantity || 0),
    image: targetProd?.image || prod?.image || '',
    minStock: targetProd?.minStock !== undefined ? targetProd.minStock : (prod?.minStock || 0),
    maxStock: targetProd?.maxStock !== undefined ? targetProd.maxStock : (prod?.maxStock || 0),
    realImage: targetProd?.realImage || prod?.realImage || '',
    model3D: targetProd?.model3D || prod?.model3D || '',
    unit: (targetProd?.unit !== undefined && targetProd?.unit !== null) ? targetProd.unit : (prod?.unit || ''),
    importUnit: targetProd?.importUnit || prod?.importUnit || '',
    conversionRate: targetProd?.conversionRate || prod?.conversionRate || 1
  });
  
  const [showConversion, setShowConversion] = React.useState(!!(targetProd?.importUnit || prod?.importUnit));
  const [skuError, setSkuError] = React.useState('');

  // Tự động đồng bộ chính xác 100% SKU, ĐVT, Tên & Giá từ CSDL Products khi mở modal sửa
  React.useEffect(() => {
    if (targetProd && !isNew) {
      setForm({
        id: targetProd.id,
        sku: targetProd.sku ? String(targetProd.sku).trim() : '',
        name: targetProd.name || '',
        category: targetProd.category || currentCat || 'PHỤ KIỆN',
        sub_category: targetProd.sub_category || '',
        costPrice: targetProd.costPrice || 0,
        price: targetProd.price || 0,
        quantity: targetProd.quantity || 0,
        image: targetProd.image || '',
        minStock: targetProd.minStock || 0,
        maxStock: targetProd.maxStock || 0,
        realImage: targetProd.realImage || '',
        model3D: targetProd.model3D || '',
        unit: (targetProd.unit !== undefined && targetProd.unit !== null) ? targetProd.unit : '',
        importUnit: targetProd.importUnit || '',
        conversionRate: targetProd.conversionRate || 1
      });
      setShowConversion(!!targetProd.importUnit);
    }
  }, [targetProd, isNew, currentCat]);

  const initialBom = React.useMemo(() => {
    if (!targetProd || !targetProd.sku) return [];
    const prodSku = String(targetProd.sku).trim().toUpperCase();
    return (data?.BOM_Config || []).filter(b => String(b.layoutCode || '').trim().toUpperCase() === prodSku);
  }, [targetProd, data]);
  const [bomItems, setBomItems] = React.useState(initialBom);

  React.useEffect(() => {
    setBomItems(initialBom);
  }, [initialBom]);

  const existingSkus = React.useMemo(() => {
    const setObj = new Set();
    if (data && data.Products) {
        data.Products.forEach(p => {
            if (p.sku) setObj.add(String(p.sku).trim().toLowerCase());
        });
    }
    return setObj;
  }, [data]);

  React.useEffect(() => {
    const currentSku = String(form.sku || '').trim().toLowerCase();
    if (currentSku === '') {
      setSkuError('');
      return;
    }
    const prodSku = String(prod?.sku || '').trim().toLowerCase();
    const isDuplicate = existingSkus.has(currentSku) && (isNew || prodSku !== currentSku);
    if (isDuplicate) {
        setSkuError('Mã SKU này đã tồn tại!');
    } else {
        setSkuError('');
    }
  }, [form.sku, existingSkus, isNew, prod]);

  const categories = typeof CATEGORIES !== 'undefined' ? CATEGORIES : ['LAYOUT', 'BỂ KÍNH', 'PHỤ KIỆN', 'DANH MỤC SẢN XUẤT'];
  const subCats = (typeof SUB_CATEGORIES !== 'undefined' && SUB_CATEGORIES[form.category]) ? SUB_CATEGORIES[form.category] : [];
  const catUpper = String(form.category || '').toUpperCase().trim();
  const isBomCategory = catUpper.includes('LAYOUT') || catUpper.includes('BỂ') || catUpper.includes('BE') || catUpper === 'DANH MỤC SẢN XUẤT';

  const handleSave = async () => {
    if (form.name.trim() === '') return typeof triggerToast !== 'undefined' ? triggerToast('Tên sản phẩm không được để trống!', 'fa-exclamation', 'warning') : alert('Tên sản phẩm không được để trống!');
    if (form.sku.trim() === '') return typeof triggerToast !== 'undefined' ? triggerToast('Mã SKU không được để trống!', 'fa-exclamation', 'warning') : alert('Mã SKU không được để trống!');
    if (skuError !== '') return typeof triggerToast !== 'undefined' ? triggerToast(skuError, 'fa-exclamation', 'warning') : alert(skuError);

    try {
      const oldQty = Number(targetProd?.quantity) || 0;
      const newQty = Number(form.quantity) || 0;
      const diffVal = newQty - oldQty;

      const formSku = String(form.sku || '').trim().toUpperCase();
      const payloadItem = {
        ...form,
        id: targetProd?.id || form.id,
        sku: formSku,
        name: String(form.name || '').trim(),
        unit: (form.unit !== undefined && form.unit !== null) ? String(form.unit).trim() : (targetProd?.unit || ''),
        costPrice: Number(form.costPrice) || 0,
        price: Number(form.price) || 0,
        quantity: newQty,
        _diff: diffVal,
        minStock: Number(form.minStock) || 0,
        maxStock: Number(form.maxStock) || 0,
        conversionRate: Number(form.conversionRate) || 1,
        category: form.category || 'PHỤ KIỆN',
        sub_category: (form.category === 'BỂ KÍNH' && (!form.sub_category || form.sub_category === 'KHÁC')) ? 'BỂ LẺ SIZE' : (form.sub_category || 'KHÁC')
      };
      
      const payload = { Products: [payloadItem] };
      const oldRealImage = targetProd?.realImage || '';
      const oldImage = targetProd?.image || '';
      const oldModel3D = targetProd?.model3D || '';
      
      if (!isNew && form.category === 'LAYOUT' && (form.realImage !== oldRealImage || form.image !== oldImage || form.model3D !== oldModel3D)) {
          const baseName = form.name.split(' - ')[0];
          const confirmBulk = window.confirm(`CẢNH BÁO ĐỒNG BỘ:\n\nBạn vừa đổi ảnh/3D của mẫu [${baseName}].\nBạn có muốn tự động áp dụng ảnh/3D này cho TẤT CẢ các kích thước khác của mẫu này không?`);
          
          if (confirmBulk) {
              const relatedProducts = (data.Products || []).filter(p => p.id !== form.id && p.name && (p.name === baseName || p.name.startsWith(baseName + ' - ')));
              relatedProducts.forEach(p => {
                  payload.Products.push({
                      id: p.id,
                      image: form.image,          
                      realImage: form.realImage,
                      model3D: form.model3D
                  });
              });
          }
      }
      if (isBomCategory) {
          const formSku = String(form.sku || '').trim().toUpperCase();
          if (!formSku && bomItems.length > 0) {
              if (typeof triggerToast !== 'undefined') triggerToast('Vui lòng nhập Mã SKU trước khi lưu BOM!', 'fa-exclamation', 'warning');
              return;
          }
          payload.BOM_Config = bomItems.map(b => ({
              id: b.id || 'BOM_' + Date.now() + Math.random().toString(36).substr(2,5),
              layoutCode: formSku,
              materialSku: b.materialSku,
              defaultQty: b.defaultQty,
              unit: b.unit || ''
          }));
          const bomIdsToKeep = bomItems.map(b => b.id).filter(Boolean);
          const bomIdsToDelete = initialBom.filter(b => !bomIdsToKeep.includes(b.id)).map(b => b.id);
          if (bomIdsToDelete.length > 0) {
              payload.deletes = payload.deletes || {};
              payload.deletes.BOM_Config = bomIdsToDelete;
          }
      }

      await pushData(payload);
      onClose();
    } catch (e) {
      if (typeof triggerToast !== 'undefined') triggerToast('Lỗi lưu sản phẩm: ' + e.message, 'fa-times', 'danger'); else alert('Lỗi lưu sản phẩm: ' + e.message);
    }
  };

  const isDuplicate = skuError !== '';
  const disableSave = isDuplicate || form.sku.trim() === '' || form.name.trim() === '';

  return (
    <div className="fixed inset-0 bg-black/85 flex items-end sm:items-center justify-center z-[9999] p-4 backdrop-blur-md animate-fade-in">
      <div className="bg-[#121215] border border-white/[0.1] w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl flex flex-col max-h-[90vh] animate-slide-up">
        
        <div className="flex justify-between items-center mb-4 shrink-0 pb-3 border-b border-white/[0.08]">
          <div className="font-black text-base text-[#d4af37] uppercase tracking-wider flex items-center gap-2">
            <i className={`fas ${isNew ? 'fa-plus-circle' : 'fa-edit'}`}></i>
            <span>{isNew ? 'THÊM HÀNG HOÁ MỚI' : 'CHỈNH SỬA HÀNG HOÁ'}</span>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer">
            <i className="fas fa-times"></i>
          </button>
        </div>

        <div className="space-y-3.5 text-sm max-h-[70vh] overflow-y-auto custom-scrollbar pr-1 flex-1">
          <div>
            <label className="text-[10px] font-bold text-zinc-400 block mb-1 uppercase tracking-wider">TÊN SẢN PHẨM <span className="text-rose-500">*</span></label>
            <input value={form.name} onChange={(e) => setForm({...form, name: e.target.value})} className="w-full bg-[#09090b] border border-white/[0.08] focus:border-[#d4af37]/60 focus:ring-1 focus:ring-[#d4af37]/30 rounded-xl px-3 py-2.5 text-white font-bold outline-none" placeholder="Tên đầy đủ sản phẩm..." />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-[10px] font-bold text-zinc-400 block mb-1 uppercase tracking-wider">MÃ SKU <span className="text-rose-500">*</span></label>
              <input value={form.sku} onChange={(e) => setForm({...form, sku: e.target.value})} className={`w-full bg-[#09090b] border ${isDuplicate ? 'border-rose-500' : 'border-white/[0.08] focus:border-[#d4af37]/60'} rounded-xl px-3 py-2.5 text-[#d4af37] font-mono font-black outline-none`} placeholder="SKU-001" />
              {isDuplicate && <div className="text-rose-400 text-[10px] font-bold mt-1 flex items-center gap-1"><i className="fas fa-exclamation-circle"></i> {skuError}</div>}
            </div>
            <div>
              <label className="text-[10px] font-bold text-zinc-400 block mb-1 uppercase tracking-wider">DANH MỤC</label>
              <select value={form.category} onChange={(e) => setForm({...form, category: e.target.value, sub_category: ''})} className="w-full bg-[#09090b] border border-white/[0.08] focus:border-[#d4af37]/60 rounded-xl px-3 py-2.5 text-white font-bold outline-none">
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>

          <div>
            <label className="text-[10px] font-bold text-zinc-400 block mb-1 uppercase tracking-wider">DANH MỤC CON / PHIÊN BẢN</label>
            <input value={form.sub_category} onChange={(e) => setForm({...form, sub_category: e.target.value})} list="subcat-list" className="w-full bg-[#09090b] border border-white/[0.08] focus:border-[#d4af37]/60 rounded-xl px-3 py-2.5 text-white font-bold outline-none" placeholder="VD: LINH THÚ, VÁCH SUỐI..." />
            <datalist id="subcat-list">
              {subCats.map(s => <option key={s} value={s}>{s}</option>)}
            </datalist>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="text-[10px] font-bold text-zinc-400 block mb-1 uppercase tracking-wider">GIÁ NGUYÊN LIỆU</label>
              <input type="number" value={form.costPrice} onChange={(e) => setForm({...form, costPrice: e.target.value})} className="w-full bg-[#09090b] border border-white/[0.08] focus:border-[#d4af37]/60 rounded-xl px-3 py-2.5 text-white font-mono font-bold outline-none" />
            </div>
            <div>
              <label className="text-[10px] font-bold text-zinc-400 block mb-1 uppercase tracking-wider">GIÁ BÁN</label>
              <input type="number" value={form.price} onChange={(e) => setForm({...form, price: e.target.value})} className="w-full bg-[#09090b] border border-white/[0.08] focus:border-emerald-500/60 rounded-xl px-3 py-2.5 text-emerald-400 font-mono font-bold outline-none" />
            </div>
            <div>
              <label className="text-[10px] font-bold text-zinc-400 block mb-1 uppercase tracking-wider">TỒN KHO</label>
              <input type="number" value={form.quantity} onChange={(e) => setForm({...form, quantity: e.target.value})} className="w-full bg-[#09090b] border border-white/[0.08] focus:border-[#d4af37]/60 rounded-xl px-3 py-2.5 text-[#d4af37] font-mono font-bold outline-none" />
            </div>
          </div>

          {/* Đơn vị tính & Quy đổi */}
          <div className="p-3 bg-white/[0.02] rounded-xl border border-white/[0.08]">
              <div className="flex justify-between items-center mb-2">
                  <label className="text-[10px] font-bold text-zinc-400 block uppercase tracking-wider"><i className="fas fa-balance-scale mr-1 text-[#d4af37]"></i> ĐƠN VỊ TÍNH</label>
                  {!showConversion && (
                      <button onClick={() => setShowConversion(true)} className="text-[9.5px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-lg border border-emerald-500/30 hover:bg-emerald-500/20 transition-all cursor-pointer"><i className="fas fa-plus mr-1"></i>ĐV QUY ĐỔI</button>
                  )}
              </div>
              
              <div className="flex gap-3">
                  <div className="flex-1">
                      <label className="text-[9px] font-bold text-zinc-500 block mb-1">ĐV CƠ BẢN (Kho/Bán)</label>
                      <input type="text" value={form.unit || ''} onChange={(e) => setForm({...form, unit: e.target.value})} className="w-full bg-[#09090b] border border-white/[0.08] focus:border-[#d4af37]/60 rounded-lg px-3 py-2 text-[#d4af37] font-bold outline-none" placeholder="VD: Chai, Gam, Mét, Kg, Hộp, Cuộn..." />
                  </div>
                  {showConversion && (
                      <div className="flex-[2] grid grid-cols-2 gap-2 animate-fade-in pl-3 border-l border-white/10 relative">
                          <button onClick={() => {setShowConversion(false); setForm({...form, importUnit: '', conversionRate: 1})}} className="absolute -top-6 right-0 text-[9px] text-rose-400 hover:text-rose-300 font-bold cursor-pointer"><i className="fas fa-times"></i> Hủy quy đổi</button>
                          <div>
                              <label className="text-[9px] font-bold text-emerald-400 block mb-1">ĐV NHẬP LÔ</label>
                              <input type="text" value={form.importUnit} onChange={(e) => setForm({...form, importUnit: e.target.value})} className="w-full bg-[#09090b] border border-emerald-500/30 rounded-lg px-3 py-2 text-emerald-400 font-bold outline-none uppercase" placeholder="VD: THÙNG" />
                          </div>
                          <div>

// =========================================================================
// HÀM TIỆN ÍCH: CHUẨN HÓA MÃ SKU THEO QUY CHUẨN XƯỞNG RICH FISH
// (VD: RUN-021-202020 -> LAY-RUN021-202020, BE-302020 -> BE-STD-302020)
// =========================================================================
function standardizeWarehouseSku(rawSku, category = '', baseName = '') {
  if (!rawSku) return '';
  const s = String(rawSku).trim().toUpperCase().replace(/\s+/g, '');

  // 1. Nhóm Phụ kiện / Vật tư đã có mã tiền tố xưởng -> Giữ nguyên
  if (s.startsWith('PK-') || s.startsWith('NL-') || s.startsWith('DG-') || s.startsWith('VT-')) {
    return s;
  }

  // 2. Nhóm Bể Kính
  const beMatch = s.match(/^(?:BE[-_]?)?(ND|BETTA|TERA|BC|MINI|STD|DUC)?[-_]?(\d{5,6})$/i);
  if (beMatch || category === 'KHO BỂ KÍNH' || (baseName && baseName.toUpperCase().includes('BỂ'))) {
    if (beMatch) {
      const sub = (beMatch[1] || 'STD').toUpperCase();
      const size = beMatch[2];
      return `BE-${sub}-${size}`;
    }
    const mSize = s.match(/(\d{5,6})/);
    if (mSize) return `BE-STD-${mSize[1]}`;
  }

  // 3. Nhóm Layout: RUN-021-202020, BON-005-302020, VAC-003-202020...
  const layMatch = s.match(/^(?:LAY[-_]?)?(BON|RUN|CAU|HAN|VAC|DAO|NAT|TRU|HEM|VOM|CV|TRA|STD)[-_]?0*(\d{1,3})?[-_]?(\d{5,6})?$/i);
  if (layMatch) {
    const code = layMatch[1].toUpperCase();
    const verNum = layMatch[2] ? parseInt(layMatch[2], 10) : null;
    const ver = verNum !== null ? ('000' + verNum).slice(-3) : '';
    const size = layMatch[3] || '';
    if (code === 'CV') return size ? `LAY-CV-${size}` : 'LAY-CV';
    return `LAY-${code}${ver}` + (size ? `-${size}` : '');
  }

  // Fallback Layout nếu có dạng mã 3-4 chữ cái (VD: RUN-021-202020 hoặc tự do)
  const upperBase = (baseName || '').toUpperCase();
  if (upperBase.includes('LAYOUT') || upperBase.includes('RỪNG') || upperBase.includes('LŨA') || upperBase.includes('ĐÁ') || category === 'KHO LAYOUT') {
    const mCode = s.match(/^(?:LAY[-_]?)?([A-Z]{3,4})[-_]?0*(\d{1,3})?[-_]?(\d{5,6})?$/i);
    if (mCode) {
      const code = mCode[1].toUpperCase();
      const verNum = mCode[2] ? parseInt(mCode[2], 10) : null;
      const ver = verNum !== null ? ('000' + verNum).slice(-3) : '';
      const size = mCode[3] || '';
      return `LAY-${code}${ver}` + (size ? `-${size}` : '');
    }
    if (!s.startsWith('LAY-')) return `LAY-${s}`;
  }

  return s;
}

// =========================================================================
// HÀM TIỆN ÍCH: CHUẨN HÓA TÊN SẢN PHẨM & PHÂN LOẠI THEO QUY CHUẨN XƯỞNG
// (VD: Layout Rừng Ver.21 + Size S (202020) -> Base: Rừng ver.21, Full: Rừng ver.21 - 20x20x20cm)
// =========================================================================
function standardizeWarehouseName(baseName, varLabel = '', rawSku = '') {
  // A. Chuẩn hóa BaseName: loại bỏ tiền tố Layout và chuẩn hóa ver.21 viết thường
  let cleanBase = String(baseName || '').trim()
    .replace(/^(?:LAYOUT|Layout|layout)\s+/i, '')
    .trim();
  cleanBase = cleanBase.replace(/(?:Ver\.?|ver\.?|V)\s*(\d+)/i, (m, g1) => 'ver.' + g1);

  // B. Bóc tách kích thước dạng 6 số từ SKU (VD: 202020 -> 20x20x20cm, 402325 -> 40x23x25cm)
  let dimStr = '';
  const cleanSku = String(rawSku || '').replace(/\s+/g, '');
  const dimMatch = cleanSku.match(/(\d{2})(\d{2})(\d{2})/);
  if (dimMatch) {
    dimStr = `${dimMatch[1]}x${dimMatch[2]}x${dimMatch[3]}cm`;
  } else if (varLabel) {
    const vlMatch = String(varLabel).match(/(\d{2,3})\s*[xX*×]\s*(\d{2,3})\s*[xX*×]\s*(\d{2,3})/);
    if (vlMatch) {
      dimStr = `${vlMatch[1]}x${vlMatch[2]}x${vlMatch[3]}cm`;
    }
  }

  // C. Xác định tên phân loại (variantName)
  let variantName = '';
  if (dimStr) {
    variantName = dimStr;
  } else if (varLabel) {
    variantName = String(varLabel).trim();
  }

  const fullName = variantName ? `${cleanBase} - ${variantName}` : cleanBase;
  return { cleanBase, variantName, fullName };
}
