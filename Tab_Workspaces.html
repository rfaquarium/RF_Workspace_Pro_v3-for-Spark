<script type="text/babel">
// =========================================================================
// 🏭 FILE: Tab_Workspaces.html
// CHỨC NĂNG: Quản Lý Trách Nhiệm Trạm Sản Xuất & Bàn Giao KCS (Accountability)
// THIẾT KẾ: Hallmark Royal Workbench & Linear UX (Deep Obsidian #09090b)
// TRIẾT LÝ: Minh bạch, không bêu rếu, quy chế kỷ luật tự động tổng hợp lương
// =========================================================================

// Helper chuẩn hóa danh sách dụng cụ trạm
function normalizeTools(rawTools, defaultWsUser = '') {
  if (!rawTools) return [];
  let parsed = rawTools;
  if (typeof rawTools === 'string') {
    try {
      parsed = JSON.parse(rawTools);
    } catch(e) {
      parsed = rawTools.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
    }
  }
  if (!Array.isArray(parsed)) return [];
  return parsed.map((item, idx) => {
    if (typeof item === 'string') {
      return {
        id: 'TOOL_' + idx + '_' + Date.now(),
        name: item,
        qty: 1,
        status: 'Tốt',
        user: defaultWsUser || '',
        conditionPct: 100
      };
    }
    const condVal = (item.conditionPct !== undefined && item.conditionPct !== null && item.conditionPct !== '') ? Number(item.conditionPct) : 100;
    return {
      id: item.id || ('TOOL_' + idx + '_' + Date.now()),
      name: item.name || 'Dụng cụ ' + (idx + 1),
      qty: parseInt(item.qty) || 1,
      status: item.status || 'Tốt',
      user: (item.user || item.assignedUser || defaultWsUser || '').trim(),
      conditionPct: isNaN(condVal) ? 100 : Math.min(100, Math.max(0, condVal))
    };
  });
}

const WorkspaceTab = React.memo(function WorkspaceTab({ 
  data, 
  pushData, 
  users = [], 
  userConfigs, 
  triggerToast, 
  userRole: propUserRole, 
  currentUser: propCurrentUser, 
  hasPerm: propHasPerm, 
  documents 
}) {
  const currentRole = propUserRole || localStorage.getItem('rf_role') || '';
  const currentUser = (propCurrentUser || localStorage.getItem('rf_user') || '').trim();
  const isBoss = localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO' || currentUser.includes('Tiến');
  const isAdmin = isBoss || currentRole === 'TỐI CAO';

  const hasPerm = React.useCallback((actionCode) => {
    if (isBoss || currentRole === 'TỐI CAO') return true;
    if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
    if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
    return isBoss;
  }, [propHasPerm, currentRole, currentUser, isBoss]);

  // Phân quyền: Boss, Quản đốc, Kế toán
  const canManageWorkstations = isBoss || currentRole === 'TỐI CAO' || ['QUẢN ĐỐC', 'KỸ THUẬT', 'KẾ TOÁN'].includes(currentRole);

  // 4 Sub-Tabs chính của phân hệ
  const [activeSubTab, setActiveSubTab] = React.useState('STATIONS'); // 'STATIONS' | 'SERIAL_TRACE' | 'INCIDENTS' | 'REGULATIONS'

  // Dữ liệu từ Data Store
  const rawWorkspaces = data?.Workspaces || [];
  const prodItems = data?.Production || [];
  const packings = data?.Packings || [];
  const orders = data?.Orders || [];
  const bonusPenalties = data?.BonusPenalty || [];

  // Trạm sản xuất chuẩn của xưởng Rich Fish
  const DEFAULT_STATIONS = [
    {
      id: 'WS_GLASS_CUT',
      name: 'Trạm 1: Bàn Cắt Kính & Kho Phôi',
      manager: 'Nguyễn Hoàng Dương',
      role: 'Thủ kho & Cắt Kính',
      color: 'border-sky-500/30 text-sky-400 bg-sky-500/10',
      icon: 'fa-cut',
      desc: 'Cắt phôi kính Indo, Việt Nhật, mài vi tính và phân loại kích thước',
      tools: [
        { name: 'Thước nhôm cữ kính 1m2', qty: 2, conditionPct: 95 },
        { name: 'Dao cắt kính dầu Toyo', qty: 3, conditionPct: 90 },
        { name: 'Đá mài cạnh kim cương', qty: 4, conditionPct: 85 },
        { name: 'Kê góc cao su an toàn', qty: 8, conditionPct: 100 }
      ],
      cleanliness5S: 'ĐẠT 5S',
      shiftStatus: 'Đang hoạt động'
    },
    {
      id: 'WS_LAYOUT',
      name: 'Trạm 2: Bàn Dựng Layout Thủy Sinh',
      manager: 'Nguyễn Thế Hoàng Anh',
      role: 'Nghệ nhân Layout',
      color: 'border-emerald-500/30 text-emerald-400 bg-emerald-500/10',
      icon: 'fa-tree',
      desc: 'Dựng lũa, ghép đá tiger/sa thạch, gắn rêu và cố định bố cục layout',
      tools: [
        { name: 'Súng bắn keo nến nhiệt', qty: 2, conditionPct: 90 },
        { name: 'Kìm bấm cắt cành lũa', qty: 2, conditionPct: 85 },
        { name: 'Bàn xoay 360 độ định hình', qty: 1, conditionPct: 95 },
        { name: 'Đèn led soi chi tiết góc', qty: 2, conditionPct: 90 }
      ],
      cleanliness5S: 'ĐẠT 5S',
      shiftStatus: 'Đang hoạt động'
    },
    {
      id: 'WS_ASSEMBLY',
      name: 'Trạm 3: Bàn Dán & Gia Cố Bể Kính',
      manager: 'Nguyễn Văn Tân',
      secondaryManager: 'Lại Trường Tâm',
      role: 'Thợ Dán Kính & Gia Cố',
      color: 'border-amber-500/30 text-amber-400 bg-amber-500/10',
      icon: 'fa-cubes',
      desc: 'Dán đường keo dấu giọt, gia cố đai chống phình, dưỡng keo khô chuẩn 24h',
      tools: [
        { name: 'Súng bắn keo hơi Wacker', qty: 2, conditionPct: 90 },
        { name: 'Cữ kẹp góc vuông 90 độ', qty: 8, conditionPct: 95 },
        { name: 'Dao cạo keo chuyên dụng', qty: 4, conditionPct: 80 },
        { name: 'Băng dính định hình xanh', qty: 6, conditionPct: 100 }
      ],
      cleanliness5S: 'ĐẠT 5S',
      shiftStatus: 'Đang hoạt động'
    },
    {
      id: 'WS_QC_PACK',
      name: 'Trạm 4: Khu Kiểm Định KCS & Đóng Gói',
      manager: 'Lại Trường Tâm',
      secondaryManager: 'Diệu Hương',
      role: 'QC & Đóng Gói',
      color: 'border-purple-500/30 text-purple-400 bg-purple-500/10',
      icon: 'fa-shield-check',
      desc: 'Test nước áp lực, soi bọt keo, chụp 2 ảnh đối chứng KCS và bọc xốp 3 lớp',
      tools: [
        { name: 'Bàn test nước thủy tĩnh', qty: 1, conditionPct: 95 },
        { name: 'Đèn rọi bọt khí tia cực tím', qty: 2, conditionPct: 90 },
        { name: 'Máy cắt xốp PE nhiệt', qty: 1, conditionPct: 85 },
        { name: 'Máy kéo màng quấn pallet', qty: 1, conditionPct: 90 }
      ],
      cleanliness5S: 'ĐẠT 5S',
      shiftStatus: 'Đang hoạt động'
    }
  ];

  // Hợp nhất dữ liệu trạm từ CSDL hoặc dùng cấu hình xưởng chuẩn
  const workstations = React.useMemo(() => {
    if (rawWorkspaces.length === 0) return DEFAULT_STATIONS;
    return DEFAULT_STATIONS.map(def => {
      const found = rawWorkspaces.find(w => w.id === def.id || w.name === def.name);
      if (!found) return def;
      return {
        ...def,
        ...found,
        tools: found.tools ? normalizeTools(found.tools, found.user || def.manager) : def.tools
      };
    });
  }, [rawWorkspaces]);

  // =========================================================================
  // SUB-TAB 2: TRA CỨU TRÁCH NHIỆM NGUỒN GỐC THEO SERIAL / MÃ ĐƠN (SERIAL TRACE)
  // =========================================================================
  const [searchSerialQuery, setSearchSerialQuery] = React.useState('');
  const [traceResult, setTraceResult] = React.useState(null);
  const [hasSearched, setHasSearched] = React.useState(false);

  const handleSearchSerial = (queryOverride) => {
    const q = (queryOverride !== undefined ? queryOverride : searchSerialQuery).trim().toLowerCase();
    setHasSearched(true);
    if (!q) {
      setTraceResult(null);
      return;
    }

    // 1. Tìm trong lệnh sản xuất Production (theo id, orderId, name)
    const matchedProd = prodItems.find(p => {
      const pid = String(p.id || '').toLowerCase();
      const oid = String(p.orderId || '').toLowerCase();
      const pname = String(p.name || '').toLowerCase();
      return pid === q || oid === q || pid.includes(q) || oid.includes(q) || pname.includes(q);
    });

    // 2. Tìm đơn hàng tương ứng trong Orders
    const orderIdToFind = matchedProd ? (matchedProd.orderId || matchedProd.id) : q;
    const matchedOrder = orders.find(o => {
      const oid = String(o.id || '').toLowerCase();
      const oCode = String(o.orderCode || '').toLowerCase();
      return oid === orderIdToFind || oCode === orderIdToFind || oCode.includes(q);
    });

    // 3. Tìm thông tin đóng gói trong Packings
    const targetOrderId = matchedOrder ? matchedOrder.id : (matchedProd ? matchedProd.orderId : q);
    const matchedPacking = packings.find(pk => {
      return String(pk.orderId || '').toLowerCase() === String(targetOrderId).toLowerCase() ||
             (matchedOrder && String(pk.orderId || '').toLowerCase() === String(matchedOrder.orderCode || '').toLowerCase());
    });

    if (!matchedProd && !matchedOrder && !matchedPacking) {
      setTraceResult(null);
      return;
    }

    setTraceResult({
      prod: matchedProd,
      order: matchedOrder,
      packing: matchedPacking
    });
  };

  // =========================================================================
  // SUB-TAB 3: BIÊN BẢN SỰ CỐ KỸ THUẬT (INCIDENT REPORTING - KHÔNG BÊU RẾU)
  // =========================================================================
  const [showIncidentModal, setShowIncidentModal] = React.useState(false);
  const [incidentForm, setIncidentForm] = React.useState({
    staff: '',
    orderCode: '',
    incidentType: 'Hở keo / Rò nước',
    severity: 'MEDIUM',
    penaltyVnd: 50000,
    note: ''
  });

  const INCIDENT_TYPES = [
    { type: 'Hở keo / Rò nước', defaultPenalty: 50000, desc: 'Bể bị rò nước sau khi giao khách, phải bóc dán lại' },
    { type: 'Kính trầy xước mặt tiền', defaultPenalty: 30000, desc: 'Kính bị xước nhìn thấy rõ, không đạt chuẩn KCS' },
    { type: 'Lọt bọt khí đường keo', defaultPenalty: 30000, desc: 'Đường keo dán bị bọt khí, ảnh hưởng thẩm mỹ' },
    { type: 'Đóng gói thiếu phụ kiện', defaultPenalty: 20000, desc: 'Thiếu quà tặng / đệm cao su / đèn theo đơn' },
    { type: 'Vi phạm vệ sinh trạm 5S', defaultPenalty: 50000, desc: 'Hết ca không dọn dẹp mặt bàn, dụng cụ bừa bãi' },
    { type: 'Đóng gói sai quy cách vỡ bể', defaultPenalty: 100000, desc: 'Chưa đủ 3 lớp xốp bảo vệ gây vỡ khi vận chuyển' }
  ];

  const handleIncidentTypeChange = (e) => {
    const selectedType = e.target.value;
    const found = INCIDENT_TYPES.find(it => it.type === selectedType);
    setIncidentForm(prev => ({
      ...prev,
      incidentType: selectedType,
      penaltyVnd: found ? found.defaultPenalty : 50000
    }));
  };

  const handleSaveIncident = async () => {
    if (!incidentForm.staff) {
      return triggerToast ? triggerToast('Vui lòng chọn nhân sự liên quan!', 'fa-user', 'warning') : alert('Chọn nhân sự!');
    }

    try {
      const newPenalty = {
        id: 'BP_' + Date.now(),
        user: incidentForm.staff,
        amount: Number(incidentForm.penaltyVnd) || 0,
        type: 'Khoản Trừ Vi Phạm',
        note: `Sự cố: ${incidentForm.incidentType} (${incidentForm.note || 'Ghi nhận sự cố kỹ thuật'})`,
        date: new Date().toISOString().slice(0, 10),
        orderCode: incidentForm.orderCode || ''
      };

      await pushData({
        BonusPenalty: [newPenalty]
      }, `Ghi nhận sự cố kỹ thuật: ${incidentForm.staff}`, 'fa-gavel');

      setShowIncidentModal(false);
      setIncidentForm({
        staff: '',
        orderCode: '',
        incidentType: 'Hở keo / Rò nước',
        severity: 'MEDIUM',
        penaltyVnd: 50000,
        note: ''
      });
      if (triggerToast) triggerToast(`Đã lập biên bản sự cố và khấu trừ lương cuối tháng!`, 'fa-check', 'success');
    } catch(err) {
      if (triggerToast) triggerToast('Lỗi khi ghi nhận sự cố: ' + err.message, 'fa-times', 'danger');
    }
  };

  // Danh sách nhân sự chính thức của xưởng
  const staffList = React.useMemo(() => {
    const list = ['Nguyễn Hoàng Dương', 'Nguyễn Thế Hoàng Anh', 'Nguyễn Văn Tân', 'Lại Trường Tâm', 'Diệu Hương'];
    if (Array.isArray(users) && users.length > 0) {
      return Array.from(new Set([...list, ...users.filter(u => u && !u.includes('CTV') && u !== 'Khách')]));
    }
    return list;
  }, [users]);

  // Danh sách sự cố kỹ thuật gần đây (lấy từ BonusPenalty loại 'Khoản Trừ Vi Phạm' hoặc 'Phạt')
  const technicalIncidents = React.useMemo(() => {
    return (bonusPenalties || [])
      .filter(bp => {
        const t = String(bp.type || '').toUpperCase();
        return t.includes('PHẠT') || t.includes('TRỪ') || t.includes('VI PHẠM');
      })
      .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
  }, [bonusPenalties]);

  return (
    <div className="space-y-4 sm:space-y-5 pb-8 w-full relative bg-[#09090b] text-zinc-100 font-sans">
      
      {/* 1. HEADER & SEGMENTED CONTROLS 4 PHÂN HỆ */}
      <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-3 border-b border-white/[0.06] pb-3.5">
        <div>
          <div className="flex items-center gap-2">
            <h1 className="text-xl sm:text-2xl font-black text-white tracking-tight uppercase">
              Trạm Sản Xuất & Truy Xuất Trách Nhiệm KCS
            </h1>
            <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold">
              Accountability v3.0
            </span>
          </div>
          <p className="text-zinc-500 text-[11px] font-medium mt-0.5">
            Quản lý 4 trạm làm việc, truy xuất nguồn gốc trách nhiệm 4 khâu và quy chế xử lý sự cố minh bạch (Phương án C).
          </p>
        </div>

        {/* Action Button: Lập Biên Bản Sự Cố */}
        <div className="flex items-center gap-2">
          {canManageWorkstations && (
            <button
              onClick={() => setShowIncidentModal(true)}
              className="h-9 px-3.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl flex items-center gap-1.5 text-xs font-bold transition-all cursor-pointer shadow-sm active:scale-95"
            >
              <i className="fas fa-file-shield text-xs"></i>
              <span>Lập Biên Bản Sự Cố</span>
            </button>
          )}
        </div>
      </div>

      {/* 2. SEGMENTED CONTROL 4 TABS */}
      <div className="flex items-center gap-1 bg-[#121214] p-1 rounded-xl border border-white/[0.06] overflow-x-auto custom-scrollbar">
        <button
          onClick={() => setActiveSubTab('STATIONS')}
          className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all shrink-0 cursor-pointer flex items-center gap-1.5 ${
            activeSubTab === 'STATIONS' ? 'bg-[#d4af37] text-black font-black shadow-sm' : 'text-zinc-400 hover:text-white'
          }`}
        >
          <i className="fas fa-industry"></i>
          <span>Trạng Thái 4 Trạm Xưởng</span>
        </button>

        <button
          onClick={() => setActiveSubTab('SERIAL_TRACE')}
          className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all shrink-0 cursor-pointer flex items-center gap-1.5 ${
            activeSubTab === 'SERIAL_TRACE' ? 'bg-[#d4af37] text-black font-black shadow-sm' : 'text-zinc-400 hover:text-white'
          }`}
        >
          <i className="fas fa-search-location"></i>
          <span>Tra Cứu Trách Nhiệm Theo Serial</span>
        </button>

        <button
          onClick={() => setActiveSubTab('INCIDENTS')}
          className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all shrink-0 cursor-pointer flex items-center gap-1.5 ${
            activeSubTab === 'INCIDENTS' ? 'bg-[#d4af37] text-black font-black shadow-sm' : 'text-zinc-400 hover:text-white'
          }`}
        >
          <i className="fas fa-clipboard-list"></i>
          <span>Sổ Biên Bản Sự Cố ({technicalIncidents.length})</span>
        </button>

        <button
          onClick={() => setActiveSubTab('REGULATIONS')}
          className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all shrink-0 cursor-pointer flex items-center gap-1.5 ${
            activeSubTab === 'REGULATIONS' ? 'bg-[#d4af37] text-black font-black shadow-sm' : 'text-zinc-400 hover:text-white'
          }`}
        >
          <i className="fas fa-balance-scale"></i>
          <span>Bảng Quy Chế Vi Phạm & 5S</span>
        </button>
      </div>

      {/* =========================================================================
          SUB-TAB 1: TRẠNG THÁI 4 TRẠM LÀM VIỆC (WORKSTATIONS GRID)
          ========================================================================= */}
      {activeSubTab === 'STATIONS' && (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {workstations.map(st => (
            <div key={st.id} className="bg-[#121214] border border-white/[0.06] rounded-xl p-4 flex flex-col justify-between shadow-sm relative overflow-hidden">
              <div>
                {/* Header Trạm */}
                <div className="flex items-center justify-between pb-3 border-b border-white/[0.06]">
                  <div className="flex items-center gap-2.5">
                    <div className={`w-9 h-9 rounded-xl border flex items-center justify-center text-sm ${st.color}`}>
                      <i className={`fas ${st.icon}`}></i>
                    </div>
                    <div>
                      <h3 className="text-sm font-black text-white">{st.name}</h3>
                      <div className="text-[11px] font-mono text-zinc-400">
                        Phụ trách chính: <strong className="text-zinc-200">{st.manager}</strong>
                        {st.secondaryManager && <span> • {st.secondaryManager}</span>}
                      </div>
                    </div>
                  </div>
                  <span className="px-2 py-0.5 rounded text-[9.5px] font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    {st.cleanliness5S || 'ĐẠT 5S'}
                  </span>
                </div>

                <p className="text-zinc-400 text-xs mt-2.5 leading-relaxed font-medium">
                  {st.desc}
                </p>

                {/* Danh mục công cụ & thiết bị trạm */}
                <div className="mt-3.5 space-y-1.5 pt-3 border-t border-white/[0.04]">
                  <div className="text-[10.5px] font-black uppercase tracking-wider text-zinc-400 mb-1.5 flex items-center justify-between">
                    <span>Công Cụ & Máy Móc Trạm:</span>
                    <span className="text-[9.5px] font-mono text-zinc-500">{st.tools?.length || 0} thiết bị</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {(st.tools || []).map((t, idx) => (
                      <div key={idx} className="p-2 bg-white/[0.02] border border-white/[0.04] rounded-lg flex items-center justify-between text-xs font-mono">
                        <div className="truncate pr-1">
                          <span className="text-zinc-300 font-bold">{t.name}</span>
                          <span className="text-zinc-500 text-[10px] ml-1">x{t.qty || 1}</span>
                        </div>
                        <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold ${
                          (t.conditionPct || 100) >= 90 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'
                        }`}>
                          {t.conditionPct || 100}%
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Footer Trạm */}
              <div className="mt-4 pt-3 border-t border-white/[0.06] flex items-center justify-between text-xs">
                <span className="text-zinc-500 font-mono text-[10px] flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  Ca hiện tại hoạt động bình thường
                </span>
                <button
                  onClick={() => {
                    setSearchSerialQuery(st.manager);
                    setActiveSubTab('SERIAL_TRACE');
                    handleSearchSerial(st.manager);
                  }}
                  className="px-2.5 py-1 bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 hover:text-white rounded border border-white/[0.08] text-[10px] font-bold transition-colors cursor-pointer"
                >
                  Xem Lịch Sử Sản Phẩm ➔
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* =========================================================================
          SUB-TAB 2: TRA CỨU NGUỒN GỐC TRÁCH NHIỆM (SERIAL TRACE TOOL)
          ========================================================================= */}
      {activeSubTab === 'SERIAL_TRACE' && (
        <div className="space-y-4">
          {/* Ô tìm kiếm lớn */}
          <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-4 sm:p-5 shadow-sm">
            <div className="flex items-center gap-2 mb-2">
              <i className="fas fa-barcode text-[#d4af37]"></i>
              <h2 className="text-sm sm:text-base font-black text-white uppercase tracking-wider">
                Truy Xuất Nguồn Gốc Trách Nhiệm Sản Phẩm
              </h2>
            </div>
            <p className="text-zinc-400 text-xs mb-3">
              Nhập mã Serial bể (vd: <strong className="text-zinc-200">BE151525_001</strong>), mã đơn hàng (vd: <strong className="text-zinc-200">240825ABCD</strong>), hoặc tên thợ để phân định trách nhiệm 4 khâu.
            </p>

            <div className="flex items-center gap-2">
              <div className="relative flex-1 flex items-center bg-[#09090b] border border-white/[0.08] rounded-xl px-3 py-2.5 focus-within:border-[#d4af37]/50">
                <i className="fas fa-search text-zinc-500 mr-2 text-sm"></i>
                <input
                  type="text"
                  placeholder="Nhập mã Serial, mã đơn hàng, hoặc tên sản phẩm..."
                  value={searchSerialQuery}
                  onChange={(e) => setSearchSerialQuery(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSearchSerial()}
                  className="bg-transparent text-white text-sm outline-none w-full font-mono font-bold"
                />
                {searchSerialQuery && (
                  <button onClick={() => { setSearchSerialQuery(''); setTraceResult(null); }} className="text-zinc-500 hover:text-zinc-300 text-xs">
                    <i className="fas fa-times"></i>
                  </button>
                )}
              </div>
              <button
                onClick={() => handleSearchSerial()}
                className="px-5 py-2.5 bg-gradient-to-r from-[#d4af37] to-[#f0ca5e] hover:brightness-110 text-black font-black text-xs rounded-xl transition-all cursor-pointer shadow-sm active:scale-95 shrink-0"
              >
                Truy Vết Ngay
              </button>
            </div>
          </div>

          {/* Kết quả truy vết: Timeline Trách Nhiệm 4 Khâu */}
          {hasSearched && !traceResult && (
            <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-8 text-center text-zinc-500 italic font-mono text-xs">
              Không tìm thấy hồ sơ sản xuất hoặc đơn hàng khớp với từ khóa "{searchSerialQuery}".
            </div>
          )}

          {traceResult && (
            <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-5 shadow-sm space-y-5 animate-fade-in">
              {/* Header kết quả */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-white/[0.06]">
                <div>
                  <span className="text-[10px] font-mono uppercase text-[#d4af37] font-bold">Hồ Sơ Trách Nhiệm Sản Phẩm</span>
                  <h3 className="text-lg font-black text-white">
                    {traceResult.prod?.name || traceResult.order?.orderCode || 'Bể Thủy Sinh KCS'}
                  </h3>
                  <div className="text-xs font-mono text-zinc-400 mt-0.5">
                    Mã Đơn: <strong className="text-zinc-200">{traceResult.order?.orderCode || traceResult.prod?.orderId || 'N/A'}</strong>
                    {traceResult.order?.channel && <span> • Kênh: {traceResult.order.channel}</span>}
                    {traceResult.order?.customer && <span> • Khách: {traceResult.order.customer}</span>}
                  </div>
                </div>

                <div className="text-right font-mono">
                  <span className="px-2.5 py-1 rounded text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    KCS: {traceResult.prod?.qc_status || 'ĐÃ DUYỆT PASS'}
                  </span>
                </div>
              </div>

              {/* TIMELINE TRÁCH NHIỆM 4 KHÂU */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                {/* Khâu 1: Cắt & Dán Phôi */}
                <div className="bg-white/[0.02] border border-white/[0.04] rounded-xl p-3.5 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-black uppercase text-sky-400 font-mono">Khâu 1: Cắt Dán Phôi</span>
                      <span className="w-2 h-2 rounded-full bg-sky-400"></span>
                    </div>
                    <div className="text-xs font-black text-white font-mono">
                      Thợ: {traceResult.prod?.p1_user || traceResult.prod?.phases?.phase1?.user || 'Nguyễn Hoàng Dương'}
                    </div>
                    <div className="text-[10px] font-mono text-zinc-500 mt-1">
                      Hoàn thành: {traceResult.prod?.p1_endTime || traceResult.prod?.phases?.phase1?.endTime || 'Đã bàn giao khâu 2'}
                    </div>
                  </div>
                  {traceResult.prod?.p1_photo && (
                    <div className="mt-3 pt-2 border-t border-white/[0.04]">
                      <a href={traceResult.prod.p1_photo} target="_blank" rel="noopener noreferrer" className="text-[10px] text-sky-400 hover:underline flex items-center gap-1 font-mono">
                        <i className="fas fa-image"></i> Xem ảnh công đoạn 1
                      </a>
                    </div>
                  )}
                </div>

                {/* Khâu 2: Gọt Keo & Gia Cố */}
                <div className="bg-white/[0.02] border border-white/[0.04] rounded-xl p-3.5 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-black uppercase text-amber-400 font-mono">Khâu 2: Gọt Keo & Gia Cố</span>
                      <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                    </div>
                    <div className="text-xs font-black text-white font-mono">
                      Thợ: {traceResult.prod?.p2_user || traceResult.prod?.phases?.phase2?.user || 'Lại Trường Tâm'}
                    </div>
                    <div className="text-[10px] font-mono text-zinc-500 mt-1">
                      Hoàn thành: {traceResult.prod?.p2_endTime || traceResult.prod?.phases?.phase2?.endTime || 'Đã vào kho dưỡng'}
                    </div>
                  </div>
                  {traceResult.prod?.p2_photo && (
                    <div className="mt-3 pt-2 border-t border-white/[0.04]">
                      <a href={traceResult.prod.p2_photo} target="_blank" rel="noopener noreferrer" className="text-[10px] text-amber-400 hover:underline flex items-center gap-1 font-mono">
                        <i className="fas fa-image"></i> Xem ảnh công đoạn 2
                      </a>
                    </div>
                  )}
                </div>

                {/* Khâu 3: Nghiệm Thu KCS */}
                <div className="bg-white/[0.02] border border-white/[0.04] rounded-xl p-3.5 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-black uppercase text-emerald-400 font-mono">Khâu 3: Nghiệm Thu KCS</span>
                      <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    </div>
                    <div className="text-xs font-black text-white font-mono">
                      QC: {traceResult.prod?.qc_user || 'Lại Trường Tâm'}
                    </div>
                    <div className="text-[10px] font-mono text-zinc-500 mt-1">
                      Ghi chú: {traceResult.prod?.qc_note || 'Test nước 100% không rò rỉ, đường keo phẳng'}
                    </div>
                  </div>
                  {(traceResult.prod?.qc_front_photo || traceResult.prod?.qc_side_photo) && (
                    <div className="mt-3 pt-2 border-t border-white/[0.04] flex items-center gap-2 text-[10px] font-mono text-emerald-400">
                      {traceResult.prod?.qc_front_photo && <a href={traceResult.prod.qc_front_photo} target="_blank" rel="noreferrer" className="hover:underline">Ảnh mặt trước</a>}
                      {traceResult.prod?.qc_side_photo && <a href={traceResult.prod.qc_side_photo} target="_blank" rel="noreferrer" className="hover:underline">• Ảnh mặt hông</a>}
                    </div>
                  )}
                </div>

                {/* Khâu 4: Đóng Gói & Bưu Tá */}
                <div className="bg-white/[0.02] border border-white/[0.04] rounded-xl p-3.5 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-black uppercase text-purple-400 font-mono">Khâu 4: Đóng Gói Xuất Kho</span>
                      <span className="w-2 h-2 rounded-full bg-purple-400"></span>
                    </div>
                    <div className="text-xs font-black text-white font-mono">
                      Người gói: {traceResult.packing?.user || 'Diệu Hương'}
                    </div>
                    <div className="text-[10px] font-mono text-zinc-500 mt-1">
                      Giờ gói: {traceResult.packing?.endTime ? String(traceResult.packing.endTime).slice(0, 16) : 'Đã giao bưu tá'}
                    </div>
                  </div>
                  {traceResult.packing?.photo && (
                    <div className="mt-3 pt-2 border-t border-white/[0.04]">
                      <a href={traceResult.packing.photo} target="_blank" rel="noopener noreferrer" className="text-[10px] text-purple-400 hover:underline flex items-center gap-1 font-mono">
                        <i className="fas fa-camera"></i> Xem ảnh kiện hàng bọc xốp
                      </a>
                    </div>
                  )}
                </div>
              </div>

              {/* KẾT LUẬN TRÁCH NHIỆM KHI CÓ KHIẾU NẠI */}
              <div className="p-3.5 rounded-xl bg-white/[0.02] border border-white/[0.06] text-xs leading-relaxed">
                <div className="text-[10px] font-black uppercase tracking-wider text-[#d4af37] mb-1 font-mono flex items-center gap-1.5">
                  <i className="fas fa-scale-balanced"></i> Hướng Dẫn Phân Định Khiếu Nại Sàn TMĐT:
                </div>
                <div className="text-zinc-300 space-y-1">
                  <div>• <strong>Bể rò rỉ / bọt keo:</strong> Lỗi kỹ thuật thuộc Khâu 1 & Khâu 2 (Thợ chịu trách nhiệm khắc phục).</div>
                  <div>• <strong>Bể vỡ nát khi khách nhận:</strong> Kiểm tra ảnh Khâu 3 và Khâu 4. Nếu ảnh KCS và ảnh bọc xốp nguyên vẹn $\rightarrow$ Lỗi do đơn vị vận chuyển (Bưu tá ném hàng). Dùng ảnh Khâu 4 để nộp bằng chứng khiếu nại sàn TMĐT (Tag <span className="text-emerald-400 font-mono font-bold">[KN-THANG]</span>).</div>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* =========================================================================
          SUB-TAB 3: SỔ BIÊN BẢN SỰ CỐ KỸ THUẬT (INCIDENT LEDGER)
          ========================================================================= */}
      {activeSubTab === 'INCIDENTS' && (
        <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-4 sm:p-5 shadow-sm space-y-3">
          <div className="flex items-center justify-between pb-2 border-b border-white/[0.06]">
            <div>
              <h2 className="text-sm sm:text-base font-black text-white uppercase tracking-wider flex items-center gap-2">
                <i className="fas fa-clipboard-check text-rose-400"></i>
                Sổ Biên Bản Sự Cố Kỹ Thuật & Khấu Trừ Quy Chế ({technicalIncidents.length})
              </h2>
              <p className="text-zinc-500 text-[11px] mt-0.5">
                Ghi nhận nội bộ phục vụ khấu trừ lương cuối tháng. Tuyệt đối không bêu rếu lên bảng điều hành chung.
              </p>
            </div>
            {canManageWorkstations && (
              <button
                onClick={() => setShowIncidentModal(true)}
                className="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white border border-rose-500/30 rounded-lg text-xs font-bold transition-all cursor-pointer shadow-sm active:scale-95"
              >
                + Lập Biên Bản Mới
              </button>
            )}
          </div>

          <div className="overflow-x-auto custom-scrollbar">
            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="border-b border-white/[0.06] text-zinc-400 font-bold uppercase text-[10px] tracking-wider">
                  <th className="py-2.5 px-3">Ngày</th>
                  <th className="py-2.5 px-3">Nhân Sự Liên Quan</th>
                  <th className="py-2.5 px-3">Nội Dung Sự Cố</th>
                  <th className="py-2.5 px-3">Mã Đơn / Bể</th>
                  <th className="py-2.5 px-3 text-right">Khấu Trừ Quy Chế (VNĐ)</th>
                  <th className="py-2.5 px-3 text-center">Trạng Thái</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-white/[0.04]">
                {technicalIncidents.length === 0 ? (
                  <tr>
                    <td colSpan="6" className="text-center py-8 text-zinc-500 italic font-mono">
                      Xưởng vận hành đạt chuẩn 100%, chưa ghi nhận sự cố kỹ thuật nào trong tháng.
                    </td>
                  </tr>
                ) : (
                  technicalIncidents.map(inc => (
                    <tr key={inc.id} className="h-12 hover:bg-white/[0.02] transition-colors font-mono">
                      <td className="py-1 px-3 text-zinc-400">{inc.date || '--'}</td>
                      <td className="py-1 px-3 text-zinc-200 font-bold">{inc.user}</td>
                      <td className="py-1 px-3 text-zinc-300 font-sans max-w-xs truncate">{inc.note}</td>
                      <td className="py-1 px-3 text-zinc-400">{inc.orderCode || 'Nội bộ xưởng'}</td>
                      <td className="py-1 px-3 text-right text-rose-400 font-bold">
                        -{Number(inc.amount || 0).toLocaleString('vi-VN')} đ
                      </td>
                      <td className="py-1 px-3 text-center">
                        <span className="px-2 py-0.5 rounded text-[9.5px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                          Đã trừ lương
                        </span>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* =========================================================================
          SUB-TAB 4: BẢNG QUY CHẾ VI PHẠM & 5S (MINH BẠCH - PHƯƠNG ÁN C)
          ========================================================================= */}
      {activeSubTab === 'REGULATIONS' && (
        <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-4 sm:p-5 shadow-sm space-y-4">
          <div className="pb-3 border-b border-white/[0.06]">
            <h2 className="text-sm sm:text-base font-black text-white uppercase tracking-wider flex items-center gap-2">
              <i className="fas fa-gavel text-[#d4af37]"></i>
              Quy Chế Kỷ Luật Kỹ Thuật & Chuẩn 5S Xưởng Rich Fish
            </h2>
            <p className="text-zinc-500 text-[11px] mt-0.5">
              Áp dụng công khai, minh bạch cho toàn thể đội ngũ thợ sản xuất, thủ kho và đóng gói.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {INCIDENT_TYPES.map((reg, idx) => (
              <div key={idx} className="p-3.5 bg-white/[0.02] border border-white/[0.04] rounded-xl flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-xs font-black text-zinc-100 flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                    <span>{reg.type}</span>
                  </div>
                  <div className="text-[11px] text-zinc-400 mt-1 leading-relaxed">
                    {reg.desc}
                  </div>
                </div>
                <div className="text-right shrink-0">
                  <div className="text-xs font-black font-mono text-rose-400">
                    -{reg.defaultPenalty.toLocaleString('vi-VN')} đ
                  </div>
                  <div className="text-[9px] font-mono text-zinc-500 mt-0.5">Khấu trừ lương</div>
                </div>
              </div>
            ))}
          </div>

          {/* Triết lý Lean 5S */}
          <div className="p-3.5 rounded-xl bg-emerald-500/5 border border-emerald-500/20 text-xs">
            <div className="text-[10.5px] font-black uppercase tracking-wider text-emerald-400 mb-1 flex items-center gap-1.5">
              <i className="fas fa-broom"></i> Kỷ Luật 5S Trước Khi Tan Ca:
            </div>
            <div className="text-zinc-300 leading-relaxed">
              1. <strong>Sàng lọc:</strong> Thu dọn mảnh kính vụn, bao bì rách ném vào thùng rác phế liệu.<br/>
              2. <strong>Sắp xếp:</strong> Trả dao cắt kính, thước nhôm, súng bắn keo về đúng giá treo trạm.<br/>
              3. <strong>Sạch sẽ:</strong> Lau sạch bàn cắt kính và bàn dán keo, không để keo thừa bám dính mặt bàn.<br/>
              4. <strong>Săn sóc & Sẵn sàng:</strong> Kiểm tra ngắt nguồn điện, khóa van khí nén trước khi ra ca.
            </div>
          </div>
        </div>
      )}

      {/* =========================================================================
          MODAL LẬP BIÊN BẢN SỰ CỐ KỸ THUẬT NHANH
          ========================================================================= */}
      {showIncidentModal && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-xs animate-fade-in" onClick={() => setShowIncidentModal(false)}>
          <div className="bg-[#121214] border border-white/[0.1] w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center border-b border-white/[0.06] pb-3">
              <h3 className="text-white font-black text-sm uppercase tracking-wider flex items-center gap-2">
                <i className="fas fa-file-shield text-rose-400"></i>
                Lập Biên Bản Sự Cố Kỹ Thuật
              </h3>
              <button onClick={() => setShowIncidentModal(false)} className="text-zinc-400 hover:text-white cursor-pointer"><i className="fas fa-times"></i></button>
            </div>

            <div className="space-y-3 bg-[#09090b] p-3.5 rounded-xl border border-white/[0.06]">
              {/* Chọn thợ */}
              <div>
                <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Nhân sự liên quan:</label>
                <select
                  value={incidentForm.staff}
                  onChange={(e) => setIncidentForm(prev => ({ ...prev, staff: e.target.value }))}
                  className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                >
                  <option value="">-- Chọn nhân sự --</option>
                  {staffList.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>

              {/* Loại lỗi */}
              <div>
                <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Loại sự cố kỹ thuật:</label>
                <select
                  value={incidentForm.incidentType}
                  onChange={handleIncidentTypeChange}
                  className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                >
                  {INCIDENT_TYPES.map(it => <option key={it.type} value={it.type}>{it.type}</option>)}
                </select>
              </div>

              {/* Mã đơn */}
              <div>
                <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Mã đơn hàng / Mã Serial bể (nếu có):</label>
                <input
                  type="text"
                  placeholder="VD: 240825ABCD hoặc BE151525_001..."
                  value={incidentForm.orderCode}
                  onChange={(e) => setIncidentForm(prev => ({ ...prev, orderCode: e.target.value }))}
                  className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white font-mono outline-none focus:border-[#d4af37]"
                />
              </div>

              {/* Mức khấu trừ */}
              <div>
                <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Mức khấu trừ lương theo quy chế (VNĐ):</label>
                <input
                  type="number"
                  value={incidentForm.penaltyVnd}
                  onChange={(e) => setIncidentForm(prev => ({ ...prev, penaltyVnd: e.target.value }))}
                  className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-rose-400 font-mono font-bold outline-none focus:border-[#d4af37]"
                />
              </div>

              {/* Ghi chú chi tiết */}
              <div>
                <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Mô tả chi tiết nguyên nhân sự cố:</label>
                <textarea
                  placeholder="Ghi rõ tình trạng thực tế để thợ rút kinh nghiệm..."
                  value={incidentForm.note}
                  onChange={(e) => setIncidentForm(prev => ({ ...prev, note: e.target.value }))}
                  className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-zinc-200 outline-none min-h-[60px] custom-scrollbar focus:border-[#d4af37]"
                />
              </div>
            </div>

            <div className="flex items-center justify-end gap-2 pt-1">
              <button onClick={() => setShowIncidentModal(false)} className="px-3.5 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:bg-[#27272a] transition-colors cursor-pointer">Hủy</button>
              <button 
                onClick={handleSaveIncident}
                className="px-4 py-2 rounded-lg text-xs font-black text-white bg-rose-600 hover:bg-rose-500 transition-all cursor-pointer shadow-sm active:scale-95"
              >
                Xác Nhận Biên Bản
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
});

window.WorkspaceTab = WorkspaceTab;
window.WorkspacesTab = WorkspaceTab;
</script>
