<script type="text/babel">
    // =========================================================================
    // 🔨 FILE: Tab_Production.txt
    // CHỨC NĂNG: Giao diện Xưởng sản xuất, chia việc cho thợ, theo dõi tiến độ
    // =========================================================================

    const CONFIGS_BE_KINH = Object.freeze([{ k: 'phase1', n: 'Cắt Dán', req: [] }, { k: 'phase2', n: 'Gọt Keo', req: ['phase1'] }]);
    const CONFIGS_KHUNG = Object.freeze([{ k: 'phase1', n: 'Dựng Khung', req: [] }, { k: 'phase2', n: 'Gia Cố', req: ['phase1'] }]);



    const getChannelBadgeInfo = (chan) => {
        const k = String(chan || '').toUpperCase().trim();
        if (k.includes('SHOPEE')) {
            return { bg: 'bg-orange-500/15', text: 'text-orange-400', border: 'border-orange-500/30', icon: 'fa-shopping-bag' };
        }
        if (k.includes('TIKTOK')) {
            return { bg: 'bg-pink-500/15', text: 'text-pink-400', border: 'border-pink-500/30', icon: 'fab fa-tiktok' };
        }
        if (k.includes('XUẤT KHẨU') || k.includes('EXPORT') || k.includes('QUỐC TẾ')) {
            return { bg: 'bg-amber-500/15', text: 'text-amber-400', border: 'border-amber-500/30', icon: 'fa-globe-asia' };
        }
        if (k.includes('CỘNG TÁC VIÊN') || k.includes('CTV')) {
            return { bg: 'bg-emerald-500/15', text: 'text-emerald-400', border: 'border-emerald-500/30', icon: 'fa-users' };
        }
        if (k.includes('BÁN LẺ') || k.includes('OFFLINE') || k.includes('ZALO') || k.includes('FACEBOOK') || k.includes('MESSENGER')) {
            return { bg: 'bg-sky-500/15', text: 'text-sky-400', border: 'border-sky-500/30', icon: 'fa-store' };
        }
        if (k.includes('SẢN XUẤT TỒN') || k.includes('SẢN XUẤT BÙ KHO') || k.includes('TỒN XƯỞNG')) {
            return { bg: 'bg-purple-500/15', text: 'text-purple-400', border: 'border-purple-500/30', icon: 'fa-warehouse' };
        }
        if (k.includes('BẢO HÀNH') || k.includes('SỬA CHỮA')) {
            return { bg: 'bg-rose-500/15', text: 'text-rose-400', border: 'border-rose-500/30', icon: 'fa-tools' };
        }
        return { bg: 'bg-[#d4af37]/15', text: 'text-[#d4af37]', border: 'border-[#d4af37]/30', icon: 'fa-layer-group' };
    };

    // Helper so khớp nhân sự thông minh (hỗ trợ cả Tên đầy đủ và Tên gọi ngắn: Trần Duy Tân <-> Tân)
    const isStaffMatch = (u1, u2) => {
        if (!u1 || !u2) return false;
        const s1 = String(u1).trim().toLowerCase();
        const s2 = String(u2).trim().toLowerCase();
        if (s1 === s2) return true;
        if (s1.includes(s2) || s2.includes(s1)) return true;
        const last1 = s1.split(/\s+/).pop();
        const last2 = s2.split(/\s+/).pop();
        return last1 === last2 && last1.length >= 2;
    };

    // =========================================================================
    // 🛡️ BLACKBOX ACTION LOGGER & SENSORY FEEDBACK (CHỐNG ĐỔ LỖI MẠNG / QUÊN BẤM)
    // =========================================================================
    const recordWorkerActionLog = (logData) => {
        try {
            const key = 'rf_worker_blackbox_logs';
            const existingRaw = localStorage.getItem(key);
            let logs = [];
            if (existingRaw) {
                try { logs = JSON.parse(existingRaw); } catch (e) { logs = []; }
            }
            const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
            const currentDateTime = safeDateFull.slice(0, 19).replace('T', ' ');

            const newEntry = {
                id: 'LOG_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                time: currentDateTime,
                user: logData.user || 'Thợ',
                action: logData.action || 'Thao tác',
                phaseKey: logData.phaseKey || '',
                phaseName: logData.phaseName || '',
                itemId: logData.itemId || '',
                itemName: logData.itemName || '',
                orderId: logData.orderId || '',
                reward: logData.reward || 0,
                status: logData.status || '',
                isOnline: navigator.onLine,
                device: (/Mobile|Android|iPhone/i.test(navigator.userAgent) ? 'Điện thoại' : 'Máy tính')
            };

            logs.unshift(newEntry);
            if (logs.length > 250) logs = logs.slice(0, 250); // Giữ 250 log thao tác gần nhất
            localStorage.setItem(key, JSON.stringify(logs));
            return newEntry;
        } catch (e) {
            console.warn('Lỗi ghi blackbox log:', e);
            return null;
        }
    };

    const playWorkerHapticAndAudio = (type = 'start') => {
        // 1. Phản hồi rung xúc giác trên điện thoại (Haptic Touch)
        try {
            if (navigator.vibrate) {
                if (type === 'start') {
                    navigator.vibrate([80, 50, 80]);
                } else if (type === 'done') {
                    navigator.vibrate([120, 60, 160]);
                } else {
                    navigator.vibrate(60);
                }
            }
        } catch (e) { }

        // 2. Phản hồi âm thanh công nghiệp rõ nét (Web Audio API)
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            const ctx = new AudioContextClass();
            if (ctx.state === 'suspended') ctx.resume();

            if (type === 'start') {
                // Tiếng Chime nhận việc (2 nốt 587Hz -> 880Hz)
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.25);
            } else if (type === 'done') {
                // Tiếng Ting hoàn thành xuất xưởng (3 nốt C5 -> E5 -> G5)
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.22);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.08);
                    osc.stop(ctx.currentTime + i * 0.08 + 0.25);
                });
            }
        } catch (e) { }
    };

    // Helper chuẩn hoá thời gian cho Hộp Đen
    const parseAuditLogTimeMs = (t) => {
        if (!t) return 0;
        if (t instanceof Date) return t.getTime();
        const s = String(t).trim();
        if (!s) return 0;
        if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}/.test(s)) {
            const parts = s.split(' ');
            const dateParts = parts[0].split(/[\/\-]/);
            const timePart = parts[1] || '00:00:00';
            const iso = `${dateParts[2]}-${dateParts[1].padStart(2, '0')}-${dateParts[0].padStart(2, '0')}T${timePart}`;
            const d = new Date(iso).getTime();
            if (!isNaN(d)) return d;
        }
        const ms = new Date(s.replace(/-/g, '/')).getTime();
        if (!isNaN(ms)) return ms;
        const directMs = new Date(s).getTime();
        return isNaN(directMs) ? 0 : directMs;
    };

    // -------------------------------------------------------------------------
    // 📋 MODAL 1: PHIẾU NHẬN NGUYÊN LIỆU & VẬT TƯ (ĐẦU CA - NHẬN VIỆC)
    // CHUYÊN BIỆT CHO: BỂ KÍNH ➔ BỂ LẺ SIZE & LAYOUT ➔ COVER
    // -------------------------------------------------------------------------
    const MaterialRequisitionModal = React.memo(function MaterialRequisitionModal({ isOpen, onClose, item, order, erpProducts = [], onConfirm, triggerToast }) {
        const isGlass = item?.type === 'Bể Kính' || String(item?.name || '').toLowerCase().includes('bể');
        const targetSubCat = isGlass ? 'NGUYÊN LIỆU BỂ KÍNH' : 'NGUYÊN LIỆU LAYOUT';
        
        // Lọc danh sách nguyên liệu từ kho Products
        const availableMaterials = React.useMemo(() => {
            if (!erpProducts || !Array.isArray(erpProducts)) return [];
            return erpProducts.filter(p => {
                const cat = String(p.category || '').toUpperCase().trim();
                const subCat = String(p.sub_category || '').toUpperCase().trim();
                if (cat === 'DANH MỤC SẢN XUẤT' && subCat === targetSubCat) return true;
                if (isGlass && (subCat.includes('KÍNH') || p.name?.toLowerCase().includes('kính') || p.name?.toLowerCase().includes('wacker'))) return true;
                if (!isGlass && (subCat.includes('LAYOUT') || p.name?.toLowerCase().includes('lũa') || p.name?.toLowerCase().includes('đá') || p.name?.toLowerCase().includes('502'))) return true;
                return false;
            });
        }, [erpProducts, isGlass, targetSubCat]);

        const [selectedRows, setSelectedRows] = React.useState([]);
        const [searchQuery, setSearchQuery] = React.useState('');

        if (!isOpen || !item) return null;

        const handleAddMaterial = (mat) => {
            if (!mat) return;
            const exists = selectedRows.find(r => r.sku === mat.sku || r.name === mat.name);
            if (exists) {
                if (triggerToast) triggerToast('Vật tư đã có trong danh sách!', 'fa-info-circle', 'warning');
                return;
            }
            setSelectedRows(prev => [
                ...prev,
                {
                    sku: mat.sku || mat.id,
                    name: mat.name,
                    unit: mat.unit || (isGlass ? 'm²' : 'kg'),
                    requestedQty: '',
                    costPrice: Number(mat.costPrice || 0)
                }
            ]);
        };

        const handleUpdateQty = (index, val) => {
            setSelectedRows(prev => {
                const next = [...prev];
                next[index].requestedQty = val;
                return next;
            });
        };

        const handleRemoveRow = (index) => {
            setSelectedRows(prev => prev.filter((_, i) => i !== index));
        };

        const handleConfirm = () => {
            const validItems = selectedRows.filter(r => Number(r.requestedQty) > 0).map(r => ({
                ...r,
                requestedQty: Number(r.requestedQty),
                returnedQty: 0,
                actualQty: Number(r.requestedQty)
            }));

            if (validItems.length === 0) {
                if (!window.confirm('Bạn chưa nhập số lượng vật tư nào. Vẫn muốn tiếp tục nhận việc?')) {
                    return;
                }
            }
            onConfirm(validItems);
        };

        const filteredStockList = availableMaterials.filter(m => 
            String(m.name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            String(m.sku || '').toLowerCase().includes(searchQuery.toLowerCase())
        );

        return ReactDOM.createPortal(
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[999999] flex items-center justify-center p-3 animate-fade-in select-none" onClick={onClose}>
                <div className="bg-[#121215] border border-indigo-500/30 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                    {/* Header */}
                    <div className="p-4 bg-gradient-to-r from-[#181820] to-[#141418] border-b border-white/[0.08] flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-base">
                                <i className="fas fa-clipboard-list"></i>
                            </div>
                            <div>
                                <h3 className="text-sm font-black uppercase text-white tracking-wider flex items-center gap-2">
                                    <span>PHIẾU NHẬN NGUYÊN LIỆU & VẬT TƯ</span>
                                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-mono">
                                        {isGlass ? 'BỂ LẺ SIZE' : 'LAYOUT COVER'}
                                    </span>
                                </h3>
                                <p className="text-[11px] text-zinc-400 font-medium truncate max-w-md mt-0.5">
                                    Lệnh: <strong className="text-zinc-200">{item.name}</strong> ({order?.orderCode || item.orderId || 'Sản xuất lẻ'})
                                </p>
                            </div>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-lg bg-zinc-800/80 hover:bg-rose-600 text-zinc-400 hover:text-white flex items-center justify-center transition-colors">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>

                    {/* Body */}
                    <div className="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                        {/* Box Chọn Nhanh Vật Tư Từ Kho */}
                        <div className="bg-[#0c0c0e] p-3 rounded-xl border border-white/[0.06] space-y-2.5">
                            <div className="flex items-center justify-between">
                                <span className="text-[11px] font-black uppercase text-zinc-300 flex items-center gap-1.5">
                                    <i className="fas fa-boxes-stacked text-amber-400"></i>
                                    <span>Chọn vật tư từ kho ({targetSubCat})</span>
                                </span>
                                <span className="text-[10px] text-zinc-500 font-mono">{availableMaterials.length} loại có sẵn</span>
                            </div>
                            <div className="relative">
                                <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="Tìm theo tên vật tư hoặc mã SKU..."
                                    className="w-full pl-8 pr-3 py-1.5 bg-[#141417] border border-zinc-800 rounded-lg text-xs text-zinc-200 outline-none focus:border-indigo-500 transition-colors placeholder:text-zinc-600"
                                />
                            </div>

                            {/* Tags vật tư nhanh */}
                            <div className="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto custom-scrollbar pt-1">
                                {filteredStockList.length === 0 ? (
                                    <div className="text-[11px] text-zinc-500 italic py-2">Không tìm thấy vật tư nào phù hợp trong danh mục {targetSubCat}</div>
                                ) : (
                                    filteredStockList.map(mat => {
                                        const isSelected = selectedRows.some(r => r.sku === mat.sku || r.name === mat.name);
                                        return (
                                            <button
                                                key={mat.id || mat.sku}
                                                onClick={() => handleAddMaterial(mat)}
                                                disabled={isSelected}
                                                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1.5 transition-all cursor-pointer ${isSelected
                                                    ? 'bg-zinc-800/50 text-zinc-600 border border-zinc-800 cursor-not-allowed'
                                                    : 'bg-[#18181f] hover:bg-indigo-600/30 text-zinc-300 hover:text-white border border-white/[0.08] hover:border-indigo-500/50 active:scale-95'
                                                }`}
                                            >
                                                <i className={`fas ${isSelected ? 'fa-check' : 'fa-plus'} text-[9px]`}></i>
                                                <span>{mat.name}</span>
                                                <span className="text-[9px] text-zinc-500 font-mono">({mat.unit || 'đv'})</span>
                                            </button>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* Bảng Danh Sách Đã Chọn Để Lĩnh */}
                        <div className="space-y-2">
                            <div className="flex items-center justify-between">
                                <span className="text-[11px] font-black uppercase text-indigo-400 flex items-center gap-1.5">
                                    <i className="fas fa-hand-holding-box"></i>
                                    <span>Danh sách vật tư thực tế ra kệ lấy ({selectedRows.length})</span>
                                </span>
                            </div>

                            {selectedRows.length === 0 ? (
                                <div className="p-6 text-center bg-[#0e0e11] border border-dashed border-zinc-800 rounded-xl text-zinc-500 text-xs">
                                    <i className="fas fa-box-open text-2xl mb-2 text-zinc-600 block"></i>
                                    Chưa chọn vật tư nào. Hãy bấm vào các nút vật tư ở trên để thêm vào phiếu!
                                </div>
                            ) : (
                                <div className="bg-[#0c0c0e] border border-white/[0.08] rounded-xl overflow-hidden divide-y divide-white/[0.04]">
                                    <div className="grid grid-cols-12 gap-2 px-3 py-2 bg-[#141417] text-[10px] font-black uppercase text-zinc-400">
                                        <div className="col-span-6">Tên Vật Tư</div>
                                        <div className="col-span-4 text-center">Số Lượng Lấy (Bê về bàn)</div>
                                        <div className="col-span-2 text-right">Xoá</div>
                                    </div>
                                    {selectedRows.map((row, idx) => (
                                        <div key={idx} className="grid grid-cols-12 gap-2 px-3 py-2 items-center hover:bg-white/[0.02] transition-colors">
                                            <div className="col-span-6 min-w-0">
                                                <div className="text-xs font-bold text-zinc-200 truncate">{row.name}</div>
                                                <div className="text-[10px] text-zinc-500 font-mono">{row.sku}</div>
                                            </div>
                                            <div className="col-span-4 flex items-center justify-center gap-1.5">
                                                <input
                                                    type="number"
                                                    step="any"
                                                    min="0"
                                                    value={row.requestedQty}
                                                    onChange={e => handleUpdateQty(idx, e.target.value)}
                                                    placeholder="0"
                                                    className="w-20 px-2 py-1 text-center bg-[#18181f] border border-indigo-500/40 rounded-lg text-xs font-black text-amber-300 outline-none focus:border-indigo-400 transition-colors"
                                                />
                                                <span className="text-[11px] font-bold text-zinc-400 w-8">{row.unit}</span>
                                            </div>
                                            <div className="col-span-2 text-right">
                                                <button
                                                    onClick={() => handleRemoveRow(idx)}
                                                    className="w-7 h-7 rounded-lg bg-zinc-800 hover:bg-rose-600 text-zinc-400 hover:text-white inline-flex items-center justify-center transition-colors"
                                                    title="Bỏ dòng này"
                                                >
                                                    <i className="fas fa-trash text-xs"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="p-3 bg-[#141418] border-t border-white/[0.08] flex items-center justify-between gap-3">
                        <button
                            onClick={onClose}
                            className="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs font-bold uppercase transition-colors"
                        >
                            Đóng
                        </button>
                        <button
                            onClick={handleConfirm}
                            className="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white rounded-xl text-xs font-black uppercase tracking-wider shadow-lg shadow-indigo-500/30 flex items-center gap-2 active:scale-95 transition-all cursor-pointer"
                        >
                            <i className="fas fa-check-circle text-sm"></i>
                            <span>✅ XÁC NHẬN LĨNH VẬT TƯ</span>
                        </button>
                    </div>
                </div>
            </div>,
            document.body
        );
    });

    // -------------------------------------------------------------------------
    // ⚖️ MODAL 2: QUYẾT TOÁN TIÊU HAO & TRẢ THỪA (CUỐI CA - NỘP ẢNH HOÀN THÀNH)
    // -------------------------------------------------------------------------
    const MaterialSettlementModal = React.memo(function MaterialSettlementModal({ isOpen, onClose, item, order, onConfirm, triggerToast }) {
        const initialList = React.useMemo(() => {
            const raw = item?.materialUsageData || [];
            if (Array.isArray(raw) && raw.length > 0) {
                return raw.map(m => ({
                    sku: m.sku,
                    name: m.name,
                    unit: m.unit || 'kg',
                    costPrice: Number(m.costPrice || 0),
                    requestedQty: Number(m.requestedQty || m.qty || 0),
                    returnedQty: Number(m.returnedQty || 0),
                    actualQty: Math.max(0, Number(m.requestedQty || m.qty || 0) - Number(m.returnedQty || 0))
                }));
            }
            return [];
        }, [item]);

        const [rows, setRows] = React.useState(initialList);

        React.useEffect(() => {
            setRows(initialList);
        }, [initialList]);

        if (!isOpen || !item) return null;

        const handleReturnedChange = (idx, val) => {
            setRows(prev => {
                const next = [...prev];
                const retVal = Number(val) || 0;
                next[idx].returnedQty = val;
                next[idx].actualQty = Math.max(0, Number(next[idx].requestedQty || 0) - retVal);
                return next;
            });
        };

        const handleConfirm = () => {
            const finalData = rows.map(r => ({
                ...r,
                requestedQty: Number(r.requestedQty || 0),
                returnedQty: Number(r.returnedQty || 0),
                actualQty: Math.max(0, Number(r.requestedQty || 0) - Number(r.returnedQty || 0))
            }));
            onConfirm(finalData);
        };

        return ReactDOM.createPortal(
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[999999] flex items-center justify-center p-3 animate-fade-in select-none" onClick={onClose}>
                <div className="bg-[#121215] border border-emerald-500/30 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                    {/* Header */}
                    <div className="p-4 bg-gradient-to-r from-[#181820] to-[#141418] border-b border-white/[0.08] flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-base">
                                <i className="fas fa-scale-balanced"></i>
                            </div>
                            <div>
                                <h3 className="text-sm font-black uppercase text-white tracking-wider flex items-center gap-2">
                                    <span>QUYẾT TOÁN TIÊU HAO VẬT TƯ</span>
                                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-mono">
                                        TRẢ THỪA CUỐI CA
                                    </span>
                                </h3>
                                <p className="text-[11px] text-zinc-400 font-medium truncate max-w-md mt-0.5">
                                    Sản phẩm: <strong className="text-zinc-200">{item.name}</strong> ({order?.orderCode || item.orderId || 'Sản xuất lẻ'})
                                </p>
                            </div>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-lg bg-zinc-800/80 hover:bg-rose-600 text-zinc-400 hover:text-white flex items-center justify-center transition-colors">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>

                    {/* Body */}

                    {/* Footer */}
                    <div className="p-3 bg-[#141418] border-t border-white/[0.08] flex items-center justify-between gap-3">
                        <button
                            onClick={onClose}

                        >
                            Huỷ
                        </button>
                        <button
                            onClick={handleConfirm}
                            className="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-black font-black rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/30 flex items-center gap-2 active:scale-95 transition-all cursor-pointer"
                        >

            document.body

    });

    // -------------------------------------------------------------------------
    // MODAL HỘP ĐEN ĐỐI SOÁT THAO TÁC TOÀN XƯỞNG (CHỈ DÀNH RIÊNG CHO BOSS PHÂN QUYỀN TỐI CAO)
    // -------------------------------------------------------------------------
    const WorkerActionAuditModal = React.memo(function WorkerActionAuditModal({ isOpen, onClose, prodItems, orders, packings, erpData, userConfigs, triggerToast }) {
        const [localLogs, setLocalLogs] = React.useState([]);
        const [serverLogs, setServerLogs] = React.useState([]);
        const [loadingServer, setLoadingServer] = React.useState(false);
        const [activeSource, setActiveSource] = React.useState('ALL'); // 'ALL' | 'PROD' | 'PACK' | 'BP' | 'LOCAL' | 'SERVER'
        const [filterUser, setFilterUser] = React.useState('ALL');
        const [filterActionType, setFilterActionType] = React.useState('ALL'); // 'ALL' | 'START' | 'DONE' | 'QC'
        const [filterNet, setFilterNet] = React.useState('ALL');
        const [filterDays, setFilterDays] = React.useState('7DAYS'); // '7DAYS' | 'TODAY' | 'ALL'
        const [searchQuery, setSearchQuery] = React.useState('');
        const [previewPhoto, setPreviewPhoto] = React.useState(null);

        const loadLocalLogs = React.useCallback(() => {
            try {
                const raw = localStorage.getItem('rf_worker_blackbox_logs');
                if (raw) {
                    const parsed = JSON.parse(raw) || [];
                    setLocalLogs(parsed.map(l => ({ ...l, source: 'local' })));
                } else {
                    setLocalLogs([]);
                }
            } catch (e) {
                setLocalLogs([]);
            }
        }, []);

        const fetchServerLogs = React.useCallback(async () => {
            if (typeof window.runGAS !== 'function') return;
            setLoadingServer(true);
            try {
                const pin = localStorage.getItem('rf_pin') || '';
                const res = await window.runGAS('api_getWorkerAuditLogs', { pin: pin });
                if (res && res.success && Array.isArray(res.logs)) {
                    setServerLogs(res.logs);
                }
            } catch (err) {
                console.error("Lỗi nạp Hộp Đen từ Server:", err);
            } finally {
                setLoadingServer(false);
            }
        }, []);

        React.useEffect(() => {
            if (isOpen) {
                loadLocalLogs();
                fetchServerLogs();
            }
        }, [isOpen, loadLocalLogs, fetchServerLogs]);

        // 1. TỔNG HỢP TOÀN BỘ CƠ SỞ DỮ LIỆU THAO TÁC THỰC TẾ TRONG TOÀN XƯỞNG
        const compiledLogs = React.useMemo(() => {
            const list = [];

            // A. TỔNG HỢP TỪ LỆNH SẢN XUẤT (prodItems)
            if (Array.isArray(prodItems)) {
                prodItems.forEach(item => {
                    const orderCode = item.orderId ? `#${item.orderId}` : 'Sản xuất tồn/Lẻ';
                    const p1 = item.phases?.phase1 || {};
                    const p2 = item.phases?.phase2 || {};
                    const p1User = (p1.user || item.p1_user || '').trim();
                    const p2User = (p2.user || item.p2_user || '').trim();
                    const p1Name = p1.name || item.p1_name || 'Khâu 1 (Cắt Dán / Dựng Khung)';
                    const p2Name = p2.name || item.p2_name || 'Khâu 2 (Gọt Keo / Gia Cố)';

                    // Khâu 1 - Bắt đầu
                    const p1Start = p1.start || item.p1_start;
                    if (p1Start && p1User) {
                        list.push({
                            id: `PROD_P1_START_${item.id}`,
                            time: String(p1Start),
                            user: p1User,
                            action: `Bắt đầu ${p1Name}`,
                            phaseKey: 'phase1',
                            phaseName: p1Name,
                            actionType: 'START',
                            status: 'In Progress',
                            itemId: item.id,
                            itemName: item.name || 'Sản phẩm',
                            orderId: item.orderId || '',
                            orderCode: orderCode,
                            reward: 0,
                            photo: '',
                            source: 'prod',
                            sourceLabel: '🏭 Sản Xuất',
                            device: 'Hệ thống',
                            isOnline: true,
                            note: item.note || ''
                        });
                    }

                    // Khâu 1 - Hoàn thành
                    const p1End = p1.endTime || item.p1_endTime;
                    const p1Photo = p1.photo || item.p1_photo;
                    const p1Reward = Number(p1.reward_vnd || item.p1_reward_vnd || 0);
                    if (p1End && p1User) {
                        list.push({
                            id: `PROD_P1_END_${item.id}`,
                            time: String(p1End),
                            user: p1User,
                            action: `Hoàn thành ${p1Name}`,
                            phaseKey: 'phase1',
                            phaseName: p1Name,
                            actionType: 'DONE',
                            status: 'Done',
                            itemId: item.id,
                            itemName: item.name || 'Sản phẩm',
                            orderId: item.orderId || '',
                            orderCode: orderCode,
                            reward: p1Reward,
                            photo: p1Photo,
                            source: 'prod',
                            sourceLabel: '🏭 Sản Xuất',
                            device: 'Hệ thống',
                            isOnline: true,
                            note: item.note || ''
                        });
                    }

                    // Khâu 2 - Bắt đầu
                    const p2Start = p2.start || item.p2_start;
                    if (p2Start && p2User) {
                        list.push({
                            id: `PROD_P2_START_${item.id}`,
                            time: String(p2Start),
                            user: p2User,
                            action: `Bắt đầu ${p2Name}`,
                            phaseKey: 'phase2',
                            phaseName: p2Name,
                            actionType: 'START',
                            status: 'In Progress',
                            itemId: item.id,
                            itemName: item.name || 'Sản phẩm',
                            orderId: item.orderId || '',
                            orderCode: orderCode,
                            reward: 0,
                            photo: '',
                            source: 'prod',
                            sourceLabel: '🏭 Sản Xuất',
                            device: 'Hệ thống',
                            isOnline: true,
                            note: item.note || ''
                        });
                    }

                    // Khâu 2 - Hoàn thành
                    const p2End = p2.endTime || item.p2_endTime;
                    const p2Photo = p2.photo || item.p2_photo;
                    const p2Reward = Number(p2.reward_vnd || item.p2_reward_vnd || 0);
                    if (p2End && p2User) {
                        list.push({
                            id: `PROD_P2_END_${item.id}`,
                            time: String(p2End),
                            user: p2User,
                            action: `Hoàn thành ${p2Name}`,
                            phaseKey: 'phase2',
                            phaseName: p2Name,
                            actionType: 'DONE',
                            status: 'Done',
                            itemId: item.id,
                            itemName: item.name || 'Sản phẩm',
                            orderId: item.orderId || '',
                            orderCode: orderCode,
                            reward: p2Reward,
                            photo: p2Photo,
                            source: 'prod',
                            sourceLabel: '🏭 Sản Xuất',
                            device: 'Hệ thống',
                            isOnline: true,
                            note: item.note || ''
                        });
                    }

                    // QC Kiểm Định
                    if (item.qc_status || item.qc_note || item.qc_front_photo) {
                        list.push({
                            id: `PROD_QC_${item.id}`,
                            time: String(p2End || p1End || item.deadline || new Date().toISOString().slice(0, 19).replace('T', ' ')),
                            user: 'QC Kiểm Định',
                            action: `QC Kiểm Định: ${item.qc_status || 'Đã duyệt'}`,
                            phaseKey: 'qc',
                            phaseName: 'Kiểm Định QC',
                            actionType: 'QC',
                            status: item.qc_status || 'Kiểm Định',
                            itemId: item.id,
                            itemName: item.name || 'Sản phẩm',
                            orderId: item.orderId || '',
                            orderCode: orderCode,
                            reward: 0,
                            photo: item.qc_front_photo || item.qc_side_photo || '',
                            source: 'prod',
                            sourceLabel: '🔍 QC',
                            device: 'Hệ thống',
                            isOnline: true,
                            note: item.qc_note || ''
                        });
                    }
                });
            }

            // B. TỔNG HỢP TỪ ĐÓNG GÓI (packings hoặc erpData.packings)
            const packingList = Array.isArray(packings) && packings.length > 0
                ? packings
                : (Array.isArray(erpData?.packings) ? erpData.packings : []);

            packingList.forEach(pkg => {
                const pkgUser = (pkg.user || '').trim();
                const orderCode = pkg.orderId ? `#${pkg.orderId}` : 'Đơn hàng';
                const reward = Number(pkg.reward_vnd || 0);

                if (pkg.start && pkgUser) {
                    list.push({
                        id: `PKG_START_${pkg.id || Math.random()}`,
                        time: String(pkg.start),
                        user: pkgUser,
                        action: 'Bắt đầu Đóng Gói',
                        phaseKey: 'packing',
                        phaseName: 'Đóng Gói',
                        actionType: 'START',
                        status: 'In Progress',
                        itemId: pkg.id,
                        itemName: `Đóng gói đơn ${orderCode}`,
                        orderId: pkg.orderId || '',
                        orderCode: orderCode,
                        reward: 0,
                        photo: '',
                        source: 'pack',
                        sourceLabel: '📦 Đóng Gói',
                        device: 'Hệ thống',
                        isOnline: true,
                        note: ''
                    });
                }

                const pkgEnd = pkg.endTime || pkg.end;
                if (pkgEnd && pkgUser) {
                    list.push({
                        id: `PKG_END_${pkg.id || Math.random()}`,
                        time: String(pkgEnd),
                        user: pkgUser,
                        action: 'Hoàn thành Đóng Gói',
                        phaseKey: 'packing',
                        phaseName: 'Đóng Gói',
                        actionType: 'DONE',
                        status: 'Done',
                        itemId: pkg.id,
                        itemName: `Đóng gói đơn ${orderCode}`,
                        orderId: pkg.orderId || '',
                        orderCode: orderCode,
                        reward: reward,
                        photo: pkg.photo || pkg.photoBefore || '',
                        source: 'pack',
                        sourceLabel: '📦 Đóng Gói',
                        device: 'Hệ thống',
                        isOnline: true,
                        note: ''
                    });
                }
            });

            // C. TỔNG HỢP TỪ THƯỞNG PHẠT (erpData.BonusPenalty)
            if (Array.isArray(erpData?.BonusPenalty)) {
                erpData.BonusPenalty.forEach(bp => {
                    const bpUser = (bp.user || '').trim();
                    if (bpUser && bp.date) {
                        const isPenalty = Number(bp.amount || 0) < 0 || String(bp.type || '').toLowerCase().includes('phạt');
                        list.push({
                            id: `BP_${bp.id || Math.random()}`,
                            time: String(bp.date),
                            user: bpUser,
                            action: `${isPenalty ? '⚠️ Phạt' : '🎁 Thưởng'}: ${bp.type || 'Thưởng/Phạt'}`,
                            phaseKey: 'bonus_penalty',
                            phaseName: 'Thưởng Phạt',
                            actionType: isPenalty ? 'PENALTY' : 'BONUS',
                            status: isPenalty ? 'Penalty' : 'Bonus',
                            itemId: bp.id,
                            itemName: bp.note || bp.type || 'Thưởng Phạt',
                            orderId: bp.orderCode || '',
                            orderCode: bp.orderCode ? `#${bp.orderCode}` : '',
                            reward: Number(bp.amount || 0),
                            photo: '',
                            source: 'bp',
                            sourceLabel: '⚖️ Thưởng Phạt',
                            device: 'Kế Toán / Hệ Thống',
                            isOnline: true,
                            note: bp.note || ''
                        });
                    }
                });
            }

            // D. TỔNG HỢP TỪ CLIENT LOCALSTORAGE (Blackbox máy này)
            localLogs.forEach(l => {
                list.push({
                    ...l,
                    id: l.id || `LOCAL_${Math.random()}`,
                    actionType: String(l.action).includes('Bắt đầu') || String(l.action).includes('Nhận') ? 'START' : 'DONE',
                    source: 'local',
                    sourceLabel: '💻 Máy Này'
                });
            });

            // E. TỔNG HỢP TỪ SERVER LOGS (Tracking_Log)
            serverLogs.forEach(l => {
                list.push({
                    ...l,
                    id: l.id || `SRV_${Math.random()}`,
                    actionType: String(l.action).includes('Bắt đầu') || String(l.action).includes('Nhận') ? 'START' : 'DONE',
                    source: 'server',
                    sourceLabel: '☁️ Server'
                });
            });

            // Sắp xếp thời gian giảm dần (Mới nhất lên đầu)
            list.sort((a, b) => parseAuditLogTimeMs(b.time) - parseAuditLogTimeMs(a.time));

            return list;
        }, [prodItems, packings, erpData, localLogs, serverLogs]);

        if (!isOpen) return null;

        // Lấy danh sách thợ từ cả Config Nhân Sự lẫn trong Logs thực tế
        let cfgUsers = [];
        if (userConfigs) {
            if (Array.isArray(userConfigs)) {
                cfgUsers = userConfigs.map(u => u['Tên Nhân Sự'] || u.name).filter(Boolean);
            } else if (userConfigs.pins && typeof userConfigs.pins === 'object') {
                cfgUsers = Object.values(userConfigs.pins).map(u => u.name || u['Tên Nhân Sự']).filter(Boolean);
            }
        }
        const logUsers = Array.from(new Set(compiledLogs.map(l => l.user).filter(Boolean)));
        const allUniqueUsers = Array.from(new Set([...cfgUsers, ...logUsers])).filter(u => u && u !== 'QC Kiểm Định').sort();

        // Lọc danh sách logs
        const filteredLogs = compiledLogs.filter(l => {
            // Lọc theo Khoảng Thời Gian (Mặc định: 7 Ngày Gần Nhất)
            if (filterDays !== 'ALL') {
                const now = new Date();
                const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                const sevenDaysAgo = todayStart - (6 * 24 * 60 * 60 * 1000); // 7 ngày: hôm nay + 6 ngày trước
                const logTime = parseAuditLogTimeMs(l.time);
                if (logTime > 0) {
                    if (filterDays === '7DAYS' && logTime < sevenDaysAgo) return false;
                    if (filterDays === 'TODAY' && logTime < todayStart) return false;
                }
            }

            // Lọc theo Nguồn
            if (activeSource !== 'ALL') {
                if (activeSource === 'PROD' && l.source !== 'prod') return false;
                if (activeSource === 'PACK' && l.source !== 'pack') return false;
                if (activeSource === 'BP' && l.source !== 'bp') return false;
                if (activeSource === 'LOCAL' && l.source !== 'local') return false;
                if (activeSource === 'SERVER' && l.source !== 'server') return false;
            }

            // Lọc theo Thợ
            if (filterUser !== 'ALL' && String(l.user).trim() !== filterUser) return false;

            // Lọc theo Loại Thao Tác
            if (filterActionType === 'START' && l.actionType !== 'START') return false;
            if (filterActionType === 'DONE' && l.actionType !== 'DONE') return false;
            if (filterActionType === 'QC' && l.actionType !== 'QC') return false;

            // Lọc theo Mạng
            if (filterNet === 'ONLINE' && !l.isOnline) return false;
            if (filterNet === 'OFFLINE' && l.isOnline) return false;

            // Lọc theo Từ Khoá Tìm Kiếm
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                const matchStr = `${l.user} ${l.action} ${l.itemName} ${l.orderId} ${l.note || ''}`.toLowerCase();
                if (!matchStr.includes(q)) return false;
            }

            return true;
        });

        // Đếm theo từng nguồn
        const countProd = compiledLogs.filter(l => l.source === 'prod').length;
        const countPack = compiledLogs.filter(l => l.source === 'pack').length;
        const countBP = compiledLogs.filter(l => l.source === 'bp').length;
        const countLocal = compiledLogs.filter(l => l.source === 'local').length;
        const countServer = compiledLogs.filter(l => l.source === 'server').length;

        // Tổng tiền định mức đang lọc
        const totalReward = filteredLogs.reduce((sum, l) => sum + (Number(l.reward) || 0), 0);

        const handleCopyEvidence = () => {
            if (filteredLogs.length === 0) {
                triggerToast && triggerToast('Không có dữ liệu để sao chép!', 'fa-info-circle', 'warning');
                return;
            }
            const header = `=== BẰNG CHỨNG ĐỐI SOÁT THAO TÁC XƯỞNG (${filteredLogs.length} LƯỢT) ===\nThời điểm xuất: ${new Date().toLocaleString('vi-VN')}\n\n`;
            const text = filteredLogs.map((l, idx) =>
                `[${idx + 1}] ${l.time} | Nguồn: ${l.sourceLabel || l.source} | Thợ: ${l.user} | ${l.action} | Đơn: ${l.orderId || 'Sản xuất lẻ'} | Hàng: ${l.itemName}${l.reward ? ` | Thưởng: +${Number(l.reward).toLocaleString('vi-VN')}đ` : ''}${l.photo ? ` | Ảnh: ${l.photo}` : ''}`
            ).join('\n');

            navigator.clipboard.writeText(header + text).then(() => {
                triggerToast && triggerToast('Đã sao chép toàn bộ bằng chứng vào Clipboard!', 'fa-clipboard-check', 'success');
            }).catch(() => {
                triggerToast && triggerToast('Không thể sao chép!', 'fa-times', 'danger');
            });
        };

        const handleClearLocalLogs = () => {
            if (window.confirm("BẠN CÓ CHẮC CHẮN MUỐN XOÁ NHẬT KÝ HỘP ĐEN TRÊN MÁY NÀY?\n(Lưu ý: Dữ liệu Lệnh Sản Xuất, Đóng Gói và Google Sheets vẫn được bảo toàn 100%)")) {
                localStorage.removeItem('rf_worker_blackbox_logs');
                setLocalLogs([]);
                triggerToast && triggerToast('Đã xoá sạch nhật ký hộp đen trên thiết bị!', 'fa-trash', 'success');
            }
        };

        return (
            <div className="fixed inset-0 z-[9999] bg-black/85 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 animate-fade-in" onClick={onClose}>
                <div className="bg-[#0e0e12] border border-white/[0.1] rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>

                    {/* Header */}
                    <div className="px-3.5 py-2.5 bg-[#141418] border-b border-white/[0.08] flex items-center justify-between flex-wrap gap-2 shrink-0">
                        <div className="flex items-center gap-2.5 min-w-0">
                            <div className="w-7 h-7 rounded-lg bg-rose-500/15 border border-rose-500/30 flex items-center justify-center text-rose-400 text-xs shrink-0">
                                <i className="fas fa-shield-alt"></i>
                            </div>
                            <div className="min-w-0">
                                <div className="flex items-center gap-2 flex-wrap">
                                    <h3 className="text-[12.5px] sm:text-[13px] font-black uppercase text-zinc-100 tracking-wider truncate">
                                        HỘP ĐEN ĐỐI SOÁT THAO TÁC TOÀN XƯỞNG
                                    </h3>

    // -------------------------------------------------------------------------
    // 📦 KHUNG THÔNG BÁO TRA CỨU HÀNG HOÁ BỂ KÍNH & LAYOUT HẾT / THIẾU TRONG KHO
    // -------------------------------------------------------------------------
    const formatProductImgUrl = (url) => {
        if (!url || typeof url !== 'string') return '';
        const str = url.trim();
        if (str.includes('drive.google.com/file/d/')) {
            const match = str.match(/\/d\/([^/]+)/);
            return match ? ('https://drive.google.com/uc?export=view&id=' + match[1]) : str;
        }
        if (str.includes('drive.google.com/open?id=')) {
            const match = str.match(/id=([^&]+)/);
            return match ? ('https://drive.google.com/uc?export=view&id=' + match[1]) : str;
        }
        return str;
    };

    const OutOfStockProductsModal = React.memo(function OutOfStockProductsModal({ isOpen, onClose, erpProducts = [], onQuickCreateSXT, triggerToast }) {
        const [activeFilter, setActiveFilter] = React.useState('ALL'); // 'ALL' | 'BE_KINH' | 'LAYOUT'
        const [stockStatusFilter, setStockStatusFilter] = React.useState('OUT'); // 'OUT' | 'LOW' | 'ALL'
        const [searchKeyword, setSearchKeyword] = React.useState('');
        // Giỏ gom hàng cần sản xuất
        const [selectedItems, setSelectedItems] = React.useState([]); // Array of { product, qty }

        // Lọc ra các sản phẩm Bể Kính và Layout
        const relevantProducts = (erpProducts || []).filter(p => {
            const cat = String(p.category || '').toUpperCase().trim();
            const subCat = String(p.sub_category || '').toUpperCase().trim();
            const name = String(p.name || '').toUpperCase().trim();
            const isGlass = cat.includes('BỂ') || cat.includes('BE') || subCat.includes('BỂ') || name.includes('BỂ KÍNH') || name.includes('BỂ DÁN');
            const isLayout = cat.includes('LAYOUT') || subCat.includes('LAYOUT') || name.includes('LAYOUT') || name.includes('KHUNG') || name.includes('TIỂU CẢNH');
            return isGlass || isLayout;
        });

        // Phân loại nhóm Bể Kính / Layout
        const isGlassProd = (p) => {
            const cat = String(p.category || '').toUpperCase().trim();
            const subCat = String(p.sub_category || '').toUpperCase().trim();
            const name = String(p.name || '').toUpperCase().trim();
            return cat.includes('BỂ') || cat.includes('BE') || subCat.includes('BỂ') || name.includes('BỂ KÍNH') || name.includes('BỂ DÁN');
        };

        const filteredList = relevantProducts.filter(p => {
            const qty = Number(p.quantity || 0);
            const minQty = Number(p.minStock || 0);
            const isGlass = isGlassProd(p);

            // Lọc phân loại danh mục
            if (activeFilter === 'BE_KINH' && !isGlass) return false;
            if (activeFilter === 'LAYOUT' && isGlass) return false;

            // Lọc trạng thái tồn kho
            if (stockStatusFilter === 'OUT' && qty > 0) return false;
            if (stockStatusFilter === 'LOW' && (qty <= 0 || minQty <= 0 || qty > minQty)) return false;

            // Tìm kiếm
            if (searchKeyword.trim()) {
                const q = searchKeyword.toLowerCase();
                const matchName = String(p.name || '').toLowerCase().includes(q);
                const matchSku = String(p.sku || '').toLowerCase().includes(q);
                const matchSub = String(p.sub_category || '').toLowerCase().includes(q);
                if (!matchName && !matchSku && !matchSub) return false;
            }
            return true;
        });

        // Đếm thống kê
        const outCount = relevantProducts.filter(p => Number(p.quantity || 0) <= 0).length;
        const lowCount = relevantProducts.filter(p => {
            const q = Number(p.quantity || 0);
            const m = Number(p.minStock || 0);
            return q > 0 && m > 0 && q <= m;
        }).length;

        // Xử lý chọn / tăng giảm số lượng sản phẩm trong giỏ gom
        const handleSelectItem = (prod, delta = 1) => {
            setSelectedItems(prev => {
                const prodKey = prod.id || prod.sku || prod.name;
                const existingIdx = prev.findIndex(it => (it.product.id || it.product.sku || it.product.name) === prodKey);

                if (existingIdx === -1) {
                    if (delta <= 0) return prev;
                    return [...prev, { product: prod, qty: Math.max(1, delta) }];
                }

                const current = prev[existingIdx];
                const newQty = current.qty + delta;
                if (newQty <= 0) {
                    return prev.filter((_, idx) => idx !== existingIdx);
                }

                const updated = [...prev];
                updated[existingIdx] = { ...current, qty: newQty };
                return updated;
            });
        };

        const handleRemoveItem = (prodKey) => {
            setSelectedItems(prev => prev.filter(it => (it.product.id || it.product.sku || it.product.name) !== prodKey));
        };

        const handleClearSelection = () => {
            setSelectedItems([]);
        };

        const totalSelectedQty = (selectedItems || []).reduce((sum, it) => sum + Number(it.qty || 0), 0);

        const handleConfirmBatchSXT = () => {
            if (selectedItems.length === 0) {
                triggerToast && triggerToast('Vui lòng chọn ít nhất 1 sản phẩm để tạo lệnh!', 'fa-exclamation-triangle', 'warning');
                return;
            }
            if (onQuickCreateSXT) {
                onQuickCreateSXT(selectedItems);
            }
            onClose();
        };

        const handleCopyList = () => {
            if (filteredList.length === 0) {
                triggerToast && triggerToast('Không có sản phẩm nào để sao chép!', 'fa-info-circle', 'warning');
                return;
            }
            const lines = filteredList.map((p, idx) => {
                const typeStr = isGlassProd(p) ? '[BỂ KÍNH]' : '[LAYOUT]';
                return `${idx + 1}. ${typeStr} ${p.name} (Mã: ${p.sku || 'N/A'}) - Tồn: ${p.quantity || 0} ${p.unit || 'Cái'} | Min: ${p.minStock || 0}`;
            });
            const content = `DANH SÁCH BỂ KÍNH & LAYOUT CẦN SẢN XUẤT (${new Date().toLocaleDateString('vi-VN')}):\n` + lines.join('\n');

            navigator.clipboard.writeText(content).then(() => {
                triggerToast && triggerToast('Đã sao chép danh sách vào bộ nhớ tạm!', 'fa-clipboard-check', 'success');
            }).catch(() => {
                triggerToast && triggerToast('Không thể sao chép!', 'fa-times', 'danger');
            });
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 z-[9999] bg-black/85 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 animate-fade-in" onClick={onClose}>
                <div className="bg-[#121214] border border-amber-500/30 rounded-2xl w-full max-w-4xl max-h-[94vh] flex flex-col shadow-2xl overflow-hidden animate-scale-up" onClick={e => e.stopPropagation()}>

                    {/* Header */}
                    <div className="p-3 sm:px-4 sm:py-3.5 bg-[#121214] border-b border-amber-500/20 flex items-center justify-between gap-2 shrink-0">
                        <div className="flex items-center gap-2.5 min-w-0">
                            <div className="w-8 h-8 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 shrink-0 shadow-sm">
                                <i className="fas fa-boxes-stacked text-xs sm:text-sm"></i>
                            </div>
                            <div className="min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                    <h3 className="text-[12px] sm:text-[14px] font-black uppercase text-white tracking-wider truncate">
                                        BỂ KÍNH & LAYOUT HẾT KHO
                                    </h3>
                                    <span className="text-[9px] sm:text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full border border-rose-500/30 font-black">
                                        {outCount} hết
                                    </span>
                                    {lowCount > 0 && (
                                        <span className="text-[9px] sm:text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30 font-black">
                                            {lowCount} thiếu

    // -------------------------------------------------------------------------
    // MỤC 1: COMPONENT CÁC KHÂU NHỎ BÊN TRONG (WorkerPhaseV2)
    // -------------------------------------------------------------------------
    const WorkerPhaseV2 = React.memo(function WorkerPhaseV2({ attendance, item, c, configs, order, prodItems, erpProducts, currentUser, pushDeltas, userConfigs, triggerToast, kpiConfig, isAdmin }) {
        const isCTV = localStorage.getItem('rf_role') === 'CTV';
        const roleStr = String(userConfigs?.[currentUser]?.role || localStorage.getItem('rf_role') || '').toUpperCase();
        const isSenior = isAdmin && (roleStr === 'TỐI CAO' || currentUser === 'TỐI CAO');

        // KIỂM TRA PHÂN QUYỀN TỰ ĐỘNG DUYỆT CỦA TỐI CAO (LAYOUT) VÀ QUẢN LÝ KHO (BỂ KÍNH)
        const activeRole = String(localStorage.getItem('rf_role') || roleStr || '').toUpperCase();
        const isBossRole = activeRole === 'TỐI CAO' || roleStr === 'TỐI CAO' || currentUser === 'TỐI CAO' || currentUser === 'Đỗ Tiến' || currentUser === 'Tài';
        const isWhManager = activeRole === 'QUẢN LÝ KHO' || roleStr === 'QUẢN LÝ KHO';

        const itemTypeUpper = String(item.type || item.category || '').toUpperCase();
        const itemNameLower = String(item.name || '').toLowerCase();
        const isLayoutProduct = itemTypeUpper.includes('LAYOUT') || itemNameLower.includes('layout') || itemNameLower.includes('rừng') || itemNameLower.includes('bonsai') || itemNameLower.includes('vách suối') || itemNameLower.includes('hẻm núi') || itemNameLower.includes('nhất trụ') || itemNameLower.includes('đảo bay') || itemNameLower.includes('hang động');
        const isGlassProduct = itemTypeUpper.includes('BỂ KÍNH') || itemNameLower.includes('bể') || itemNameLower.includes('kính') || itemNameLower.includes('terarium') || itemNameLower.includes('bán cạn') || itemNameLower.includes('betta');

        // Miễn duyệt Khâu 1 & Tự động KCS Khâu 2 nếu đúng phân quyền và loại hàng
        const isAutoBypassQC = (isLayoutProduct && isBossRole) || (isGlassProduct && isWhManager) || isBossRole;

        const data = (item.phases || {})[c.k] || { status: 'Pending' };
        const [processing, setProcessing] = React.useState(false);
        const [isEditingUser, setIsEditingUser] = React.useState(false);
        const [showPokaYokeConfirm, setShowPokaYokeConfirm] = React.useState(false);
        const [showRequisitionModal, setShowRequisitionModal] = React.useState(false);
        const [showSettlementModal, setShowSettlementModal] = React.useState(false);
        const [pendingPhotoFile, setPendingPhotoFile] = React.useState(null);
        const [qcFront, setQcFront] = React.useState(null);
        const [qcSide, setQcSide] = React.useState(null);
        const [completedSerialModal, setCompletedSerialModal] = React.useState(null);

        // KIỂM TRA ĐƠN TÙY CHỈNH (CHỈ ÁP DỤNG: LAYOUT ➔ COVER CẦN NHẶT VẬT TƯ THỦ CÔNG)
        // LƯU Ý KỶ LUẬT VẬN HÀNH: BỂ KÍNH TUYỆT ĐỐI KHÔNG ÁP DỤNG PHIẾU NÀY VÌ ĐÃ CÓ BOM CHUẨN 100% (TỰ ĐỘNG KHẤU TRỪ THEO CÔNG THỨC DIỆN TÍCH KÍNH & SILICON)
        const isCustomItem = React.useMemo(() => {
            if (isGlassProduct) return false;
            const nameLower = String(item.name || '').toLowerCase().trim();
            let subCat = '';
            if (erpProducts && Array.isArray(erpProducts)) {
                const p = erpProducts.find(x => x.name === item.name || x.sku === item.name);
                if (p) subCat = String(p.sub_category || '').toUpperCase().trim();
            }
            const isLayoutCover = subCat === 'COVER' || nameLower.includes('cover') || nameLower.includes('làm theo ảnh') || nameLower.includes('theo mẫu');
            return isLayoutCover;
        }, [item, erpProducts, isGlassProduct]);

        const parseDateSafe = (val) => {
            if (!val) return NaN;
            const str = String(val).trim();
            if (!str) return NaN;
            let s = str;
            if (s.includes(' ')) {
                s = s.replace(' ', 'T');
            }
            if (s.includes('T') && s.split(':').length === 2) {
                s += ':00';
            }
            const t = new Date(s).getTime();
            if (!isNaN(t)) return t;
            return new Date(val).getTime();
        };

        const cleanRejectionNote = (note) => {
            if (!note) return '';
            return String(note)
                .split(' | ')
                .filter(part => {
                    const p = part.trim().toUpperCase();
                    return !p.startsWith('TỪ CHỐI KHUNG') &&
                        !p.startsWith('YÊU CẦU LÀM LẠI') &&
                        !p.startsWith('TỪ CHỐI') &&
                        !p.includes('BÁO LỖI KHUNG');
                })
                .join(' | ')
                .trim();
        };

        let isLocked = c.req.some(rk => ((item.phases || {})[rk] || {}).status !== 'Done') || item.qc_status === 'Yêu cầu làm lại' || item.qc_status === 'Need_Repair';

        const rawUser = String(data.user || '').trim();
        const isFakeUser = !rawUser || rawUser === 'Kho Hàng' || rawUser === 'Hàng';
        const effectiveUser = isFakeUser ? '' : rawUser;

        const isOwner = !effectiveUser || isStaffMatch(effectiveUser, currentUser);
        const isPending = data.status !== 'In Progress' && data.status !== 'Done';
        const isInProgress = data.status === 'In Progress';
        const isDone = data.status === 'Done';

        const [timeText, setTimeText] = React.useState('');
        const [timeColorClass, setTimeColorClass] = React.useState('text-emerald-500');
        const [progressPercent, setProgressPercent] = React.useState(100);

        // Lấy định mức thời gian từ Config_KPI
        const kpiData = React.useMemo(() => {
            return typeof getSopAndReward === 'function'
                ? getSopAndReward(item, c.n, kpiConfig || [], order?.channel)
                : { time: 30, reward: 0 };
        }, [item, c.n, kpiConfig, order]);

        const limitMins = kpiData.time || 30;

        React.useEffect(() => {
            if (!isInProgress || !data.start) return;

            const updateTimer = () => {
                const startMs = parseDateSafe(data.start);
                let nowMs = Date.now();
                if ((item.qc_status === 'Chờ duyệt khung' || item.qc_status === 'Khung đã nộp') && data.endTime) {
                    nowMs = parseDateSafe(data.endTime);
                }
                if (isNaN(startMs)) return;

                const elapsedMs = nowMs - startMs;
                const elapsedMins = elapsedMs / 60000;
                const remainingMins = limitMins - elapsedMins;

                if (remainingMins <= 0) {
                    const overdueMs = Math.abs(remainingMins) * 60000;
                    const overdueH = Math.floor(overdueMs / 3600000);
                    const overdueM = Math.floor((overdueMs % 3600000) / 60000);
                    const overdueS = Math.floor((overdueMs % 60000) / 1000);
                    const overdueText = overdueH > 0
                        ? `${overdueH}h:${String(overdueM).padStart(2, '0')}m`
                        : `${overdueM}:${String(overdueS).padStart(2, '0')}`;

                    setTimeText(`Quá giờ ${overdueText}`);
                    setTimeColorClass('text-rose-500 animate-pulse font-black');
                    setProgressPercent(0);
                } else {
                    const remainingMs = remainingMins * 60000;
                    const remH = Math.floor(remainingMs / 3600000);
                    const remM = Math.floor((remainingMs % 3600000) / 60000);
                    const remS = Math.floor((remainingMs % 60000) / 1000);
                    const remText = remH > 0
                        ? `${remH}h:${String(remM).padStart(2, '0')}m`
                        : `${remM}:${String(remS).padStart(2, '0')}`;

                    setTimeText(`Còn ${remText}`);
                    const ratio = remainingMins / limitMins;
                    setProgressPercent(ratio * 100);
                    if (ratio <= 0.25) {
                        setTimeColorClass('text-amber-500 font-black animate-pulse');
                    } else {
                        setTimeColorClass('text-emerald-400 font-bold');
                    }
                }
            };

            updateTimer();
            const interval = setInterval(updateTimer, 1000);
            return () => clearInterval(interval);
        }, [isInProgress, data.start, limitMins, item.qc_status, data.endTime]);

        const completedDurationText = React.useMemo(() => {
            const startMs = parseDateSafe(data.start);
            const endMs = parseDateSafe(data.endTime);
            if (isNaN(startMs) || !endMs) return '';
            const diffMins = Math.round((endMs - startMs) / 60000);
            return `Làm mất ${diffMins} phút`;
        }, [isDone, data.start, data.endTime]);

        const availableWorkers = React.useMemo(() => {
            const rawList = [
                ...(Array.isArray(userConfigs?.users) ? userConfigs.users : []),
                ...Object.values(userConfigs?.pins || {}).map(u => u?.name).filter(Boolean),
                ...(Array.isArray(attendance) ? attendance.map(a => a?.user).filter(Boolean) : [])
            ];
            const seen = new Set();
            const result = [];
            rawList.forEach(uName => {
                const clean = String(uName || '').trim();
                if (clean && clean !== 'Kho Hàng' && clean !== 'Hàng' && clean.toLowerCase() !== 'khách' && !seen.has(clean)) {
                    seen.add(clean);
                    result.push(clean);
                }
            });
            return result;
        }, [userConfigs, attendance]);

        if (isLocked) return null;

        const act = async (s, confirmed = false, customMaterialData = null) => {
            if (item.assignee && String(item.assignee).trim() !== '' && !isStaffMatch(item.assignee, currentUser) && !isAdmin) {
                triggerToast(`Lệnh này đã được chỉ định cho ${item.assignee}. Bạn không thể nhận!`, 'fa-lock', 'danger');
                return;
            }

            if (s === 'In Progress') {
                const hasActiveCheckin = (attendance || []).some(a =>
                    isStaffMatch(a.user, currentUser) &&
                    a.timeIn && !a.timeOut
                );
                if (!hasActiveCheckin) {
                    triggerToast('Bạn phải Chấm Công vào ca trước khi bắt đầu làm việc!', 'fa-exclamation-triangle', 'danger');
                    return;
                }

                // CHỐT CHẶN PHIẾU NHẬN NGUYÊN LIỆU ĐỐI VỚI BỂ LẺ SIZE & LAYOUT COVER
                if (c.k === 'phase1' && isCustomItem && !customMaterialData && (!item.materialUsageData || item.materialUsageData.length === 0)) {
                    setShowRequisitionModal(true);
                    return;
                }

                // CHỐT CHẶN POKA-YOKE XÁC NHẬN ĐÚNG LỆNH (CHỐNG BẤM NHẦM / ĐỔ LỖI MẠNG)
                if (!confirmed && !isAdmin && !customMaterialData) {
                    setShowPokaYokeConfirm(true);
                    return;
                }
            }

            setProcessing(true);
            setShowPokaYokeConfirm(false);
            const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
            const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

            const upd = JSON.parse(JSON.stringify(item));
            if (customMaterialData) {
                upd.materialUsageData = customMaterialData;
            }
            const isTwoPhaseProduct = configs.length >= 2;

            if (c.k === 'phase1' && isTwoPhaseProduct && s === 'Done') {
                upd.phases['phase1'] = {
                    ...upd.phases['phase1'],
                    status: 'Done',
                    user: currentUser,
                    date: currentDateTime.split(' ')[0],
                    start: data.start || currentDateTime,
                    endTime: currentDateTime
                };
                upd.qc_status = 'Khung đã nộp';
                upd.status = 'In Progress';
            } else {
                upd.phases[c.k] = {
                    ...upd.phases[c.k],
                    status: s,
                    user: currentUser,
                    date: currentDateTime.split(' ')[0],
                    start: s === 'In Progress' ? currentDateTime : data.start,
                    endTime: s === 'Done' ? currentDateTime : ''
                };
            }

            // Nếu người nhận việc mới khác người từng bị từ chối khâu 1 trước đó -> xóa ghi chú từ chối
            const previousRejectedUser = String(item.phases?.phase1?.user || item.p1_user || '').trim();
            if (s === 'In Progress' && previousRejectedUser && !isStaffMatch(currentUser, previousRejectedUser)) {

                upd.qc_status = '';
                upd.qc_note = '';
            }

            let penaltyPayload = null;
            let payloadDeltas = { prodItems: [upd] };

            if (s === 'Done') {
                const startMs = parseDateSafe(data.start);
                const endMs = parseDateSafe(currentDateTime);
                let durationMins = 0;
                let isLate = false;
                let slaPenaltyRatio = 0;

                if (!isNaN(startMs) && !isNaN(endMs)) {
                    durationMins = Math.round((endMs - startMs) / 60000);

                        if (!window.confirm(`CẢNH BÁO ANTI-CHEAT: Bạn bấm Hoàn thành khi chưa đủ 2 phút làm việc. Hệ thống sẽ ghi nhận lỗi vi phạm thao tác (phạt 10.000đ). Vẫn tiếp tục?`)) {
                            setProcessing(false);
                            return;
                        }
                        penaltyPayload = {
                            id: 'BP_ANTICHEAT_' + Date.now(),
                            user: currentUser,
                            amount: -10000,
                            type: 'Phạt Vi Phạm',
                            note: `Bấm hoàn thành quá nhanh (< 2 phút) cho khâu ${c.n}`,
                            date: currentDateTime.split(' ')[0],
                            orderCode: item.orderId || ''
                        };
                        payloadDeltas.BonusPenalty = [penaltyPayload];
                    }

                    // 2. SLA Phạt trễ
                    if (durationMins > limitMins) {
                        isLate = true;
                        const overdueMins = durationMins - limitMins;
                        if (overdueMins <= 2) {
                            slaPenaltyRatio = 0.5; // Trễ <= 2 phút (ân hạn): Trừ 50%
                        } else {
                            slaPenaltyRatio = 1.0; // Trễ > 2 phút: Trừ 100%
                        }
                    }
                }

                let baseReward = (item.note === 'Chất Lượng Kém') ? 0 : (kpiData.reward || 0);
                if (slaPenaltyRatio > 0) {
                    baseReward = baseReward * (1 - slaPenaltyRatio);
                    upd.phases[c.k].note = `Trễ hạn ${Math.round((endMs - startMs) / 60000) - limitMins}p - Phạt ${slaPenaltyRatio * 100}% KPI`;
                }
                upd.phases[c.k].reward_vnd = baseReward;
            }

            if (s === 'Done' && isAdmin && !isTwoPhaseProduct) upd.phases[c.k].adminCompleted = true;

            const p1 = upd.phases['phase1']?.status || 'Pending';
            const p2 = upd.phases['phase2']?.status || 'Pending';
            const isAllDone = isTwoPhaseProduct ? (p1 === 'Done' && p2 === 'Done') : (p1 === 'Done');
            if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';

            }];

            await pushDeltas(payloadDeltas, s === 'In Progress' ? `Đã nhận ${c.n}` : (c.k === 'phase1' && isTwoPhaseProduct ? `Hoàn thành ${c.n} - Sẵn sàng Khâu 2!` : `Xong ${c.n}`), s === 'In Progress' ? 'fa-play' : 'fa-check');

        const handlePhotoUpload = async (e, customMaterialData = null) => {

            }

            setProcessing(true);
            try {
                const b64 = typeof resizeImage === 'function' ? await resizeImage(file) : await new Promise((res, rej) => { const rd = new FileReader(); rd.onload = () => res(rd.result.split(',')[1]); rd.readAsDataURL(file); });
                const url = await runGAS('uploadImage', b64, `SX_${item.id}_${c.k}.jpg`);
                if (!url) {
                    throw new Error("Không thể tải ảnh lên Drive. Vui lòng kiểm tra lại quyền truy cập hoặc dung lượng Drive.");
                }

                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

                // 🤖 GỌI THẨM ĐỊNH AI KCS TỰ ĐỘNG (NẾU MÁY TRẠM SERVER ĐANG BẬT)
                let aiKcsResult = null;
                try {
                    const kcsPayload = {
                        orderId: String(item.id || ''),
                        orderCode: String(item.orderId ? ('#' + item.orderId) : ('PROD_' + item.id)),
                        productName: String(item.name || 'Bể kính / Layout'),
                        size: String(item.size || 'Tiêu chuẩn'),
                        phase: String(c.n || (c.k === 'phase1' ? 'Phase 1' : 'Phase 2')),
                        specs: String(item.note || 'Đúng quy cách, keo sạch không bọt khí, đúng góc 90 độ'),
                        photoUrl: url,
                        worker: String(currentUser || '')
                    };
                    const kcsBaseUrl = (typeof window !== 'undefined' && (window.RF_AI_SERVICE_URL || (window.localStorage && window.localStorage.getItem('rf_ai_service_url')))) || ('http' + '://' + '127.0.0.1:8000');
                    const kcsApiKey = (typeof window !== 'undefined' && (window.RF_AI_API_KEY || (window.localStorage && window.localStorage.getItem('rf_ai_api_key')))) || 'rf-kcs-internal-2026';
                    const kcsResp = await fetch((kcsBaseUrl + '/api/inspect'), {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'X-RF-API-KEY': kcsApiKey
                        },
                        body: JSON.stringify(kcsPayload)
                    });
                    if (kcsResp.ok) {
                        aiKcsResult = await kcsResp.json();
                    }
                } catch (kcsErr) {
                    console.warn('Máy trạm AI KCS ngoại tuyến hoặc lỗi kết nối. Chuyển sang duyệt thủ công:', kcsErr);
                }

                const mapAiQcStatusToErp = (aiStatus, passedKpi) => {
                    const s = String(aiStatus || '').trim().toLowerCase();
                    if (s === 'pass' || s === 'passed' || s === 'đã duyệt' || s === 'đạt' || passedKpi === true) {
                        return 'Đã duyệt';
                    }
                    if (s === 'need_repair' || s === 'failed' || s === 'yêu cầu làm lại' || s === 'từ chối' || passedKpi === false) {
                        return 'Yêu cầu làm lại';
                    }
                    return aiStatus || 'Khung đã nộp';
                };

                const upd = JSON.parse(JSON.stringify(item));

                    upd.materialUsageData = customMaterialData;

                if (c.k === 'phase1' && isTwoPhaseProduct) {
