window.safeJSONParse = (jsonString) => {
    if (!jsonString) return [];
    try {
        const parsed = JSON.parse(jsonString);
        return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
        console.error("FATAL PARSE ERROR: ", e);
        throw new Error("FATAL_DATA_CORRUPTION");
    }
};

class ErrorBoundary extends React.Component {
    constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
    }
    static getDerivedStateFromError(error) {
        return { hasError: true, error };
    }
    render() {
        if (this.state.hasError) {
            if (this.state.error && this.state.error.message === "FATAL_DATA_CORRUPTION") {
                return (
                    <div className="fixed inset-0 z-[999999] bg-[#09090b] flex flex-col items-center justify-center text-white p-8 animate-fade-in">
                        <i className="fas fa-skull-crossbones text-6xl mb-6 text-rose-500 animate-pulse"></i>

}

const getDrivePreviewUrl = (url) => {
    if (!url) return '';
    const match = url.match(/[-\w]{25,}/);
    if (match) return ('https:\x2F\x2Fdrive.google.com/file/d/' + match[0] + '/preview');
    return url;
};

// PERF: Chuyển đổi Google Drive URL sang thumbnail proxy nhẹ hơn ~10-20x
// size: 'sm' (120px), 'md' (300px), 'lg' (600px), 'full' (ảnh gốc)
window.rfOptimizeImageUrl = (url, size = 'sm') => {
    if (!url || typeof url !== 'string') return '';
    const str = url.trim();
    
    // Đã là thumbnail proxy rồi thì không cần convert lại
    if (str.includes('lh3.googleusercontent.com/d/')) return str;
    
    // Nếu là postimg, imgur, hoặc URL ngoài thì giữ nguyên
    if (!str.includes('drive.google.com') && !str.includes('googleusercontent.com')) return str;
    
    // Extract Google Drive file ID
    let fileId = null;
    const patterns = [
        /\/d\/([a-zA-Z0-9_-]{20,})/,         // /file/d/ID/...
        /id=([a-zA-Z0-9_-]{20,})/,            // ?id=ID
        /[-\w]{25,}/                            // raw ID fallback
    ];
    for (const p of patterns) {
        const m = str.match(p);
        if (m) { fileId = m[1] || m[0]; break; }
    }
    if (!fileId) return str;
    
    // Chuyển sang lh3 proxy với kích thước nhỏ
    const sizeMap = { sm: 'w120-h120', md: 'w300-h300', lg: 'w600-h600', full: 'w0' };
    const sizeParam = sizeMap[size] || sizeMap.sm;
    return `https:\x2F\x2Flh3.googleusercontent.com/d/${fileId}=${sizeParam}`;
};

// PERF: Component ảnh tối ưu — lazy load, skeleton, tự nén URL Drive
window.RFImage = React.memo(function RFImage({ src, alt = 'img', className = '', size = 'sm', onClick, title, style }) {
    const [loaded, setLoaded] = React.useState(false);
    const [errored, setErrored] = React.useState(false);
    const optimizedSrc = React.useMemo(() => window.rfOptimizeImageUrl(src, size), [src, size]);
    
    if (!optimizedSrc || errored) {
        return (
            <div className={`bg-[#18181c] border border-white/[0.08] flex items-center justify-center text-zinc-600 ${className}`} style={style}>
                <i className="fas fa-box text-[11px] opacity-60"></i>
            </div>
        );
    }
    
    return (
        <div className={`relative overflow-hidden ${className}`} style={style}>
            {!loaded && <div className="absolute inset-0 skeleton-loader rounded"></div>}
            <img
                src={optimizedSrc}
                alt={alt}
                loading="lazy"
                decoding="async"
                className={`w-full h-full object-cover transition-opacity duration-200 ${loaded ? 'opacity-100' : 'opacity-0'} ${onClick ? 'cursor-pointer' : ''}`}
                onLoad={() => setLoaded(true)}
                onError={() => setErrored(true)}
                onClick={onClick}
                title={title}
            />
        </div>
    );
});

window.resizeImage = (file, maxWidth = 800, maxHeight = 800, initialQuality = 0.5) => {
    return new Promise((resolve, reject) => {
        if (!file || !file.type.match(/image.*/)) return reject(new Error("Not an image"));
        const reader = new FileReader();
        reader.onload = (e) => {
            const image = new Image();
            image.onload = () => {
                let width = image.width; let height = image.height;
                if (width > height && width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                else if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(image, 0, 0, width, height);
                
                let quality = initialQuality;
                let dataUrl = canvas.toDataURL('image/jpeg', quality);
                
                // Google Sheets cell limit is 50,000 chars. We aim for < 45,000.
                while (dataUrl.length > 45000 && quality > 0.1) {
                    quality -= 0.1;
                    dataUrl = canvas.toDataURL('image/jpeg', Math.max(0.1, quality));
                }
                
                while (dataUrl.length > 45000 && width > 100) {
                    width = Math.round(width * 0.7);
                    height = Math.round(height * 0.7);
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(image, 0, 0, width, height);
                    dataUrl = canvas.toDataURL('image/jpeg', quality);
                }
                
                resolve(dataUrl);
            };
            image.onerror = reject;
            image.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
};

const KCS_LOCAL_URL = (typeof window !== 'undefined' && (window.RF_AI_SERVICE_URL || (window.localStorage && window.localStorage.getItem('rf_ai_service_url')))) || (function() { const KCS_LOCAL_URL = 'http' + '://' + '127.0.0.1:8000'; return KCS_LOCAL_URL; })();

    const [isOpen, setIsOpen] = React.useState(false);
    const [messages, setMessages] = React.useState([

            sender: 'assistant',

            time: 'Vừa xong'
        }
    ]);
    const [input, setInput] = React.useState('');
    const [isLoading, setIsLoading] = React.useState(false);
    const [isOnline, setIsOnline] = React.useState(null);
    const [currentContext, setCurrentContext] = React.useState({ phase: 'Xưởng', product: '', defect: '' });
    const messagesEndRef = React.useRef(null);

    const scrollToBottom = () => {
        if (messagesEndRef.current) {
            messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
    };

    React.useEffect(() => {
        if (isOpen) {
            scrollToBottom();
            fetch(KCS_LOCAL_URL + '/health')
                .then(res => res.ok ? res.json() : null)
                .then(data => setIsOnline(Boolean(data && data.status)))
                .catch(() => setIsOnline(false));
        }
    }, [isOpen, messages]);

    React.useEffect(() => {
        window.openWorkshopAssistant = (opt = {}) => {
            setIsOpen(true);
            if (opt.phase || opt.product || opt.defect) {
                setCurrentContext({
                    phase: opt.phase || 'Xưởng',
                    product: opt.product || '',
                    defect: opt.defect || ''
                });
            }
            if (opt.message) {
                handleSend(opt.message, {
                    phase: opt.phase || 'Xưởng',
                    product: opt.product || '',
                    defect: opt.defect || ''
                });
            }
        };
        return () => {
            delete window.openWorkshopAssistant;
        };
    }, []);

    const handleSend = async (customText, overrideContext) => {
        const textToSend = (customText !== undefined ? customText : input).trim();
        if (!textToSend || isLoading) return;

        const ctx = overrideContext || currentContext;
        const nowStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

        const userMsg = {
            id: 'u_' + Date.now(),
            sender: 'user',
            text: textToSend,
            time: nowStr
        };

        setMessages(prev => [...prev, userMsg]);
        if (customText === undefined) setInput('');
        setIsLoading(true);

        if (textToSend.toLowerCase().includes('chủ nhật') || textToSend.toLowerCase().includes('sunday')) {
            try {
                fetch(KCS_LOCAL_URL + '/api/alarm/test?type=sunday', { headers: { 'X-RF-API-KEY': KCS_API_KEY } });
            } catch (e) {}
        } else if (textToSend.toLowerCase().includes('báo thức') || textToSend.toLowerCase().includes('alarm') || textToSend.includes('07:45')) {
            try {
                fetch(KCS_LOCAL_URL + '/api/alarm/test?type=workday', { headers: { 'X-RF-API-KEY': KCS_API_KEY } });
            } catch (e) {}
        }

        try {
            const resp = await fetch(KCS_LOCAL_URL + '/api/assistant/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-RF-API-KEY': KCS_API_KEY },
                body: JSON.stringify({
                    message: textToSend,
                    employee_name: currentUser || 'Thợ xưởng',
                    context_phase: ctx.phase || (activeTab === 'production' ? 'Xưởng Sản Xuất' : 'Chung'),
                    product_name: ctx.product || '',
                    defect_note: ctx.defect || ''
                })
            });

            if (!resp.ok) {
                throw new Error(`Mã lỗi HTTP ${resp.status}`);
            }

            const data = await resp.json();
            const replyText = data.reply || (data.status === 'error' ? ('Lỗi: ' + data.message) : 'Không nhận được câu trả lời từ máy chủ AI.');

            setMessages(prev => [
                ...prev,
                {
                    id: 'a_' + Date.now(),
                    sender: 'assistant',
                    text: replyText,
                    time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                    isError: data.status === 'error'
                }
            ]);
            setIsOnline(true);
        } catch (err) {
            console.warn('Workshop Assistant offline:', err);
            setIsOnline(false);
            setMessages(prev => [
                ...prev,
                {
                    id: 'err_' + Date.now(),
                    sender: 'assistant',
                    text: '⚠️ Không thể kết nối tới máy chủ AI KCS (Cổng 8000). Vui lòng nhấp đúp file start_kcs.vbs để kích hoạt dịch vụ chạy ngầm.',
                    time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                    isError: true
                }
            ]);
        } finally {
            setIsLoading(false);
        }

        '⏰ Thử báo thức 07:45',
        '☕ Thử lời chúc Chủ Nhật',
        'Xử lý bọt khí đường keo',
        'Chuẩn mài xiết vát 45°'
    ];

    return (
        <React.Fragment>
            {/* NÚT TRÒN NỔI GÓC PHẢI DƯỚI */}
            <div className="fixed bottom-5 right-5 z-[9990] flex items-center gap-2">
                {!isOpen && (
                    <button
                        type="button"
                        onClick={() => setIsOpen(true)}
                        className="group relative flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-tr from-[#1a1710] to-[#2a2418] border border-[#d4af37]/50 shadow-[0_8px_24px_rgba(0,0,0,0.6)] text-[#d4af37] hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer"
                        title="Mở Quản Đốc Ảo Rich Fish"
                    >
                        <i className="fas fa-robot text-lg group-hover:rotate-12 transition-transform"></i>
                        <span className={`absolute top-0.5 right-0.5 w-3 h-3 rounded-full border-2 border-[#121214] ${isOnline === true ? 'bg-emerald-400 animate-pulse' : isOnline === false ? 'bg-rose-500' : 'bg-amber-400'}`}></span>
                    </button>
                )}
            </div>

            {/* HỘP THOẠI CHAT POPUP */}
            {isOpen && (
                <div className="fixed bottom-5 right-5 z-[9995] w-[92vw] sm:w-[360px] h-[520px] max-h-[85vh] bg-[#121216] border border-white/10 rounded-2xl shadow-[0_16px_40px_rgba(0,0,0,0.8)] flex flex-col overflow-hidden backdrop-blur-xl animate-scale-up">
                    {/* Header */}
                    <div className="px-4 py-3 bg-gradient-to-r from-[#1a1710] to-[#121216] border-b border-white/10 flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 rounded-xl bg-[#d4af37]/20 border border-[#d4af37]/40 flex items-center justify-center text-[#d4af37] text-sm shadow-sm">
                                <i className="fas fa-hard-hat"></i>
                            </div>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h4 className="text-[13px] font-black text-white uppercase tracking-wider">Quản Đốc Ảo</h4>
                                    <span className={`text-[9px] font-black px-1.5 py-0.2 rounded-full border ${isOnline ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border-rose-500/30'}`}>
                                        {isOnline ? 'ONLINE' : 'OFFLINE'}
                                    </span>
                                </div>
                                <p className="text-[10px] text-zinc-400 font-medium">Hỗ trợ kỹ thuật & an toàn xưởng</p>
                            </div>
                        </div>
                        <button
                            type="button"
                            onClick={() => setIsOpen(false)}
                            className="w-7 h-7 rounded-lg text-zinc-400 hover:text-white hover:bg-white/10 flex items-center justify-center transition-colors cursor-pointer"
                        >
                            <i className="fas fa-times text-xs"></i>
                        </button>
                    </div>

                    {/* Quick Chips */}
                    <div className="px-3 py-2 bg-[#0c0c0e] border-b border-white/5 flex gap-1.5 overflow-x-auto custom-scrollbar shrink-0">
                        {QUICK_CHIPS.map((chip, idx) => (
                            <button
                                key={idx}
                                type="button"
                                disabled={isLoading}
                                onClick={() => handleSend(chip)}
                                className="px-2.5 py-1 rounded-full bg-white/5 hover:bg-[#d4af37]/20 text-[11px] text-zinc-300 hover:text-[#d4af37] border border-white/10 hover:border-[#d4af37]/40 whitespace-nowrap transition-colors cursor-pointer shrink-0"
                            >
                                {chip}
                            </button>
                        ))}
                    </div>

                    {/* Messages Body */}
                    <div className="flex-1 p-3.5 overflow-y-auto space-y-3 text-[12px] custom-scrollbar bg-[#101014]">
                        {messages.map((m) => (
                            <div
                                key={m.id}
                                className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}
                            >
                                <div
                                    className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 leading-relaxed break-words shadow-sm ${
                                        m.sender === 'user'
                                            ? 'bg-gradient-to-r from-amber-600/30 to-[#d4af37]/30 border border-[#d4af37]/40 text-amber-100 rounded-br-none'
                                            : m.isError
                                            ? 'bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-bl-none'
                                            : 'bg-[#18181e] border border-white/10 text-zinc-200 rounded-bl-none'
                                    }`}
                                >
                                    <div className="whitespace-pre-wrap">{m.text}</div>
                                </div>
                                <span className="text-[9px] text-zinc-500 mt-1 px-1">{m.time}</span>
                            </div>
                        ))}
                        {isLoading && (
                            <div className="flex items-center gap-2 text-zinc-400 text-xs px-2 py-1">
                                <i className="fas fa-spinner fa-spin text-[#d4af37]"></i>
                                <span>Quản đốc đang suy nghĩ...</span>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    {/* Input Footer */}
                    <div className="p-2.5 bg-[#141418] border-t border-white/10 shrink-0">
                        <form
                            onSubmit={(e) => {
                                e.preventDefault();
                                handleSend();
                            }}
                            className="flex items-center gap-2"
                        >
                            <input
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="Hỏi quy trình, xử lý lỗi KCS, an toàn..."
                                disabled={isLoading}
                                className="flex-1 bg-[#1c1c22] border border-white/10 focus:border-[#d4af37]/60 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 outline-none transition-colors"
                            />
                            <button
                                type="submit"
                                disabled={isLoading || !input.trim()}
                                className="w-9 h-9 rounded-xl bg-[#d4af37] hover:bg-[#c39e2e] disabled:opacity-40 disabled:hover:bg-[#d4af37] text-black font-bold flex items-center justify-center transition-all cursor-pointer shrink-0"
                            >
                                <i className="fas fa-paper-plane text-xs"></i>
                            </button>
                        </form>
                    </div>
                </div>
            )}
        </React.Fragment>
    );
});

// =========================================================================
// 🏛️ MULTI-AGENT WAR ROOM WIDGET (BAN ĐIỀU HÀNH TÁC NHÂN SỐ 7 AGENTS)
// Single-Turn Orchestration với Gemini 3.6 Flash & Draggable Mini Window
// =========================================================================
const RFAgentControlTower = React.memo(function RFAgentControlTower({ 
    currentUser, 
    orders, 
    prodItems, 
    packings, 
    attendance, 
    erpData, 
    userConfigs, 
    kpiConfig 
}) {
    const [isProcessing, setIsProcessing] = React.useState(false);
    const [chatInput, setChatInput] = React.useState('');
    const [aiOnline, setAiOnline] = React.useState(null);

    React.useEffect(() => {
        let isMounted = true;
        const checkStatus = () => {
            fetch(KCS_LOCAL_URL + '/health')
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (isMounted) setAiOnline(Boolean(data && data.status));
                })
                .catch(() => {
                    if (isMounted) setAiOnline(false);
                });
        };
        checkStatus();
        const timer = setInterval(checkStatus, 30000);
        return () => {
            isMounted = false;
            clearInterval(timer);
        };
    }, []);

    const squad = React.useMemo(() => ({
        cso: { name: "GĐ Chiến Lược", icon: "🌟", color: "#06b6d4", box: "avatar-cso" },
        coo: { name: "GĐ Vận Hành", icon: "🎖️", color: "#38bdf8", box: "avatar-coo" },
        cfo: { name: "GĐ Tài Chính", icon: "💰", color: "#10b981", box: "avatar-cfo" },
        kho: { name: "Thủ Kho AI", icon: "📦", color: "#f59e0b", box: "avatar-kho" },
        sx: { name: "Giám Sát SX", icon: "🛠️", color: "#ec4899", box: "avatar-sx" },
        hr: { name: "Trợ Lý HR", icon: "📊", color: "#a855f7", box: "avatar-hr" },
        baodong: { name: "Thánh Bao Đồng", icon: "🦜", color: "#f43f5e", box: "avatar-baodong" }
    }), []);

    // 1. Kéo thả cửa sổ (Drag & Drop hỗ trợ cả Mouse & Touch)
    React.useEffect(() => {
        window.squad = squad;

        const panel = document.getElementById("rf-agent-control-tower");
        const header = document.getElementById("rf-agent-header");
        if (!panel || !header) return;

        let isDragging = false;
        let startX = 0, startY = 0;

        const onStart = (clientX, clientY, target) => {
            if (target && target.closest && target.closest('button')) return;
            isDragging = true;
            startX = clientX;
            startY = clientY;
            const rect = panel.getBoundingClientRect();
            panel.style.bottom = "auto";
            panel.style.right = "auto";
            panel.style.left = rect.left + "px";
            panel.style.top = rect.top + "px";
        };

        const onMove = (clientX, clientY) => {
            if (!isDragging) return;
            const dx = clientX - startX;
            const dy = clientY - startY;
            panel.style.left = (panel.offsetLeft + dx) + "px";
            panel.style.top = (panel.offsetTop + dy) + "px";
            startX = clientX;
            startY = clientY;
        };

        const onEnd = () => {
            isDragging = false;
        };

        const handleMouseDown = (e) => onStart(e.clientX, e.clientY, e.target);
        const handleMouseMove = (e) => onMove(e.clientX, e.clientY);
        const handleMouseUp = () => onEnd();

        const handleTouchStart = (e) => {
            if (e.touches && e.touches[0]) {
                onStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
            }
        };
        const handleTouchMove = (e) => {
            if (e.touches && e.touches[0]) {
                onMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        };
        const handleTouchEnd = () => onEnd();

        header.addEventListener("mousedown", handleMouseDown);
        document.addEventListener("mousemove", handleMouseMove);
        document.addEventListener("mouseup", handleMouseUp);

        header.addEventListener("touchstart", handleTouchStart, { passive: true });
        document.addEventListener("touchmove", handleTouchMove, { passive: true });
        document.addEventListener("touchend", handleTouchEnd);

        return () => {
            header.removeEventListener("mousedown", handleMouseDown);
            document.removeEventListener("mousemove", handleMouseMove);
            document.removeEventListener("mouseup", handleMouseUp);
            header.removeEventListener("touchstart", handleTouchStart);
            document.removeEventListener("touchmove", handleTouchMove);
            document.removeEventListener("touchend", handleTouchEnd);
        };
    }, [squad]);

    // 2. Hàm chèn lời thoại agent vào stream
    const pushDialogue = React.useCallback((key, text) => {
        const stream = document.getElementById("rf-agent-stream");
        const agent = squad[key] || squad.coo;

        // Đổi viền avatar đang nói
        document.querySelectorAll(".agent-chip").forEach(c => {
            c.style.borderColor = "#3f3f46";
            c.style.boxShadow = "none";
        });
        const activeChip = document.getElementById(agent.box);
        if (activeChip) {
            activeChip.style.borderColor = agent.color;
            activeChip.style.boxShadow = `0 0 10px ${agent.color}50`;
        }

        if (stream) {
            const msgDiv = document.createElement("div");
            msgDiv.style.background = "#18181b";
            msgDiv.style.padding = "8px 10px";
            msgDiv.style.borderRadius = "8px";
            msgDiv.style.borderLeft = `3px solid ${agent.color}`;
            msgDiv.style.boxShadow = "0 2px 8px rgba(0,0,0,0.3)";
            msgDiv.style.animation = "fade-in 0.25s ease-out";
            msgDiv.innerHTML = `<span style="color:${agent.color}; font-weight:bold;">${agent.icon} ${agent.name}:</span> <span style="color:#e4e4e7;">${text}</span>`;
            stream.appendChild(msgDiv);
            stream.scrollTop = stream.scrollHeight;
        }
    }, [squad]);

    // Thu thập snapshot dữ liệu thời gian thực từ Google Sheets để làm grounding context cho 7 Agent
    const buildLiveOperationalContext = React.useCallback(() => {
        let cached = null;
        try {
            const raw = localStorage.getItem('rf_app_instant_cache');
            if (raw) cached = JSON.parse(raw);
        } catch (e) {}

        const safeOrders = (orders && orders.length ? orders : (cached?.orders || []));
        const safeProds = (prodItems && prodItems.length ? prodItems : (cached?.prodItems || []));
        const safePackings = (packings && packings.length ? packings : (cached?.packings || []));
        const safeKPIProgress = (erpData?.KPI_Progress && erpData.KPI_Progress.length ? erpData.KPI_Progress : (cached?.KPI_Progress || []));
        const safeProducts = (erpData?.Products && erpData.Products.length ? erpData.Products : (cached?.Products || []));
        const safeAttendance = (attendance && attendance.length ? attendance : (cached?.attendance || []));
        const rawConfigs = userConfigs?.raw || cached?.Config_NhanSu || [];

        // 1. Danh sách nhân sự chính thức của xưởng
        const knownStaff = [
            { name: "Nguyễn Hoàng Dương", role: "Thợ dán bể kính & Quản lý phôi kho bể" },
            { name: "Trần Duy Tân", role: "Thợ dựng khung layout thủy sinh & hardscape" },
            { name: "Nguyễn Thị Diệu Hương", role: "QC Đóng gói, Đối soát hàng hoàn sàn TMĐT & CSKH" },
            { name: "Nguyễn Thị Trang", role: "Kế toán tài chính & Kiểm soát thu chi" },
            { name: "Nguyễn Ngọc Tiến", role: "Quản đốc điều hành xưởng" }
        ];
        const staffNames = new Set(knownStaff.map(s => s.name));
        const staffList = [...knownStaff];
        if (Array.isArray(rawConfigs)) {
            rawConfigs.forEach(r => {
                const name = r['Tên Nhân Sự'] || r.name;
                const role = r['Chức Danh'] || r.role || 'Nhân sự xưởng';
                if (name && !staffNames.has(name)) {
                    staffNames.add(name);
                    staffList.push({ name, role });
                }
            });
        }

        // 2. Dữ liệu KPI thực tế (KPI_Progress)
        const kpiList = [];
        if (Array.isArray(safeKPIProgress) && safeKPIProgress.length > 0) {
            safeKPIProgress.forEach(k => {
                const user = k.user || k['user'] || '';
                const kpiName = k.kpiName || k['kpiName'] || '';
                const current = Number(k.current || k['current'] || 0);
                const target = Number(k.target || k['target'] || 0);
                const unit = k.unit || k['unit'] || '';
                const pct = target > 0 ? Math.round((current / target) * 100) : 0;
                if (user && kpiName) {
                    kpiList.push({ user, kpi: kpiName, current, target, unit, pct });
                }
            });
        }

        // 3. Tiến độ sản xuất (Production)
        const prodSummary = {
            total: safeProds.length,
            done: safeProds.filter(p => p.status === 'Done').length,
            in_progress: safeProds.filter(p => p.status !== 'Done').length,
            by_worker: {}
        };
        safeProds.forEach(p => {
            if (p.p1_user && (p.p1_status === 'Done' || p.status === 'Done')) {
                prodSummary.by_worker[p.p1_user] = (prodSummary.by_worker[p.p1_user] || 0) + 1;
            }
            if (p.p2_user && (p.p2_status === 'Done' || p.status === 'Done') && p.p2_user !== p.p1_user) {
                prodSummary.by_worker[p.p2_user] = (prodSummary.by_worker[p.p2_user] || 0) + 1;
            }
        });

        // 4. Tồn kho & Vật tư (Products)
        let glueWacker = 'Kho đang còn keo Wacker 121 sẵn sàng';
        const lowStockItems = [];
        if (Array.isArray(safeProducts)) {
            safeProducts.forEach(p => {
                const name = String(p.name || '').toLowerCase();
                const sku = String(p.sku || '').toUpperCase();
                const qty = Number(p.quantity || 0);
                const min = Number(p.minStock || 0);
                if (name.includes('wacker') || sku.includes('WACKER') || name.includes('keo')) {
                    glueWacker = `Còn ${qty} ${p.unit || 'tuýp'} trong kho`;
                }
                if (qty <= min && min > 0 && lowStockItems.length < 8) {
                    lowStockItems.push({
                        sku: p.sku,
                        name: p.name,
                        quantity: qty,
                        minStock: min,
                        unit: p.unit || 'cái'
                    });
                }
            });
        }

        // 5. Đơn hàng (Orders)
        const orderSummary = {
            total: safeOrders.length,
            pending: safeOrders.filter(o => {
                const s = String(o.status || '').toUpperCase();
                return s !== 'ĐÃ GIAO' && s !== 'HOÀN THÀNH' && s !== 'ĐÃ HỦY';
            }).length,
            completed: safeOrders.filter(o => {
                const s = String(o.status || '').toUpperCase();
                return s === 'ĐÃ GIAO' || s === 'HOÀN THÀNH';
            }).length
        };

        return {
            staff: staffList,
            kpi_progress: kpiList,
            production: prodSummary,
            inventory: {
                glue_wacker: glueWacker,
                low_stock: lowStockItems
            },
            orders: orderSummary
        };
    }, [orders, prodItems, packings, attendance, erpData, userConfigs]);

    // 3. Kích hoạt thảo luận thời gian thực qua Gemini API kèm context dữ liệu thật
    const runWarRoomDiscussion = React.useCallback(async (customIncident, extraContext) => {
        if (isProcessing) return;
        const incidentText = (typeof customIncident === 'string' && customIncident.trim())
            ? customIncident.trim()
            : chatInput.trim();
        if (!incidentText) return;

        setIsProcessing(true);
        setChatInput('');

        // Tự động mở cửa sổ và bung mở hoàn toàn khi các AI điều phối
        const panel = document.getElementById("rf-agent-control-tower");
        if (panel) {
            panel.style.display = "flex";
            panel.style.opacity = "1";
            panel.style.visibility = "visible";
            panel.style.height = "520px";
            panel.style.boxShadow = "0 0 25px rgba(212, 175, 55, 0.6)";
            setTimeout(() => {
                if (panel) panel.style.boxShadow = "0 12px 30px rgba(0,0,0,0.7)";
            }, 3000);
        }
        const stream = document.getElementById("rf-agent-stream");
        const roster = document.getElementById("rf-agent-roster");
        const footer = document.getElementById("rf-agent-footer");
        if (stream) stream.style.display = "flex";
        if (roster) roster.style.display = "grid";
        if (footer) footer.style.display = "flex";

        // Hiệu ứng phát sáng trên nút War Room ở Header khi đang điều phối
        const headerBtn = document.getElementById("rf-header-war-room-btn");
        if (headerBtn) {
            headerBtn.style.borderColor = "#d4af37";
            headerBtn.style.boxShadow = "0 0 12px rgba(212, 175, 55, 0.7)";
        }

        // Ghi nhận chỉ đạo / sự vụ từ người dùng vào stream
        if (stream) {
            const incDiv = document.createElement("div");
            incDiv.style.background = "rgba(212, 175, 55, 0.12)";
            incDiv.style.border = "1px solid #d4af37";
            incDiv.style.padding = "8px 12px";
            incDiv.style.borderRadius = "8px";
            incDiv.style.color = "#d4af37";
            incDiv.style.fontSize = "12px";
            incDiv.style.lineHeight = "1.4";
            incDiv.innerHTML = `<span style="color:#d4af37; font-weight:bold;"><i class="fas fa-user-shield"></i> ${currentUser || 'Chỉ huy xưởng'}:</span> <span style="color:#f4f4f5; margin-left: 4px;">${incidentText}</span>`;
            stream.appendChild(incDiv);
            stream.scrollTop = stream.scrollHeight;
        }

        // Thu thập live operational context từ các bảng dữ liệu
        const liveContext = buildLiveOperationalContext();
        const payloadContext = extraContext ? { ...liveContext, ...extraContext } : liveContext;

        // Thông báo trạng thái đang suy nghĩ
        let loadingDiv = null;
        if (stream) {
            loadingDiv = document.createElement("div");
            loadingDiv.id = "agent-loading-state";
            loadingDiv.style.color = "#a1a1aa";
            loadingDiv.style.fontStyle = "italic";
            loadingDiv.style.display = "flex";
            loadingDiv.style.alignItems = "center";
            loadingDiv.style.gap = "6px";
            loadingDiv.innerHTML = `<i class="fas fa-spinner fa-spin text-sky-400"></i> Dàn 7 Agent đang phân tích số liệu hệ thống (Gemini 3.6 Flash)...`;
            stream.appendChild(loadingDiv);
            stream.scrollTop = stream.scrollHeight;
        }

        try {
            let dialogues = null;
            try {
                const res = await fetch(KCS_LOCAL_URL + '/api/warroom/discuss', {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-RF-API-KEY": KCS_API_KEY },
                    body: JSON.stringify({ 
                        incident: incidentText,
                        context: payloadContext
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.status === "success" && Array.isArray(data.dialogues)) {
                        dialogues = data.dialogues;
                    }
                }
            } catch (netErr) {
                console.warn("[WAR ROOM] Không kết nối được cổng 8000, sử dụng kịch bản dự phòng dựa trên dữ liệu thật:", netErr);
            }

            if (loadingDiv) loadingDiv.remove();

            // Loại bỏ hoàn toàn thoại mẫu giả lập: Chỉ báo kết quả thật từ server hoặc báo lỗi trung thực
            if (!dialogues || dialogues.length === 0) {
                if (stream) {
                    const errDiv = document.createElement("div");
                    errDiv.style.background = "rgba(239, 68, 68, 0.15)";
                    errDiv.style.border = "1px solid #ef4444";
                    errDiv.style.padding = "10px 12px";
                    errDiv.style.borderRadius = "8px";
                    errDiv.style.color = "#fca5a5";
                    errDiv.style.fontSize = "12px";
                    errDiv.style.lineHeight = "1.5";
                    errDiv.innerHTML = `<span style="font-weight:bold;"><i class="fas fa-exclamation-triangle"></i> Lỗi kết nối / Xử lý AI:</span> Không nhận được phản hồi hợp lệ từ dịch vụ Agent. Hệ thống tuân thủ nguyên tắc báo lỗi trung thực, tuyệt đối không dùng lời thoại mẫu giả lập để che lỗi. Vui lòng kiểm tra trạng thái máy chủ AI.`;
                    stream.appendChild(errDiv);
                    stream.scrollTop = stream.scrollHeight;
                }
                return;
            }

            for (const line of dialogues) {
                pushDialogue(line.agent, line.message);
                await new Promise(r => setTimeout(r, 1400));
            }
        } catch (err) {
            if (loadingDiv) {
                loadingDiv.innerText = "⚠️ Lỗi xử lý sự vụ: " + err.message;
                loadingDiv.style.color = "#f87171";
            }
        } finally {
            setIsProcessing(false);
            const headerBtn = document.getElementById("rf-header-war-room-btn");
            if (headerBtn) {
                headerBtn.style.borderColor = "";
                headerBtn.style.boxShadow = "";
            }
        }
    }, [isProcessing, chatInput, currentUser, pushDialogue, buildLiveOperationalContext]);

    // Gắn các hàm toàn cục vào window
    React.useEffect(() => {
        window.pushAgentDialogue = pushDialogue;
        window.triggerRealtimeWarRoom = runWarRoomDiscussion;
        window.simulateStrategicAgentChat = runWarRoomDiscussion;
        window.simulateAgentChat = runWarRoomDiscussion;

        window.toggleAgentsTower = () => {
            const panel = document.getElementById("rf-agent-control-tower");
            if (!panel) return;
            const isHidden = panel.style.display === "none" || !panel.style.display;
            if (isHidden) {
                panel.style.display = "flex";
                panel.style.opacity = "1";
                panel.style.visibility = "visible";
                const stream = document.getElementById("rf-agent-stream");
                const roster = document.getElementById("rf-agent-roster");
                const footer = document.getElementById("rf-agent-footer");
                if (stream) stream.style.display = "flex";
                if (roster) roster.style.display = "grid";
                if (footer) footer.style.display = "flex";
                panel.style.height = "520px";
            } else {
                panel.style.display = "none";
            }
        };

        window.openAgentsTower = () => {
            const panel = document.getElementById("rf-agent-control-tower");
            if (!panel) return;
            panel.style.display = "flex";
            panel.style.opacity = "1";
            panel.style.visibility = "visible";
            const stream = document.getElementById("rf-agent-stream");
            const roster = document.getElementById("rf-agent-roster");
            const footer = document.getElementById("rf-agent-footer");
            if (stream) stream.style.display = "flex";
            if (roster) roster.style.display = "grid";
            if (footer) footer.style.display = "flex";
            panel.style.height = "520px";
        };

        window.toggleMinimizeAgents = () => {
            const stream = document.getElementById("rf-agent-stream");
            const roster = document.getElementById("rf-agent-roster");
            const footer = document.getElementById("rf-agent-footer");
            const panel = document.getElementById("rf-agent-control-tower");
            if (!stream || !roster || !panel) return;
            const isHidden = stream.style.display === "none";
            stream.style.display = isHidden ? "flex" : "none";
            roster.style.display = isHidden ? "grid" : "none";
            if (footer) footer.style.display = isHidden ? "flex" : "none";
            panel.style.height = isHidden ? "520px" : "auto";
        };
    }, [pushDialogue, runWarRoomDiscussion]);

    return (
        <React.Fragment>
            {/* Cửa Sổ Thu Nhỏ Điều Hành Đa Tác Nhân (Draggable Floating War Room) */}
            <div
                id="rf-agent-control-tower"
                style={{
                    position: 'fixed',
                    bottom: '80px',
                    right: '20px',
                    width: '480px',
                    maxWidth: 'calc(100vw - 30px)',
                    height: '520px',
                    background: '#121214',
                    border: '1px solid #3f3f46',
                    borderRadius: '12px',
                    display: 'none',
                    flexDirection: 'column',
                    boxShadow: '0 12px 30px rgba(0,0,0,0.7)',
                    zIndex: 99999,
                    fontFamily: 'sans-serif',
                    overflow: 'hidden'
                }}
            >
                {/* Thanh Tiêu Đề Dùng Để Kéo Thả (Drag Handle) */}
                <div
                    id="rf-agent-header"
                    style={{
                        background: '#1e1e24',
                        padding: '10px 14px',
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        cursor: 'move',
                        borderBottom: '1px solid #27272a',
                        userSelect: 'none'
                    }}
                >
                    <div style={{ fontSize: '12px', fontWeight: 'bold', color: '#d4af37', display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <span 
                            title={aiOnline === true ? "Hệ thống AI trực tuyến (Online)" : (aiOnline === false ? "Hệ thống AI ngoại tuyến (Offline)" : "Đang kiểm tra kết nối AI...")}
                            style={{ 
                                width: '8px', 
                                height: '8px', 
                                background: aiOnline === true ? '#22c55e' : (aiOnline === false ? '#ef4444' : '#eab308'), 
                                borderRadius: '50%', 
                                display: 'inline-block', 
                                boxShadow: aiOnline === true ? '0 0 6px #22c55e' : (aiOnline === false ? '0 0 6px #ef4444' : '0 0 6px #eab308'),
                                transition: 'all 0.3s ease'
                            }}
                        ></span>
                        BAN ĐIỀU HÀNH TÁC NHÂN SỐ (RF WAR ROOM)
                    </div>
                    <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                        <button
                            type="button"
                            onClick={() => window.toggleMinimizeAgents && window.toggleMinimizeAgents()}
                            style={{ background: 'none', border: 'none', color: '#a1a1aa', cursor: 'pointer', fontSize: '14px', padding: '0 4px' }}
                            title="Thu nhỏ / Mở rộng"
                        >
                            −
                        </button>

const ToastManager = React.memo(function ToastManager({ toasts }) {

const Avatar = React.memo(function Avatar({ name, userConfigs, className="" }) { 
    const [hasError, setHasError] = React.useState(false);
    let id = null;
    try {
        if (userConfigs && name) {
            const cleanName = String(name).trim().toLowerCase();
            const sourceMap = userConfigs.avatars ? userConfigs.avatars : userConfigs;
            if (sourceMap[name]) {
                id = sourceMap[name];
            } else {
                const nameParts = cleanName.split(/[\s.]+/).filter(Boolean);
                const mainName = nameParts[nameParts.length - 1];
                const firstLetter = nameParts[0]?.[0];
                const matchedKey = Object.keys(sourceMap).find(key => {
                    const keyParts = String(key).trim().toLowerCase().split(/[\s.]+/).filter(Boolean);
                    return keyParts[keyParts.length - 1] === mainName && keyParts[0]?.[0] === firstLetter;
                });
                if (matchedKey) id = sourceMap[matchedKey];
            }
        }
    } catch(e) {}

    let cleanId = id;
    if (id && String(id).includes('drive.google.com')) {
        const match = String(id).match(/[-\w]{25,}/);
        if (match) cleanId = match[0];
    }

    if (cleanId && !hasError) { 
        const isFullUrl = String(cleanId).startsWith('http://') || String(cleanId).startsWith('https://');
        const imgSrc = isFullUrl ? cleanId : ('https:\x2F\x2Flh3.googleusercontent.com/d/' + cleanId + '=w120-h120');
        return <img src={imgSrc} className={`object-cover rounded-full shadow-sm bg-[#18181c] ${className}`} alt={name} onError={() => setHasError(true)} />;
    } 
    return <div className={`flex items-center justify-center rounded-full bg-[#18181c] text-zinc-500 border border-white/[0.08] ${className}`}><i className="fas fa-user text-[11px]"></i></div>;
});

const TimePicker24h = React.memo(function TimePicker24h({ value, onChange, label }) {

    const hours = Array.from({length:24}, (_,i) => String(i).padStart(2,'0'));
    const mins = Array.from({length:60}, (_,i) => String(i).padStart(2,'0')); 
    return ( 
        <div className="flex flex-col"> 
            {label && <label className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">{label}</label>} 
            <div className="flex items-center gap-1.5"> 
                <select value={currentH} onChange={e=>onChange(`${e.target.value}:${currentM||'00'}`)} className="rf-input-glass rounded-xl px-3 py-2 text-[13px] text-white outline-none font-medium flex-1 appearance-none text-center"> 
                    <option value="">Giờ</option> 
                    {hours.map(h => <option key={`h${h}`} value={h}>{h}h</option>)} 
                </select> 
                <span className="text-zinc-500 font-bold">:</span> 
                <select value={currentM} onChange={e=>onChange(`${currentH||'00'}:${e.target.value}`)} className="rf-input-glass rounded-xl px-3 py-2 text-[13px] text-white outline-none font-medium flex-1 appearance-none text-center"> 
                    <option value="">Phút</option> 
                    {mins.map(m => <option key={`m${m}`} value={m}>{m}p</option>)} 
                </select> 
            </div> 
        </div> 
    );
});

const RFImageLightboxModal = React.memo(function RFImageLightboxModal({ src, title = "Xem Ảnh", subTitle = "", onClose }) {
    const [zoom, setZoom] = React.useState(1);
    const [isLoading, setIsLoading] = React.useState(true);
    const [hasError, setHasError] = React.useState(false);
    const [imgSrc, setImgSrc] = React.useState(() => {
        if (!src) return '';
        if (typeof getDirectImageUrl === 'function') {
            const cdn = getDirectImageUrl(src, 'w1600');
            return cdn || src;
        }
        return src;
    });

    React.useEffect(() => {
        setZoom(1);
        setIsLoading(true);
        setHasError(false);
        if (src) {
            const cdn = typeof getDirectImageUrl === 'function' ? getDirectImageUrl(src, 'w1600') : src;
            setImgSrc(cdn || src);
        }
    }, [src]);

    React.useEffect(() => {
        const handleKeyDown = (e) => {
            if (e.key === 'Escape') {
                onClose && onClose();
            }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, [onClose]);

    if (!src) return null;

    const safeDriveUrl = typeof getSafeDriveViewUrl === 'function' ? getSafeDriveViewUrl(src) : src;
    const isDriveImg = src.includes('drive.google.com') || src.includes('googleusercontent.com');

    const handleToggleZoom = (e) => {
        if (e) e.stopPropagation();
        setZoom(prev => prev === 1 ? 1.75 : (prev === 1.75 ? 2.5 : 1));
    };

    const handleOpenExternal = (e) => {
        if (e) e.stopPropagation();
        if (typeof openSafeImageTab === 'function') {
            openSafeImageTab(src);
        } else {
            window.open(safeDriveUrl, '_blank', 'noopener,noreferrer');
        }
    };

    const handleDownload = (e) => {
        if (e) e.stopPropagation();
        try {
            const a = document.createElement('a');
            a.href = imgSrc || src;
            a.download = (title || 'image').replace(/\s+/g, '_') + '.jpg';
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } catch (err) {
            handleOpenExternal(e);
        }
    };

    return ReactDOM.createPortal(
        <div 
            className="fixed inset-0 z-[999999] bg-black/95 backdrop-blur-xl flex flex-col items-center justify-between p-3 sm:p-6 select-none animate-fade-in"
            onClick={onClose}
            style={{ touchAction: 'pan-x pan-y pinch-zoom' }}
        >
            {/* TOP BAR */}
            <div 
                className="w-full max-w-5xl flex items-center justify-between gap-3 bg-[#141418]/95 border border-white/10 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md z-10"
                onClick={e => e.stopPropagation()}
            >
                <div className="flex items-center gap-3 min-w-0">
                    <div className="w-8 h-8 rounded-xl bg-[#d4af37]/15 border border-[#d4af37]/30 flex items-center justify-center text-[#d4af37] text-sm shrink-0">
                        <i className="fas fa-image"></i>
                    </div>
                    <div className="min-w-0">
                        <h3 className="text-sm font-black text-zinc-100 truncate tracking-wide flex items-center gap-2">
                            <span>{title}</span>
                            {isDriveImg && (
                                <span className="text-[9px] font-mono px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 shrink-0">
                                    <i className="fab fa-google-drive mr-1"></i>Google Drive
                                </span>
                            )}
                        </h3>
                        {subTitle && <p className="text-[11px] text-zinc-400 font-mono truncate">{subTitle}</p>}
                    </div>
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                    {/* ZOOM BUTTON */}
                    <button
                        type="button"
                        onClick={handleToggleZoom}
                        className={`px-3 py-1.5 rounded-xl border text-[11px] font-bold transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 ${
                            zoom > 1 ? 'bg-[#d4af37] text-zinc-950 border-[#d4af37]' : 'bg-white/5 hover:bg-white/10 text-zinc-300 border-white/10'
                        }`}
                        title="Phóng to / Thu nhỏ"
                    >
                        <i className={zoom > 1 ? "fas fa-search-minus" : "fas fa-search-plus"}></i>
                        <span className="hidden sm:inline">{zoom > 1 ? zoom + 'x (Thu Nhỏ)' : 'Phóng To'}</span>
                    </button>

                    {/* OPEN SAFE DRIVE TAB */}
                    {isDriveImg && (
                        <button
                            type="button"
                            onClick={handleOpenExternal}
                            className="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 hover:text-white border border-white/10 text-[11px] font-bold transition-all flex items-center gap-1.5 cursor-pointer active:scale-95"
                            title="Mở an toàn trong Google Drive (Không bao giờ bị lỗi kết nối)"
                        >
                            <i className="fas fa-external-link-alt text-xs"></i>
                            <span className="hidden sm:inline">Drive</span>
                        </button>
                    )}

                    {/* DOWNLOAD BUTTON */}
                    <button
                        type="button"
                        onClick={handleDownload}
                        className="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 hover:text-white border border-white/10 text-[11px] font-bold transition-all flex items-center gap-1.5 cursor-pointer active:scale-95"
                        title="Tải ảnh về máy"
                    >
                        <i className="fas fa-download text-xs"></i>
                        <span className="hidden sm:inline">Tải Về</span>
                    </button>

                    {/* CLOSE BUTTON */}
                    <button
                        type="button"
                        onClick={onClose}
                        className="w-8 h-8 rounded-xl bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 transition-all flex items-center justify-center cursor-pointer active:scale-95 ml-1"
                        title="Đóng (ESC)"
                    >
                        <i className="fas fa-times text-xs"></i>
                    </button>
                </div>
            </div>

            {/* MAIN IMAGE CONTAINER */}
            <div 
                className="flex-1 w-full max-w-5xl flex items-center justify-center p-2 sm:p-4 my-2 overflow-auto custom-scrollbar"
                onClick={e => e.stopPropagation()}
            >
                {isLoading && !hasError && (
                    <div className="absolute flex flex-col items-center gap-3 text-zinc-400">
                        <i className="fas fa-circle-notch fa-spin text-3xl text-[#d4af37]"></i>
                        <span className="text-xs font-mono">Đang tải ảnh sắc nét...</span>
                    </div>
                )}

                {hasError ? (
                    <div className="flex flex-col items-center gap-3 text-rose-400 p-8 bg-[#18181c] rounded-2xl border border-rose-500/30">
                        <i className="fas fa-exclamation-triangle text-3xl"></i>
                        <span className="text-xs font-bold">Không thể tải ảnh xem trước</span>
                        <button 
                            onClick={handleOpenExternal}
                            className="px-4 py-2 bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 rounded-xl text-xs font-bold text-white transition-all cursor-pointer"
                        >
                            Mở trực tiếp trên Google Drive
                        </button>
                    </div>
                ) : (
                    <img 
                        src={imgSrc} 
                        alt={title}
                        onLoad={() => setIsLoading(false)}
                        onError={() => {
                            if (imgSrc !== src) {
                                setImgSrc(src);
                            } else {
                                setIsLoading(false);
                                setHasError(true);
                            }
                        }}
                        onClick={handleToggleZoom}
                        style={{
                            transform: `scale(${zoom})`,
                            transformOrigin: 'center center',
                            transition: 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1)'
                        }}
                        className={`max-h-[75vh] max-w-[90vw] object-contain rounded-2xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.9)] bg-black/50 cursor-pointer ${
                            isLoading ? 'opacity-0' : 'opacity-100 transition-opacity duration-300'
                        }`}
                        title="Bấm vào ảnh để phóng to / thu nhỏ"
                    />
                )}
            </div>

            {/* BOTTOM HELPER BAR */}
            <div 
                className="text-center text-[11px] text-zinc-500 flex items-center justify-center gap-4 py-1"
                onClick={e => e.stopPropagation()}
            >
                <span><i className="fas fa-mouse-pointer mr-1"></i> Bấm vào ảnh hoặc nút để Phóng to</span>
                <span className="hidden sm:inline">•</span>
                <span className="hidden sm:inline"><kbd className="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-700 font-mono text-[10px] text-zinc-300">ESC</kbd> hoặc bấm ra ngoài để Đóng</span>
            </div>
        </div>,
        document.body
    );
});

window.RFImageLightboxModal = RFImageLightboxModal;
</script>
