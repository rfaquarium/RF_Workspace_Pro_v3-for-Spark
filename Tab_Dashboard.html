    (prodItems || []).forEach(item => {
      if (item.phases?.phase1?.endTime) logs.push({ time: item.phases.phase1.endTime, category: 'Sản xuất', message: `${item.name} đã hoàn thành ${item.phases.phase1.name}`, user: item.phases.phase1.user || '', amount: Number(item.phases.phase1.reward_vnd) || 0 });
      if (item.phases?.phase2?.endTime) logs.push({ time: item.phases.phase2.endTime, category: 'Sản xuất', message: `${item.name} đã hoàn thành ${item.phases.phase2.name}`, user: item.phases.phase2.user || '', amount: Number(item.phases.phase2.reward_vnd) || 0 });
    });
    (packings || []).forEach(pk => {
      if (pk.endTime && pk.status === 'Done') logs.push({ time: pk.endTime, category: 'Đóng gói', message: `Đơn ${pk.orderId} hoàn thành đóng gói`, user: pk.user || '', amount: Number(pk.reward_vnd) || 0 });
    });
    (attendance || []).forEach(att => {
      const parseTime = (t) => t ? String(t).replace(/'/g, '').trim() : null;
      if (att.morningIn || att.timeIn) logs.push({ time: `${att.date} ${parseTime(att.morningIn || att.timeIn)}`, category: 'Chấm công', message: `${att.user} đã Check-in`, user: att.user, amount: 0 });
      if (att.afternoonOut || att.timeOut) logs.push({ time: `${att.date} ${parseTime(att.afternoonOut || att.timeOut)}`, category: 'Chấm công', message: `${att.user} đã Check-out`, user: att.user, amount: 0 });
    });
    (kpis || []).forEach(kpi => {
      if (kpi.date) logs.push({ time: kpi.date, category: 'KPI / Thưởng', message: kpi.note || 'Thưởng nóng KPI', user: kpi.user || '', amount: Number(kpi.amount) || 0 });
    });
    (importExport || []).forEach(item => {
      if (item.date && item.type !== 'THONG_BAO_HE_THONG') {
          logs.push({ time: item.date, category: 'Xuất nhập kho', message: `${item.type || 'Kho'}: ${item.note || item.target || ''}`, user: '', amount: Number(item.totalAmount) || 0 });
      }
    });
    logs.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
    return logs;
  }, [orders, prodItems, packings, attendance, kpis, importExport]);

  const filteredLogs = categoryFilter === 'Tất cả' ? allLogs : allLogs.filter(log => log.category === categoryFilter);
  const categories = ['Tất cả', 'Đơn hàng', 'Sản xuất', 'Đóng gói', 'Chấm công', 'KPI / Thưởng', 'Xuất nhập kho'];

      case 'KPI / Thưởng': return { icon: <i className="fas fa-trophy"></i>, color: '#d4af37', bg: 'bg-[#d4af37]/10' };

  return (

              <i className="fas fa-clock text-[10px] animate-pulse"></i>
              <RealtimeClock />
          </p>
        </div>
      </div>

      {/* THÔNG BÁO TỪ BAN QUẢN LÝ (BOSS) */}
      {(!isEditingNotice && (!displayNotice || displayNotice === 'Chưa có thông báo nội bộ nào.')) ? (
        <div className="bg-[#121216] border border-white/[0.08] rounded-2xl px-4 py-2.5 flex items-center justify-between shadow-sm">

          </div>
          {isBoss && (
            <button

          )}

      ) : (

            {isBoss && !isEditingNotice && (

              />
              <div className="flex items-center justify-end gap-2 border-t border-white/[0.08] pt-2.5">
                <button onClick={() => setIsEditingNotice(false)} className="px-3.5 py-1.5 rounded-lg text-[10px] font-bold text-zinc-400 hover:bg-[#27272a] transition-colors uppercase tracking-wide cursor-pointer">Hủy</button>
                <button onClick={handleSaveNotice} className="px-4 py-1.5 rounded-lg text-[10px] font-black text-[#09090b] bg-gradient-to-r from-[#d4af37] to-[#f0ca5e] hover:brightness-110 transition-all uppercase tracking-wide flex items-center gap-1.5 shadow-sm cursor-pointer active:scale-95">
                  <i className="fas fa-paper-plane"></i> Phát loa ngay
                </button>
              </div>
            </div>
          ) : (
            <div className="text-[13px] text-zinc-200 leading-relaxed whitespace-pre-wrap relative z-10 font-medium">
              {displayNotice}
            </div>
          )}
        </div>
      )}

      {/* 🚀 BẢNG NHẮC VIỆC SẢN XUẤT & ĐÓNG GÓI THEO THỢ (TÂN, TÂM, DƯƠNG, HƯƠNG) */}
      <ProductionStaffDispatchBoard 
        prodItems={prodItems || []}
        orders={orders || []}
        packings={packings || erpData?.Packings || []}
        currentUser={currentUser}
        isAdmin={isSuperAdmin}
        isBoss={isBoss}
        pushDeltas={pushDeltas}
        triggerToast={triggerToast}
        kpiConfig={typeof kpiConfig !== 'undefined' ? kpiConfig : []}
        erpData={erpData || {}}
      />

      {/* QUICK ACTIONS FRAME 2.0 - HALLMARK BENTO */}
      <div className="bg-[#101014] border border-white/[0.08] p-4 sm:p-5 rounded-2xl shadow-sm relative overflow-hidden group/container">
          <div className="flex items-center justify-between mb-4 relative z-10 border-b border-white/[0.08] pb-3">
              <div className="flex items-center gap-2 text-[11px] font-black text-zinc-300 uppercase tracking-widest">
                  <i className="fas fa-th-large text-[#d4af37]"></i> Bảng Điều Khiển Nhanh
              </div>
              <div className="text-[9.5px] font-bold text-zinc-400 bg-white/[0.04] px-2.5 py-0.5 rounded-full border border-white/[0.08]">
                  Trạm Trung Tâm
              </div>
          </div>
          
          <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-9 gap-2 sm:gap-2.5 relative z-10">
              
              {/* Button 1: Lên Đơn Mới (Bán Lẻ) */}
              <button 
                  onClick={() => window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { detail: { tab: 'orders', trigger: 'triggerCreateOrder', data: { channel: 'Bán Lẻ' } } }))} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-white/[0.08] hover:border-emerald-500/50 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Lên đơn bán lẻ mới"
              >
                  <div className="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(16,185,129,0.15)] transition-transform"><i className="fas fa-cart-plus"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-zinc-200 text-center uppercase tracking-wide group-hover:text-emerald-400 transition-colors">Lên Đơn</span>
              </button>

              {/* Button 2: Bảng Giá */}
              <button 
                  onClick={() => window.dispatchEvent(new Event('openPriceListModal'))} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-white/[0.08] hover:border-amber-500/50 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Tra cứu bảng giá và tồn kho"
              >
                  <div className="w-10 h-10 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(245,158,11,0.15)] transition-transform"><i className="fas fa-tags"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-zinc-200 text-center uppercase tracking-wide group-hover:text-amber-400 transition-colors">Bảng Giá</span>
              </button>

              {/* Button 3: Tính Giá Bể */}
              <button 
                  onClick={() => window.dispatchEvent(new Event('openTankPriceModal'))} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-white/[0.08] hover:border-sky-500/50 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Định giá bể kính theo kích thước"
              >
                  <div className="w-10 h-10 rounded-xl bg-sky-500/15 border border-sky-500/30 text-sky-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(14,165,233,0.15)] transition-transform"><i className="fas fa-box-open"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-zinc-200 text-center uppercase tracking-wide group-hover:text-sky-400 transition-colors">Giá Bể</span>
              </button>

              {/* Button 4: Thanh Khoản (Hoàn Tiền Vật Tư) */}
              <button 
                  onClick={() => window.dispatchEvent(new Event('openStaffReimbursementModal'))} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-white/[0.08] hover:border-rose-500/50 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Đề nghị hoàn tiền mua hộ vật tư xưởng"
              >
                  <div className="w-10 h-10 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(244,63,94,0.15)] transition-transform"><i className="fas fa-hand-holding-usd"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-zinc-200 text-center uppercase tracking-wide group-hover:text-rose-400 transition-colors">Thanh Khoản</span>
              </button>

              {/* Button 5: Nhập Kho */}
              <button 
                  onClick={() => {
                      window.pendingAction = 'createImportTicket';
                      window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { detail: { tab: 'import_export', trigger: 'triggerCreateImportTicket', data: { type: 'NHAP' }, mode: 'ERP' } }));
                  }} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-white/[0.08] hover:border-blue-500/50 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Tạo phiếu nhập kho vật tư / hàng hoá"
              >
                  <div className="w-10 h-10 rounded-xl bg-blue-500/15 border border-blue-500/30 text-blue-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(59,130,246,0.15)] transition-transform"><i className="fas fa-boxes"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-zinc-200 text-center uppercase tracking-wide group-hover:text-blue-400 transition-colors">Nhập Kho</span>
              </button>
              
              {/* Button 6: Tính Giá Cước */}
              <button 
                  onClick={() => window.dispatchEvent(new CustomEvent('openFreightModal'))} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-white/[0.08] hover:border-purple-500/50 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Tính cước phí vận chuyển"
              >
                  <div className="w-10 h-10 rounded-xl bg-purple-500/15 border border-purple-500/30 text-purple-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(168,85,247,0.15)] transition-transform"><i className="fas fa-truck-moving"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-zinc-200 text-center uppercase tracking-wide group-hover:text-purple-400 transition-colors">Tính Cước</span>
              </button>

              {/* Button 7: Chi Tiền Xưởng (Mở ngay tại Dashboard) */}
              <button 
                  onClick={() => window.dispatchEvent(new Event('openQuickExpenseModal'))} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-white/[0.08] hover:border-cyan-500/50 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Lập phiếu chi tiền xưởng nhanh"
              >
                  <div className="w-10 h-10 rounded-xl bg-cyan-500/15 border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(6,182,212,0.15)] transition-transform"><i className="fas fa-file-invoice-dollar"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-zinc-200 text-center uppercase tracking-wide group-hover:text-cyan-400 transition-colors">Chi Tiền</span>
              </button>

              {/* Button 8: Giá Layout */}
              <button 
                  onClick={() => window.dispatchEvent(new CustomEvent('openLayoutCalcModal'))} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-white/[0.08] hover:border-pink-500/50 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Định giá layout thuỷ sinh"
              >
                  <div className="w-10 h-10 rounded-xl bg-pink-500/15 border border-pink-500/30 text-pink-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(236,72,153,0.15)] transition-transform"><i className="fas fa-drafting-compass"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-zinc-200 text-center uppercase tracking-wide group-hover:text-pink-400 transition-colors">Giá Layout</span>
              </button>

              {/* Button 9: Phạt Nhanh (Ghi phạt trực tiếp vào bảng lương) */}
              <button 
                  onClick={() => window.dispatchEvent(new Event('openQuickPenaltyModal'))} 
                  className="bg-gradient-to-b from-[#18181f] to-[#121215] hover:from-[#20202a] hover:to-[#16161c] p-3 rounded-2xl border border-rose-900/40 hover:border-rose-500/60 flex flex-col items-center justify-center transition-all group active:scale-90 active:brightness-125 shadow-sm cursor-pointer"
                  title="Phạt vi phạm nhanh ghi nhận trực tiếp vào bảng lương"
              >
                  <div className="w-10 h-10 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 flex items-center justify-center text-base mb-1.5 group-hover:scale-110 shadow-[0_0_15px_rgba(244,63,94,0.15)] transition-transform"><i className="fas fa-gavel"></i></div>
                  <span className="text-[10px] sm:text-[11px] font-black text-rose-300 text-center uppercase tracking-wide group-hover:text-rose-400 transition-colors">Phạt Nhanh</span>
              </button>

          </div>
      </div>

      {/* 📋 BẢNG LỊCH SỬ BỊ TRỪ LƯƠNG TRONG THÁNG (CẬP NHẬT LIÊN TỤC) */}
      <MonthlyPenaltyLedger 
        bonusPenalty={erpData?.BonusPenalty || kpis || []}
        attendance={attendance || []}
        currentUser={currentUser}
        isAdmin={isSuperAdmin}
        isBoss={isBoss}
        pushDeltas={pushDeltas}
        triggerToast={triggerToast}
        allStaffNames={allStaffNames || []}
      />

      {/* KHUNG GIAO VIỆC / NHẮC VIỆC & NHIỆM VỤ CHUNG */}
      <DashboardTasksSection 
          importExport={(typeof importExport !== 'undefined' ? importExport : null) || erpData?.ImportExport || []}
          currentUser={currentUser} 
          pushDeltas={pushDeltas} 
          triggerToast={triggerToast} 
          isAdmin={isSuperAdmin} 
          isBoss={isBoss}
          userConfigs={userConfigs}
          reimbursements={reimbursements}
          products={(typeof erpProducts !== 'undefined' ? erpProducts : null) || erpData?.Products || []}
      />



      {/* 👥 ĐỘI NGŨ & CHẤM CÔNG HÔM NAY (HỢP NHẤT SIÊU GỌN GÀNG) */}
      <div className="bg-[#09090b] border border-[#27272a] rounded-xl p-3.5 sm:p-4 shadow-sm relative overflow-hidden">
        {/* Header */}
        <div className="flex items-center justify-between pb-2.5 border-b border-[#27272a]">
          <div className="flex items-center gap-2">
            <div className="w-6 h-6 rounded-md bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 text-[11px]">
              <i className="fas fa-users"></i>
            </div>
            <span className="font-black text-[12px] text-zinc-100 uppercase tracking-wider">
              Đội Ngũ & Chấm Công Hôm Nay ({rosterAndAttendance.workingCount}/{allStaffNames.length})
            </span>
          </div>

          <div className="flex items-center gap-2 text-[10px] font-bold">
            {rosterAndAttendance.unCheckedInCount > 0 && (
              <span className="text-rose-400 bg-rose-950/40 px-2 py-0.5 rounded border border-rose-800/40">
                {rosterAndAttendance.unCheckedInCount} chưa vào
              </span>
            )}
            {rosterAndAttendance.unCheckedOutCount > 0 && (
              <span className="text-amber-400 bg-amber-950/40 px-2 py-0.5 rounded border border-amber-800/40">
                {rosterAndAttendance.unCheckedOutCount} chưa ra
              </span>
            )}
          </div>
        </div>

        {/* Danh sách thẻ nhân sự: Họ tên, giờ vào, giờ ra */}
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 py-3">
          {rosterAndAttendance.staffRoster.filter(s => s.status !== 'LEAVE').map((st, i) => {
            const isWorking = st.status === 'WORKING';
            const isDone = st.status === 'CHECKED_OUT';
            const isMissingIn = st.status === 'UNCHECKED_IN';

            return (
              <div 
                key={i} 
                className={`flex flex-col justify-between p-2 rounded-lg border transition-colors ${
                  isWorking ? 'bg-[#12141a] border-blue-500/30' :
                  isDone ? 'bg-[#101412] border-emerald-500/20' :
                  'bg-[#140f10] border-rose-900/30 opacity-70'
                }`}
              >
                <div className="flex items-center justify-between gap-1">
                  <span className="text-[11px] font-bold text-zinc-200 truncate" title={st.name}>
                    {st.name}
                  </span>
                  <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${
                    isWorking ? 'bg-emerald-400' :
                    isDone ? 'bg-blue-400' :
                    'bg-rose-500'
                  }`}></span>
                </div>

                <div className="mt-1 flex items-center justify-between text-[9.5px] font-mono">
                  {isMissingIn ? (
                    <span className="text-rose-400 font-bold">Chưa vào</span>
                  ) : (
                    <>
                      <span className="text-emerald-400 font-bold" title="Giờ vào">
                        V: {st.inTime}
                      </span>
                      <span className={st.outTime ? 'text-zinc-300 font-bold' : 'text-amber-400 font-bold'} title="Giờ ra">
                        {st.outTime ? `R: ${st.outTime}` : 'Chưa ra'}
                      </span>
                    </>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        {/* 1 DÒNG BÁO AI XIN NGHỈ HÔM NAY NGAY DƯỚI */}
        <div className="pt-2.5 border-t border-[#1f1f23] flex items-center gap-2 flex-wrap text-[11px]">
          <span className="font-bold text-zinc-400 flex items-center gap-1 shrink-0">
            <i className="fas fa-umbrella-beach text-sky-400 text-[10px]"></i> Xin nghỉ hôm nay:
          </span>
          {rosterAndAttendance.leaveList.length === 0 ? (
            <span className="text-zinc-500 italic text-[10.5px]">
              Hôm nay không có nhân sự nào xin nghỉ (Đi làm đủ 100%).
            </span>
          ) : (
            <div className="flex items-center gap-1.5 flex-wrap">
              {rosterAndAttendance.leaveList.map((st, idx) => (
                <span key={idx} className="bg-sky-950/40 text-sky-300 border border-sky-800/50 text-[10px] font-bold px-2 py-0.5 rounded flex items-center gap-1">
                  <span className="text-white">{st.name}</span>
                  <span className="text-sky-400/90 text-[9px] font-normal">({st.reason})</span>
                </span>
              ))}
            </div>
          )}
        </div>
      </div>


      {/* NHẬT KÝ HOẠT ĐỘNG GẦN ĐÂY */}
      <div className="bg-[#09090b] border border-[#27272a] rounded-xl p-4 shadow-sm relative overflow-hidden">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 border-b border-[#27272a] pb-3">
          <div className="font-black text-[12px] text-zinc-100 uppercase tracking-widest flex items-center gap-2.5">
            <div className="w-6 h-6 rounded-md bg-zinc-800 text-zinc-400 border border-[#27272a] flex items-center justify-center">
                <i className="fas fa-list-ol text-[11px]"></i>
            </div>
            Hoạt động gần đây
          </div>
          <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="bg-[#121214] border border-[#27272a] text-zinc-300 text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded outline-none cursor-pointer focus:border-[#d4af37]/50 transition-colors">
            {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
          </select>
        </div>

        <div className="space-y-2.5 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
          {filteredLogs.length === 0 ? (
            <div className="text-center py-8 text-zinc-500 italic text-[11px] font-bold bg-[#121214] rounded-lg border border-[#27272a] border-dashed">Không có hoạt động nào được ghi nhận</div>
          ) : (
            filteredLogs.slice(0, 50).map((log, index) => {
              const style = getCategoryStyle(log.category);
              return (
                <div key={index} className="flex items-start gap-3.5 bg-[#121214] border border-[#27272a] rounded-lg px-3.5 py-3 transition-colors hover:border-[#3f3f46] group">
                  <div className="mt-0.5 text-[14px] w-6 shrink-0 flex items-center justify-center" style={{ color: style.color }}>{style.icon}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[12px] text-zinc-200 font-bold leading-tight flex items-center gap-2 flex-wrap">
                      {log.message}
                      {log.amount > 0 && <span className="text-emerald-400 font-black text-[10px] bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20 whitespace-nowrap">+{canSeeMoney ? log.amount.toLocaleString('vi-VN') + 'đ' : '******đ'}</span>}
                    </div>
                    <div className="flex items-center gap-2 mt-1.5 text-[10px] font-medium text-zinc-500">
                      <span className="font-mono bg-[#121214] px-1.5 rounded border border-[#27272a]">{log.time?.split(' ')[1]?.slice(0,5) || log.time?.slice(11,16)}</span>
                      {log.user && <span>• <span className="text-zinc-400 font-bold">{log.user}</span></span>}
                      <span>•</span>
                      <div className={`text-[9px] font-bold px-2 py-0.5 rounded ${style.bg}`} style={{ color: style.color }}>{log.category}</div>
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
});
</script>
