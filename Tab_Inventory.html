                                            )}
                                            {isBalanced ? (
                                                <span className="px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                                                    Đã cân bằng
                                                </span>
                                            ) : isDraft ? (
                                                <span className="px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-amber-500/15 text-amber-400 border border-amber-500/30">
                                                    Phiếu tạm
                                                </span>
                                            ) : (
                                                <span className="px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-zinc-500/15 text-zinc-400 border border-zinc-500/30">
                                                    Đã hủy
                                                </span>
                                            )}
                                        </div>
                                        <div className="w-6 h-6 rounded-lg bg-white/[0.04] flex items-center justify-center text-zinc-400 shrink-0">
                                            <i className={`fas fa-chevron-${isExp ? 'up text-[#d4af37]' : 'down text-zinc-500'} text-[11px]`}></i>
                                        </div>
                                    </div>

                                    {v.displayName && v.displayName !== v.id && (
                                        <div className="text-xs font-bold text-zinc-200">{v.displayName}</div>
                                    )}

                                    {v.categories?.length > 0 && (
                                        <div className="text-[10px] text-zinc-400 flex flex-wrap gap-1">
                                            {v.categories.map(c => (
                                                <span key={c} className="bg-white/[0.04] px-1.5 py-0.5 rounded text-[9.5px] text-zinc-300 border border-white/[0.04]">
                                                    🏷️ {c}
                                                </span>
                                            ))}
                                        </div>
                                    )}

                                    <div className="flex items-center justify-between text-[11px] text-zinc-400 pt-0.5">
                                        <span>{v.date ? v.date.slice(0, 16) : '--'}</span>
                                        <span className="font-semibold text-zinc-200 flex items-center gap-1">
                                            <i className="fas fa-user-check text-emerald-400 text-[10px]"></i>
                                            {v.checkedBy}
                                        </span>
                                    </div>

                                    {/* Metrics Grid */}
                                    <div className="grid grid-cols-4 gap-1.5 bg-[#09090b] p-2.5 rounded-xl border border-white/[0.04] text-center text-xs">
                                        <div>
                                            <div className="text-[9px] text-zinc-500 font-bold uppercase">Thực tế</div>
                                            <div className="font-mono font-black text-white text-[11px] truncate mt-0.5">
                                                {v.totalActualValue ? `${formatMoney(v.totalActualValue)}đ` : `${formatQty(v.totalActualQty)} SP`}
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-[9px] text-zinc-500 font-bold uppercase">Tổng chênh</div>
                                            <div className={`font-mono font-black text-[11px] mt-0.5 ${v.totalDiffQty >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                {v.totalDiffQty > 0 ? '+' : ''}{formatQty(v.totalDiffQty)}
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-[9px] text-zinc-500 font-bold uppercase">Tăng (+)</div>
                                            <div className="font-mono font-black text-[11px] text-emerald-400 mt-0.5">
                                                +{formatQty(v.totalDiffIncrease)}
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-[9px] text-zinc-500 font-bold uppercase">Giảm (-)</div>
                                            <div className="font-mono font-black text-[11px] text-rose-400 mt-0.5">
                                                {formatQty(v.totalDiffDecrease)}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Expanded Mobile Detail */}
                                {isExp && (
                                    <div className="pt-3 border-t border-white/[0.06] space-y-3 animate-fade-in pl-1.5">
                                        {/* Actions */}
                                        <div className="flex items-center gap-1.5 flex-wrap">
                                            {isDraft && (
                                                <>
                                                    <button 
                                                        onClick={() => handleBalanceDraft(v)}
                                                        className="flex-1 py-2 px-2.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-xl text-xs font-black flex items-center justify-center gap-1.5 shadow-sm transition-all"
                                                    >
                                                        <i className="fas fa-check-double text-[11px]"></i> Cân Bằng
                                                    </button>
                                                    <button 
                                                        onClick={() => {
                                                            setEditingVoucher(v);
                                                            setIsCreateModalOpen(true);
                                                        }}
                                                        className="py-2 px-3 bg-[#d4af37]/20 hover:bg-[#d4af37]/30 text-[#d4af37] border border-[#d4af37]/40 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition-all"
                                                    >
                                                        <i className="fas fa-edit text-[11px]"></i> Sửa
                                                    </button>
                                                </>
                                            )}
                                            <button 
                                                onClick={() => setPrintVoucher(v)}
                                                className="py-2 px-3 bg-white/[0.06] hover:bg-white/[0.12] text-zinc-200 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all"
                                            >
                                                <i className="fas fa-print text-emerald-400 text-[11px]"></i> In
                                            </button>
                                            <button 
                                                onClick={() => handleExportExcel(v)}
                                                className="py-2 px-3 bg-emerald-950/40 hover:bg-emerald-900/50 text-emerald-300 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all"
                                            >
                                                <i className="fas fa-file-excel text-[11px]"></i> Excel
                                            </button>
                                            <button 
                                                onClick={() => handleDeleteVoucher(v)}
                                                className="py-2 px-3 bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-black flex items-center gap-1.5 transition-all"
                                                title="Xóa phiếu kiểm kho"
                                            >
                                                <i className="fas fa-trash-alt text-[11px]"></i> Xóa
                                            </button>
                                        </div>

                                        {/* Mobile Diff Filter & SKU count */}
                                        <div className="flex items-center justify-between text-xs pt-1">
                                            <label className="flex items-center gap-1.5 text-zinc-300 cursor-pointer select-none">
                                                <input 
                                                    type="checkbox" 
                                                    checked={detailOnlyDiff} 
                                                    onChange={e => setDetailOnlyDiff(e.target.checked)}
                                                    className="rounded bg-[#09090b] border-white/20 text-[#d4af37] focus:ring-0 cursor-pointer w-3.5 h-3.5"
                                                />
                                                <span className="font-semibold text-[11px]">Chỉ xem hàng lệch ({v.diffItemsCount || (v.items || []).filter(x => Number(x.diffQty || 0) !== 0).length})</span>
                                            </label>
                                            <span className="text-zinc-500 text-[11px]">Tổng: <b className="text-zinc-200 font-mono">{v.totalItems || v.items?.length || 0}</b></span>
                                        </div>

                                        {/* Items List in Mobile */}
                                        <div className="space-y-1.5 max-h-60 overflow-y-auto custom-scrollbar">
                                            {filteredItems.length === 0 ? (
                                                <div className="text-center py-4 text-zinc-500 text-xs">Không có mặt hàng nào phù hợp bộ lọc.</div>
                                            ) : (
                                                filteredItems.map((it, idx) => (
                                                    <div key={idx} className="bg-[#09090b] p-2.5 rounded-xl border border-white/[0.04] text-xs flex items-center justify-between gap-2">
                                                        <div className="min-w-0 flex-1">
                                                            <div className="font-bold text-zinc-200 truncate">{it.name}</div>
                                                            <div className="text-[10px] text-zinc-400 flex items-center gap-1.5 mt-0.5">
                                                                <span className="font-mono text-cyan-400 font-bold">{it.sku}</span>
                                                                {it.category && <span className="text-zinc-500">• {it.category}</span>}
                                                            </div>
                                                        </div>
                                                        <div className="text-right shrink-0">
                                                            <div className="font-mono text-zinc-400 text-[10px]">Tồn: {formatQty(it.systemQty)} ➔ Thực: <b className="text-white">{formatQty(it.actualQty)}</b></div>
                                                            <div className={`font-mono font-bold text-xs mt-0.5 ${it.diffQty >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                                Lệch: {it.diffQty > 0 ? `+${formatQty(it.diffQty)}` : formatQty(it.diffQty)} ({formatMoney(it.diffAmount)}đ)
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    })
                )}
            </div>

            {/* Create / Edit StockTake Modal */}
            {isCreateModalOpen && (
                <CreateStockTakeModal 
                    onClose={() => {
                        setIsCreateModalOpen(false);
                        setEditingVoucher(null);
                    }}
                    onSave={handleSaveStockTake}
                    data={data}
                    userConfigs={userConfigs}
                    currentUser={currentUser}
                    initialVoucher={editingVoucher}
                />
            )}

            {/* Print StockTake Modal */}
            {printVoucher && (
                <PrintStockTakeModal 
                    voucher={printVoucher}
                    onClose={() => setPrintVoucher(null)}
                />
            )}
        </div>
    );
});

// 8. MAIN COMPONENT: INVENTORY TAB WRAPPER (InventoryTab)

    <div className="w-full max-w-full flex flex-col space-y-3.5 overflow-x-hidden">
      {/* ROYAL WORKBENCH SUB-TABS SEGMENTED CONTROL */}
      {/* TOP SUB-TABS (FOUR SEASONS SOLID MATTE) */}
      <div className="grid grid-cols-3 bg-[#202228] border-0 rounded-2xl p-1 shrink-0 gap-1 shadow-md max-w-full">
          <button 
              type="button"
              onClick={() => setActiveSubTab('KHO_HANG')} 
              className={`py-2.5 px-2.5 sm:px-3 text-[11px] font-bold uppercase tracking-wider transition-all rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 border-0 ${
                  activeSubTab === 'KHO_HANG' 
                      ? 'bg-[#282b33] text-white font-black shadow-none' 
                      : 'bg-transparent text-zinc-400 hover:text-white'
              }`}
          >
              <i className="fas fa-boxes text-xs text-[#2E9599]"></i>
              <span className="truncate">Kho Hàng</span>
          </button>
          
          <button 
              type="button"
              onClick={() => setActiveSubTab('NHAT_KY')} 
              className={`py-2.5 px-2.5 sm:px-3 text-[11px] font-bold uppercase tracking-wider transition-all rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 border-0 ${
                  activeSubTab === 'NHAT_KY' 
                      ? 'bg-[#282b33] text-white font-black shadow-none' 
                      : 'bg-transparent text-zinc-400 hover:text-white'
              }`}
          >
              <i className="fas fa-history text-xs text-[#F46C3F]"></i>
              <span className="truncate">Nhật Ký</span>
          </button>
          
          <button 
              type="button"
              onClick={() => setActiveSubTab('KIEM_KHO')} 
              className={`py-2.5 px-2.5 sm:px-3 text-[11px] font-bold uppercase tracking-wider transition-all rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 border-0 ${
                  activeSubTab === 'KIEM_KHO' 
                      ? 'bg-[#282b33] text-white font-black shadow-none' 
                      : 'bg-transparent text-zinc-400 hover:text-white'
              }`}
          >
              <i className="fas fa-clipboard-check text-xs text-[#F7DC68]"></i>
              <span className="truncate">Kiểm Kho</span>
          </button>
      </div>

      {/* TAB CONTENT */}
      <div className="flex-1 w-full animate-fade-in">
          {activeSubTab === 'KHO_HANG' && <InventoryListView {...props} />}
          {activeSubTab === 'NHAT_KY' && (typeof ImportExportTab !== 'undefined' ? <ImportExportTab {...props} mode="NHAT_KY" /> : <div className="text-white text-xs p-4">Đang tải Lịch sử kho...</div>)}
          {activeSubTab === 'KIEM_KHO' && <StockTakeKiotVietView {...props} />}
      </div>
    </div>
  );
});
</script>
