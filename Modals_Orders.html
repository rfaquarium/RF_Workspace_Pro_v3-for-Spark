    function printOrderInvoiceK58({ order, prods = [], accessories = [], erpProducts = [] }) {
        if (!order) return;
        let mainCode = order.orderCode || order.id || '';
        let trackingCode = order.shippingCode || '';
        if (!trackingCode && (mainCode.includes('MVĐ:') || mainCode.includes('|'))) {
            const parts = mainCode.split(/\|\s*MVĐ:\s*|\||MVĐ:\s*/i);
            mainCode = parts[0] || mainCode;
            trackingCode = parts[1] || '';
        } else if (trackingCode) {
            if (mainCode.includes(trackingCode)) mainCode = mainCode.replace(trackingCode, '');
            if (mainCode.includes('|')) mainCode = mainCode.split('|')[0];
            if (mainCode.includes('MVĐ:')) mainCode = mainCode.split('MVĐ:')[0];
        }
        mainCode = mainCode.replace(/[|/\\]+$/, '').trim();
        trackingCode = trackingCode.replace(/^MVĐ:\s*/i, '').trim();

        const itemsList = [];
        (prods || []).forEach(p => {
            let pPrice = Number(p.price || 0);
            if (!pPrice && Array.isArray(erpProducts)) {
                const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(p.name || p.type || '').trim().toLowerCase());
                if (match && Number(match.price)) pPrice = Number(match.price);
            }
            itemsList.push({ name: p.name || p.type || 'Sản phẩm xưởng', price: pPrice, qty: 1 });
        });
        (accessories || []).forEach(a => {
            let aPrice = Number(a.price || 0);
            if (!aPrice && Array.isArray(erpProducts)) {
                const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(a.name || '').trim().toLowerCase());
                if (match && Number(match.price)) aPrice = Number(match.price);
            }
            itemsList.push({ name: a.name || 'Phụ kiện', price: aPrice, qty: Number(a.quantity || 1) });
        });

        const totalQty = itemsList.reduce((sum, i) => sum + (i.qty || 1), 0);
        const knownSum = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
        const orderRevenue = Number(order.revenue || 0);
        if (knownSum === 0 && orderRevenue > 0 && totalQty > 0) {
            const avgUnitPrice = Math.round(orderRevenue / totalQty);
            itemsList.forEach(i => { if (!i.price) i.price = avgUnitPrice; });
        }

        const subtotal = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
        let discount = Number(order.discount || 0);
        if (subtotal > orderRevenue && discount === 0) {
            discount = subtotal - orderRevenue;
        }
        const prePaid = Number(order.prePaid || 0);
        const codRemain = Math.max(0, orderRevenue - prePaid);
        const createdTimeStr = order.createdAt ? new Date(order.createdAt).toLocaleString('vi-VN') : (order.date || new Date().toLocaleString('vi-VN'));

        let itemsHtml = itemsList.map(it => `
            <div style="margin-bottom: 4px; padding-bottom: 3px; border-bottom: 0.5px dotted #ccc;">
                <div style="font-weight: 700; word-break: break-word; line-height: 1.25; font-size: 11px;">${it.name}</div>
                <div style="display: flex; justify-content: space-between; font-size: 10.5px; color: #111; margin-top: 1px;">
                    <span>${it.qty} x ${it.price > 0 ? it.price.toLocaleString('vi-VN') + 'đ' : '---'}</span>
                    <span style="font-weight: 700;">${it.price > 0 ? (it.price * it.qty).toLocaleString('vi-VN') + 'đ' : '---'}</span>
                </div>
            </div>
        `).join('');

        const printContent = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <title>In Hoá Đơn K58 - ${mainCode}</title>
                <style>
                    @page { margin: 0; size: 58mm auto; }
                    body {
                        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                        width: 58mm;
                        margin: 0 auto;
                        padding: 8px 6px;
                        font-size: 11px;
                        color: #000;
                        line-height: 1.35;
                        box-sizing: border-box;
                        background: #fff;
                        -webkit-print-color-adjust: exact;
                    }
                    .text-center { text-align: center; }
                    .text-right { text-align: right; }
                    .bold { font-weight: 800; }
                    .border-dashed { border-bottom: 1px dashed #000; margin: 6px 0; }
                    .title { font-size: 15px; font-weight: 900; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
                    .sub-title { font-size: 9px; color: #333; margin-bottom: 3px; }
                    .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
                    .info-label { font-size: 10px; color: #444; }
                    .info-val { font-weight: 700; word-break: break-word; text-align: right; max-width: 65%; }
                </style>
            </head>
            <body>
                <div class="text-center bold title">RF AQUARIUM</div>
                <div class="text-center sub-title">30 Lương Thế Vinh, Thống Nhất, Phú Thọ</div>
                <div class="border-dashed"></div>
                <div class="text-center bold" style="font-size: 13px; margin: 3px 0; text-transform: uppercase;">HÓA ĐƠN BÁN LẺ</div>
                <div class="border-dashed"></div>
                <div class="row"><span class="info-label">Số HĐ:</span><span class="info-val">${mainCode}</span></div>
                ${trackingCode ? `<div class="row"><span class="info-label">Mã VĐ:</span><span class="info-val">${trackingCode}</span></div>` : ''}
                <div class="row"><span class="info-label">ĐVVC:</span><span class="info-val">${order.shippingMethod || order.carrier || (order.channel?.includes('Shopee') ? 'SHOPEE' : 'BÁN LẺ')}</span></div>
                <div class="row"><span class="info-label">Kênh bán:</span><span class="info-val">${order.channel || 'RF Aquarium'}</span></div>
                ${(order.responsibleUser || order.updatedBy) ? `<div class="row"><span class="info-label">NV bán:</span><span class="info-val bold">${order.responsibleUser || order.updatedBy}</span></div>` : ''}
                <div class="row"><span class="info-label">Khách hàng:</span><span class="info-val">${order.customer || 'Khách lẻ'}</span></div>
                ${order.phone ? `<div class="row"><span class="info-label">Điện thoại:</span><span class="info-val">${order.phone}</span></div>` : ''}
                ${order.address ? `<div class="row" style="align-items: flex-start;"><span class="info-label" style="flex-shrink:0;">Địa chỉ:</span><span class="info-val" style="font-size:10px;">${order.address}</span></div>` : ''}
                <div class="row"><span class="info-label">Thời gian:</span><span class="info-val" style="font-size:10px;">${createdTimeStr}</span></div>
                
                <div class="border-dashed"></div>
                <div style="font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px;">Chi tiết sản phẩm</div>
                ${itemsHtml || '<div style="text-align:center; color:#666;">Không có mặt hàng</div>'}
                
                <div class="border-dashed"></div>
                <div class="row"><span>Tổng tiền hàng:</span><span class="bold">${subtotal.toLocaleString('vi-VN')}đ</span></div>
                ${discount > 0 ? `<div class="row"><span>Giảm giá:</span><span>-${discount.toLocaleString('vi-VN')}đ</span></div>` : ''}
                <div class="row" style="font-size: 12px; margin-top: 2px;">
                    <span class="bold">TỔNG THANH TOÁN:</span>
                    <span class="bold" style="font-size: 13px;">${orderRevenue.toLocaleString('vi-VN')}đ</span>
                </div>
                ${prePaid > 0 ? `<div class="row"><span>Đã thanh toán:</span><span class="bold">${prePaid.toLocaleString('vi-VN')}đ</span></div>` : ''}
                <div class="row" style="margin-top: 2px;">
                    <span class="bold">THU TIỀN (COD):</span>
                    <span class="bold" style="font-size: 12px; color: ${codRemain > 0 ? '#000' : '#444'};">${codRemain.toLocaleString('vi-VN')}đ</span>
                </div>
                
                ${order.note ? `
                    <div class="border-dashed"></div>
                    <div style="font-size: 10px;"><span class="bold">Ghi chú:</span> ${order.note}</div>
                ` : ''}
                
                <div class="border-dashed"></div>
                <div class="text-center" style="font-size: 10px; font-style: italic; margin-top: 6px;">
                    Cảm ơn quý khách đã tin tưởng & ủng hộ!<br>
                    🐠 RF AQUARIUM ✨
                </div>
            </body>
            </html>
        `;
        const win = window.open('', '_blank');
        if (win) {
            win.document.write(printContent);
            win.document.close();
            win.focus();
            setTimeout(() => { win.print(); win.close(); }, 600);
        } else {
            alert('Trình duyệt đang chặn cửa sổ bật lên. Vui lòng cho phép popup để in hoá đơn K58!');
        }
    }

    // ==========================================
    // COMPONENT XEM / TẠO ẢNH HOÁ ĐƠN BÁN LẺ & IN PHIẾU K58
    // ==========================================
    function OrderInvoiceModal({ order, prods, accessories, erpProducts, onClose, triggerToast }) {
        const [receiptImageUrl, setReceiptImageUrl] = React.useState('');
        const [isGeneratingImg, setIsGeneratingImg] = React.useState(false);
        const printRef = React.useRef();

        if (!order) return null;

        let mainCode = order.orderCode || order.id || '';
        let trackingCode = order.shippingCode || '';
        if (!trackingCode && (mainCode.includes('MVĐ:') || mainCode.includes('|'))) {
            const parts = mainCode.split(/\|\s*MVĐ:\s*|\||MVĐ:\s*/i);
            mainCode = parts[0] || mainCode;
            trackingCode = parts[1] || '';
        } else if (trackingCode) {
            if (mainCode.includes(trackingCode)) mainCode = mainCode.replace(trackingCode, '');
            if (mainCode.includes('|')) mainCode = mainCode.split('|')[0];
            if (mainCode.includes('MVĐ:')) mainCode = mainCode.split('MVĐ:')[0];
        }
        mainCode = mainCode.replace(/[|/\\]+$/, '').trim();
        trackingCode = trackingCode.replace(/^MVĐ:\s*/i, '').trim();

        const generateReceiptCanvas = React.useCallback(() => {
            setIsGeneratingImg(true);
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 380;
                
                const itemsList = [];
                (prods || []).forEach(p => {
                    let pPrice = Number(p.price || 0);
                    if (!pPrice && Array.isArray(erpProducts)) {
                        const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(p.name || p.type || '').trim().toLowerCase());
                        if (match && Number(match.price)) pPrice = Number(match.price);
                    }
                    itemsList.push({ name: p.name || p.type || 'Sản phẩm', price: pPrice, qty: 1 });
                });
                (accessories || []).forEach(a => {
                    let aPrice = Number(a.price || 0);
                    if (!aPrice && Array.isArray(erpProducts)) {
                        const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(a.name || '').trim().toLowerCase());
                        if (match && Number(match.price)) aPrice = Number(match.price);
                    }
                    itemsList.push({ name: a.name || 'Phụ kiện', price: aPrice, qty: Number(a.quantity || 1) });
                });

                // Phân bổ giá bán thông minh từ Tổng Doanh Thu nếu chưa có đơn giá riêng lẻ
                const totalQty = itemsList.reduce((sum, i) => sum + (i.qty || 1), 0);
                const knownSum = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
                const orderRevenue = Number(order.revenue || 0);
                if (knownSum === 0 && orderRevenue > 0 && totalQty > 0) {
                    const avgUnitPrice = Math.round(orderRevenue / totalQty);
                    itemsList.forEach(i => { if (!i.price) i.price = avgUnitPrice; });
                }

                // Tính toán chiều cao linh hoạt
                let estimatedHeight = 340;
                ctx.font = '12px Arial, sans-serif';
                itemsList.forEach(item => {
                    const words = item.name.split(' ');
                    let line = '';
                    let lineCount = 1;
                    for (let w = 0; w < words.length; w++) {
                        if (ctx.measureText(line + words[w] + ' ').width > 200) {
                            lineCount++;
                            line = words[w] + ' ';
                        } else {
                            line += words[w] + ' ';
                        }
                    }
                    estimatedHeight += (lineCount * 18) + 16;
                });

                const noteText = order.note || '';
                if (noteText) {
                    estimatedHeight += Math.ceil(noteText.length / 32) * 18 + 10;
                }

                canvas.width = width;
                canvas.height = Math.max(500, Math.min(1600, estimatedHeight));

                // Nền trắng
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let y = 35;
                ctx.fillStyle = '#000000';
                
                // Tiêu đề HÓA ĐƠN BÁN LẺ
                ctx.textAlign = 'center';
                ctx.font = 'bold 22px "Courier New", monospace, Arial';
                ctx.fillText('HÓA ĐƠN BÁN LẺ', width / 2, y);
                y += 30;

                // Các dòng thông tin đơn hàng
                ctx.textAlign = 'left';
                ctx.font = '12px Arial, sans-serif';

                const drawInfoLine = (label, val) => {
                    if (!val && val !== 0 && val !== '0') return;
                    ctx.font = 'bold 12px Arial, sans-serif';
                    ctx.fillText(label, 15, y);
                    const labelWidth = ctx.measureText(label).width;
                    ctx.font = '12px Arial, sans-serif';
                    
                    const maxValW = width - 30 - labelWidth;
                    const valStr = String(val);
                    if (ctx.measureText(valStr).width > maxValW) {
                        const words = valStr.split(' ');
                        let line = '';
                        let isFirst = true;
                        for (let w = 0; w < words.length; w++) {
                            if (ctx.measureText(line + words[w] + ' ').width > maxValW) {
                                ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                                y += 18;
                                line = words[w] + ' ';
                                isFirst = false;
                            } else {
                                line += words[w] + ' ';
                            }
                        }
                        if (line.trim()) {
                            ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                            y += 18;
                        }
                    } else {
                        ctx.fillText(valStr, 15 + labelWidth, y);
                        y += 18;
                    }
                };

                drawInfoLine('Số HĐ: ', mainCode);
                drawInfoLine('ĐVVC: ', order.shippingMethod || order.carrier || (order.channel?.includes('Shopee') ? 'SHOPEE' : 'BÁN LẺ'));
                drawInfoLine('Kênh bán: ', order.channel || 'RF Aquarium');
                if (order.responsibleUser || order.updatedBy) drawInfoLine('NV bán: ', order.responsibleUser || order.updatedBy);
                drawInfoLine('Khách hàng: ', order.customer || 'Khách lẻ');
                if (order.phone) drawInfoLine('Số điện thoại: ', order.phone);
                if (order.note) drawInfoLine('Ghi chú: ', order.note);

                // Đường kẻ phân cách
                y += 5;
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 18;

                // Tiêu đề bảng hàng hóa
                ctx.font = 'bold 12px Arial, sans-serif';
                ctx.fillText('Tên hàng hóa', 15, y);
                ctx.textAlign = 'right';
                ctx.fillText('Đ. giá', 300, y);
                ctx.fillText('SL', 365, y);
                y += 14;

                ctx.textAlign = 'left';
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 18;

                // In từng dòng sản phẩm
                itemsList.forEach(item => {
                    ctx.font = 'bold 12px Arial, sans-serif';
                    const words = item.name.split(' ');
                    let line = '';
                    let startY = y;
                    for (let w = 0; w < words.length; w++) {
                        if (ctx.measureText(line + words[w] + ' ').width > 220) {
                            ctx.fillText(line.trim(), 15, y);
                            y += 18;
                            line = words[w] + ' ';
                        } else {
                            line += words[w] + ' ';
                        }
                    }
                    if (line.trim()) {
                        ctx.fillText(line.trim(), 15, y);
                    }

                    // Giá & SL
                    ctx.font = '12px Arial, sans-serif';
                    ctx.textAlign = 'right';
                    const priceText = item.price > 0 ? item.price.toLocaleString('vi-VN') : '---';
                    ctx.fillText(priceText, 300, y);
                    ctx.fillText(String(item.qty), 365, y);

                    ctx.textAlign = 'left';
                    y += 22;
                });

                // Đường kẻ phân cách
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 22;

                // Khung tổng tiền
                const drawTotalRow = (label, valStr, isBold = false) => {
                    ctx.font = isBold ? 'bold 13px Arial, sans-serif' : '12px Arial, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(label, 15, y);
                    ctx.textAlign = 'right';
                    ctx.fillText(valStr, 365, y);
                    y += 22;
                };

                const subtotal = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
                const orderDiscount = Number(order.discount || 0);
                let calculatedDiscount = orderDiscount;
                if (subtotal > orderRevenue && orderDiscount === 0) {
                    calculatedDiscount = subtotal - orderRevenue;
                }

                const subtotalStr = subtotal.toLocaleString('vi-VN');
                const discountStr = calculatedDiscount > 0 ? calculatedDiscount.toLocaleString('vi-VN') : '0';
                const revStr = orderRevenue.toLocaleString('vi-VN');
                const paidStr = Number(order.prePaid || 0) > 0 ? Number(order.prePaid).toLocaleString('vi-VN') : '---';
                const createdTimeStr = order.createdAt || order.date || new Date().toLocaleString('vi-VN');

                drawTotalRow('Tổng tiền hàng:', subtotalStr, true);
                drawTotalRow('Giảm giá:', discountStr);
                drawTotalRow('Tổng thanh toán:', revStr, true);
                drawTotalRow('Đã thanh toán:', paidStr);
                drawTotalRow('Thời gian tạo:', createdTimeStr);

                // Đường kẻ kéo cắt ở cuối
                y += 5;
                ctx.font = '12px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('✂--------------------------------------------------', 10, y);

                const dataUrl = canvas.toDataURL('image/png');
                // Giải phóng ngay lập tức GPU/RAM buffer của canvas
                canvas.width = 1;
                canvas.height = 1;
                setReceiptImageUrl(dataUrl);
            } catch (err) {
                console.error("Lỗi tạo ảnh hoá đơn:", err);

                setIsGeneratingImg(false);
            }

    // MODAL TRUY VẾT & GÁN HIỆN VẬT XUẤT KHO (SERIAL BỂ KÍNH & KCS LAYOUT)
    // =========================================================================
    function ModalAssignStockItem({
        targetItem, order, erpData, prodItems = [], onClose, pushDeltas, triggerToast, setOptimisticOrder, prods = [], currentUser
    }) {
        const [processing, setProcessing] = React.useState(false);
        const [serialInput, setSerialInput] = React.useState('');
        const [selectedLayoutId, setSelectedLayoutId] = React.useState(null);
        const [stockItems, setStockItems] = React.useState([]);
        const [isLoading, setIsLoading] = React.useState(true);

        const itemName = targetItem?.name || '';
        const isGlass = /bể|kính|terarium|bán cạn|betta/i.test(itemName || targetItem?.type || '');

        // Lấy danh sách hàng tồn khả dụng
        React.useEffect(() => {
            let isMounted = true;
            setIsLoading(true);

            // 1. Quét từ local CSDL trước để hiện tức thì
            const allProds = erpData?.Production || prodItems || [];
            const cleanTargetName = String(itemName).trim().toLowerCase().replace(/[\u2010-\u2015\u2212-]/g, '-').replace(/\s+/g, ' ');
            
            const localMatches = allProds.filter(p => {
                if (!p) return false;
                const pUsed = String(p.usedByOrderCode || '').trim();
                if (pUsed) return false; // Đã bị đơn khác gán
                const pStatus = String(p.status || '').toUpperCase().trim();
                const isDone = pStatus === 'DONE' || pStatus === 'ĐÃ XONG' || pStatus === 'HOÀN KHO ĐẠT' || p.p1_status === 'Done';
                if (!isDone) return false;
                const pName = String(p.name || '').trim().toLowerCase().replace(/[\u2010-\u2015\u2212-]/g, '-').replace(/\s+/g, ' ');
                return pName === cleanTargetName || pName.includes(cleanTargetName) || cleanTargetName.includes(pName);
            }).map(p => {
                let sCode = p.serialCode || '';
                if (!sCode && isGlass) {
                    const numOnly = String(p.id || '').replace(/\D/g, '');
                    sCode = '#' + (numOnly.length >= 4 ? numOnly.slice(-4) : (p.id || '0000').slice(-4));
                }
                return {
                    id: p.id,
                    name: p.name,
                    serialCode: sCode,
                    p1_user: p.phases?.phase1?.user || p.p1_user || '',
                    p1_name: p.phases?.phase1?.name || (isGlass ? 'Cắt Dán' : 'Dựng Khung'),
                    p2_user: p.phases?.phase2?.user || p.p2_user || '',
                    p2_name: p.phases?.phase2?.name || (isGlass ? 'Gọt Keo' : 'Gia Cố'),
                    p1_photo: p.phases?.phase1?.photo || p.p1_photo || '',
                    p2_photo: p.phases?.phase2?.photo || p.p2_photo || '',
                    qc_front_photo: p.qc_front_photo || p.phases?.phase2?.photo || p.p2_photo || p.phases?.phase1?.photo || '',
                    date: p.phases?.phase2?.date || p.phases?.phase1?.date || p.deadline || ''
                };
            });

            setStockItems(localMatches);
            setIsLoading(false);

            // 2. Đồng thời gọi backend để lấy dữ liệu realtime mới nhất
            if (typeof window.runGAS === 'function') {
                window.runGAS('getAvailableStockItems', { sku: itemName, type: isGlass ? 'Bể Kính' : 'Layout' })
                    .then(res => {
                        if (isMounted && res && res.success && Array.isArray(res.items) && res.items.length > 0) {
                            setStockItems(res.items);
                        }
                    })
                    .catch(() => {});
            }

            return () => { isMounted = false; };
        }, [itemName, isGlass, erpData?.Production, prodItems]);

        // Xử lý xác nhận xuất kho
        const handleConfirmAssign = async () => {
            let targetStock = null;
            let targetSerial = '';

            if (isGlass) {
                const cleanInput = serialInput.trim().toUpperCase().replace(/^#/, '');
                if (!cleanInput) {
                    triggerToast('Vui lòng nhập 4 số dưới đáy bể hoặc chọn mã có sẵn!', 'fa-exclamation-triangle', 'warning');
                    return;
                }
                targetSerial = '#' + cleanInput;
                targetStock = stockItems.find(s => String(s.serialCode || '').toUpperCase().replace(/^#/, '') === cleanInput);
                if (!targetStock) {
                    // Tạo một object đại diện nếu người dùng nhập mã thực tế trên đáy bể mà chưa có trong danh sách
                    targetStock = {
                        id: 'PROD_STOCK_' + cleanInput,
                        name: itemName,
                        serialCode: targetSerial,
                        p1_user: 'Thợ Dán (Đáy ' + targetSerial + ')',
                        p2_user: 'Thợ Gọt (Đáy ' + targetSerial + ')'
                    };
                }
            } else {
                if (!selectedLayoutId) {
                    triggerToast('Vui lòng chạm chọn 1 ảnh KCS giống nhất với layout trên tay!', 'fa-exclamation-triangle', 'warning');
                    return;
                }
                targetStock = stockItems.find(s => s.id === selectedLayoutId);
                if (!targetStock) return;
            }

            setProcessing(true);
            try {
                const orderCode = order.orderCode || order.id;
                
                // Gọi API backend khóa lệnh tồn
                if (typeof window.runGAS === 'function') {
                    window.runGAS('assignStockItemToOrder', {
                        prodId: targetStock.id,
                        orderCode: orderCode,
                        serialCode: targetSerial || targetStock.serialCode || ''
                    }).catch(console.error);
                }

                // Cập nhật Optimistic UI cho client ngay lập tức
                const updatedProds = (prods || []).map(p => {
                    if (p.id === targetItem.id || String(p.name).trim().toLowerCase() === String(targetItem.name).trim().toLowerCase()) {
                        return {
                            ...p,
                            serialCode: targetSerial || targetStock.serialCode || '',
                            p1_user: targetStock.p1_user,
                            p2_user: targetStock.p2_user,
                            p1_photo: targetStock.p1_photo,
                            p2_photo: targetStock.p2_photo,
                            qc_front_photo: targetStock.qc_front_photo,
                            usedStockId: targetStock.id,
                            phases: {
                                ...(p.phases || {}),
                                phase1: { ...(p.phases?.phase1 || {}), user: targetStock.p1_user, photo: targetStock.p1_photo, status: 'Done' },
                                phase2: { ...(p.phases?.phase2 || {}), user: targetStock.p2_user, photo: targetStock.p2_photo, status: 'Done' }
                            },
                            _origin: {
                                p1User: targetStock.p1_user,
                                p2User: targetStock.p2_user,
                                p1Name: isGlass ? 'Cắt Dán' : 'Dựng Khung',
                                p2Name: isGlass ? 'Gọt Keo' : 'Gia Cố',
                                serialCode: targetSerial || targetStock.serialCode || '',
                                photo: targetStock.qc_front_photo || targetStock.p2_photo || ''
                            }
                        };
                    }
                    return p;
                });

                // Cập nhật bản ghi Production tồn trong client nếu có
                const updatedStockProd = {
                    ...targetStock,
                    usedByOrderCode: orderCode,
                    usedAt: new Date().toISOString()
                };

                await pushDeltas({
                    prodItems: [
                        ...updatedProds.filter(p => p.id === targetItem.id),
                        updatedStockProd
                    ]
                }, isGlass ? `Đã xác nhận xuất bể Serial ${targetSerial || targetStock.serialCode}!` : `Đã xác nhận xuất layout khớp KCS!`, 'fa-check');

                triggerToast(isGlass ? `Đã gắn mã đáy bể ${targetSerial || targetStock.serialCode} vào đơn!` : `Đã gắn layout KCS của thợ ${targetStock.p1_user} vào đơn!`, 'fa-check-circle', 'success');
                onClose();
            } catch (err) {
                triggerToast('Lỗi gán hiện vật: ' + err.toString(), 'fa-times', 'danger');
            } finally {
                setProcessing(false);
            }
        };

        // NÚT CỨU NGUY: KHÔNG TÌM THẤY HIỆN VẬT TRÊN KỆ (BỊ VỠ/MẤT -> CHUYỂN SẢN XUẤT MỚI)
        const handleReportMissingItem = async () => {
            const confirmMsg = `⚠️ BÁO CÁO THẤT LẠC / HỎNG HIỆN VẬT TRÊN KỆ:\n\nBạn xác nhận không tìm thấy sản phẩm [${itemName}] trên kệ kho (hoặc bị vỡ/hỏng)?\n\nHệ thống sẽ hủy trạng thái xuất kho có sẵn và chuyển đơn hàng [${order.orderCode || order.id}] về mục "CHỜ SẢN XUẤT MỚI" để xưởng dán/dựng lại ngay lập tức.`;
            if (!window.confirm(confirmMsg)) return;

            setProcessing(true);
            try {
                const nowTimeStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                const currentNote = String(order.note || '');
                const missingNote = `[Kho báo mất/vỡ hiện vật kệ lúc ${nowTimeStr} - Yêu cầu xưởng sản xuất mới]`;
                const updatedOrder = {
                    ...order,
                    status: 'Chờ Sản Xuất',
                    note: currentNote ? `${missingNote} | ${currentNote}` : missingNote
                };

                const isGlassItem = /bể|hồ|tank|be |ho /i.test(String(targetItem.name || ''));
                const updatedTargetProd = {
                    ...targetItem,
                    status: 'Pending',
                    fulfilledFromStock: false,
                    p1_status: 'Pending',
                    p2_status: 'Pending',
                    p1_user: '',
                    p2_user: '',
                    p1_start: '',
                    p1_endTime: '',
                    p1_photo: '',
                    p1_reward_vnd: 0,
                    p2_start: '',
                    p2_endTime: '',
                    p2_photo: '',
                    p2_reward_vnd: 0,
                    phases: {
                        phase1: { name: (isGlassItem ? 'Cắt Dán' : 'Dựng Khung'), status: 'Pending', user: '', start: '', endTime: '', photo: '', reward_vnd: 0 },
                        phase2: { name: (isGlassItem ? 'Gọt Keo' : 'Gia Cố'), status: 'Pending', user: '', start: '', endTime: '', photo: '', reward_vnd: 0 }
                    },
                    qc_status: '',
                    qc_front_photo: '',
                    qc_side_photo: '',
                    qc_note: '',
                    serialCode: '',
                    usedByOrderCode: '',
                    usedAt: '',
                    note: `Yêu cầu làm mới do hiện vật kệ thất lạc/hỏng`
                };

                if (setOptimisticOrder) setOptimisticOrder(updatedOrder);

                await pushDeltas({
                    orders: [updatedOrder],
                    prodItems: [updatedTargetProd]
                }, 'Đã chuyển đơn sang Chờ Sản Xuất Mới!', 'fa-recycle');

                triggerToast(`Đã chuyển đơn ${order.orderCode || order.id} về Chờ Sản Xuất Mới!`, 'fa-undo', 'warning');
                onClose();
            } catch (e) {
                triggerToast('Lỗi cập nhật: ' + e.toString(), 'fa-times', 'danger');
            } finally {
                setProcessing(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[999999] bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 animate-fade-in select-none" onClick={onClose}>
                <div className="bg-[#121214] border border-white/[0.15] rounded-3xl p-4 sm:p-6 max-w-lg w-full shadow-[0_0_50px_rgba(0,0,0,0.8)] space-y-4 max-h-[92vh] flex flex-col relative" onClick={e => e.stopPropagation()}>
                    
                    {/* HEADER */}
                    <div className="flex items-start justify-between border-b border-white/[0.08] pb-3 shrink-0">
                        <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 border ${isGlass ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`}>
                                <i className={`fas ${isGlass ? 'fa-barcode text-lg' : 'fa-camera-retro text-lg'}`}></i>
                            </div>
                            <div className="min-w-0">
                                <h3 className="text-sm sm:text-base font-black uppercase text-white tracking-wider truncate">
                                    {isGlass ? 'Xác Thực Mã Serial Đáy Bể' : 'Chọn Layout Khớp Ảnh KCS Kho'}
                                </h3>
                                <p className="text-[10.5px] text-zinc-400 truncate mt-0.5">
                                    Đơn: <span className="font-mono text-amber-400 font-bold">{order.orderCode || order.id}</span> • {itemName}
                                </p>
                            </div>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer shrink-0">
                            <i className="fas fa-times text-xs"></i>
                        </button>
                    </div>

                    {/* BODY CONTENT */}
                    <div className="flex-1 overflow-y-auto space-y-4 pr-1 min-h-0">
                        {isGlass ? (
                            /* ===== GIAO DIỆN BỂ KÍNH (SERIAL CODE) ===== */
                            <div className="space-y-4">
                                <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-2xl text-amber-200 text-xs leading-relaxed flex items-start gap-2.5">
                                    <i className="fas fa-info-circle text-amber-400 text-sm mt-0.5 shrink-0"></i>
                                    <div>
                                        Nhấc chiếc bể kính trên tay, kiểm tra <b>4 số viết bằng bút lông ở góc đáy bể</b> và nhập vào ô bên dưới (hoặc bấm chọn nhanh từ danh sách kho có sẵn):
                                    </div>
                                </div>

                                {/* INPUT NHẬP 4 SỐ ĐÁY BỂ */}
                                <div className="space-y-1.5 text-center">
                                    <label className="text-[11px] font-black uppercase text-zinc-300 tracking-wider">
                                        Nhập 4 Số Dưới Đáy Bể
                                    </label>
                                    <div className="relative max-w-xs mx-auto">
                                        <input
                                            type="text"
                                            value={serialInput}
                                            onChange={(e) => {
                                                const val = e.target.value.replace(/[^0-9A-Za-z#]/g, '').toUpperCase();
                                                setSerialInput(val.startsWith('#') ? val : (val ? '#' + val : ''));
                                            }}
                                            placeholder="#____"
                                            maxLength={6}
                                            autoFocus
                                            className="w-full text-center text-3xl font-black font-mono tracking-widest py-3 px-4 bg-[#18181b] border-2 border-amber-400/60 focus:border-amber-400 rounded-2xl text-white outline-none shadow-inner transition-colors placeholder:text-zinc-600"
                                        />
                                    </div>
                                </div>

                                {/* DANH SÁCH MÃ SERIAL CÓ SẴN TRONG KHO */}
                                <div className="space-y-2 pt-2 border-t border-white/[0.06]">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">
                                            Mã Serial Khả Dụng Trong Kho ({stockItems.length})
                                        </span>
                                        {isLoading && <i className="fas fa-spinner fa-spin text-zinc-500 text-xs"></i>}
                                    </div>

                                    {stockItems.length === 0 ? (
                                        <div className="text-center py-4 text-xs text-zinc-500 bg-[#16161a] rounded-xl border border-white/[0.04]">
                                            Chưa quét thấy mã serial nào của SKU này trong kho. Bạn có thể tự gõ 4 số trực tiếp từ đáy bể.
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
                                            {stockItems.map((item, sIdx) => {
                                                const isSel = serialInput && item.serialCode && serialInput.replace(/^#/, '') === String(item.serialCode).replace(/^#/, '');
                                                return (
                                                    <div
                                                        key={item.id || sIdx}
                                                        onClick={() => setSerialInput(item.serialCode || '')}
                                                        className={`p-2.5 rounded-xl border cursor-pointer transition-all flex items-center justify-between gap-2 ${
                                                            isSel
                                                                ? 'bg-amber-500/20 border-amber-400 text-white shadow-md ring-1 ring-amber-400'
                                                                : 'bg-[#18181b] border-white/[0.06] hover:border-amber-400/50 text-zinc-300'
                                                        }`}
                                                    >
                                                        <div className="min-w-0">
                                                            <div className="font-mono font-black text-sm text-amber-300 flex items-center gap-1.5">
                                                                <i className="fas fa-barcode text-xs opacity-70"></i>
                                                                <span>{item.serialCode}</span>
                                                            </div>
                                                            <div className="text-[10px] text-zinc-400 truncate mt-0.5">
                                                                Dán: <b className="text-zinc-200">{item.p1_user?.split(' ').pop() || 'Dương'}</b> • Gọt: <b className="text-zinc-200">{item.p2_user?.split(' ').pop() || 'Dương'}</b>
                                                            </div>
                                                        </div>
                                                        {isSel && <i className="fas fa-check-circle text-amber-400 text-sm shrink-0"></i>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            /* ===== GIAO DIỆN LAYOUT (VISUAL MATCHING KCS PHOTO) ===== */
                            <div className="space-y-3">
                                <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl text-emerald-200 text-xs leading-relaxed flex items-start gap-2.5">
                                    <i className="fas fa-hand-sparkles text-emerald-400 text-sm mt-0.5 shrink-0"></i>
                                    <div>
                                        Layout là độc bản! Cầm cây layout trên tay, đối chiếu và <b>chạm chọn ảnh KCS giống nhất</b> trong kho bên dưới:
                                    </div>
                                </div>

                                {stockItems.length === 0 ? (
                                    <div className="text-center py-8 text-xs text-zinc-500 bg-[#16161a] rounded-2xl border border-white/[0.04] space-y-2">
                                        <i className="fas fa-images text-2xl text-zinc-600 block"></i>
                                        <span>Kho chưa có ảnh KCS lưu sẵn cho SKU này.</span>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-72 overflow-y-auto pr-1">
                                        {stockItems.map((stk, lIdx) => {
                                            const isSelected = selectedLayoutId === stk.id;
                                            const img = stk.qc_front_photo || stk.p2_photo || stk.p1_photo;
                                            return (
                                                <div
                                                    key={stk.id || lIdx}
                                                    onClick={() => setSelectedLayoutId(stk.id)}
                                                    className={`group relative rounded-2xl overflow-hidden border cursor-pointer transition-all flex flex-col ${
                                                        isSelected
                                                            ? 'border-emerald-400 ring-2 ring-emerald-400 bg-emerald-950/30 shadow-lg shadow-emerald-950/50'
                                                            : 'border-white/[0.08] hover:border-white/[0.2] bg-[#18181b]'
                                                    }`}
                                                >
                                                    <div className="relative w-full h-28 sm:h-32 bg-zinc-950 flex items-center justify-center overflow-hidden">
                                                        {img ? (
                                                            <img
                                                                src={img}
                                                                alt="KCS"
                                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                                                loading="lazy"
                                                            />
                                                        ) : (
                                                            <i className="fas fa-cube text-zinc-700 text-2xl"></i>
                                                        )}
                                                        {isSelected && (
                                                            <div className="absolute top-2 right-2 w-6 h-6 rounded-full bg-emerald-500 text-zinc-950 flex items-center justify-center text-xs font-black shadow-md">
                                                                <i className="fas fa-check"></i>
                                                            </div>
                                                        )}
                                                        {img && (
                                                            <button
                                                                type="button"
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    if (typeof window.previewImage === 'function') {
                                                                        window.previewImage(img, 'Ảnh Hiện Vật Trên Kệ');
                                                                    } else if (typeof openSafeImageTab === 'function') {
                                                                        openSafeImageTab(img);
                                                                    } else {
                                                                        window.open(img, '_blank');
                                                                    }
                                                                }}
                                                                className="absolute bottom-1.5 right-1.5 w-6 h-6 rounded-lg bg-black/60 text-white hover:bg-emerald-600 flex items-center justify-center text-[10px] transition-colors"
                                                                title="Xem ảnh phóng to"
                                                            >
                                                                <i className="fas fa-search-plus"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                    <div className="p-2 text-[10px] space-y-0.5">
                                                        <div className="text-zinc-300 font-bold truncate">
                                                            Khung: <b className="text-amber-400">{stk.p1_user?.split(' ').pop() || 'N/A'}</b>
                                                        </div>
                                                        <div className="text-zinc-400 truncate">
                                                            Gia cố: <b className="text-sky-400">{stk.p2_user?.split(' ').pop() || 'N/A'}</b>
                                                        </div>
                                                        {stk.date && (
                                                            <div className="text-[9px] text-zinc-500 font-mono">
                                                                {stk.date}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* FOOTER ACTIONS */}
                    <div className="pt-3 border-t border-white/[0.08] space-y-2 shrink-0">
                        <button
                            type="button"
                            onClick={handleConfirmAssign}
                            disabled={processing || (isGlass ? (!serialInput || serialInput.length < 4) : !selectedLayoutId)}
                            className={`w-full py-3 rounded-2xl font-black text-xs uppercase tracking-wider transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2 cursor-pointer ${
                                (isGlass ? (serialInput && serialInput.length >= 4) : selectedLayoutId)
                                    ? (isGlass
                                        ? 'bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 hover:brightness-110 text-zinc-950 shadow-amber-950/40 border border-amber-300/50'
                                        : 'bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:brightness-110 text-white shadow-emerald-950/40 border border-emerald-400/50')
                                    : 'bg-zinc-800 text-zinc-500 border border-white/[0.04] cursor-not-allowed'
                            }`}
                        >
                            {processing ? (
                                <><i className="fas fa-spinner fa-spin"></i> ĐANG GHI NHẬN...</>
                            ) : (
                                <><i className="fas fa-check-circle"></i> {isGlass ? 'XÁC NHẬN XUẤT BỂ NÀY' : 'XÁC NHẬN XUẤT CÂY NÀY'}</>
                            )}
                        </button>

                        {/* NÚT PHỤ CỨU NGUY: KHÔNG TÌM THẤY HIỆN VẬT TRÊN KỆ */}
                        <button
                            type="button"
                            onClick={handleReportMissingItem}
                            disabled={processing}
                            className="w-full py-2.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded-2xl font-bold text-[11px] uppercase tracking-wider transition-colors flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
                            title="Nếu thực tế trên kệ bị vỡ hoặc thất lạc, bấm vào đây để chuyển đơn về Chờ Sản Xuất Mới"
                        >
                            <i className="fas fa-exclamation-triangle text-rose-400 text-xs"></i>
                            <span>KHÔNG TÌM THẤY HIỆN VẬT TRÊN KỆ (CHUYỂN SẢN XUẤT MỚI)</span>
                        </button>
                    </div>

                </div>
            </div>
        );
    }

    // ==========================================
    // 3. COMPONENT THẺ ĐƠN HÀNG (ĐÃ CẬP NHẬT TÔ MÀU XANH KHI ĐẠT KCS)
    // ==========================================
    function OrderCardV2({
        attendance, order, prods, pack, packings, erpProducts, erpData, isAdmin, currentUser, pushDeltas,
        prodItems, userConfigs, triggerToast, isSelected, onToggleSelect, kpiConfig, idx_num,
        handleCancelOrder, handleConfirmStockIn, openReturnModal, onEditOrder, filterStatus, orders
    }) {
        const [optimisticOrder, setOptimisticOrder] = React.useState(null);
        const [optimisticPack, setOptimisticPack] = React.useState(null);
        const [sosTarget, setSosTarget] = React.useState(null);
        const [assignStockTarget, setAssignStockTarget] = React.useState(null);
        const actionBtnRef = React.useRef(null);
        const [showActionMenu, setShowActionMenu] = React.useState(false);
        const [menuPos, setMenuPos] = React.useState({ top: 0, right: 0 });
        const [confirmAction, setConfirmAction] = React.useState(null);

        const handleOpenMenu = (e) => {
            e.stopPropagation();
            if (actionBtnRef.current) {
                const rect = actionBtnRef.current.getBoundingClientRect();
                const spaceBelow = window.innerHeight - rect.bottom;
                const top = spaceBelow < 320 ? Math.max(10, rect.top - 310) : rect.bottom + 6;
                const right = Math.max(12, window.innerWidth - rect.right);
                setMenuPos({ top, right });
            }
            setShowActionMenu(prev => !prev);
        };

        React.useEffect(() => {
            setOptimisticOrder(null);
            setCheckedItems([]);
            setGoodsFile(null);
            setBoxFile(null);
            setWhFile(null);
            setShowActionMenu(false);
            setConfirmAction(null);
        }, [order?.status, order?.isCarriedToWH, order?.id]);
        React.useEffect(() => { setOptimisticPack(null); }, [pack?.status, pack?.id, pack?.photo]);

        const _order = optimisticOrder || order;
        const _pack = optimisticPack || pack;

        const isBossRole = localStorage.getItem('rf_boss') === 'true';
        const currentRole = localStorage.getItem('rf_role') || '';
        const isBoss = isBossRole || currentRole === 'TỐI CAO' || Boolean(isAdmin);
        const isCTV = currentRole === 'CTV';
        const isOwnOrder = _order.createdBy === currentUser || _order.sale === currentUser || _order.updatedBy === currentUser || _order.responsibleUser === currentUser || String(_order.channel || '').toUpperCase().includes('CỘNG TÁC VIÊN') || String(_order.channel || '').toUpperCase() === 'CTV';
        const canEdit = isBoss || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || currentRole === 'KẾ TOÁN' || (isCTV && isOwnOrder);
        const canCancel = isBoss || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || currentRole === 'KẾ TOÁN';

        const [goodsFile, setGoodsFile] = React.useState(null);
        const [boxFile, setBoxFile] = React.useState(null);
        const [whFile, setWhFile] = React.useState(null);
