                            onClick={handleRunArchive}
                            disabled={isArchiving}
                            className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-black font-black text-[12px] uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 disabled:opacity-50 cursor-pointer"
                        >
                            <i className={isArchiving ? "fas fa-spinner fa-spin" : "fas fa-box-archive"}></i>
                            <span>{isArchiving ? "Đang xử lý nén..." : `Chạy Lưu Trữ Ngay (> ${cutoffDays} ngày)`}</span>
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // -------------------------------------------------------------------------
    // MỤC 1: GIAO DIỆN TAB ĐƠN HÀNG (OrdersTab)
    // -------------------------------------------------------------------------

    const EMPTY_ARRAY = [];

    // COMPONENT BỌC ĐƠN HÀNG THÊM LOGIC SLA VÀ PHÂN LOẠI
    const RFOrderWrapper = React.memo(({ order, prods, onToggleSelect, onEditOrder, ...props }) => {
        const isEcom = String(order?.channel || '').toUpperCase().includes('SHOPEE') || String(order?.channel || '').toUpperCase().includes('TIKTOK');
        const isCTVOrRetail = String(order?.channel || '').toUpperCase().includes('BÁN LẺ') || String(order?.channel || '').toUpperCase().includes('CỘNG TÁC VIÊN') || String(order?.channel || '').toUpperCase() === 'CTV' || String(order?.channel || '').toUpperCase().includes('BÁN SỈ');
        
        let deadline;
        if (order?.deadline) {
            deadline = new Date(order.deadline);
        } else {
            if (typeof getAutoDeadline === 'function') {
                deadline = new Date(getAutoDeadline(order?.channel, order?.createdAt || order?.date, order?.shippingMethod));
            } else {
                const createdDate = new Date(order?.createdAt || order?.date || Date.now());
                deadline = new Date(createdDate);
                if (isEcom) {
                    deadline.setDate(deadline.getDate() + 1);
                    deadline.setHours(11, 30, 0, 0);
                } else {
                    deadline.setDate(deadline.getDate() + 6);
                    deadline.setHours(18, 0, 0, 0);
                }
            }
        }

        const now = new Date();
        const isLate = now > deadline;
        const hoursLeft = Math.max(0, Math.round((deadline - now) / (1000 * 60 * 60)));
        const isDone = String(order?._effectiveStatus || order?.status || '').toUpperCase().includes('BÀN GIAO') || String(order?._effectiveStatus || order?.status || '').toUpperCase().includes('HOÀN THÀNH');

        const handleToggle = React.useCallback(() => {
            if (onToggleSelect && order?.id) onToggleSelect(order.id);
        }, [onToggleSelect, order?.id]);

        const handleEdit = React.useCallback(() => {
            if (onEditOrder && order) onEditOrder(order, prods);
        }, [onEditOrder, order, prods]);

        return (
            <div className="relative mb-6 mt-4">
                <OrderCardV2 
                    order={order} 
                    prods={prods} 
                    onToggleSelect={handleToggle}
                    onEditOrder={handleEdit}
                    {...props} 
                />
            </div>
        );
    });

    const OrdersTab = React.memo(function OrdersTab({
        loadArchiveData,
        fetchArchivedOrders,
        isArchiveLoaded,
        isLoadingArchive,
        attendance,
        orders,
        prodItems,
        packings,
        erpProducts,
        erpData,
        isAdmin,
        currentUser,
        userRole: propUserRole,
        hasPerm: propHasPerm,
        pushDeltas,
        userConfigs,
        triggerToast,
        kpiConfig,
        configGiaLayout,
        documents
    }) {
        const [searchCode, setSearchCode] = React.useState('');
        const deferredSearchCode = React.useDeferredValue ? React.useDeferredValue(searchCode) : searchCode;
        const [filterTime, setFilterTime] = React.useState('Tháng Này');
        const [customMonth, setCustomMonth] = React.useState(() => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        });
        const [filterStatus, setFilterStatus] = React.useState('Chờ Sản Xuất');
        const [filterChannel, setFilterChannel] = React.useState('ALL');
        const [renderLimit, setRenderLimit] = React.useState(50);
        const [viewMode, setViewMode] = React.useState('TABLE');
        const [selectedDrawerOrder, setSelectedDrawerOrder] = React.useState(null);
        const [addingMode, setAddingMode] = React.useState(false);
        const [draftData, setDraftData] = React.useState(null);
        const [selectedIds, setSelectedIds] = React.useState([]);
        const tabsContainerRef = React.useRef(null);

        const [isScanningReturn, setIsScanningReturn] = React.useState(false);
        const [isScanningCancel, setIsScanningCancel] = React.useState(false);
        const [isBulkFinanceOpen, setIsBulkFinanceOpen] = React.useState(false);
        const [isBulkHandovering, setIsBulkHandovering] = React.useState(false);
        const [isSyncingGHN, setIsSyncingGHN] = React.useState(false);
        const [showRules, setShowRules] = React.useState(false);
        const [editingOrder, setEditingOrder] = React.useState(null);
        const [collapsedGroups, setCollapsedGroups] = React.useState({});
        const [showRevenueStats, setShowRevenueStats] = React.useState(false);

        const currentRole = propUserRole || localStorage.getItem('rf_role') || '';
        const isBossRole = localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO';
        const isBoss = isBossRole || Boolean(isAdmin);
        const isCTV = currentRole === 'CTV' || currentRole === 'CỘNG TÁC VIÊN';
        const canViewFinance = isBoss || isAdmin || ['KẾ TOÁN', 'QUẢN LÝ NHÂN SỰ', 'NHÂN SỰ', 'TỐI CAO', 'FOUNDER', 'ADMIN', 'QUẢN LÝ CẤP TRUNG'].includes(String(currentRole).toUpperCase());

        const hasPerm = React.useCallback((actionCode) => {
            if (isBossRole || currentRole === 'TỐI CAO') return true;
            if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
            if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
            return isBoss;
        }, [propHasPerm, currentRole, currentUser, isBoss, isBossRole]);

        const [isArchiveEngineOpen, setIsArchiveEngineOpen] = React.useState(false);
        const [isLazyLoadingArchive, setIsLazyLoadingArchive] = React.useState(false);
        const [loadedArchiveKeys, setLoadedArchiveKeys] = React.useState({});

        const handleLazyLoadArchive = React.useCallback(async (opts = {}) => {
            if (isLazyLoadingArchive || typeof fetchArchivedOrders !== 'function') return;
            const cacheKey = opts.month || opts.quarter || (opts.searchCode ? `search_${opts.searchCode}` : 'all');
            if (loadedArchiveKeys[cacheKey]) return;

            setIsLazyLoadingArchive(true);
            if (triggerToast) triggerToast(`Đang tải đơn lưu trữ ${opts.month ? `tháng ${opts.month}` : (opts.searchCode ? `mã "${opts.searchCode}"` : '')}...`, 'fa-spinner fa-spin', 'info');
            try {
                const res = await fetchArchivedOrders(opts);
                setLoadedArchiveKeys(prev => ({ ...prev, [cacheKey]: true }));
                if (res && res.success) {
                    if (triggerToast) {
                        triggerToast(`Đã tải ${res.orders?.length || 0} đơn từ Kho Lưu Trữ (Tổng: ${res.totalCount || 0})`, 'fa-check-circle', 'success');
                    }
                }
            } catch (e) {
                console.error('Lazy load error:', e);
            } finally {
                setIsLazyLoadingArchive(false);
            }
        }, [isLazyLoadingArchive, fetchArchivedOrders, loadedArchiveKeys, triggerToast]);

        React.useEffect(() => {
            if (filterTime === 'Chọn Tháng' && customMonth) {
                handleLazyLoadArchive({ month: customMonth });
            } else if (filterTime === 'Tháng Trước') {
                const today = new Date();
                const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                const lmStr = `${lastMonth.getFullYear()}-${String(lastMonth.getMonth() + 1).padStart(2, '0')}`;
                handleLazyLoadArchive({ month: lmStr });
            } else if (filterTime === 'Tất Cả') {
                handleLazyLoadArchive({});
            }
        }, [filterTime, customMonth, handleLazyLoadArchive]);

        const handleSyncGHN = React.useCallback(() => {
            if (isSyncingGHN) return;
            setIsSyncingGHN(true);
            if (triggerToast) triggerToast('Đang kết nối API GHN và đồng bộ trạng thái...', 'fa-bolt', 'info');

            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {
                        setIsSyncingGHN(false);
                        if (res && res.success) {
                            if (triggerToast) triggerToast(res.message || 'Đồng bộ GHN thành công!', 'fa-check-circle', 'success');
                        } else {
                            if (triggerToast) triggerToast(res?.message || 'Lỗi đồng bộ GHN', 'fa-times', 'danger');
                        }
                    })
                    .withFailureHandler(err => {
                        setIsSyncingGHN(false);
                        if (triggerToast) triggerToast('Lỗi kết nối GHN: ' + (err?.message || err), 'fa-times', 'danger');
                    })
                    .syncGHNViaAPI();
            } else {
                setIsSyncingGHN(false);
                if (triggerToast) triggerToast('Môi trường Dev: Chưa kết nối Google Apps Script backend', 'fa-info-circle', 'warning');
            }
        }, [isSyncingGHN, triggerToast]);

        React.useEffect(() => {
            setSelectedIds([]);
            setRenderLimit(50);
        }, [filterStatus, filterTime, searchCode]);

        React.useEffect(() => {
            if (tabsContainerRef.current) {
                const activeBtn = tabsContainerRef.current.querySelector('[data-active="true"]');
                if (activeBtn) {
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }
        }, [filterStatus]);

        React.useEffect(() => {
            const handleGlobalNav = (e) => {
                const trigger = e.detail?.trigger || (e.type === 'triggerCreateOrder' ? 'triggerCreateOrder' : (e.type === 'filterReadyPack' ? 'filterReadyPack' : ''));
                if (trigger === 'triggerCreateOrder' || e.type === 'triggerCreateOrder') {
                    setDraftData({ channel: e.detail?.channel || 'Bán Lẻ' });
                    setAddingMode(true);
                } else if (trigger === 'filterReadyPack' || e.type === 'filterReadyPack') {
                    setFilterStatus('Sẵn Sàng Đóng Gói');
                }
            };
            window.addEventListener('globalNavigateAndTrigger', handleGlobalNav);
            window.addEventListener('triggerCreateOrder', handleGlobalNav);
            window.addEventListener('filterReadyPack', handleGlobalNav);
            return () => {
                window.removeEventListener('globalNavigateAndTrigger', handleGlobalNav);
                window.removeEventListener('triggerCreateOrder', handleGlobalNav);
                window.removeEventListener('filterReadyPack', handleGlobalNav);
            };
        }, []);

        const toggleSelect = React.useCallback((orderId) => {
            setSelectedIds(prev => prev.includes(orderId) ? prev.filter(id => id !== orderId) : [...prev, orderId]);
        }, []);

        const clearSelection = React.useCallback(() => setSelectedIds([]), []);

        const handleEditOrder = React.useCallback((order, prods) => {
            setEditingOrder({ order, prods });
        }, []);

        const isDateInRangeLocal = (dateStr, filterStr, customM) => {
            if (!dateStr) return false;
            if (filterStr === 'Tất Cả') return true;

            const d = typeof window.parseOrderDateSafe === 'function' ? window.parseOrderDateSafe(dateStr) : null;
            if (!d || isNaN(d.getTime())) return false;

            const today = new Date();
            if (filterStr === 'Hôm Nay') return d.toDateString() === today.toDateString();
            if (filterStr === 'Hôm Qua') { const y = new Date(today); y.setDate(y.getDate() - 1); return d.toDateString() === y.toDateString(); }
            if (filterStr === 'Tuần Này') {
                const currentDay = today.getDay();
                const diff = today.getDate() - currentDay + (currentDay === 0 ? -6 : 1);
                const monday = new Date(today.getFullYear(), today.getMonth(), diff, 0, 0, 0, 0);
                const sunday = new Date(today.getFullYear(), today.getMonth(), diff + 6, 23, 59, 59, 999);
                return d >= monday && d <= sunday;
            }
            if (filterStr === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            if (filterStr === 'Tháng Trước') {
                const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                return d.getMonth() === lastMonth.getMonth() && d.getFullYear() === lastMonth.getFullYear();
            }
            if (filterStr === 'Tuỳ Chỉnh' || filterStr === 'Chọn Tháng') {
                if (!customM) return true;
                const [year, month] = customM.split('-');
                return d.getFullYear() === parseInt(year, 10) && d.getMonth() === (parseInt(month, 10) - 1);
            }
            return true;
        };

        const prodMapByOrderId = React.useMemo(() => {
            const map = {};
            if (!prodItems || prodItems.length === 0) return map;
            
            prodItems.forEach(p => {
                if (!p || !p.orderId) return;
                const pOrd = String(p.orderId).trim();
                if (!pOrd) return;
                
                const addMap = (key) => {
                    if (!map[key]) map[key] = [];
                    map[key].push(p);
                };

                if (pOrd.includes('|')) {
                    const parts = pOrd.split('|').map(x => x.trim());
                    parts.forEach(part => {
                        if (part) {
                            addMap(part);
                            if (part.includes('_')) addMap(part.split('_')[0]);
                        }
                    });
                } else if (pOrd.includes('_')) {
                    addMap(pOrd);
                    addMap(pOrd.split('_')[0]);
                } else {
                    addMap(pOrd);
                }
            });
            return map;
        }, [prodItems]);

        const checkItemReady = (p) => {
            if (!p) return true;
            const pStatus = String(p.status || '').toUpperCase().trim();
            if (pStatus === 'DONE' || pStatus === 'ĐÃ XONG' || pStatus === 'HỦY/VỠ' || pStatus === 'HOÀN KHO ĐẠT' || pStatus === 'HOÀN THÀNH') return true;

            const ff = p.fulfilledFromStock;
            if (ff === true || ff === 1 || ff === '1') return true;
            const ffStr = String(ff || '').toUpperCase().trim();
            if (ffStr === 'TRUE' || ffStr.includes('LẤY TỪ TỒN KHO') || ffStr.includes('TỒN KHO') || ffStr.includes('KHO CÓ SẴN') || ffStr.includes('CÓ SẴN')) return true;

            const pNote = String(p.note || '').toUpperCase();
            if (pNote.includes('LẤY TỪ TỒN KHO') || pNote.includes('KHO CÓ SẴN') || pNote.includes('CÓ SẴN Ở KHO') || pNote.includes('CÓ SẴN') || pNote.includes('BÙ KHO') || pNote.includes('TỰ ĐỘNG TẠO LỆNH BÙ')) return true;

            return false;
        };

        const getMatchedProds = React.useCallback((order) => {
            if (!order) return EMPTY_ARRAY;
            const oId = String(order.id || '').trim();
            const oCode = String(order.orderCode || '').trim();
            const oBaseCode = oCode.split(' | ')[0].split('|')[0].trim();

            const candidates = [
                ...(oId ? (prodMapByOrderId[oId] || []) : []),
                ...(oCode && oCode !== oId ? (prodMapByOrderId[oCode] || []) : []),
                ...(oBaseCode && oBaseCode !== oCode && oBaseCode !== oId ? (prodMapByOrderId[oBaseCode] || []) : [])
            ];

            if (candidates.length === 0) return EMPTY_ARRAY;
            const seen = new Set();
            const unique = [];
            for (let p of candidates) {
                if (p && p.id && !seen.has(p.id)) {
                    seen.add(p.id);
                    unique.push(p);
                }
            }
            return unique;
        }, [prodMapByOrderId]);

        const donePackSet = React.useMemo(() => {
            const set = new Set();
            const allPackings = packings || erpData?.Packings || [];
            allPackings.forEach(p => {
                if (p && p.orderId) {
                    const ps = String(p.status || '').toUpperCase().trim();
                    if ((ps === 'DONE' || ps === 'ĐÃ ĐÓNG GÓI' || ps === 'HOÀN THÀNH' || ps === 'ĐÃ XONG') && (!p.note || !p.note.includes('kho'))) {
                        const pOrd = String(p.orderId).trim();
                        set.add(pOrd);
                        if (pOrd.includes('|')) pOrd.split('|').forEach(x => set.add(x.trim()));
                        if (pOrd.includes('_')) set.add(pOrd.split('_')[0].trim());
                    }
                }
            });
            return set;
        }, [packings, erpData?.Packings]);

        const computeOrderMetadata = React.useCallback((o) => {
            const oIdStr = String(o.id || '').trim();
            const oCodeStr = String(o.orderCode || '').trim();
            const baseCodeStr = oCodeStr.split(' | ')[0].trim();
            const hasDonePack = donePackSet.has(oIdStr) || donePackSet.has(oCodeStr) || donePackSet.has(baseCodeStr);

            const rawSt = String(o.status || '').toUpperCase().trim();
            const isRec = o.isReconciled === true || o.isReconciled === 'true' || o.isReconciled === 'TRUE';
            const isOrderClosedOrPacked = (
                hasDonePack ||
                rawSt === 'ĐÃ BÀN GIAO' ||
                rawSt === 'CHỜ BÀN GIAO' ||
                rawSt === 'HOÀN THÀNH' ||
                rawSt === 'ĐỐI SOÁT THÀNH CÔNG' ||
                rawSt === 'ĐƠN HUỶ' ||
                rawSt === 'HUỶ' ||
                rawSt === 'HỦY' ||
                rawSt === 'HÀNG HOÀN' ||
                rawSt.includes('HOÀN') ||
                rawSt.includes('HUỶ') ||
                rawSt.includes('HỦY') ||
                rawSt.includes('CANCEL') ||
                isRec
            );

            const related = getMatchedProds(o);
            const hasProdFlag = o.hasProduction === true || String(o.hasProduction).toUpperCase() === 'TRUE';
            let allProdDone = true;
            if (related.length > 0) {
                allProdDone = related.every(p => checkItemReady(p));
            } else if (hasProdFlag) {
                allProdDone = false;
            }

            const isGHNShipping = String(o.shippingMethod || '').trim() === 'Gửi GHN' || String(o.shippingMethod || '').toLowerCase().includes('ghn');
            const isGuiXeShipping = String(o.shippingMethod || '').trim() === 'Gửi Xe';
            const isTMDT = String(o.channel || '').toUpperCase().includes('SHOPEE') || String(o.channel || '').toUpperCase().includes('TIKTOK') || String(o.channel || '').toUpperCase().includes('LAZADA');

            let pureShippingCode = String(o.shippingCode || '').trim();
            if (!pureShippingCode && String(o.orderCode || '').includes('MVĐ:')) {
                pureShippingCode = String(o.orderCode).split('MVĐ:')[1].trim();
            }
            const hasShippingCode = Boolean(pureShippingCode && pureShippingCode.length >= 3);
            const requiresShippingCode = isTMDT || isGHNShipping || isGuiXeShipping;
            const isMissingMVD = !isOrderClosedOrPacked && requiresShippingCode && !hasShippingCode;

            return {
                hasDonePack,
                isMissingMVD,
                allProdDone,
                isMissingAccessories: false
            };
        }, [donePackSet, getMatchedProds]);

        const isReconciledSafe = (val) => {
            return val === true || val === 'true' || val === 'TRUE';
        };

        React.useEffect(() => {
            if (Array.isArray(orders)) {
                window.GLOBAL_ALL_ORDERS = orders;
            }
        }, [orders]);

        const matchTimeFilter = React.useCallback((order) => {
            if (!filterTime || filterTime === 'ALL' || filterTime === 'Tất Cả') return true;

            const st = String(order.status || order._effectiveStatus || '').toUpperCase().trim();
            const isRec = isReconciledSafe(order.isReconciled);
            const isReturnOrder = (st === 'HÀNG HOÀN' || st.includes('HOÀN CHỜ XỬ') || st.includes('HOÀN TRẢ') || st === 'KIỂM HÀNG HOÀN');

            if (isReturnOrder && !isRec && (filterTime === 'Tháng Này' || filterTime === 'this_month')) {
                return true;
            }

            const isClosed = (
                st === 'HOÀN THÀNH' || 
                st === 'ĐỐI SOÁT THÀNH CÔNG' || 
                st === 'ĐÃ BÀN GIAO' || 
                st === 'ĐƠN HUỶ' || 
                st === 'ĐÃ NHẬP KHO' ||
                (isReturnOrder && isRec) ||
                isRec
            );

            if (!isClosed && (filterTime === 'Tháng Này' || filterTime === 'this_month')) {
                return true;
            }

            const dateCandidate = isReturnOrder
                ? (order.returnedAt || order.reconciledAt || order.date || order.createdAt || order.updatedAt)
                : (order.date || order.createdAt || order.reconciledAt || order.returnedAt || order.updatedAt);
            const orderDateObj = (typeof window.parseOrderDateSafe === 'function') 
                ? window.parseOrderDateSafe(dateCandidate)
                : null;

            const now = new Date();
            const curY = now.getFullYear();
            const curM = now.getMonth() + 1;
            const curMStr = String(curM).padStart(2, '0');
            const prevM = curM === 1 ? 12 : curM - 1;
            const prevY = curM === 1 ? curY - 1 : curY;
            const prevMStr = String(prevM).padStart(2, '0');

            if (!orderDateObj) {
                const rawStr = String(dateCandidate || '');
                if (filterTime === 'Tháng Này' || filterTime === 'this_month') {
                    return rawStr.includes(`${curY}-${curMStr}`) || rawStr.includes(`/${curMStr}/${curY}`) || rawStr.includes(`/${curM}/${curY}`) || rawStr.includes(`-${curMStr}-${curY}`) || rawStr.includes(`-${curM}-${curY}`);
                }
                if (filterTime === 'Tháng Trước' || filterTime === 'last_month') {
                    return rawStr.includes(`${prevY}-${prevMStr}`) || rawStr.includes(`/${prevMStr}/${prevY}`) || rawStr.includes(`/${prevM}/${prevY}`) || rawStr.includes(`-${prevMStr}-${prevY}`) || rawStr.includes(`-${prevM}-${prevY}`);
                }
                if ((filterTime === 'Tuỳ Chỉnh' || filterTime === 'Chọn Tháng') && customMonth) {
                    const [y, m] = customMonth.split('-');
                    return rawStr.includes(`${y}-${m}`) || rawStr.includes(`/${m}/${y}`) || rawStr.includes(`-${m}-${y}`);
                }
                return true;
            }

            const y = orderDateObj.getFullYear();
            const m = orderDateObj.getMonth() + 1;

            if (filterTime === 'Tháng Này' || filterTime === 'this_month') {
                return y === curY && m === curM;
            }
            if (filterTime === 'Tháng Trước' || filterTime === 'last_month') {
                return y === prevY && m === prevM;
            }
            if ((filterTime === 'Tuỳ Chỉnh' || filterTime === 'Chọn Tháng') && customMonth) {
                const [targetY, targetM] = customMonth.split('-').map(Number);
                return y === targetY && m === targetM;
            }

            return true;
        }, [filterTime, customMonth]);

        const sourceOrders = React.useMemo(() => {
            return orders || [];
        }, [orders]);

        const timeFilteredOrders = React.useMemo(() => {
            return sourceOrders.map(o => {
                let rawStatus = String(o.status || '').toUpperCase().trim();
                let eff = String(o.status || o._effectiveStatus || '').toUpperCase().trim();
                const isRec = isReconciledSafe(o.isReconciled);

                if (!rawStatus || rawStatus === '0' || rawStatus === 'NULL' || rawStatus === 'UNDEFINED') {
                    rawStatus = 'CHỜ SẢN XUẤT';
                    eff = 'CHỜ SẢN XUẤT';
                }
                
                if (rawStatus === 'HOÀN THÀNH' || rawStatus === 'ĐỐI SOÁT THÀNH CÔNG' || isRec) {
                    eff = 'HOÀN THÀNH';
                } else if (rawStatus === 'ĐÃ BÀN GIAO' || rawStatus === 'ĐÃ NHẬP KHO') {
                    eff = 'ĐÃ BÀN GIAO';
                } else if (rawStatus === 'HÀNG HOÀN' || rawStatus === 'HOÀN' || rawStatus.includes('HOÀN CHỜ XỬ') || rawStatus.includes('HOÀN TRẢ')) {
                    eff = 'HÀNG HOÀN CHỜ XỬ LÝ';
                } else if (rawStatus.includes('HUỶ') || rawStatus.includes('HỦY') || rawStatus.includes('CANCEL') || rawStatus.includes('ยกเลิก')) {
                    eff = 'ĐƠN HUỶ';
                }
                const meta = computeOrderMetadata(o);

        const parseRevenue = (raw, channel) => {
            if (raw === null || raw === undefined || raw === '') return 0;
            let s = String(raw).trim();
            if (!s) return 0;

            let num = 0;
            if (typeof raw === 'number') {
                num = raw;
            } else {
                // Xoá ký tự tiền tệ, chữ cái và khoảng trắng thừa
                s = s.replace(/[đĐ\sVNDvnd$฿₱RM]/g, '').trim();
                if (!s) return 0;

                // Xử lý các định dạng số:
                if (s.includes('.') && s.includes(',')) {
                    if (s.lastIndexOf('.') > s.lastIndexOf(',')) {
                        // Định dạng US: 1,250,000.50 -> bỏ phẩy, giữ chấm
                        s = s.replace(/,/g, '');
                    } else {
                        // Định dạng VN/EU: 1.250.000,50 -> bỏ chấm, phẩy thành chấm
                        s = s.replace(/\./g, '').replace(/,/g, '.');
                    }
                } else if (s.includes(',')) {
                    // Chỉ có dấu phẩy: kiểm tra xem là phân cách nghìn hay thập phân
                    if (/\,\d{3}($|\D)/.test(s) || /^\d{1,3}(,\d{3})+$/.test(s)) {
                        s = s.replace(/,/g, '');
                    } else {
                        s = s.replace(/,/g, '.');
                    }
                } else if (s.includes('.')) {
                    // Chỉ có dấu chấm: nếu có nhiều chấm (1.250.000) hoặc có 3 chữ số sau chấm (250.000)
                    const parts = s.split('.');
                    if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3 && parseInt(parts[0]) > 0)) {
                        s = s.replace(/\./g, '');
                    }
                }
                num = parseFloat(s);
            }

            if (isNaN(num) || !isFinite(num) || num <= 0) return 0;

            // Failsafe chống rác dữ liệu: Mã vận đơn / Số điện thoại / ID đơn dán nhầm vào cột Doanh thu (Ngưỡng 2 Tỷ đồng)
            if (num > 2000000000) {
                return 0;
            }

            let ch = String(channel || '').toUpperCase().trim();
            let rate = 1;
            if (ch.includes('USD') || (ch.includes('XUẤT KHẨU') && num < 10000)) {
                rate = 25500; // 1 USD ≈ 25,500 VNĐ
            }

            if (rate > 1) {
                return Math.round(num * rate);
            }

            return Math.round(num);
        };

                            const p = (erpProducts || []).find(x => x.name === rp.name);
                            if (p) {
                                productUpdates.push({ ...p, quantity: Number(p.quantity || 0) + 1 });
                                totalRefundValue += 1 * (Number(p.costPrice) || 0);
                                itemsToRefund.push({ name: rp.name, qty: 1, price: p.costPrice || 0 });
                            }
                        }
                    });

                    if (productUpdates.length > 0) {
                        const mergedProducts = {};
                        productUpdates.forEach(p => {
                            if (!mergedProducts[p.id]) mergedProducts[p.id] = { ...p, _diff: 0 };
                            mergedProducts[p.id]._diff += (p.quantity - Number((erpProducts.find(x => x.id === p.id) || {}).quantity || 0));
                        });

                        payload.Products = Object.values(mergedProducts).map(p => {
                            const originalP = erpProducts.find(x => x.id === p.id);
                            return { ...originalP, quantity: Number(originalP.quantity || 0) + p._diff, _diff: p._diff };

                            date: new Date().toISOString().replace('T', ' ').slice(0, 19),
                            note: `Nhập lại kho do khách huỷ/hoàn đơn: ${order.orderCode}`,

                        }];
                    }

                await pushDeltas(payload, isShipped ? 'Đã chuyển đơn về nhóm Chờ Hoàn!' : 'Đã hủy đơn thành công!', 'fa-ban');

                    triggerToast('Đơn hàng đã đóng gói/giao đi, hệ thống đã chuyển về mục Hàng Hoàn Chờ Xử!', 'fa-undo', 'warning');

                triggerToast('Lỗi khi xử lý hủy/hoàn đơn!', 'fa-times', 'danger');

        const handleConfirmStockIn = React.useCallback(async (order) => {
            if (!window.confirm(`Xác nhận NHẬP KHO toàn bộ sản phẩm của lệnh ${order.orderCode}?`)) return;
            try {

                if (relatedProds.length === 0) return triggerToast('Không có sản phẩm nào để nhập!', 'fa-exclamation', 'warning');

                    const match = (erpProducts || []).find(x => x.name === name);

                        const qty = qtyMap[name];

                        totalAmount: totalCost,
                        date: new Date().toISOString().slice(0, 16).replace('T', ' '),

        }, [prodItems, erpProducts, pushDeltas, triggerToast]);

        const openReturnModal = React.useCallback((order, item) => { triggerToast('Chức năng đang phát triển', 'fa-info', 'warning'); }, [triggerToast]);

        const handleBulkReturnApprove = async () => {
            if (!selectedIds || selectedIds.length === 0) return;
            if (!window.confirm(`Xác nhận DUYỆT HOÀN KHO & HOÀN THÀNH cho ${selectedIds.length} đơn hàng đã chọn?\n\nHệ thống sẽ tự động nhập lại toàn bộ hàng hoá vào Kho Tổng và chuyển trạng thái các đơn sang HOÀN THÀNH.`)) return;

            setIsBulkHandovering(true);
            try {
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString().slice(0, 16).replace('T', ' ');
                const selectedOrders = orders.filter(o => selectedIds.includes(o.id));
                
                let updatedOrders = [];
                let productUpdatesMap = {};
                let itemsToRestockLog = [];
                let totalCost = 0;

                selectedOrders.forEach(o => {
                    updatedOrders.push({
                        ...o,
                        status: 'Hoàn Thành',
                        isReconciled: true,
                        reconciledAt: safeDateFull,
                        updatedBy: currentUser || 'SYSTEM'
                    });

                    // CHỈ cộng lại tồn kho nếu đơn ĐÃ TỪNG XUẤT KHO (đã đóng gói/bàn giao)
                    const hasExported = (erpData?.ImportExport || []).some(log => log.type === 'Xuất' && String(log.note || '').includes(o.orderCode || o.id));
                    if (!hasExported) return; // Đơn chưa xuất kho → không cộng lại tồn

                    let accs = typeof o.accessories === 'string' ? (safeJSONParse(o.accessories) || []) : (o.accessories || []);
                    if (!Array.isArray(accs)) accs = [];
                    accs.forEach(a => {
                        const qty = Number(a.quantity) || 1;
                        const p = (erpProducts || []).find(x => x.name === a.name);
                        if (p && p.id) {
                            productUpdatesMap[p.id] = (productUpdatesMap[p.id] || 0) + qty;
                            totalCost += qty * (Number(p.costPrice) || 0);
                            itemsToRestockLog.push({ name: a.name, qty, price: p.costPrice || 0 });
                        }
                    });

                    const relProds = (prodItems || []).filter(p => p && p.orderId && String(p.orderId).includes(String(o.id)));
                    relProds.forEach(rp => {
                        const p = (erpProducts || []).find(x => x.name === rp.name);
                        if (p && p.id) {
                            productUpdatesMap[p.id] = (productUpdatesMap[p.id] || 0) + 1;
                            totalCost += 1 * (Number(p.costPrice) || 0);
                            itemsToRestockLog.push({ name: rp.name, qty: 1, price: p.costPrice || 0 });
                        }
                    });
                });

                let payload = { orders: updatedOrders };
                if (Object.keys(productUpdatesMap).length > 0) {
                    payload.Products = Object.keys(productUpdatesMap).map(id => {
                        const orig = (erpProducts || []).find(x => x.id === id);
                        const addQty = productUpdatesMap[id];
                        return { id, quantity: Number(orig?.quantity || 0) + addQty, _diff: addQty };
                    });

                    payload.ImportExport = [{
                        id: 'IE_BULK_RET_' + Date.now(),
                        type: 'Nhập',
                        target: 'Kho Tổng (Hoàn Hàng Hàng Loạt)',
                        totalAmount: totalCost,
                        date: safeDateFull,
                        note: `Duyệt hoàn kho hàng loạt ${selectedOrders.length} đơn hàng`,
                        itemsData: JSON.stringify(itemsToRestockLog)
                    }];
                }

                await pushDeltas(payload, `Đã duyệt hoàn hàng loạt ${selectedOrders.length} đơn sang HOÀN THÀNH!`, 'fa-check-circle');
                triggerToast(`Đã duyệt hoàn thành ${selectedOrders.length} đơn hàng!`, 'fa-check', 'success');
                setSelectedIds([]);
            } catch (err) {
                triggerToast('Lỗi duyệt hoàn hàng loạt: ' + err.message, 'fa-times', 'danger');
            } finally {
                setIsBulkHandovering(false);
            }
        };

        const [isBulkDeleting, setIsBulkDeleting] = React.useState(false);

        const handleBulkDelete = async () => {
            if (!selectedIds || selectedIds.length === 0) return;
            const confirmMsg = `⚠️ BẠN CÓ CHẮC CHẮN MUỐN XÓA VĨNH VIỄN ${selectedIds.length} ĐƠN HÀNG ĐÃ CHỌN?\n\nThao tác này sẽ xóa toàn bộ đơn hàng, các lệnh sản xuất (Production) và lịch sử đóng gói (Packings) liên quan khỏi hệ thống!`;
            if (!window.confirm(confirmMsg)) return;

            setIsBulkDeleting(true);
            try {
                const selectedOrders = (orders || []).filter(o => selectedIds.includes(o.id));
                const selectedCodes = selectedOrders.map(o => String(o.orderCode || '').split(' | ')[0].trim()).filter(Boolean);

                const deletedProdIds = (prodItems || []).filter(p => {
                    if (!p || !p.orderId) return false;
                    const pOrd = String(p.orderId).trim();
                    return selectedIds.includes(pOrd) || 
                           selectedIds.some(id => pOrd.includes(id)) || 
                           selectedCodes.some(code => code && (pOrd === code || pOrd.includes(code)));
                }).map(p => p.id);

                const deletedPackIds = (erpData?.Packings || []).filter(pk => {
                    if (!pk || !pk.orderId) return false;
                    const pkOrd = String(pk.orderId).trim();
                    return selectedIds.includes(pkOrd) || 
                           selectedIds.some(id => pkOrd.includes(id)) || 
                           selectedCodes.some(code => code && (pkOrd === code || pkOrd.includes(code)));
                }).map(pk => pk.id);

                const payload = {
                    deletes: {
                        Orders: selectedIds,
                        Production: deletedProdIds,
                        Packings: deletedPackIds
                    }
                };

                // Lấy tất cả log xuất/nhập kho liên quan đến các đơn này
                const relatedLogs = (erpData?.ImportExport || []).filter(log => log.note && selectedCodes.some(code => log.note.includes(code)));
                const logsToDelete = relatedLogs.map(l => l.id);

                let relatedTransactions = (erpData?.Transactions || []).filter(tx => 
                    selectedCodes.some(code => 
                        (tx.title && tx.title.includes(code)) || 
                        (tx.note && tx.note.includes(code))
                    )
                );

                if (relatedTransactions.length > 0) {
                    if (!window.confirm(`Các đơn hàng này có ${relatedTransactions.length} phiếu thu/chi kèm theo.\nBạn có muốn XÓA luôn các phiếu này không?\nChọn OK để Xóa, Cancel để Giữ lại.`)) {
                        relatedTransactions = [];
                    }
                }

                let updatedProducts = [];
                if (relatedLogs.length > 0) {
                    let diffMap = new Map();
                    relatedLogs.forEach(log => {
                        try {
                            const items = JSON.parse(log.itemsData || '[]');
                            items.forEach(item => {
                                let p = (erpProducts || erpData?.Products || []).find(x => x.name === item.name);
                                if (p) {
                                    let currentEntry = diffMap.get(p.id) || { product: p, diff: 0 };
                                    let change = Number(item.qty) || 0;
                                    if (log.type === 'Xuất') {
                                        currentEntry.diff += change;
                                    } else if (log.type === 'Nhập') {
                                        currentEntry.diff -= change;
                                    }
                                    diffMap.set(p.id, currentEntry);
                                }
                            });
                        } catch(e) {}
                    });
                    diffMap.forEach((entry, prodId) => {
                        if (entry.diff !== 0) {
                            updatedProducts.push({
                                id: prodId,
                                quantity: Math.max(0, Number(entry.product.quantity || 0) + entry.diff),
                                _diff: entry.diff
                            });
                        }
                    });
                }

                if (logsToDelete.length > 0) payload.deletes.ImportExport = logsToDelete;
                if (relatedTransactions.length > 0) payload.deletes.Transactions = relatedTransactions.map(tx => tx.id);
                if (updatedProducts.length > 0) payload.Products = updatedProducts; 

                const relatedKPIs = (erpData?.BonusPenalty || []).filter(bp => 
                    selectedCodes.some(code => 
                        bp.orderCode === code || (bp.note && bp.note.includes(code))
                    ) || selectedIds.some(id => bp.orderCode === id)
                );
                if (relatedKPIs.length > 0) payload.deletes.BonusPenalty = relatedKPIs.map(bp => bp.id);

                await pushDeltas(payload, `Đã xóa vĩnh viễn ${selectedIds.length} đơn hàng cùng ${deletedProdIds.length} lệnh sản xuất!`, 'fa-trash');
                triggerToast(`Đã xóa vĩnh viễn ${selectedIds.length} đơn hàng và hoàn trả ${updatedProducts.length} mục kho!`, 'fa-check', 'success');
                setSelectedIds([]);
            } catch (err) {
                triggerToast('Lỗi khi xóa hàng loạt: ' + err.message, 'fa-times', 'danger');
            } finally {
                setIsBulkDeleting(false);
            }
        };

        const reconciliationInputRef = React.useRef(null);
        const [isReconciling, setIsReconciling] = React.useState(false);

        const handleReconciliationImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setIsReconciling(true);
            if (typeof window.ensureXLSXLoaded === 'function') await window.ensureXLSXLoaded();
            triggerToast('Đang quét file báo cáo đối soát...', 'fa-spinner fa-spin', 'info');

            try {
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = window.XLSX.read(data, { type: 'binary' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                        if (!rows || rows.length < 2) throw new Error('File rỗng');

                        let headerIdx = 0;
                        for (let i = 0; i < Math.min(20, rows.length); i++) {
                            const rowStr = (rows[i] || []).join(' ').toLowerCase();
                            if (rowStr.includes('mã đơn') || rowStr.includes('mã giao dịch') || rowStr.includes('order id') || rowStr.includes('mã tham chiếu') || rowStr.includes('หมายเลขคำสั่งซื้อ') || rowStr.includes('คำสั่งซื้อ')) {
                                headerIdx = i; break;
                            }
                        }

                        const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());

                        const getCol = (keys) => headers.findIndex(h => keys.some(k => h.includes(k)));

                        const iCode = getCol(['mã đơn', 'mã vận đơn', 'order id', 'mã tham chiếu', 'หมายเลขคำสั่งซื้อ', 'หมายเลขติดตามพัสดุ']);
                        const iAmt = getCol(['tổng số tiền được thanh toán', 'thực nhận', 'được thanh toán', 'thanh toán', 'số tiền', 'giá trị', 'ยอดเงินที่ผู้ซื้อจ่าย', 'total amount']);

                        if (iCode === -1) {
                            triggerToast('Không tìm thấy cột chứa Mã đơn hoặc Mã vận đơn!', 'fa-exclamation-triangle', 'danger');
                            setIsReconciling(false);
                            return;
                        }

                        const iFeeFixed = getCol(['phí cố định', 'ค่าธรรมเนียมคอมมิชชัน']);
                        const iFeeService = getCol(['phí dịch vụ', 'ค่าบริการ', 'ค่าธรรมเนียมการขาย']);
                        const iFeePayment = getCol(['phí thanh toán', 'phí giao dịch', 'ค่าธรรมเนียมการทำธุรกรรม']);
                        const iFeeAffiliate = getCol(['phí tiếp thị', 'affiliate', 'ค่าคอมมิชชั่นพันธมิตร']);
                        const iShopVoucher = getCol(['mã giảm giá của shopee', 'shopee voucher', 'voucher của shop', 'โค้ดส่วนลด']);
                        const iTax = getCol(['thuế', 'ภาษี']);

                        const parseSafeNum = (v) => {
                            if (v === undefined || v === null || v === '') return 0;
                            if (typeof v === 'number') return isNaN(v) ? 0 : v;
                            let s = String(v).trim().replace(/[^\d.,-]/g, '');
                            if (!s || s === '-') return 0;
                            if (s.includes(',') && s.includes('.')) {
                                if (s.lastIndexOf('.') > s.lastIndexOf(',')) s = s.replace(/,/g, '');
                                else s = s.replace(/\./g, '').replace(/,/g, '.');
                            } else if (s.includes(',')) {
                                if (/\,\d{3}$/.test(s) || /\,\d{3}\,/.test(s)) s = s.replace(/,/g, '');
                                else if (/\,\d{1,2}$/.test(s)) s = s.replace(/,/g, '.');
                                else s = s.replace(/,/g, '');
                            }
                            const n = parseFloat(s);
                            return isNaN(n) ? 0 : n;
                        };

                        let matchedOrders = [];
                        for (let i = headerIdx + 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row[iCode]) continue;
                            let code = String(row[iCode]).trim();

                            // Prevent fake order codes (like STT 1,2,3)
                            if (code.length < 5) {
                                for (let c = 0; c < row.length; c++) {
                                    const val = String(row[c] || '').trim();
                                    if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                        code = val; break;
                                    }
                                }
                            }

                            let amt = 0;
                            if (iAmt !== -1) {
                                amt = Number(String(row[iAmt]).replace(/[^0-9.-]+/g, "")) || 0;
                            }
                            if (code && code !== 'undefined' && code.length >= 5) {
                                matchedOrders.push({
                                    code: code, amount: amt,
                                    feeFixed: iFeeFixed !== -1 ? Number(String(row[iFeeFixed]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    feeService: iFeeService !== -1 ? Number(String(row[iFeeService]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    feePayment: iFeePayment !== -1 ? Number(String(row[iFeePayment]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    feeAffiliate: iFeeAffiliate !== -1 ? Number(String(row[iFeeAffiliate]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    shopVoucher: iShopVoucher !== -1 ? Number(String(row[iShopVoucher]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    tax: iTax !== -1 ? Number(String(row[iTax]).replace(/[^0-9.-]+/g, "")) || 0 : 0
                                });
                            }
                        }

                        if (matchedOrders.length === 0) {
                            triggerToast('Không tìm thấy dữ liệu hợp lệ trong file.', 'fa-info-circle', 'info');
                            setIsReconciling(false);
                            return;
                        }

                        if (window.confirm(`Tìm thấy ${matchedOrders.length} mã đơn. Bạn có muốn kích hoạt chuyển trạng thái sang HOÀN THÀNH cho các đơn hợp lệ không?`)) {
                            const accs = erpData?.Accounts || [];
                            let defaultAcc = accs.find(a => a.accountName.toLowerCase().includes('shopee'));
                            if (!defaultAcc) defaultAcc = accs[0];
                            const accInput = window.prompt(`Nhập ID hoặc Tên Quỹ để chứa tiền Đối Soát (VD: Ví Shopee). Để trống sẽ bỏ qua tạo Sổ Quỹ.`, defaultAcc ? defaultAcc.accountName : '');
                            let targetAccId = '';
                            if (accInput) {
                                const match = accs.find(a => a.id === accInput || a.accountName.toLowerCase().includes(accInput.toLowerCase()));
                                if (match) targetAccId = match.id;
                                else targetAccId = accInput; // fallback
                            }

                            triggerToast('Đang xử lý đối soát (Batch Process)...', 'fa-spinner fa-spin', 'info');
                            const res = await runGAS('processReconciliationBatch', matchedOrders, targetAccId);
                            if (res && res.success) {
                                triggerToast(res.message + ` (Bỏ qua: ${res.notFoundCount})`, 'fa-check', 'success');
                                if (res.updatedCount > 0) window.dispatchEvent(new CustomEvent('triggerReloadData'));
                            } else {
                                triggerToast(res?.message || 'Lỗi đối soát', 'fa-times', 'danger');
                            }
                        }
                    } catch (err) {
                        triggerToast('File không đúng định dạng hoặc lỗi đọc dữ liệu', 'fa-exclamation-triangle', 'danger');
                    }
                    setIsReconciling(false);
                    if (reconciliationInputRef.current) reconciliationInputRef.current.value = '';
                };
                reader.readAsArrayBuffer(file);
            } catch (err) {
                triggerToast('Lỗi đọc file', 'fa-times', 'danger');
                setIsReconciling(false);
            }
        };

        // ==========================================
        // 6. HELPER HANDLERS & FORMATTERS MỚI (HALLMARK UX)
        // ==========================================
        const parseAccessoriesSafe = React.useCallback((accessories) => {
            if (!accessories) return [];
            if (Array.isArray(accessories)) return accessories;
            if (typeof accessories === 'string') {
                try {
                    const parsed = JSON.parse(accessories);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    return [];
                }
            }
            return [];
        }, []);

        const formatMoneySafe = React.useCallback((amt) => {
            if (typeof window.formatMoney === 'function') return window.formatMoney(amt);
            const n = Number(amt) || 0;
            return n.toLocaleString('vi-VN');
        }, []);

        const handleToggleUrgent = React.useCallback(async (order, e) => {
            if (e) e.stopPropagation();
            const currentUrgent = order.isUrgent === true || order.isUrgent === 'TRUE' || order.isUrgent === 1;
            const newUrgent = !currentUrgent;
            try {
                await pushDeltas({
                    orders: [{ ...order, isUrgent: newUrgent }]
                }, newUrgent ? `Đã đánh dấu ĐƠN GẤP: ${order.orderCode}!` : `Đã gỡ ưu tiên: ${order.orderCode}`, 'fa-bolt');
                triggerToast(newUrgent ? `⚡ Đã ưu tiên đơn ${order.orderCode}!` : `Đã bỏ ưu tiên đơn ${order.orderCode}`, 'fa-check', 'info');
                if (selectedDrawerOrder && selectedDrawerOrder.id === order.id) {
                    setSelectedDrawerOrder(prev => prev ? { ...prev, isUrgent: newUrgent } : null);
                }
            } catch (err) {
                triggerToast('Lỗi cập nhật ưu tiên: ' + err.message, 'fa-times', 'danger');
            }
        }, [pushDeltas, triggerToast, selectedDrawerOrder]);

        const handleUpdateOrderStatus = React.useCallback(async (order, newStatus, e) => {
            if (e) e.stopPropagation();
            if (!newStatus || order.status === newStatus) return;
            try {
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString().slice(0, 16).replace('T', ' ');
                const updatePayload = {
                    ...order,
                    status: newStatus,
                    updatedBy: currentUser || 'SYSTEM'
                };
                if (newStatus === 'Hoàn Thành' || newStatus === 'Đối Soát Thành Công') {
                    updatePayload.isReconciled = true;
                    updatePayload.reconciledAt = safeDateFull;
                }
                await pushDeltas({ orders: [updatePayload] }, `Đã chuyển đơn ${order.orderCode} sang [${newStatus}]!`, 'fa-exchange-alt');

                            <div class="line"><b>Khách Hàng:</b> ${order.customer || 'Khách Lẻ'}</div>
                            <div class="line"><b>SĐT:</b> ${order.phone || '---'}</div>
                            <div class="line"><b>Địa Chỉ:</b> ${order.address || '---'}</div>
                            <div class="items">
                                <div class="bold" style="margin-bottom:4px;">DANH SÁCH MẶT HÀNG:</div>
                                ${Array.isArray(accs) && accs.length > 0 ? accs.map((a, i) => `<div>${i+1}. ${a.name || a.title || 'Sản phẩm'} x${a.quantity || a.qty || 1}</div>`).join('') : '<div>1x Đơn hàng tiêu chuẩn</div>'}
                            </div>
                            <div class="line"><b>Ghi Chú:</b> ${order.note || 'Không có'}</div>
                            <div class="footer">--- CẢM ƠN QUÝ KHÁCH ---</div>
                            <script>window.onload = function() { window.print(); window.close(); }<\/script>
                        </body></html>
                    `);

                } else {
                    triggerToast('Trình duyệt đã chặn cửa sổ in ấn!', 'fa-exclamation-triangle', 'warning');

        const handleExportOrdersExcel = React.useCallback(async () => {

                    const accs = parseAccessoriesSafe(o.accessories);
                    const itemsSummary = accs.map(a => `${a.name || ''} (x${a.quantity || a.qty || 1})`).join('; ');
                    return {
                        'STT': idx + 1,
                        'Mã Đơn': code,
                        'Mã Vận Đơn': mvd,
                        'Kênh Bán': o.channel || '',
                        'Khách Hàng': o.customer || '',
                        'Số Điện Thoại': o.phone || '',
                        'Địa Chỉ': o.address || '',
                        'Hạn Giao (SLA)': o.deadline || '',

                        'Sản Phẩm': itemsSummary,

                        'Giá Vốn (COGS)': canViewFinance ? (Number(o.cogs) || 0) : '***',
                        'Ghi Chú': o.note || ''

                });
                const ws = window.XLSX.utils.json_to_sheet(exportData);

            if (c.includes('TIKTOK')) return { bg: 'bg-[#ec4899]/10 text-[#ec4899] border-[#ec4899]/25', icon: 'fa-video', label: 'TikTok Shop' };

            if (s === 'CHỜ SẢN XUẤT' || s === 'ĐANG SẢN XUẤT') return { bg: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/25', icon: 'fa-hammer', dot: 'bg-indigo-400' };

                        {/* CHẾ ĐỘ 1: BẢNG NÉN HIGH-DENSITY (H-14 ROW) */}

                                                const isUrgent = order.isUrgent === true || order.isUrgent === 'TRUE' || order.isUrgent === 1;

                                                const statBadge = getStatusBadge(order.status);
                                                const accs = parseAccessoriesSafe(order.accessories);
                                                const itemCount = accs.reduce((sum, item) => sum + (Number(item.quantity || item.qty) || 1), 0) || 1;

                                                const hasProd = order.hasProduction === true || order.hasProduction === 'true' || matchedProds.length > 0;

                                                        key={order.id}
                                                        onClick={() => setSelectedDrawerOrder(order)}
                                                        className={`h-14 transition-colors duration-150 cursor-pointer group ${isSelected ? 'bg-[#d4af37]/5' : 'hover:bg-white/[0.02]'}`}

                                                                    type="checkbox"

                                                                    onChange={() => toggleSelect(order.id)}

                                                                />
                                                                <button
                                                                    type="button"
                                                                    onClick={(e) => handleToggleUrgent(order, e)}
                                                                    className={`w-5 h-5 flex items-center justify-center text-xs transition-transform active:scale-125 cursor-pointer ${isUrgent ? 'text-[#d4af37]' : 'text-zinc-600 hover:text-zinc-400'}`}

                                                                >
                                                                    <i className={`fas fa-star ${isUrgent ? 'drop-shadow-[0_0_8px_rgba(212,175,55,0.6)]' : ''}`}></i>

                                                                        <span className="px-1.5 py-0.2 rounded bg-amber-500/20 border border-amber-500/40 text-[#d4af37] text-[9px] font-black uppercase">

                                                                    )}
                                                                </div>

                                                        <td className="px-3">

                                                                <span className="truncate">{chanBadge.label}</span>

                                                        <td className="px-3 min-w-[180px]">
                                                            <div className="flex flex-col">

                                                                            CÓ SX

                                                                </div>

                                                        </td>

                                                        <td className="px-3">
                                                            <div className="flex flex-col">
                                                                <span className={`text-xs font-mono font-medium ${isOverdue ? 'text-rose-400 font-bold' : 'text-zinc-300'}`}>
                                                                    {deadlineStr ? deadlineStr.slice(0, 10) : '---'}
                                                                </span>
                                                                {isOverdue && (
                                                                    <span className="text-[9px] text-rose-400 font-black uppercase">Trễ SLA</span>

                                                            </div>

                                                        {/* Trạng thái */}
                                                        <td className="px-3">

                                                                <span className="truncate">{order.status || 'Chờ Sản Xuất'}</span>

                                                                    {formatMoneySafe(order.revenue)}đ

                                                                    <i className="fas fa-box text-zinc-500 text-[10px]"></i>
                                                                    <span>{itemCount} món</span>
                                                                </span>

                                                        {/* Thao tác */}
                                                        <td className="px-3 text-center" onClick={e => e.stopPropagation()}>
                                                            <div className="flex items-center justify-center gap-1">

                                                                    type="button"
                                                                    onClick={() => setSelectedDrawerOrder(order)}
                                                                    className="w-7 h-7 rounded-lg bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 hover:text-white flex items-center justify-center text-xs transition-colors cursor-pointer"
                                                                    title="Xem chi tiết đơn hàng"
                                                                >
                                                                    <i className="fas fa-eye"></i>
                                                                </button>

                                                                    type="button"
                                                                    onClick={(e) => handlePrintShippingLabel(order, e)}

                                                                >
                                                                    <i className="fas fa-print"></i>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
