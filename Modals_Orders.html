<script type="text/babel">
    // =========================================================================
    // 📦 FILE: Modals_Orders.txt
    // CHỨC NĂNG: Các khối giao diện phức tạp dành riêng cho nghiệp vụ Đơn Hàng
    // BAO GỒM: Trạm bơm Excel, Form Tạo đơn thông minh, Thẻ hiển thị đơn hàng (OrderCard)
    // =========================================================================

    const showCopyModal = (msg) => {
        const overlay = document.createElement('div');
        overlay.className = 'fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in';

        const box = document.createElement('div');
        box.className = 'bg-[#141414] border border-[#333] w-full max-w-sm rounded-[24px] p-5 shadow-2xl flex flex-col gap-4 text-center';

        const icon = document.createElement('div');
        icon.className = 'w-12 h-12 mx-auto bg-blue-500/20 text-blue-500 rounded-full flex items-center justify-center text-xl mb-1';
        icon.innerHTML = '<i class="fas fa-paper-plane"></i>';

        const text = document.createElement('div');
        text.className = 'text-[13px] text-gray-200 bg-[#0a0a0a] border border-[#222] p-4 rounded-xl leading-relaxed text-left';
        text.innerText = msg;

        const btn = document.createElement('button');
        btn.className = 'w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95 text-[12px]';
        btn.innerHTML = '📋 COPY ĐỂ GỬI KHÁCH';

        btn.onclick = () => {
            navigator.clipboard.writeText(msg).then(() => {
                btn.innerHTML = '✅ Đã Copy!';
                btn.className = 'w-full py-3 bg-emerald-500 text-white font-black rounded-xl uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-lg text-[12px]';
                setTimeout(() => {
                    if (document.body.contains(overlay)) document.body.removeChild(overlay);
                }, 1500);
            }).catch(err => {
                alert('Lỗi copy: ' + err);
            });
        };

        const closeBtn = document.createElement('button');
        closeBtn.className = 'absolute top-3 right-3 w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center';
        closeBtn.innerHTML = '<i class="fas fa-times"></i>';
        closeBtn.onclick = () => document.body.removeChild(overlay);

        box.style.position = 'relative';
        box.appendChild(closeBtn);
        box.appendChild(icon);
        box.appendChild(text);
        box.appendChild(btn);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    };
    const parseCoverFromNote = (noteStr) => {
        if (!noteStr || noteStr.indexOf('Cover:') === -1) return { coverUrl: null, cleanNote: noteStr || '' };
        const parts = noteStr.split('|');
        const cleanParts = [];
        let coverUrl = null;
        for (let k = 0; k < parts.length; k++) {
            const p = parts[k].trim();
            if (p.indexOf('Cover:') === 0) {
                coverUrl = p.replace('Cover:', '').trim();
            } else if (p) {
                cleanParts.push(p);
            }
        }
        return { coverUrl, cleanNote: cleanParts.join(' | ').trim() };
    };

    function SafeCoverImagePreview({ file, fallbackUrl }) {
        const [previewUrl, setPreviewUrl] = React.useState('');

        React.useEffect(() => {
            if (file && typeof URL !== 'undefined' && URL.createObjectURL) {
                const url = URL.createObjectURL(file);
                setPreviewUrl(url);
                return () => {
                    try { URL.revokeObjectURL(url); } catch (e) {}
                };
            } else {
                setPreviewUrl(fallbackUrl || '');
            }
        }, [file, fallbackUrl]);

        if (!previewUrl) return null;

        return (
            <div className="mt-1 w-12 h-12 rounded bg-black overflow-hidden border border-[#10b981]/50">
                <img src={previewUrl} className="w-full h-full object-cover" alt="Cover Preview" />
            </div>
        );
    }

    // ==========================================
    // 1. MODAL BƠM ĐƠN EXCEL (TÍCH HỢP AI QUÉT KHO & BƠM LỆNH XƯỞNG + CHỐNG CRASH)
    // ==========================================
    function BulkImportModal({ onClose, pushDeltas, existingOrders, products, existingProdItems }) {
        const [preview, setPreview] = React.useState([]);
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [isDragging, setIsDragging] = React.useState(false);
        const [fileName, setFileName] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [progress, setProgress] = React.useState(0);

        const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ') : new Date().toISOString().slice(0, 16).replace('T', ' ');

        const catalogIndex = React.useMemo(() => {
            const list = products || [];
            const skuExactMap = new Map();
            const skuCleanMap = new Map();
            const nameExactMap = new Map();
            const nameCleanMap = new Map();
            const sortedProds = [...list].sort((a, b) => String(b.name || '').length - String(a.name || '').length);

            // Pre-index cho từng sản phẩm (tính toán 1 lần duy nhất, tránh tính lại hàng triệu lần trong loop)
            const indexedProds = list.map(p => {
                const pSku = String(p.sku || '').trim().toUpperCase();
                const pName = String(p.name || '').trim().toUpperCase();
                const pSkuClean = pSku.replace(/[^A-Z0-9]/g, '');
                const pNameClean = pName.replace(/[^A-Z0-9]/g, '');
                const pFull = `${pSku.toLowerCase()} ${pName.toLowerCase()}`;
                const pClean = pFull.replace(/[^a-z0-9]/g, '');
                const normPName = pName.toLowerCase().replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ\s]/gi, ' ').replace(/\s+/g, ' ');

                if (pSku) {
                    skuExactMap.set(pSku, p);
                    if (pSkuClean) skuCleanMap.set(pSkuClean, p);
                }
                if (pName) {
                    nameExactMap.set(pName, p);
                    if (pNameClean) nameCleanMap.set(pNameClean, p);
                }

                return {
                    product: p,
                    pSku: pSku.toLowerCase(),
                    pName: pName.toLowerCase(),
                    pFull,
                    pClean,
                    normPName
                };
            });

            return { skuExactMap, skuCleanMap, nameExactMap, nameCleanMap, sortedProds, indexedProds };
        }, [products]);

        const matchProductFromCatalog = React.useCallback((targetSku, rawFullName, pName, pVar, parentSku) => {
            if (!products || !Array.isArray(products) || products.length === 0) return null;

            // 0. TRA CỨU NHANH TỪ BẢNG NHỚ ÁNH XẠ SKU (SKU ALIAS MEMORY)
            try {
                const rawAliases = localStorage.getItem('rf_sku_alias_map');
                if (rawAliases) {
                    const aliasMap = JSON.parse(rawAliases);
                    const searchKeys = [targetSku, parentSku, pVar, pName, rawFullName].filter(Boolean);
                    for (const k of searchKeys) {
                        const cleanK = String(k).trim();
                        const mappedSkuOrName = aliasMap[cleanK] || aliasMap[cleanK.toUpperCase()];
                        if (mappedSkuOrName) {
                            const found = (products || []).find(p => p.sku === mappedSkuOrName || p.name === mappedSkuOrName || (p.sku && p.sku.toUpperCase() === String(mappedSkuOrName).toUpperCase()));
                            if (found) return found;
                        }
                    }
                }
            } catch (e) { }

            // 1. TẬP HỢP TẤT CẢ SKU ỨNG VIÊN THEO THỨ TỰ ƯU TIÊN CAO ĐẾN THẤP
            const candidateSkus = [];

            const pushCandidate = (val) => {
                if (!val) return;
                const s = String(val).trim();
                if (!s || ['n/a', 'none', 'null', '-', 'undefined'].includes(s.toLowerCase())) return;
                if (!candidateSkus.includes(s)) candidateSkus.push(s);
            };

            const addCandidate = (val) => {
                if (!val) return;
                const s = String(val).trim();
                if (!s || ['n/a', 'none', 'null', '-', 'undefined'].includes(s.toLowerCase())) return;
                pushCandidate(s);

                // TỰ ĐỘNG CHUẨN HOÁ SANG HỆ SKU MỚI CỦA XƯỞNG (KHÔNG ĐỆ QUY)
                const normUpper = s.toUpperCase().replace(/\s+/g, '');
                
                // A. Nhóm Layout: RUN020-402325, BON01, NAT-011, CV202020, TRA-001... -> LAY-RUN020-402325, LAY-BON001-302020, LAY-STD001-202020-ST-02
                const layMatch = normUpper.match(/^(?:LAY[-_]?)?(BON|RUN|CAU|HAN|VAC|DAO|NAT|TRU|HEM|VOM|CV|TRA|STD)[-_]?0*(\d{1,3})?[-_]?(\d{5,6})?$/i);
                if (layMatch) {
                    const code = layMatch[1];
                    const ver = layMatch[2] ? ('000' + parseInt(layMatch[2], 10)).slice(-3) : '';
                    const size = layMatch[3] || '';
                    if (code === 'CV') {
                        if (size) pushCandidate(`LAY-CV-${size}`);
                        pushCandidate(`LAY-CV`);
                    } else if (code === 'TRA') {
                        if (ver && size) pushCandidate(`LAY-TRA${ver}-${size}`);
                        if (ver) pushCandidate(`LAY-TRA${ver}`);
                        if (size) pushCandidate(`LAY-STD001-${size}-ST-02`);
                        pushCandidate(`LAY-STD001-202020-ST-02`);
                    } else {
                        if (ver && size) pushCandidate(`LAY-${code}${ver}-${size}`);
                        if (ver) pushCandidate(`LAY-${code}${ver}`);
                    }
                }

                // B. Nhóm Bể kính (Hỗ trợ cả kích thước 5 chữ số: 20208 -> 20x20x8 và 6 chữ số: 302020, 202008):
                // Dạng 1: BEND301818, BEND20208, BETTA201012, TERA121221, BC301422, BEDUC301720, BE302020, BE20208
                const beMatch = normUpper.match(/^(?:BE[-_]?)?(ND|BETTA|TERA|BC|MINI|STD|DUC)?[-_]?(\d{5,6})$/i);
                if (beMatch) {
                    const sub = beMatch[1] || 'STD';
                    const sizeRaw = beMatch[2];
                    let sizePad = sizeRaw;
                    let d = '', r = '', c = '';
                    if (sizeRaw.length === 5) {
                        d = sizeRaw.substring(0, 2);
                        r = sizeRaw.substring(2, 4);
                        c = sizeRaw.substring(4);
                        sizePad = `${d}${r}0${c}`;
                    } else if (sizeRaw.length === 6) {
                        d = sizeRaw.substring(0, 2);
                        r = sizeRaw.substring(2, 4);
                        c = sizeRaw.substring(4, 6);
                    }
                    const sizeClean = (c && c.startsWith('0') && parseInt(c, 10) < 10) ? `${d}${r}${parseInt(c, 10)}` : sizeRaw;

                    [sub, 'ND', 'BC', 'MINI', 'STD', 'BETTA', 'TERA', 'DUC'].forEach(st => {
                        pushCandidate(`BE-${st}-${sizePad}`);
                        pushCandidate(`BE-${st}-${sizeClean}`);
                        if (d && r && c) pushCandidate(`BE-${st}-${d}X${r}X${parseInt(c, 10)}`);
                    });
                    pushCandidate(`BE${sizeRaw}${sub}`);
                    pushCandidate(`BE${sizePad}${sub}`);
                    pushCandidate(`BE${sizeClean}${sub}`);
                }

                // Dạng 2: BE301818ND, BE20208ND, BE202008ND, BE201012BETTA, BE121221TERA, BE301422BC, BE301720DUC
                const beMatch2 = normUpper.match(/^(?:BE[-_]?)?(\d{5,6})[-_]?(ND|BETTA|TERA|BC|MINI|STD|DUC)$/i);
                if (beMatch2) {
                    const sizeRaw = beMatch2[1];
                    const sub = beMatch2[2] || 'STD';
                    let sizePad = sizeRaw;
                    let d = '', r = '', c = '';
                    if (sizeRaw.length === 5) {
                        d = sizeRaw.substring(0, 2);
                        r = sizeRaw.substring(2, 4);
                        c = sizeRaw.substring(4);
                        sizePad = `${d}${r}0${c}`;
                    } else if (sizeRaw.length === 6) {
                        d = sizeRaw.substring(0, 2);
                        r = sizeRaw.substring(2, 4);
                        c = sizeRaw.substring(4, 6);
                    }
                    const sizeClean = (c && c.startsWith('0') && parseInt(c, 10) < 10) ? `${d}${r}${parseInt(c, 10)}` : sizeRaw;

                    [sub, 'ND', 'BC', 'MINI', 'STD', 'BETTA', 'TERA', 'DUC'].forEach(st => {
                        pushCandidate(`BE-${st}-${sizePad}`);
                        pushCandidate(`BE-${st}-${sizeClean}`);
                        if (d && r && c) pushCandidate(`BE-${st}-${d}X${r}X${parseInt(c, 10)}`);
                    });
                    pushCandidate(`BE${sizeRaw}${sub}`);
                    pushCandidate(`BE${sizePad}${sub}`);
                    pushCandidate(`BE${sizeClean}${sub}`);
                }

                // C. Nhóm Phụ kiện & Nguyên vật liệu: XBL500, DALONGVU, AKADAMA, CLEARWATER, CAMCA-18G, BANGDINHXOP, SANM...
                const cleanSlug = s.toUpperCase().replace(/^(?:PK[-_]|NL[-_]|VT[-_]|DG[-_]|SP[-_]|PRD[-_])+/i, '').replace(/[^A-Z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
                if (cleanSlug && cleanSlug.length >= 2) {
                    ['PK-LOC-', 'PK-VLL-', 'PK-NEN-', 'PK-XLN-', 'PK-AN-', 'PK-KHAC-', 'VT-', 'DG-', 'NL-LAY-', 'NL-BE-'].forEach(pfx => {
                        pushCandidate(`${pfx}${cleanSlug}`);
                    });
                    const alphaNumMatch = cleanSlug.match(/^([A-Z]+)(\d+|[A-Z])$/);
                    if (alphaNumMatch) {
                        const splitSlug = `${alphaNumMatch[1]}-${alphaNumMatch[2]}`;
                        ['PK-LOC-', 'PK-VLL-', 'PK-NEN-', 'PK-XLN-', 'PK-AN-', 'PK-KHAC-', 'VT-', 'DG-', 'NL-LAY-', 'NL-BE-'].forEach(pfx => {
                            pushCandidate(`${pfx}${splitSlug}`);
                        });
                        pushCandidate(splitSlug);
                    }
                }
            };

            // Ưu tiên 1: Target SKU / Cột R (SKU Reference No. / Mã SKU phân loại hàng từ Excel)
            addCandidate(targetSku);

            // Ưu tiên 1b: Trích xuất SKU trong dấu ngoặc vuông [...] từ Tên phân loại hoặc Tên sản phẩm Shopee
            const textToScan = [pVar, pName, rawFullName].filter(Boolean);
            textToScan.forEach(txt => {
                const bracketMatches = String(txt).match(/\[(.*?)\]/g);
                if (bracketMatches) {
                    bracketMatches.forEach(bStr => {
                        const content = bStr.replace(/[\[\]]/g, '').trim();
                        const parts = content.split(/\s+/).filter(Boolean);
                        for (let k = parts.length - 1; k >= 0; k--) {
                            addCandidate(parts[k]);
                        }
                        addCandidate(content);
                    });
                }
                const regexSkuMatches = String(txt).match(/\b[A-Z0-9]{2,10}[-_][A-Z0-9]+([-_][A-Z0-9]+)*\b/gi);
                if (regexSkuMatches) {
                    regexSkuMatches.forEach(rSku => addCandidate(rSku));
                }
            });

            // Ưu tiên 2: Parent SKU / SKU sản phẩm cha (Cột P từ 'Parent SKU Reference No.' hoặc 'Mã SKU người bán')
            addCandidate(parentSku);

            // 2. TRA CỨU KHỚP TUYỆT ĐỐI THEO SKU ỨNG VIÊN (O(1) Fast Map Lookup)
            for (const cand of candidateSkus) {
                const candUpper = String(cand).trim().toUpperCase();
                if (catalogIndex.skuExactMap.has(candUpper)) {
                    return catalogIndex.skuExactMap.get(candUpper);
                }
                const candClean = candUpper.replace(/[^A-Z0-9]/g, '');
                if (candClean.length >= 3 && catalogIndex.skuCleanMap.has(candClean)) {
                    return catalogIndex.skuCleanMap.get(candClean);
                }
            }

            // 3. BÓC TÁCH MÃ LAYOUT / MÃ SẢN PHẨM & QUY CÁCH KÍCH THƯỚC (POKA-YOKE)
            const fullText = (rawFullName || '').trim().toLowerCase();
            const varText = (pVar || '').trim().toLowerCase();
            const comboText = `${fullText} ${varText}`;

            // Bóc tách kích thước 3 chiều D x R x C (VD: 20x20x8cm, 20x20x8, 30x20x20, 40x23x25) hoặc Cubic (Cubic 20, Cubic 30...)
            let targetDimVariants = [];
            const dimMatch = comboText.match(/(\d{1,3})\s*[*xX×_]\s*(\d{1,3})\s*[*xX×_]\s*(\d{1,3})/);
            if (dimMatch) {
                const d = dimMatch[1];
                const r = dimMatch[2];
                const c = dimMatch[3];
                const dPad = d.padStart(2, '0');
                const rPad = r.padStart(2, '0');
                const cPad = c.padStart(2, '0');
                targetDimVariants = [
                    `${dPad}${rPad}${cPad}`,       // 202008 / 302020
                    `${d}${r}${c}`,               // 20208 / 302020
                    `${d}x${r}x${c}`,             // 20x20x8
                    `${dPad}x${rPad}x${cPad}`,     // 20x20x08
                    `${d}*${r}*${c}`
                ];
            } else {
                const cubicMatch = comboText.match(/\bcubic\s*(\d{1,3})\b/i);
                if (cubicMatch) {
                    const cVal = cubicMatch[1];
                    const cPad = cVal.padStart(2, '0');
                    targetDimVariants = [
                        `${cPad}${cPad}${cPad}`,       // 202020 / 303030
                        `${cVal}${cVal}${cVal}`,
                        `${cVal}x${cVal}x${cVal}`,
                        `${cPad}x${cPad}x${cPad}`,
                        `${cVal}*${cVal}*${cVal}`
                    ];
                }
            }

            const detectSizeClass = (str) => {
                const s = String(str || '').toLowerCase();
                // Chỉ nhận diện Size M/S/L/XL khi KHÔNG có 3 chiều kích thước dị biệt đi kèm (như 20x20x8)
                if (/\b(402325|40x23x25|40\s*23\s*25|size\s*l|ไซส์\s*l|ขนาด\s*l|[\-_]l\b)/i.test(s) || (/\b40x23\b/i.test(s) && !/40x23x/i.test(s))) return 'L';
                if (/\b(302020|30x20x20|30\s*20\s*20|size\s*m|ไซส์\s*m|ขนาด\s*m|[\-_]m\b)/i.test(s) || (/\b30x20\b/i.test(s) && !/30x20x/i.test(s))) return 'M';
                if (/\b(202020|20x20x20|20\s*20\s*20|cubic\s*20|size\s*s|ไซส์\s*s|ขนาด\s*s|[\-_]s\b)/i.test(s) || (/\b20x20\b/i.test(s) && !/20x20x/i.test(s))) return 'S';
                if (/\b(503030|50x30x30|50\s*30\s*30|size\s*xl|ไซส์\s*xl|ขนาด\s*xl|[\-_]xl\b)/i.test(s) || (/\b50x30\b/i.test(s) && !/50x30x/i.test(s))) return 'XL';
                if (/\b(603036|60x30x36|60\s*30\s*36)\b/i.test(s)) return '603036';
                if (/\b(604040|60x40x40|60\s*40\s*40)\b/i.test(s)) return '604040';
                if (/\b(804040|80x40x40|80\s*40\s*40)\b/i.test(s)) return '804040';
                if (/\b(904545|90x45x45|90\s*45\s*45)\b/i.test(s)) return '904545';
                if (/\b(1005050|100x50x50|100\s*50\s*50)\b/i.test(s)) return '1005050';
                if (/\b(1205050|120x50x50|120\s*50\s*50)\b/i.test(s)) return '1205050';
                return null;
            };

            const targetSizeClass = (!dimMatch && targetDimVariants.length === 0) ? detectSizeClass(comboText) : null;

            // Bóc tách Version và Model (VD: "RUN-020-402325" hoặc "Ver.20" -> Code: RUN, Ver: 20)
            let detectedVer = null;
            const verMatch = (candidateSkus.join(' ') + ' ' + comboText).match(/(?:ver\.?|v|run[-_]?|nat[-_]?|cv[-_]?)\s*0*(\d+)/i);
            if (verMatch) detectedVer = parseInt(verMatch[1], 10);

            // Bóc tách Category / Family (Rừng, Nature, Bể kính, Nâng đáy, Bán cạn, Trăng...)
            const isRunFamily = /(run|rừng|rung|เค้าโครงป่า)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isNatFamily = /(nat|nature|tự nhiên)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isTraFamily = /(trang|trăng|tra[-_]|layout\s*trăng)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isBkFamily = /(bk|be|bể|kính|hồ kính|hồ cá|tู้ปลา)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isNdFamily = /(nâng\s*đáy|nang\s*day|[\-_]nd\b|nd)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isBettaFamily = /(betta|xiêm|chọi)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isTeraFamily = /(tera|terrarium|bán\s*cạn|ban\s*can|bc)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isCvFamily = /(cv|cover)/i.test(candidateSkus.join(' ') + ' ' + comboText);

            // Tìm sản phẩm khớp theo Family + Ver + Size qua indexedProds (siêu tốc, không sort lại)
            let bestProduct = null;
            let highestScore = 0;

            for (let i = 0; i < catalogIndex.indexedProds.length; i++) {
                const item = catalogIndex.indexedProds[i];
                let score = 0;

                // Match version
                if (detectedVer !== null) {
                    const pVerMatch = item.pFull.match(/(?:ver\.?|v|run[-_]?|nat[-_]?|cv[-_]?)\s*0*(\d+)/i) || item.pFull.match(/\b0*(\d+)\b/);
                    if (pVerMatch && parseInt(pVerMatch[1], 10) === detectedVer) {
                        score += 50;
                    }
                }

                // Match family
                if (isRunFamily && (item.pFull.includes('rừng') || item.pFull.includes('run'))) score += 30;
                if (isNatFamily && (item.pFull.includes('nature') || item.pFull.includes('nat'))) score += 30;
                if (isTraFamily && (item.pFull.includes('trăng') || item.pFull.includes('trang') || item.pFull.includes('tra'))) score += 45;
                if (isBkFamily && (item.pFull.includes('bể') || item.pFull.includes('kính') || item.pFull.includes('bk') || item.pFull.includes('be'))) score += 30;
                if (isNdFamily && (item.pFull.includes('nâng đáy') || item.pFull.includes('nd'))) score += 40;
                if (isBettaFamily && (item.pFull.includes('betta'))) score += 40;
                if (isTeraFamily && (item.pFull.includes('tera') || item.pFull.includes('bán cạn') || item.pFull.includes('bc'))) score += 40;
                if (isCvFamily && (item.pFull.includes('cover') || item.pFull.includes('cv'))) score += 30;

                // Match size / dimensions chính xác
                if (targetDimVariants.length > 0) {
                    const matchedDim = targetDimVariants.some(dv => item.pFull.includes(dv.toLowerCase()) || item.pClean.includes(dv.toLowerCase().replace(/[^a-z0-9]/g, '')));
                    if (matchedDim) {
                        score += 80;
                    }
                } else if (targetSizeClass) {
                    const pSize = detectSizeClass(item.pFull);
                    if (pSize === targetSizeClass) score += 40;
                }

                // Candidate SKU substring match
                for (const cand of candidateSkus) {
                    const candClean = cand.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (candClean.length >= 3 && item.pClean.includes(candClean)) {
                        score += 60;
                    }
                    if (cand.toLowerCase() === item.pSku) {
                        score += 100;
                    }
                }

                if (score > highestScore && score >= 50) {
                    highestScore = score;
                    bestProduct = item.product;
                }
            }

            if (bestProduct) {
                return bestProduct;
            }

            // 4. NẾU KHÔNG CÓ SKU NÀO KHỚP -> DÙNG THUẬT TOÁN TÊN SẢN PHẨM (FALLBACK)

                    String(matchedItem.name || '').toLowerCase().includes('layout') || String(matchedItem.name || '').toLowerCase().includes('rừng') ||

            if (iVarSku === -1 || iVarSku === iParentSku) {

            let iShipping = findCol(['shipping option', 'vận chuyển', 'đơn vị vận chuyển', 'ตัวเลือกการจัดส่ง', 'shipping channel', 'logistic channel']);

            let iFeeFixed = findCol(['phí cố định', 'ค่าธรรมเนียมคอมมิชชัน', 'commission fee']);
            let iFeeService = findCol(['phí dịch vụ', 'ค่าบริการ', 'ค่าธรรมเนียมการขาย', 'service fee']);

            let iFeeAffiliate = findCol(['phí hoa hồng tiếp thị', 'phí tiếp thị liên kết', 'ค่าคอมมิชชั่นพันธมิตร', 'affiliate fee', 'ams commission fee']);

            let iStatus = findCol(['trạng thái đơn hàng', 'order status', 'status', 'สถานะการสั่งซื้อ', 'order_status']); // Lấy duy nhất cột trạng thái chính để tránh rác chuỗi
            let iNote = findCol([

            ]);

            // --- HỆ THỐNG TRA CỨU ĐƠN CŨ ĐA TẦNG (MULTI-TIER DEDUPLICATION POOL) ---
            const cleanRawCode = (val) => {
                if (val === undefined || val === null) return '';
                let s = String(val).trim();
                if (s.toLowerCase() === 'none' || s.toLowerCase() === 'null' || s === '-' || s === 'n/a') return '';

                    .replace(/[\r\n\t\u00A0'"`=]/g, '')
                    .replace(/^(mã\s*đơn\s*hàng|mã\s*đơn|order\s*id|order\s*sn|mvđ|mvd)[\s:]+/gi, '')

            const toAlphaNum = (val) => cleanRawCode(val).replace(/[^a-zA-Z0-9]/g, '').toLowerCase();

            // Tổng hợp toàn bộ nguồn đơn hàng trong hệ thống (chống sót do lệch prop)
            const combinedOrdersPool = [];
            const seenPoolIds = new Set();
            const addOrderToPool = (ord) => {
                if (!ord) return;
                const ordId = ord.id ? String(ord.id) : (ord.orderCode ? String(ord.orderCode) : null);
                if (ordId && !seenPoolIds.has(ordId)) {
                    seenPoolIds.add(ordId);
                    combinedOrdersPool.push(ord);
                }
            };
            (existingOrders || []).forEach(addOrderToPool);
            if (typeof window !== 'undefined') {
                (window.GLOBAL_ALL_ORDERS || []).forEach(addOrderToPool);
                (window.ALL_ORDERS || []).forEach(addOrderToPool);
                if (window.erpData && window.erpData.Orders) (window.erpData.Orders || []).forEach(addOrderToPool);
            }

            const existingByCodeMap = new Map();
            const existingByTrackMap = new Map();
            const existingByIdMap = new Map();
            const existingByAlphaMap = new Map();

            combinedOrdersPool.forEach(o => {
                if (!o) return;
                const rawCode = String(o.orderCode || '').trim();
                const rawId = String(o.id || '').trim();
                const rawShipping = String(o.shippingCode || '').trim();
                
                // Tách phần mã đơn và mã vận đơn nếu có dấu gạch đứng '|'
                let basePart = rawCode;
                let trackPart = rawShipping;
                if (rawCode.includes('|')) {
                    const splitParts = rawCode.split('|');
                    basePart = splitParts[0].trim();
                    if (!trackPart) {
                        trackPart = splitParts.slice(1).join('|').replace(/^(?:MVĐ|MVD|Tracking)[\s:]*/i, '').trim();
                    }
                } else if (rawCode.includes(' - ')) {
                    const splitParts = rawCode.split(' - ');
                    basePart = splitParts[0].trim();
                }

                const cBase = cleanRawCode(basePart);
                const cTrack = cleanRawCode(trackPart);
                const cFull = cleanRawCode(rawCode);
                const cId = cleanRawCode(rawId);
                const cShip = cleanRawCode(rawShipping);

                if (cBase) existingByCodeMap.set(cBase.toLowerCase(), o);
                if (cFull) existingByCodeMap.set(cFull.toLowerCase(), o);
                if (cTrack) existingByTrackMap.set(cTrack.toLowerCase(), o);
                if (cShip) existingByTrackMap.set(cShip.toLowerCase(), o);
                if (cId) existingByIdMap.set(cId.toLowerCase(), o);

                const aBase = toAlphaNum(cBase);
                const aTrack = toAlphaNum(cTrack);
                const aFull = toAlphaNum(cFull);
                const aId = toAlphaNum(cId);
                const aShip = toAlphaNum(cShip);

                if (aBase) existingByAlphaMap.set(aBase, o);
                if (aTrack) existingByAlphaMap.set(aTrack, o);
                if (aFull) existingByAlphaMap.set(aFull, o);
                if (aId) existingByAlphaMap.set(aId, o);
                if (aShip) existingByAlphaMap.set(aShip, o);
            });

            // Hàm tra cứu so khớp đơn hàng cũ tuyệt đối (Exact + Alphanumeric + Substring)
            const findExistingOrder = (inOCode, inTCode) => {
                const cO = cleanRawCode(inOCode);
                const cT = cleanRawCode(inTCode);
                const aO = toAlphaNum(cO);
                const aT = toAlphaNum(cT);

                // 1. So khớp chính xác mã đơn gốc
                if (cO && existingByCodeMap.has(cO.toLowerCase())) return existingByCodeMap.get(cO.toLowerCase());
                if (aO && existingByAlphaMap.has(aO)) return existingByAlphaMap.get(aO);

                // 2. So khớp theo mã vận đơn
                if (cT && existingByTrackMap.has(cT.toLowerCase())) return existingByTrackMap.get(cT.toLowerCase());
                if (aT && existingByAlphaMap.has(aT)) return existingByAlphaMap.get(aT);

                // 3. So khớp chéo: oCode gửi lên thực chất là mã vận đơn hoặc ngược lại
                if (cO && existingByTrackMap.has(cO.toLowerCase())) return existingByTrackMap.get(cO.toLowerCase());
                if (cT && existingByCodeMap.has(cT.toLowerCase())) return existingByCodeMap.get(cT.toLowerCase());

                // 4. So khớp theo ID đơn hàng
                if (cO && existingByIdMap.has(cO.toLowerCase())) return existingByIdMap.get(cO.toLowerCase());

                // 5. So khớp chuỗi con an toàn cho mã đơn dài (>= 12 ký tự)
                if (aO && aO.length >= 12) {
                    for (const [key, ord] of existingByAlphaMap.entries()) {
                        if (key.length >= 12 && (key === aO || key.includes(aO) || aO.includes(key))) {
                            return ord;
                        }
                    }
                }
                if (aT && aT.length >= 10) {
                    for (const [key, ord] of existingByAlphaMap.entries()) {
                        if (key.length >= 10 && (key === aT || key.includes(aT) || aT.includes(key))) {
                            return ord;
                        }
                    }
                }
                return null;
            };

            const orderMap = {};
            const totalRows = rows.length; const BATCH_SIZE = 300; let currentIndex = headerIdx + 1;

            const processBatch = () => {
                try {
                    const endIndex = Math.min(currentIndex + BATCH_SIZE, totalRows);
                for (let i = currentIndex; i < endIndex; i++) {
                    const cols = rows[i];
                    if (iCode < 0 || !cols[iCode]) continue;
                    let rawOrderCode = String(cols[iCode]).trim();
                    const oCode = cleanRawCode(rawOrderCode);
                    if (!oCode || oCode.toLowerCase().includes('mã đơn') || oCode.toLowerCase().includes('platform unique')) continue;
                    let rawTrack = (iTrack >= 0 && cols[iTrack] !== undefined && cols[iTrack] !== null) ? String(cols[iTrack]).trim() : '';
                    if (rawTrack.toLowerCase() === 'none' || rawTrack.toLowerCase() === 'null' || rawTrack === '-' || rawTrack === 'n/a') {
                        rawTrack = '';
                    }
                    const tCode = cleanRawCode(rawTrack);
                    const finalOrderCode = tCode ? `${oCode} | MVĐ: ${tCode}` : oCode;
                    const varSku = (iVarSku >= 0 && cols[iVarSku]) ? String(cols[iVarSku]).trim() : '';
                    const parentSku = (iParentSku >= 0 && cols[iParentSku]) ? String(cols[iParentSku]).trim() : '';
                    const targetSku = varSku || parentSku;

                    let customerName = 'Khách';
                    if (iBuyer >= 0 && cols[iBuyer]) {
                        customerName = String(cols[iBuyer]).trim();
                    } else if (iRecipient >= 0 && cols[iRecipient]) {
                        customerName = String(cols[iRecipient]).trim();
                    }

                    const parseMoneyVal = (raw) => {
                        if (raw === null || raw === undefined || raw === '') return 0;
                        if (typeof raw === 'number') return isNaN(raw) ? 0 : raw;
                        let s = String(raw).trim();
                        // Loại bỏ toàn bộ ký tự tiền tệ: ฿, THB, RM, MYR, ₱, PHP, SGD, S$, $, NT$, TWD, đ, Đ, VND, VNĐ và khoảng trắng
                        s = s.replace(/[đĐ\s฿$₱]/gi, '')
                             .replace(/THB|VND|VNĐ|MYR|RM|SGD|PHP|TWD|USD/gi, '')
                             .trim();
                        if (!s) return 0;
                        
                        // Nếu có dấu phẩy ngăn cách hàng nghìn chuẩn quốc tế (Mỹ, Thái Lan, Sing...): 1,250.50 -> 1250.50
                        if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) {
                            s = s.replace(/,/g, '');
                        } 
                        // Nếu có dấu chấm ngăn cách hàng nghìn chuẩn Việt Nam: 1.250.000 -> 1250000
                        else if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) {
                            s = s.replace(/\./g, '').replace(/,/g, '.');
                        }
                        // Nếu chỉ có dấu phẩy thập phân: 250,50 -> 250.50
                        else if (s.includes(',') && !s.includes('.')) {
                            s = s.replace(/,/g, '.');
                        }
                        
                        const num = parseFloat(s);
                        return isNaN(num) ? 0 : num;
                    };

                    let rowRevenue = (iRevenue >= 0 && cols[iRevenue]) ? parseMoneyVal(cols[iRevenue]) : 0;
                    if (rowRevenue === 0 && iUnitPrice >= 0 && cols[iUnitPrice]) {
                        const unitP = parseMoneyVal(cols[iUnitPrice]);
                        const qVal = (iQty >= 0 && cols[iQty]) ? (parseInt(cols[iQty], 10) || 1) : 1;
                        if (unitP > 0) rowRevenue = unitP * qVal;
                    }

                    let rowFeeFixed = (iFeeFixed >= 0 && cols[iFeeFixed]) ? Math.abs(parseMoneyVal(cols[iFeeFixed])) : 0;
                    let rowFeeService = (iFeeService >= 0 && cols[iFeeService]) ? Math.abs(parseMoneyVal(cols[iFeeService])) : 0;
                    let rowFeePayment = (iFeePayment >= 0 && cols[iFeePayment]) ? Math.abs(parseMoneyVal(cols[iFeePayment])) : 0;
                    let rowFeeAffiliate = (iFeeAffiliate >= 0 && cols[iFeeAffiliate]) ? Math.abs(parseMoneyVal(cols[iFeeAffiliate])) : 0;
                    let rowShopVoucher = (iShopVoucher >= 0 && cols[iShopVoucher]) ? Math.abs(parseMoneyVal(cols[iShopVoucher])) : 0;

                    let rawStatus = (iStatus >= 0 && cols[iStatus]) ? String(cols[iStatus]).trim() : '';

                    let rowChannel = detectedChannel;
                    if (iShipping >= 0 && cols[iShipping]) {
                        const shipOpt = String(cols[iShipping]).toUpperCase();
                        if (shipOpt.includes('VNMY') || shipOpt.includes('MALAYSIA') || shipOpt.includes(' (MY)') || shipOpt.includes('- MY') || shipOpt.includes('MY STANDARD')) rowChannel = 'Shopee MY';
                        else if (shipOpt.includes('VNSG') || shipOpt.includes('SINGAPORE') || shipOpt.includes(' (SG)') || shipOpt.includes('- SG') || shipOpt.includes('SG STANDARD')) rowChannel = 'Shopee SG';
                        else if (shipOpt.includes('VNTH') || shipOpt.includes('THAILAND') || shipOpt.includes(' (TH)') || shipOpt.includes('- TH') || shipOpt.includes('TH STANDARD')) rowChannel = 'Shopee TH';
                        else if (shipOpt.includes('VNPH') || shipOpt.includes('PHILIPPINES') || shipOpt.includes(' (PH)') || shipOpt.includes('- PH') || shipOpt.includes('PH STANDARD')) rowChannel = 'Shopee PH';
                        else if (shipOpt.includes('VNTW') || shipOpt.includes('TAIWAN') || shipOpt.includes(' (TW)') || shipOpt.includes('- TW') || shipOpt.includes('TW STANDARD')) rowChannel = 'Shopee TW';
                        else if (shipOpt.includes('INTERNATIONAL') || shipOpt.includes('QUỐC TẾ')) rowChannel = 'Shopee Quốc Tế';
                    }
                    if (tCode.startsWith('MY') || oCode.endsWith('MY4') || oCode.endsWith('MY5')) rowChannel = 'Shopee MY';
                    if (tCode.startsWith('SG') || oCode.endsWith('SG4') || oCode.endsWith('SG5')) rowChannel = 'Shopee SG';
                    if (tCode.startsWith('TH') || oCode.endsWith('TH4') || oCode.endsWith('TH5')) rowChannel = 'Shopee TH';
                    if (tCode.startsWith('TW') || oCode.endsWith('TW4') || oCode.endsWith('TW5')) rowChannel = 'Shopee TW';
                    if (tCode.startsWith('PH') || oCode.endsWith('PH4') || oCode.endsWith('PH5')) rowChannel = 'Shopee PH';

                    const upperOCode = oCode.toUpperCase();
                    const upperTCode = tCode.toUpperCase();
                    if (upperOCode.includes('VN') || upperTCode.startsWith('SPXVN') || upperTCode.includes('VN') || /^2\d{13,15}/.test(upperOCode)) {
                        rowChannel = 'Shopee VN';
                    } else if (/^57\d{16,18}/.test(oCode) || upperTCode.startsWith('TT') || upperOCode.includes('TIKTOK')) {
                        rowChannel = 'Tiktok Shop';
                    } else if (!rowChannel || rowChannel === 'Bán Lẻ') {
                        rowChannel = 'Shopee VN';
                    }

                    let exchangeRate = 1;
                    if (rowChannel === 'Shopee MY') {
                        exchangeRate = 5850; // 1 MYR ≈ 5,850 VNĐ
                    } else if (rowChannel === 'Shopee SG') {
                        exchangeRate = 19200; // 1 SGD ≈ 19,200 VNĐ
                    } else if (rowChannel === 'Shopee TH') {
                        exchangeRate = 715; // 1 THB ≈ 715 VNĐ
                        let lowerStatus = rawStatus.toLowerCase();
                        if (lowerStatus.includes('สำเร็จแล้ว')) rawStatus = 'Hoàn thành';
                        else if (lowerStatus.includes('จัดส่งแล้ว') || lowerStatus.includes('ได้รับสินค้าแล้ว')) rawStatus = 'Đã giao';
                        else if (lowerStatus.includes('คืนเงิน') || lowerStatus.includes('คืนสินค้า')) rawStatus = 'Trả hàng/Hoàn tiền';
                        else if (lowerStatus.includes('ยกเลิก rồi') || lowerStatus.includes('ยกเลิกแล้ว')) rawStatus = 'Đã hủy';
                    } else if (rowChannel === 'Shopee TW') {
                        exchangeRate = 810; // 1 TWD ≈ 810 VNĐ
                    } else if (rowChannel === 'Shopee PH') {
                        exchangeRate = 440; // 1 PHP ≈ 440 VNĐ
                    }

                    // Tự động quy đổi ngoại tệ sang VNĐ cho tất cả các sàn quốc tế
                    if (exchangeRate !== 1) {
                        rowRevenue = Math.round(rowRevenue * exchangeRate);
                        rowFeeFixed = Math.round(rowFeeFixed * exchangeRate);
                        rowFeeService = Math.round(rowFeeService * exchangeRate);
                        rowFeePayment = Math.round(rowFeePayment * exchangeRate);
                        rowFeeAffiliate = Math.round(rowFeeAffiliate * exchangeRate);
                        rowShopVoucher = Math.round(rowShopVoucher * exchangeRate);
                    } else {
                        rowRevenue = Math.round(rowRevenue);
                        rowFeeFixed = Math.round(rowFeeFixed);
                        rowFeeService = Math.round(rowFeeService);
                        rowFeePayment = Math.round(rowFeePayment);
                        rowFeeAffiliate = Math.round(rowFeeAffiliate);
                        rowShopVoucher = Math.round(rowShopVoucher);
                    }

                    let customerNote = (iNote >= 0 && cols[iNote]) ? String(cols[iNote]).trim() : '';

                    if (!orderMap[oCode]) {
                        orderMap[oCode] = {
                            orderCode: finalOrderCode,
                            channel: rowChannel,
                            customer: customerName,
                            note: customerNote,
                            isDuplicate: false,
                            isUpdate: false,
                            existingId: null,
                            revenue: rowRevenue,
                            feeFixed: rowFeeFixed,
                            feeService: rowFeeService,
                            feePayment: rowFeePayment,
                            feeAffiliate: rowFeeAffiliate,
                            shopVoucher: rowShopVoucher,
                            rawStatus: rawStatus,
                            rawDate: (() => {
                                if (iDate < 0 || cols[iDate] === undefined || cols[iDate] === null || cols[iDate] === '') return safeDateFull;
                                let rawVal = cols[iDate];
                                if (typeof rawVal === 'number' || (!isNaN(rawVal) && Number(rawVal) > 30000 && Number(rawVal) < 60000)) {
                                    try {
                                        const serial = Number(rawVal);
                                        const utcDays = Math.floor(serial - 25569);
                                        const dateInfo = new Date(utcDays * 86400 * 1000);
                                        const fractionalDay = serial - Math.floor(serial) + 0.0000001;
                                        let totalSeconds = Math.floor(86400 * fractionalDay);
                                        const seconds = totalSeconds % 60;
                                        totalSeconds -= seconds;
                                        const hours = Math.floor(totalSeconds / 3600);
                                        const minutes = Math.floor((totalSeconds % 3600) / 60);
                                        return `${dateInfo.getFullYear()}-${String(dateInfo.getMonth() + 1).padStart(2, '0')}-${String(dateInfo.getDate()).padStart(2, '0')} ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                                    } catch (e) { }
                                }
                                let dStr = String(rawVal).trim();
                                if (!dStr) return safeDateFull;
                                let parts = dStr.split(' ');
                                let dPart = parts[0];
                                let tPart = parts[1] || '12:00:00';
                                if (dPart.includes('/')) {
                                    let dParts = dPart.split('/');
                                    if (dParts.length >= 3) {
                                        if (dParts[2].length === 4) {
                                            dPart = `${dParts[2]}-${dParts[1].padStart(2, '0')}-${dParts[0].padStart(2, '0')}`;
                                        } else if (dParts[0].length === 4) {
                                            dPart = `${dParts[0]}-${dParts[1].padStart(2, '0')}-${dParts[2].padStart(2, '0')}`;
                                        }
                                    }
                                } else if (dPart.includes('-')) {
                                    let dParts = dPart.split('-');
                                    if (dParts.length >= 3 && dParts[0].length !== 4 && dParts[2].length === 4) {
                                        dPart = `${dParts[2]}-${dParts[1].padStart(2, '0')}-${dParts[0].padStart(2, '0')}`;
                                    }
                                }
                                return `${dPart} ${tPart}`;
                            })(),
                            items: []
                        };
                    } else {
                        if (customerNote && !orderMap[oCode].note) {
                            orderMap[oCode].note = customerNote;
                        }
                        if (orderMap[oCode].customer === 'Khách' && customerName !== 'Khách') {
                            orderMap[oCode].customer = customerName;
                        }
                        if (tCode && !orderMap[oCode].orderCode.includes(' | MVĐ: ')) {
                            orderMap[oCode].orderCode = `${oCode} | MVĐ: ${tCode}`;
                        }
                        // [REMOVED] Không cộng dồn rawStatus để Exact Match luôn chính xác với dòng đầu tiên của sản phẩm
                        const isItemLevel = ['đơn giá', 'deal price', 'giá bán deal', 'giá bán', 'original price'].some(k => headers[iRevenue] && headers[iRevenue].includes(k));
                        if (isItemLevel) {
                            orderMap[oCode].revenue += rowRevenue;
                            orderMap[oCode].feeFixed += rowFeeFixed;
                            orderMap[oCode].feeService += rowFeeService;

                else {

        // TỰ ĐỘNG NẠP THƯ VIỆN XLSX VÀ ĐỌC FILE LINH HOẠT (ARRAY BUFFER + BINARY FALLBACK)
        const handleFileUpload = async (file) => {
            if (!file) return;
            setFileName(file.name); setIsProcessing(true); setProgress(15); setPreview([]);
            try {
                if (typeof window.ensureXLSXLoaded === 'function') {
                    setProgress(25);
                    await window.ensureXLSXLoaded();
                } else if (!window.XLSX) {
                    throw new Error("Thư viện xử lý Excel chưa sẵn sàng. Vui lòng tải lại trang.");
                }
                setProgress(45);

                let buffer = null;
                // 1. Ưu tiên đọc trực tiếp qua Web API file.arrayBuffer() của trình duyệt hiện đại
                if (typeof file.arrayBuffer === 'function') {
                    try {
                        buffer = await file.arrayBuffer();
                    } catch (abErr) {
                        console.warn("file.arrayBuffer lỗi, chuyển sang FileReader:", abErr);
                    }
                }

                // 2. Fallback sang FileReader nếu file.arrayBuffer không khả dụng
                if (!buffer) {
                    buffer = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onerror = (err) => {
                            reject(new Error("Không thể truy cập tệp tin. Có thể file đang được mở trong Microsoft Excel hoặc ứng dụng khác. Vui lòng đóng Excel và thử chọn lại file!"));
                        };
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsArrayBuffer(file);
                    });
                }

                setProgress(65);
                let wb;
                const data = new Uint8Array(buffer);
                try {
                    wb = window.XLSX.read(data, { type: 'array' });
                } catch (errArr) {
                    console.warn("Lỗi đọc array buffer, fallback binary:", errArr);
                    const binData = await new Promise((resolve, reject) => {
                        const binReader = new FileReader();
                        binReader.onerror = (binErr) => reject(new Error("Không thể đọc tệp tin theo định dạng nhị phân."));
                        binReader.onload = (be) => resolve(be.target.result);
                        binReader.readAsBinaryString(file);
                    });
                    wb = window.XLSX.read(binData, { type: 'binary' });
                }

                let sheetName = wb.SheetNames.find(s => s.toLowerCase().trim() === 'orders');
                if (!sheetName) sheetName = wb.SheetNames[0];

                const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
                setProgress(80);
                processExcelData(rows);
            } catch (error) {
                console.error("Lỗi đọc file Excel:", error);
                alert(error.message || "Lỗi đọc file Excel! Vui lòng đảm bảo file không bị khóa bởi ứng dụng khác và đúng định dạng.");
                setFileName(''); 
                setIsProcessing(false); 
                setProgress(0);
            }
        };
