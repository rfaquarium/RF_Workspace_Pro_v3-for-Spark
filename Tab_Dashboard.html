// Component con xử lý render đồng hồ để tránh re-render toàn bộ Dashboard mỗi giây gây nóng máy và đơ giật
const RealtimeClock = React.memo(function RealtimeClock() {
    const [currentTime, setCurrentTime] = React.useState(new Date());
    React.useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
    }, []);
    
    const days = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    const day = days[currentTime.getDay()];
    const time = currentTime.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const dateStr = currentTime.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
    
    return <>{time} - {day}, {dateStr}</>;
});

const DashboardTab = React.memo(function DashboardTab({ reimbursements = [], orders = [], prodItems = [], attendance = [], packings = [], kpis = [], importExport = [], users = [], userConfigs = [], erpProducts = [], pushDeltas, triggerToast, erpData = {}, isAdmin = false, isBoss = false, documents = [] }) {
  const currentUser = localStorage.getItem('rf_user') || '';
  const currentRole = localStorage.getItem('rf_role') || '';
  const isSuperAdmin = isAdmin || isBoss || currentRole === 'TỐI CAO';
  // QUYỀN HẠN XEM BÁO CÁO TÀI CHÍNH
  const canSeeFinance = isBoss || ['KẾ TOÁN', 'KIỂM TOÁN', 'TỐI CAO'].includes(currentRole);
  const canSeeMoney = isBoss || ['KẾ TOÁN', 'TỐI CAO'].includes(currentRole);

  // ==================== ĐỒNG HỒ REALTIME CHÍNH XÁC ====================
  // Đã chuyển logic đồng hồ đếm giây ra component con <RealtimeClock /> để tránh re-render toàn bộ Dashboard mỗi giây.
  
  const [todayStr, setTodayStr] = React.useState(() => {
      const now = new Date();
      return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split('T')[0];
  });

  React.useEffect(() => {
      // Cập nhật ngày mới (todayStr) mỗi phút thay vì mỗi giây để tăng hiệu năng
      const timer = setInterval(() => {
          const now = new Date();
          const newDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split('T')[0];
          setTodayStr(prev => prev !== newDate ? newDate : prev);
      }, 60000);
      return () => clearInterval(timer);
  }, []);

  // ==================== KHUNG CHẤM CÔNG (MIGRATED FROM HR_TAB) ====================
  const extractTimeLocal = (str) => {
      if (!str) return null;
      let s = String(str).trim();
      if (s.includes('T') && s.includes('Z')) { 
          const d = new Date(s); 
          if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      const match = s.match(/([0-1]?[0-9]|2[0-3]):([0-5][0-9])/); 
      return match ? `${match[1].padStart(2, '0')}:${match[2]}` : null;
  };

  const [currentTimeMins, setCurrentTimeMins] = React.useState(() => new Date().getHours() * 60 + new Date().getMinutes());
  React.useEffect(() => {
      const interval = setInterval(() => {
          setCurrentTimeMins(new Date().getHours() * 60 + new Date().getMinutes());
      }, 30000); 
      return () => clearInterval(interval);
  }, []);

  const activeShift = React.useMemo(() => {
      if (currentTimeMins >= 390 && currentTimeMins <= 750) return 'Sáng';      
      if (currentTimeMins >= 825 && currentTimeMins <= 1110) return 'Chiều';    
      if (currentTimeMins >= 1140 || currentTimeMins <= 180) return 'Tối';      
      return null;
  }, [currentTimeMins]);



  // ==================== THÔNG BÁO TỪ BAN QUẢN LÝ (BOSS) ====================
  const noticeDocs = React.useMemo(() => {
      // Ưu tiên đọc từ bảng Documents (category = 'THONG_BAO_HE_THONG')
      const docList = (documents || erpData?.documents || []).filter(d => 
          d.category === 'THONG_BAO_HE_THONG' || d.category === 'THÔNG BÁO HỆ THỐNG'
      );
      if (docList.length > 0) return docList;
      // Fallback dữ liệu cũ từ importExport nếu chưa có trong documents
      return (importExport || []).filter(log => log.type === 'THONG_BAO_HE_THONG');
  }, [documents, erpData?.documents, importExport]);

  const latestServerNotice = React.useMemo(() => {
      if (noticeDocs.length === 0) return 'Chưa có thông báo nội bộ nào.';
      const last = noticeDocs[noticeDocs.length - 1];
      return last.description || last.note || last.title || 'Chưa có thông báo nội bộ nào.';
  }, [noticeDocs]);

  const [optimisticNotice, setOptimisticNotice] = React.useState(null);
  const displayNotice = optimisticNotice !== null ? optimisticNotice : latestServerNotice;

  const [isEditingNotice, setIsEditingNotice] = React.useState(false);
  const [tempNotice, setTempNotice] = React.useState('');

  const handleEditClick = () => {
      setTempNotice(displayNotice);
      setIsEditingNotice(true);
  };

  const handleSaveNotice = () => {
    setOptimisticNotice(tempNotice);
    setIsEditingNotice(false);

    // Lưu vào bảng Documents với category là 'THONG_BAO_HE_THONG' (ẩn khỏi danh sách tài liệu công cộng)
    const payload = {
        documents: [{
            id: 'SYS_ANNO_' + Date.now(),
            category: 'THONG_BAO_HE_THONG',
            title: 'Thông báo hệ thống',
            description: tempNotice,
            createdAt: new Date().toISOString().replace('T', ' ').slice(0, 19),
            createdBy: currentUser || 'Boss',
            link: '',
            attachments: '[]',
            testLink: '',
            readBy: '[]'
        }]
    };
    
    if (typeof pushDeltas === 'function') {
        pushDeltas(payload, `Boss đã cập nhật thông báo nội bộ`, 'fa-bullhorn')
            .then(() => { if (typeof triggerToast === 'function') triggerToast('Đã phát loa thông báo toàn xưởng!', 'fa-bullhorn', 'success'); })
            .catch(() => { if (typeof triggerToast === 'function') triggerToast('Lỗi mạng, chưa gửi được!', 'fa-wifi', 'danger'); });
    }
  };

  // ==================== LẤY DANH SÁCH TẤT CẢ NHÂN SỰ CHÍNH THỨC CỦA XƯỞNG ====================
  const allStaffNames = React.useMemo(() => {
    let list = [];
    if (userConfigs && userConfigs.pins) {
      list = Object.values(userConfigs.pins)
        .map(p => p.name || p.username || p.user)
        .filter(Boolean);
    }
    if (list.length === 0 && Array.isArray(users) && users.length > 0) {
      list = users.filter(u => u !== 'Khách' && u !== 'Guest' && !u.includes('CTV'));
    }
    if (list.length === 0 && erpData?.Config_NhanSu) {
      list = erpData.Config_NhanSu.map(r => r['Tên Nhân Sự'] || r.user || r.name).filter(Boolean);
    }
    return Array.from(new Set(list)).filter(u => u && u !== 'Khách' && u !== 'Guest');
  }, [userConfigs, users, erpData?.Config_NhanSu]);

  // ==================== HỢP NHẤT ĐỘI NGŨ & THEO DÕI CHẤM CÔNG HÔM NAY ====================
  const rosterAndAttendance = React.useMemo(() => {
    const todayAtts = (attendance || []).filter(a => String(a.date || '').includes(todayStr));
    
    // 1. Danh sách xin nghỉ
    const leaveList = [];
    todayAtts.forEach(a => {
      const isLeave = a.leaveType || (a.status && String(a.status).toUpperCase().includes('NGHỈ')) || a.leaveReportAt;
      if (isLeave) {
        leaveList.push({
          name: a.user,
          reason: a.leaveType || a.status || 'Nghỉ phép',
          note: a.note || ''
        });
      }
    });
    const leaveUsernames = new Set(leaveList.map(s => s.name));

    // 2. Danh sách nhân sự đi làm / chấm công
    const cleanTime = (t) => {
      if (!t) return '';
      let s = String(t).replace(/'/g, '').trim();
      if (s.length > 5 && s.indexOf(':') !== -1) {
        // Rút gọn HH:mm:ss -> HH:mm
        const parts = s.split(':');
        if (parts.length >= 2) s = `${parts[0]}:${parts[1]}`;
      }
      return s;
    };

    const staffRoster = allStaffNames.map(staffName => {
      if (leaveUsernames.has(staffName)) {
        const lv = leaveList.find(s => s.name === staffName);
        return {
          name: staffName,
          status: 'LEAVE',
          reason: lv?.reason || 'Nghỉ phép',
          inTime: '',
          outTime: ''
        };
      }

      const userAtt = todayAtts.find(a => a.user === staffName);
      if (!userAtt) {
        return {
          name: staffName,
          status: 'UNCHECKED_IN',
          inTime: '',
          outTime: ''
        };
      }

      const inTime = cleanTime(userAtt.timeIn || userAtt.morningIn || userAtt.afternoonIn);
      const outTime = cleanTime(userAtt.timeOut || userAtt.afternoonOut || userAtt.morningOut);

      if (!inTime) {
        return {
          name: staffName,
          status: 'UNCHECKED_IN',
          inTime: '',
          outTime: ''
        };
      }

      return {
        name: staffName,
        status: outTime ? 'CHECKED_OUT' : 'WORKING',
        inTime,
        outTime
      };
    });

    // Sắp xếp: Đang làm -> Đã ra ca -> Chưa vào -> Nghỉ
    const sortOrder = { 'WORKING': 1, 'CHECKED_OUT': 2, 'UNCHECKED_IN': 3, 'LEAVE': 4 };
    staffRoster.sort((a, b) => (sortOrder[a.status] || 99) - (sortOrder[b.status] || 99));

    const workingCount = staffRoster.filter(s => s.status === 'WORKING' || s.status === 'CHECKED_OUT').length;
    const unCheckedInCount = staffRoster.filter(s => s.status === 'UNCHECKED_IN').length;
    const unCheckedOutCount = staffRoster.filter(s => s.status === 'WORKING').length;

    return {
      staffRoster,
      workingCount,
      unCheckedInCount,
      unCheckedOutCount,
      leaveList
    };
  }, [attendance, todayStr, allStaffNames]);

  const countAttendance = rosterAndAttendance.workingCount;



  // ==================== DỰNG NHẬT KÝ HOẠT ĐỘNG GẦN ĐÂY ====================
  const [categoryFilter, setCategoryFilter] = React.useState('Tất cả');
  const allLogs = React.useMemo(() => {
    let logs = [];
    (orders || []).forEach(order => {
      if (order.createdAt) logs.push({ time: order.createdAt, category: 'Đơn hàng', message: `Đơn hàng mới: ${order.orderCode} (Kênh: ${order.channel || 'Khác'})`, user: order.updatedBy || '', amount: 0 });
    });
    (prodItems || []).forEach(item => {
      if (item.phases?.phase1?.endTime) logs.push({ time: item.phases.phase1.endTime, category: 'Sản xuất', message: `${item.name} đã hoàn thành ${item.phases.phase1.name}`, user: item.phases.phase1.user || '', amount: Number(item.phases.phase1.reward_vnd) || 0 });
      if (item.phases?.phase2?.endTime) logs.push({ time: item.phases.phase2.endTime, category: 'Sản xuất', message: `${item.name} đã hoàn thành ${item.phases.phase2.name}`, user: item.phases.phase2.user || '', amount: Number(item.phases.phase2.reward_vnd) || 0 });
    });
    (packings || []).forEach(pk => {
      if (pk.endTime && pk.status === 'Done') logs.push({ time: pk.endTime, category: 'Đóng gói', message: `Đơn ${pk.orderId} hoàn thành đóng gói`, user: pk.user || '', amount: Number(pk.reward_vnd) || 0 });
    });
    (attendance || []).forEach(att => {
      const parseTime = (t) => t ? String(t).replace(/'/g, '').trim() : null;
      if (att.morningIn || att.timeIn) logs.push({ time: `${att.date} ${parseTime(att.morningIn || att.timeIn)}`, category: 'Chấm công', message: `${att.user} đã Check-in`, user: att.user, amount: 0 });
      if (att.afternoonOut || att.timeOut) logs.push({ time: `${att.date} ${parseTime(att.afternoonOut || att.timeOut)}`, category: 'Chấm công', message: `${att.user} đã Check-out`, user: att.user, amount: 0 });
    });
    (kpis || []).forEach(kpi => {
      if (kpi.date) logs.push({ time: kpi.date, category: 'KPI / Thưởng', message: kpi.note || 'Thưởng nóng KPI', user: kpi.user || '', amount: Number(kpi.amount) || 0 });
    });
    (importExport || []).forEach(item => {
      if (item.date && item.type !== 'THONG_BAO_HE_THONG') {
          logs.push({ time: item.date, category: 'Xuất nhập kho', message: `${item.type || 'Kho'}: ${item.note || item.target || ''}`, user: '', amount: Number(item.totalAmount) || 0 });
      }
    });
    logs.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
    return logs;
  }, [orders, prodItems, packings, attendance, kpis, importExport]);

  const filteredLogs = categoryFilter === 'Tất cả' ? allLogs : allLogs.filter(log => log.category === categoryFilter);
  const categories = ['Tất cả', 'Đơn hàng', 'Sản xuất', 'Đóng gói', 'Chấm công', 'KPI / Thưởng', 'Xuất nhập kho'];

  const getCategoryStyle = (category) => {
    switch (category) {
      case 'Đơn hàng': return { icon: <i className="fas fa-file-invoice-dollar"></i>, color: '#3b82f6', bg: 'bg-[#3b82f6]/10' };
      case 'Sản xuất': return { icon: <i className="fas fa-hammer"></i>, color: '#fbbf24', bg: 'bg-[#fbbf24]/10' };
      case 'Đóng gói': return { icon: <i className="fas fa-boxes"></i>, color: '#34d399', bg: 'bg-emerald-400/10' };
      case 'Chấm công': return { icon: <i className="fas fa-clock"></i>, color: '#60a5fa', bg: 'bg-[#60a5fa]/10' };
      case 'KPI / Thưởng': return { icon: <i className="fas fa-trophy"></i>, color: '#d4af37', bg: 'bg-[#d4af37]/10' };
      case 'Xuất nhập kho': return { icon: <i className="fas fa-exchange-alt"></i>, color: '#a78bfa', bg: 'bg-[#a78bfa]/10' };
      default: return { icon: <i className="fas fa-info-circle"></i>, color: '#9ca3af', bg: 'bg-gray-400/10' };
    }
  };

  // ==================== CÁC CHỈ SỐ ĐIỀU HÀNH & WORKBENCH SINH TỬ ====================
  const isExecutive = isBoss || canSeeFinance || currentRole === 'TỐI CAO';

  // 1. Dòng tiền lưu động khả dụng xưởng (Tầng 1 Treasury, loại trừ Vault dự trữ)
  const operatingCash = React.useMemo(() => {
    const accs = erpData?.Accounts || [];
    return accs.filter(a => {
      const name = String(a.accountName || a.name || '').toUpperCase();
      return !name.includes('VAULT') && !name.includes('DỰ TRỮ') && !name.includes('689M') && !name.includes('ĐẦU TƯ');
    }).reduce((sum, a) => sum + (Number(a.balance) || 0), 0);
  }, [erpData?.Accounts]);

  // 2. Chi phí OPEX bình quân ngày (Daily Burn Rate)
  const dailyBurnRate = React.useMemo(() => {
    const txs = erpData?.Transactions || [];
    const now = new Date();
    const thisMonth = now.toISOString().slice(0, 7);
    const monthOpex = txs
      .filter(t => String(t.type || '').toUpperCase() === 'EXPENSE' && String(t.date || '').startsWith(thisMonth))
      .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
    return monthOpex > 0 ? Math.round(monthOpex / Math.max(1, now.getDate())) : 2200000;
  }, [erpData?.Transactions]);

  // 3. Số ngày cầm cự (Cash Runway)
  const cashRunwayDays = React.useMemo(() => {
    if (dailyBurnRate <= 0) return 999;
    return Math.floor(operatingCash / dailyBurnRate);
  }, [operatingCash, dailyBurnRate]);

  // 4. Áp lực SLA theo ca: Đơn chưa hoàn thành có deadline trong ngày hôm nay hoặc trễ
  const urgentSlaOrders = React.useMemo(() => {
    const todayEnd = new Date();
    todayEnd.setHours(23, 59, 59, 999);
    return (orders || []).filter(o => {
      const st = String(o.status || '').trim().toUpperCase();
      if (['ĐÃ BÀN GIAO', 'ĐỐI SOÁT THÀNH CÔNG', 'ĐƠN HUỶ', 'HOÀN THÀNH', 'DELIVERED'].includes(st)) return false;
      if (!o.deadline) return false;
      const d = new Date(o.deadline);
      return !isNaN(d.getTime()) && d <= todayEnd;
    });
  }, [orders]);

  // 5. Hàng hoàn chờ kiểm định vật lý (Reverse Logistics)
  const pendingReturns = React.useMemo(() => {
    return (orders || []).filter(o => {
      const st = String(o.status || '').trim().toUpperCase();
      return st === 'HÀNG HOÀN' || st === 'RETURNED' || st.includes('HOÀN');
    });
  }, [orders]);

  // 6. Số lượng lệnh sản xuất đang chạy
  const activeProductionCount = React.useMemo(() => {
    return (prodItems || []).filter(p => !['DONE', 'ĐÃ XONG', 'HOÀN THÀNH'].includes(String(p.status || '').toUpperCase())).length;
  }, [prodItems]);

  // 7. SKU chạm đáy tồn kho (dưới mức minStock)
  const lowStockCount = React.useMemo(() => {
    return (erpProducts || erpData?.Products || []).filter(p => Number(p.quantity) <= Number(p.minStock || 5)).length;
  }, [erpProducts, erpData?.Products]);

  // 8. Dữ liệu cá nhân cho Workbench thợ xưởng
  const myAttendance = React.useMemo(() => {
    return rosterAndAttendance.staffRoster.find(s => s.name === currentUser);
  }, [rosterAndAttendance.staffRoster, currentUser]);

  const myActiveTasks = React.useMemo(() => {
    if (!currentUser) return [];
    const isHuong = currentUser.toLowerCase().includes('hương');
    if (isHuong) {
      return (orders || []).filter(o => {
        const st = String(o.status || '').toUpperCase();
        return ['SẴN SÀNG ĐÓNG GÓI', 'READY_TO_PACK', 'CHỜ ĐÓNG GÓI'].includes(st);
      }).map(o => ({ id: o.id, code: o.orderCode || o.id, type: 'ĐÓNG GÓI', title: `Đóng gói đơn ${o.orderCode || o.id}`, deadline: o.deadline }));
    }
    return (prodItems || []).filter(item => {
      const p1User = item.phases?.phase1?.user || item.p1_user;
      const p1Status = String(item.phases?.phase1?.status || item.p1_status || '').toUpperCase();
      const p2User = item.phases?.phase2?.user || item.p2_user;
      const p2Status = String(item.phases?.phase2?.status || item.p2_status || '').toUpperCase();
      const isMyP1 = p1User === currentUser && p1Status !== 'DONE' && p1Status !== 'ĐÃ XONG';
      const isMyP2 = p2User === currentUser && p2Status !== 'DONE' && p2Status !== 'ĐÃ XONG';
      return isMyP1 || isMyP2;
    }).map(item => ({ id: item.id, code: item.orderId || item.id, type: 'SẢN XUẤT', title: item.name || 'Gia công bể/layout', deadline: item.deadline }));
  }, [currentUser, prodItems, orders]);

  const myDoneTodayCount = React.useMemo(() => {
    if (!currentUser) return 0;
    let count = 0;
    (prodItems || []).forEach(item => {
      const p1End = item.phases?.phase1?.endTime || item.p1_endTime;
      const p2End = item.phases?.phase2?.endTime || item.p2_endTime;
      if (item.phases?.phase1?.user === currentUser && p1End && String(p1End).includes(todayStr)) count++;
      if (item.phases?.phase2?.user === currentUser && p2End && String(p2End).includes(todayStr)) count++;
    });
    (packings || []).forEach(pk => {
      if (pk.user === currentUser && pk.status === 'Done' && pk.endTime && String(pk.endTime).includes(todayStr)) count++;
    });
    return count;
  }, [currentUser, prodItems, packings, todayStr]);

  const myRewardToday = React.useMemo(() => {
    if (!currentUser) return 0;
    let sum = 0;
    (prodItems || []).forEach(item => {
      const p1End = item.phases?.phase1?.endTime || item.p1_endTime;
      const p2End = item.phases?.phase2?.endTime || item.p2_endTime;
      if (item.phases?.phase1?.user === currentUser && p1End && String(p1End).includes(todayStr)) {
        sum += Number(item.phases?.phase1?.reward_vnd || item.p1_reward_vnd) || 0;
      }
      if (item.phases?.phase2?.user === currentUser && p2End && String(p2End).includes(todayStr)) {
        sum += Number(item.phases?.phase2?.reward_vnd || item.p2_reward_vnd) || 0;
      }
    });
    (packings || []).forEach(pk => {
      if (pk.user === currentUser && pk.status === 'Done' && pk.endTime && String(pk.endTime).includes(todayStr)) {
        sum += Number(pk.reward_vnd) || 0;
      }
    });
    return sum;
  }, [currentUser, prodItems, packings, todayStr]);

  // 9. Danh sách việc cần xử lý ngay (Top Critical Actions)
  const criticalActionItems = React.useMemo(() => {
    const list = [];
    urgentSlaOrders.slice(0, 3).forEach(o => {

      });

    pendingReturns.slice(0, 2).forEach(o => {

        tag: 'HÀNG HOÀN',

        onAction: () => window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { detail: { tab: 'inventory', trigger: 'filterReturns' } }))

    return list;
  }, [urgentSlaOrders, pendingReturns]);

  return (
    <div className="space-y-4 sm:space-y-5 pb-6 w-full relative bg-[#09090b] text-zinc-100 font-sans">

      {/* 2. LIVE SYSTEM TICKER (1 DÒNG CẢNH BÁO NÓNG TRÊN CÙNG) */}

          <span className="text-[10px] font-bold uppercase tracking-wider text-zinc-400 shrink-0 font-mono">

          <div className="text-[11px] font-medium text-zinc-300 truncate flex items-center gap-4">

              </span>

            {pendingReturns.length > 0 ? (

            {lowStockCount > 0 ? (

                <i className="fas fa-layer-group text-sky-400 text-[10px]"></i>
                <span>Có <strong>{lowStockCount}</strong> mã vật tư chạm ngưỡng an toàn.</span>

              <span className="text-amber-400 font-semibold">{pendingReturns.length} kiện</span>

          {/* Card 4: Nhịp sản xuất & tồn kho */}

                <span>Tiến Độ Xưởng & Tồn Kho</span>
                <span className="text-zinc-300 bg-zinc-900 px-2 py-0.5 rounded text-[10px] font-mono border border-white/[0.06]">Vận Hành</span>
              </div>
              <div className="text-2xl font-bold text-white font-mono tracking-tight">
                {activeProductionCount} <span className="text-xs text-zinc-400 font-normal">lệnh đang chạy</span>
              </div>
            </div>
            <div className="mt-3 pt-2.5 border-t border-white/[0.04] flex items-center justify-between text-[11px] font-mono text-zinc-500">
              <span>SKU cạn kho:</span>
              <span className="text-rose-400 font-semibold">{lowStockCount} vật tư</span>
            </div>
          </div>
        </div>
      ) : (
        /* PERSONAL WORKBENCH: CA TRỰC - VIỆC CẦN LÀM - KCS ĐẠT CHUẨN - THƯỞNG HÔM NAY */
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          {/* Card 1: Ca làm việc & Chấm công */}
          <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-3.5 flex flex-col justify-between relative overflow-hidden">
            <div>
              <div className="flex items-center justify-between text-[10px] font-black uppercase text-zinc-400 tracking-wider mb-1">
                <span>Ca Làm Việc Hôm Nay</span>
                <span className="text-blue-400 bg-blue-500/10 px-1.5 py-0.5 rounded text-[9px] font-mono">
                  {myAttendance?.status === 'WORKING' ? 'ĐANG LÀM' : myAttendance?.status === 'CHECKED_OUT' ? 'ĐÃ RA CA' : 'CHƯA CHECK-IN'}
                </span>
              </div>
              <div className="text-lg sm:text-xl font-black text-white font-mono">
                Ca {activeShift || 'Chuẩn'}
              </div>
            </div>
            <div className="mt-2 pt-2 border-t border-white/[0.04] flex items-center justify-between text-[10.5px] font-mono text-zinc-400">
              <span>Vào: <strong className="text-emerald-400">{myAttendance?.inTime || '--:--'}</strong></span>
              <span>Ra: <strong className="text-amber-400">{myAttendance?.outTime || '--:--'}</strong></span>
            </div>
          </div>

          {/* Card 2: Việc được phân công đang chờ */}
          <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-3.5 flex flex-col justify-between relative overflow-hidden">
            <div>
              <div className="flex items-center justify-between text-[10px] font-black uppercase text-zinc-400 tracking-wider mb-1">
                <span>Việc Đang Phân Công</span>
                <span className="text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded text-[9px] font-mono">CẦN LÀM</span>
              </div>
              <div className="text-xl sm:text-2xl font-black text-white font-mono tracking-tight">
                {myActiveTasks.length} <span className="text-xs text-zinc-400 font-normal">bể/đơn</span>
              </div>
            </div>
            <div className="mt-2 pt-2 border-t border-white/[0.04] text-[10.5px] font-mono text-zinc-500 truncate">
              {myActiveTasks.length > 0 ? myActiveTasks[0].title : 'Đã hoàn thành hết việc được giao'}
            </div>
          </div>

          {/* Card 3: Sản phẩm hoàn thành hôm nay */}
          <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-3.5 flex flex-col justify-between relative overflow-hidden">
            <div>
              <div className="flex items-center justify-between text-[10px] font-black uppercase text-zinc-400 tracking-wider mb-1">
                <span>KCS & Đã Xong Hôm Nay</span>
                <span className="text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded text-[9px] font-mono">ĐẠT CHUẨN</span>

              <div className="text-xl sm:text-2xl font-black text-white font-mono tracking-tight">
                {myDoneTodayCount} <span className="text-xs text-zinc-400 font-normal">sản phẩm</span>
              </div>
            </div>
            <div className="mt-2 pt-2 border-t border-white/[0.04] text-[10.5px] font-mono text-emerald-400">
              100% không lỗi trả về
            </div>
          </div>

          {/* Card 4: Thưởng ca tạm tính hôm nay */}
          <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-3.5 flex flex-col justify-between relative overflow-hidden">
            <div>
              <div className="flex items-center justify-between text-[10px] font-black uppercase text-zinc-400 tracking-wider mb-1">
                <span>Thưởng Tạm Tính Hôm Nay</span>
                <span className="text-[#d4af37] bg-[#d4af37]/10 px-1.5 py-0.5 rounded text-[9px] font-mono">TÍCH LŨY</span>
              </div>
              <div className="text-xl sm:text-2xl font-black text-[#d4af37] font-mono tracking-tight">
                +{myRewardToday.toLocaleString('vi-VN')} đ
              </div>
            </div>
            <div className="mt-2 pt-2 border-t border-white/[0.04] text-[10.5px] font-mono text-zinc-500">
              Cộng trực tiếp vào bảng lương tháng
            </div>
          </div>
        </div>
      )}

      {/* 4. LOA PHÁT THANH NỘI BỘ (TỪ BOSS) */}
      {(!isEditingNotice && (!displayNotice || displayNotice === 'Chưa có thông báo nội bộ nào.')) ? (
        <div className="bg-[#121214] border border-white/[0.06] rounded-xl px-4 py-2.5 flex items-center justify-between shadow-sm">
          <div className="flex items-center gap-2.5 text-zinc-400 text-xs font-medium">
            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span className="text-zinc-300">Toàn bộ xưởng đang vận hành nhịp nhàng theo tiến độ chuẩn.</span>
          </div>
          {isBoss && (
            <button 
              onClick={handleEditClick} 
              className="text-[10px] font-black text-[#d4af37] hover:text-amber-300 bg-[#d4af37]/10 px-2.5 py-1 rounded border border-[#d4af37]/20 transition-all flex items-center gap-1.5 uppercase cursor-pointer active:scale-95"
            >
              <i className="fas fa-bullhorn"></i> Phát loa
            </button>
          )}

      ) : (
        <div className="bg-[#121214] border border-amber-500/20 rounded-xl p-4 relative overflow-hidden shadow-sm">
          <div className="flex items-center justify-between mb-2 relative z-10">
            <div className="flex items-center gap-2">

                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>

                    <button
                      onClick={item.onAction}
                      className="shrink-0 text-[10px] font-bold px-2.5 py-1 rounded bg-white/[0.06] hover:bg-white/[0.12] text-zinc-200 hover:text-white border border-white/[0.08] transition-colors cursor-pointer active:scale-95"
                    >
                      {item.actionText} <i className="fas fa-arrow-right text-[8px] ml-0.5"></i>
                    </button>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* B. BẢNG ĐIỀU PHỐI THỢ SẢN XUẤT & ĐÓNG GÓI */}
          <ProductionStaffDispatchBoard 
            prodItems={prodItems || []}
            orders={orders || []}
            packings={packings || erpData?.Packings || []}
            currentUser={currentUser}
            isAdmin={isSuperAdmin}
            isBoss={isBoss}
            pushDeltas={pushDeltas}
            triggerToast={triggerToast}
            kpiConfig={typeof kpiConfig !== 'undefined' ? kpiConfig : []}
            erpData={erpData || {}}
          />

          {/* C. KHUNG GIAO VIỆC / NHẮC VIỆC & NHIỆM VỤ CHUNG */}
          <DashboardTasksSection 
            importExport={(typeof importExport !== 'undefined' ? importExport : null) || erpData?.ImportExport || []}
            currentUser={currentUser} 
            pushDeltas={pushDeltas} 
            triggerToast={triggerToast} 
            isAdmin={isSuperAdmin} 
            isBoss={isBoss}
            userConfigs={userConfigs}
            reimbursements={reimbursements}
            products={(typeof erpProducts !== 'undefined' ? erpProducts : null) || erpData?.Products || []}
          />

          {/* D. BẢNG LỊCH SỬ BỊ TRỪ LƯƠNG TRONG THÁNG */}
          <MonthlyPenaltyLedger 
            bonusPenalty={erpData?.BonusPenalty || kpis || []}
            attendance={attendance || []}
            currentUser={currentUser}
            isAdmin={isSuperAdmin}
            isBoss={isBoss}
            pushDeltas={pushDeltas}
            triggerToast={triggerToast}
            allStaffNames={allStaffNames || []}
          />
        </div>

        {/* CỘT PHẢI (40% ~ lg:col-span-5): QUÂN SỐ TRỰC CA, PHÍM TẮT & NHẬT KÝ */}
        <div className="lg:col-span-5 space-y-4">
          
          {/* A. ĐỘI NGŨ & CHẤM CÔNG HÔM NAY (QUÂN SỐ TRỰC CA) */}
          <div className="vision-card p-4 sm:p-5 mb-4 shadow-sm">
            <div className="flex items-center justify-between pb-3 border-b border-white/[0.08]">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-white/[0.06] border border-white/10 text-sky-400 flex items-center justify-center text-[12px]">
                  <i className="fas fa-users"></i>
                </div>
                <span className="font-display font-extrabold text-[15px] sm:text-[16px] text-white tracking-tight">
                  Quân Số Trực Ca ({rosterAndAttendance.workingCount}/{allStaffNames.length})
                </span>
              </div>
              <div className="flex items-center gap-1.5">
                {rosterAndAttendance.unCheckedInCount > 0 ? (
                  <span className="pill-ongoing">
                    {rosterAndAttendance.unCheckedInCount} chưa vào
                  </span>
                ) : (
                  <span className="pill-complete">
                    Đủ quân số
                  </span>
                )}
              </div>
            </div>

            {/* Grid nhân sự trực ca */}
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 py-2.5">
              {rosterAndAttendance.staffRoster.filter(s => s.status !== 'LEAVE').map((st, i) => {
                const isWorking = st.status === 'WORKING';
                const isDone = st.status === 'CHECKED_OUT';
                const isMissingIn = st.status === 'UNCHECKED_IN';

                return (
                  <div 
                    key={i} 
                    className={`p-2 rounded-lg border transition-colors flex flex-col justify-between ${
                      isWorking ? 'bg-blue-500/5 border-blue-500/20' :
                      isDone ? 'bg-emerald-500/5 border-emerald-500/20' :
                      'bg-white/[0.02] border-white/[0.04] opacity-60'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-1">
                      <span className="text-[11px] font-bold text-zinc-200 truncate" title={st.name}>
                        {st.name}
                      </span>
                      <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${
                        isWorking ? 'bg-emerald-400' :
                        isDone ? 'bg-blue-400' :
                        'bg-rose-500'
                      }`}></span>
                    </div>

                    <div className="mt-1 flex items-center justify-between text-[9px] font-mono">
                      {isMissingIn ? (
                        <span className="text-rose-400 font-bold">Chưa vào</span>
                      ) : (
                        <>
                          <span className="text-emerald-400 font-bold">V: {st.inTime}</span>
                          <span className={st.outTime ? 'text-zinc-400' : 'text-amber-400'}>
                            {st.outTime ? `R: ${st.outTime}` : 'Tại xưởng'}
                          </span>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Dòng xin nghỉ hôm nay */}
            <div className="pt-2 border-t border-white/[0.04] flex items-center gap-1.5 flex-wrap text-[10.5px]">
              <span className="font-bold text-zinc-500 flex items-center gap-1 shrink-0 font-mono text-[10px]">
                <i className="fas fa-umbrella-beach text-sky-400"></i> Nghỉ phép:
              </span>
              {rosterAndAttendance.leaveList.length === 0 ? (
                <span className="text-zinc-500 italic text-[10px]">Đi làm đủ 100%.</span>
              ) : (
                rosterAndAttendance.leaveList.map((st, idx) => (
                  <span key={idx} className="bg-sky-500/10 text-sky-300 border border-sky-500/20 text-[9.5px] font-bold px-1.5 py-0.5 rounded">
                    {st.name} ({st.reason})
                  </span>
                ))
              )}
            </div>
          </div>

          {/* B. BẢNG PHÍM TẮT ĐIỀU HÀNH 1-CHẠM (QUICK ACTIONS) */}
          <div className="bg-[#121214] border border-white/[0.06] p-3.5 rounded-xl shadow-sm">
            <div className="flex items-center justify-between mb-3 pb-2 border-b border-white/[0.06]">
              <div className="flex items-center gap-2 text-[11px] font-black text-zinc-200 uppercase tracking-wider">
                <i className="fas fa-bolt text-[#d4af37]"></i> Phím Tắt 1-Chạm
              </div>
              <span className="text-[9px] font-mono text-zinc-500">Bento Grid</span>
            </div>

            <div className="grid grid-cols-3 gap-2">
              {/* Button 1: Lên Đơn */}
              <button 
                onClick={() => window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { detail: { tab: 'orders', trigger: 'triggerCreateOrder', data: { channel: 'Bán Lẻ' } } }))} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-emerald-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-cart-plus"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-emerald-400">Lên Đơn</span>
              </button>

              {/* Button 2: Bảng Giá */}
              <button 
                onClick={() => window.dispatchEvent(new CustomEvent('openGlassPriceModal'))} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-amber-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-tags"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-amber-400">Bảng Giá</span>
              </button>

              {/* Button 3: Check Nợ */}
              <button 
                onClick={() => window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { detail: { tab: 'finance', trigger: 'openPartnersTab' } }))} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-rose-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-hand-holding-usd"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-rose-400">Sổ Nợ</span>
              </button>

              {/* Button 4: Tra SKU */}
              <button 
                onClick={() => window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { detail: { tab: 'inventory', trigger: 'focusSearch' } }))} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-indigo-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-barcode"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-indigo-400">Tra SKU</span>
              </button>

              {/* Button 5: Nhập Kho */}
              <button 
                onClick={() => {
                  window.pendingAction = 'createImportTicket';
                  window.handleNavigateTab('inventory', 'WORKSPACE');
                }} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-blue-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-boxes"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-blue-400">Nhập Kho</span>
              </button>

              {/* Button 6: Tính Cước */}
              <button 
                onClick={() => window.dispatchEvent(new CustomEvent('openFreightModal'))} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-purple-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-truck-moving"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-purple-400">Tính Cước</span>
              </button>

              {/* Button 7: Chi Tiền */}
              <button 
                onClick={() => window.dispatchEvent(new Event('openQuickExpenseModal'))} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-cyan-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-file-invoice-dollar"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-cyan-400">Chi Tiền</span>
              </button>

              {/* Button 8: Giá Layout */}
              <button 
                onClick={() => window.dispatchEvent(new CustomEvent('openLayoutCalcModal'))} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-pink-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-pink-500/10 text-pink-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-drafting-compass"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-pink-400">Giá Layout</span>
              </button>

              {/* Button 9: Phạt Nhanh */}
              <button 
                onClick={() => window.dispatchEvent(new Event('openQuickPenaltyModal'))} 
                className="bg-white/[0.02] hover:bg-white/[0.06] p-2.5 rounded-xl border border-white/[0.06] hover:border-rose-500/40 flex flex-col items-center justify-center transition-all group active:scale-95 cursor-pointer"
              >
                <div className="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center text-sm mb-1 group-hover:scale-110 transition-transform"><i className="fas fa-gavel"></i></div>
                <span className="text-[10px] font-bold text-zinc-300 group-hover:text-rose-400">Phạt Nhanh</span>
              </button>
            </div>
          </div>

          {/* C. NHẬT KÝ HOẠT ĐỘNG GẦN ĐÂY */}
          <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-3.5 shadow-sm">
            <div className="flex items-center justify-between gap-2 mb-3 pb-2 border-b border-white/[0.06]">
              <div className="font-black text-[11px] text-zinc-200 uppercase tracking-wider flex items-center gap-1.5">
                <i className="fas fa-list-ul text-zinc-400"></i>
                Hoạt Động Gần Đây
              </div>
              <select 
                value={categoryFilter} 
                onChange={(e) => setCategoryFilter(e.target.value)} 
                className="bg-[#09090b] border border-white/[0.08] text-zinc-300 text-[9.5px] font-bold uppercase px-2 py-1 rounded outline-none cursor-pointer focus:border-[#d4af37]/50 transition-colors"
              >
                {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
              </select>
            </div>

            <div className="space-y-2 max-h-[360px] overflow-y-auto pr-1 custom-scrollbar">
              {filteredLogs.length === 0 ? (
                <div className="text-center py-6 text-zinc-500 italic text-[11px] font-mono">Không có hoạt động nào</div>
              ) : (
                filteredLogs.slice(0, 30).map((log, index) => {
                  const style = getCategoryStyle(log.category);
                  return (
                    <div key={index} className="flex items-start gap-2.5 bg-white/[0.02] border border-white/[0.04] rounded-lg p-2.5 hover:border-white/[0.08] transition-colors">
                      <div className="mt-0.5 text-xs shrink-0" style={{ color: style.color }}>{style.icon}</div>
                      <div className="flex-1 min-w-0">
                        <div className="text-[11px] text-zinc-200 font-medium leading-tight flex items-center gap-1.5 flex-wrap">
                          <span>{log.message}</span>
                          {log.amount > 0 && <span className="text-emerald-400 font-mono font-bold text-[9.5px]">+{canSeeMoney ? log.amount.toLocaleString('vi-VN') + 'đ' : '******đ'}</span>}
                        </div>
                        <div className="flex items-center gap-2 mt-1 text-[9px] font-mono text-zinc-500">
                          <span>{log.time?.split(' ')[1]?.slice(0,5) || log.time?.slice(11,16) || '--:--'}</span>
                          {log.user && <span>• <strong className="text-zinc-400">{log.user}</strong></span>}
                          <span>•</span>
                          <span className={`px-1 rounded ${style.bg}`} style={{ color: style.color }}>{log.category}</span>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

        </div>
      </div>

    </div>
  );
});
</script>
