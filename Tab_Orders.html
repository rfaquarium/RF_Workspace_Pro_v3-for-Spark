                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            /* CHẾ ĐỘ 2: GOM THEO KÊNH BÁN (CARDS VIEW) */
                            <div className="space-y-4">
                                {(() => {
                                    const channelPriorityMap = {
                                        'XUẤT KHẨU': 1,
                                        'BẢO HÀNH': 2,
                                        'TIKTOK SHOP': 3,
                                        'SHOPEE VN': 4,
                                        'CỘNG TAC VIÊN': 5,
                                        'BÁN LẺ': 6,
                                        'BÁN SỈ': 7,
                                        'SẢN XUẤT TỒN': 8
                                    };

                                    const resolveGroupKey = (o) => {
                                        const upperChan = String(o.channel || '').toUpperCase().trim();
                                        const codeStr = String(o.orderCode || '').toUpperCase();

                                        const isInter = upperChan.includes('XUẤT KHẨU') || upperChan.includes('EXPORT') || upperChan.includes('QUỐC TẾ') ||
                                            upperChan.includes('SHOPEE SG') || upperChan.includes('SHOPEE TH') || upperChan.includes('SHOPEE TW') ||
                                            upperChan.includes('SHOPEE PH') || upperChan.includes('SHOPEE MA') || upperChan.includes('SHOPEE MY') ||
                                            /\b(SHOPEE_SG|SHOPEE_MY|SHOPEE_TH|SHOPEE_PH|SHOPEE_MA|SHOPEE_TW)\b/i.test(upperChan);

                                        if (isInter) return 'XUẤT KHẨU';
                                        if (upperChan === 'SHOPEE' || upperChan === 'SHOPEE VN' || upperChan === 'SHOPEE_VN') return 'SHOPEE VN';
                                        if (upperChan.includes('SHOPEE')) return 'SHOPEE VN';
                                        if (upperChan.includes('TIKTOK') || upperChan.includes('TIK TOK')) return 'TIKTOK SHOP';
                                        if (upperChan.includes('CỘNG TÁC VIÊN') || upperChan.includes('CTV')) return 'CỘNG TÁC VIÊN';
                                        if (upperChan.includes('BÁN LẺ') || upperChan.includes('BAN LE') || upperChan.includes('OFFLINE') || upperChan.includes('ZALO') || upperChan.includes('FACEBOOK') || upperChan.includes('MESSENGER')) return 'BÁN LẺ';
                                        if (upperChan.includes('BÁN SỈ') || upperChan.includes('BAN SI') || upperChan.includes('WHOLESALE')) return 'BÁN SỈ';
                                        if (upperChan.includes('SẢN XUẤT TỒN') || upperChan.includes('SẢN XUẤT BÙ KHO') || upperChan.includes('TỒN XƯỞNG')) return 'SẢN XUẤT TỒN';
                                        if (upperChan.includes('BẢO HÀNH') || upperChan.includes('SỬA CHỮA')) return 'BẢO HÀNH';

                                        if (codeStr.includes('SPXVN') || codeStr.includes('SHOPEE') || /^2\d{13,15}/.test(codeStr)) return 'SHOPEE VN';
                                        if (codeStr.includes('TIKTOK') || /^57\d{16,18}/.test(codeStr)) return 'TIKTOK SHOP';

                                        return 'BÁN LẺ';
                                    };

                                    const orderGroups = [];
                                    sortedFiltered.slice(0, renderLimit).forEach((o, index) => {
                                        const key = resolveGroupKey(o);
                                        let g = orderGroups.find(x => x.groupKey === key);
                                        if (!g) {
                                            g = { groupKey: key, orders: [], priority: channelPriorityMap[key] || 99 };
                                            orderGroups.push(g);
                                        }
                                        g.orders.push({ order: o, originalIdx: index + 1 });
                                    });

                                    orderGroups.sort((a, b) => a.priority - b.priority);

                                    return orderGroups.map(group => {
                                        const { groupKey, orders: groupOrders } = group;
                                        const isCollapsed = collapsedGroups[groupKey] === true;

                                        return (
                                            <div key={`order_group_${groupKey}`} className="space-y-3">
                                                <div
                                                    style={getChannelInlineStyle(groupKey)}
                                                    className="w-full py-2.5 px-4 mt-4 mb-2 flex items-center justify-between gap-2 rounded-2xl uppercase tracking-wider shadow-lg select-none font-black"
                                                >
                                                    <div className="text-xs font-black flex items-center gap-2 truncate cursor-pointer" onClick={() => setCollapsedGroups(prev => ({ ...prev, [groupKey]: !isCollapsed }))}>
                                                        <i className="fas fa-layer-group text-xs"></i>
                                                        <span className="truncate">{groupKey}</span>
                                                    </div>

                                                    <div className="flex items-center gap-2 shrink-0">
                                                        {(!isCTV || isAdmin || isBossRole) && groupOrders.length > 0 && (
                                                            <div
                                                                className="flex items-center gap-1.5 bg-black/30 text-current px-2.5 py-1 rounded-xl cursor-pointer hover:bg-black/40 border border-black/20 transition-all active:scale-95"
                                                                title="Chọn/bỏ chọn tất cả đơn trong kênh này"
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    const groupOrderIds = groupOrders.map(x => x.order.id);
                                                                    const isAllGroupSelected = groupOrderIds.every(id => selectedIds.includes(id));
                                                                    if (isAllGroupSelected) {
                                                                        setSelectedIds(prev => prev.filter(id => !groupOrderIds.includes(id)));
                                                                    } else {
                                                                        setSelectedIds(prev => [...new Set([...prev, ...groupOrderIds])]);
                                                                    }
                                                                }}
                                                            >
                                                                <input
                                                                    type="checkbox"
                                                                    checked={groupOrders.length > 0 && groupOrders.every(x => selectedIds.includes(x.order.id))}
                                                                    readOnly
                                                                    className="w-3.5 h-3.5 accent-[#10b981] rounded cursor-pointer pointer-events-none"
                                                                />
                                                                <span className="text-[10px] font-black">CHỌN HẾT</span>
                                                            </div>
                                                        )}

                                                        <div className="flex items-center gap-1.5 bg-black/25 text-current px-2.5 py-1 rounded-xl border border-black/10 font-black cursor-pointer" onClick={() => setCollapsedGroups(prev => ({ ...prev, [groupKey]: !isCollapsed }))}>
                                                            <span className="text-xs font-black">{groupOrders.length} ĐƠN</span>
                                                            <i className={`fas fa-chevron-${isCollapsed ? 'down' : 'up'} text-xs`}></i>
                                                        </div>
                                                    </div>
                                                </div>

                                                {!isCollapsed && (
                                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3">
                                                        {groupOrders.map(({ order: o, originalIdx }) => {
                                                            const oIdStr = String(o.id || '').trim();
                                                            const oCodeStr = String(o.orderCode || '').trim();
                                                            const baseCodeStr = oCodeStr.split(' | ')[0].trim();
                                                            const latestPack = latestPackMap[oIdStr] || (oCodeStr ? latestPackMap[oCodeStr] : null) || (baseCodeStr ? latestPackMap[baseCodeStr] : null);
                                                            const matchedProds = getMatchedProds(o);
                                                            return (
                                                                <RFOrderWrapper
                                                                    key={o.id}
                                                                    attendance={attendance}
                                                                    order={o}
                                                                    orders={orders}
                                                                    prods={matchedProds}
                                                                    pack={latestPack}
                                                                    packings={packings}
                                                                    erpProducts={erpProducts}
                                                                    erpData={erpData}
                                                                    isAdmin={isAdmin}
                                                                    currentUser={currentUser}
                                                                    pushDeltas={pushDeltas}
                                                                    prodItems={prodItems}
                                                                    userConfigs={userConfigs}
                                                                    triggerToast={triggerToast}
                                                                    isSelected={selectedIds.includes(o.id)}
                                                                    onToggleSelect={toggleSelect}
                                                                    kpiConfig={kpiConfig}
                                                                    idx_num={originalIdx}
                                                                    handleCancelOrder={handleCancelOrder}
                                                                    handleConfirmStockIn={handleConfirmStockIn}
                                                                    openReturnModal={openReturnModal}
                                                                    filterStatus={filterStatus}
                                                                    onEditOrder={handleEditOrder}
                                                                />
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    });
                                })()}
                            </div>
                        )}

                        {/* NÚT TẢI THÊM PHÂN TRANG */}
                        {renderLimit < sortedFiltered.length && (
                            <div className="pt-3 pb-2 flex justify-center">
                                <button
                                    type="button"
                                    onClick={() => setRenderLimit(prev => prev + 50)}
                                    className="px-6 py-2.5 rounded-xl bg-[#121214] hover:bg-[#18181b] border border-white/[0.08] text-xs font-bold text-zinc-300 hover:text-white transition-all active:scale-95 shadow-lg cursor-pointer"
                                >
                                    Tải thêm ({sortedFiltered.length - renderLimit} đơn tiếp theo)
                                </button>
                            </div>
                        )}
                    </>
                )}

                {/* ========================================== */}
                {/* SIDE DRAWER CHI TIẾT ĐƠN HÀNG (SLIDE-OVER) */}
                {/* ========================================== */}
                {selectedDrawerOrder && (
                    <div className="fixed inset-0 z-50 flex justify-end animate-fade-in">
                        {/* Backdrop */}
                        <div
                            className="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity"
                            onClick={() => setSelectedDrawerOrder(null)}
                        ></div>

                        {/* Slide-over Content */}
                        <div className="relative w-full max-w-lg bg-[#18181b] border-l border-white/[0.08] shadow-2xl flex flex-col h-full z-10 animate-slide-left text-zinc-100 overflow-hidden">
                            {/* Drawer Header */}
                            <div className="p-4 border-b border-white/[0.06] bg-[#121214] flex items-center justify-between gap-3 shrink-0">
                                <div className="flex items-center gap-2 min-w-0">
                                    <button
                                        type="button"
                                        onClick={(e) => handleToggleUrgent(selectedDrawerOrder, e)}
                                        className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm transition-transform active:scale-125 cursor-pointer ${selectedDrawerOrder.isUrgent ? 'text-[#d4af37] bg-amber-500/15' : 'text-zinc-500 bg-white/[0.04]'}`}
                                        title={selectedDrawerOrder.isUrgent ? "Bỏ ưu tiên" : "Đánh dấu Đơn Gấp"}
                                    >
                                        <i className="fas fa-star"></i>
                                    </button>
                                    <div className="min-w-0">
                                        <div className="font-mono font-black text-sm text-zinc-100 truncate">
                                            {String(selectedDrawerOrder.orderCode || '').split(' | ')[0]}
                                        </div>
                                        <div className="text-[11px] text-zinc-400 truncate">
                                            {selectedDrawerOrder.channel || 'Bán Lẻ'} &bull; {selectedDrawerOrder.customer || 'Khách Lẻ'}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex items-center gap-1.5 shrink-0">
                                    <button
                                        type="button"
                                        onClick={(e) => handlePrintShippingLabel(selectedDrawerOrder, e)}
                                        className="h-8 px-3 rounded-xl bg-[#d4af37]/15 hover:bg-[#d4af37]/25 text-[#d4af37] border border-[#d4af37]/30 text-xs font-bold flex items-center gap-1.5 transition-all cursor-pointer"
                                        title="In phiếu đóng gói K58"
                                    >
                                        <i className="fas fa-print text-xs"></i>
                                        <span>In K58</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setSelectedDrawerOrder(null)}
                                        className="w-8 h-8 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white flex items-center justify-center text-xs transition-colors cursor-pointer"
                                    >
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>

                            {/* Drawer Body (Scrollable) */}
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4">
                                {/* KHỐI 1: THÔNG TIN GIAO HÀNG & KHÁCH HÀNG */}
                                <div className="bg-[#121214] border border-white/[0.06] rounded-2xl p-3.5 space-y-2.5">
                                    <div className="text-[11px] font-black uppercase text-zinc-400 tracking-wider flex items-center gap-2">
                                        <i className="fas fa-user-tag text-zinc-500"></i>
                                        <span>Thông Tin Khách Hàng & Giao Nhận</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div>
                                            <span className="text-zinc-500 block text-[10px]">Người nhận:</span>
                                            <span className="font-semibold text-zinc-200">{selectedDrawerOrder.customer || 'Khách vãng lai'}</span>
                                        </div>
                                        <div>
                                            <span className="text-zinc-500 block text-[10px]">Số điện thoại:</span>
                                            <span className="font-mono font-semibold text-zinc-200">{selectedDrawerOrder.phone || '---'}</span>
                                        </div>
                                        <div className="col-span-2">
                                            <span className="text-zinc-500 block text-[10px]">Địa chỉ giao:</span>
                                            <span className="text-zinc-300 leading-relaxed">{selectedDrawerOrder.address || 'Giao tại xưởng / Chưa có địa chỉ'}</span>
                                        </div>
                                        <div>
                                            <span className="text-zinc-500 block text-[10px]">Hạn giao (SLA):</span>
                                            <span className="font-mono text-zinc-300">{selectedDrawerOrder.deadline || selectedDrawerOrder.date || 'Không có'}</span>
                                        </div>
                                        <div>
                                            <span className="text-zinc-500 block text-[10px]">Mã vận đơn sàn:</span>
                                            <span className="font-mono text-zinc-300">{String(selectedDrawerOrder.orderCode || '').includes('MVĐ:') ? String(selectedDrawerOrder.orderCode).split('MVĐ:')[1].trim() : (selectedDrawerOrder.shippingCode || '---')}</span>
                                        </div>
                                        {selectedDrawerOrder.note && (
                                            <div className="col-span-2 p-2 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-[11px]">
                                                <b>Ghi chú:</b> {selectedDrawerOrder.note}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* KHỐI 2: DANH SÁCH SẢN PHẨM & PHỤ KIỆN & LỆNH SẢN XUẤT */}
                                <div className="bg-[#121214] border border-white/[0.06] rounded-2xl p-3.5 space-y-3">
                                    <div className="text-[11px] font-black uppercase text-zinc-400 tracking-wider flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <i className="fas fa-boxes-stacked text-zinc-500"></i>
                                            <span>Danh Sách Hàng Hóa</span>
                                        </div>
                                        <span className="text-[10px] text-zinc-500 font-mono">
                                            {parseAccessoriesSafe(selectedDrawerOrder.accessories).length} mục
                                        </span>
                                    </div>

                                    {/* Mảng phụ kiện */}
                                    <div className="space-y-2">
                                        {parseAccessoriesSafe(selectedDrawerOrder.accessories).length === 0 ? (
                                            <div className="text-xs text-zinc-500 py-2">Đơn hàng không có danh mục sản phẩm chi tiết.</div>
                                        ) : (
                                            parseAccessoriesSafe(selectedDrawerOrder.accessories).map((acc, aIdx) => (
                                                <div key={aIdx} className="flex items-center justify-between p-2 rounded-xl bg-[#09090b] border border-white/[0.04] text-xs">
                                                    <div className="min-w-0 pr-2">
                                                        <div className="font-semibold text-zinc-200 truncate">{acc.name || acc.title || 'Sản phẩm'}</div>
                                                        <div className="text-[10px] text-zinc-500">{acc.category || acc.unit || 'Chiếc'}</div>
                                                    </div>
                                                    <div className="font-mono font-bold text-zinc-200 px-2 py-1 bg-white/[0.06] rounded-lg text-xs shrink-0">
                                                        x{acc.quantity || acc.qty || 1}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    {/* Danh sách Lệnh sản xuất liên quan (Production Items) */}
                                    {(() => {
                                        const relProds = getMatchedProds(selectedDrawerOrder);
                                        if (relProds.length === 0) return null;
                                        return (
                                            <div className="pt-2 border-t border-white/[0.06] space-y-2">
                                                <div className="text-[10px] font-bold uppercase text-purple-400 flex items-center gap-1.5">
                                                    <i className="fas fa-hammer"></i>
                                                    <span>Lệnh Sản Xuất Xưởng ({relProds.length})</span>
                                                </div>
                                                <div className="space-y-1.5">
                                                    {relProds.map((rp, rpIdx) => (
                                                        <div key={rp.id || rpIdx} className="p-2 rounded-xl bg-purple-500/5 border border-purple-500/20 text-xs flex items-center justify-between">
                                                            <div>
                                                                <div className="font-bold text-zinc-200">{rp.name}</div>
                                                                <div className="text-[10px] text-zinc-400">
                                                                    Khâu 1: {rp.p1_user || 'Chưa nhận'} ({rp.p1_status || 'Chờ'}) &bull; Khâu 2: {rp.p2_user || 'Chưa nhận'} ({rp.p2_status || 'Chờ'})
                                                                </div>
                                                            </div>
                                                            <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-500/20 text-purple-300">
                                                                {rp.status || 'Chờ'}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>

                                {/* KHỐI 3: BÓC TÁCH CHI PHÍ (CHỈ HIỆN VỚI ADMIN/KẾ TOÁN) */}
                                {canViewFinance && (
                                    <div className="bg-[#121214] border border-white/[0.06] rounded-2xl p-3.5 space-y-2.5">
                                        <div className="text-[11px] font-black uppercase text-emerald-400 tracking-wider flex items-center gap-2">
                                            <i className="fas fa-wallet"></i>
                                            <span>Bóc Tách Chi Phí & Doanh Thu</span>
                                        </div>
                                        <div className="space-y-1.5 text-xs">
                                            <div className="flex justify-between text-zinc-300">
                                                <span>Doanh thu niêm yết:</span>
                                                <span className="font-mono font-bold text-emerald-400">{formatMoneySafe(selectedDrawerOrder.revenue)}đ</span>
                                            </div>
                                            <div className="flex justify-between text-zinc-400">
                                                <span>Giá vốn hàng bán (COGS):</span>
                                                <span className="font-mono text-zinc-300">{formatMoneySafe(selectedDrawerOrder.cogs)}đ</span>
                                            </div>
                                            {Number(selectedDrawerOrder.feeFixed) > 0 && (
                                                <div className="flex justify-between text-zinc-400">
                                                    <span>Phí cố định sàn:</span>
                                                    <span className="font-mono text-rose-400">-{formatMoneySafe(selectedDrawerOrder.feeFixed)}đ</span>
                                                </div>
                                            )}
                                            {Number(selectedDrawerOrder.feeService) > 0 && (
                                                <div className="flex justify-between text-zinc-400">
                                                    <span>Phí dịch vụ:</span>
                                                    <span className="font-mono text-rose-400">-{formatMoneySafe(selectedDrawerOrder.feeService)}đ</span>
                                                </div>
                                            )}
                                            {Number(selectedDrawerOrder.feePayment) > 0 && (
                                                <div className="flex justify-between text-zinc-400">
                                                    <span>Phí thanh toán:</span>
                                                    <span className="font-mono text-rose-400">-{formatMoneySafe(selectedDrawerOrder.feePayment)}đ</span>
                                                </div>
                                            )}
                                            <div className="pt-2 border-t border-white/[0.06] flex justify-between font-bold text-zinc-100">
                                                <span>Lãi gộp ước tính:</span>
                                                <span className="font-mono text-emerald-400">
                                                    {formatMoneySafe(
                                                        (Number(selectedDrawerOrder.revenue) || 0) -
                                                        (Number(selectedDrawerOrder.cogs) || 0) -
                                                        (Number(selectedDrawerOrder.feeFixed) || 0) -
                                                        (Number(selectedDrawerOrder.feeService) || 0) -
                                                        (Number(selectedDrawerOrder.feePayment) || 0)
                                                    )}đ
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* KHỐI 4: THAO TÁC ĐỔI TRẠNG THÁI NHANH */}
                                <div className="bg-[#121214] border border-white/[0.06] rounded-2xl p-3.5 space-y-2.5">
                                    <div className="text-[11px] font-black uppercase text-zinc-400 tracking-wider flex items-center gap-2">
                                        <i className="fas fa-sliders text-zinc-500"></i>
                                        <span>Thao Tác Đổi Trạng Thái Nhanh</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            type="button"
                                            onClick={(e) => handleUpdateOrderStatus(selectedDrawerOrder, 'Chờ Sản Xuất', e)}
                                            className="p-2.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/25 text-indigo-300 font-bold text-xs transition-all active:scale-95 cursor-pointer"
                                        >
                                            Chờ Sản Xuất
                                        </button>
                                        <button
                                            type="button"
                                            onClick={(e) => handleUpdateOrderStatus(selectedDrawerOrder, 'Đang Đóng Gói', e)}
                                            className="p-2.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/25 text-amber-300 font-bold text-xs transition-all active:scale-95 cursor-pointer"
                                        >
                                            Đang Đóng Gói
                                        </button>
                                        <button
                                            type="button"
                                            onClick={(e) => handleUpdateOrderStatus(selectedDrawerOrder, 'Đã Bàn Giao', e)}
                                            className="p-2.5 rounded-xl bg-sky-500/10 hover:bg-sky-500/20 border border-sky-500/25 text-sky-300 font-bold text-xs transition-all active:scale-95 cursor-pointer"
                                        >
                                            Đã Bàn Giao
                                        </button>
                                        <button
                                            type="button"
                                            onClick={(e) => handleUpdateOrderStatus(selectedDrawerOrder, 'Hoàn Thành', e)}
                                            className="p-2.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/25 text-emerald-300 font-bold text-xs transition-all active:scale-95 cursor-pointer"
                                        >
                                            Đối Soát Xong
                                        </button>
                                        <button
                                            type="button"
                                            onClick={(e) => handleUpdateOrderStatus(selectedDrawerOrder, 'Hàng Hoàn', e)}
                                            className="p-2.5 rounded-xl bg-purple-500/10 hover:bg-purple-500/20 border border-purple-500/25 text-purple-300 font-bold text-xs transition-all active:scale-95 cursor-pointer"
                                        >
                                            Kiểm Định Hoàn
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => handleCancelOrder(selectedDrawerOrder)}
                                            className="p-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/25 text-rose-400 font-bold text-xs transition-all active:scale-95 cursor-pointer"
                                        >
                                            Huỷ Đơn Hàng
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* CÁC MODAL NGHIỆP VỤ */}
                {(addingMode || draftData || editingOrder) && (
                    <AddModal
                        onClose={() => { setAddingMode(false); setDraftData(null); setEditingOrder(null); }}
                        pushDeltas={pushDeltas}
                        products={erpProducts}
                        erpData={erpData}
                        triggerToast={triggerToast}
                        userConfigs={userConfigs}
                        configGiaLayout={configGiaLayout}
                        draftData={draftData}
                        editOrder={editingOrder ? editingOrder.order : null}
                        editProds={editingOrder ? editingOrder.prods : []}
                    />
                )}

                {isScanningReturn && (
                    <ReturnScannerModal
                        onClose={() => setIsScanningReturn(false)}
                        orders={orders}
                        pushDeltas={pushDeltas}
                        triggerToast={triggerToast}
                    />
                )}

                {isScanningCancel && (
                    <CancelScannerModal
                        onClose={() => setIsScanningCancel(false)}
                        orders={orders}
                        prodItems={prodItems}
                        pushDeltas={pushDeltas}
                        triggerToast={triggerToast}
                    />
                )}

                {isBulkFinanceOpen && typeof BulkFinanceModal !== 'undefined' && (
                    <BulkFinanceModal
                        onClose={() => setIsBulkFinanceOpen(false)}
                        pushDeltas={pushDeltas}
                        orders={orders}
                        transactions={erpData?.Transactions || []}
                        accounts={erpData?.Accounts || []}
                    />
                )}

                {isArchiveEngineOpen && (
                    <ArchiveEngineModal
                        onClose={() => setIsArchiveEngineOpen(false)}
                        triggerToast={triggerToast}
                    />
                )}
            </div>
        );
    });
</script>
