                            address: '',
                            note: finalOrderCustomerNote,
                            createdAt: orderDateFormatted, 
                            deadline: defaultDeadline, 
                            date: dateOnly,
                            status: finalStatus, 
                            accessories: JSON.stringify(accessories),
                            hasProduction: hasProdItems, 
                            updatedBy: activeUser, 
                            responsibleUser: activeUser,
                            revenue: Number(o.revenue || 0),
                            feeFixed: o.feeFixed || 0,
                            feeService: o.feeService || 0,
                            feePayment: o.feePayment || 0,
                            feeAffiliate: o.feeAffiliate || 0,
                            shopVoucher: o.shopVoucher || 0,
                            shippingCode: effShippingCode,
                            shippingMethod: o.shippingMethod || ''
                        });
                    }
                });

                const updateCount = newOrders.filter(o => {
                    const matchingO = validOrders.find(v => v.existingId === o.id);
                    return matchingO && matchingO.isUpdate;
                }).length;
                const newCount = newOrders.length - updateCount;
                let msg = '';
                if (newCount > 0 && updateCount > 0) {
                    msg = `Đã bơm ${newCount} đơn mới, cập nhật ${updateCount} đơn & kích hoạt ${newProdItems.length} lệnh xưởng!`;
                } else if (newCount > 0) {
                    msg = `Đã bơm ${newCount} đơn mới & kích hoạt ${newProdItems.length} lệnh xưởng!`;
                } else {
                    msg = `Đã cập nhật thông tin cho ${updateCount} đơn hàng!`;
                }

                await pushDeltas({
                    orders: newOrders,
                    prodItems: newProdItems,
                    ...(deleteProdIds.length > 0 ? { deletes: { Production: deleteProdIds } } : {})
                }, msg, 'fa-rocket');
                setIsSubmitting(false);
                onClose();
            } catch (e) {
                alert('Lỗi khi bơm đơn: ' + e.message);
                setIsSubmitting(false);
            }
        };


        const validCount = preview.filter(p => !p.isDuplicate).length;

        return (
            <div 
                className="fixed inset-0 bg-black/80 z-[110] flex items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm"
                onClick={(e) => { if (e.target === e.currentTarget && !isSubmitting) handleCancel(); }}
            >
                <div 
                    className="bg-[#141414] border border-[#333] w-full max-w-lg h-[88vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl overflow-hidden"
                    onClick={(e) => e.stopPropagation()}
                >
                    <div className="p-4 border-b border-[#222] bg-[#1a1a1a] flex justify-between items-center">
                        <h2 className="font-black text-lg text-[#3b82f6] tracking-wide"><i className="fas fa-file-excel mr-2"></i>TRẠM BƠM ĐƠN</h2>
                        <button 
                            type="button" 
                            onClick={handleCancel} 
                            disabled={isSubmitting} 
                            className="w-8 h-8 bg-[#222] rounded-full text-gray-400 hover:text-rose-500 flex items-center justify-center disabled:opacity-50 transition-colors"
                            title="Đóng / Hủy"
                        >
                            <i className="fas fa-times"></i>
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                        <div className="bg-[#0a0a0a] text-[#888] p-3 rounded-xl border border-[#222] text-[11px] font-bold shadow-sm flex items-center">
                            <i className="fas fa-brain mr-2 text-[#3b82f6] text-lg"></i>
                            <span>Hệ thống tự động quét kho: Đủ hàng ➔ <b>Bù kho</b> | Thiếu hàng ➔ <b>Chờ Sản Xuất</b>.</span>
                        </div>

                        <div onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }} onDragLeave={(e) => { e.preventDefault(); setIsDragging(false); }} onDrop={(e) => {
                            e.preventDefault();
                            setIsDragging(false); if (e.dataTransfer.files.length > 0) handleFileUpload(e.dataTransfer.files[0]);
                        }} className={`relative w-full h-32 flex flex-col items-center justify-center border-2 border-dashed rounded-2xl transition-all ${isDragging ?
                            'border-[#3b82f6] bg-[#3b82f6]/10' : 'border-[#333] bg-[#0a0a0a]'}`}>
                            <input 
                                type="file" 
                                accept=".xlsx, .xls, .csv" 
                                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
                                onClick={(e) => { e.target.value = null; }} 
                                onChange={(e) => {
                                    if (e.target.files && e.target.files.length > 0) {
                                        handleFileUpload(e.target.files[0]);
                                    }
                                }} 
                            />
                            <div className="group-hover:-translate-y-1 transition-transform text-center pointer-events-none">
                                <i className={`fas ${fileName ? 'fa-file-excel text-[#10b981]' : 'fa-cloud-upload-alt text-[#3b82f6]'} text-4xl mb-3 drop-shadow-md`}></i>
                                <div className="text-[13px] font-bold text-[#f5f5f5] mb-1">{fileName ? fileName : 'Chạm để chọn file Excel / CSV'}</div>
                                <div className="text-[10px] text-gray-500 font-medium">Hỗ trợ mọi định dạng xuất từ Shopee/Tiktok</div>
                            </div>
                        </div>

                        {isProcessing && (
                            <div className="bg-[#0a0a0a] border border-[#333] p-3 rounded-xl">
                                <div className="flex justify-between text-[11px] font-bold mb-1.5 text-gray-400"><span>Đang phân tích và quét kho...</span><span className="text-[#3b82f6]">{progress}%</span></div>
                                <div className="w-full bg-[#222] rounded-full h-2 overflow-hidden border border-[#333]"><div className="bg-[#3b82f6] h-2 rounded-full transition-all" style={{ width: `${progress}%` }}></div></div>
                            </div>
                        )}

                        {preview.length > 0 && !isProcessing && (
                            <div className="space-y-2 max-h-[42vh] overflow-y-auto custom-scrollbar pr-1">
                                {preview.map((p, idx) => (
                                    <div key={idx} className={`p-3 rounded-xl border transition-all ${p.isDuplicate ? 'bg-[#4c0519]/40 border-rose-500/30' :
                                        p.isUpdate ? 'bg-amber-500/10 border-amber-500/30 border-l-4 border-l-amber-500' :
                                            'bg-[#0a0a0a] border-[#222] border-l-4 border-l-[#3b82f6]'
                                        }`}>
                                        <div className="flex justify-between items-center mb-1">
                                            <div className={`font-black text-[12px] ${p.isDuplicate ? 'text-rose-400 line-through opacity-70' : 'text-[#f5f5f5]'}`}>{p.orderCode} <span className="text-[9px] text-[#3b82f6] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded ml-1">{p.channel}</span></div>
                                            {p.isDuplicate && <span className="text-[9px] font-black bg-rose-500/20 text-rose-500 px-2 py-0.5 rounded border border-rose-500/30">ĐÃ BƠM</span>}
                                            {p.isUpdate && (
                                                <span className="text-[9px] font-black bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30 flex items-center gap-1">
                                                    <i className="fas fa-sync-alt text-[8px]"></i>
                                                    {p.hasNewTrack ? 'CẬP NHẬT MVĐ' : 'CẬP NHẬT'}
                                                </span>
                                            )}
                                        </div>
                                        <div className="flex justify-between items-center text-[9px] text-gray-500 font-bold mb-2 gap-2 flex-wrap bg-[#111] p-1.5 rounded-lg border border-[#222]">
                                            <span>Khách: <span className="text-[#3b82f6]">{p.customer}</span></span>
                                            <span className="flex items-center gap-1">
                                                <i className="far fa-calendar-alt text-[#3b82f6]"></i> Ngày đơn:
                                                <input
                                                    type="date"
                                                    className="bg-[#1a1a1a] text-gray-200 border border-[#333] rounded px-1.5 py-0.5 text-[10px] focus:border-[#3b82f6] outline-none"
                                                    value={p.rawDate ? p.rawDate.slice(0, 10) : safeDateFull.slice(0, 10)}
                                                    onChange={(e) => handleDateChange(idx, e.target.value)}
                                                />
                                            </span>
                                            <span>Doanh thu: <span className="text-emerald-500">{Number(p.revenue || 0).toLocaleString('vi-VN')}đ</span></span>
                                        </div>
                                        {p.items.map((it, i) => {
                                            const prodInfo = checkProductionItemType(it, products);
                                            const inStock = prodInfo.matchedProd ? Number(prodInfo.matchedProd.quantity) : (it.matchedProd ? Number(it.matchedProd.quantity) : 0);
                                            const isEnough = inStock >= Number(it.qty);
                                            const isAcc = !prodInfo.isProd;

                                            const finalDisplayTitle = (it.matchedProd && it.matchedProd.name) ? it.matchedProd.name : it.name;

                                            return (
                                                <div key={i} className="py-2 border-t border-[#222] space-y-1.5">
                                                    <div className="flex justify-between items-start text-[11px] font-bold">
                                                        <div className="flex flex-col flex-1 pr-2">
                                                            <span className="text-[#d4af37] leading-snug">{finalDisplayTitle}</span>
                                                            {it.sku && (
                                                                <span className="text-[9.5px] font-mono text-[#3b82f6] font-bold mt-0.5 flex items-center gap-1">
                                                                    <i className="fas fa-barcode"></i> SKU: {it.sku}
                                                                </span>
                                                            )}
                                                            {!p.isDuplicate && (
                                                                <span className={`text-[9px] mt-0.5 ${p.isUpdate ? 'text-amber-400' : (isAcc ? 'text-emerald-400 font-semibold' : (isEnough ? 'text-emerald-400' : 'text-orange-400'))}`}>
                                                                    {p.isUpdate ? '✓ Lệnh cũ được giữ nguyên (Chỉ cập nhật thông tin)' : (isAcc ? '✓ Phụ kiện / Nguyên liệu (Chỉ gói kèm, không tạo lệnh sản xuất)' : (isEnough ? '✓ Đủ hàng trong kho (Tự động bù kho)' : `⚠ Thiếu hàng (Kho: ${inStock} -> Lệnh sản xuất)`))}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <span className={`${p.isDuplicate ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-[#3b82f6] text-white'} text-[10px] font-black px-2 py-0.5 rounded-md shrink-0 ml-2`}>x{it.qty}</span>
                                                    </div>

                                                    {/* Bộ chọn liên kết sản phẩm kho trực tiếp ngay trên form */}
                                                    <div className="flex items-center gap-1.5 pt-0.5">
                                                        <span className="text-[9px] text-[#3b82f6] font-bold shrink-0 flex items-center gap-1">
                                                            <i className="fas fa-link text-[10px]"></i> Liên kết SP:
                                                        </span>
                                                        <select
                                                            className="bg-[#121214] text-gray-200 text-[10px] font-medium border border-[#333] hover:border-[#3b82f6] focus:border-[#3b82f6] rounded-lg px-2 py-1 w-full outline-none transition-colors cursor-pointer"
                                                            value={it.matchedProd ? it.matchedProd.name : (it.name || '')}
                                                            onChange={(e) => handleItemLink(idx, i, e.target.value)}
                                                        >
                                                            <option value={it.matchedProd ? it.matchedProd.name : it.name}>
                                                                {it.matchedProd ? `✓ Đã khớp: ${it.matchedProd.name}` : `-- Tự động quét: ${it.name} --`}
                                                            </option>
                                                            <optgroup label="📦 DANH MỤC HÀNG HOÁ KHO ERP">
                                                                {(products || []).map(prod => (
                                                                    <option key={prod.id || prod.name} value={prod.name}>
                                                                        {prod.name} ({prod.sku ? prod.sku + ' - ' : ''}{prod.category || 'Khác'} - Tồn: {prod.quantity || 0})
                                                                    </option>
                                                                ))}
                                                            </optgroup>
                                                        </select>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="p-4 bg-[#1a1a1a] border-t border-[#333] rounded-b-3xl sm:rounded-b-3xl flex flex-col gap-2.5">
                        <div className="flex gap-3">
                            <button 
                                type="button" 
                                onClick={handleCancel} 
                                disabled={isSubmitting} 
                                className="flex-1 py-3.5 bg-[#222] hover:bg-[#333] text-gray-300 font-black text-[12px] rounded-xl active:scale-95 transition-all disabled:opacity-50"
                            >
                                HỦY TÁC VỤ
                            </button>
                            <button 
                                type="button" 
                                onClick={submit} 
                                disabled={isSubmitting || isProcessing || validCount === 0} 
                                className={`flex-[2] py-3.5 text-white rounded-xl font-black text-[13px] tracking-wide shadow-md flex items-center justify-center gap-2 transition-all active:scale-95 ${isSubmitting || isProcessing || validCount === 0 ? 'bg-[#333] text-gray-500' : 'bg-[#3b82f6] hover:bg-[#2563eb]'}`}
                            >
                                {isSubmitting ? <><i className="fas fa-spinner fa-spin"></i> ĐANG XỬ LÝ...</> : `CHỐT BƠM ${validCount} ĐƠN`}
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        );
    }

    // ==========================================
    // 2. FORM TẠO ĐƠN THÔNG MINH - TÍCH HỢP AI QUÉT KHO & ĐƠN VỊ TÍNH
    // ==========================================
    function AddModal({ onClose, pushDeltas, products = [], erpData, triggerToast, editOrder = null, editProds = [], userConfigs, configGiaLayout = [], draftData = null, forceSXTOnly = false }) {
        const isEdit = !!editOrder;
        const currentUser = localStorage.getItem('rf_user') || 'Quản lý';
        const role = localStorage.getItem('rf_role');
        const currentRole = role || '';
        const canViewCost = role === 'QUẢN LÝ KHO' || role === 'TỐI CAO' || role === 'KẾ TOÁN';

        const isSaleRole = role === 'BÁN HÀNG';
        const forceSXT = role === 'SẢN XUẤT';
        const saleChannels = ['Bán Lẻ', 'Bán Sỉ', 'Cộng Tác Viên', 'Bảo Hành & Thu Hồi'];
        const [channel, setChannel] = React.useState(() => {
            if (editOrder && editOrder.channel) return editOrder.channel;
            if (draftData && draftData.channel) return draftData.channel;
            if (forceSXTOnly) return 'Sản Xuất Tồn';
            if (role === 'CỘNG TÁC VIÊN' || role === 'CTV') return 'Cộng Tác Viên';
            return isSaleRole ? 'Bán Lẻ' : (forceSXT ? 'Sản Xuất Tồn' : 'Bán Lẻ');
        });
        const isCTV = role === 'CỘNG TÁC VIÊN' || role === 'CTV' || channel === 'Cộng Tác Viên';
        const isSXT = channel === 'Sản Xuất Tồn';
        const isSaleUI = !isSXT && !forceSXTOnly;

        React.useEffect(() => {
            window.scrollTo(0, 0);
        }, []);

        const [orderCode, setOrderCode] = React.useState(() => {
            if (editOrder && editOrder.orderCode) return editOrder.orderCode.split(' | MVĐ: ')[0];
            if (draftData?.orderCode) return draftData.orderCode;
            if (forceSXT || forceSXTOnly || isSXT) return 'TK' + Date.now().toString().slice(-8);
            if (channel === 'Bán Lẻ') return 'BL' + Date.now().toString().slice(-6);
            if (channel === 'Bán Sỉ') return 'BS' + Date.now().toString().slice(-6);
            if (channel === 'Cộng Tác Viên') return 'CTV' + Date.now().toString().slice(-6);
            if (channel === 'Bảo Hành & Thu Hồi' || channel === 'Bảo Hành') return 'BH' + Date.now().toString().slice(-6);
            return 'ORD' + Date.now().toString().slice(-6);
        });
        const [customer, setCustomer] = React.useState(() => {
            if (editOrder && editOrder.customer) return editOrder.customer;
            if (draftData?.customer) return draftData.customer;
            return (forceSXT || forceSXTOnly || isSXT) ? currentUser : '';
        });
        const [phone, setPhone] = React.useState(() => {
            let p = '';
            if (editOrder && editOrder.phone) p = String(editOrder.phone);
            else if (draftData?.phone) p = String(draftData?.phone);
            if (p && p.length >= 8 && !p.startsWith('0')) p = '0' + p;
            return p;
        });
        const [address, setAddress] = React.useState(() => { if (editOrder && editOrder.address) return editOrder.address; if (draftData?.address) return draftData.address; return ''; });
        const [note, setNote] = React.useState(() => { if (editOrder && editOrder.note) return editOrder.note; if (draftData?.note) return draftData.note; return ''; });
        const [trackingId, setTrackingId] = React.useState(() => { if (editOrder && editOrder.orderCode && editOrder.orderCode.includes(' | MVĐ: ')) return editOrder.orderCode.split(' | MVĐ: ')[1]; if (draftData?.trackingId) return draftData.trackingId; return ''; });
        const accountsData = erpData?.Accounts || [];
        const [receivingAccount, setReceivingAccount] = React.useState(() => {
            if (editOrder && editOrder.receivingAccount) return editOrder.receivingAccount;
            return 'ACC_1782746951474';
        });
        const [retailTotal, setRetailTotal] = React.useState((editOrder && editOrder.revenue) ? editOrder.revenue : 0);
        const [feeFixed, setFeeFixed] = React.useState((editOrder && editOrder.feeFixed) ? editOrder.feeFixed : 0);
        const [feeService, setFeeService] = React.useState((editOrder && editOrder.feeService) ? editOrder.feeService : 0);
        const [feePayment, setFeePayment] = React.useState((editOrder && editOrder.feePayment) ? editOrder.feePayment : 0);
        const [feeAffiliate, setFeeAffiliate] = React.useState((editOrder && editOrder.feeAffiliate) ? editOrder.feeAffiliate : 0);
        const [shopVoucher, setShopVoucher] = React.useState((editOrder && editOrder.shopVoucher) ? editOrder.shopVoucher : 0);
        const [tax, setTax] = React.useState((editOrder && editOrder.tax) ? editOrder.tax : 0);

        const autoCalculateFees = (rev, chan) => {
            const revenueAmt = Number(rev) || 0;
            if (chan === 'Shopee VN') {
                setFeeFixed(revenueAmt * 0.14);
                setFeeService(revenueAmt * 0.062);
                setFeePayment(revenueAmt * 0.0603);
                setTax(revenueAmt * 0.015);
                setFeeAffiliate(0);
            } else if (chan === 'Tiktok Shop') {
                setFeeFixed(revenueAmt * 0.08); // Example rate
                setFeeService(revenueAmt * 0.05); // Example rate
                setFeePayment(revenueAmt * 0.04); // Example rate
                setTax(revenueAmt * 0.015);
                setFeeAffiliate(0);
            } else {
                setFeeFixed(0);
                setFeeService(0);
                setFeePayment(0);
                setTax(0);
                setFeeAffiliate(0);
            }
        };


        const handleRetailTotalChange = (val) => {
            setRetailTotal(val);
            if (!isEdit) autoCalculateFees(val, channel);
        };

        const [ctvLayoutModal, setCtvLayoutModal] = React.useState(null);
        const [prePaid, setPrePaid] = React.useState(() => {
            if (editOrder) {
                if (editOrder.channel === 'Cộng Tác Viên') return 0;
                return editOrder.prePaid || '';
            }
            return '';
        });
        const [retailDiscount, setRetailDiscount] = React.useState(() => {
            if (editOrder) {
                if (editOrder.channel === 'Cộng Tác Viên') {
                    const d = Number(editOrder.discount) || 0;
                    return d !== 0 ? editOrder.discount : (editOrder.prePaid || '');
                }
                return editOrder.discount || '';
            }
            return '';
        });
        const [additionalCost, setAdditionalCost] = React.useState((editOrder && editOrder.shippingFee) ? editOrder.shippingFee : 0);
        const [responsibleUser, setResponsibleUser] = React.useState(() => {
            if (editOrder && editOrder.responsibleUser) return editOrder.responsibleUser;
            if (draftData?.responsibleUser) return draftData.responsibleUser;
            return currentUser || '';
        });
        const [shippingMethod, setShippingMethod] = React.useState(() => { if (editOrder && editOrder.shippingMethod) return editOrder.shippingMethod; if (draftData?.shippingMethod) return draftData.shippingMethod; return 'Gửi GHN'; });
        const [sizeCoefficient, setSizeCoefficient] = React.useState((editOrder && editOrder.sizeCoefficient) ? editOrder.sizeCoefficient : 1.0);

        const [depositFile, setDepositFile] = React.useState(null);
        const safeDate = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
        const [deadline, setDeadline] = React.useState(() => {
            if (editOrder && editOrder.deadline) return editOrder.deadline;
            return typeof getAutoDeadline === 'function' ? getAutoDeadline(channel) : safeDate.slice(0, 16);
        });
        // Tự động phân luồng: Hàng lạ/Phụ kiện vào list phụ kiện. Bể kính/Layout vào lệnh sản xuất.
        const [accessories, setAccessories] = React.useState(() => {
            let acc = (editOrder && editOrder.accessories) ? editOrder.accessories : [];
            while (typeof acc === 'string') { try { acc = JSON.parse(acc); } catch (e) { break; } }
            acc = Array.isArray(acc) ? acc : [];

            if (!isEdit && draftData && draftData.items && draftData.items.length > 0) {
                draftData.items.forEach(it => {
                    const prodInfo = checkProductionItemType(it, products);
                    if (!prodInfo.isProd) {
                        const matched = prodInfo.matchedProd;
                        acc.push({
                            name: matched ? matched.name : it.name,
                            quantity: it.qty || 1,
                            price: matched ? (Number(matched.price) || 0) : 0,
                            hasProduction: false
                        });
                    }
                });
            }
            return acc;
        });

        const [appealStatus, setAppealStatus] = React.useState('Hàng Hoàn (Nguyên vẹn)');
        const [appealVideo, setAppealVideo] = React.useState(null);
        const [isUploadingAppeal, setIsUploadingAppeal] = React.useState(false);

        const [prods, setProds] = React.useState(() => {
            if (editProds && editProds.length > 0) return JSON.parse(JSON.stringify(editProds));
            let pList = [];

            if (!isEdit && draftData && draftData.items && draftData.items.length > 0) {
                draftData.items.forEach((it, itIdx) => {
                    const prodInfo = checkProductionItemType(it, products);
                    if (prodInfo.isProd || forceSXTOnly || isSXT) {
                        const isGlass = prodInfo.isGlass;
                        const pName = prodInfo.matchedProd ? prodInfo.matchedProd.name : it.name;
                        const phases = isGlass ? 
                            { phase1: { name: 'Cắt Dán', status: 'Pending' }, phase2: { name: 'Gọt Keo', status: 'Pending' } } : 
                            { phase1: { name: 'Dựng Khung', status: 'Pending' }, phase2: { name: 'Gia Cố', status: 'Pending' } };
                        const qty = Number(it.qty) || 1;

                        // Nếu khách đặt / gom sản xuất số lượng > 1, tạo các lệnh sản xuất tương ứng
                        for (let i = 0; i < qty; i++) {
                            pList.push({
                                id: 'P' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + itIdx + '_' + i,
                                type: isGlass ? 'Bể Kính' : 'Layout',
                                name: pName,
                                note: isSXT || forceSXTOnly ? `[Sản Xuất Tồn] Gom hàng hết kho` : `[Quét Tự Động] Từ nhãn: ${it.name}`,
                                status: 'Pending',
                                fulfilledFromStock: false,
                                phases
                            });
                        }
                    }
                });
            }
            return pList;
        });
        const [deletedProds, setDeletedProds] = React.useState([]);
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const usersList = (userConfigs?.users || []).filter(u => u !== 'Khách');
        React.useEffect(() => {
            if (!isEdit && isSaleUI) {
                const rand = (len) => Math.floor(Math.pow(10, len - 1) + Math.random() * 9 * Math.pow(10, len - 1));
                if (channel === 'Bán Lẻ' || channel === 'Bán Sỉ') setOrderCode(`BL${rand(6)}`);
                else if (channel === 'Cộng Tác Viên') setOrderCode(`CTV${rand(5)}`);
                else if (channel === 'Bảo Hành & Thu Hồi' || channel === 'Bảo Hành') setOrderCode(`BH${rand(6)}`);
            }
        }, [channel, isEdit, isSaleUI]);

        const [localProds, setLocalProds] = React.useState([]);
        const [searchTarget, setSearchTarget] = React.useState(null);
        const [swapIndex, setSwapIndex] = React.useState(null);
        const [sq, setSq] = React.useState('');
        const [layoutStep, setLayoutStep] = React.useState(1);
        const [selSub, setSelSub] = React.useState('');
        const [selVer, setSelVer] = React.useState('');
        const [showQuickAdd, setShowQuickAdd] = React.useState(false);

        const [qaData, setQaData] = React.useState({ 
            name: '', dim: '', l: '', w: '', h: '', matSku: '', price: '', cost: '', sku: '', realImage: '', unit: 'Bộ', quantity: 0, _calcInfo: null 
        });
        const handleChannelChange = (val) => {
            setChannel(val);
            if (val === 'Sản Xuất Tồn') {
                setOrderCode('TK' + Date.now().toString().slice(-8));
                setCustomer(currentUser.split(' ').pop());
                setTrackingId('');
                setRetailTotal(0);
                setAccessories([]);
            } else if (!isEdit) {
                if (!orderCode || orderCode.startsWith('TK') || orderCode.startsWith('BL') || orderCode.startsWith('BS') || orderCode.startsWith('CTV') || orderCode.startsWith('BH') || orderCode.startsWith('ORD')) {
                    if (val === 'Bán Lẻ') setOrderCode('BL' + Date.now().toString().slice(-6));
                    else if (val === 'Bán Sỉ') setOrderCode('BS' + Date.now().toString().slice(-6));
                    else if (val === 'Cộng Tác Viên') setOrderCode('CTV' + Date.now().toString().slice(-6));
                    else if (val === 'Bảo Hành & Thu Hồi' || val === 'Bảo Hành') setOrderCode('BH' + Date.now().toString().slice(-6));
                    else setOrderCode('ORD' + Date.now().toString().slice(-6));
                }
            }
            if (!isEdit) {
                autoCalculateFees(retailTotal, val);
                if (typeof getAutoDeadline === 'function') {
                    setDeadline(getAutoDeadline(val));
                }
            }
        };

        const combinedProds = React.useMemo(() => [...products, ...localProds], [products, localProds]);

        const autoGoodsTotal = React.useMemo(() => {
            let totalProds = (prods || []).reduce((sum, p) => {
                const pInfo = (combinedProds || []).find(x => x.name === p.name);
                const itemPrice = (p.price !== undefined && p.price !== null && p.price !== '') ? Number(p.price) : Number(pInfo?.price || 0);
                const qty = Number(p.qty || 1);
                return sum + (itemPrice * qty);
            }, 0);

            let totalAccs = (accessories || []).reduce((sum, a) => {
                const aInfo = (combinedProds || []).find(x => x.name === a.name);
                const itemPrice = (a.price !== undefined && a.price !== null && a.price !== '') ? Number(a.price) : Number(aInfo?.price || 0);
                const qty = Number(a.quantity || 1);
                return sum + (itemPrice * qty);
            }, 0);

            return totalProds + totalAccs;
        }, [prods, accessories, combinedProds]);

        React.useEffect(() => {
            if (!isEdit || retailTotal === 0) {
                setRetailTotal(autoGoodsTotal);
            }
        }, [autoGoodsTotal]);
        const rawMaterialsList = React.useMemo(() => {
            const list = (combinedProds || []).filter(p => {
                const cat = String(p.category || '').toUpperCase().trim();
                const subCat = String(p.sub_category || '').toUpperCase().trim();
                const sku = String(p.sku || '').toUpperCase().trim();
                return cat.includes('SẢN XUẤT') || cat.includes('NGUYÊN LIỆU') || cat.includes('VẬT TƯ') ||
                       subCat.includes('SẢN XUẤT') || subCat.includes('NGUYÊN LIỆU') || subCat.includes('VẬT TƯ') ||
                       sku.startsWith('NLSX-') || sku.startsWith('VTSX-');
            });
            const map = new Map();
            list.forEach(it => { if (it.name && !map.has(it.name)) map.set(it.name, it); });
            return Array.from(map.values());
        }, [combinedProds]);
        const activeProds = React.useMemo(() => {
            let filtered = combinedProds.filter(p => {
                const cat = String(p.category || '').toUpperCase().trim();
                const subCat = String(p.sub_category || '').toUpperCase().trim();
                
                if (searchTarget === 'glass') {
                    // Chỉ lấy BỂ KÍNH thành phẩm, loại trừ nguyên liệu bể kính
                    if (cat === 'DANH MỤC SẢN XUẤT' || subCat.includes('NGUYÊN LIỆU')) return false;
                    return cat === 'BỂ KÍNH' || subCat === 'BỂ KÍNH' || ['BỂ MINI', 'TERRARIUM', 'BÁN CẠN', 'BỂ BETTA', 'BỂ NÂNG ĐÁY', 'BỂ LẺ SIZE', 'BE LE SIZE'].includes(subCat) ||
                           String(p.name || '').toLowerCase().includes('bể kính') || String(p.name || '').toLowerCase().includes('hồ kính') ||
                           String(p.sku || '').toUpperCase().startsWith('BK') || String(p.sku || '').toUpperCase().startsWith('BE');
                } else if (searchTarget === 'layout') {
                    // Chỉ lấy LAYOUT thành phẩm, loại trừ nguyên liệu layout
                    if (cat === 'DANH MỤC SẢN XUẤT' || subCat.includes('NGUYÊN LIỆU')) return false;
                    return cat === 'LAYOUT' || cat === 'THÀNH PHẨM' || cat.includes('LAYOUT') || ['LINH THÚ', 'VÁCH SUỐI', 'HẺM NÚI', 'NATURE', 'NHẤT TRỤ', 'TRĂNG', 'BONSAI', 'CẦU VỒNG', 'BIOTOP CUỘI', 'HANG ĐỘNG', 'RỪNG', 'ĐẢO BAY', 'CỔNG VÒM', 'COVER'].includes(subCat) ||
                           String(p.name || '').toLowerCase().includes('layout') || String(p.name || '').toLowerCase().includes('rừng') ||
                           String(p.sku || '').toUpperCase().startsWith('RUN') || String(p.sku || '').toUpperCase().startsWith('NAT') ||
                           String(p.sku || '').toUpperCase().startsWith('SAN') || String(p.sku || '').toUpperCase().startsWith('CV');
                } else if (searchTarget === 'acc') {
                    // Phụ kiện + Nguyên liệu bán lẻ
                    return cat === 'PHỤ KIỆN' || cat === 'HÀNG HOÁ' || cat === 'DANH MỤC SẢN XUẤT' || cat === 'NGUYÊN LIỆU' || cat === 'VẬT TƯ SẢN XUẤT' ||
                           subCat.includes('NGUYÊN LIỆU') || subCat.includes('VẬT TƯ') ||
                           ['CÁT, PHÂN NỀN', 'BƠM LỌC', 'VẬT LIỆU LỌC', 'ĐÈN LED', 'THỨC ĂN', 'PHỤ KIỆN KHÁC'].includes(subCat) ||
                           (!cat || cat === 'KHÁC');
                }
                return false;
            });
            if (sq) filtered = filtered.filter(p => String(p.name).toLowerCase().includes(sq.toLowerCase()) || String(p.sku).toLowerCase().includes(sq.toLowerCase()));
            return filtered;
        }, [combinedProds, searchTarget, sq]);

        const layoutData = React.useMemo(() => {
            if (searchTarget !== 'layout') return { subs: [], vers: [], dims: [] };
            const subs = [...new Set(activeProds.map(p => p.sub_category || 'Khác'))];
            let vers = []; let dims = [];
            if (selSub) {
                const prodInSub = activeProds.filter(p => (p.sub_category || 'Khác') === selSub);
                vers = [...new Set(prodInSub.map(p => { if (!String(p.name).includes(' - ')) return p.name; const parts = p.name.split(' - '); parts.pop(); return parts.join(' - '); }))];
                if (selVer) dims = prodInSub.filter(p => String(p.name) === selVer || String(p.name).startsWith(selVer + ' - '));
            }
            return { subs, vers, dims };
        }, [activeProds, searchTarget, selSub, selVer]);

        const selectProduct = (p) => {
            const pInfo = (combinedProds || []).find(x => x.name === p.name);
            const itemPrice = Number(p.price !== undefined ? p.price : (pInfo?.price || 0));

            if (searchTarget === 'acc') {
                const existingIdx = accessories.findIndex(a => a.name === p.name);
                if (existingIdx >= 0) {
                    const newAcc = [...accessories];
                    newAcc[existingIdx].quantity = (Number(newAcc[existingIdx].quantity) || 0) + 1;
                    if (!newAcc[existingIdx].price) newAcc[existingIdx].price = itemPrice;
                    setAccessories(newAcc);
                } else {
                    setAccessories([...accessories, { name: p.name, quantity: 1, price: itemPrice }]);
                }
            }
            else {
                const isGlass = searchTarget === 'glass';
                const prodType = isGlass ? 'Bể Kính' : 'Layout';

                const phases = isGlass ? { phase1: { name: 'Cắt Dán', status: 'Pending' }, phase2: { name: 'Gọt Keo', status: 'Pending' } } : { phase1: { name: 'Dựng Khung', status: 'Pending' }, phase2: { name: 'Gia Cố', status: 'Pending' } };
                if (swapIndex !== null) {
                    const newProds = [...prods];
                    const oldType = newProds[swapIndex].type;
                    newProds[swapIndex] = { ...newProds[swapIndex], type: isGlass ? 'Bể Kính' : 'Layout', name: p.name, price: itemPrice };
                    if (oldType !== (isGlass ? 'Bể Kính' : 'Layout')) {
                        newProds[swapIndex].phases = phases;
                    }
                    setProds(newProds);
                } else {
                    setProds([...prods, { id: 'P' + Date.now() + Math.random(), type: isGlass ? 'Bể Kính' : 'Layout', name: p.name, price: itemPrice, qty: 1, note: '', status: 'Pending', fulfilledFromStock: false, phases }]);
                }
            }
            closeSearch();
        };

        const closeSearch = () => {
            setSearchTarget(null); setSq(''); setShowQuickAdd(false); setLayoutStep(1); setSelSub(''); setSelVer(''); setSwapIndex(null);
            setQaData({ name: '', dim: '', price: '', cost: '', sku: '', realImage: '', unit: 'Cái' });
        };

        const handleDimChange = (val) => {
            const skuSuffix = val.toLowerCase().replace(/cm/g, '').replace(/\s/g, '').replace(/x/g, '');
            let finalSku = `SKU-${skuSuffix}`;

            if (selVer) {
                const cleanVer = selVer.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, '');
                let baseSku = cleanVer.length >= 3 ? cleanVer.substring(0, 3).toUpperCase() : 'LAY';

                const verMatch = selVer.match(/ver\.?\s*(\d+)/i);
                if (verMatch) baseSku += `-${String(verMatch[1]).padStart(3, '0')}`;
                else baseSku += '-001';
                finalSku = `${baseSku}-${skuSuffix}`;
            }
            setQaData({ ...qaData, dim: val, sku: finalSku });
        };

        const submitQuickAdd = () => {
            if (showQuickAdd === 'layout_sub') { setSelSub(qaData.name); setLayoutStep(2); setShowQuickAdd(false); setQaData({ name: '', dim: '', price: '', cost: '', sku: '', realImage: '', unit: 'Cái' }); return; }
            if (showQuickAdd === 'layout_ver') { setSelVer(qaData.name); setLayoutStep(3); setShowQuickAdd(false); setQaData({ name: '', dim: '', price: '', cost: '', sku: '', realImage: '', unit: 'Cái' }); return; }

            let finalName = qaData.name;
            let finalSku = qaData.sku || `SKU${Date.now().toString().slice(-6)}`;
            let cat = searchTarget === 'acc' ? 'PHỤ KIỆN' : (searchTarget === 'glass' ? 'BỂ KÍNH' : 'LAYOUT');
            let subCat = searchTarget === 'layout' ? (selSub || 'Khác') : (searchTarget === 'glass' ? 'BỂ LẺ SIZE' : 'Khác');
            let templateImg = '';

            if (searchTarget === 'layout' || showQuickAdd === 'layout_dim') {
                if (!qaData.dim) return alert('Nhập kích thước!');
                let cleanDimName = qaData.dim.toLowerCase().replace(/\s/g, '').replace(/cm/g, '');
                finalName = `${selVer} - ${cleanDimName}cm`;
                const templateProd = localProds.find(p => p.name && (p.name === selVer || p.name.startsWith(selVer + ' - ')) && p.image);
                if (templateProd) templateImg = templateProd.image;
            } else if (searchTarget === 'glass' && qaData.dim) {
                finalName = `${qaData.name} - ${qaData.dim}`;
            }

            if (!finalName) return alert('Nhập đủ thông tin!');
            const newP = {
                id: 'PROD_NEW_' + Date.now(), sku: finalSku, name: finalName, category: cat, sub_category: subCat,
                image: templateImg, realImage: qaData.realImage || '', costPrice: Number(qaData.cost) || 0,
                price: Number(qaData.price) || 0, quantity: 0,
                unit: qaData.unit || (searchTarget === 'acc' ? 'Cái' : 'Bộ'),
                isNewLocal: true
            };
            setLocalProds([...localProds, newP]);
            selectProduct(newP);
        };

        const autoCostTotal = React.useMemo(() => {
            let total = 0;
            prods.forEach(p => { const match = combinedProds.find(x => x.name === p.name); if (match) total += Number(match.costPrice || 0); });
            accessories.forEach(a => { const match = combinedProds.find(x => x.name === a.name); if (match) total += Number(match.costPrice || 0) * (Number(a.quantity) || 1); });
            return total;
        }, [prods, accessories, combinedProds]);

        const handleVideoAppealUpload = (e) => {
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                if (file.size > 35 * 1024 * 1024) {
                    alert("Dung lượng video quá lớn (> 35MB). Vui lòng quay video ngắn hơn (dưới 30s) hoặc giảm độ phân giải.");
                    e.target.value = '';
                    return;
                }
                setAppealVideo(file);
            }
        };

        const submitAppealData = async () => {
            if (!editOrder || !editOrder.id) return alert('Chưa xác định được ID đơn hàng!');
            if (appealStatus === 'Hoàn - Đang Khiếu Nại' && !appealVideo) {
                return alert('Vui lòng tải lên video bóc hàng để có bằng chứng khiếu nại!');
            }

            setIsUploadingAppeal(true);
            try {
                let videoUrl = '';
                if (appealVideo) {
                    triggerToast('Đang tải video lên kho lưu trữ...', 'fa-spinner fa-spin', 'info');
                    videoUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            try {
                                const b64 = e.target.result.split(',')[1];
                                const url = await runGAS('uploadDocumentToDrive', b64, `[APPEAL_EVIDENCE]_${editOrder.orderCode || editOrder.id}_${appealVideo.name}`, appealVideo.type);
                                resolve(url);
                            } catch (err) { reject(err); }
                        };
                        reader.onerror = (err) => reject(err);
                        reader.readAsDataURL(appealVideo);
                    });
                    if (!videoUrl) throw new Error("Upload video thất bại.");
                }

                triggerToast('Đang cập nhật hồ sơ khiếu nại...', 'fa-spinner fa-spin', 'info');
                const res = await runGAS('updateAppealStatus', editOrder.id, appealStatus, videoUrl);
                if (!res.success) throw new Error(res.message);

                triggerToast(res.message, 'fa-check', 'success');
                onClose && onClose();

                // Optionally push deltas so the UI updates
                const newNote = videoUrl ? `[Video Hoàn]: ${videoUrl} \n${editOrder.note || ''}` : (editOrder.note || '');
                const updatedOrder = { ...editOrder, status: appealStatus, note: newNote };
                pushDeltas({ orders: [updatedOrder] }, 'Đã cập nhật trạng thái khiếu nại!', 'fa-video');

            } catch (err) {
                console.error(err);
                triggerToast('Lỗi: ' + (err.message || 'Không thể upload video'), 'fa-times', 'danger');
            } finally {
                setIsUploadingAppeal(false);
            }
        };

        const submit = async () => {
            if (isSaleUI) {
                if (!customer || !phone) return alert('Vui lòng nhập Tên và Số điện thoại khách hàng!');
                if (!isEdit && (channel === 'Bán Lẻ' || channel === 'Bán Sỉ')) {
                    if (!depositFile) return alert('LỖI BẢO MẬT: BẮT BUỘC phải TẢI ẢNH BILL CỌC / XÁC NHẬN CHỐT ĐƠN!');
                }
            } else {
                if (!orderCode) return alert('Nhập mã đơn!');
                if ((isSXT || forceSXTOnly) && prods.length === 0) {
                    if (typeof triggerToast === 'function') triggerToast('Vui lòng bấm [+ BỂ KÍNH] hoặc [+ LAYOUT] để chọn hàng hoá!', 'fa-exclamation-triangle', 'warning');
                    else alert('Vui lòng bấm [+ BỂ KÍNH] hoặc [+ LAYOUT] để chọn hàng hoá cần sản xuất tồn kho!');
                    return;
                }
                if (!isEdit && prods.length === 0 && accessories.length === 0) {
                    if (typeof triggerToast === 'function') triggerToast('Vui lòng chọn ít nhất 1 sản phẩm để tạo lệnh!', 'fa-exclamation-triangle', 'warning');
                    else alert('Vui lòng chọn ít nhất 1 sản phẩm để tạo lệnh!');
                    return;
                }
            }

            setIsSubmitting(true);
            try {
                let billUrl = '';
                if (depositFile) {
                    const base64Data = typeof resizeImage === 'function' ?
                        await resizeImage(depositFile) : await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(depositFile); });
                    billUrl = await runGAS('uploadImage', base64Data, `BILL_SALE_${orderCode || Date.now()}.jpg`);
                }

                let baseOrderCode = (orderCode || '').trim();
                if (!baseOrderCode) {
                    if (channel === 'Bán Lẻ') baseOrderCode = 'BL' + Date.now().toString().slice(-6);
                    else if (channel === 'Bán Sỉ') baseOrderCode = 'BS' + Date.now().toString().slice(-6);
                    else if (channel === 'Cộng Tác Viên') baseOrderCode = 'CTV' + Date.now().toString().slice(-6);
                    else if (channel === 'Bảo Hành & Thu Hồi' || channel === 'Bảo Hành') baseOrderCode = 'BH' + Date.now().toString().slice(-6);
                    else if (isSXT || forceSXTOnly || channel === 'Sản Xuất Tồn') baseOrderCode = 'TK' + Date.now().toString().slice(-8);
                    else baseOrderCode = 'ORD' + Date.now().toString().slice(-6);
                }

                const finalOrderCode = trackingId ? `${baseOrderCode} | MVĐ: ${trackingId}` : baseOrderCode;
                const orderId = editOrder ? editOrder.id : 'ORD_' + Date.now();
                const finalNote = billUrl ? (note ? `${note} | Link Bill Cọc: ${billUrl}` : `Link Bill Cọc: ${billUrl}`) : note;

                // Xử lý upload ảnh Cover thực tế
                for (let idx = 0; idx < prods.length; idx++) {
                    let p = prods[idx];
                    if (p.coverFile) {
                        let base64Data;
                        if (typeof resizeImage === 'function') {
                            base64Data = await resizeImage(p.coverFile);
                        } else {
                            base64Data = await new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload = () => resolve(reader.result.split(',')[1]);
                                reader.onerror = reject;
                                reader.readAsDataURL(p.coverFile);
                            });
                        }
                        const timestamp = baseOrderCode ? baseOrderCode : Date.now();
                        const coverUrl = await runGAS('uploadImage', base64Data, 'COVER_SALE_' + timestamp + '_' + idx + '.jpg');
                        p.realCoverImage = coverUrl;
                        p.note = p.note ? `${p.note} | Cover: ${coverUrl}` : `Cover: ${coverUrl}`;
                        delete p.coverFile;
                    }
                }

                let currentStatus = isSXT ? 'Chờ Sản Xuất' : 'Sẵn Sàng Đóng Gói';
                let processedProds = [];
                if (!isEdit && !isSXT && prods.length > 0) {
                    // Khởi tạo bộ đếm tồn kho ảo để trừ lùi liên tục
                    let virtualStockMap = {};

                    prods.forEach((p, idx) => {
                        const inStockItem = combinedProds.find(x => x.name === p.name);
                        const realStockQty = inStockItem ? Number(inStockItem.quantity) : 0;

                        // Lấy tồn kho hiện tại (Nếu chưa có trong map thì lấy số thực tế)
                        let currentAvailable = virtualStockMap[p.name] !== undefined ? virtualStockMap[p.name] : realStockQty;

                        let pNameStr = p.name ? String(p.name).toLowerCase() : '';
                        let subCatStr = (inStockItem && inStockItem.sub_category) ? String(inStockItem.sub_category).toUpperCase() : '';
                        let isCover = false;
                        if (pNameStr.indexOf('cover') !== -1) {
                            isCover = true;
                        } else if (subCatStr === 'COVER') {
                            isCover = true;
                        }

                        if (isCover === false && currentAvailable > 0) {
                            // Đủ kho -> Lệnh Bù Kho
                            let newProd = Object.assign({}, p);
                            newProd.note = p.note;
                            newProd.fulfilledFromStock = true;
                            newProd.deadline = typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : deadline;
                            processedProds.push(newProd);
                            // Trừ lùi tồn kho ảo đi 1
                            virtualStockMap[p.name] = currentAvailable - 1;
                        } else {
                            // Hết kho HOẶC Hàng Cover -> Ép trạng thái đơn về Chờ Sản Xuất & Chuyển lệnh xuống xưởng
                            currentStatus = 'Chờ Sản Xuất';
                            let newProd = Object.assign({}, p);
                            newProd.deadline = deadline;
                            newProd.fulfilledFromStock = false;
                            processedProds.push(newProd);
                            if (isCover === false) {
                                virtualStockMap[p.name] = currentAvailable;
                            }
                        }
                    });
                } else {
                    currentStatus = editOrder ? editOrder.status : (isSXT || prods.length > 0 ? 'Chờ Sản Xuất' : 'Sẵn Sàng Đóng Gói');
                    processedProds = prods.map(p => ({ ...p, orderId, deadline }));
                }

                // ĐƠN HÀNG OFFLINE BÁN TRỰC TIẾP TẠI XƯỞNG: TỰ ĐỘNG SANG TRẠNG THÁI HOÀN THÀNH LUÔN
                if (isSaleUI && shippingMethod === 'Trực Tiếp') {
                    currentStatus = 'Hoàn Thành';
                    processedProds = prods.map(p => {
                        const isGlass = p.type === 'Bể Kính';
                        return {
                            ...p,
                            orderId,
                            deadline,
                            status: 'Hoàn Kho Đạt',
                            fulfilledFromStock: true,
                            note: p.note ? `${p.note} | Bán trực tiếp tại xưởng` : 'Bán trực tiếp tại xưởng (Đã hoàn thành)',
                            phases: isGlass ?
                                { phase1: { name: 'Cắt Dán', status: 'Done' }, phase2: { name: 'Gọt Keo', status: 'Done' } } :
                                { phase1: { name: 'Dựng Khung', status: 'Done' }, phase2: { name: 'Gia Cố', status: 'Done' } }
                        };
                    });
                }

                const finalTotal = (Number(retailTotal) || 0) - (Number(retailDiscount) || 0) + (Number(additionalCost) || 0);

                let payloadOrder = {
                    id: orderId, orderCode: finalOrderCode, channel, customer: (customer && customer.trim()) ? customer.trim() : (currentUser || 'Khách Lẻ'), phone, address, note: finalNote,
                    revenue: finalTotal, prePaid: Number(prePaid) || 0, discount: Number(retailDiscount) || 0, shippingFee: Number(additionalCost) || 0,

                    deadline, createdAt: editOrder ? editOrder.createdAt : safeDate.replace('T', ' '), date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0],
                    status: currentStatus, accessories, hasProduction: prods.length > 0,
                    updatedBy: currentUser, responsibleUser: responsibleUser || currentUser, shippingMethod: isSaleUI ? (shippingMethod || 'Gửi GHN') : (shippingMethod || '')
                };

                let payload = { orders: [payloadOrder], prodItems: processedProds.map(p => ({ ...p, orderId })) };

                if (isSaleUI) {
                    let codAmt = 0;
                    if (channel === 'Bán Lẻ' || channel === 'Bán Sỉ') {
                        codAmt = Math.max(0, finalTotal - (Number(prePaid) || 0));
                        const kpiAmt = finalTotal * 0.05;
                        const beneficiary = responsibleUser || currentUser;
                        // Luôn gửi KPI (kể cả 0đ) cùng orderId để Code.js có thể update/reset KPI nếu Sửa Đơn
                        payload.BonusPenalty = [{ id: 'BP_KPI_' + orderId, user: beneficiary, amount: kpiAmt, type: 'Thưởng Bán Hàng', note: `Thưởng 5% đơn ${finalOrderCode} (Cập nhật bởi: ${currentUser})`, date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0], orderCode: finalOrderCode }];

                        if (Number(prePaid) > 0 && receivingAccount) {
                            const selAcc = accountsData.find(a => {
                                const raw = a.accountName || a.name || '';
                                let cleanName = raw;
                                if (raw.includes('|')) {
                                    cleanName = raw.split('|')[0].trim();

                                return String(cleanName || '').toLowerCase().includes(receivingAccount.toLowerCase()) ||
                                    String(raw || '').toLowerCase().includes(receivingAccount.toLowerCase());

                            const targetAccId = selAcc ? selAcc.id : (accountsData[0] ? accountsData[0].id : 'ACC_COMPANY');

                            payload.Transactions = [{
                                id: 'TX_PRE_' + orderId,
                                type: 'Thu',
                                category: 'Doanh Thu Bán Hàng',
                                amount: Number(prePaid),
                                fromAccount: '',
                                toAccount: targetAccId,
                                title: `Khách cọc đơn ${finalOrderCode}`,
                                date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0],
                                note: billUrl ? `Có kèm Bill Cọc` : `Cập nhật từ hệ thống`
                            }];

                    }
                    else if (channel === 'Cộng Tác Viên') { codAmt = (Number(retailTotal) || 0) - (Number(retailDiscount) || 0); }
                    else if (channel === 'Bảo Hành & Thu Hồi' || channel === 'Bảo Hành') {
                        const totalBH = autoCostTotal + Number(additionalCost);
                        payloadOrder.costTotal = totalBH;
                        if (responsibleUser) payload.BonusPenalty = [{ id: 'BP_PEN_' + orderId, user: responsibleUser, amount: -totalBH, type: 'Phạt Bảo Hành', note: `Trừ phí bảo hành đơn ${finalOrderCode}`, date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0], orderCode: finalOrderCode }];
                    }
                    payloadOrder.cod = codAmt;
                }

                // 📜 GHI NHẬN LỊCH SỬ SỬA ĐƠN HÀNG CÔNG KHAI
                if (isEdit && editOrder) {
                    const editTime = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ').slice(0, 16) : new Date().toLocaleString('vi-VN');
                    let changes = [];
                    if (String(editOrder.customer || '').trim() !== String(payloadOrder.customer || '').trim()) {
                        changes.push(`Khách: "${editOrder.customer || ''}" ➔ "${payloadOrder.customer || ''}"`);
                    }
                    if (String(editOrder.phone || '').trim() !== String(payloadOrder.phone || '').trim()) {
                        changes.push(`SĐT: "${editOrder.phone || ''}" ➔ "${payloadOrder.phone || ''}"`);
                    }
                    if (String(editOrder.address || '').trim() !== String(payloadOrder.address || '').trim()) {
                        changes.push(`Địa chỉ: "${editOrder.address || ''}" ➔ "${payloadOrder.address || ''}"`);
                    }
                    if (Number(editOrder.revenue || 0) !== Number(payloadOrder.revenue || 0)) {
                        changes.push(`Doanh thu: ${Number(editOrder.revenue || 0).toLocaleString('vi-VN')}đ ➔ ${Number(payloadOrder.revenue || 0).toLocaleString('vi-VN')}đ`);
                    }
                    if (Number(editOrder.cod || 0) !== Number(payloadOrder.cod || 0)) {
                        changes.push(`COD: ${Number(editOrder.cod || 0).toLocaleString('vi-VN')}đ ➔ ${Number(payloadOrder.cod || 0).toLocaleString('vi-VN')}đ`);
                    }
                    if (Number(editOrder.prePaid || 0) !== Number(payloadOrder.prePaid || 0)) {
                        changes.push(`Cọc: ${Number(editOrder.prePaid || 0).toLocaleString('vi-VN')}đ ➔ ${Number(payloadOrder.prePaid || 0).toLocaleString('vi-VN')}đ`);
                    }
                    if (String(editOrder.status || '') !== String(payloadOrder.status || '')) {
                        changes.push(`Trạng thái: "${editOrder.status || ''}" ➔ "${payloadOrder.status || ''}"`);
                    }
                    if (changes.length > 0) {
                        const historyEntry = `[LỊCH SỬ SỬA ${editTime} bởi ${currentUser || 'Hệ thống'}]: ${changes.join(' | ')}`;
                        payloadOrder.note = payloadOrder.note ? `${payloadOrder.note}\n${historyEntry}` : historyEntry;
                    }
                }

                // 🛠 FIX BUG XÓA SẢN PHẨM Ở ĐÂY: Ép định dạng tên Sheet 'Production' chuẩn trên Database
                if (deletedProds.length > 0) {
                    payload.deletes = { Production: deletedProds, prodItems: deletedProds };
                }

                let newItemsToPush = localProds.map(lp => { 
                    const { isNewLocal, bomItems, _calcInfo, ...cleanProd } = lp; 
                    return cleanProd;

                if (newItemsToPush.length > 0) payload.Products = newItemsToPush;

                            });
                        });

                if (newBomList.length > 0) {
                    payload.BOM_Config = newBomList;
                }

    // HELPER: IN HOÁ ĐƠN BÁN LẺ KHỔ NHIỆT K58 (58MM THERMAL RECEIPT)
