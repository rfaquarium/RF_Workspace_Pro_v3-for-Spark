<script type="text/babel">
/* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 */
// =========================================================================
// 🤝 FILE: Tab_Suppliers.html
// CHỨC NĂNG: Quản lý Nhà Cung Cấp, Công nợ, Lịch sử nhập hàng & Đối soát Bank N:1
// THIẾT KẾ: Royal Workbench Dark (Hallmark Anti-AI-Slop System)
// =========================================================================

const SuppliersTab = React.memo(function SuppliersTab({ 
    data, 
    pushData, 
    isAdmin: propIsAdmin, 
    isBoss: propIsBoss, 
    userRole: propUserRole, 
    currentUser: propCurrentUser, 
    hasPerm: propHasPerm, 
    triggerToast,
    documents
}) {
    const [searchTerm, setSearchTerm] = React.useState('');
    const [debtFilter, setDebtFilter] = React.useState('ALL'); // ALL, DEBT, NO_DEBT, ADVANCE
    const [selectedCategory, setSelectedCategory] = React.useState('ALL');
    const [showAddModal, setShowAddModal] = React.useState(false);
    const [expandedIds, setExpandedIds] = React.useState({});
    const [isSaving, setIsSaving] = React.useState(false);
    const [historyFilters, setHistoryFilters] = React.useState({}); // supId -> ALL, UNPAID

    const currentRole = propUserRole || localStorage.getItem('rf_role') || '';
    const currentUser = propCurrentUser || localStorage.getItem('rf_user') || '';
    const isBossRole = localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO' || currentUser.includes('Tiến');
    const isBoss = propIsBoss !== undefined ? propIsBoss : isBossRole;
    const isAdmin = propIsAdmin !== undefined ? propIsAdmin : (localStorage.getItem('rf_admin') === 'true' || isBoss);

    const hasPerm = React.useCallback((actionCode) => {
        if (isBoss || currentRole === 'TỐI CAO') return true;
        if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
        if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
        return isAdmin;
    }, [propHasPerm, currentRole, currentUser, isAdmin, isBoss]);

    const canAddSup = hasPerm('SUP_ADD'); // Tiến, Dương, Trang
    const canEditSup = hasPerm('SUP_EDIT'); // Tiến, Dương, Trang
    const canDeleteSup = hasPerm('SUP_DELETE'); // Chỉ Tiến
    const canManageDebt = hasPerm('SUP_MANAGE_DEBT'); // Tiến, Trang

    const [newSup, setNewSup] = React.useState({ id: null, name: '', phone: '', category: 'HÀNG HOÁ', note: '', totalDebt: 0 });
    const [payingLog, setPayingLog] = React.useState(null);
    const [payAccId, setPayAccId] = React.useState('');
    const [payAmount, setPayAmount] = React.useState('');
    const [editingLog, setEditingLog] = React.useState(null);
    const [editNote, setEditNote] = React.useState('');
    const [editTotal, setEditTotal] = React.useState('');

    // States cho tính năng Đối Soát Bank (N:1)
    const [reconcileSupplier, setReconcileSupplier] = React.useState(null);
    const [reconSelectedTxId, setReconSelectedTxId] = React.useState('');
    const [reconSelectedImportIds, setReconSelectedImportIds] = React.useState([]);

    const CATEGORIES = ['HÀNG HOÁ', 'NGUYÊN LIỆU & VẬT TƯ', 'CÔNG CỤ MÁY MÓC', 'NỘI BỘ', 'KHÁC'];
    const suppliers = data?.Suppliers || [];

    // Helper format tiền tệ
    const displayMoney = React.useCallback((val) => {
        return Math.round(Number(val || 0)).toLocaleString('vi-VN');
    }, []);

    // 1. TÍNH TOÁN CÁC CHỈ SỐ DASHBOARD TỔNG QUAN
    const stats = React.useMemo(() => {
        let totalDebt = 0;
        let totalAdvance = 0;
        let unpaidBills = 0;
        
        suppliers.forEach(s => {
            const d = Number(s.totalDebt) || 0;
            if (d > 0) totalDebt += d;
            else if (d < 0) totalAdvance += Math.abs(d);
        });

        (data?.ImportExport || []).forEach(log => {
            if (log.type === 'Nhập' && !log.isPaid && Number(log.totalAmount) > 0) {
                unpaidBills++;
            }
        });

        const currentMonthStr = new Date().toISOString().slice(0, 7); // YYYY-MM
        const paidThisMonth = (data?.Transactions || [])
            .filter(t => t.type === 'Chi' && (t.category === 'Thanh Toán Hoá Đơn' || String(t.title || '').includes('Thanh toán phiếu nhập')) && t.date && t.date.startsWith(currentMonthStr))
            .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

        return {
            totalDebt,
            totalAdvance,
            totalPartners: suppliers.length,
            unpaidBills,
            paidThisMonth
        };
    }, [suppliers, data?.ImportExport, data?.Transactions]);

    // 2. PHÂN LOẠI & LỌC NHÀ CUNG CẤP
    const filteredSuppliers = React.useMemo(() => {
        return suppliers.filter(sup => {
            // Lọc từ khoá tìm kiếm
            if (searchTerm) {
                const sLow = searchTerm.toLowerCase().trim();
                const matchName = String(sup.name || '').toLowerCase().includes(sLow);
                const matchPhone = String(sup.phone || '').toLowerCase().includes(sLow);
                const matchNote = String(sup.note || '').toLowerCase().includes(sLow);
                if (!matchName && !matchPhone && !matchNote) return false;
            }

            // Lọc trạng thái nợ
            const debt = Number(sup.totalDebt || 0);
            if (debtFilter === 'DEBT' && debt <= 0) return false;
            if (debtFilter === 'NO_DEBT' && debt !== 0) return false;
            if (debtFilter === 'ADVANCE' && debt >= 0) return false;

            // Lọc danh mục
            if (selectedCategory !== 'ALL') {
                const cat = CATEGORIES.includes(sup.category) ? sup.category : 'KHÁC';
                if (cat !== selectedCategory) return false;
            }

            return true;
        });
    }, [suppliers, searchTerm, debtFilter, selectedCategory]);

    // Nhóm theo Category
    const groupedSuppliers = React.useMemo(() => {
        const groups = {};
        CATEGORIES.forEach(cat => groups[cat] = []);

        filteredSuppliers.forEach(sup => {
            const cat = CATEGORIES.includes(sup.category) ? sup.category : 'KHÁC';
            if (!groups[cat]) groups[cat] = [];
            groups[cat].push(sup);
        });
        return groups;
    }, [filteredSuppliers]);

    // Lấy lịch sử nhập hàng của từng NCC
    const getImportHistory = React.useCallback((supName) => {
        if (!supName) return [];
        const imports = (data?.ImportExport || []).filter(log => log.type === 'Nhập' && String(log.target || '').trim() === String(supName).trim());
        return imports.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    }, [data?.ImportExport]);

    const toggleExpand = (id) => setExpandedIds(prev => ({ ...prev, [id]: !prev[id] }));
    const toggleHistoryFilter = (supId, filterType) => setHistoryFilters(prev => ({ ...prev, [supId]: filterType }));

    // Icon nhận diện nhóm NCC
    const getSupplierIcon = (category) => {
        switch(category) {
            case 'HÀNG HOÁ': 
                return <i className="fas fa-boxes text-emerald-400"></i>;
            case 'NGUYÊN LIỆU & VẬT TƯ': 
                return <i className="fas fa-cubes text-amber-400"></i>;
            case 'CÔNG CỤ MÁY MÓC': 
                return <i className="fas fa-cogs text-sky-400"></i>;
            case 'NỘI BỘ': 
                return <i className="fas fa-building text-purple-400"></i>;
            default: 
                return <i className="fas fa-handshake text-[#d4af37]"></i>;
        }
    };

    // 3. XỬ LÝ LƯU / SỬA NHÀ CUNG CẤP
    const handleSaveSup = async () => {
        if (!newSup.name.trim()) return triggerToast('Vui lòng nhập Tên Nhà Cung Cấp!', 'fa-exclamation', 'warning');
        setIsSaving(true);
        try {
            const debtInputVal = Number(newSup.totalDebt || 0);
            if (newSup.id) {
                const existing = suppliers.find(s => s.id === newSup.id);
                const payload = { 
                    Suppliers: [{ 
                        ...existing, 
                        name: newSup.name.trim(), 
                        phone: newSup.phone.trim(), 
                        category: newSup.category, 
                        note: newSup.note.trim(), 
                        totalDebt: debtInputVal 
                    }] 
                };
                
                // QUÉT & ĐỒNG BỘ KHÓA NGOẠI: Cập nhật lại mục tiêu (target) của ImportExport nếu Nhà cung cấp bị đổi tên
                if (existing && existing.name !== newSup.name.trim()) {
                    const relatedLogs = (data?.ImportExport || []).filter(log => log.type === 'Nhập' && log.target === existing.name);
                    if (relatedLogs.length > 0) {
                        payload.ImportExport = relatedLogs.map(log => ({ ...log, target: newSup.name.trim() }));
                    }
                }
                
                await pushData(payload);
                triggerToast('Cập nhật Nhà Cung Cấp thành công!', 'fa-check', 'success');
            } else {
                await pushData({ 
                    Suppliers: [{ 
                        id: 'SUP_' + Date.now(), 
                        name: newSup.name.trim(), 
                        phone: newSup.phone.trim(), 
                        category: newSup.category, 
                        note: newSup.note.trim(), 
                        totalDebt: debtInputVal 
                    }] 
                });
                triggerToast('Tạo Nhà Cung Cấp thành công!', 'fa-check', 'success');
            }
            setShowAddModal(false);
            setNewSup({ id: null, name: '', phone: '', category: 'HÀNG HOÁ', note: '', totalDebt: 0 });
        } catch (e) { 
            triggerToast('Gặp lỗi khi lưu Nhà Cung Cấp: ' + (e.message || e), 'fa-times', 'danger'); 
        } finally {
            setIsSaving(false);
        }
    };

    // 4. XÓA NHÀ CUNG CẤP (CHỐNG XÓA KHI CÒN NỢ)
    const handleDeleteSup = async (sup) => {
        if (Number(sup.totalDebt || 0) > 0) {
            return triggerToast('Không thể xóa Nhà Cung Cấp đang còn công nợ chưa chi trả!', 'fa-ban', 'danger');
        }
        if (!window.confirm(`Bạn có chắc muốn XÓA VĨNH VIỄN Nhà Cung Cấp: [${sup.name}]?`)) return;
        setIsSaving(true);
        try {
            await pushData({ deletes: { Suppliers: [sup.id] } });
            triggerToast('Xóa Nhà Cung Cấp thành công!', 'fa-check', 'success');
        } catch (e) { 
            triggerToast('Gặp lỗi khi xóa Nhà Cung Cấp: ' + (e.message || e), 'fa-times', 'danger'); 
        } finally {
            setIsSaving(false);
        }
    };

    // 5. THANH TOÁN PHIẾU NHẬP (CHI TRẢ TIỀN MẶT / QUỸ)
    const openPaymentModal = (log, sup) => {
        setPayingLog({ log, sup });
        const totalVal = Number(log.totalAmount || 0);
        const alreadyPaid = Number(log.paidAmount || 0);
        const remainingDebt = Math.max(0, totalVal - alreadyPaid);
        setPayAmount(remainingDebt > 0 ? remainingDebt : totalVal);
        setPayAccId('');
    };

    // 🛡️ CẢNH BÁO TRÙNG GIAO DỊCH KHI THANH TOÁN LẺ (TRÁNH TRỪ ĐÚP TIỀN QUỸ)
    const matchingRecentBankTx = React.useMemo(() => {
        if (!payingLog || !payingLog.sup || !payingLog.log) return null;
        const supName = String(payingLog.sup.name || '').toLowerCase().trim();
        const logId = String(payingLog.log.id || '').toLowerCase().trim();
        const amountToMatch = Number(payAmount) || Number(payingLog.log.totalAmount) || 0;
        const now = Date.now();
        const fortyEightHoursMs = 48 * 60 * 60 * 1000;

        return (data?.Transactions || []).find(t => {
            if (t.type !== 'Chi') return false;
            const tDate = new Date(t.date || 0).getTime();
            if (isNaN(tDate) || (now - tDate > fortyEightHoursMs && now - tDate > 0)) return false;
            const tAmount = Number(t.amount || 0);
            const noteLow = String(t.note || '').toLowerCase();
            const titleLow = String(t.title || '').toLowerCase();
            
            // Đã đối soát rồi thì bỏ qua
            if (noteLow.includes('đã đối soát công nợ')) return false;

            const matchAmount = Math.abs(tAmount - amountToMatch) < 1000;
            const matchSup = supName && (noteLow.includes(supName) || titleLow.includes(supName));
            const matchLogId = logId && (noteLow.includes(logId) || titleLow.includes(logId));

            return (matchAmount && (matchSup || matchLogId)) || (matchAmount && matchSup) || (matchLogId);
        });
    }, [payingLog, payAmount, data?.Transactions]);

    const isSavingRef = React.useRef(false);

    const handleConfirmPayment = async () => {
        if (isSavingRef.current) return;
        const amountToPay = Number(payAmount);
        if (!payAccId) return triggerToast('Vui lòng chọn quỹ tiền để trừ!', 'fa-exclamation', 'warning');
        if (amountToPay <= 0) return triggerToast('Số tiền thanh toán phải lớn hơn 0!', 'fa-exclamation', 'warning');

        isSavingRef.current = true;
        setIsSaving(true);
        try {
            const acc = (data?.Accounts || []).find(a => a.id === payAccId);
            const sup = payingLog.sup;
            const log = payingLog.log;

            const totalVal = Number(log.totalAmount || 0);
            const alreadyPaid = Number(log.paidAmount || 0);
            const newPaidAmount = alreadyPaid + amountToPay;
            const isFullyPaid = newPaidAmount >= totalVal;
            const remainingDebt = Math.max(0, totalVal - newPaidAmount);
            
            const newTransaction = {
                id: 'TX_' + Date.now() + Math.floor(Math.random()*1000), 
                type: 'Chi', 
                category: 'Thanh Toán Hoá Đơn', 
                amount: amountToPay,
                fromAccount: payAccId, 
                toAccount: '', 
                title: `Thanh toán phiếu nhập: ${log.id}`,
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                note: `Chi trả tiền nhập hàng cho nhà cung cấp ${sup.name} (${amountToPay.toLocaleString('vi-VN')} đ)`
            };

            await pushData({
                Transactions: [newTransaction],
                Accounts: [{ ...acc, balance: Number(acc.balance) - amountToPay }],
                Suppliers: [{ ...sup, totalDebt: Math.max(0, Number(sup.totalDebt || 0) - amountToPay) }],
                ImportExport: [{ 
                    ...log, 
                    isPaid: isFullyPaid, 
                    paidAmount: newPaidAmount, 
                    debtAmount: remainingDebt, 
                    paidAt: isFullyPaid ? new Date().toISOString() : log.paidAt 
                }]
            });
            setPayingLog(null);
            triggerToast(isFullyPaid ? 'Thanh toán hoàn tất phiếu nhập!' : `Đã thanh toán một phần (${amountToPay.toLocaleString('vi-VN')} đ)!`, 'fa-check', 'success');
        } catch (e) { 
            triggerToast('Lỗi thanh toán: ' + (e.message || e), 'fa-times', 'danger'); 
        } finally {
            setIsSaving(false);
            setTimeout(() => { isSavingRef.current = false; }, 500);
        }
    };

    // 6. CHỈNH SỬA PHIẾU NHẬP
    const openEditModal = (log) => {
        setEditingLog(log);
        setEditNote(log.note || '');
        setEditTotal(log.totalAmount || 0);
    };

    const handleConfirmEdit = async () => {
        setIsSaving(true);
        try {
            const oldAmount = Number(editingLog.totalAmount || 0);
            const newAmount = Number(editTotal);
            const diff = newAmount - oldAmount;
            
            const payload = { ImportExport: [{ ...editingLog, note: editNote, totalAmount: newAmount }] };
            
            if (diff !== 0 && !editingLog.isPaid) {
                const sup = suppliers.find(s => s.name === editingLog.target);
                if (sup) {
                    payload.Suppliers = [{ ...sup, totalDebt: Number(sup.totalDebt || 0) + diff }];
                }
            }
            
            await pushData(payload);
            setEditingLog(null);
            triggerToast('Cập nhật phiếu thành công!', 'fa-check', 'success');
        } catch (e) { 
            triggerToast('Lỗi sửa phiếu: ' + (e.message || e), 'fa-times', 'danger'); 
        } finally {
            setIsSaving(false);
        }
    };

    // 7. XOÁ PHIẾU NHẬP
    const handleDeleteTicket = async (log, sup) => {
        const choice = window.prompt(`XOÁ PHIẾU NHẬP: ${log.id}\n\nNhập "1" để: Xoá phiếu NHƯNG GIỮ NGUYÊN tồn kho (Dùng khi hàng vật lý đã vào kho, chỉ xoá rác sổ sách).\nNhập "2" để: Xoá phiếu và TRỪ LẠI số tồn kho đã cộng.\n\nHãy nhập số 1 hoặc 2:`);
        if (!choice) return;
        if (choice !== '1' && choice !== '2') return triggerToast('Lựa chọn không hợp lệ', 'fa-times', 'danger');

        setIsSaving(true);
        try {
            const payload = { deletes: { ImportExport: [log.id] }, Products: [], Suppliers: [] };
            
            if (!log.isPaid && Number(log.totalAmount || 0) > 0) {
                payload.Suppliers.push({
                    ...sup, 
                    totalDebt: Math.max(0, Number(sup.totalDebt || 0) - Number(log.totalAmount))
                });
            }

            if (choice === '2') {
                let parsed = [];
                try { parsed = JSON.parse(log.itemsData); } catch(e) {}
                parsed.forEach(item => {
                    const p = (data?.Products || []).find(x => x.name === item.name);
                    if (p) {
                        const diffVal = -Number(item.qty || 0);
                        payload.Products.push({ ...p, quantity: Number(p.quantity) + diffVal, _diff: diffVal });
                    }
                });
            }

            await pushData(payload);
            triggerToast('Đã xoá phiếu thành công!', 'fa-trash', 'success');
        } catch (e) {
            triggerToast('Lỗi xoá phiếu: ' + (e.message || e), 'fa-times', 'danger');
        } finally {
            setIsSaving(false);
        }
    };

    // 8. ĐỐI SOÁT BANK N:1 (KHỚP PHIẾU CHI VỚI NHIỀU PHIẾU NHẬP)
    const recentBankTxs = React.useMemo(() => {
        const now = new Date();
        const thirtyDaysAgo = new Date(now.setDate(now.getDate() - 30)).toISOString().split('T')[0];
        return (data?.Transactions || []).filter(t => {
            if (t.type !== 'Chi') return false;
            const tDate = (t.date || '').split('T')[0];
            if (tDate < thirtyDaysAgo) return false;
            const noteLower = String(t.note || '').toLowerCase();
            if (noteLower.includes('đối soát công nợ')) return false;
            return true;
        }).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    }, [data?.Transactions]);

    const handleSaveReconciliation = async () => {
        if (!reconSelectedTxId) return triggerToast('Vui lòng chọn 1 Phiếu Chi Bank!', 'fa-exclamation', 'warning');
        if (reconSelectedImportIds.length === 0) return triggerToast('Vui lòng tick chọn ít nhất 1 Phiếu Nhập!', 'fa-exclamation', 'warning');

        const tx = recentBankTxs.find(t => t.id === reconSelectedTxId);
        if (!tx) return;

        const allImports = getImportHistory(reconcileSupplier.name);
        const selectedImports = allImports.filter(log => reconSelectedImportIds.includes(log.id));
        const totalImportAmount = selectedImports.reduce((sum, log) => sum + Number(log.totalAmount || 0), 0);
        const balanceDiff = Number(tx.amount || 0) - totalImportAmount;

        if (balanceDiff < 0) {
            return triggerToast('LỖI BẢO MẬT: Phiếu Chi không đủ số dư để thanh toán tổng tiền các phiếu đã chọn!', 'fa-ban', 'danger');
        }

        setIsSaving(true);
        try {
            const updatedTx = {
                ...tx,
                note: `[Đã đối soát công nợ: ${reconcileSupplier.name}]. ${tx.note || ''}`
            };

            const updatedSupplier = {
                ...reconcileSupplier,
                totalDebt: Math.max(0, Number(reconcileSupplier.totalDebt || 0) - totalImportAmount)
            };

            const updatedImports = selectedImports.map(log => ({
                ...log,
                isPaid: true,
                paidAmount: Number(log.totalAmount || 0),
                debtAmount: 0,
                paidAt: new Date().toISOString()
            }));

            await pushData({
                Transactions: [updatedTx],
                Suppliers: [updatedSupplier],
                ImportExport: updatedImports
            });

            setReconcileSupplier(null);
            triggerToast('Đã đối soát Bank và cấn trừ công nợ thành công!', 'fa-shield-alt', 'success');
        } catch (e) {
            triggerToast('Lỗi đối soát: ' + (e.message || e), 'fa-times', 'danger');
        } finally {
            setIsSaving(false);
        }
    };

    const handleToggleImport = (id) => {
        setReconSelectedImportIds(prev => 
            prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
        );
    };

    const parseItems = (raw) => {
        if (!raw) return [];
        if (Array.isArray(raw)) return raw;
        try {
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    };

    // 9. CÁC HÀM IN BÁO CÁO (A4 DỌC & 58MM POS)
    const handlePrintAllImportsReport = () => {
        const printDateStr = new Date().toLocaleString('vi-VN');
        const allImports = (data?.ImportExport || []).filter(log => log.type === 'Nhập');
        const sortedImports = [...allImports].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        let totalAmount = 0;
        let totalPaid = 0;
        let totalRemaining = 0;

        let rowsHtml = '';
        sortedImports.forEach((log, idx) => {
            const tot = Number(log.totalAmount || 0);
            const paid = Number(log.paidAmount || (log.isPaid ? tot : 0));
            const remaining = Math.max(0, tot - paid);

            totalAmount += tot;
            totalPaid += paid;
            totalRemaining += remaining;

            const items = parseItems(log.itemsData);
            let itemsSummary = '';
            if (items.length > 0) {
                itemsSummary = items.map(it => {
                    const matchedP = (data?.Products || []).find(p => (it.sku && String(p.sku || '').toUpperCase() === String(it.sku).toUpperCase()) || (it.name && String(p.name || '').toLowerCase() === String(it.name).toLowerCase()));
                    const u = (matchedP && matchedP.unit) ? matchedP.unit : (it.unit || '');
                    return `${it.name || it.sku} (x${it.qty || 1}${u ? ' ' + u : ''})`;
                }).join(', ');
            } else {
                itemsSummary = log.note || 'Không có chi tiết';
            }

            const statusText = log.isPaid || remaining <= 0 ? 'Hoàn Tất' : (paid > 0 ? 'Trả 1 Phần' : 'Chưa Trả');
            const statusColor = log.isPaid || remaining <= 0 ? '#047857' : (paid > 0 ? '#b45309' : '#be123c');

            rowsHtml += `
                <tr>
                    <td style="border: 1px solid #333; padding: 5px 4px; text-align: center;">${idx + 1}</td>
                    <td style="border: 1px solid #333; padding: 5px 6px; font-family: monospace; font-weight: bold; text-align: center;">${log.id}</td>
                    <td style="border: 1px solid #333; padding: 5px 6px; font-size: 9.5px; text-align: center;">${String(log.date || '').slice(0, 16).replace('T', ' ')}</td>
                    <td style="border: 1px solid #333; padding: 5px 6px; font-weight: bold; text-align: left;">${log.target || 'N/A'}</td>
                    <td style="border: 1px solid #333; padding: 5px 6px; font-size: 9.5px; text-align: left; max-width: 220px;">${itemsSummary}</td>

            {editingLog && (
                <div className="fixed inset-0 bg-black/80 z-[300] flex items-center justify-center p-4 backdrop-blur-md animate-fade-in" onClick={() => setEditingLog(null)}>
                    <div className="bg-[#121215] w-full max-w-sm rounded-2xl p-5 border border-white/[0.12] shadow-2xl flex flex-col relative overflow-hidden animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4 border-b border-white/[0.08] pb-3">
                            <h3 className="font-black text-amber-400 text-[15px] uppercase tracking-wider flex items-center gap-2">
                                <i className="fas fa-pen"></i> Chỉnh sửa phiếu nhập
                            </h3>
                            <button onClick={() => setEditingLog(null)} disabled={isSaving} className="w-8 h-8 bg-[#09090b] rounded-full text-zinc-400 hover:text-rose-400 border border-white/[0.08] transition-colors flex items-center justify-center cursor-pointer">
                                <i className="fas fa-times text-xs"></i>
                            </button>
                        </div>
                        <div className="space-y-3.5">
                            <div>
                                <label className="text-[10px] font-bold text-zinc-400 uppercase block mb-1">MÃ PHIẾU NHẬP</label>
                                <input type="text" value={editingLog.id} disabled className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-3.5 py-2 text-[12px] text-zinc-400 font-mono" />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-zinc-400 uppercase block mb-1">TỔNG TIỀN PHIẾU (VNĐ)</label>
                                <input 
                                    type="number" 
                                    value={editTotal} 
                                    onChange={e => setEditTotal(e.target.value)} 
                                    disabled={isSaving} 
                                    className="w-full bg-[#09090b] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-[15px] text-amber-400 font-mono font-bold outline-none focus:border-amber-500" 
                                />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-zinc-400 uppercase block mb-1">GHI CHÚ PHIẾU</label>
                                <textarea 
                                    rows="3" 
                                    value={editNote} 
                                    onChange={e => setEditNote(e.target.value)} 
                                    disabled={isSaving} 
                                    className="w-full bg-[#09090b] border border-white/[0.08] rounded-xl px-3.5 py-2 text-[12px] text-zinc-200 outline-none focus:border-amber-500 shadow-inner" 
                                    placeholder="Nội dung ghi chú..."
                                ></textarea>
                            </div>
                        </div>
                        <div className="pt-4 mt-3 border-t border-white/[0.08]">
                            <button 
                                onClick={handleConfirmEdit} 
                                disabled={isSaving} 
                                className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black rounded-xl text-[12px] tracking-wider uppercase transition-all shadow-md flex items-center justify-center gap-2 active:scale-95 cursor-pointer"
                            >
                                {isSaving ? <><i className="fas fa-circle-notch fa-spin"></i> Đang lưu...</> : <><i className="fas fa-save"></i> Cập nhật phiếu nhập</>}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* 7. MODAL ĐỐI SOÁT BANK N:1 */}
            {reconcileSupplier && (
                <div className="fixed inset-0 bg-black/85 z-[300] flex items-center justify-center p-4 backdrop-blur-md animate-fade-in" onClick={() => setReconcileSupplier(null)}>
                    <div className="bg-[#121215] w-full max-w-2xl rounded-2xl p-5 border border-emerald-500/30 shadow-2xl flex flex-col max-h-[90vh] overflow-hidden relative animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-3 border-b border-white/[0.08] pb-3">
                            <div>
                                <h3 className="font-black text-emerald-400 text-[16px] uppercase tracking-wider flex items-center gap-2">
                                    <i className="fas fa-shield-alt"></i> Đối Soát Bank N:1 — {reconcileSupplier.name}
                                </h3>
                                <div className="text-[11px] text-zinc-400 mt-0.5">Khớp 1 Phiếu Chi Chuyển Khoản Ngân Hàng với Nhiều Phiếu Nhập Hàng</div>
                            </div>
                            <button onClick={() => setReconcileSupplier(null)} disabled={isSaving} className="w-8 h-8 bg-[#09090b] rounded-full text-zinc-400 hover:text-rose-400 border border-white/[0.08] transition-colors flex items-center justify-center cursor-pointer">
                                <i className="fas fa-times text-xs"></i>
                            </button>
                        </div>

                        <div className="space-y-4 overflow-y-auto custom-scrollbar flex-1 pr-1 py-1">
                            {/* BƯỚC 1: CHỌN PHIẾU CHI BANK */}
                            <div>
                                <label className="text-[10.5px] font-bold text-[#d4af37] uppercase block mb-1.5 flex items-center gap-1.5">
                                    <i className="fas fa-university"></i> 1. CHỌN GIAO DỊCH CHI BANK TRONG 30 NGÀY GẦN NHẤT (*)
                                </label>
                                <div className="space-y-1.5 max-h-40 overflow-y-auto custom-scrollbar bg-[#09090b] p-2 rounded-xl border border-white/[0.08]">
                                    {recentBankTxs.length === 0 ? (
                                        <div className="text-center py-4 text-zinc-500 italic text-[11px]">Không có giao dịch chi Bank nào trong 30 ngày qua.</div>
                                    ) : (
                                        recentBankTxs.map(t => (
                                            <div 
                                                key={t.id} 
                                                onClick={() => setReconSelectedTxId(t.id)} 
                                                className={`p-2.5 rounded-lg border text-[11px] flex items-center justify-between cursor-pointer transition-all ${reconSelectedTxId === t.id ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 font-bold' : 'bg-[#121215] border-white/[0.04] text-zinc-300 hover:border-white/20'}`}
                                            >
                                                <div className="min-w-0 flex-1 pr-2">
                                                    <div className="font-mono text-zinc-400 text-[10px]">{t.id} • {t.date}</div>
                                                    <div className="truncate text-[11.5px]">{t.note || t.title || 'Chi tiền'}</div>
                                                </div>
                                                <div className="font-mono font-black text-[13px] text-rose-400 whitespace-nowrap">
                                                    -{displayMoney(t.amount)}đ
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* BƯỚC 2: CHỌN CÁC PHIẾU NHẬP CẦN CẤN TRỪ */}
                            <div>
                                <label className="text-[10.5px] font-bold text-[#d4af37] uppercase block mb-1.5 flex items-center gap-1.5">
                                    <i className="fas fa-boxes"></i> 2. CHỌN CÁC PHIẾU NHẬP CẦN CẤN TRỪ NỢ
                                </label>
                                <div className="space-y-1.5 max-h-44 overflow-y-auto custom-scrollbar bg-[#09090b] p-2 rounded-xl border border-white/[0.08]">
                                    {getImportHistory(reconcileSupplier.name).filter(l => !l.isPaid && Number(l.totalAmount || 0) > 0).length === 0 ? (
                                        <div className="text-center py-4 text-zinc-500 italic text-[11px]">Không có phiếu nhập nào đang chờ thanh toán.</div>
                                    ) : (
                                        getImportHistory(reconcileSupplier.name).filter(l => !l.isPaid && Number(l.totalAmount || 0) > 0).map(l => {
                                            const isSelected = reconSelectedImportIds.includes(l.id);
                                            return (
                                                <div 
                                                    key={l.id} 
                                                    onClick={() => handleToggleImport(l.id)} 
                                                    className={`p-2.5 rounded-lg border text-[11px] flex items-center justify-between cursor-pointer transition-all ${isSelected ? 'bg-[#d4af37]/15 border-[#d4af37]/40 text-[#d4af37] font-bold' : 'bg-[#121215] border-white/[0.04] text-zinc-300 hover:border-white/20'}`}
                                                >
                                                    <div className="flex items-center gap-2.5 min-w-0 flex-1 pr-2">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={isSelected} 
                                                            onChange={() => {}} 
                                                            className="w-4 h-4 rounded text-emerald-500 cursor-pointer" 
                                                        />
                                                        <div className="min-w-0 flex-1">
                                                            <div className="font-mono text-zinc-400 text-[10px]">{l.id} • {String(l.date || '').slice(0, 16)}</div>
                                                            <div className="truncate text-[11.5px] text-zinc-200">{l.note || 'Phiếu nhập'}</div>
                                                        </div>
                                                    </div>
                                                    <div className="font-mono font-black text-[13px] text-zinc-100 whitespace-nowrap">
                                                        {displayMoney(l.totalAmount)}đ
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>

                            {/* TỔNG HỢP SO SÁNH */}
                            {(() => {
                                const tx = recentBankTxs.find(t => t.id === reconSelectedTxId);
                                const txAmount = Number(tx?.amount || 0);
                                const selectedImports = getImportHistory(reconcileSupplier.name).filter(l => reconSelectedImportIds.includes(l.id));
                                const totalImportAmt = selectedImports.reduce((sum, l) => sum + Number(l.totalAmount || 0), 0);
                                const diff = txAmount - totalImportAmt;

                                return (
                                    <div className="bg-[#121215] p-3 rounded-xl border border-white/[0.08] text-[11.5px] space-y-1.5">
                                        <div className="flex justify-between text-zinc-400">
                                            <span>Số tiền Phiếu Chi Bank:</span>
                                            <span className="font-mono font-bold text-rose-400">{displayMoney(txAmount)}đ</span>
                                        </div>
                                        <div className="flex justify-between text-zinc-400">
                                            <span>Tổng tiền Phiếu Nhập tick chọn ({selectedImports.length}):</span>
                                            <span className="font-mono font-bold text-[#d4af37]">{displayMoney(totalImportAmt)}đ</span>
                                        </div>
                                        <div className="flex justify-between border-t border-white/[0.06] pt-1.5 font-bold">
                                            <span>Độ lệch (Số dư thừa):</span>
                                            <span className={`font-mono ${diff >= 0 ? 'text-emerald-400' : 'text-rose-500'}`}>
                                                {displayMoney(diff)}đ {diff < 0 && '(Thiếu tiền!)'}
                                            </span>
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>

                        <div className="pt-4 mt-2 border-t border-white/[0.08]">
                            <button 
                                onClick={handleSaveReconciliation} 
                                disabled={isSaving} 
                                className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-black rounded-xl text-[12px] tracking-wider uppercase transition-all shadow-md flex items-center justify-center gap-2 active:scale-95 cursor-pointer"
                            >
                                {isSaving ? <><i className="fas fa-circle-notch fa-spin"></i> Đang đối soát...</> : <><i className="fas fa-shield-alt"></i> Xác nhận đối soát & Cấn trừ nợ</>}
                            </button>
                        </div>
                    </div>
                </div>
            )}

        </div>
    );
});
</script>
