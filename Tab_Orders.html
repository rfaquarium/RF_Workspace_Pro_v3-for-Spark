                                        <div className="flex items-center gap-2 truncate">
                                            <span className={`px-1.5 py-0.5 rounded text-[8px] font-black uppercase ${isHuy ? 'bg-rose-600 text-white' : 'bg-orange-500 text-white'}`}>
                                                {isHuy ? 'HUỶ' : 'HOÀN'}
                                            </span>
                                            <span className="text-zinc-100 font-mono font-black tracking-wide truncate">{alertOrder.orderCode.split(' | ')[0]}</span>
                                        </div>
                                        {isHuy ? (
                                            <button onClick={() => {
                                                setSearchCode(alertOrder.orderCode.split(' | ')[0]);
                                                setFilterStatus('Đơn Hủy');
                                            }} className="text-[9px] bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded-lg transition-all font-black uppercase tracking-wider shrink-0 active:scale-95 cursor-pointer">
                                                Xem đơn
                                            </button>
                                        ) : (
                                            <button onClick={() => {
                                                setSearchCode(alertOrder.orderCode.split(' | ')[0]);
                                                setFilterStatus('Hàng Hoàn');
                                            }} className="text-[9px] bg-orange-600 hover:bg-orange-500 text-white px-2.5 py-1 rounded-lg transition-all font-black uppercase tracking-wider shrink-0 active:scale-95 cursor-pointer">
                                                Kiểm hoàn
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                )}

                {/* BỘ LỌC KÊNH BÁN (CHUẨN DRIBBLE COLOR ACCENT) */}
                <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar no-scrollbar mb-3 pb-1">
                    {[
                        {
                            id: 'ALL',
                            label: 'Tất Cả',
                            icon: 'fa-store',
                            activeClass: 'bg-white text-zinc-950 shadow-md font-black',
                            inactiveClass: 'bg-white/5 text-zinc-300 border border-white/10 hover:bg-white/10 hover:text-white',
                            activeIconClass: 'text-zinc-950',
                            inactiveIconClass: 'text-zinc-300'
                        },
                        {
                            id: 'SHOPEE',
                            label: 'Shopee',
                            icon: 'fa-shopping-bag',
                            activeClass: 'bg-[#f97316] text-white shadow-md font-black',
                            inactiveClass: 'bg-orange-500/10 text-orange-400 border border-orange-500/20 hover:bg-orange-500/20 hover:text-orange-300',
                            activeIconClass: 'text-white',
                            inactiveIconClass: 'text-orange-400'
                        },
                        {
                            id: 'EXPORT',
                            label: 'Xuất Khẩu',
                            icon: 'fa-globe-asia',
                            activeClass: 'bg-[#10b981] text-zinc-950 shadow-md font-black',
                            inactiveClass: 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 hover:text-emerald-300',
                            activeIconClass: 'text-zinc-950',
                            inactiveIconClass: 'text-emerald-400'
                        },
                        {
                            id: 'TIKTOK',
                            label: 'TikTok',
                            icon: 'fa-video',
                            activeClass: 'bg-[#ec4899] text-white shadow-md font-black',
                            inactiveClass: 'bg-pink-500/10 text-pink-400 border border-pink-500/20 hover:bg-pink-500/20 hover:text-pink-300',
                            activeIconClass: 'text-white',
                            inactiveIconClass: 'text-pink-400'
                        },
                        {
                            id: 'BÁN LẺ',
                            label: 'Bán Lẻ',
                            icon: 'fa-box',
                            activeClass: 'bg-[#60a5fa] text-zinc-950 shadow-md font-black',
                            inactiveClass: 'bg-blue-500/10 text-blue-400 border border-blue-500/20 hover:bg-blue-500/20 hover:text-blue-300',
                            activeIconClass: 'text-zinc-950',
                            inactiveIconClass: 'text-blue-400'
                        },
                        {
                            id: 'CTV',
                            label: 'CTV',
                            icon: 'fa-handshake',
                            activeClass: 'bg-[#c084fc] text-zinc-950 shadow-md font-black',
                            inactiveClass: 'bg-purple-500/10 text-purple-400 border border-purple-500/20 hover:bg-purple-500/20 hover:text-purple-300',
                            activeIconClass: 'text-zinc-950',
                            inactiveIconClass: 'text-purple-400'
                        }
                    ].map(ch => {
                        const isActive = filterChannel === ch.id;
                        return (
                            <button
                                key={ch.id}
                                onClick={() => setFilterChannel(ch.id)}
                                className={`shrink-0 px-3.5 py-2 rounded-xl text-[11px] transition-all duration-200 flex items-center gap-2 active:scale-95 cursor-pointer ${isActive ? ch.activeClass : ch.inactiveClass}`}
                            >
                                <i className={`fas ${ch.icon} ${isActive ? ch.activeIconClass : ch.inactiveIconClass}`}></i>
                                <span>{ch.label}</span>
                            </button>
                        );
                    })}
                </div>

                {/* BỘ LỌC TRẠNG THÁI */}
                <div className="relative mb-4">
                    <div ref={tabsContainerRef} className="flex items-center gap-2 overflow-x-auto custom-scrollbar no-scrollbar pb-1 scroll-smooth">
                        {tabs.map(t => {
                            const cur = String(filterStatus || '').toUpperCase().trim();
                            const target = String(t.id || '').toUpperCase().trim();
                            const isActive = (cur === target) ||
                                ((target === 'ĐƠN HUỶ' || target === 'ĐƠN HỦY') && (cur === 'ĐƠN HUỶ' || cur === 'ĐƠN HỦY' || cur === 'HỦY' || cur === 'HUỶ')) ||
                                ((target === 'HÀNG HOÀN' || target.includes('HOÀN CHỜ XỬ')) && (cur === 'HÀNG HOÀN' || (cur.includes('HOÀN') && !cur.includes('HOÀN THÀNH')))) ||
                                (target === 'HOÀN THÀNH' && (cur === 'HOÀN THÀNH' || cur === 'ĐỐI SOÁT THÀNH CÔNG'));

                            return (
                                <button
                                    key={t.id}
                                    data-active={isActive ? "true" : "false"}
                                    onClick={() => setFilterStatus(t.id)}
                                    className={`shrink-0 px-3.5 py-2 rounded-xl text-[11px] transition-all duration-200 flex items-center gap-2 active:scale-95 cursor-pointer ${isActive ? t.activeClass : t.inactiveClass}`}
                                >
                                    <i className={`fas ${t.icon} ${isActive ? '' : 'opacity-80'}`}></i>
                                    <span>{t.label}</span>
                                    <span className={`px-1.5 py-0.5 rounded-md text-[9px] min-w-[20px] text-center ${isActive ? t.activeBadgeClass : t.inactiveBadgeClass}`}>
                                        {t.count}
                                    </span>
                                </button>
                            );
                        })}
                    </div>
                </div>

                {/* TÁC VỤ HÀNG LOẠT (HALLMARK COMPACT DOCK) */}
                {!isCTV && selectedIds.length > 0 && (
                    <div className="sticky top-2 z-40 bg-[#111114]/95 backdrop-blur-md border border-sky-500/30 rounded-2xl p-2 sm:px-3.5 sm:py-2 mb-3 flex items-center justify-between gap-2 shadow-[0_8px_30px_rgba(0,0,0,0.6)] animate-slide-down">
                        {/* Left: Badge + Count + Clear */}
                        <div className="flex items-center gap-2 min-w-0">
                            <div className="flex items-center gap-1.5 bg-sky-500/15 border border-sky-500/40 text-sky-300 px-2.5 py-1 rounded-xl text-xs font-black shrink-0">
                                <span className="w-4.5 h-4.5 rounded-lg bg-sky-500 text-black flex items-center justify-center text-[10px] font-black">{selectedIds.length}</span>
                                <span className="text-[11px] uppercase tracking-wider font-extrabold">Đã chọn</span>
                            </div>
                            <button 
                                type="button"
                                onClick={clearSelection} 
                                className="text-[11px] text-zinc-400 hover:text-rose-400 flex items-center gap-1 py-1 px-1.5 rounded-lg hover:bg-white/5 transition-colors cursor-pointer shrink-0 font-medium"
                                title="Bỏ chọn tất cả"
                            >
                                <i className="fas fa-times text-[10px]"></i>
                                <span>Bỏ chọn</span>
                            </button>
                        </div>

                        {/* Right: Actions */}
                        <div className="flex items-center gap-1.5 shrink-0">
                            {(filterStatus === 'Hàng Hoàn' || filterStatus === 'HÀNG HOÀN CHỜ XỬ' || filterStatus === 'HÀNG HOÀN CHỜ XỬ LÝ') && hasPerm('ORDER_STATUS_RECONCILED') && (
                                <button
                                    type="button"
                                    onClick={handleBulkReturnApprove}
                                    disabled={isBulkHandovering}
                                    className="flex items-center gap-1.5 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white font-black px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-[11px] uppercase active:scale-95 transition-all shadow-md border border-teal-400/30 disabled:opacity-50 cursor-pointer"
                                >
                                    <i className={`fas ${isBulkHandovering ? 'fa-spinner fa-spin' : 'fa-check-double'} text-[10px]`}></i>
                                    <span>Duyệt Hoàn ({selectedIds.length})</span>
                                </button>
                            )}

                            {hasPerm('ORDER_DELETE') && (
                                <button
                                    type="button"
                                    onClick={handleBulkDelete}
                                    disabled={isBulkDeleting}
                                    className="flex items-center gap-1.5 bg-rose-950/70 hover:bg-rose-900 border border-rose-800/50 text-rose-300 hover:text-white font-bold px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl text-[11px] uppercase active:scale-95 transition-all disabled:opacity-50 cursor-pointer"
                                    title={`Xoá ${selectedIds.length} đơn đã chọn`}
                                >
                                    <i className={`fas ${isBulkDeleting ? 'fa-spinner fa-spin' : 'fa-trash-alt'} text-[10px]`}></i>
                                    <span className="hidden sm:inline">{isBulkDeleting ? 'Xoá...' : 'Xoá'}</span>
                                </button>
                            )}

                            {hasPerm('ORDER_STATUS_DELIVERED') && (
                                eligibleHandoverOrders.length > 0 ? (
                                    <button 
                                        type="button"
                                        onClick={handleBulkHandover} 
                                        disabled={isBulkHandovering} 
                                        className="flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-400 text-black font-black px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-[11px] uppercase active:scale-95 transition-all shadow-[0_0_15px_rgba(16,185,129,0.25)] border border-emerald-300 disabled:opacity-50 cursor-pointer"
                                        title={`Bàn giao hàng loạt ${eligibleHandoverOrders.length} đơn`}
                                    >
                                        <i className={`fas ${isBulkHandovering ? 'fa-spinner fa-spin' : 'fa-truck-fast'} text-[11px]`}></i>
                                        <span>{isBulkHandovering ? 'Đang Giao...' : `Bàn Giao (${eligibleHandoverOrders.length})`}</span>
                                    </button>
                                ) : (
                                    <div 
                                        className="flex items-center gap-1.5 bg-emerald-950/70 border border-emerald-500/40 text-emerald-400 font-bold px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-[11px] uppercase tracking-wider select-none shadow-sm"
                                        title="Tất cả các đơn đã chọn đều đã ở trạng thái ĐÃ BÀN GIAO"
                                    >
                                        <i className="fas fa-check-double text-[10px]"></i>
                                        <span>Đã Bàn Giao ({selectedOrdersList.length})</span>
                                    </div>
                                )
                            )}
                        </div>
                    </div>
                )}

                {/* DANH SÁCH ĐƠN HÀNG GOM THEO KÊNH BÁN */}
                <div className="space-y-4">
                    {sortedFiltered.length === 0 ? (
                        <div className="text-center py-10 px-4 text-gray-500 font-bold text-[11px] bg-[#0f0f11] rounded-2xl border-2 border-dashed border-white/[0.07] space-y-3">
                            <i className="fas fa-box-open text-3xl block opacity-30"></i>
                            <div>Không có đơn hàng nào phù hợp với bộ lọc hiện tại.</div>
                            {searchCode.trim().length >= 4 && (
                                <button
                                    onClick={() => handleLazyLoadArchive({ searchCode: searchCode.trim() })}
                                    disabled={isLazyLoadingArchive}
                                    className="px-4 py-2.5 bg-[#d4af37]/15 hover:bg-[#d4af37]/25 border border-[#d4af37]/40 text-[#d4af37] font-black text-[11px] uppercase tracking-wider rounded-xl transition-all active:scale-95 inline-flex items-center gap-2 mx-auto cursor-pointer"
                                >
                                    <i className={isLazyLoadingArchive ? "fas fa-spinner fa-spin" : "fas fa-search"}></i>
                                    <span>{isLazyLoadingArchive ? "Đang quét Kho Lưu Trữ..." : `Tìm "${searchCode.trim()}" trong Orders_Archive`}</span>
                                </button>
                            )}
                        </div>
                    ) : (
                        <>
                            {(() => {
                                const channelPriorityMap = {
                                    'XUẤT KHẨU': 1,
                                    'BẢO HÀNH': 2,
                                    'TIKTOK SHOP': 3,
                                    'SHOPEE VN': 4,
                                    'CỘNG TAC VIÊN': 5,
                                    'BÁN LẺ': 6,
                                    'BÁN SỈ': 7,
                                    'SẢN XUẤT TỒN': 8
                                };

                                const resolveGroupKey = (o) => {
                                    const upperChan = String(o.channel || '').toUpperCase().trim();
                                    const codeStr = String(o.orderCode || '').toUpperCase();

                                    const isInter = upperChan.includes('XUẤT KHẨU') || upperChan.includes('EXPORT') || upperChan.includes('QUỐC TẾ') ||
                                        upperChan.includes('SHOPEE SG') || upperChan.includes('SHOPEE TH') || upperChan.includes('SHOPEE TW') ||
                                        upperChan.includes('SHOPEE PH') || upperChan.includes('SHOPEE MA') || upperChan.includes('SHOPEE MY') ||
                                        /\b(SHOPEE_SG|SHOPEE_MY|SHOPEE_TH|SHOPEE_PH|SHOPEE_MA|SHOPEE_TW)\b/i.test(upperChan);

                                    if (isInter) return 'XUẤT KHẨU';
                                    if (upperChan === 'SHOPEE' || upperChan === 'SHOPEE VN' || upperChan === 'SHOPEE_VN') return 'SHOPEE VN';
                                    if (upperChan.includes('SHOPEE')) return 'SHOPEE VN';
                                    if (upperChan.includes('TIKTOK') || upperChan.includes('TIK TOK')) return 'TIKTOK SHOP';
                                    if (upperChan.includes('CỘNG TÁC VIÊN') || upperChan.includes('CTV')) return 'CỘNG TÁC VIÊN';
                                    if (upperChan.includes('BÁN LẺ') || upperChan.includes('BAN LE') || upperChan.includes('OFFLINE') || upperChan.includes('ZALO') || upperChan.includes('FACEBOOK') || upperChan.includes('MESSENGER')) return 'BÁN LẺ';
                                    if (upperChan.includes('BÁN SỈ') || upperChan.includes('BAN SI') || upperChan.includes('WHOLESALE')) return 'BÁN SỈ';
                                    if (upperChan.includes('SẢN XUẤT TỒN') || upperChan.includes('SẢN XUẤT BÙ KHO') || upperChan.includes('TỒN XƯỞNG')) return 'SẢN XUẤT TỒN';
                                    if (upperChan.includes('BẢO HÀNH') || upperChan.includes('SỬA CHỮA')) return 'BẢO HÀNH';

                                    // Nhận diện thông minh theo cấu trúc mã đơn nếu channel rỗng
                                    if (codeStr.includes('SPXVN') || codeStr.includes('SHOPEE') || /^2\d{13,15}/.test(codeStr)) return 'SHOPEE VN';
                                    if (codeStr.includes('TIKTOK') || /^57\d{16,18}/.test(codeStr)) return 'TIKTOK SHOP';

                                    return 'BÁN LẺ';
                                };



                                const orderGroups = [];
                                sortedFiltered.slice(0, renderLimit).forEach((o, index) => {
                                    const key = resolveGroupKey(o);
                                    let g = orderGroups.find(x => x.groupKey === key);
                                    if (!g) {
                                        g = { groupKey: key, orders: [], priority: channelPriorityMap[key] || 99 };
                                        orderGroups.push(g);
                                    }
                                    g.orders.push({ order: o, originalIdx: index + 1 });
                                });

                                orderGroups.sort((a, b) => a.priority - b.priority);

                                return orderGroups.map(group => {
                                    const { groupKey, orders: groupOrders } = group;
                                    const isCollapsed = collapsedGroups[groupKey] === true;

                                    return (
                                        <div key={`order_group_${groupKey}`} className="space-y-3">
                                            <div
                                                style={getChannelInlineStyle(groupKey)}
                                                className="w-full py-3 px-4 mt-4 mb-2 flex items-center justify-between gap-2 rounded-2xl uppercase tracking-wider shadow-lg select-none transition-all font-black"
                                            >
                                                <div className="text-[13px] font-black flex items-center gap-2 truncate cursor-pointer" onClick={() => setCollapsedGroups(prev => ({ ...prev, [groupKey]: !isCollapsed }))}>
                                                    <i className="fas fa-layer-group opacity-90 text-[12px]"></i>
                                                    <span className="truncate">{groupKey}</span>
                                                </div>

                                                <div className="flex items-center gap-2 shrink-0">
                                                    {(!isCTV || isAdmin || isBossRole) && groupOrders.length > 0 && (
                                                        <div
                                                            className="flex items-center gap-1.5 bg-black/30 text-current px-2.5 py-1 rounded-xl cursor-pointer hover:bg-black/40 border border-black/20 transition-all active:scale-95"
                                                            title="Chọn/bỏ chọn tất cả đơn trong kênh này"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                const groupOrderIds = groupOrders.map(x => x.order.id);
                                                                const isAllGroupSelected = groupOrderIds.every(id => selectedIds.includes(id));
                                                                if (isAllGroupSelected) {
                                                                    setSelectedIds(prev => prev.filter(id => !groupOrderIds.includes(id)));
                                                                } else {
                                                                    setSelectedIds(prev => [...new Set([...prev, ...groupOrderIds])]);
                                                                }
                                                            }}
                                                        >
                                                            <input
                                                                type="checkbox"
                                                                checked={groupOrders.length > 0 && groupOrders.every(x => selectedIds.includes(x.order.id))}
                                                                readOnly
                                                                className="w-4 h-4 accent-[#10b981] rounded cursor-pointer pointer-events-none"
                                                            />
                                                            <span className="text-[10px] font-black">CHỌN TẤT CẢ</span>
                                                        </div>
                                                    )}

                                                    <div className="flex items-center gap-1.5 bg-black/25 text-current px-2.5 py-1 rounded-xl border border-black/10 font-black cursor-pointer" onClick={() => setCollapsedGroups(prev => ({ ...prev, [groupKey]: !isCollapsed }))}>
                                                        <span className="text-[11px] font-black">{groupOrders.length} ĐƠN</span>
                                                        <i className={`fas fa-chevron-${isCollapsed ? 'down' : 'up'} text-[11px]`}></i>
                                                    </div>
                                                </div>
                                            </div>

                                            {!isCollapsed && (
                                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3">
                                                    {groupOrders.map(({ order: o, originalIdx }) => {
                                                        const oIdStr = String(o.id || '').trim();
                                                        const oCodeStr = String(o.orderCode || '').trim();
                                                        const baseCodeStr = oCodeStr.split(' | ')[0].trim();
                                                        const latestPack = latestPackMap[oIdStr] || (oCodeStr ? latestPackMap[oCodeStr] : null) || (baseCodeStr ? latestPackMap[baseCodeStr] : null);
                                                        const matchedProds = getMatchedProds(o);
                                                        return (
                                                            <RFOrderWrapper
                                                                key={o.id}
                                                                attendance={attendance}
                                                                order={o}
                                                                orders={orders}
                                                                prods={matchedProds}
                                                                pack={latestPack}
                                                                packings={packings}
                                                                erpProducts={erpProducts}
                                                                erpData={erpData}
                                                                isAdmin={isAdmin}
                                                                currentUser={currentUser}
                                                                pushDeltas={pushDeltas}
                                                                prodItems={prodItems}
                                                                userConfigs={userConfigs}
                                                                triggerToast={triggerToast}
                                                                isSelected={selectedIds.includes(o.id)}
                                                                onToggleSelect={toggleSelect}
                                                                kpiConfig={kpiConfig}
                                                                idx_num={originalIdx}
                                                                handleCancelOrder={handleCancelOrder}
                                                                handleConfirmStockIn={handleConfirmStockIn}
                                                                openReturnModal={openReturnModal}
                                                                filterStatus={filterStatus}
                                                                onEditOrder={handleEditOrder}
                                                            />
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    );
                                });
                            })()}
                            {renderLimit < sortedFiltered.length && (
                                <div className="pt-4 pb-2 flex justify-center">
                                    <RFButton variant="outline" onClick={() => setRenderLimit(prev => prev + 50)} className="w-full max-w-sm rounded-xl py-3 text-sm font-bold border-white/20 hover:bg-white/5">
                                        Tải thêm ({sortedFiltered.length - renderLimit} đơn)
                                    </RFButton>
                                </div>
                            )}
                        </>
                    )}
                </div>

                {/* Modal Tạo Đơn & Máy Quét Mã Đơn Hoàn */}
                {(addingMode || draftData || editingOrder) && <AddModal onClose={() => { setAddingMode(false); setDraftData(null); setEditingOrder(null); }} pushDeltas={pushDeltas} products={erpProducts} erpData={erpData} triggerToast={triggerToast} userConfigs={userConfigs} configGiaLayout={configGiaLayout} draftData={draftData} editOrder={editingOrder ? editingOrder.order : null} editProds={editingOrder ? editingOrder.prods : []} />}
                {isScanningReturn && <ReturnScannerModal onClose={() => setIsScanningReturn(false)} orders={orders} pushDeltas={pushDeltas} triggerToast={triggerToast} />}
                {isScanningCancel && <CancelScannerModal onClose={() => setIsScanningCancel(false)} orders={orders} prodItems={prodItems} pushDeltas={pushDeltas} triggerToast={triggerToast} />}

                {/* TRẠM ĐỐI SOÁT TÀI CHÍNH */}
                {isBulkFinanceOpen && typeof BulkFinanceModal !== 'undefined' && (
                    <BulkFinanceModal
                        onClose={() => setIsBulkFinanceOpen(false)}
                        pushDeltas={pushDeltas}
                        orders={orders}
                        transactions={erpData?.Transactions || []}
                        accounts={erpData?.Accounts || []}
                    />
                )}

                {/* MODAL LƯU TRỮ ĐƠN HÀNG CŨ SANG ORDERS_ARCHIVE */}
                {isArchiveEngineOpen && (
                    <ArchiveEngineModal
                        onClose={() => setIsArchiveEngineOpen(false)}
                        triggerToast={triggerToast}
                    />
                )}
            </div>
        );
    });
</script>
