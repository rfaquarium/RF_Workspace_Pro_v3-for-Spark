<script type="text/babel">
// =========================================================================
// 📦 FILE: Tab_ImportExport.txt
// CHỨC NĂNG: Lịch sử xuất/nhập toàn hệ thống & Modal Tạo Phiếu (Giao diện nâng cấp)
// =========================================================================

// -------------------------------------------------------------------------
// 1. MODAL THẺ KHO CHI TIẾT (StockHistoryModal)
// -------------------------------------------------------------------------
function StockHistoryModal({ product, onClose, importExport, products, pushDeltas, pushData, triggerToast, isAdmin, isBoss }) {
    const logs = React.useMemo(() => {
        if (!importExport || !product) return [];
        let result = [];
        const prodSkuUpper = String(product.sku || '').trim().toUpperCase();
        const prodId = String(product.id || '').trim();
        const prodNameClean = String(product.name || '').trim().toLowerCase();

        importExport.forEach(log => {
            // Kiểm tra đúng cột log.type của bảng ImportExport (bỏ qua đơn Đặt Hàng)
            if (log.type === 'Đặt Hàng' || log.type === 'ORDERED') return;
            
            try {
                const items = typeof log.itemsData === 'string' ? JSON.parse(log.itemsData) : (Array.isArray(log.itemsData) ? log.itemsData : []);
                if (!Array.isArray(items)) return;
                
                const match = items.find(i => {
                    const iSku = String(i.sku || '').trim().toUpperCase();
                    const iId = String(i.id || '').trim();
                    const iName = String(i.name || '').trim().toLowerCase();
                    
                    // Ưu tiên khớp SKU/ID, fallback khớp tên chính xác cho dữ liệu cũ
                    return (iSku && prodSkuUpper && iSku === prodSkuUpper) || 
                           (iId && prodId && iId === prodId) || 
                           (iName && prodNameClean && iName === prodNameClean);
                });
                
                if (match) {
                    const rawQty = match.qty !== undefined ? match.qty : (match.deductedQty !== undefined ? match.deductedQty : (parseFloat(match.quantity) || 0));
                    result.push({
                        ...log,
                        changedQty: Math.round(Number(rawQty || 0) * 1000) / 1000,
                        price: match.price || match.costPrice || 0
                    });
                }
            } catch(e) {}
        });
        
        // Sắp xếp giảm dần thời gian
        result.sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
        
        // Tính lũy kế tồn kho ngược chuẩn xác
        let currentBal = Number(product.quantity || 0);
        result.forEach(log => {
            log.balanceAfter = Math.round(currentBal * 1000) / 1000;
            if (log.type === 'Nhập' || log.type === 'Cân Tăng') {
                currentBal -= Number(log.changedQty || 0);
            } else if (log.type === 'Xuất' || log.type === 'Thanh Lý' || log.type === 'Cân Giảm') {
                currentBal += Number(log.changedQty || 0);
            }
            currentBal = Math.round(currentBal * 1000) / 1000;
        });
        
        return result;
    }, [importExport, product]);

    const handleDeleteLog = async (L) => {
        if (!L || !L.id) return;
        const isAuditLog = L.type === 'Kiểm Kho' || L.type === 'KIEM_KHO' || L.type === 'Cân Tăng' || L.type === 'Cân Giảm' || String(L.id).includes('KK');
        const title = isAuditLog ? `phiếu kiểm kho ${L.id}` : `chứng từ ${L.id} (${L.type})`;
        
        let confirmMsg = `Bạn có chắc muốn XOÁ VĨNH VIỄN ${title} này không?`;
        if (L.type === 'Nhập' || L.type === 'Cân Tăng') {
            confirmMsg += `\n\n⚠️ Hệ thống sẽ tự động TRỪ TRẢ LẠI số lượng tồn kho tương ứng của các mặt hàng trong phiếu.`;
        } else if (L.type === 'Xuất' || L.type === 'Thanh Lý' || L.type === 'Cân Giảm') {
            confirmMsg += `\n\n⚠️ Hệ thống sẽ tự động CỘNG HOÀN TRẢ số lượng tồn kho tương ứng của các mặt hàng trong phiếu.`;
        }

        if (!window.confirm(confirmMsg)) return;

        // Parse itemsData để tính toán hoàn tồn
        let parsedItems = [];
        try {
            parsedItems = typeof L.itemsData === 'string' ? JSON.parse(L.itemsData) : (Array.isArray(L.itemsData) ? L.itemsData : []);
        } catch (e) {
            parsedItems = [];
        }

        const allProds = products || (typeof erpData !== 'undefined' && erpData?.Products) || (typeof window !== 'undefined' && window.erpData?.Products) || [];
        const updatedProducts = [];

        if (parsedItems.length > 0) {
            parsedItems.forEach(item => {
                const iSku = String(item.sku || '').trim().toUpperCase();
                const iId = String(item.id || '').trim();
                const iName = String(item.name || '').trim().toLowerCase();
                const rawQty = item.qty !== undefined ? item.qty : (item.deductedQty !== undefined ? item.deductedQty : (parseFloat(item.quantity) || 0));
                const itemQty = Number(rawQty) || 0;

                let targetProd = allProds.find(p => {
                    const pSku = String(p.sku || '').trim().toUpperCase();
                    const pId = String(p.id || '').trim();
                    const pName = String(p.name || '').trim().toLowerCase();
                    return (iSku && pSku && iSku === pSku) || (iId && pId && iId === pId) || (iName && pName && iName === pName);
                });

                // Fallback nếu chính là product đang mở thẻ kho
                if (!targetProd && product) {
                    const pSku = String(product.sku || '').trim().toUpperCase();
                    const pId = String(product.id || '').trim();
                    const pName = String(product.name || '').trim().toLowerCase();
                    if ((iSku && pSku && iSku === pSku) || (iId && pId && iId === pId) || (iName && pName && iName === pName)) {
                        targetProd = product;
                    }
                }

                if (targetProd && itemQty !== 0) {
                    let diffVal = 0;
                    if (L.type === 'Nhập' || L.type === 'Cân Tăng') {
                        diffVal = -itemQty; // Xóa phiếu nhập -> giảm tồn kho
                    } else if (L.type === 'Xuất' || L.type === 'Thanh Lý' || L.type === 'Cân Giảm') {
                        diffVal = itemQty; // Xóa phiếu xuất -> cộng trả tồn kho
                    }

                    if (diffVal !== 0) {
                        const currentQty = Number(targetProd.quantity || 0);
                        const newQty = Math.round((currentQty + diffVal) * 1000) / 1000;
                        updatedProducts.push({
                            ...targetProd,
                            quantity: newQty,
                            _diff: diffVal
                        });
                    }
                }
            });
        }

        const payload = {
            deletes: { ImportExport: [L.id] },
            ...(updatedProducts.length > 0 ? { Products: updatedProducts } : {})
        };

        const pushFn = pushDeltas || pushData;
        if (typeof pushFn === 'function') {
            try {
                await pushFn(payload, `Đã xoá ${title} và cập nhật lại tồn kho!`, 'fa-trash-alt');
                if (typeof triggerToast === 'function') {
                    triggerToast(`Đã xoá ${title} và cập nhật lại tồn kho!`, 'fa-check', 'success');
                }
            } catch (e) {
                alert('Lỗi xoá: ' + (e?.message || e));
            }
        }
    };

    return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-md animate-fade-in" onClick={onClose}>
            <div className="bg-[#121216] border border-white/[0.08] w-full max-w-md rounded-3xl p-5 sm:p-6 shadow-2xl flex flex-col max-h-[82vh] animate-scale-up" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4 shrink-0 border-b border-white/[0.06] pb-3.5">
                    <div>
                        <div className="font-black text-[11px] text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                            <i className="fas fa-history"></i> THẺ KHO SẢN PHẨM
                        </div>
                        <div className="text-white font-black text-sm mt-1">{product.name}</div>
                    </div>
                    <button 
                        onClick={onClose} 
                        className="w-8 h-8 rounded-full bg-white/[0.04] hover:bg-white/[0.1] text-zinc-400 hover:text-white flex items-center justify-center transition-colors border border-white/[0.08] cursor-pointer"
                    >
                        <i className="fas fa-times text-xs"></i>
                    </button>
                </div>

                <div className="flex gap-3 mb-4 shrink-0">
                    <div className="flex-1 bg-[#09090b] border border-white/[0.08] rounded-2xl p-3 text-center shadow-inner">
                        <div className="text-[8.5px] text-zinc-400 font-black uppercase tracking-widest mb-1">Mã SKU</div>
                        <div className="text-[12px] font-mono font-black text-[#d4af37]">{product.sku || 'N/A'}</div>
                    </div>
                    <div className="flex-1 bg-[#09090b] border border-white/[0.08] rounded-2xl p-3 text-center shadow-inner">
                        <div className="text-[8.5px] text-zinc-400 font-black uppercase tracking-widest mb-1">Tồn Hiện Tại</div>
                        <div className="text-[16px] font-mono font-black text-emerald-400 leading-none mt-0.5">
                            {formatStockQty(product.quantity)} <span className="text-[10px] text-zinc-400 font-bold uppercase">{product.unit || 'Cái'}</span>
                        </div>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-2">
                    {logs.length === 0 ? (
                        <div className="text-center text-zinc-500 font-bold text-[11px] py-10 bg-[#09090b] rounded-2xl border border-white/[0.06] italic">
                            Chưa có lịch sử xuất/nhập nào.
                        </div>
                    ) : (
                        logs.map((L, i) => (
                            <div key={i} className="bg-[#09090b] p-3 rounded-2xl border border-white/[0.04] hover:border-white/[0.12] flex justify-between items-center transition-colors group shadow-sm">
                                <div className="flex-1 min-w-0 pr-3">
                                    <div className="flex items-center gap-2 mb-1.5">
                                        <span className={`text-[8.5px] font-black px-2 py-0.5 rounded-md border uppercase tracking-wider ${
                                            L.type==='Nhập' || L.type==='Cân Tăng' 
                                                ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' 
                                                : (L.type==='Kiểm Kho' || L.type==='KIEM_KHO' 
                                                    ? 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' 
                                                    : 'bg-rose-500/15 text-rose-300 border-rose-500/30')
                                        }`}>
                                            {L.type}
                                        </span>
                                        <span className="text-[9.5px] text-zinc-400 font-bold font-mono">{String(L.date).slice(0, 16)}</span>
                                        {(isAdmin || isBoss) && (
                                            <button 
                                                type="button"
                                                onClick={(e) => { e.stopPropagation(); handleDeleteLog(L); }} 
                                                className="opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-rose-400 transition-all p-0.5 ml-auto cursor-pointer"
                                                title="Xóa chứng từ kho này"
                                            >
                                                <i className="fas fa-trash-alt text-[10px]"></i>
                                            </button>
                                        )}
                                    </div>
                                    <div className="text-[11.5px] font-bold text-zinc-300 leading-tight group-hover:text-white transition-colors line-clamp-2" title={L.note || L.target}>
                                        {cleanStockLogNote(L.note, L.target)}
                                    </div>
                                </div>
                                <div className="flex flex-col items-end shrink-0">
                                    <div className={`text-[14.5px] font-mono font-black ${L.type==='Nhập' || L.type==='Cân Tăng' ? 'text-emerald-400' : 'text-rose-400'}`}>
                                        {L.type==='Nhập' || L.type==='Cân Tăng' ? '+' : '-'}{formatStockQty(L.changedQty)} <span className="text-[9px] font-bold uppercase opacity-70 font-sans">{product.unit || 'Cái'}</span>
                                    </div>
                                    <div className="text-[9.5px] text-zinc-400 font-bold mt-1 bg-white/[0.04] px-2 py-0.5 rounded-lg border border-white/[0.06] font-mono">
                                        Tồn: <span className="text-zinc-200 font-bold">{formatStockQty(L.balanceAfter)}</span>
                                    </div>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            </div>
        </div>
    );
}

// -------------------------------------------------------------------------
// MODAL IN PHIẾU XUẤT / NHẬP KHO (ImportExportPrintModal)
// -------------------------------------------------------------------------
function ImportExportPrintModal({ ticket, onClose, triggerToast }) {
    if (!ticket) return null;

    const canvasRef = React.useRef(null);
    const [receiptImageUrl, setReceiptImageUrl] = React.useState('');
    const [isGeneratingImg, setIsGeneratingImg] = React.useState(true);

    const ticketType = ticket.type || 'Nhập';
    const isImport = ticketType === 'Nhập';
    const isAudit = ticket.isAudit ||
                    (ticket.id && String(ticket.id).includes('GCHK')) || 
                    (ticket.target && String(ticket.target).toLowerCase().includes('kiểm kho')) ||
                    (ticket.target && String(ticket.target).toLowerCase().includes('cân')) ||
                    (ticket.note && String(ticket.note).toLowerCase().includes('kiểm kho'));

    let ticketTitle = 'PHIẾU XUẤT NHẬP KHO';
    if (isAudit) {
        ticketTitle = ticket.isConsolidated ? 'PHIẾU KIỂM KHO TỔNG HỢP' : 'PHIẾU KIỂM KHO';
    } else if (ticket.isConsolidated) {
        ticketTitle = ticket.consolidatedTitle || 'PHIẾU TỔNG HỢP XUẤT NHẬP KHO';
    } else if (ticketType === 'Nhập') {
        ticketTitle = 'PHIẾU NHẬP KHO';
    } else if (ticketType === 'Xuất') {
        ticketTitle = 'PHIẾU XUẤT KHO';
    } else {
        ticketTitle = `PHIẾU ${ticketType.toUpperCase()} KHO`;
    }

    const ticketId = ticket.id || 'IE_' + Date.now();

    const generateReceiptCanvas = React.useCallback(() => {
        try {
            setIsGeneratingImg(true);
            const canvas = canvasRef.current || document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            const width = 380;
            const itemsList = Array.isArray(ticket.items) ? ticket.items : (typeof ticket.itemsData === 'string' ? safeJSONParse(ticket.itemsData) : []);

            let estimatedHeight = 360;
            ctx.font = '12px Arial, sans-serif';
            itemsList.forEach(item => {
                const words = (item.name || item.sku || 'Sản phẩm').split(' ');
                let line = '';
                let lineCount = 1;
                for (let w = 0; w < words.length; w++) {
                    if (ctx.measureText(line + words[w] + ' ').width > 200) {
                        lineCount++;
                        line = words[w] + ' ';
                    } else {
                        line += words[w] + ' ';
                    }
                }
                estimatedHeight += (lineCount * 18) + 16;
            });

            if (ticket.note) {
                estimatedHeight += Math.ceil(String(ticket.note).length / 32) * 18 + 10;
            }

            canvas.width = width;
            canvas.height = Math.max(480, Math.min(1600, estimatedHeight));

            // Nền trắng
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let y = 35;
            ctx.fillStyle = '#000000';

            // Tiêu đề PHIẾU NHẬP / XUẤT KHO / KIỂM KHO
            ctx.textAlign = 'center';
            ctx.font = 'bold 20px "Courier New", monospace, Arial';
            ctx.fillText(ticketTitle, width / 2, y);
            y += 30;

            // Thông tin phiếu
            ctx.textAlign = 'left';
            ctx.font = '12px Arial, sans-serif';

            const drawInfoLine = (label, val) => {
                if (!val && val !== 0 && val !== '0') return;
                ctx.font = 'bold 12px Arial, sans-serif';
                ctx.fillText(label, 15, y);
                const labelWidth = ctx.measureText(label).width;
                ctx.font = '12px Arial, sans-serif';

                const maxValW = width - 30 - labelWidth;
                const valStr = String(val);
                if (ctx.measureText(valStr).width > maxValW) {
                    const words = valStr.split(' ');
                    let line = '';
                    let isFirst = true;
                    for (let w = 0; w < words.length; w++) {
                        if (ctx.measureText(line + words[w] + ' ').width > maxValW) {
                            ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                            y += 18;
                            line = words[w] + ' ';
                            isFirst = false;
                        } else {
                            line += words[w] + ' ';
                        }
                    }
                    if (line.trim()) {
                        ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                        y += 18;
                    }
                } else {
                    ctx.fillText(valStr, 15 + labelWidth, y);
                    y += 18;
                }
            };

            drawInfoLine('Số Phiếu: ', ticketId);
            if (isAudit) {
                drawInfoLine('Loại phiếu: ', ticket.isConsolidated ? 'Kiểm kho (Tổng hợp theo ngày)' : (ticketType === 'Nhập' || String(ticket.target).includes('Cân tăng') ? 'Kiểm kho (Cân tăng)' : 'Kiểm kho (Cân giảm)'));
                drawInfoLine('Mục đích: ', ticket.target || 'Cân đối kiểm kê kho định kỳ');
            } else {
                drawInfoLine('Loại phiếu: ', ticket.isConsolidated ? 'Tổng Hợp Xuất Nhập' : ticketType);
                drawInfoLine(isImport ? 'Đối tác / NCC: ' : 'Người nhận / Khách: ', ticket.target || 'Nội bộ/Khác');
            }
            if (ticket.creator || ticket.user) drawInfoLine('Người lập: ', ticket.creator || ticket.user || 'Hệ thống');
            drawInfoLine('Thời gian ghi sổ: ', ticket.date || new Date().toLocaleString('vi-VN'));
            if (ticket.note) drawInfoLine('Ghi chú: ', ticket.note);

            // Đường kẻ phân cách
            y += 5;
            ctx.font = '12px monospace';
            ctx.fillText('----------------------------------------------------', 10, y);
            y += 18;

            // Tiêu đề bảng hàng hóa
            ctx.font = 'bold 12px Arial, sans-serif';
            ctx.fillText('Tên hàng hóa', 15, y);
            ctx.textAlign = 'right';
            ctx.fillText('Đ. giá', 300, y);
            ctx.fillText('SL', 365, y);
            y += 14;

            ctx.textAlign = 'left';
            ctx.font = '12px monospace';
            ctx.fillText('----------------------------------------------------', 10, y);
            y += 18;

            // In từng dòng sản phẩm
            itemsList.forEach(item => {
                ctx.font = 'bold 12px Arial, sans-serif';
                const words = (item.name || item.sku || 'Sản phẩm').split(' ');
                let line = '';
                for (let w = 0; w < words.length; w++) {
                    if (ctx.measureText(line + words[w] + ' ').width > 220) {
                        ctx.fillText(line.trim(), 15, y);
                        y += 18;
                        line = words[w] + ' ';
                    } else {
                        line += words[w] + ' ';
                    }
                }
                if (line.trim()) {
                    ctx.fillText(line.trim(), 15, y);
                }

                // Giá & SL
                ctx.font = '12px Arial, sans-serif';
                ctx.textAlign = 'right';
                const priceNum = Number(item.price || 0);
                const priceText = priceNum > 0 ? priceNum.toLocaleString('vi-VN') : '---';
                ctx.fillText(priceText, 300, y);
                ctx.fillText(`${item.qty} ${item.unit || ''}`.trim(), 365, y);

                ctx.textAlign = 'left';
                y += 22;
            });

            // Đường kẻ phân cách
            ctx.font = '12px monospace';
            ctx.fillText('----------------------------------------------------', 10, y);
            y += 22;

            // Khung tổng tiền
            const drawTotalRow = (label, valStr, isBold = false) => {
                ctx.font = isBold ? 'bold 13px Arial, sans-serif' : '12px Arial, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(label, 15, y);
                ctx.textAlign = 'right';
                ctx.fillText(valStr, 365, y);
                y += 22;
            };

            const baseAmount = itemsList.reduce((sum, i) => sum + (Number(i.price || 0) * Number(i.qty || 1)), 0);
            const totalAmount = Number(ticket.totalAmount || baseAmount);
            const otherFees = Number(ticket.otherFees || 0) || Math.max(0, totalAmount - baseAmount);
            const paidAmount = Number(ticket.paidAmount || 0);
            const debtAmount = Number(ticket.debtAmount || (isImport && paidAmount > 0 ? Math.max(0, totalAmount - paidAmount) : 0));

            drawTotalRow('Tổng tiền hàng:', baseAmount.toLocaleString('vi-VN') + ' đ', true);
            if (otherFees > 0) {
                drawTotalRow('Cước VC / Chi phí khác:', '+' + otherFees.toLocaleString('vi-VN') + ' đ');
            }
            drawTotalRow('Tổng thanh toán:', totalAmount.toLocaleString('vi-VN') + ' đ', true);
            if (paidAmount > 0) {
                drawTotalRow('Đã thanh toán:', paidAmount.toLocaleString('vi-VN') + ' đ');
            }
            if (debtAmount > 0) {
                drawTotalRow('Còn nợ NCC:', debtAmount.toLocaleString('vi-VN') + ' đ');
            }

            // Đường kẻ kéo cắt ở cuối
            y += 5;
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('✂--------------------------------------------------', 10, y);

            const dataUrl = canvas.toDataURL('image/png');
            setReceiptImageUrl(dataUrl);
        } catch (err) {
            console.error("Lỗi tạo ảnh phiếu kho:", err);
        } finally {
            setIsGeneratingImg(false);
        }
    }, [ticket, ticketId, ticketTitle, ticketType, isImport]);

    React.useEffect(() => {
        generateReceiptCanvas();
    }, [generateReceiptCanvas]);

    const handlePrintThermal = (format = 'K58') => {
        if (!receiptImageUrl) return;
        try {
            const isK58 = format === 'K58';
            const paperWidth = isK58 ? '58mm' : '80mm';
            const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <title>${ticketTitle} - ${ticketId}</title>
                    <style>
                        @page {
                            size: ${paperWidth} auto;
                            margin: 0;
                        }
                        * {
                            box-sizing: border-box;
                            margin: 0;
                            padding: 0;
                            -webkit-print-color-adjust: exact !important;
                            print-color-adjust: exact !important;
                        }
                        body {
                            margin: 0;
                            padding: ${isK58 ? '1mm 1mm' : '2mm 2mm'};
                            background: #fff;
                            display: flex;
                            justify-content: center;
                            align-items: flex-start;
                        }
                        img {
                            width: 100%;
                            max-width: ${paperWidth};
                            height: auto;
                            display: block;
                            margin: 0 auto;
                        }
                    </style>
                </head>
                <body>
                    <img src="${receiptImageUrl}" onload="window.focus(); window.print();" />
                </body>
                </html>
            `;

            // Thử mở qua iframe để không bị chặn popup
            const iframe = document.createElement('iframe');
            iframe.style.position = 'fixed';
            iframe.style.right = '0';
            iframe.style.bottom = '0';
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = '0';
            document.body.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(printContent);
            doc.close();

            setTimeout(() => {
                try {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                } catch (e) {
                    console.warn("Iframe print fallback:", e);
                }
                setTimeout(() => {
                    try { document.body.removeChild(iframe); } catch (e) {}
                }, 2500);
            }, 300);

            if (typeof triggerToast === 'function') {
                triggerToast(`Đang mở lệnh in ${format} cho máy in nhiệt...`, 'fa-print', 'info');
            }
        } catch (e) {
            console.error("Lỗi in nhiệt:", e);
            alert("Lỗi in phiếu: " + e.message);
        }
    };

    const handleDownloadImage = () => {
        if (!receiptImageUrl) return;
        const a = document.createElement('a');
        a.href = receiptImageUrl;
        a.download = `PhieuKho_${ticketId}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        if (typeof triggerToast === 'function') triggerToast('Đã tải ảnh phiếu kho về máy thành công!', 'fa-download', 'success');
    };

    const handleCopyImage = () => {
        if (!receiptImageUrl) return;
        fetch(receiptImageUrl)
            .then(res => res.blob())
            .then(blob => {
                if (navigator.clipboard && window.ClipboardItem) {
                    return navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                } else {
                    throw new Error('Chuyển sang tải ảnh');
                }
            })
            .then(() => {
                if (typeof triggerToast === 'function') triggerToast('Đã sao chép ảnh phiếu! Nhấn Ctrl+V để dán gửi Zalo/FB.', 'fa-copy', 'success');
            })
            .catch(() => {
                handleDownloadImage();
            });
    };

    const handleCopySummary = () => {
        const itemsList = Array.isArray(ticket.items) ? ticket.items : (typeof ticket.itemsData === 'string' ? safeJSONParse(ticket.itemsData) : []);
        const baseAmount = itemsList.reduce((sum, i) => sum + (Number(i.price || 0) * Number(i.qty || 1)), 0);
        const totalAmount = Number(ticket.totalAmount || baseAmount);
        const otherFees = Number(ticket.otherFees || 0) || Math.max(0, totalAmount - baseAmount);

        let text = `📄 ${ticketTitle} - RF AQUARIUM\n`;
        text += `------------------------------------\n`;
        text += `Số Phiếu: ${ticketId}\n`;
        text += `Thời gian: ${ticket.date || new Date().toLocaleString('vi-VN')}\n`;
        text += `${isImport ? 'Nhà cung cấp' : 'Người nhận'}: ${ticket.target || 'Nội bộ'}\n`;
        if (ticket.creator) text += `Người lập: ${ticket.creator}\n`;
        text += `------------------------------------\n`;
        text += `DANH SÁCH MẶT HÀNG:\n`;
        itemsList.forEach((it, idx) => {
            text += `${idx + 1}. ${it.name} (x${it.qty} ${it.unit || 'Cái'}) - ĐG: ${Number(it.price || 0).toLocaleString('vi-VN')}đ\n`;
        });
        text += `------------------------------------\n`;
        text += `Tổng tiền hàng: ${baseAmount.toLocaleString('vi-VN')} VNĐ\n`;
        if (otherFees > 0) {
            text += `Cước VC / Chi phí khác: +${otherFees.toLocaleString('vi-VN')} VNĐ\n`;
        }
        text += `TỔNG THANH TOÁN: ${totalAmount.toLocaleString('vi-VN')} VNĐ\n`;
        if (ticket.note) text += `Ghi chú: ${ticket.note}\n`;

        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                if (typeof triggerToast === 'function') triggerToast('Đã sao chép nội dung tóm tắt phiếu!', 'fa-file-alt', 'success');
            });
        }
    };

    return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[9999] p-2 sm:p-4 animate-fade-in" onClick={onClose}>
            <div className="bg-[#141417] border border-zinc-700/80 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[92vh] animate-scale-up" onClick={e => e.stopPropagation()}>
                
                {/* Header với các nút thao tác nhanh */}
                <div className="p-3.5 bg-[#1c1c22] border-b border-zinc-800 flex items-center justify-between gap-2 shrink-0">
                    <div className="flex items-center gap-2 min-w-0">
                        <div className="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
                            <i className="fas fa-file-invoice"></i>
                        </div>
                        <div className="truncate">
                            <h3 className="text-xs font-black text-white uppercase tracking-wider truncate">{ticketTitle}</h3>
                            <span className="text-[10px] font-mono text-zinc-400 font-bold">{ticketId}</span>
                        </div>
                    </div>

                    <div className="flex items-center gap-1.5 shrink-0 flex-wrap justify-end">
                        {/* NÚT IN NHIỆT K58 CHUYÊN DỤNG */}
                        <button 
                            type="button"
                            onClick={() => handlePrintThermal('K58')} 
                            className="px-2.5 py-1.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black rounded-lg text-[10.5px] font-black uppercase flex items-center gap-1.5 shadow-md shadow-amber-950/40 transition-all active:scale-95 cursor-pointer"
                            title="In trực tiếp ra máy in nhiệt khổ K58 (58mm)"
                        >
                            <i className="fas fa-print"></i>
                            <span>In K58</span>
                        </button>

                        {/* NÚT IN NHIỆT K80 */}
                        <button 
                            type="button"
                            onClick={() => handlePrintThermal('K80')} 
                            className="px-2 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 rounded-lg text-[10px] font-bold uppercase hidden sm:flex items-center gap-1 transition-all active:scale-95 cursor-pointer"
                            title="In máy in nhiệt khổ K80 (80mm)"
                        >
                            <i className="fas fa-print text-zinc-400"></i>
                            <span>K80</span>
                        </button>

                        <button onClick={handleCopyImage} className="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-[10px] font-black uppercase flex items-center gap-1 shadow-sm transition-all active:scale-95 cursor-pointer">
                            <i className="fas fa-copy"></i>
                            <span className="hidden sm:inline">Sao Chép</span>
                        </button>
                        <button onClick={handleDownloadImage} className="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[10px] font-black uppercase flex items-center gap-1 shadow-sm transition-all active:scale-95 cursor-pointer">
                            <i className="fas fa-download"></i>
                            <span className="hidden sm:inline">Tải PNG</span>
                        </button>
                        <button onClick={onClose} className="w-7 h-7 rounded-lg bg-zinc-800 hover:bg-rose-600 text-zinc-400 hover:text-white flex items-center justify-center transition-colors text-xs cursor-pointer">&times;</button>
                    </div>
                </div>

                {/* Body Preview Hoá Đơn Nhiệt */}
                <div className="flex-1 overflow-y-auto p-4 flex flex-col items-center bg-[#09090b] custom-scrollbar">
                    <div className="text-[11px] font-black text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full mb-3 flex items-center gap-1.5 shadow-sm">
                        <i className="fas fa-check-circle text-xs"></i>
                        Ảnh Phiếu Kho Đã Sẵn Sàng Để In K58 / Gửi Đối Tác
                    </div>

                    <div className="bg-white rounded-2xl shadow-2xl p-2 max-w-[380px] w-full flex justify-center border-4 border-zinc-300">
                        {receiptImageUrl ? (
                            <img src={receiptImageUrl} alt="Phiếu Kho" className="w-full h-auto object-contain rounded-xl" />
                        ) : (
                            <div className="py-20 text-center text-zinc-500 flex flex-col items-center gap-2">
                                <i className="fas fa-spinner fa-spin text-2xl text-emerald-500"></i>
                                <span className="text-xs font-bold">Đang khởi tạo ảnh phiếu kho...</span>
                            </div>
                        )}
                    </div>

                    <p className="text-[10px] text-zinc-400 text-center mt-3 italic">
                        💡 Bạn có thể bấm <b className="text-amber-300">In K58 / K80</b> để in trực tiếp qua máy in nhiệt, hoặc <b className="text-zinc-200">Sao Chép Ảnh</b> (Ctrl+V gửi Zalo) / <b className="text-zinc-200">Tải Ảnh PNG</b>.
                    </p>
                </div>

                {/* Footer */}
                <div className="p-3 bg-[#18181c] border-t border-zinc-800 flex flex-wrap items-center justify-between gap-2 shrink-0">
                    <button onClick={handleCopySummary} className="text-[10.5px] font-black text-amber-400 hover:text-amber-300 flex items-center gap-1.5 transition-colors cursor-pointer">
                        <i className="fas fa-file-alt"></i> Sao Chép Tóm Tắt
                    </button>
                    <div className="flex items-center gap-2">
                        <button 
                            type="button"
                            onClick={() => handlePrintThermal('K58')}
                            className="px-3 py-1.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-black text-xs rounded-xl shadow-md shadow-amber-950/40 flex items-center gap-1.5 transition-all cursor-pointer active:scale-95"
                        >
                            <i className="fas fa-print"></i> In K58 (58mm)
                        </button>
                        <button 
                            type="button"
                            onClick={() => handlePrintThermal('K80')}
                            className="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 font-bold text-xs rounded-xl flex items-center gap-1.5 transition-all cursor-pointer active:scale-95"
                        >
                            <i className="fas fa-print text-zinc-400"></i> In K80
                        </button>
                        <button onClick={onClose} className="px-3.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white rounded-xl text-xs font-bold transition-colors cursor-pointer">
                            Đóng
                        </button>
                    </div>
                </div>
            </div>
        </div>
    );
}

// -------------------------------------------------------------------------
// 2. TAB LỊCH SỬ XUẤT NHẬP TỔNG HỢP & NÚT KIỂM KHO (ImportExportTab)
// -------------------------------------------------------------------------
const ImportExportTab = React.memo(function ImportExportTab({ data, pushData, isAdmin: propIsAdmin, isBoss: propIsBoss, userRole: propUserRole, currentUser: propCurrentUser, hasPerm: propHasPerm, mode, userConfigs, triggerToast }) {
    // 1. Modals & Forms State
    const [selectedProduct, setSelectedProduct] = React.useState(null);
    const [showForm, setShowForm] = React.useState(false);
    const [printTicketData, setPrintTicketData] = React.useState(null);
    const [prefilledProduct, setPrefilledProduct] = React.useState(null);
    const [editingLog, setEditingLog] = React.useState(null);
    const [editingItems, setEditingItems] = React.useState([]);

    React.useEffect(() => {
        const handleTrigger = (e) => {
            const product = e ? e.detail : {};
            setPrefilledProduct(product || null);
            setShowForm(true);
        };
        if (window.pendingAction === 'createImportTicket') {
            window.pendingAction = null;
            handleTrigger(null);
        }
        window.addEventListener('triggerCreateImportTicket', handleTrigger);
        return () => window.removeEventListener('triggerCreateImportTicket', handleTrigger);
    }, []);

    // 2. New UI State
    const [filterType, setFilterType] = React.useState('TẤT CẢ');
    const [logActionFilter, setLogActionFilter] = React.useState('ALL'); // 'ALL' | 'NHAP' | 'XUAT' | 'DAT_HANG' | 'KIEM_KHO'
    const [filterMonth, setFilterMonth] = React.useState(new Date().toISOString().slice(0, 7));
    const [searchTerm, setSearchTerm] = React.useState('');
    const deferredSearchTerm = React.useDeferredValue ? React.useDeferredValue(searchTerm) : searchTerm;
    const [expandedIds, setExpandedIds] = React.useState({});

    const currentRole = propUserRole || localStorage.getItem('rf_role') || '';
    const currentUser = propCurrentUser || localStorage.getItem('rf_user') || '';
    const isBossRole = localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO' || currentUser.includes('Tiến');
    const isBoss = propIsBoss !== undefined ? propIsBoss : isBossRole;
    const isAdmin = propIsAdmin !== undefined ? propIsAdmin : (localStorage.getItem('rf_admin') === 'true' || isBoss);

    const hasPerm = React.useCallback((actionCode) => {
        if (isBoss || currentRole === 'TỐI CAO') return true;
        if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
        if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
        return isAdmin;
    }, [propHasPerm, currentRole, currentUser, isAdmin, isBoss]);

    const canCreateImport = hasPerm('IE_CREATE_IMPORT'); // Tiến, Dương, Trang
    const canCreateExport = hasPerm('IE_CREATE_EXPORT'); // Tiến, Dương, Trang
    const canCreatePO = hasPerm('IE_CREATE_PO'); // Tất cả nhân sự nội bộ
    const canApprovePO = hasPerm('IE_APPROVE_PO'); // Tiến, Dương, Trang
    const canEditLog = hasPerm('IE_EDIT_LOG'); // Tiến, Dương, Trang
    const canDelete = hasPerm('IE_DELETE_LOG'); // Chỉ Tiến
    const isKiemToan = isBoss || currentRole === 'KẾ TOÁN' || currentRole === 'KIỂM TOÁN';

    const handleRepairBOM = async () => {
        if (!window.confirm('Bạn có chắc chắn muốn TỰ ĐỘNG CHUẨN HOÁ & SỬA LẠI toàn bộ các phiếu xuất BOM (gán đúng đối tượng Sản Xuất Bể Kính / Sản Xuất Layout và tính lại nguyên liệu BOM cho Layout) không?')) return;
        try {
            if (typeof triggerToast === 'function') triggerToast('Đang quét và chuẩn hoá toàn bộ phiếu BOM...', 'fa-spinner fa-spin', 'info');
            const res = await runGAS('repairAllBomTickets');
            if (res && res.success) {
                if (typeof triggerToast === 'function') triggerToast(res.message || 'Đã chuẩn hoá thành công các phiếu BOM!', 'fa-check', 'success');
                else alert(res.message || 'Đã chuẩn hoá thành công các phiếu BOM!');
                if (typeof window.triggerDataRefresh === 'function') window.triggerDataRefresh();
            } else {
                alert('Lỗi: ' + (res?.message || 'Không thể sửa phiếu BOM'));
            }
        } catch (e) {
            alert('Lỗi: ' + e.message);
        }
    };

    const handleSyncBomSku = async () => {
        if (!window.confirm('Xác nhận ĐỒNG BỘ CHÍNH XÁC 100% mã SKU Nguyên Liệu từ bảng Products sang bảng định mức BOM_Config?')) return;
        try {
            if (typeof triggerToast === 'function') triggerToast('Đang đồng bộ mã SKU Nguyên Liệu sang BOM_Config...', 'fa-spinner fa-spin', 'info');
            const res = await runGAS('syncBomMaterialSkus');
            if (res && res.success) {
                if (typeof triggerToast === 'function') triggerToast(res.message || 'Đã đồng bộ SKU BOM thành công!', 'fa-check', 'success');
                else alert(res.message || 'Đã đồng bộ SKU BOM thành công!');
                if (typeof window.triggerDataRefresh === 'function') window.triggerDataRefresh();
            } else {
                alert('Lỗi: ' + (res?.message || 'Không thể đồng bộ SKU'));
            }
        } catch (e) {
            alert('Lỗi: ' + e.message);
        }
    };

    const toggleExpand = (id) => {
        setExpandedIds(prev => ({ ...prev, [id]: !prev[id] }));
    };

    // 3. Filter Logs theo Kho & Tháng (để tính chỉ số thống kê trước)
    const logs = data?.ImportExport || [];
    const categoryAndMonthFilteredLogs = React.useMemo(() => {
        return logs.filter(log => {
            if (log.type === 'THONG_BAO_HE_THONG' || (log.id && String(log.id).startsWith('SYS_ANNO_'))) return false;

            if (mode === 'KIEM_KHO') {
                if (!(log.id && String(log.id).includes('IE_GCHK'))) return false;
            } else if (mode === 'NHAT_KY') {
                if (log.id && String(log.id).includes('IE_GCHK')) return false;
            }

            if (filterMonth) {
                const logDate = log.date || log.createdAt || '';
                if (!String(logDate).startsWith(filterMonth)) return false;
            }

            if (filterType !== 'TẤT CẢ') {
                const parsedItems = safeJSONParse(log.itemsData) || [];
                let logCategories = [];
                parsedItems.forEach(it => {
                    const itNameLower = String(it.name || it.sku || '').toLowerCase();
                    const p = (data?.Products || []).find(x => x.name === it.name || (it.sku && x.sku === it.sku) || String(x.name || '').toLowerCase() === itNameLower);
                    if (p && p.category) logCategories.push(String(p.category || '').toUpperCase().trim());
                    if (p && p.sub_category) logCategories.push(String(p.sub_category || '').toUpperCase().trim());
                });

                const targetUpper = String(log.target || '').toUpperCase();
                const noteUpper = String(log.note || '').toUpperCase();

                if (filterType === 'KHO BỂ KÍNH') {
                    const isTankLog = targetUpper.includes('BỂ KÍNH') || targetUpper.includes('BE KINH') || noteUpper.includes('BỂ KÍNH') ||
                        logCategories.some(c => c === 'BỂ KÍNH' || c === 'BE KINH' || c.includes('BỂ KÍNH'));
                    if (!isTankLog) return false;
                } else if (filterType === 'KHO LAYOUT') {
                    const isLayoutLog = targetUpper.includes('LAYOUT') || noteUpper.includes('LAYOUT') ||
                        logCategories.some(c => c === 'LAYOUT' || c === 'THÀNH PHẨM');
                    if (!isLayoutLog) return false;
                } else if (filterType === 'KHO HÀNG HOÁ') {
                    const isAccessoryLog = targetUpper.includes('PHỤ KIỆN') || targetUpper.includes('HÀNG HOÁ') || targetUpper.includes('BÁN LẺ') ||
                        logCategories.some(c => c === 'PHỤ KIỆN' || c === 'HÀNG HOÁ' || c === 'PHỤ KIỆN BÁN LẺ');
                    if (!isAccessoryLog) return false;
                } else if (filterType === 'KHO NGUYÊN LIỆU') {
                    const isMaterialLog = targetUpper.includes('VẬT TƯ') || targetUpper.includes('NGUYÊN LIỆU') ||
                        logCategories.some(c => c === 'VẬT TƯ SẢN XUẤT' || c === 'DANH MỤC SẢN XUẤT' || c === 'NGUYÊN LIỆU' || c === 'VẬT TƯ' || c.includes('NGUYÊN LIỆU'));
                    if (!isMaterialLog) return false;
                }
            }

            if (deferredSearchTerm) {
                const term = deferredSearchTerm.toLowerCase();
                const id = String(log.id || '').toLowerCase();
                const target = String(log.target || '').toLowerCase();
                const note = String(log.note || '').toLowerCase();
                const items = String(log.itemsData || '').toLowerCase();
                const user = String(log.user || '').toLowerCase();
                const matchId = id.includes(term);
                const matchTarget = target.includes(term);
                const matchNote = note.includes(term);
                const matchItems = items.includes(term);
                const matchUser = user.includes(term);
                if (!matchId && !matchTarget && !matchNote && !matchItems && !matchUser) return false;
            }
            return true;
        });
    }, [logs, filterType, filterMonth, deferredSearchTerm, mode, data?.Products]);

    // Tính toán số liệu thống kê chi tiết cho kho đang chọn
    const stats = React.useMemo(() => {
        let importAmt = 0;
        let importCount = 0;
        let exportAmt = 0;
        let exportCount = 0;
        let poCount = 0;
        let auditCount = 0;

        categoryAndMonthFilteredLogs.forEach(l => {
            const lType = String(l.type || '').trim().toUpperCase();
            const amt = Number(l.totalAmount) || 0;
            if (lType === 'NHẬP' || lType === 'CÂN TĂNG') {
                importAmt += amt;
                importCount++;
            } else if (lType === 'XUẤT' || lType === 'CÂN GIẢM' || lType === 'THANH LÝ') {
                exportAmt += amt;
                exportCount++;
            } else if (lType === 'ĐẶT HÀNG' || lType === 'ORDERED') {
                poCount++;
            } else {
                auditCount++;
            }
        });

        return {
            importAmt: Math.round(importAmt),
            importCount,
            exportAmt: Math.round(exportAmt),
            exportCount,
            poCount,
            auditCount,
            totalCount: categoryAndMonthFilteredLogs.length,
            netDiff: Math.round(importAmt - exportAmt)
        };
    }, [categoryAndMonthFilteredLogs]);

    // Danh sách sau khi áp dụng lọc theo Loại thao tác (Tất cả / Nhập / Xuất / Đặt hàng / Kiểm kho)
    const filteredLogs = React.useMemo(() => {
        let list = categoryAndMonthFilteredLogs.filter(log => {
            if (logActionFilter === 'ALL') return true;
            const lType = String(log.type || '').trim().toUpperCase();
            if (logActionFilter === 'NHAP') return lType === 'NHẬP' || lType === 'CÂN TĂNG';
            if (logActionFilter === 'XUAT') return lType === 'XUẤT' || lType === 'CÂN GIẢM';
            if (logActionFilter === 'DAT_HANG') return lType === 'ĐẶT HÀNG' || lType === 'ORDERED';
            if (logActionFilter === 'THANH_LY') return lType === 'THANH LÝ';
            if (logActionFilter === 'KIEM_KHO') return lType === 'KIỂM KHO' || lType === 'KIEM_KHO' || lType.includes('CÂN');
            return true;
        });
        return list.sort((a,b) => new Date(b.date || b.createdAt || 0) - new Date(a.date || a.createdAt || 0));
    }, [categoryAndMonthFilteredLogs, logActionFilter]);

    const totalValue = React.useMemo(() => {
        return filteredLogs.reduce((sum, l) => sum + (Number(l.totalAmount) || 0), 0);
    }, [filteredLogs]);

    const dateGroups = React.useMemo(() => {
        const groups = {};
        filteredLogs.forEach(log => {
            const rawDate = String(log.date || log.createdAt || '').slice(0, 10) || 'Chưa rõ ngày';
            if (!groups[rawDate]) groups[rawDate] = [];
            groups[rawDate].push(log);
        });
        return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
    }, [filteredLogs]);

    const handlePrintConsolidatedDay = (dateKey, dayLogs) => {
        let mergedItemsMap = {};
        let totalAmt = 0;
        const isAudit = mode === 'KIEM_KHO' || dayLogs.every(l => String(l.id).includes('GCHK') || String(l.target).toLowerCase().includes('kiểm kho') || String(l.target).toLowerCase().includes('cân'));

        dayLogs.forEach(log => {
            let rawItems = safeJSONParse(log.itemsData) || [];
            rawItems.forEach(it => {
                const itSku = String(it.sku || it.name || '').trim();
                const itName = String(it.name || it.sku || 'Sản phẩm').trim();
                const key = (itSku && itSku !== 'N/A') ? itSku : itName;
                const qty = Number(it.qty) || 1;
                const price = Number(it.price !== undefined ? it.price : it.costPrice) || 0;
                const lineAmt = Number(it.amount) || (qty * price);

                if (!mergedItemsMap[key]) {
                    mergedItemsMap[key] = {
                        sku: itSku,
                        name: itName,
                        qty: 0,
                        unit: it.unit || 'Cái',
                        price: price,
                        amount: 0
                    };
                }
                mergedItemsMap[key].qty += qty;
                mergedItemsMap[key].amount += lineAmt;
                if (price > 0 && (!mergedItemsMap[key].price || mergedItemsMap[key].price === 0)) {
                    mergedItemsMap[key].price = price;
                }
            });
            totalAmt += Number(log.totalAmount || 0);
        });

        const consolidatedItems = Object.values(mergedItemsMap);
        const dayFormatted = dateKey.includes('-') ? dateKey.split('-').reverse().join('/') : dateKey;

        const consolidatedTicket = {
            id: `IE_SUM_${dateKey.replace(/[^0-9]/g, '')}`,
            type: isAudit ? 'Kiểm Kho' : 'Tổng Hợp',
            target: isAudit ? `Kiểm kê kho ngày ${dayFormatted}` : `Tổng hợp xuất nhập ngày ${dayFormatted}`,

            note: `Gộp từ ${dayLogs.length} phiếu (${dayLogs.map(l => l.id).slice(0, 3).join(', ')}${dayLogs.length > 3 ? '...' : ''})`,
            items: consolidatedItems,
            totalAmount: totalAmt > 0 ? totalAmt : consolidatedItems.reduce((s, i) => s + (i.amount || 0), 0),
            isConsolidated: true,
            isAudit: isAudit,
            consolidatedTitle: isAudit ? `PHIẾU KIỂM KHO TỔNG HỢP` : `PHIẾU XUẤT NHẬP KHO TỔNG HỢP`
        };

        setPrintTicketData(consolidatedTicket);
    };

    const handleDelete = async (log) => {
        if (!canDelete) {
            if (triggerToast) triggerToast('Bạn không có quyền xóa chứng từ này!', 'fa-lock', 'danger');
            else alert('Bạn không có quyền xóa chứng từ này!');
            return;
        }
        if (!window.confirm(`Bạn có chắc muốn XOÁ VĨNH VIỄN phiếu ${log.id} này không?`)) return;
        
        const payload = { deletes: { ImportExport: [log.id] }, Products: [] };
        
        let parsed = safeJSONParse(log.itemsData) || [];
        parsed.forEach(item => {
            const p = (data?.Products||[]).find(x => x.name === item.name);
            if (p) {
                const diffVal = log.type === 'Nhập' ? -item.qty : item.qty; 
                payload.Products.push({...p, quantity: Number(p.quantity) + diffVal, _diff: diffVal});
            }
        });
        
        const hasPayment = Number(log.totalAmount || 0) > 0;
        if (hasPayment) {
            const relatedTx = (data?.Transactions || []).find(tx => String(tx.note).includes(log.id) || (String(tx.title).includes('Thanh toán') && String(tx.title).includes(log.target) && String(tx.date).slice(0,10) === String(log.date).slice(0,10)));
            if (relatedTx) {
                if (window.confirm(`Phiếu này có khoản thanh toán liên đới trên sổ quỹ (${relatedTx.id}). Bạn có muốn XOÁ LUÔN phiếu Thu/Chi này không?`)) {
                    payload.deletes.Transactions = [relatedTx.id];
                }
            } else {
                if (window.confirm('Hệ thống phát hiện phiếu này có giá trị tiền. Bạn có muốn tự tìm và xoá phiếu Thu/Chi liên quan (nếu có) không? \n(Chọn OK để đồng ý tự tìm thủ công)')) {}
            }
        }
        
        try {
            await pushData(payload);
            if (triggerToast) triggerToast('Đã xóa chứng từ!', 'fa-check', 'success');
        } catch (e) {
            alert('Lỗi khi xoá: ' + e.message);
        }
    };

        const payload = { ImportExport: [], Products: [] };

        payload.ImportExport.push({...log, type: 'Nhập'});
        
        let parsed = safeJSONParse(log.itemsData) || [];

        const win = window.open('', '_blank');

                                className={`px-3.5 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition-all whitespace-nowrap flex items-center gap-1.5 cursor-pointer active:scale-95 border ${
