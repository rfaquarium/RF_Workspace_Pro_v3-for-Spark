                            { id: 'ALL', label: `Tất Cả (${categoryAndMonthFilteredLogs.length})`, icon: 'fa-list' },
                            { id: 'NHAP', label: `Nhập Kho (${stats.importCount})`, icon: 'fa-arrow-down', activeClass: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/50 font-black' },
                            { id: 'XUAT', label: `Xuất Kho (${stats.exportCount})`, icon: 'fa-arrow-up', activeClass: 'bg-rose-500/20 text-rose-300 border-rose-400/50 font-black' },
                            { id: 'DAT_HANG', label: `Đặt Hàng (${stats.poCount})`, icon: 'fa-file-invoice', activeClass: 'bg-purple-500/20 text-purple-300 border-purple-400/50 font-black' },
                            { id: 'KIEM_KHO', label: `Kiểm Kho / Khác (${stats.auditCount})`, icon: 'fa-clipboard-check', activeClass: 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50 font-black' }
                        ].map(sub => {
                            const isSel = logActionFilter === sub.id;
                            return (
                                <button
                                    key={sub.id}
                                    type="button"
                                    onClick={() => setLogActionFilter(sub.id)}
                                    className={`px-3 py-1 rounded-xl text-[10.5px] font-bold uppercase transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 border whitespace-nowrap ${
                                        isSel
                                            ? (sub.activeClass || 'bg-white/[0.2] text-white border-white/40 shadow-sm font-black')
                                            : 'bg-[#18181e] text-zinc-400 border-white/[0.06] hover:text-zinc-200'
                                    }`}
                                >
                                    <i className={`fas ${sub.icon} text-[9.5px]`}></i>
                                    <span>{sub.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </div>
                )}

                <div className="flex gap-2 items-center">
                    <div className="relative flex-1 bg-[#09090b] border border-white/[0.08] rounded-xl flex items-center px-3 py-1 focus-within:border-[#d4af37]/60 focus-within:ring-1 focus-within:ring-[#d4af37]/25 transition-all">
                        <i className="fas fa-search text-zinc-500 text-xs mr-2.5 shrink-0"></i>
                        <input 
                            type="text" 
                            value={searchTerm} 
                            onChange={(e) => setSearchTerm(e.target.value)} 
                            placeholder="Tìm theo mã phiếu, đối tượng, ghi chú, tên SP..." 
                            className="w-full bg-transparent text-xs font-semibold text-white placeholder-zinc-500 outline-none min-w-0"
                        />
                        {searchTerm && (
                            <button onClick={() => setSearchTerm('')} className="text-zinc-500 hover:text-zinc-300 p-0.5 shrink-0 transition-colors cursor-pointer">
                                <i className="fas fa-times-circle text-xs"></i>
                            </button>
                        )}
                    </div>
                    <div className="relative w-[130px] sm:w-40 shrink-0">
                        <input 
                            type="month" 
                            value={filterMonth}
                            onChange={(e) => setFilterMonth(e.target.value)}
                            className="w-full bg-[#09090b] border border-white/[0.08] rounded-xl px-2.5 sm:px-3 py-2 text-xs font-bold text-white outline-none focus:border-[#d4af37] transition-colors"
                        />
                    </div>
                </div>
            </div>

            <div className="space-y-4">
                {filteredLogs.length === 0 ? (
                    <div className="text-center py-16 bg-[#141414] border border-[#2a2a2a] rounded-2xl text-gray-500 font-bold">
                        <i className="fas fa-box-open text-4xl mb-3 opacity-30 block"></i>
                        Không tìm thấy chứng từ kho nào phù hợp.
                    </div>
                ) : (
                    dateGroups.map(([dateKey, dayLogs]) => {
                        const dayFormatted = dateKey.includes('-') ? dateKey.split('-').reverse().join('/') : dateKey;
                        const dayTotal = dayLogs.reduce((sum, l) => sum + (Number(l.totalAmount) || 0), 0);

                        return (
                            <div key={dateKey} className="space-y-2.5">
                                {/* Thanh Header gom nhóm theo Ngày kèm nút In Gộp Ngày */}
                                <div className="flex flex-wrap items-center justify-between gap-2 bg-[#161619] border border-white/[0.08] px-3.5 py-2.5 rounded-2xl shadow-sm">
                                    <div className="flex items-center gap-2 min-w-0">
                                        <div className="w-7 h-7 rounded-lg bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400 shrink-0">
                                            <i className="fas fa-calendar-alt text-xs"></i>
                                        </div>
                                        <span className="font-black text-xs text-white">Ngày {dayFormatted}</span>
                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/[0.06] text-zinc-400">
                                            {dayLogs.length} chứng từ
                                        </span>
                                        <span className="text-[11px] font-black text-sky-400 font-mono hidden sm:inline">
                                            {Math.round(dayTotal).toLocaleString('vi-VN')}đ
                                        </span>
                                    </div>

                                    {dayLogs.length > 1 && (
                                        <button 
                                            onClick={() => handlePrintConsolidatedDay(dateKey, dayLogs)}
                                            className="h-8 px-3 rounded-xl bg-gradient-to-r from-sky-600/30 to-blue-600/30 hover:from-sky-600/40 hover:to-blue-600/40 text-sky-300 border border-sky-500/40 text-[10.5px] font-black uppercase tracking-wider flex items-center gap-1.5 active:scale-95 transition-all shadow-sm cursor-pointer"
                                            title={`Gộp ${dayLogs.length} phiếu của ngày ${dayFormatted} thành 1 phiếu in tổng hợp duy nhất`}
                                        >
                                            <i className="fas fa-print text-xs text-sky-400"></i>
                                            <span>In Gộp Ngày ({dayLogs.length} phiếu)</span>
                                        </button>
                                    )}
                                </div>

                                {/* Danh sách từng chứng từ trong ngày */}
                                <div className="space-y-2.5">
                                    {dayLogs.map(log => {
                                        const isExpanded = !!expandedIds[log.id];
                                        const isImport = String(log.type).trim() === 'Nhập';
                                        let rawItems = safeJSONParse(log.itemsData) || [];
                                        const isBomTicket = log.id && String(log.id).startsWith('IE_BOM_');

                                        let calculatedTotal = 0;
                                        const items = rawItems.map(it => {
                                            const qty = Number(it.qty) || 1;
                                            const itSku = String(it.sku || '').trim();
                                            const itName = String(it.name || '').trim();
                                            const itNameLower = itName.toLowerCase();
                                            const itSkuLower = itSku.toLowerCase();

                                            const matchedP = (data?.Products || []).find(x => 
                                                (itSku && String(x.sku || '').toUpperCase() === itSku.toUpperCase()) || 
                                                (itName && String(x.name || '').toLowerCase() === itNameLower) ||
                                                (itSku && String(x.name || '').toLowerCase() === itSkuLower)
                                            );

                                            const itUnitClean = String(it.unit || '').toLowerCase().trim().replace(/[^a-z0-9]/g, '');
                                            const isItChai = itUnitClean === 'chai' || itUnitClean.includes('chai') || itUnitClean.includes('162') || itUnitClean.includes('100');
                                            const isKeo502 = itSkuLower.includes('502') || itNameLower.includes('502') || itNameLower.includes('keo');

                                            const displayUnit = isItChai ? 'Chai' : ((matchedP && matchedP.unit) ? matchedP.unit : (it.unit || 'Cái'));
                                            const uClean = String(displayUnit || '').toLowerCase().trim().replace(/[^a-z0-9]/g, '');
                                            const isGram = uClean === 'gam' || uClean === 'g' || uClean === 'gram';

                                            let rawPrice = 0;
                                            if (it.price !== undefined && Number(it.price) > 0) {
                                                rawPrice = Number(it.price);
                                            } else if (it.costPrice !== undefined && Number(it.costPrice) > 0) {
                                                rawPrice = Number(it.costPrice);
                                            } else if (matchedP && (Number(matchedP.costPrice) > 0 || Number(matchedP.price) > 0)) {
                                                rawPrice = Number(matchedP.costPrice || matchedP.price);
                                            } else if (Number(log.totalAmount) > 0) {
                                                rawPrice = (rawItems.length === 1) ? (Number(log.totalAmount) / qty) : (Number(log.totalAmount) / rawItems.length / qty);
                                            }

                                            let effectivePrice = rawPrice;

                                            // Quy đổi đơn giá phiếu xuất BOM chuẩn xác
                                            if (isBomTicket && isKeo502) {
                                                // 1 chai keo 502: 162g tổng - vỏ 62g = 100g keo thực tế, giá 22.000đ/100g
                                                if (isItChai || displayUnit === 'Chai') {
                                                    effectivePrice = (rawPrice > 1000) ? rawPrice : 22000;
                                                } else if (isGram) {
                                                    effectivePrice = 220; // 22.000đ / 100g = 220đ/gam
                                                }
                                            } else if (isBomTicket && isGram && effectivePrice >= 1000) {
                                                const conv = (matchedP && Number(matchedP.conversionRate) > 1) ? Number(matchedP.conversionRate) : 1000;
                                                effectivePrice = Number((rawPrice / conv).toFixed(2));
                                            }

                                            let lineAmt = Number(it.amount);
                                            // Khắc phục hiển thị cho phiếu BOM cũ bị chia 2 lần khiến giá trị chỉ còn 215đ
                                            if (isBomTicket && isKeo502 && (!lineAmt || lineAmt <= 500)) {
                                                lineAmt = Math.round(qty * effectivePrice);
                                            } else if (isNaN(lineAmt) || lineAmt <= 0) {
                                                lineAmt = Math.round(qty * effectivePrice);
                                            }

                                            calculatedTotal += lineAmt;

                                            return {
                                                ...it,
                                                qty,
                                                itSku: itSku || matchedP?.sku || '',
                                                itName: itName || matchedP?.name || '',
                                                matchedP,
                                                displayUnit: displayUnit,
                                                unit: displayUnit,
                                                effectivePrice,
                                                price: effectivePrice,
                                                effectiveAmount: lineAmt
                                            };
                                        });

                                        const hasCorruptedKeo = isBomTicket && rawItems.some(x => (String(x.sku || '').includes('502') || String(x.name || '').includes('502')) && Number(x.amount || 0) <= 500);
                                        const displayTotalAmount = (isBomTicket && (hasCorruptedKeo || calculatedTotal < Number(log.totalAmount || 0))) 
                                            ? calculatedTotal 
                                            : Number(log.totalAmount || calculatedTotal || 0);

                                        return (
                                            <div key={log.id} className={`bg-[#141414] border rounded-2xl overflow-hidden transition-all shadow-sm ${isExpanded ? 'border-sky-500/50' : 'border-[#2a2a2a]'}`}>
                                                <div className="p-4 flex items-center justify-between gap-3 cursor-pointer hover:bg-[#1a1a1a]/50 transition-colors" onClick={() => toggleExpand(log.id)}>
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 font-black text-xs ${isImport ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}`}>
                                                            <i className={`fas ${isImport ? 'fa-arrow-down' : (log.type === 'Đặt Hàng' ? 'fa-file-invoice' : 'fa-arrow-up')}`}></i>
                                                        </div>
                                                        <div className="min-w-0">
                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                <span className="font-bold text-[13px] text-zinc-100 truncate group-hover:text-white">
                                                                    {log.target || cleanStockLogNote(log.note, log.target) || 'Chứng từ kho'}
                                                                </span>
                                                                <span className={`px-2 py-0.5 rounded-md text-[8.5px] font-black uppercase tracking-wide border ${
                                                                    isImport 
                                                                        ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' 
                                                                        : (log.type === 'Kiểm Kho' || log.type === 'KIEM_KHO' 
                                                                            ? 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30' 
                                                                            : (log.type === 'Đặt Hàng' 
                                                                                ? 'bg-purple-500/15 text-purple-300 border-purple-500/30' 
                                                                                : 'bg-rose-500/15 text-rose-300 border-rose-500/30'))
                                                                }`}>
                                                                    {log.type}
                                                                </span>
                                                            </div>
                                                            <div className="flex items-center gap-2 text-[10.5px] text-zinc-400 truncate mt-1 flex-wrap">
                                                                <span className="font-mono text-[9.5px] text-zinc-400 bg-white/[0.04] px-1.5 py-0.5 rounded border border-white/[0.06]" title="Mã chứng từ">{log.id}</span>
                                                                <span>•</span>
                                                                <span className="text-zinc-400 font-mono">{String(log.date || log.createdAt || '').slice(0, 16).replace('T', ' ')}</span>
                                                                <span>•</span>
                                                                <span className="text-zinc-400"><i className="fas fa-user-edit text-[9px] text-zinc-500 mr-1"></i>{log.user || 'Hệ thống'}</span>
                                                                {log.note && log.note !== log.target && (
                                                                    <>
                                                                        <span>•</span>
                                                                        <span className="text-zinc-300 italic truncate max-w-[260px]">{cleanStockLogNote(log.note, log.target)}</span>
                                                                    </>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-3 shrink-0">
                                                        <div className="text-right hidden sm:block">
                                                            <div className={`font-black text-sm font-mono ${isImport ? 'text-emerald-400' : 'text-rose-400'}`}>{isImport ? '+' : '-'}{Math.round(displayTotalAmount).toLocaleString('vi-VN')}đ</div>
                                                            <div className="text-[10px] text-zinc-500 font-bold">{items.length} mặt hàng</div>
                                                        </div>

                                                        <div className="flex gap-1.5" onClick={e => e.stopPropagation()}>
                                                            <button onClick={() => setPrintTicketData({ ...log, totalAmount: displayTotalAmount, items: items.map(x => ({ ...x, price: x.effectivePrice, amount: x.effectiveAmount })) })} className="w-8 h-8 rounded-lg bg-[#222] hover:bg-emerald-500/20 text-gray-300 hover:text-emerald-400 flex items-center justify-center transition-colors border border-[#333]" title="In phiếu kho / Tạo ảnh gửi Zalo">
                                                                <i className="fas fa-print text-[11px]"></i>
                                                            </button>
                                                            
                                                            {log.type === 'Đặt Hàng' && (isAdmin || isBossRole || currentRole === 'KHO VẬN') && (
                                                            <button onClick={() => handleConfirmReceived(log)} className="w-8 h-8 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 flex items-center justify-center transition-colors border border-emerald-500/20" title="Xác nhận Hàng Đã Về (Cộng Kho)">
                                                                <i className="fas fa-check-circle text-[12px]"></i>
                                                            </button>
                                                            )}
                                                            
                                                            {isAdmin && (
                                                            <button onClick={() => {
                                                                setEditingLog(log);
                                                                setEditingItems(items.map(x => ({ ...x, price: x.effectivePrice, amount: x.effectiveAmount })));
                                                            }} className="w-8 h-8 rounded-lg bg-[#222] hover:bg-sky-500/20 text-gray-300 hover:text-sky-400 flex items-center justify-center transition-colors border border-[#333]" title="Sửa phiếu">
                                                                <i className="fas fa-pencil-alt text-[10px]"></i>
                                                            </button>
                                                            )}

                                                            {canDelete && (
                                                            <button onClick={() => handleDelete(log)} className="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex items-center justify-center transition-colors border border-rose-500/20" title="Xóa chứng từ">
                                                                <i className="fas fa-trash-alt text-[10px]"></i>
                                                            </button>
                                                            )}
                                                        </div>

                                                        <div className={`w-8 h-8 rounded-lg bg-[#1a1a1a] border border-[#333] flex items-center justify-center text-gray-400 transition-transform duration-200 ${isExpanded ? 'rotate-180 bg-sky-500/20 text-sky-400 border-sky-500/30' : ''}`}>
                                                            <i className="fas fa-chevron-down text-[10px]"></i>
                                                        </div>
                                                    </div>
                                                </div>

                                                {isExpanded && (
                                                    <div className="p-4 border-t border-[#222] bg-[#0d0d0d] space-y-3 animate-fade-in">
                                                        {log.note && (
                                                            <div className="bg-[#181818] p-3 rounded-xl border border-[#2a2a2a] text-xs text-gray-300 flex items-start gap-2">
                                                                <i className="fas fa-sticky-note text-sky-400 mt-0.5"></i>
                                                                <div>
                                                                    <span className="font-bold text-gray-400 uppercase text-[9px] block">Ghi chú:</span>
                                                                    <span className="font-medium">{log.note}</span>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {items.length === 0 ? (
                                                            <div className="text-center py-4 text-gray-500 text-xs italic">Không có chi tiết sản phẩm</div>
                                                        ) : (
                                                            <div className="overflow-x-auto rounded-xl border border-[#222]">
                                                                <table className="w-full text-left text-xs">
                                                                    <thead>
                                                                        <tr className="bg-[#141414] text-gray-500 border-b border-[#222]">
                                                                            <th className="py-2.5 px-3 font-black uppercase text-[9px] tracking-wider">Tên Sản Phẩm</th>
                                                                            <th className="py-2.5 px-3 font-black uppercase text-[9px] tracking-wider text-center">Số Lượng</th>
                                                                            <th className="py-2.5 px-3 font-black uppercase text-[9px] tracking-wider text-right">Đơn Giá</th>
                                                                            <th className="py-2.5 px-3 font-black uppercase text-[9px] tracking-wider text-right">Thành Tiền</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody className="divide-y divide-[#222]">
                                                                        {items.map((it, idx) => {
                                                                            const { qty, itSku, itName, matchedP, displayUnit, effectivePrice, effectiveAmount } = it;

                                                                            // Tên hiển thị & Mã SKU chuẩn hóa đồng bộ kho thật
                                                                            let displayName = itName || matchedP?.name || itSku || 'Vật tư';
                                                                            let rawSku = itSku || matchedP?.sku || '';
                                                                            
                                                                            if (displayName === 'NLSX-KINH-5LI' || rawSku === 'NLSX-KINH-5LI' || rawSku === 'NL-BE-KINH5LI') {
                                                                                displayName = 'Kính Siêu Trong 5li';
                                                                                rawSku = 'NL-BE-KINH5LI';
                                                                            } else if (displayName === 'NLSX-KINH-8LI' || rawSku === 'NLSX-KINH-8LI' || rawSku === 'NL-BE-KINH8LI') {
                                                                                displayName = 'Kính Siêu Trong 8li';
                                                                                rawSku = 'NL-BE-KINH8LI';
                                                                            } else if (displayName === 'NLSX-MAI-CNC' || rawSku === 'NLSX-MAI-CNC' || rawSku === 'DICHVU-MAI-CNC' || displayName.includes('Mài CNC')) {
                                                                                displayName = 'Mài CNC Cạnh Vi Tính (Gia công)';
                                                                                rawSku = 'DICHVU-MAI-CNC';
                                                                            } else if (displayName === 'NLSX-KEO-WACKER' || rawSku === 'NLSX-KEO-WACKER' || rawSku === 'NL-BE-KEO-WACKER') {
                                                                                displayName = 'Keo Silicone Wacker Chuyên Dụng';
                                                                                rawSku = 'NL-BE-KEO-WACKER';
                                                                            } else if (displayName === 'NLSX-KEO-502' || displayName === 'NLSX-502-1CHAI' || rawSku === 'NLSX-502-1CHAI' || rawSku === 'NLSX-KEO-502') {
                                                                                displayName = 'Keo 502 Chuyên Dụng';
                                                                                rawSku = 'NL-LAY-KEO-502';
                                                                            } else if (displayName.includes('FOMEX-8') || displayName.includes('FOMEX 8') || rawSku === 'NLSX-FOMEX-8') {
                                                                                displayName = 'Fomex Đế Layout 8li';
                                                                                rawSku = 'NL-LAY-FOMEX-8';
                                                                            } else if (displayName.includes('FOMEX-10') || displayName.includes('FOMEX 10') || rawSku === 'NLSX-FOMEX-10') {
                                                                                displayName = 'Fomex Đế Layout 10li';
                                                                                rawSku = 'NL-LAY-FOMEX-10';
                                                                            } else if (displayName === 'NLSX-REU-A04' || rawSku === 'NLSX-REU-A04') {
                                                                                displayName = 'Rêu Xanh A04 Dán Layout';
                                                                                rawSku = 'NL-LAY-REU-A04';
                                                                            } else if (displayName === 'NLSX-REU-A11' || rawSku === 'NLSX-REU-A11') {
                                                                                displayName = 'Rêu Đỏ A11 Dán Layout';
                                                                                rawSku = 'NL-LAY-REU-A11';
                                                                            } else if (displayName === 'NLSX-LUASANMIENG' || rawSku === 'NLSX-LUASANMIENG') {
                                                                                displayName = 'Lũa Săn Miếng Tự Nhiên';
                                                                                rawSku = 'NL-LAY-LUASANMIENG';
                                                                            } else if (displayName === 'NLSX-TAIMEO' || rawSku === 'NLSX-TAIMEO') {
                                                                                displayName = 'Đá Tai Mèo Vân Đẹp';
                                                                                rawSku = 'NL-LAY-TAIMEO';
                                                                            } else if (displayName === 'NLSX-CUOI' || rawSku === 'NLSX-CUOI') {
                                                                                displayName = 'Đá Cuội Tự Nhiên';
                                                                                rawSku = 'NL-LAY-CUOI';
                                                                            } else if (displayName === 'NLSX-NHAM' || rawSku === 'NLSX-NHAM') {
                                                                                displayName = 'Nham Thạch Đen/Đỏ';
                                                                                rawSku = 'NL-LAY-NHAM';
                                                                            } else if (displayName === 'NLSX-DOQUYEN' || rawSku === 'NLSX-DOQUYEN') {
                                                                                displayName = 'Lũa Đỗ Quyên Tự Nhiên';
                                                                                rawSku = 'NL-LAY-DOQUYEN';
                                                                            } else if (displayName === 'NLSX-RF' || rawSku === 'NLSX-RF') {
                                                                                displayName = 'Rễ Rừng Tự Nhiên';
                                                                                rawSku = 'NL-LAY-SX-RF';
                                                                            } else if (matchedP && matchedP.name && matchedP.name !== matchedP.sku) {
                                                                                displayName = matchedP.name;
                                                                                rawSku = matchedP.sku || rawSku;
                                                                            }

                                                                            const displaySku = rawSku;

                                                                            return (
                                                                                <tr key={idx} className="hover:bg-[#1a1a1a]/40 transition-colors">
                                                                                    <td className="py-2.5 px-3">
                                                                                        <div className="font-bold text-gray-200 text-[11px] leading-tight">{displayName}</div>
                                                                                        {displaySku && (
                                                                                            <div className="text-[9.5px] font-mono text-zinc-400 font-semibold flex items-center gap-1 mt-0.5">
                                                                                                <i className="fas fa-barcode text-[8.5px] text-[#d4af37]"></i>
                                                                                                <span className="text-[#d4af37]">{displaySku}</span>
                                                                                            </div>
                                                                                        )}
                                                                                    </td>
                                                                                    <td className="py-2.5 px-3 text-center font-black text-sky-400">
                                                                                        <span className="bg-sky-500/10 px-2 py-0.5 rounded-md border border-sky-500/20">{qty} {displayUnit}</span>
                                                                                    </td>
                                                                                    <td className="py-2.5 px-3 text-right text-gray-400 font-mono">{Math.round(effectivePrice).toLocaleString('vi-VN')}đ</td>
                                                                                    <td className="py-2.5 px-3 text-right font-black text-emerald-400 font-mono">{Math.round(effectiveAmount).toLocaleString('vi-VN')}đ</td>
                                                                                </tr>
                                                                            );
                                                                        })}
                                                                    </tbody>
                                                                    <tfoot className="bg-[#121216] border-t border-zinc-800 text-xs font-mono">
                                                                        {(() => {
                                                                            const sumItemAmt = items.reduce((sum, it) => sum + (Number(it.effectiveAmount || (it.qty * it.price)) || 0), 0);
                                                                            const ticketTotal = Number(log.totalAmount || 0);
                                                                            const otherCost = Math.max(0, ticketTotal - Math.round(sumItemAmt));
                                                                            return (
                                                                                <>
                                                                                    <tr>
                                                                                        <td colSpan="3" className="py-2 px-3 text-right text-zinc-400 font-sans font-bold text-[10.5px]">
                                                                                            Tổng tiền hàng ({items.length} mặt hàng):
                                                                                        </td>
                                                                                        <td className="py-2 px-3 text-right font-bold text-zinc-200">
                                                                                            {Math.round(sumItemAmt).toLocaleString('vi-VN')}đ
                                                                                        </td>
                                                                                    </tr>
                                                                                    {otherCost > 0 && (
                                                                                        <tr className="bg-amber-500/[0.04]">
                                                                                            <td colSpan="3" className="py-2 px-3 text-right text-amber-400 font-sans font-bold text-[10.5px]">
                                                                                                <i className="fas fa-truck mr-1 text-[9.5px]"></i> Cước vận chuyển / Chi phí khác:
                                                                                            </td>
                                                                                            <td className="py-2 px-3 text-right font-black text-amber-400">
                                                                                                +{otherCost.toLocaleString('vi-VN')}đ
                                                                                            </td>
                                                                                        </tr>
                                                                                    )}
                                                                                    <tr className="bg-emerald-500/[0.08] border-t border-emerald-500/20">
                                                                                        <td colSpan="3" className="py-2.5 px-3 text-right text-emerald-400 font-sans font-black text-[11px] uppercase tracking-wider">
                                                                                            Tổng thanh toán phiếu:
                                                                                        </td>
                                                                                        <td className="py-2.5 px-3 text-right font-black text-emerald-400 text-sm">
                                                                                            {ticketTotal.toLocaleString('vi-VN')}đ
                                                                                        </td>
                                                                                    </tr>
                                                                                </>
                                                                            );
                                                                        })()}
                                                                    </tfoot>
                                                                </table>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        );
                    })
                )}
            </div>

            {/* KEEP EXISTING MODALS */}
            {showForm && (
                <IEFormModal 
                    data={data} 
                    userConfigs={userConfigs} 
                    onClose={() => { setShowForm(false); setPrefilledProduct(null); }} 
                    pushData={pushData} 
                    prefilledProduct={prefilledProduct} 
                    onSaveSuccess={(ticketData) => setPrintTicketData(ticketData)}
                    triggerToast={triggerToast}
                />
            )}

            {printTicketData && (
                <ImportExportPrintModal 
                    ticket={printTicketData} 
                    onClose={() => setPrintTicketData(null)} 
                    triggerToast={triggerToast} 
                />
            )}
            
            {editingLog && (
                <div className="fixed inset-0 bg-[#0a0a0a]/90 z-[300] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => setEditingLog(null)}>
                    <div className="bg-[#141414] w-full max-w-lg rounded-[24px] p-5 border border-[#333] shadow-2xl flex flex-col relative overflow-hidden animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
                        <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-3">
                            <h3 className="font-black text-blue-400 text-[15px] uppercase tracking-wider"><i className="fas fa-edit mr-2"></i> Sửa Phiếu {editingLog.id}</h3>
                            <button onClick={() => setEditingLog(null)} className="w-8 h-8 bg-[#1a1a1a] rounded-full text-gray-400 hover:text-rose-500 border border-[#333] transition-colors"><i className="fas fa-times"></i></button>
                        </div>
                        
                        <div className="space-y-3 max-h-[50vh] overflow-y-auto custom-scrollbar pr-1">
                            {editingItems.map((it, idx) => {
                                const matchedP = (data?.Products || []).find(x => 
                                    (it.sku && String(x.sku || '').toUpperCase() === String(it.sku).trim().toUpperCase()) || 
                                    (it.name && String(x.name || '').toLowerCase() === String(it.name).trim().toLowerCase())
                                );
                                const itemUnit = (matchedP && matchedP.unit) ? matchedP.unit : (it.unit || 'Cái');
                                return (
                                <div key={idx} className="flex justify-between items-center bg-[#0a0a0a] p-3 rounded-xl border border-[#222]">
                                    <div className="flex-1">
                                        <div className="text-[12px] font-black text-gray-200">{it.name}</div>
                                        <div className="text-[10px] text-gray-500 font-bold">{Number(it.price || 0).toLocaleString('vi-VN')}đ / {itemUnit}</div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <label className="text-[10px] font-bold text-gray-500">SỐ LƯỢNG:</label>
                                        <input 
                                            type="number" 
                                            value={it.qty} 
                                            onChange={e => {
                                                const newItems = [...editingItems];
                                                newItems[idx].qty = Number(e.target.value);
                                                setEditingItems(newItems);
                                            }}
                                            className="w-20 bg-[#1a1a1a] border border-[#333] rounded-lg px-2 py-1.5 text-[13px] font-black text-center text-blue-400 outline-none focus:border-blue-500"
                                        />
                                    </div>
                                </div>
                                );
                            })}
                        </div>
                        
                        <div className="pt-4 mt-2 border-t border-[#222]">
                            <button onClick={async () => {
                                const payload = { ImportExport: [], Products: [], deletes: {} };
                                
                                let newTotal = 0;
                                let oldParsed = safeJSONParse(editingLog.itemsData) || [];
                                
                                editingItems.forEach(newItem => {
                                    newTotal += newItem.qty * (newItem.price || 0);
                                    const oldItem = oldParsed.find(x => x.name === newItem.name) || {qty: 0};
                                    const diffQty = newItem.qty - oldItem.qty;
                                    
                                    if (diffQty !== 0) {
                                        const p = (data?.Products||[]).find(x => x.name === newItem.name);
                                        if (p) {
                                            const sign = editingLog.type === 'Nhập' ? 1 : -1;
                                            const stockChange = diffQty * sign;
                                            payload.Products.push({...p, quantity: Number(p.quantity) + stockChange, _diff: stockChange});
                                        }
                                    }
                                });
                                
                                const updatedLog = { ...editingLog, itemsData: JSON.stringify(editingItems), totalAmount: newTotal };
                                payload.ImportExport.push(updatedLog);
                                
                                const relatedTx = (data?.Transactions || []).find(tx => String(tx.note).includes(editingLog.id) || (String(tx.title).includes('Thanh toán') && String(tx.title).includes(editingLog.target) && String(tx.date).slice(0,10) === String(editingLog.date).slice(0,10)));
                                
                                if (relatedTx && newTotal !== Number(editingLog.totalAmount)) {
                                    if (window.confirm('Phiếu này có khoản thanh toán liên đới trên sổ quỹ. Tổng tiền đã thay đổi, bạn có muốn XOÁ LUÔN phiếu Thu/Chi đó để sau đó tự tạo lại cho chính xác không?')) {
                                        payload.deletes.Transactions = [relatedTx.id];
                                    }
                                }
                                
                                try {
                                    await pushData(payload);
                                    setEditingLog(null);
                                    if (triggerToast) triggerToast('Đã lưu thành công!', 'fa-check', 'success');
                                } catch (e) {
                                    alert('Lỗi: ' + e.message);
                                }
                            }} className="w-full py-3.5 bg-blue-500 hover:bg-blue-600 text-[#0a0a0a] font-black rounded-xl text-[12px] tracking-widest uppercase transition-all shadow-md active:scale-95">
                                <i className="fas fa-save mr-2"></i> LƯU THAY ĐỔI
                            </button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
});

function IEFormModal({ data, onClose, pushData, prefilledProduct, userConfigs, onSaveSuccess, triggerToast }) {
   const [type, setType] = React.useState(window.pendingType === 'Thanh Lý' ? 'Xuất' : (window.pendingType || 'Nhập')); 
   const [importSubTab, setImportSubTab] = React.useState('NguyenLieu');
   const [exportSubTab, setExportSubTab] = React.useState(window.pendingType === 'Thanh Lý' ? 'ThanhLy' : 'SanXuat');
   const [thanhLyAmount, setThanhLyAmount] = React.useState('');
   const [isSaving, setIsSaving] = React.useState(false);
   
   const [linkedReqId, setLinkedReqId] = React.useState('');
   const [showAddSup, setShowAddSup] = React.useState(false);
   const [newSup, setNewSup] = React.useState({ name: '', phone: '', category: 'NGUYÊN LIỆU & VẬT TƯ' });
   const [localSuppliers, setLocalSuppliers] = React.useState([]);

   const allSuppliers = React.useMemo(() => {
       const merged = [...localSuppliers];
       const seen = new Set(localSuppliers.map(s => s.id));
       (data?.Suppliers || []).forEach(s => {
           if (!seen.has(s.id)) {
               seen.add(s.id);
               merged.push(s);
           }
       });
       return merged;
   }, [localSuppliers, data?.Suppliers]);

   const openAddSup = () => {
       setNewSup({ 
           name: '', 
           phone: '', 
           category: importSubTab === 'NguyenLieu' ? 'NGUYÊN LIỆU & VẬT TƯ' : 'HÀNG HOÁ' 
       });
       setShowAddSup(true);
   };

   React.useEffect(() => {
       if (prefilledProduct && Object.keys(prefilledProduct).length > 0) {
           setType('Nhập');
           if (prefilledProduct.data && prefilledProduct.data.linkedRequestId) {
               setLinkedReqId(prefilledProduct.data.linkedRequestId);
               setNote(`Nhập hàng theo báo cáo nhập hàng: ${prefilledProduct.data.linkedMaterialName}`);
           } else {
               const p = (data?.Products||[]).find(x => x.id === prefilledProduct.id) || prefilledProduct;
               if (p && p.name) {
                   setItems([{
                       id: p.id,
                       name: p.name,
                       qty: 1,
                       price: parseFloat(p.costPrice) || 0,
                       unit: p.unit || 'Cái'
                   }]);
                   setSelProd(p.id);
                   setSearchProd(p.name || '');
                   setSelQty('1');
                   setSelPrice(p.costPrice || '');
               }
           }
       }
   }, [prefilledProduct, data?.Products]);
   
   const currentRole = localStorage.getItem('rf_role');
   const currentUser = localStorage.getItem('rf_user');
   const isKiemToan = currentRole === 'TỐI CAO' || currentRole === 'KẾ TOÁN' || currentRole === 'KIỂM TOÁN' || currentUser === 'Nguyễn Thị Diệu Hương';
   
   const getVNTime = () => {
       const d = new Date();
       return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
   };

   const [supplierId, setSupplierId] = React.useState('');
   const [receiverName, setReceiverName] = React.useState(''); 
   const [accId, setAccId] = React.useState(''); 
   const [paidAmount, setPaidAmount] = React.useState('');
   const [note, setNote] = React.useState('');
   const [dateStr, setDateStr] = React.useState(getVNTime()); 
   
   const [items, setItems] = React.useState([]);
   const [searchProd, setSearchProd] = React.useState('');
   const [showDropdown, setShowDropdown] = React.useState(false); 
   const [selProd, setSelProd] = React.useState('');
   const [selQty, setSelQty] = React.useState('');
   const [selPrice, setSelPrice] = React.useState('');

   const [isUsingImportUnit, setIsUsingImportUnit] = React.useState(false);

   const selectedProductInfo = React.useMemo(() => {
       if (!selProd) return null;
       return (data?.Products || []).find(x => x && x.id === selProd) || null;
   }, [data?.Products, selProd]);

   const [checkCat, setCheckCat] = React.useState('');
   const [checkSubCat, setCheckSubCat] = React.useState('');

   const [checkItems, setCheckItems] = React.useState(() => {
       try {
           const draft = localStorage.getItem('rf_kiemkho_draft');
           return draft ? safeJSONParse(draft) : {};
       } catch(e) { return {}; }
   });

   React.useEffect(() => {
       if (type === 'Kiểm Kho' && checkSubCat) {
           const prods = (data?.Products||[]).filter(p => p.sub_category === checkSubCat);
           setCheckItems(prev => {
               const init = { ...prev };
               prods.forEach(p => { if (init[p.id] === undefined) { init[p.id] = p.quantity; } });
               return init;
           });
       }
   }, [type, checkSubCat, data?.Products]);

   const handleCheckInput = (id, val) => {
       const newItems = { ...checkItems, [id]: val };
       setCheckItems(newItems);
       localStorage.setItem('rf_kiemkho_draft', JSON.stringify(newItems));
   };

   const filteredProducts = React.useMemo(() => { 
       if (!showDropdown && !searchProd) return []; 
       const query = String(searchProd || '').toLowerCase();
       let list = (data?.Products||[]);
       if (type === 'Nhập') {
           if (importSubTab === 'NguyenLieu') {
               list = list.filter(p => String(p.category).toUpperCase().includes('DANH MỤC SẢN XUẤT') || String(p.category).toUpperCase().includes('NGUYÊN LIỆU') || String(p.category).toUpperCase().includes('VẬT TƯ'));
           } else if (importSubTab === 'HangHoa') {
               list = list.filter(p => String(p.category).toUpperCase().includes('PHỤ KIỆN') && !String(p.category).toUpperCase().includes('LAYOUT') && !String(p.category).toUpperCase().includes('BỂ KÍNH'));
           }
       } else if (type === 'Xuất') {
           if (exportSubTab === 'SanXuat') {
               list = list.filter(p => String(p.category).toUpperCase().includes('DANH MỤC SẢN XUẤT') || String(p.category).toUpperCase().includes('NGUYÊN LIỆU'));
           }
       }
       return list.filter(p => String(p.name).toLowerCase().includes(query) || String(p.sku).toLowerCase().includes(query)).slice(0, 30); 
   }, [data?.Products, searchProd, showDropdown, type, importSubTab, exportSubTab]);

   const handleCreateSupplier = async () => {
        if (!newSup.name.trim()) return alert('Vui lòng nhập Tên Nhà Cung Cấp!');
        const sId = 'SUP_' + Date.now();
        const supCat = newSup.category?.trim() || (importSubTab === 'NguyenLieu' ? 'NGUYÊN LIỆU & VẬT TƯ' : 'HÀNG HOÁ');
        const payloadSup = { id: sId, name: newSup.name.trim(), phone: newSup.phone?.trim() || '', category: supCat, totalDebt: 0 };
        try {
            setLocalSuppliers(prev => [payloadSup, ...prev]);
            setSupplierId(sId);
            setShowAddSup(false);
            setNewSup({ name: '', phone: '', category: importSubTab === 'NguyenLieu' ? 'NGUYÊN LIỆU & VẬT TƯ' : 'HÀNG HOÁ' });
            await pushData({ Suppliers: [payloadSup] });
            if (triggerToast) triggerToast(`Đã thêm nhà cung cấp: ${payloadSup.name}!`, 'fa-check', 'success');
        } catch (e) { alert('Lỗi tạo NCC: ' + (e.message || e)); }
    };

   const handleSelectProduct = (p) => { 
       setSelProd(p.id); setSearchProd(p.name); setSelPrice(type === 'Nhập' ? p.costPrice : p.price); setShowDropdown(false); 
       setIsUsingImportUnit(false);
   };

   const [otherFees, setOtherFees] = React.useState(0);
   const baseAmount = items.reduce((acc, curr) => acc + (curr.qty * curr.price), 0);
   const totalAmount = type === 'Nhập' ? baseAmount + (Number(otherFees) || 0) : baseAmount;
   const displayMoney = (val) => Math.round(Number(val || 0)).toLocaleString('vi-VN');

   const addItem = () => { 
       const p = (data?.Products||[]).find(x=>x.id===selProd);
       let qtyNum = parseFloat(selQty);
       if(!p || isNaN(qtyNum) || qtyNum <= 0) return alert("Vui lòng nhập số lượng hợp lệ lớn hơn 0"); 
       let pPrice = parseFloat(selPrice) || 0;

       if (type === 'Nhập' && isUsingImportUnit && p.conversionRate > 1) {
           qtyNum = qtyNum * Number(p.conversionRate);
           pPrice = pPrice / Number(p.conversionRate);
       }

       setItems([...items, { id: p.id, name: p.name, qty: qtyNum, price: pPrice, unit: p.unit || '' }]); 
       setSelProd(''); setSelQty(''); setSelPrice(''); setSearchProd(''); 
       setIsUsingImportUnit(false);
   };

   const save = async () => {
     if (isSaving) return;
     if (type === 'Kiểm Kho' && !checkSubCat) return alert('Vui lòng chọn danh mục con để kiểm kho!');
     if (type !== 'Kiểm Kho' && items.length === 0) return alert('Hãy thêm ít nhất 1 mặt hàng vào phiếu!');

     setIsSaving(true);
     let payload = { Products: [], ImportExport: [], Transactions: [], Accounts: [], Suppliers: [] };
     let formattedDate = (dateStr || '').replace('T', ' ');
     let logId = '';
     let targetName = '';
     let totalDebtAdd = 0;
     let finalNote = note || '';

     if (type === 'Kiểm Kho') {
         let nhapItems = []; let xuatItems = []; let totalNhapAmt = 0; let totalXuatAmt = 0;
         (data?.Products||[]).filter(p => p.sub_category === checkSubCat).forEach((p) => {
             const actual = parseInt(checkItems[p.id]);
             if (!isNaN(actual) && actual !== Number(p.quantity)) {
                 const diff = actual - Number(p.quantity);
                 payload.Products.push({ ...p, quantity: actual, _diff: diff });
                 if (diff > 0) {
                     nhapItems.push({ name: p.name, qty: diff, price: p.costPrice || 0, unit: p.unit || '' }); totalNhapAmt += diff * Number(p.costPrice || 0);
                 } else {
                     const absDiff = Math.abs(diff); xuatItems.push({ name: p.name, qty: absDiff, price: p.costPrice || 0, unit: p.unit || '' }); totalXuatAmt += absDiff * Number(p.costPrice || 0);
                 }
             }
         });
         
         if (nhapItems.length === 0 && xuatItems.length === 0) {
             alert('Không phát hiện chênh lệch! Toàn bộ mặt hàng trong danh mục khớp 100% với sổ sách.');
             localStorage.removeItem('rf_kiemkho_draft');
             setIsSaving(false); onClose(); return;
         }

         if (nhapItems.length > 0) payload.ImportExport.push({ id: 'IE_GCHK_N_' + Date.now(), type: 'Nhập', target: 'Kiểm kho (Cân tăng)', totalAmount: totalNhapAmt, date: formattedDate, note: `Cân đối kiểm kho tăng danh mục: ${checkSubCat}`, itemsData: JSON.stringify(nhapItems) });
         if (xuatItems.length > 0) payload.ImportExport.push({ id: 'IE_GCHK_X_' + Date.now() + 1, type: 'Xuất', target: 'Kiểm kho (Cân giảm)', totalAmount: totalXuatAmt, date: formattedDate, note: `Cân đối kiểm kho giảm danh mục: ${checkSubCat}`, itemsData: JSON.stringify(xuatItems) });
     } else {
         logId = 'IE_'+Date.now();
         items.forEach(i => { 
             const p = (data?.Products||[]).find(x=>x.id===i.id); 
             if(p && type !== 'Đặt Hàng') {
                 const diffVal = type === 'Nhập' ? i.qty : -i.qty;
                 payload.Products.push({...p, quantity: Number(p.quantity) + diffVal, _diff: diffVal}); 
             }
         });
         targetName = 'Nội bộ/Khác';

         if(type === 'Nhập' || type === 'Đặt Hàng') {
            targetName = supplierId ? (allSuppliers.find(s=>s.id===supplierId)?.name || 'Khác') : 'Khác';
            if(supplierId) {
                const paid = parseInt(paidAmount) || 0; totalDebtAdd = totalAmount - paid;
                if(paid > 0) { 
                    if(!accId) { setIsSaving(false); return alert('Vui lòng chọn quỹ để xuất Phiếu Chi thanh toán!'); }
                    const acc = (data?.Accounts||[]).find(a=>a.id===accId); 
                    payload.Accounts.push({...acc, balance: Number(acc.balance) - paid}); 
                    payload.Transactions.push({ id: 'TX_'+Date.now(), type: 'Chi', category: 'Thanh Toán Hoá Đơn', amount: paid, fromAccount: accId, toAccount: '', title: `Thanh toán nhập hàng: ${targetName}`, date: formattedDate, note: `Hệ thống tạo tự động từ Phiếu ${type} (${logId})` });
                }
                if(totalDebtAdd > 0) { 
                    const sup = allSuppliers.find(s=>s.id===supplierId);
                    payload.Suppliers.push({...sup, totalDebt: Number(sup.totalDebt) + totalDebtAdd}); 
                }
            }
         } else { 
             targetName = receiverName || 'Xuất nội bộ';
             if (exportSubTab === 'ThanhLy') {
                 targetName = 'Thanh lý hàng hoá';
                 const amount = parseInt(thanhLyAmount) || 0;
                 if (amount > 0) {
                     if (!accId) { setIsSaving(false); return alert('Vui lòng chọn quỹ để tạo Phiếu Thu!'); }
                     const acc = (data?.Accounts||[]).find(a=>a.id===accId); 
                     payload.Accounts.push({...acc, balance: Number(acc.balance) + amount}); 
                     payload.Transactions.push({ id: 'TX_'+Date.now(), type: 'Thu', category: 'Thanh Lý Hàng Hoá', amount: amount, fromAccount: '', toAccount: accId, title: `Thu tiền thanh lý kho`, date: formattedDate, note: `Hệ thống tạo tự động từ Phiếu Xuất Thanh Lý (${logId})` });
                 }
             }
         }
         
         if(type === 'Nhập') { 
             const u = (localStorage.getItem('rf_user') || 'Admin').split(' ').pop(); 
             finalNote = `${note ? note + ' - ' : ''}Nhập từ NCC (Người tạo: ${u})`;
         } else if (type === 'Xuất' && exportSubTab === 'ThanhLy') {
             finalNote = `${note ? note + ' - ' : ''}Thanh lý (Hệ thống)`;
         } else if (type === 'Xuất' && exportSubTab === 'Huy') {
             finalNote = `${note ? note + ' - ' : ''}Xuất huỷ (Hệ thống)`;
         }
         payload.ImportExport.push({ id: logId, type, target: targetName, totalAmount, date: formattedDate, note: finalNote, itemsData: JSON.stringify(items), otherFees: type === 'Nhập' ? (Number(otherFees) || 0) : 0 });
     }

     if (linkedReqId) {
         payload.deletes = payload.deletes || {};
         if (!payload.deletes.Production) payload.deletes.Production = [];
         payload.deletes.Production.push(linkedReqId);
     }

     try {
          await pushData(payload);
          if (type === 'Kiểm Kho') localStorage.removeItem('rf_kiemkho_draft');
          
          if (onSaveSuccess && type !== 'Kiểm Kho') {
              onSaveSuccess({
                  id: logId,
                  type: type,
                  target: targetName,
                  date: formattedDate,
                  items: items,
                  baseAmount: baseAmount,
                  otherFees: Number(otherFees) || 0,
                  totalAmount: totalAmount,
                  paidAmount: Number(paidAmount) || 0,
                  debtAmount: totalDebtAdd,
                  note: finalNote,
                  creator: currentUser || 'Admin'

          if (triggerToast) triggerToast('Lưu phiếu kho thành công!', 'fa-check', 'success');
          onClose();

   };

   const hasDraft = checkItems && Object.keys(checkItems).length > 0;

   const checkDiffsSummary = React.useMemo(() => {
       if (type !== 'Kiểm Kho' || !checkSubCat) return { surplus: 0, deficit: 0, matched: 0 };
       let surplus = 0, deficit = 0, matched = 0;
       (data?.Products||[]).filter(p => p.sub_category === checkSubCat).forEach(p => {
           const actual = parseInt(checkItems[p.id]);
           if (isNaN(actual)) return;
           const diff = actual - Number(p.quantity);
           if (diff > 0) surplus++;
           else if (diff < 0) deficit++;
           else matched++;
       });
       return { surplus, deficit, matched };
   }, [type, checkSubCat, checkItems, data?.Products]);

   return (

                        </div>
                    )}

                    {items.length > 0 && (
                        <div className="mt-4 pt-4 border-t border-zinc-800 space-y-2">
                            <div className="max-h-[160px] overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                                {items.map((i, idx) => (
                                    <div key={idx} className="flex justify-between items-center bg-[#0a0a0a] p-2 rounded-lg border border-zinc-900 group">
                                        <div className="flex-1 min-w-0 pr-2"><div className="text-[11px] font-black text-zinc-200 truncate">{i.name}</div><div className="text-[9px] font-bold text-zinc-500 mt-0.5">{displayMoney(i.price)}đ / {i.unit || 'Cái'}</div></div>
                                        <div className="flex items-center gap-2 shrink-0">
                                            <div className="bg-zinc-800 px-2 py-0.5 rounded border border-zinc-700 flex items-center gap-1.5 justify-center text-[10px]">
                                                <span className="font-black text-[#d4af37]">{i.qty}</span>
                                                <span className="text-[8px] font-bold text-zinc-500 uppercase">{i.unit || 'Cái'}</span>
                                            </div>
                                            <button disabled={isSaving} onClick={() => { let n = [...items]; n.splice(idx, 1); setItems(n); }} className="w-7 h-7 flex items-center justify-center rounded-lg text-rose-500 bg-rose-500/5 hover:bg-rose-500/10 transition-all opacity-60 group-hover:opacity-100"><i className="fas fa-trash-alt text-[10px]"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-between items-end pt-3 pb-1 border-t border-zinc-800 mt-2">
                                <div className="text-[9px] font-black text-gray-500 uppercase tracking-widest flex flex-col gap-1.5">
                                    <span>Tổng tiền hàng: <span className="text-gray-300 font-mono">{displayMoney(baseAmount)}</span></span>
                                    {type === 'Nhập' && (
                                        <div className="flex items-center gap-2">
                                            <span>Thu/Chi Khác (Cộng vào vốn):</span>
                                            <input type="number" disabled={isSaving} placeholder="0" className="w-24 p-1 bg-[#141414] rounded border border-[#333] text-xs font-bold outline-none text-white focus:border-[#d4af37]" value={otherFees} onChange={e=>setOtherFees(e.target.value)} />
                                        </div>
                                    )}
                                </div>
                                {type === 'Xuất' && exportSubTab === 'ThanhLy' ? (
                                    <div className="flex flex-col items-end gap-1">
                                        <input type="number" disabled={isSaving} placeholder="Nhập số tiền thu được..." className="w-40 p-2 bg-[#0a0a0a] rounded-lg border border-[#f59e0b] text-[12px] font-black outline-none text-[#f59e0b] text-right focus:border-[#f59e0b]" value={thanhLyAmount} onChange={e=>setThanhLyAmount(e.target.value)} />
                                        {(parseInt(thanhLyAmount) > 0) && (
                                            <select disabled={isSaving} className="w-40 p-1.5 bg-[#0a0a0a] rounded-lg border border-[#333] text-[9px] font-bold outline-none shadow-sm focus:border-[#f59e0b] text-white cursor-pointer" value={accId} onChange={e=>setAccId(e.target.value)}>
                                                <option value="">-- Thu vào quỹ --</option>
                                                {(data?.Accounts||[]).map(a=><option key={a.id} value={a.id}>{a.accountName}</option>)}
                                            </select>
                                        )}
                                    </div>
                                ) : (
                                    <div className="text-right">
                                        <div className="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-1">TỔNG CẦN TRẢ</div>
                                        <div className={`text-[16px] font-black tracking-tight ${type === 'Nhập' ? 'text-emerald-400' : 'text-rose-400'}`}>{displayMoney(totalAmount)}<span className="text-[11px] ml-1 text-gray-500 font-black">VND</span></div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>

                {/* CHI PHÍ KHÁC / CƯỚC VẬN CHUYỂN */}
                {type === 'Nhập' && (
                    <div className="bg-[#0a0a0a] border border-[#222] p-3.5 rounded-2xl space-y-1.5">
                        <div className="flex justify-between items-center">
                            <label className="text-[10px] font-black text-amber-400 uppercase tracking-widest flex items-center gap-1.5">
                                <i className="fas fa-truck text-xs"></i> CƯỚC VẬN CHUYỂN / CHI PHÍ KHÁC (VNĐ)
                            </label>
                            {Number(otherFees) > 0 && (
                                <span className="text-[10px] font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">+{displayMoney(otherFees)}đ</span>
                            )}
                        </div>
                        <input 
                            type="number" 
                            disabled={isSaving} 
                            placeholder="Nhập tiền cước vận chuyển (nếu có)..." 
                            className="w-full p-2.5 bg-[#141414] rounded-xl border border-[#333] text-xs font-bold text-amber-300 outline-none focus:border-amber-500 transition-colors" 
                            value={otherFees} 
                            onChange={e => setOtherFees(e.target.value)} 
                        />
                        <p className="text-[9.5px] text-zinc-500 italic">
                            * Cước xe/vận chuyển sẽ tự động được cộng vào tổng tiền vốn phiếu nhập kho.
                        </p>
                    </div>
                )}

                <div>
                    <label className="text-[9px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">Ghi chú phiếu</label>
                    <input disabled={isSaving} placeholder="Nhập ghi chú mục đích xuất nhập..." className="w-full p-2.5 bg-[#0a0a0a] rounded-xl border border-[#333] text-[11px] font-bold outline-none text-white focus:border-[#d4af37]" value={note} onChange={e=>setNote(e.target.value)}/>
                </div>
                
                {type === 'Nhập' && supplierId && (
                    <div className="p-3.5 bg-emerald-950/15 border border-emerald-900/40 rounded-xl space-y-3 shadow-inner relative overflow-hidden">
                        <div className="flex justify-between items-center border-b border-emerald-900/20 pb-2"><span className="text-[10px] font-black text-[#10b981] uppercase tracking-widest">TỔNG CẦN TRẢ</span><span className="text-[16px] font-black text-[#10b981]">{displayMoney(totalAmount)}đ</span></div>
                        <div className="flex justify-between items-center gap-2">
                            <span className="text-[10px] font-bold text-gray-400">Chi trả ngay <br/><span className="text-[8px] text-gray-500 font-medium italic">(Hệ thống tự động tạo Phiếu Chi)</span></span>
                            <input type="number" disabled={isSaving} placeholder="Nhập số tiền chi..." className="w-1/2 p-2.5 bg-[#0a0a0a] rounded-lg border border-[#333] text-xs text-right font-black text-[#10b981] outline-none shadow-sm focus:border-[#10b981]" value={paidAmount} onChange={e=>setPaidAmount(e.target.value)}/>
                        </div>
                        {(parseInt(paidAmount)>0) && (
                            <div className="animate-fade-in pt-1.5">
                                <label className="text-[9px] font-bold text-gray-400 block mb-1">Trừ tiền từ quỹ nào?</label>
                                <select disabled={isSaving} className="w-full p-2 bg-[#0a0a0a] rounded-lg border border-[#333] text-[11px] font-bold outline-none shadow-sm focus:border-[#10b981] text-white cursor-pointer" value={accId} onChange={e=>setAccId(e.target.value)}><option value="">-- Chọn quỹ thanh toán --</option>{(data?.Accounts||[]).map(a=><option key={a.id} value={a.id}>{a.accountName} (Sẵn có: {displayMoney(a.balance)}đ)</option>)}</select>
                            </div>
                        )}
                        <div className="text-[10px] text-rose-500 font-bold text-right pt-2 border-t border-emerald-900/20 flex justify-end items-center gap-1.5"><i className="fas fa-hand-holding-usd opacity-60"></i> Nợ Đối Tác: <span className="bg-[#2a0808] text-rose-500 px-2 py-0.5 rounded border border-rose-900/30">{displayMoney(totalAmount - (parseInt(paidAmount)||0))}đ</span></div>
                    </div>
                )}
              </div>
            )}
          </div>
          
          <div className="pt-4 mt-2 shrink-0">
              <button onClick={save} disabled={isSaving} className={`w-full py-3.5 font-black rounded-xl text-[12px] uppercase tracking-wider shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 ${isSaving ? 'bg-[#333] text-gray-500 cursor-not-allowed' : (type === 'Kiểm Kho' ? 'bg-[#2563eb] text-white hover:bg-blue-600' : 'bg-[#d4af37] text-[#0a0a0a]')}`}>
                  {isSaving ? <><i className="fas fa-spinner fa-spin"></i> ĐANG ĐỒNG BỘ DỮ LIỆU...</> : (type === 'Kiểm Kho' ? <><i className="fas fa-magic"></i> LƯU PHIẾU KIỂM KHO</> : <><i className="fas fa-save"></i> LƯU PHIẾU {type.toUpperCase()}</>)}
              </button>
          </div>
        </div>
      </div>
    );
}


</script>
