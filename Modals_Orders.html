    function BulkFinanceModal({ onClose, pushDeltas, orders, transactions, accounts }) {
        const [fileName, setFileName] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [progress, setProgress] = React.useState(0);
        const [previewLogs, setPreviewLogs] = React.useState([]);
        const [reportType, setReportType] = React.useState(''); // 'INCOME' or 'BALANCE'
        const [resultPayload, setResultPayload] = React.useState(null);

        const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ') : new Date().toISOString().slice(0, 16).replace('T', ' ');

        // -------------------------------------------------------------
        // HÀM CHUẨN HÓA, RÚT GỌN VÀ ĐỒNG BỘ MÀU SẮC TRẠNG THÁI ORDER.ALL (SCOPED IN MODAL)
        // -------------------------------------------------------------
        const normalizeStatus = (status) => {
            if (!status) return '';
            return String(status).trim().toLowerCase().normalize("NFC");
        };

        const shortenStatusText = (status) => {
            if (!status) return '';
            const norm = String(status).trim().normalize("NFC");

            // Rút gọn câu dài Shopee: "Người mua xác nhận đã nhận được hàng, tuy nhiên Người mua vẫn có thể gửi yêu cầu Trả hàng/Hoàn tiền tới ngày YYYY-MM-DD"
            const dateMatch = norm.match(/(?:tới ngày|đến ngày|trước ngày)\s*(\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[-/]\d{1,2}[-/]\d{4})/i);
            if (dateMatch && norm.toLowerCase().includes('người mua xác nhận đã nhận được hàng')) {
                const rawDate = dateMatch[1];
                const parts = rawDate.split(/[-/]/);
                let ddmm = '';
                if (parts.length === 3) {
                    if (parts[0].length === 4) {
                        // YYYY-MM-DD -> DD/MM
                        ddmm = `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}`;
                    } else {
                        // DD-MM-YYYY -> DD/MM
                        ddmm = `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}`;
                    }
                }
                return ddmm ? `Đã nhận (Hạn khiếu nại: ${ddmm})` : 'Đã nhận hàng';
            }

            if (norm.toLowerCase().includes('người mua xác nhận đã nhận được hàng')) {
                return 'Đã nhận hàng';
            }

            if (norm.toLowerCase().includes('đã chấp thuận yêu cầu')) {
                return 'Đã chấp thuận hoàn';
            }

            return norm;
        };

        const getStatusBadgeStyle = (fileStatus, mappedStatus) => {
            const s1 = normalizeStatus(fileStatus);
            const s2 = normalizeStatus(mappedStatus);
            const combined = `${s1} ${s2}`;

            // 1. Nhóm Hoàn Thành ("hoàn thành", "đã giao") ➡️ Xanh lục
            if (
                combined.includes('hoàn thành') ||
                combined.includes('đã giao') ||
                combined.includes('giao thành công') ||
                combined.includes('đối soát') ||
                combined.includes('đã nhận') ||
                combined.includes('completed') ||
                combined.includes('delivered')
            ) {
                return {
                    badgeClass: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30',
                    dotClass: 'bg-emerald-400'
                };
            }

            // 2. Nhóm Đã Hủy ("đã hủy", "hủy đơn") ➡️ Đỏ hồng
            if (
                combined.includes('hủy') ||
                combined.includes('huỷ') ||
                combined.includes('cancelled') ||
                combined.includes('canceled')
            ) {
                return {
                    badgeClass: 'bg-rose-500/15 text-rose-400 border-rose-500/30',
                    dotClass: 'bg-rose-400'
                };
            }

            // 3. Nhóm Hoàn Hàng / Khiếu Nại ("đã chấp thuận yêu cầu", "trả hàng", "hoàn tiền") ➡️ Vàng cam
            if (
                combined.includes('chấp thuận yêu cầu') ||
                combined.includes('trả hàng') ||
                combined.includes('hoàn tiền') ||
                combined.includes('hàng hoàn') ||
                combined.includes('khiếu nại') ||
                combined.includes('returned') ||
                combined.includes('refund')
            ) {
                return {
                    badgeClass: 'bg-amber-500/15 text-amber-400 border-amber-500/30',
                    dotClass: 'bg-amber-400'
                };
            }

            // 4. Nhóm Đang Vận Chuyển / Đang Giao ➡️ Xanh dương
            if (
                combined.includes('vận chuyển') ||
                combined.includes('đang giao') ||
                combined.includes('shipping') ||
                combined.includes('transit')
            ) {
                return {
                    badgeClass: 'bg-sky-500/15 text-sky-400 border-sky-500/30',
                    dotClass: 'bg-sky-400'
                };
            }

            // Fallback mặc định: Xanh lục thay vì xám xịt
            return {
                badgeClass: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30',
                dotClass: 'bg-emerald-400'
            };
        };

        const processExcel = (rows) => {
            if (rows.length < 2) return;
            setIsProcessing(true);
            let headerIdx = 0;
            for (let i = 0; i < Math.min(15, rows.length); i++) {
                const rowStr = (rows[i] || []).join(' ').toLowerCase();
                if (rowStr.includes('mã đơn hàng') || rowStr.includes('mã giao dịch') || rowStr.includes('loại giao dịch') || rowStr.includes('order id') || rowStr.includes('mã tham chiếu')) { headerIdx = i; break; }
            }

            if (!rows[headerIdx]) {
                alert('Lỗi định dạng file: Không tìm thấy dòng tiêu đề (Mã đơn hàng, Loại giao dịch).');
                setIsProcessing(false);
                return;
            }

            const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());
            const findCol = (keys) => {
                for (const k of keys) {
                    const cleanK = String(k || '').toLowerCase().trim();
                    const idx = headers.findIndex(h => h === cleanK);
                    if (idx !== -1) return idx;
                }
                for (const k of keys) {
                    const cleanK = String(k || '').toLowerCase().trim();
                    if (!cleanK) continue;
                    const idx = headers.findIndex(h => h.includes(cleanK));
                    if (idx !== -1) return idx;
                }
                return -1;
            };

            const allHeaderStr = rows.slice(0, 5).map(r => (r || []).join(' ').toLowerCase()).join(' ');
            const isBalance = allHeaderStr.includes('loại giao dịch') && (allHeaderStr.includes('số dư') || allHeaderStr.includes('rút tiền') || allHeaderStr.includes('số tiền'));
            const isIncome = !isBalance && (allHeaderStr.includes('mã đơn hàng') || allHeaderStr.includes('order id') || allHeaderStr.includes('mã tham chiếu') || allHeaderStr.includes('doanh thu') || allHeaderStr.includes('order.all') || allHeaderStr.includes('trạng thái đơn'));

            let newTransactions = [];
            let updatedOrders = [];
            let logs = [];
            let newAccounts = [];

            // Check if accounts exist
            const shopeeWalletName = 'Ví Shopee - 0945445497';
            const defaultBankName = 'TÀI KHOẢN CÔNG TY';

            const accountsList = accounts || [];
            let walletAcc = accountsList.find(a => String(a.accountName).toLowerCase().includes('ví shopee'));
            let bankAcc = accountsList.find(a => String(a.accountName).toLowerCase().includes('công ty'));

            let finalWalletName = walletAcc ? walletAcc.accountName : shopeeWalletName;
            let finalBankName = bankAcc ? bankAcc.accountName : defaultBankName;

            if (!walletAcc) newAccounts.push({ id: 'ACC_SHOPEE_' + Date.now(), accountName: finalWalletName, balance: 0 });
            if (!bankAcc) newAccounts.push({ id: 'ACC_BANK_' + Date.now(), accountName: finalBankName, balance: 0 });

            // Hàm so khớp trạng thái tuyệt đối theo Exact Match Rule (ưu tiên trạng thái Trả hàng/Hoàn tiền)
            const mapFileOrderStatus = (rawStatus, rawReturnStatus, currentStatus) => {
                const sClean = normalizeStatus(rawStatus);
                const rClean = normalizeStatus(rawReturnStatus);
                
                // 1. ƯU TIÊN SỐ 1: Trạng thái Trả hàng/Hoàn tiền từ cột riêng hoặc cột trạng thái chung
                const hasReturn = rClean && rClean !== '-' && rClean !== 'n/a' && rClean !== 'none' && rClean !== 'null' && rClean !== 'không' && !rClean.startsWith('0');
                if (hasReturn || sClean.includes('trả hàng') || sClean.includes('hoàn tiền') || sClean.includes('chấp thuận yêu cầu') || sClean.includes('returned') || sClean.includes('refund')) {
                    return 'Hàng Hoàn';
                }

                // 2. Đã hủy / Cancelled ➡️ Đơn Huỷ
                if (sClean.includes('hủy') || sClean.includes('huỷ') || sClean.includes('cancelled') || sClean.includes('canceled')) {
                    return 'Đơn Huỷ';
                }

                // 3. Hoàn thành / Completed ➡️ Đối Soát Thành Công
                if (sClean === 'hoàn thành' || sClean === 'completed' || sClean.includes('hoàn thành') || sClean.includes('thành công')) {
                    return 'Đối Soát Thành Công';
                }

                // 4. Đã giao / Delivered / Đã nhận hàng ➡️ Đã Bàn Giao
                if (sClean === 'đã giao' || sClean === 'delivered' || sClean.includes('đã giao') || sClean.includes('giao thành công') || sClean.includes('người mua xác nhận đã nhận được hàng') || sClean.includes('đã nhận')) {
                    return 'Đã Bàn Giao';
                }

                // 5. Đang vận chuyển / Đang giao hàng / In Transit
                if (sClean.includes('vận chuyển') || sClean.includes('đang giao') || sClean.includes('transit') || sClean.includes('shipping')) {
                    return 'Đang Vận Chuyển';
                }

                // 6. Chờ xác nhận / Chờ lấy hàng / To Ship
                if (sClean.includes('chờ lấy') || sClean.includes('chờ xác nhận') || sClean.includes('to ship') || sClean.includes('chờ giao')) {
                    if (currentStatus && (currentStatus.includes('Sản Xuất') || currentStatus.includes('Đóng Gói') || currentStatus === 'Chờ Giao Kho')) {
                        return currentStatus;
                    }
                    return 'Chờ Sản Xuất';
                }
                
                return currentStatus || 'Chờ Sản Xuất';
            };

            if (isIncome) {
                const isOrderAllFile = fileName.toLowerCase().includes('order.all') || allHeaderStr.includes('order.all') || headers.some(h => h.includes('trạng thái đơn'));
                setReportType(isOrderAllFile ? 'ORDER.ALL (Báo Cáo Đơn Hàng)' : 'INCOME (Báo Cáo Doanh Thu)');

                let iCode = findCol(['mã đơn hàng', 'mã giao dịch', 'order id', 'mã tham chiếu', 'order sn']);
                let iStatus = findCol(['trạng thái đơn hàng', 'trạng thái đơn', 'trạng thái', 'order status', 'status']);
                let iReturnStatus = findCol(['trạng thái trả hàng/hoàn tiền', 'trạng thái trả hàng', 'trạng thái hoàn tiền', 'trạng thái hoàn', 'return / refund status', 'return status', 'trả hàng/hoàn tiền']);

                // Tiền thực tế Shopee trả (Nhận diện chính xác, loại trừ phí NTTD quảng cáo có chứa chữ "doanh thu")
                const findRevenueCol = () => {
                    const exactKeys = [
                        'doanh thu đơn hàng', 
                        'doanh thu đơn hàng (ước tính)', 
                        'số tiền được ghi nhận', 
                        'tổng tiền đã thanh toán', 
                        'số tiền chuyển khoản', 
                        'thu nhập ròng', 
                        'net amount',
                        'tổng tiền thanh toán'
                    ];
                    let idx = headers.findIndex(h => exactKeys.includes(h));
                    if (idx !== -1) return idx;

                    idx = headers.findIndex(h => 
                        (h.startsWith('doanh thu đơn hàng') || h === 'doanh thu' || h.includes('doanh thu đơn hàng')) && 
                        !h.includes('phí') && !h.includes('nttd') && !h.includes('hiển thị') && !h.includes('dịch vụ') && !h.includes('quảng cáo')
                    );
                    if (idx !== -1) return idx;

                    return headers.findIndex(h => 
                        (h.includes('quyết toán') || h.includes('thu nhập ròng') || h.includes('số tiền ghi nhận') || h.includes('chuyển khoản')) && 
                        !h.includes('phí') && !h.includes('nttd') && !h.includes('hiển thị')
                    );
                };
                let iRevenue = findRevenueCol();

                // Nhóm 1: Tiền Hàng (Gross)
                let iTotalSale = findCol(['giá sản phẩm', 'tổng giá bán (sản phẩm)', 'tổng giá bán', 'tổng số tiền người mua thanh toán', 'tổng số tiền', 'tổng tiền sản phẩm', 'tổng giá trị đơn hàng (vnd)', 'tổng giá trị đơn hàng', 'giá gốc']);
                let iOrderTotal = findCol(['tổng giá trị đơn hàng (vnd)', 'tổng giá trị đơn hàng']);
                let iBuyerPaid = findCol(['tổng số tiền người mua thanh toán']);
                let iReturnShip = findCol(['phí vận chuyển trả hàng (đơn trả hàng/hoàn tiền)', 'phí vận chuyển trả hàng', 'phí trả hàng']);
                let iPiShipRefund = findCol(['phí vận chuyển được hoàn bởi piship', 'phí vận chuyển trả hàng được hoàn bởi piship', 'phí vận chuyển trả hàng được hoàn', 'được hoàn bởi piship', 'hoàn bởi piship']);
                let iReturnQty = findCol(['số lượng sản phẩm được hoàn trả']);
                let iItemPrice = findCol(['giá ưu đãi', 'giá sản phẩm', 'giá gốc']);

                // Nhóm 2: Bù trừ
                let iRefund = findCol(['số tiền hoàn lại']);
                let iSellerVoucher = findCol(['mã ưu đãi do người bán chịu', 'voucher của shop', 'mã giảm giá của shop', 'tổng số tiền được người bán trợ giá', 'người bán trợ giá']);

                // Nhóm 3: Vận chuyển
                let iShippingSeller = findCol(['phí vận chuyển do người bán trả', 'phí vận chuyển người bán trả', 'phí vận chuyển người bán chịu', 'người bán trợ giá vận chuyển', 'shop trợ giá vận chuyển']);
                let iShippingBuyer = findCol(['phí vận chuyển người mua trả']);
                let iShippingActual = findCol(['phí vận chuyển thực tế', 'phí trả đtgh', 'phí vận chuyển ước tính']);
                let iShippingShopee = findCol(['phí vận chuyển được trợ giá từ shopee', 'được shopee trợ giá', 'shopee trợ giá vận chuyển']);

                // Nhóm 4: Phí sàn
                let iFixedFee = findCol(['phí cố định']);
                let iServiceFee = findCol(['phí dịch vụ']);
                let iPaymentFee = findCol(['phí xử lý giao dịch', 'phí thanh toán']);
                let iAffiliate = findCol(['phí hoa hồng tiếp thị liên kết', 'phí hoa hồng', 'hoa hồng', 'affiliate']);
                let iPiShip = findCol(['phí dịch vụ piship']);
                let iNTTD = findCol(['phí dịch vụ hiển thị nttd', 'hiển thị nttd', 'nttd']);
                let iTroGia = findCol(['trợ giá']);

                // Nhóm 5: Thuế
                let iTaxVAT = findCol(['thuế gtgt', 'thuế thu hộ']);
                let iTaxTNCN = findCol(['thuế tncn', 'thuế']);

                let iProd = findCol(['tên sản phẩm', 'product name']);
                let iVar = findCol(['tên phân loại', 'tên phân loại hàng', 'variation name', 'variation']);
                let iQty = findCol(['số lượng', 'quantity']);
                let iDate = findCol(['ngày đặt hàng', 'thời gian tạo đơn', 'thời gian đặt hàng', 'order creation date', 'ngày tạo đơn', 'thời gian thanh toán', 'ngày thanh toán']);

                if (iCode === -1 || (iRevenue === -1 && iTotalSale === -1)) {
                    alert('Không tìm thấy cột Mã Đơn Hàng hoặc cột Tiền (Doanh thu/Giá sản phẩm)! Các cột hiện có: ' + headers.join(', '));
                    setIsProcessing(false);
                    return;
                }

                // Nhóm các dòng theo mã đơn hàng
                const fileOrderMap = {};
                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (!cols[iCode]) continue;
                    let oCode = String(cols[iCode]).trim();

                    // If oCode is just a sequence number (1, 2, 3) or too short, scan the row for a real order code
                    if (oCode.length < 5) {
                        for (let c = 0; c < cols.length; c++) {
                            const val = String(cols[c] || '').trim();
                            if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                oCode = val;
                                break;
                            }
                        }
                    }

                    if (!oCode || oCode.length < 5 || oCode.toLowerCase().includes('mã đơn')) continue;

                    if (!fileOrderMap[oCode]) {
                        fileOrderMap[oCode] = { rows: [], cols: cols };
                    }
                    fileOrderMap[oCode].rows.push(cols);
                }

                Object.keys(fileOrderMap).forEach((oCode, idx) => {
                    const orderRows = fileOrderMap[oCode].rows;
                    const mainCols = fileOrderMap[oCode].cols;

                    let txDate = safeDateFull;
                    if (iDate > -1 && mainCols[iDate]) {
                        let rawD = String(mainCols[iDate]).trim();
                        if (rawD.length >= 10) {
                            if (rawD.substring(2, 3) === '/' || rawD.substring(2, 3) === '-') {
                                let parts = rawD.split(' ')[0].split(/[\/\-]/);
                                if (parts.length === 3) txDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')} 12:00`;
                            } else if (rawD.substring(4, 5) === '-') {
                                txDate = rawD.replace('T', ' ').substring(0, 16);
                                if (txDate.length === 10) txDate += " 12:00";
                            }
                        }
                    }

                    const parseAmt = (val) => {
                        if (val === undefined || val === null || val === '') return 0;
                        return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0;
                    };

                    const sumCol = (colIdx) => {
                        if (colIdx === -1) return 0;
                        return orderRows.reduce((sum, r) => sum + parseAmt(r[colIdx]), 0);
                    };

                    const getOrderLevelVal = (colIdx) => {
                        if (colIdx === -1) return 0;
                        if (orderRows.length === 1) return parseAmt(mainCols[colIdx]);
                        const vals = orderRows.map(r => parseAmt(r[colIdx])).filter(v => v !== 0);
                        if (vals.length === 0) return 0;
                        const allIdentical = vals.every(v => v === vals[0]);
                        if (allIdentical && vals.length > 1) {
                            return vals[0];
                        }
                        return vals.reduce((a, b) => a + b, 0);
                    };

                    const cleanCode = oCode.split(' | ')[0].trim().toUpperCase();
                    const matchOrder = (orders || []).find(o => {
                        const dbCode = String(o.orderCode || o.id || '').toUpperCase().trim();
                        if (cleanCode.length < 5) return dbCode === cleanCode;
                        return dbCode === cleanCode || dbCode.includes(cleanCode) || cleanCode.includes(dbCode);
                    });

                    const rawStatus = (iStatus > -1 && mainCols[iStatus]) ? String(mainCols[iStatus]).trim() : '';
                    const rawReturnStatus = (iReturnStatus > -1 && mainCols[iReturnStatus]) ? String(mainCols[iReturnStatus]).trim() : '';
                    const mappedStatus = mapFileOrderStatus(rawStatus, rawReturnStatus, matchOrder ? matchOrder.status : '');

                    const isCancelled = mappedStatus === 'Đơn Huỷ';
                    const isReturned = mappedStatus === 'Hàng Hoàn';
                    const isDisputeResolved = (rawReturnStatus && rawReturnStatus.toLowerCase().includes('khiếu nại')) ||
                        (rawStatus && rawStatus.toLowerCase().includes('khiếu nại'));

                    // 1. Gross Revenue (Tổng giá trị đơn hàng):
                    let orderTotalColVal = (iOrderTotal > -1 && mainCols[iOrderTotal]) ? parseAmt(mainCols[iOrderTotal]) : 0;
                    let rawTotalSale = orderTotalColVal > 0 ? orderTotalColVal : sumCol(iTotalSale);
                    if (rawTotalSale <= 0) {
                        rawTotalSale = sumCol(iItemPrice) || sumCol(iBuyerPaid);
                    }
                    let grossRevenue = isCancelled ? 0 : rawTotalSale;

                    // 2. Phí sàn (Shopee thu):
                    let rawFixed = isCancelled ? 0 : sumCol(iFixedFee);
                    let rawService = isCancelled ? 0 : sumCol(iServiceFee);
                    let rawPayment = isCancelled ? 0 : sumCol(iPaymentFee);
                    let rawAffiliate = isCancelled ? 0 : sumCol(iAffiliate);
                    let rawPiShip = isCancelled ? 0 : sumCol(iPiShip);
                    let rawNTTD = isCancelled ? 0 : sumCol(iNTTD);
                    let rawTroGia = isCancelled ? 0 : sumCol(iTroGia);
                    let rawTaxVAT = isCancelled ? 0 : sumCol(iTaxVAT);
                    let rawTaxTNCN = isCancelled ? 0 : sumCol(iTaxTNCN);

                    let fixedFee = Math.abs(rawFixed);
                    let paymentFee = Math.abs(rawPayment);
                    let serviceFee = Math.abs(rawService) + Math.abs(rawPiShip) + Math.abs(rawNTTD);
                    let affiliateFee = Math.abs(rawAffiliate);
                    let tax = Math.abs(rawTaxVAT) + Math.abs(rawTaxTNCN);
                    let shopVoucher = isCancelled ? 0 : Math.abs(sumCol(iSellerVoucher));
                    let totalFees = fixedFee + paymentFee + serviceFee + affiliateFee + tax;

                    // 3. Phí vận chuyển và cước hoàn hàng:
                    // Phí cước hoàn trả: Kiểm tra xem có được PiShip bồi hoàn cước hay không
                    let rawReturnShip = (iReturnShip > -1) ? getOrderLevelVal(iReturnShip) : 0;
                    let rawPiShipRefund = (iPiShipRefund > -1) ? getOrderLevelVal(iPiShipRefund) : 0;
                    let returnShippingFee = Math.max(0, Math.abs(rawReturnShip) - Math.abs(rawPiShipRefund));
                    let piShipFee = (iPiShip > -1) ? Math.abs(getOrderLevelVal(iPiShip)) : 0;

                    // Cước vận chuyển chiều đi do Người Bán thực tế chi trả (Tuyệt đối không trừ phí vận chuyển thực tế do Shopee/Người mua trả)
                    let sellerOutgoingShip = 0;
                    if (iShippingSeller > -1) {
                        sellerOutgoingShip = Math.abs(getOrderLevelVal(iShippingSeller));
                    } else if (iShippingActual > -1) {
                        let actualShip = Math.abs(getOrderLevelVal(iShippingActual));
                        let buyerShip = (iShippingBuyer > -1) ? Math.abs(getOrderLevelVal(iShippingBuyer)) : 0;
                        let shopeeShip = (iShippingShopee > -1) ? Math.abs(getOrderLevelVal(iShippingShopee)) : 0;
                        sellerOutgoingShip = Math.max(0, actualShip - buyerShip - shopeeShip);
                    }
                    let shippingFee = (isCancelled ? 0 : sellerOutgoingShip) + returnShippingFee;

                    // 4. Số tiền hoàn lại cho người mua (refundAmount):
                    let rawRefund = sumCol(iRefund);
                    let returnQtyTotal = 0;
                    let refundValFromItems = 0;
                    orderRows.forEach(r => {
                        let rQty = (iReturnQty > -1 && r[iReturnQty]) ? parseAmt(r[iReturnQty]) : 0;
                        if (rQty > 0) {
                            returnQtyTotal += rQty;
                            let pPrice = (iItemPrice > -1 && r[iItemPrice]) ? parseAmt(r[iItemPrice]) : 0;
                            refundValFromItems += rQty * pPrice;
                        }
                    });

                    let refundAmount = Math.abs(rawRefund);
                    if (refundAmount <= 0 && refundValFromItems > 0) {
                        refundAmount = refundValFromItems;
                    }
                    if (refundAmount <= 0 && isReturned && !isDisputeResolved) {
                        refundAmount = (iBuyerPaid > -1 && parseAmt(mainCols[iBuyerPaid]) > 0) ? parseAmt(mainCols[iBuyerPaid]) : grossRevenue;
                    }

                    // 5. Tiền Shopee thanh toán / quyết toán (actualShopeePaid) & Net Thực Nhận:
                    let actualShopeePaid = isCancelled ? 0 : (iRevenue > -1 ? getOrderLevelVal(iRevenue) : 0);
                    let calculatedReconciliation = grossRevenue - totalFees - shopVoucher - shippingFee;
                    let netRevenue = 0;

                    if (!isCancelled) {
                        if (actualShopeePaid !== 0) {
                            netRevenue = actualShopeePaid;
                        } else if (isReturned) {
                            // Đơn hoàn 100%: Người bán không nhận tiền hàng, chỉ chịu phí dịch vụ PiShip (hoặc cước hoàn chưa được bồi hoàn)
                            netRevenue = -(piShipFee + returnShippingFee);
                        } else if (isDisputeResolved || rawStatus === 'Hoàn thành') {
                            netRevenue = Math.max(0, grossRevenue - totalFees - shopVoucher - shippingFee);
                        } else if (grossRevenue > 0) {
                            netRevenue = Math.max(0, grossRevenue - totalFees - shopVoucher - shippingFee);
                        }
                    }

                    // Chênh lệch đối soát
                    let delta = (!isCancelled && actualShopeePaid > 0) ? (actualShopeePaid - calculatedReconciliation) : 0;
                    let isWarning = (!isCancelled && actualShopeePaid > 0 && Math.abs(delta) > 5000);

                    // Trích xuất danh sách sản phẩm từ các dòng trong file
                    let extractedProducts = [];
                    orderRows.forEach(r => {
                        let pName = iProd >= 0 && r[iProd] ? String(r[iProd]).trim() : '';
                        let pVar = iVar >= 0 && r[iVar] ? String(r[iVar]).trim() : '';
                        let q = iQty >= 0 && r[iQty] ? (parseInt(r[iQty]) || 1) : 1;
                        if (pName) {
                            extractedProducts.push({ name: pName + (pVar ? ' - ' + pVar : ''), quantity: q, price: 0 });
                        }
                    });

                    let displayFileStatus = rawStatus || mappedStatus;
                    if (rawReturnStatus && rawReturnStatus !== '-' && rawReturnStatus !== 'n/a' && !rawReturnStatus.startsWith('0')) {
                        displayFileStatus = rawReturnStatus;
                    }

                    // Giá trị nội bộ ban đầu trên hệ thống RF Workspace Pro:
                    let expected = matchOrder ? parseAmt(matchOrder.totalAmount || matchOrder.revenue) : 0;

                    if (matchOrder) {
                        const effectiveTxDate = (iDate > -1 && mainCols[iDate]) ? txDate : (matchOrder.createdAt || matchOrder.date || txDate || safeDateFull);

                        const isSettled = mappedStatus === 'Đối Soát Thành Công' || (netRevenue > 0 && isDisputeResolved) || (actualShopeePaid > 0 && !isCancelled);

                        let updatedOrderObj = {
                            ...matchOrder,
                            revenue: isCancelled ? 0 : (isReturned && netRevenue <= 0 ? 0 : (grossRevenue > 0 ? grossRevenue : Number(matchOrder.revenue || 0))),
                            feeFixed: isCancelled ? 0 : fixedFee,
                            feeService: isCancelled ? 0 : serviceFee,
                            feePayment: isCancelled ? 0 : paymentFee,
                            feeAffiliate: isCancelled ? 0 : affiliateFee,
                            shopVoucher: isCancelled ? 0 : shopVoucher,
                            tax: isCancelled ? 0 : tax,
                            isReconciled: isSettled,
                            reconciledAt: isSettled ? (matchOrder.reconciledAt || effectiveTxDate) : (matchOrder.reconciledAt || ''),
                            status: (isDisputeResolved && netRevenue > 0) ? 'Đối Soát Thành Công' : mappedStatus
                        };

                        // Bổ sung danh sách sản phẩm nếu đơn hàng trên hệ thống chưa có thông tin sản phẩm
                        if (extractedProducts.length > 0 && (!matchOrder.products || matchOrder.products === '[]' || matchOrder.products.length === 0)) {
                            updatedOrderObj.products = JSON.stringify(extractedProducts);
                        }

                        updatedOrders.push(updatedOrderObj);

                        // Check for duplicate transactions before creating new ones (chỉ ghi nhận khi đơn đã đối soát/thanh toán tiền về ví)
                        const hasTx = (transactions || []).some(t =>
                            (String(t.title || '').includes(cleanCode)) ||
                            (String(t.note || '').includes(cleanCode))
                        );

                        const walletTargetId = walletAcc ? walletAcc.id : (newAccounts[0] ? newAccounts[0].id : 'ACC_SHOPEE');

                        if (!hasTx && isSettled && !isCancelled) {
                            let baseTxId = 'TXN_INC_' + Date.now() + '_' + idx;
                            newTransactions.push({
                                id: baseTxId + '_REV',
                                type: 'Thu',
                                category: 'Doanh Thu Bán Hàng',
                                amount: grossRevenue,
                                fromAccount: '',
                                toAccount: walletTargetId,
                                title: `Doanh thu Shopee: ${oCode}` + (isDisputeResolved ? ' (Giải quyết khiếu nại)' : ''),
                                date: effectiveTxDate,
                                note: `Kênh: ${matchOrder.channel || 'Shopee'} | Khách: ${matchOrder.customer || ''}`,
                                isAuto: true
                            });

                            if (totalFees > 0) {
                                newTransactions.push({
                                    id: baseTxId + '_FEE',
                                    type: 'Chi',
                                    category: 'Chi Phí Bán Hàng',
                                    amount: totalFees,
                                    fromAccount: walletTargetId,
                                    toAccount: '',
                                    title: `Phí sàn Shopee: ${oCode}`,
                                    date: effectiveTxDate,
                                    note: `Phí sàn đơn ${oCode}`,
                                    isAuto: true
                                });
                            }

                            // Phí ship quá cân
                            const buyerShip = Math.abs(sumCol(iShippingBuyer));
                            const actualShip = Math.abs(sumCol(iShippingActual));
                            const shopeeShip = Math.abs(sumCol(iShippingShopee));
                            const shipOverweight = Math.max(0, actualShip - (buyerShip + shopeeShip));

                            if (shipOverweight > 0) {
                                newTransactions.push({
                                    id: baseTxId + '_SHIP_OVERWEIGHT',
                                    type: 'Chi',
                                    category: 'Chi Phí Vận Chuyển',
                                    amount: shipOverweight,
                                    fromAccount: walletTargetId,
                                    toAccount: '',
                                    title: `Phí ship quá cân: ${oCode}`,
                                    date: txDate,
                                    note: `Chênh lệch phí ship do ĐVVC cân lại đơn ${oCode}`,
                                    isAuto: true
                                });
                            }
                        }

                        // Cước hoàn hàng do Shopee trừ (nếu có cột 44 > 0)
                        if (returnShippingFee > 0) {
                            let baseTxId = 'TXN_INC_' + Date.now() + '_' + idx;
                            newTransactions.push({
                                id: baseTxId + '_RETURN_SHIP',
                                type: 'Chi',
                                category: 'Chi Phí Vận Chuyển',
                                amount: returnShippingFee,
                                fromAccount: walletTargetId,
                                toAccount: '',
                                title: `Phí cước hoàn hàng: ${oCode}`,
                                date: txDate,
                                note: `Cước hoàn hàng do Shopee trừ đơn ${oCode}`,
                                isAuto: true
                            });
                        }

                        // Phí xử lý đơn hàng hoàn (ưu tiên đọc phí dịch vụ PiShip thực tế)
                        if (isReturned && netRevenue <= 0) {
                            const returnProcessingFee = (piShipFee > 0) ? piShipFee : (returnShippingFee > 0 ? returnShippingFee : 2700);
                            let baseTxId = 'TXN_INC_' + Date.now() + '_' + idx;
                            newTransactions.push({
                                id: baseTxId + '_RETURN_FEE',
                                type: 'Chi',
                                category: 'Chi Phí Hàng Hoàn',
                                amount: returnProcessingFee,
                                fromAccount: walletTargetId,
                                toAccount: '',
                                title: `Phí xử lý đơn hoàn: ${oCode}` + (rawPiShipRefund > 0 ? ' (PiShip hoàn cước)' : ''),
                                date: txDate,
                                note: `Phí Shopee ${returnProcessingFee.toLocaleString('vi-VN')}đ xử lý hàng hoàn đơn ${oCode}` + (rawPiShipRefund > 0 ? ` (Cước hoàn ${Number(rawReturnShip).toLocaleString('vi-VN')}đ được PiShip hoàn 100%)` : ''),
                                isAuto: true
                            });
                        }

                        logs.push({
                            oCode,
                            fileStatus: displayFileStatus,
                            mappedStatus: mappedStatus,
                            customerName: matchOrder.customer || '',
                            expected: expected,
                            netRevenue: netRevenue,
                            grossRevenue: grossRevenue,
                            totalFees: totalFees,
                            shippingFee: shippingFee,
                            returnShippingFee: returnShippingFee,
                            rawPiShipRefund: Math.abs(rawPiShipRefund),
                            rawReturnShip: Math.abs(rawReturnShip),
                            refundAmount: refundAmount,
                            isDisputeResolved: isDisputeResolved,
                            isReturned: isReturned,
                            isCancelled: isCancelled,
                            shopVoucher: shopVoucher,
                            delta,
                            isWarning,
                            type: 'income'
                        });
                    } else {
                        logs.push({
                            oCode,
                            fileStatus: displayFileStatus,
                            mappedStatus: mappedStatus,
                            isError: true,
                            msg: 'Không tìm thấy đơn hàng trên hệ thống',
                            expected: 0,
                            grossRevenue: grossRevenue,
                            totalFees: totalFees,
                            shippingFee: shippingFee,
                            returnShippingFee: returnShippingFee,
                            refundAmount: refundAmount,
                            netRevenue: netRevenue,
                            type: 'income'
                        });
                    }
                });
            } else if (isBalance) {
                setReportType('BALANCE (Số dư ví Shopee)');
                let iType = findCol(['loại giao dịch']);
                let iAmount = findCol(['số tiền (vnd)', 'số tiền']);
                let iDesc = findCol(['mô tả', 'mã đơn hàng/mã hoàn tiền']);
                let iDate = findCol(['ngày', 'thời gian', 'date']);

                if (iType === -1 || iAmount === -1) {
                    alert('Không tìm thấy cột Loại giao dịch hoặc Số tiền trong file Báo cáo Số dư ví này!');
                    setIsProcessing(false);
                    return;
                }

                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (!cols[iType]) continue;
                    const typeStr = String(cols[iType]).toLowerCase();
                    const descStr = cols[iDesc] ? String(cols[iDesc]) : '';
                    let cleanVal = String(cols[iAmount] || '0').replace(/[^0-9.-]/g, '');
                    let rowAmt = parseFloat(cleanVal) || 0;

                    let txDate = safeDateFull;
                    if (iDate > -1 && cols[iDate]) {
                        let rawD = String(cols[iDate]).trim();
                        if (rawD.length >= 10) {
                            if (rawD.substring(2, 3) === '/' || rawD.substring(2, 3) === '-') {
                                let parts = rawD.split(' ')[0].split(/[\/\-]/);
                                if (parts.length === 3) txDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')} 12:00`;
                            } else if (rawD.substring(4, 5) === '-') {
                                txDate = rawD.replace('T', ' ').substring(0, 16);
                                if (txDate.length === 10) txDate += " 12:00";
                            }
                        }
                    }

                    if (typeStr.includes('rút tiền')) {
                        newTransactions.push({
                            id: 'TXN_WD_' + Date.now() + '_' + i,
                            type: 'Điều Chuyển',
                            category: 'Rút Tiền Shopee',
                            amount: Math.abs(rowAmt),
                            fromAccount: finalWalletName,
                            toAccount: finalBankName,
                            title: `Rút tiền từ Ví Shopee`,
                            date: txDate,
                            note: descStr,
                            isAuto: true
                        });
                        logs.push(`✅ Rút tiền về Ngân hàng: ${Math.abs(rowAmt).toLocaleString('vi-VN')}đ`);
                    }
                }
            } else {
                alert('Định dạng file không được hỗ trợ. Hãy tải lên Báo cáo đơn hàng (Order.all), Báo cáo doanh thu (Income) hoặc Báo cáo số dư ví!');
                setIsProcessing(false);
                return;
            }

            setPreviewLogs(logs);
            setResultPayload({
                Orders: updatedOrders,
                Transactions: newTransactions,
                Accounts: newAccounts.length > 0 ? newAccounts : undefined
            });
            setProgress(100);
            setIsProcessing(false);
        };

        const handleUpload = async (file) => {
            if (!file) return;
            setFileName(file.name); setIsProcessing(true); setProgress(0); setPreviewLogs([]);
            try {
                if (typeof window.ensureXLSXLoaded === 'function') {
                    await window.ensureXLSXLoaded();
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        let wb;
                        const data = new Uint8Array(e.target.result);
                        try {
                            wb = window.XLSX.read(data, { type: 'array' });
                        } catch (errArr) {
                            wb = window.XLSX.read(e.target.result, { type: 'binary' });
                        }
                        let bestRows = [];
                        for (let s of wb.SheetNames) {
                            const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[s], { header: 1, defval: '' });
                            let foundHeader = false;
                            for (let i = 0; i < Math.min(15, rows.length); i++) {
                                const rowStr = (rows[i] || []).join(' ').toLowerCase();
                                if (rowStr.includes('mã đơn hàng') || rowStr.includes('mã giao dịch') || rowStr.includes('loại giao dịch') || rowStr.includes('order id') || rowStr.includes('mã tham chiếu') || rowStr.includes('trạng thái đơn')) {
                                    foundHeader = true; break;
                                }
                            }
                            if (foundHeader && rows.length > bestRows.length) {
                                bestRows = rows;
                            }
                        }
                        if (bestRows.length === 0) bestRows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
                        processExcel(bestRows);
                    } catch (err) {
                        console.error("Lỗi đọc file Excel:", err);
                        alert("Lỗi đọc file Excel!");
                        setIsProcessing(false);
                    }
                };
                reader.readAsArrayBuffer(file);
            } catch (loadErr) {
                console.error("Lỗi nạp thư viện XLSX:", loadErr);
                alert("Không thể nạp thư viện xử lý Excel. Vui lòng thử lại!");
                setIsProcessing(false);
            }
        };

        const submit = async () => {
            if (!resultPayload) return;
            setIsProcessing(true);
            try {
                await pushDeltas(resultPayload, 'Đã cập nhật trạng thái & đối soát tài chính!', 'fa-check-circle');
                onClose();
            } catch (e) {
                alert('Lỗi lưu dữ liệu: ' + e.message);
                setIsProcessing(false);
            }
        };

        return (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4 backdrop-blur-md">
                <div className="bg-[#111] border border-emerald-500/30 w-full max-w-4xl rounded-2xl flex flex-col max-h-[90vh] shadow-[0_0_50px_rgba(16,185,129,0.1)] overflow-hidden">
                    <div className="p-4 border-b border-[#222] flex justify-between items-center bg-[#0a0a0a]">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-500 flex items-center justify-center border border-emerald-500/30 shadow-sm">
                                <i className="fas fa-file-invoice-dollar text-lg"></i>
                            </div>
                            <div>
                                <div className="font-black text-lg text-white tracking-wide">TRẠM QUÉT FILE ĐƠN HÀNG (ORDER.ALL)</div>
                                <div className="text-[10px] text-emerald-500 font-bold tracking-widest uppercase">Cập nhật sản phẩm, phí sàn & trạng thái đơn chuẩn</div>
                            </div>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors"><i className="fas fa-times"></i></button>
                    </div>

                    <div className="p-5 flex-1 overflow-y-auto custom-scrollbar flex flex-col">
                        {!resultPayload ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center p-10 animate-fade-in">
                                <i className="fas fa-cloud-upload-alt text-6xl text-emerald-500/30 mb-5"></i>
                                <h3 className="text-xl font-black text-white mb-2">Tải Báo Cáo Shopee Lên Đây</h3>
                                <p className="text-sm text-gray-400 mb-6 max-w-md">Hỗ trợ file Báo cáo đơn hàng (Order.all), Báo cáo doanh thu (Income) để cập nhật trạng thái đơn & phí sàn, hoặc Báo cáo số dư ví.</p>

                                <label className="relative overflow-hidden cursor-pointer bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-black px-8 py-3.5 rounded-xl shadow-lg shadow-emerald-900/30 transition-all active:scale-95 group border border-emerald-400/30">
                                    <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={(e) => handleUpload(e.target.files[0])} />
                                    <span className="flex items-center gap-2"><i className="fas fa-file-excel group-hover:animate-bounce"></i> TẢI FILE EXCEL</span>
                                </label>

                                {isProcessing && <div className="mt-5 text-emerald-500 font-bold animate-pulse"><i className="fas fa-spinner fa-spin mr-2"></i> Đang phân tích dữ liệu AI...</div>}
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col animate-slide-up">
                                <div className="bg-[#1a1a1a] border border-[#333] rounded-xl p-4 mb-4 flex justify-between items-center shadow-inner">
                                    <div>
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Loại Báo Cáo Nhận Diện</div>
                                        <div className="text-emerald-400 font-bold text-lg"><i className="fas fa-check-circle mr-1"></i> {reportType}</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Tệp tin đang xử lý</div>
                                        <div className="text-white font-bold">{fileName}</div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-4 text-center shadow-sm">
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Đơn Hàng Cập Nhật</div>
                                        <div className="text-3xl font-black text-blue-500">{resultPayload.Orders?.length || 0}</div>
                                    </div>
                                    <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-4 text-center shadow-sm">
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Phiếu Kế Toán Mới</div>
                                        <div className="text-3xl font-black text-emerald-500">{resultPayload.Transactions?.length || 0}</div>
                                    </div>
                                </div>

                                <div className="flex-1 bg-[#0a0a0a] border border-[#222] rounded-xl overflow-hidden flex flex-col shadow-inner">
                                    <div className="bg-[#111] border-b border-[#222] p-3 text-[10px] font-black text-gray-500 uppercase tracking-widest flex justify-between items-center">
                                        <span><i className="fas fa-list-alt mr-1 text-[#333]"></i> Chi tiết đối soát tự động</span>
                                        <span>{previewLogs.length} dòng dữ liệu</span>
                                    </div>
                                    <div className="p-3 text-[11px] font-medium flex-1 flex flex-col min-h-0">
                                        {previewLogs.length === 0 && <div className="text-gray-500 text-center py-4">Không có giao dịch nào mới để ghi nhận.</div>}
                                        {previewLogs.length > 0 && typeof previewLogs[0] === 'object' ? (
                                            <div className="w-full max-h-[60vh] overflow-y-auto overflow-x-auto relative rounded-xl border border-zinc-800 custom-scrollbar">
                                                <table className="w-full min-w-[750px] text-left border-collapse">
                                                    <thead>
                                                        <tr className="border-b border-[#333] text-gray-400 text-[10px] uppercase tracking-wider sticky top-0 bg-[#121216] z-20">
                                                            <th className="p-2.5 font-black sticky left-0 top-0 bg-[#121216] z-30 shadow-[2px_0_5px_rgba(0,0,0,0.5)]">Mã Đơn</th>
                                                            <th className="p-2.5 font-black">Trạng Thái (File)</th>
                                                            <th className="p-2.5 font-black text-right">Giá Trị Nội Bộ</th>
                                                            <th className="p-2.5 font-black text-right text-emerald-500">Gross Shopee</th>
                                                            <th className="p-2.5 font-black text-right text-rose-400">Phí Sàn</th>
                                                            <th className="p-2.5 font-black text-right text-rose-400">Phí Vận Chuyển</th>
                                                            <th className="p-2.5 font-black text-right text-sky-400">Net Thực Nhận</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {previewLogs.map((log, idx) => {
                                                            const fullStatusText = log.fileStatus || log.mappedStatus || 'Chưa rõ';
                                                            const shortenedText = shortenStatusText(fullStatusText);
                                                            const { badgeClass, dotClass } = getStatusBadgeStyle(log.fileStatus, log.mappedStatus);

                                                            return (
                                                                <tr key={idx} className={`border-b border-[#222] hover:bg-[#1a1a1a] transition-colors ${log.isError ? 'opacity-50 grayscale' : ''}`}>
                                                                    <td className="p-2.5 font-mono text-gray-200 font-bold sticky left-0 bg-[#121216] z-10 shadow-[2px_0_5px_rgba(0,0,0,0.5)] whitespace-nowrap">
                                                                        {log.oCode}
                                                                    </td>
                                                                    <td className="p-2.5 max-w-[220px] truncate whitespace-nowrap overflow-hidden" title={fullStatusText}>
                                                                        {log.isError ? (
                                                                            <span className="text-gray-500 font-medium flex items-center gap-1 truncate">
                                                                                <i className="fas fa-times-circle text-rose-500 text-xs shrink-0"></i> 
                                                                                <span className="truncate">{shortenedText || 'Không tìm thấy'}</span>
                                                                            </span>
                                                                        ) : (
                                                                            <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md font-bold text-[10px] border max-w-full truncate ${badgeClass}`}>
                                                                                <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${dotClass}`}></span>
                                                                                <span className="truncate">{shortenedText}</span>
                                                                            </span>
                                                                        )}
                                                                    </td>
                                                                    <td className="p-2.5 text-right text-gray-300 font-medium whitespace-nowrap">{log.expected > 0 ? Number(log.expected).toLocaleString('vi-VN') + 'đ' : '-'}</td>
                                                                    <td className="p-2.5 text-right text-emerald-400 font-bold whitespace-nowrap">{log.grossRevenue > 0 ? Number(log.grossRevenue).toLocaleString('vi-VN') + 'đ' : '-'}</td>
                                                                    <td className="p-2.5 text-right text-rose-300 whitespace-nowrap">{log.totalFees > 0 ? '-' + Number(log.totalFees).toLocaleString('vi-VN') + 'đ' : '-'}</td>
                                                                    <td className="p-2.5 text-right text-rose-400 font-bold whitespace-nowrap">
                                                                        {log.shippingFee > 0 ? (
                                                                            <div>
                                                                                <span>{'-' + Number(log.shippingFee).toLocaleString('vi-VN') + 'đ'}</span>
                                                                                {log.returnShippingFee > 0 && <span className="block text-[8.5px] text-rose-400/80 font-bold uppercase tracking-wider">Cước hoàn</span>}
                                                                            </div>
                                                                        ) : (log.rawPiShipRefund > 0 && log.returnShippingFee === 0) ? (
                                                                            <div>
                                                                                <span className="text-emerald-400 font-semibold text-[11px]">0đ</span>
                                                                                <span className="block text-[8px] text-emerald-400 font-bold uppercase tracking-wider">PiShip hoàn ({Number(log.rawPiShipRefund).toLocaleString('vi-VN')}đ)</span>
                                                                            </div>
                                                                        ) : '-'}
                                                                    </td>
                                                                    <td className="p-2.5 text-right whitespace-nowrap">
                                                                        {log.netRevenue > 0 ? (
                                                                            <div>
                                                                                <span className="text-sky-400 font-black text-[12px]">
                                                                                    {'+' + Number(log.netRevenue).toLocaleString('vi-VN') + 'đ'}
                                                                                </span>
                                                                                {log.refundAmount > 0 ? (
                                                                                    <span className="block text-[9.5px] text-amber-400/90 font-bold">
                                                                                        Hoàn khách: {Number(log.refundAmount).toLocaleString('vi-VN')}đ
                                                                                    </span>
                                                                                ) : (
                                                                                    <span className="block text-[8.5px] text-emerald-400/80 font-semibold">Thực nhận về ví</span>
                                                                                )}
                                                                            </div>
                                                                        ) : log.netRevenue < 0 ? (
                                                                            <div>
                                                                                <span className="text-rose-400 font-black text-[12px]">
                                                                                    {'-' + Number(Math.abs(log.netRevenue)).toLocaleString('vi-VN') + 'đ'}
                                                                                </span>
                                                                                <span className="block text-[9.5px] text-rose-300/80 font-bold">
                                                                                    {log.rawPiShipRefund > 0 ? 'Phí PiShip' : 'Mất cước hoàn'} {log.refundAmount > 0 ? `(Hoàn: ${Number(log.refundAmount).toLocaleString('vi-VN')}đ)` : ''}
                                                                                </span>
                                                                            </div>
                                                                        ) : (
                                                                            <div>
                                                                                <span className="text-zinc-400 font-bold text-[11px]">
                                                                                    {log.isCancelled ? '0đ (Hủy)' : '0đ'}
                                                                                </span>
                                                                                {log.refundAmount > 0 && (
                                                                                    <span className="block text-[9.5px] text-amber-400/90 font-bold">
                                                                                        Hoàn khách 100% ({Number(log.refundAmount).toLocaleString('vi-VN')}đ)
                                                                                    </span>
                                                                                )}
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        ) : (
                                            <div className="max-h-[60vh] overflow-y-auto space-y-1.5 custom-scrollbar">
                                                {previewLogs.map((log, idx) => (
                                                    <div key={idx} className={`p-1.5 rounded bg-[#111] border border-[#222] ${log.includes('✅') ? 'text-emerald-400' : log.includes('❌') ? 'text-rose-400' : 'text-gray-400'}`}>
                                                        {log}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {resultPayload && (
                        <div className="p-4 border-t border-[#222] bg-[#0a0a0a] flex gap-3 shrink-0">
                            <button onClick={() => { setResultPayload(null); setPreviewLogs([]); }} disabled={isProcessing} className="flex-1 py-3 bg-[#222] hover:bg-[#333] text-gray-300 font-black rounded-xl active:scale-95 transition-all text-[13px] border border-[#333]">
                                HUỶ BỎ
                            </button>
                            <button onClick={submit} disabled={isProcessing || (resultPayload.Orders?.length === 0 && resultPayload.Transactions?.length === 0)} className="flex-[2] py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-black rounded-xl shadow-lg shadow-emerald-900/30 active:scale-95 transition-all text-[13px] flex items-center justify-center gap-2 border border-emerald-400/30 disabled:opacity-50 disabled:grayscale">
                                {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG LƯU DỮ LIỆU...</> : <><i className="fas fa-save"></i> HOÀN TẤT ĐỐI SOÁT & LƯU</>}
                            </button>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    // Gắn toàn bộ Modal & Components nghiệp vụ Đơn hàng vào window để các tab deferred truy cập an toàn 100%
    try {
        if (typeof window !== 'undefined') {
            if (typeof showCopyModal !== 'undefined') window.showCopyModal = showCopyModal;
            if (typeof AddModal !== 'undefined') window.AddModal = AddModal;
            if (typeof EditModal !== 'undefined') window.EditModal = EditModal;
            if (typeof DetailModal !== 'undefined') window.DetailModal = DetailModal;
            if (typeof BulkEditModal !== 'undefined') window.BulkEditModal = BulkEditModal;
