// CHỈ DÀNH ĐỘC QUYỀN CHO PHÂN QUYỀN TỐI CAO (isBoss || currentRole === 'TỐI CAO')
// =========================================================================
function ShopeeProductImportModal({ onClose, pushData, pushDeltas, data, currentCat, triggerToast }) {
  const [mode, setMode] = React.useState('PASTE'); // 'PASTE' | 'EXCEL'
  const [rawText, setRawText] = React.useState('');
  const [category, setCategory] = React.useState(currentCat || 'KHO LAYOUT');
  const [subCategory, setSubCategory] = React.useState('');
  const [defaultUnit, setDefaultUnit] = React.useState('Bộ');
  const [items, setItems] = React.useState([]);
  const [isSaving, setIsSaving] = React.useState(false);
  const [isDragging, setIsDragging] = React.useState(false);
  const [autoStandardize, setAutoStandardize] = React.useState(true);

  const existingProductsMap = React.useMemo(() => {
    const map = new Map();
    (data?.Products || []).forEach(p => {
      if (p.sku) map.set(String(p.sku).trim().toUpperCase(), p);
    });
    return map;
  }, [data?.Products]);

  // Bộ phân giải thông minh văn bản sao chép từ Shopee Kênh Người Bán
  const parseShopeeText = React.useCallback((text, isAuto = autoStandardize) => {
    if (!text || typeof text !== 'string' || !text.trim()) {
      setItems([]);
      return;
    }

    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) {
      setItems([]);
      return;
    }

    // Kiểm tra nếu là dạng bảng Tab-separated (copy từ Excel/bảng)
    const isTsv = lines.some(l => l.includes('\t'));
    if (isTsv) {
      const parsedTsv = [];
      lines.forEach((line, idx) => {
        const cols = line.split('\t').map(c => c.trim());
        if (cols.length >= 2) {
          if (idx === 0 && (cols[0].toLowerCase().includes('sku') || cols[0].toLowerCase().includes('mã'))) return;
          const sku = cols[0] || '';
          const name = cols[1] || '';
          const price = Number(String(cols[2] || '').replace(/[^\d]/g, '')) || 0;
          const stock = Number(String(cols[3] || '').replace(/[^\d]/g, '')) || 0;
          if (sku || name) {
            let finalSku = String(sku).trim().toUpperCase();
            let finalName = name || sku;
            if (isAuto) {
              finalSku = standardizeWarehouseSku(sku, category, name);
              const std = standardizeWarehouseName(name, '', sku);
              finalName = std.fullName;
            }

            parsedTsv.push({
              id: 'PROD_' + Date.now() + '_' + idx,
              sku: finalSku,
              rawShopeeSku: sku,
              name: finalName,
              price: price,
              quantity: stock,
              unit: defaultUnit,
              category: category,
              sub_category: subCategory || (category === 'KHO LAYOUT' ? 'RỪNG' : 'KHÁC')
            });
          }
        }
      });
      if (parsedTsv.length > 0) {
        setItems(parsedTsv);
        return;
      }
    }

    // Bóc tách theo giao diện Shopee Kênh Người Bán
    let baseName = '';
    const firstLine = lines[0];
    if (firstLine.includes('|')) {
      baseName = firstLine.split('|')[0].trim();
    } else {
      baseName = firstLine;
    }

    // Tự động gợi ý danh mục và ĐVT theo tên
    const upperBase = baseName.toUpperCase();
    let detectedCat = category;
    let detectedSub = subCategory;
    let detectedUnit = defaultUnit;

    if (upperBase.includes('LAYOUT') || upperBase.includes('RỪNG') || upperBase.includes('LŨA') || upperBase.includes('ĐÁ') || upperBase.includes('NATURE') || upperBase.includes('VER.')) {
      detectedCat = 'KHO LAYOUT';
      detectedUnit = 'Bộ';
      if (upperBase.includes('RỪNG') || upperBase.includes('RUN')) detectedSub = 'RỪNG';
      else if (upperBase.includes('BONSAI') || upperBase.includes('BON')) detectedSub = 'BONSAI';
      else if (upperBase.includes('VÁCH SUỐI') || upperBase.includes('SUỐI') || upperBase.includes('VAC')) detectedSub = 'VÁCH SUỐI';
      else if (upperBase.includes('HẺM NÚI') || upperBase.includes('NÚI') || upperBase.includes('HEM')) detectedSub = 'HẺM NÚI';
      else if (upperBase.includes('TRĂNG') || upperBase.includes('TRA')) detectedSub = 'TRĂNG';
      else if (upperBase.includes('NHẤT TRỤ') || upperBase.includes('TRU')) detectedSub = 'NHẤT TRỤ';
      else if (upperBase.includes('CẦU VỒNG') || upperBase.includes('CAU')) detectedSub = 'CẦU VỒNG';
      else if (upperBase.includes('HANG ĐỘNG') || upperBase.includes('HAN')) detectedSub = 'HANG ĐỘNG';
      else if (upperBase.includes('NATURE') || upperBase.includes('NAT')) detectedSub = 'NATURE';
      else if (upperBase.includes('ĐẢO BAY') || upperBase.includes('DAO')) detectedSub = 'ĐẢO BAY';
      else if (upperBase.includes('CỔNG VÒM') || upperBase.includes('VOM')) detectedSub = 'CỔNG VÒM';
      else if (upperBase.includes('CUỘI') || upperBase.includes('BIOTOP')) detectedSub = 'BIOTOP CUỘI';
      else if (upperBase.includes('LINH THÚ')) detectedSub = 'LINH THÚ';
      else detectedSub = 'KHÁC';
    } else if (upperBase.includes('BỂ') || upperBase.includes('KÍNH') || upperBase.includes('HỒ')) {
      detectedCat = 'KHO BỂ KÍNH';
      detectedUnit = 'Cái';
      detectedSub = upperBase.includes('CUBIC') ? 'BỂ CUBIC' : 'BỂ LẺ SIZE';
    }

    setCategory(detectedCat);
    if (detectedSub) setSubCategory(detectedSub);
    if (detectedUnit) setDefaultUnit(detectedUnit);

    // 2. Tìm SKU sản phẩm cha nếu có
    let parentSku = '';
    for (let i = 0; i < lines.length; i++) {
      const matchParent = lines[i].match(/SKU sản phẩm:\s*([A-Za-z0-9_\-\.]+)/i);
      if (matchParent) {
        parentSku = matchParent[1].trim();
        break;
      }
    }

    // 3. Quét các phân loại con
    const parsedVariations = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const matchVarSku = line.match(/SKU phân loại:\s*([A-Za-z0-9_\-\.]+)/i);
      if (matchVarSku) {
        const vSku = matchVarSku[1].trim();
        let vLabel = '';
        if (i > 0) {
          const prev = lines[i - 1];
          if (!prev.includes('SKU') && !prev.includes('ID') && !prev.startsWith('₫') && !prev.includes('Model') && !prev.includes('k')) {
            vLabel = prev;
          }
        }

        let price = 0;
        let stock = 0;
        let j = i + 1;
        while (j < Math.min(lines.length, i + 7)) {
          const next = lines[j];
          if (next.includes('SKU phân loại:')) break;
          
          const cleanNum = next.replace(/[^\d]/g, '');
          if ((next.startsWith('₫') || next.includes('₫')) && cleanNum) {
            const numVal = parseInt(cleanNum, 10);
            if (numVal >= 1000 && price === 0) price = numVal;
          } else if (cleanNum && !next.includes('Model') && !next.includes('ID')) {
            const numVal = parseInt(cleanNum, 10);
            if (numVal >= 1000 && price === 0) {
              price = numVal;
            } else if (numVal >= 0 && stock === 0 && price > 0) {
              stock = numVal;
            }
          }
          j++;
        }

        let finalSku = vSku.toUpperCase();
        let finalName = vLabel ? `${baseName} - ${vLabel}` : baseName;

        if (isAuto) {
          finalSku = standardizeWarehouseSku(vSku, detectedCat, baseName);
          const std = standardizeWarehouseName(baseName, vLabel, vSku);
          finalName = std.fullName;
        }

        parsedVariations.push({
          id: 'PROD_' + Date.now() + '_' + parsedVariations.length,
          sku: finalSku,
          rawShopeeSku: vSku,
          name: finalName,
          price: price,
          quantity: stock,
          unit: detectedUnit,
          category: detectedCat,
          sub_category: detectedSub || 'KHÁC'
        });
        i = j - 1;
      }
      i++;
    }

    // 4. Nếu không có 'SKU phân loại:' (sản phẩm đơn không có biến thể)
    if (parsedVariations.length === 0 && parentSku) {
      let price = 0;
      let stock = 0;
      lines.forEach(l => {
        const cleanNum = l.replace(/[^\d]/g, '');
        if ((l.startsWith('₫') || l.includes('₫')) && cleanNum) {
          const numVal = parseInt(cleanNum, 10);
          if (numVal >= 1000 && price === 0) price = numVal;
        } else if (cleanNum && !l.includes('ID') && !l.includes('Model') && !l.includes('SKU')) {
          const numVal = parseInt(cleanNum, 10);
          if (numVal >= 1000 && price === 0) {
            price = numVal;
          } else if (numVal >= 0 && price > 0 && stock === 0) {
            stock = numVal;
          }
        }
      });

      let finalSku = parentSku.toUpperCase();
      let finalName = baseName;
      if (isAuto) {
        finalSku = standardizeWarehouseSku(parentSku, detectedCat, baseName);
        const std = standardizeWarehouseName(baseName, '', parentSku);
        finalName = std.fullName;
      }

      parsedVariations.push({
        id: 'PROD_' + Date.now() + '_0',
        sku: finalSku,
        rawShopeeSku: parentSku,
        name: finalName,
        price: price,
        quantity: stock,
        unit: detectedUnit,
        category: detectedCat,
        sub_category: detectedSub || 'KHÁC'
      });
    }

    setItems(parsedVariations);
  }, [category, subCategory, defaultUnit, autoStandardize]);

  // Xử lý nạp file Excel Shopee
  const handleExcelUpload = React.useCallback((file) => {
    if (!file) return;
    if (typeof window.XLSX === 'undefined') {
      alert('Thư viện đọc Excel chưa được tải, vui lòng thử lại sau giây lát!');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const dataArr = new Uint8Array(e.target.result);
        const workbook = window.XLSX.read(dataArr, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const jsonRows = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        if (!jsonRows || jsonRows.length < 2) {
          alert('File Excel không có dữ liệu hợp lệ!');
          return;
        }

        let headerRowIdx = -1;
        let colSku = -1, colName = -1, colPrice = -1, colStock = -1, colParentSku = -1, colVarName = -1;

        for (let r = 0; r < Math.min(10, jsonRows.length); r++) {
          const row = jsonRows[r];
          if (!row || !Array.isArray(row)) continue;
          row.forEach((cell, c) => {
            const str = String(cell || '').toLowerCase().trim();
            if (str.includes('sku phân loại') || (str.includes('sku') && colSku === -1)) colSku = c;
            if (str.includes('sku sản phẩm') || str.includes('mã sản phẩm')) colParentSku = c;
            if (str.includes('tên sản phẩm') || str.includes('tên hàng')) colName = c;
            if (str.includes('tên phân loại') || str.includes('phân loại')) colVarName = c;
            if (str.includes('giá') || str.includes('price')) colPrice = c;
            if (str.includes('kho hàng') || str.includes('tồn kho') || str.includes('số lượng') || str.includes('stock')) colStock = c;
          });
          if (colSku !== -1 && (colName !== -1 || colPrice !== -1)) {
            headerRowIdx = r;
            break;
          }
        }

        if (headerRowIdx === -1) headerRowIdx = 0;

        const parsedRows = [];
        for (let r = headerRowIdx + 1; r < jsonRows.length; r++) {
          const row = jsonRows[r];
          if (!row || row.length === 0) continue;
          const sku = String(row[colSku] || row[colParentSku] || '').trim();
          if (!sku) continue;

          const pName = String(row[colName] || '').trim();
          const vName = colVarName !== -1 ? String(row[colVarName] || '').trim() : '';
          let finalSku = sku.toUpperCase();
          let finalName = vName ? `${pName} - ${vName}` : pName;

          if (autoStandardize) {
            finalSku = standardizeWarehouseSku(sku, category, pName);
            const std = standardizeWarehouseName(pName, vName, sku);
            finalName = std.fullName;
          }

          const price = Number(String(row[colPrice] || '').replace(/[^\d]/g, '')) || 0;
          const stock = Number(String(row[colStock] || '').replace(/[^\d]/g, '')) || 0;

          parsedRows.push({
            id: 'PROD_' + Date.now() + '_' + parsedRows.length,
            sku: finalSku,
            rawShopeeSku: sku,
            name: finalName || finalSku,
            price: price,
            quantity: stock,
            unit: defaultUnit,
            category: category,
            sub_category: subCategory || 'KHÁC'
          });
        }

        if (parsedRows.length > 0) {
          setItems(parsedRows);
          if (typeof triggerToast === 'function') triggerToast(`Đã đọc ${parsedRows.length} phân loại từ file Excel!`, 'fa-file-excel', 'success');
        } else {
          alert('Không tìm thấy dòng sản phẩm nào có SKU hợp lệ trong file!');
        }
      } catch (err) {
        alert('Lỗi khi đọc file Excel: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }, [category, subCategory, defaultUnit, autoStandardize, triggerToast]);

  const updateItemField = (idx, field, val) => {
    setItems(prev => {
      const copy = [...prev];
      copy[idx] = { ...copy[idx], [field]: val };
      return copy;
    });
  };

  const removeItem = (idx) => {
    setItems(prev => prev.filter((_, i) => i !== idx));
  };

  const addNewRow = () => {
    setItems(prev => [
      ...prev,
      {
        id: 'PROD_' + Date.now() + '_' + prev.length,
        sku: '',
        name: '',
        price: 0,
        quantity: 0,
        unit: defaultUnit,
        category: category,
        sub_category: subCategory || 'KHÁC'
      }
    ]);
  };

  const loadSample = () => {
    const sample = `Layout Rừng Ver.21 | Nghệ Thuật Tái Tạo Cảnh Quan Tự Nhiên | Đ...
SKU sản phẩm: RUN-021
ID Sản phẩm: 57767368836
₫505.000 - ₫795.000
1.8k
Size S
SKU phân loại: RUN-021-202020
Model ID: 287936773310
₫505.000
898
Size M
SKU phân loại: RUN-021-302020
Model ID: 287936773311
₫640.000
666
Size L
SKU phân loại: RUN-021-402325
Model ID: 287936773312
₫795.000
222`;
    setRawText(sample);
    parseShopeeText(sample);
  };

  const handleSave = async () => {
    if (items.length === 0) {
      alert('Chưa có sản phẩm nào để lưu!');
      return;
    }

    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (!it.sku || !String(it.sku).trim()) {
        alert(`Dòng thứ ${i + 1} đang để trống Mã SKU!`);
        return;
      }
      if (!it.name || !String(it.name).trim()) {
        alert(`Dòng thứ ${i + 1} đang để trống Tên Sản Phẩm!`);
        return;
      }
    }

    setIsSaving(true);
    try {
      const preparedProducts = items.map((it, idx) => {
        const cleanSku = String(it.sku).trim().toUpperCase();
        const existing = existingProductsMap.get(cleanSku);

        return {
          id: existing?.id || it.id || ('PROD_' + Date.now() + '_' + idx),
          sku: cleanSku,
          name: String(it.name).trim(),
          unit: it.unit || defaultUnit || 'Bộ',
          image: existing?.image || '',
          category: it.category || category || 'KHO LAYOUT',
          sub_category: it.sub_category || subCategory || 'KHÁC',
          costPrice: existing?.costPrice || 0,
          price: Number(it.price) || 0,
          quantity: Number(it.quantity) || 0,
          minStock: existing?.minStock || 0,
          maxStock: existing?.maxStock || 0,
          realImage: existing?.realImage || '',
          importUnit: existing?.importUnit || '',
          conversionRate: existing?.conversionRate || 1,
          model3D: existing?.model3D || ''
        };
      });

      if (typeof pushData === 'function') {
        await pushData({ Products: preparedProducts });
      } else if (typeof pushDeltas === 'function') {
        await pushDeltas({ Products: preparedProducts });
      }

      if (typeof triggerToast === 'function') {
        triggerToast(`Đã lưu thành công ${preparedProducts.length} sản phẩm từ Shopee vào kho!`, 'fa-check-circle', 'success');
      } else {
        alert(`Đã lưu thành công ${preparedProducts.length} sản phẩm vào kho hàng!`);
      }

      onClose();
    } catch (err) {
      alert('Lỗi khi lưu sản phẩm: ' + err.message);
    } finally {
      setIsSaving(false);
    }
  };

  const totalValue = items.reduce((acc, it) => acc + (Number(it.price || 0) * Number(it.quantity || 0)), 0);
  const totalQty = items.reduce((acc, it) => acc + Number(it.quantity || 0), 0);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/85 backdrop-blur-md animate-fade-in">
      <div className="bg-[#0e0e12] border border-orange-500/30 rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.8)] overflow-hidden">
        
        {/* HEADER MODAL */}
        <div className="p-4 sm:px-5 sm:py-3.5 border-b border-white/[0.08] bg-[#141419] flex items-center justify-between shrink-0">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-orange-500/15 border border-orange-500/30 flex items-center justify-center text-[#ee4d2d] shadow-inner shrink-0">
              <i className="fas fa-bag-shopping text-lg"></i>
            </div>
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <h3 className="font-black text-sm sm:text-base text-white uppercase tracking-wider">
                  Nhập Nhanh Sản Phẩm Shopee
                </h3>
                <span className="text-[9.5px] font-black uppercase tracking-wider px-2 py-0.5 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30 flex items-center gap-1">
                  <i className="fas fa-crown text-[#d4af37]"></i> TỐI CAO
                </span>
              </div>
              <p className="text-[11px] text-zinc-400 mt-0.5">
                Tự động bóc tách tên, phân loại (Size S/M/L), SKU, giá bán & tồn kho chỉ trong 3 giây
              </p>
            </div>
          </div>
          <button 
            type="button"
            onClick={onClose} 
            className="w-8 h-8 rounded-lg bg-white/[0.04] hover:bg-white/[0.1] text-zinc-400 hover:text-white flex items-center justify-center transition-all active:scale-95 cursor-pointer"
          >
            <i className="fas fa-times"></i>
          </button>
        </div>

        {/* SUBHEADER: CHUYỂN ĐỔI CHẾ ĐỘ & CẤU HÌNH NHANH */}
        <div className="px-4 sm:px-5 py-2.5 bg-[#121217] border-b border-white/[0.06] flex flex-wrap items-center justify-between gap-3 shrink-0">
          <div className="flex items-center bg-[#09090b] p-1 rounded-xl border border-white/[0.08]">
            <button
              type="button"
              onClick={() => setMode('PASTE')}
              className={`px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer ${
                mode === 'PASTE' 
                  ? 'bg-gradient-to-r from-[#ee4d2d] to-[#ff5722] text-white shadow-sm' 
                  : 'text-zinc-400 hover:text-zinc-200'
              }`}
            >
              <i className="fas fa-paste"></i>
              <span>Smart Paste (Dán Text)</span>
            </button>
            <button
              type="button"
              onClick={() => setMode('EXCEL')}
              className={`px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer ${
                mode === 'EXCEL' 
                  ? 'bg-gradient-to-r from-[#ee4d2d] to-[#ff5722] text-white shadow-sm' 
                  : 'text-zinc-400 hover:text-zinc-200'
              }`}
            >
              <i className="fas fa-file-excel"></i>
              <span>File Excel Shopee</span>
            </button>
          </div>

          <div className="flex items-center gap-2 flex-wrap text-xs">
            <div className="flex items-center gap-1.5 bg-[#09090b] px-2.5 py-1 rounded-lg border border-white/[0.08]">
              <span className="text-zinc-500 font-bold">Kho:</span>
              <select 
                value={category} 
                onChange={e => {
                  setCategory(e.target.value);
                  setItems(prev => prev.map(it => ({ ...it, category: e.target.value })));
                }}
                className="bg-transparent text-[#d4af37] font-bold outline-none cursor-pointer"
              >
                <option value="KHO LAYOUT" className="bg-[#121217]">KHO LAYOUT</option>
                <option value="KHO BỂ KÍNH" className="bg-[#121217]">KHO BỂ KÍNH</option>
                <option value="DANH MỤC SẢN XUẤT" className="bg-[#121217]">DANH MỤC SẢN XUẤT</option>
                <option value="PHỤ KIỆN" className="bg-[#121217]">PHỤ KIỆN</option>
              </select>
            </div>

            <div className="flex items-center gap-1.5 bg-[#09090b] px-2.5 py-1 rounded-lg border border-white/[0.08]">
              <span className="text-zinc-500 font-bold">ĐVT:</span>
              <select 
                value={defaultUnit} 
                onChange={e => {
                  setDefaultUnit(e.target.value);
                  setItems(prev => prev.map(it => ({ ...it, unit: e.target.value })));
                }}
                className="bg-transparent text-cyan-400 font-bold outline-none cursor-pointer"
              >
                <option value="Bộ" className="bg-[#121217]">Bộ</option>
                <option value="Cái" className="bg-[#121217]">Cái</option>
                <option value="Thùng" className="bg-[#121217]">Thùng</option>
                <option value="Hộp" className="bg-[#121217]">Hộp</option>
                <option value="Chai" className="bg-[#121217]">Chai</option>
                <option value="gam" className="bg-[#121217]">gam</option>
                <option value="kg" className="bg-[#121217]">kg</option>
              </select>
            </div>
          </div>
        </div>

        {/* MODAL BODY */}
        <div className="flex-1 overflow-y-auto p-4 sm:p-5 custom-scrollbar space-y-4">
          
          {mode === 'PASTE' ? (
            <div className="space-y-2">
              <div className="flex items-center justify-between">
                <label className="text-xs font-bold text-zinc-300 flex items-center gap-1.5">
                  <i className="fas fa-clipboard-check text-orange-400"></i>
                  <span>Dán dữ liệu sao chép từ Shopee Kênh Người Bán:</span>
                </label>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={loadSample}
                    className="text-[11px] font-bold text-[#ee4d2d] hover:text-orange-300 hover:underline flex items-center gap-1 cursor-pointer transition-colors"
                  >
                    <i className="fas fa-wand-magic-sparkles"></i> Dán Mẫu Thử Nghiệm
                  </button>
                  {rawText && (
                    <button
                      type="button"
                      onClick={() => { setRawText(''); setItems([]); }}
                      className="text-[11px] text-zinc-500 hover:text-rose-400 cursor-pointer"
                    >
                      Xóa
                    </button>
                  )}
                </div>
              </div>

              <textarea
                value={rawText}
                onChange={e => {
                  setRawText(e.target.value);
                  parseShopeeText(e.target.value);
                }}
                rows={4}
                placeholder="Bôi đen toàn bộ thông tin sản phẩm trên Shopee (Tên, SKU, các dòng Size S, M, L, Giá, Kho) và bấm Ctrl+V dán vào đây..."
                className="w-full bg-[#09090b] border border-white/[0.08] focus:border-orange-500/60 rounded-xl p-3 text-xs text-white font-mono outline-none transition-all placeholder:text-zinc-600 focus:ring-1 focus:ring-orange-500/30"
              />
            </div>
          ) : (
            <div 
              onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={() => setIsDragging(false)}
              onDrop={(e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                  handleExcelUpload(e.dataTransfer.files[0]);
                }
              }}
              className={`p-6 border-2 border-dashed rounded-2xl flex flex-col items-center justify-center text-center transition-all ${
                isDragging ? 'border-orange-500 bg-orange-500/10' : 'border-white/[0.1] bg-[#09090b] hover:border-orange-500/40'
              }`}
            >
              <div className="w-12 h-12 rounded-2xl bg-orange-500/15 border border-orange-500/30 flex items-center justify-center text-orange-400 mb-2">
                <i className="fas fa-file-excel text-2xl"></i>
              </div>
              <div className="text-xs font-bold text-zinc-200 mb-1">
                Kéo thả file Excel xuất từ Shopee vào đây, hoặc bấm chọn file
              </div>
              <div className="text-[11px] text-zinc-500 mb-3">
                Hỗ trợ file "Cập nhật hàng loạt" (.xlsx, .xls) xuất từ Shopee Kênh Người Bán
              </div>
              <label className="px-4 py-2 bg-white/[0.06] hover:bg-white/[0.1] text-white rounded-xl text-xs font-bold border border-white/[0.08] cursor-pointer transition-all active:scale-95">
                <i className="fas fa-folder-open mr-1.5 text-orange-400"></i> Chọn File Excel
                <input 
                  type="file" 
                  accept=".xlsx,.xls,.csv" 
                  className="hidden" 
                  onChange={(e) => {
                    if (e.target.files && e.target.files[0]) {
                      handleExcelUpload(e.target.files[0]);
                    }
                  }} 
                />
              </label>
            </div>
          )}

          {/* BẢNG XEM TRƯỚC SẢN PHẨM SẼ TẠO */}
          <div className="border border-white/[0.08] rounded-xl bg-[#09090b] overflow-hidden">
            <div className="px-4 py-2.5 bg-[#141419] border-b border-white/[0.08] flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-black uppercase text-zinc-300 tracking-wider">
                  Danh Sách Phân Loại ({items.length})
                </span>
                {items.length > 0 && (
                  <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                    Sẵn sàng lưu
                  </span>
                )}
                {/* Nút Toggle Chuẩn Hóa Theo Chuẩn Xưởng */}
                <button
                  type="button"
                  onClick={() => {
                    const nextAuto = !autoStandardize;
                    setAutoStandardize(nextAuto);
                    if (rawText) {
                      parseShopeeText(rawText, nextAuto);
                    } else if (items.length > 0) {
                      setItems(prev => prev.map(it => {
                        const origSku = it.rawShopeeSku || it.sku;
                        if (nextAuto) {
                          const stdSku = standardizeWarehouseSku(origSku, it.category, it.name);
                          const std = standardizeWarehouseName(it.name, '', origSku);
                          return { ...it, sku: stdSku, name: std.fullName };
                        } else {
                          return { ...it, sku: origSku.toUpperCase() };

                      }));
                    }

                  className={`px-2.5 py-1 rounded-lg text-[10.5px] font-bold border flex items-center gap-1.5 cursor-pointer transition-all active:scale-95 ${
                    autoStandardize 
                      ? 'bg-amber-500/15 border-amber-500/30 text-[#d4af37]' 
                      : 'bg-white/[0.04] border-white/[0.08] text-zinc-400 hover:text-zinc-200'
                  }`}
                  title="Tự động chuẩn hóa mã SKU sang LAY-... và quy cách kích thước xưởng"
                >
                  <i className={`fas fa-magic text-[10px] ${autoStandardize ? 'text-[#d4af37]' : 'text-zinc-500'}`}></i>
                  <span>Chuẩn Hóa Xưởng: {autoStandardize ? 'BẬT' : 'TẮT'}</span>
                </button>
              </div>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={addNewRow}
                  className="px-2.5 py-1 bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 hover:text-white rounded-lg text-[10.5px] font-bold border border-white/[0.08] flex items-center gap-1 cursor-pointer transition-all active:scale-95"
                >
                  <i className="fas fa-plus text-emerald-400"></i> Thêm Dòng
                </button>
                {items.length > 0 && (
                  <button
                    type="button"
                    onClick={() => setItems([])}
                    className="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg text-[10.5px] font-bold border border-rose-500/20 cursor-pointer transition-all"
                  >
                    Xóa Hết
                  </button>
                )}
              </div>
            </div>

            <div className="overflow-x-auto max-h-[360px] custom-scrollbar">
              <table className="w-full text-left border-collapse min-w-[650px]">
                <thead className="sticky top-0 bg-[#16161d] border-b border-white/[0.08] z-10 text-[10px] font-black uppercase text-zinc-400 tracking-wider">
                  <tr>
                    <th className="p-2.5 w-[170px]">Mã SKU</th>
                    <th className="p-2.5">Tên Sản Phẩm & Phân Loại</th>
                    <th className="p-2.5 w-[120px]">Giá Bán (đ)</th>
                    <th className="p-2.5 w-[85px]">Tồn Kho</th>

                    items.map((it, idx) => {

                            {it.rawShopeeSku && it.rawShopeeSku !== it.sku && (

                          <td className="p-2">

                              value={it.name}
                              onChange={e => updateItemField(idx, 'name', e.target.value)}
                              placeholder="Tên sản phẩm - Phân loại..."
                              className="w-full bg-[#121217] border border-white/[0.08] focus:border-orange-500/60 rounded-lg px-2 py-1 text-zinc-200 text-xs outline-none"

                          <td className="p-2">
                            <input
                              type="number"
                              value={it.price}

                              className="w-full bg-[#121217] border border-white/[0.08] focus:border-[#d4af37]/60 rounded-lg px-2 py-1 text-[#d4af37] font-mono font-bold text-xs outline-none text-right"
                            />

                          <td className="p-2">
                            <input
                              type="number"
                              value={it.quantity}
                              onChange={e => updateItemField(idx, 'quantity', Number(e.target.value))}
                              placeholder="0"
                              className="w-full bg-[#121217] border border-white/[0.08] focus:border-cyan-500/60 rounded-lg px-2 py-1 text-cyan-300 font-mono font-bold text-xs outline-none text-center"
                            />
                          </td>
                          <td className="p-2">
                            <input
                              type="text"
                              value={it.unit}
                              onChange={e => updateItemField(idx, 'unit', e.target.value)}
                              className="w-full bg-[#121217] border border-white/[0.08] focus:border-white/30 rounded-lg px-2 py-1 text-zinc-300 text-xs outline-none text-center"
                            />
                          </td>
                          <td className="p-2 text-center">
                            {isExisting ? (
                              <span className="text-[9.5px] font-bold px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-400 border border-amber-500/30">
                                CẬP NHẬT
                              </span>
                            ) : (
                              <span className="text-[9.5px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                                TẠO MỚI
                              </span>
                            )}
                          </td>
                          <td className="p-2 text-center">
                            <button
                              type="button"
                              onClick={() => removeItem(idx)}
                              className="w-6 h-6 rounded bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex items-center justify-center transition-all cursor-pointer"
                              title="Xóa dòng"
                            >
                              <i className="fas fa-trash-can text-[10px]"></i>
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        {/* MODAL FOOTER */}
        <div className="p-3.5 sm:px-5 sm:py-3 border-t border-white/[0.08] bg-[#141419] flex items-center justify-between gap-3 shrink-0 flex-wrap">
          <div className="text-xs text-zinc-400 flex items-center gap-4 flex-wrap">
            <div>Tổng tồn: <span className="text-cyan-300 font-mono font-bold">{totalQty.toLocaleString('vi-VN')}</span></div>
            <div>Tổng giá trị: <span className="text-[#d4af37] font-mono font-bold">{Math.round(totalValue).toLocaleString('vi-VN')} đ</span></div>
          </div>

          <div className="flex items-center gap-2.5">
            <button
              type="button"
              onClick={onClose}
              disabled={isSaving}
              className="px-4 py-2 bg-white/[0.06] hover:bg-white/[0.1] text-zinc-300 font-bold rounded-xl text-xs uppercase transition-all cursor-pointer"
            >
              Hủy
            </button>
            <button
              type="button"
              onClick={handleSave}
              disabled={isSaving || items.length === 0}
              className="px-5 py-2 bg-gradient-to-r from-[#ee4d2d] to-[#ff5722] hover:from-[#d73211] hover:to-[#ee4d2d] disabled:opacity-50 text-white font-black rounded-xl text-xs uppercase tracking-wider transition-all shadow-[0_0_15px_rgba(238,77,45,0.3)] cursor-pointer active:scale-95 flex items-center gap-2"
            >
              {isSaving ? (
                <>
                  <i className="fas fa-spinner fa-spin"></i>
                  <span>Đang Lưu...</span>
                </>
              ) : (
                <>
                  <i className="fas fa-cloud-arrow-up"></i>
                  <span>Lưu Vào Kho ({items.length} Phân Loại)</span>
                </>
              )}
            </button>
          </div>
        </div>

      </div>
    </div>
  );
}

// =========================================================================
// 5. COMPONENT: MÀN HÌNH DANH MỤC & THỦ KHO (InventoryListView)
// =========================================================================
function InventoryListView({ data, pushData, pushDeltas, documents, isAdmin, isBoss: propIsBoss, userRole: propUserRole, currentUser: propCurrentUser, hasPerm: propHasPerm, triggerToast }) {
  // Bộ lọc thông minh theo chuẩn Linear UX:
  // 'ALL' | 'MATERIALS' | 'STONES' | 'ACCESSORIES' | 'TANKS' | 'RETURNS'
  const [activeSegment, setActiveSegment] = React.useState('ALL');
  const [subCatFilter, setSubCatFilter] = React.useState(null); 
  const [search, setSearch] = React.useState(''); 
  const deferredSearch = React.useDeferredValue ? React.useDeferredValue(search) : search;
  
  // Modals & Side Drawer State
  const [editProd, setEditProd] = React.useState(null); 
  const [addVarGroup, setAddVarGroup] = React.useState(null);
  const [showStockRules, setShowStockRules] = React.useState(false);
  const [showBulkEditPrice, setShowBulkEditPrice] = React.useState(false);
  const [showQuickNotes, setShowQuickNotes] = React.useState(false);
  const [showShopeeImport, setShowShopeeImport] = React.useState(false);
  
  // Side Drawer state
  const [selectedDrawerItem, setSelectedDrawerItem] = React.useState(null);
  const [selectedDrawerReturn, setSelectedDrawerReturn] = React.useState(null);
  const [drawerActiveTab, setDrawerActiveTab] = React.useState('STOCK_CARD'); // 'STOCK_CARD' | 'BOM_CALC' | 'RETURN_INSPECT'

  // Quick Stock Adjustment in Drawer
  const [stockAdjType, setStockAdjType] = React.useState('IN'); // 'IN' (Nhập) | 'OUT' (Xuất)
  const [stockAdjQty, setStockAdjQty] = React.useState('');
  const [stockAdjUnit, setStockAdjUnit] = React.useState('DEFAULT'); // 'DEFAULT' | 'LARGE_SHEET' | 'SQM' | 'BOX'
  const [stockAdjNote, setStockAdjNote] = React.useState('');
  const [isSubmittingAdj, setIsSubmittingAdj] = React.useState(false);

  // Glass BOM Calculator State (+5% hao hụt chuẩn Hiến pháp)
  const [bomLength, setBomLength] = React.useState(30);
  const [bomWidth, setBomWidth] = React.useState(20);
  const [bomHeight, setBomHeight] = React.useState(20);
  const [bomQty, setBomQty] = React.useState(1);

  // Return Inspection State
  const [inspectPhoto, setInspectPhoto] = React.useState('');
  const [inspectNote, setInspectNote] = React.useState('');
  const [isProcessingReturn, setIsProcessingReturn] = React.useState(false);

  const formatMoney = (val) => Math.round(Number(val || 0)).toLocaleString('vi-VN');
  
  const currentRole = String(propUserRole || localStorage.getItem('rf_role') || '').trim();
  const currentUser = String(propCurrentUser || localStorage.getItem('rf_user') || '').trim();
  const isBoss = propIsBoss !== undefined ? propIsBoss : (localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO' || currentUser.includes('Tiến'));

  const hasPerm = React.useCallback((actionCode) => {
    if (isBoss || currentRole === 'TỐI CAO') return true;
    if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
    if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
    return isAdmin;
  }, [propHasPerm, currentRole, currentUser, isAdmin, isBoss]);

  const isAdminRole = hasPerm('INV_EDIT_PRODUCT');
  // CHẶN BẢO MẬT: Chỉ Boss, Kế Toán, Quản Lý Kho mới được xem giá vốn. Thợ xưởng/Thủ kho/CTV bị ẩn 100%.
  const canViewCost = (hasPerm('INV_EDIT_PRODUCT') || ['QUẢN LÝ KHO VẬN', 'TỐI CAO', 'KẾ TOÁN'].includes(currentRole.toUpperCase()) || isBoss) && currentRole !== 'CTV';

  // Gom nhóm sản phẩm theo SKU
  const uniqueProducts = React.useMemo(() => {
      const map = new Map();
      (data.Products || []).forEach(p => {
          const key = String(p.sku || p.id).toUpperCase().trim();
          if (!key) return;
          if (map.has(key)) {
              const existing = map.get(key);
              existing.quantity = Number(existing.quantity || 0) + Number(p.quantity || 0);
              if (Number(p.costPrice) > 0 && !existing.costPrice) existing.costPrice = p.costPrice;
              if (Number(p.price) > 0 && !existing.price) existing.price = p.price;
              existing._allIds = existing._allIds || [existing.id];
              if (!existing._allIds.includes(p.id)) existing._allIds.push(p.id);
              map.set(key, existing);
          } else {
              map.set(key, { ...p, _allIds: [p.id] });
          }
      });
      return Array.from(map.values());
  }, [data.Products]);

  // Danh sách kiện hàng hoàn từ Orders
  const returnedOrders = React.useMemo(() => {
      const allOrders = data.Orders || [];
      return allOrders.filter(o => {
          const st = String(o.status || '').toUpperCase().trim();
          const retSt = String(o.returnStatus || '').toUpperCase().trim();
          return st === 'HÀNG HOÀN' || st.includes('HOÀN') || retSt === 'WAITING_INSPECTION' || retSt === 'SCRAPPED' || retSt === 'RESTOCKED';
      }).map(o => ({
          id: o.id,
          orderCode: o.orderCode || o.id,
          customer: o.customer || 'Khách hàng',
          phone: o.phone || '',
          productSummary: o.accessories || o.note || 'Sản phẩm hoàn',
          returnTrackingCode: o.returnTrackingCode || o.trackingCode || `RET-${o.orderCode || o.id}`,
          returnStatus: o.returnStatus || (String(o.status || '').toUpperCase().includes('HOÀN') ? 'WAITING_INSPECTION' : 'WAITING_INSPECTION'),
          inspectedBy: o.inspectedBy || '',
          inspectedAt: o.inspectedAt || '',
          inspectionPhoto: o.inspectionPhoto || '',
          inspectionNote: o.inspectionNote || o.note || ''
      }));
  }, [data.Orders]);

  const waitingInspectionReturns = React.useMemo(() => {
      return returnedOrders.filter(r => r.returnStatus === 'WAITING_INSPECTION');
  }, [returnedOrders]);

  // Phân loại danh mục theo Segmented Control
  const isItemInSegment = React.useCallback((p, segment) => {
      const cat = String(p.category || '').toUpperCase().trim();
      const subCat = String(p.sub_category || '').toUpperCase().trim();
      const name = String(p.name || '').toUpperCase().trim();
      const sku = String(p.sku || '').toUpperCase().trim();

      if (segment === 'ALL') return true;

      // 1. Phân biệt BỂ KÍNH (Bể nâng đáy, Bể giấu keo, Bể đúc, Bể vát...)
      const isTank = cat.includes('BỂ') || subCat.includes('BỂ') || name.startsWith('BỂ') || name.includes('BỂ KÍNH') || sku.startsWith('BE-') || sku.startsWith('BK-');

      // 2. Phân biệt HÀNG HOÁ / THÀNH PHẨM LAYOUT (Layout lũa đá, Bố cục thủy sinh, Tiểu cảnh...)
      const isLayout = cat.includes('LAYOUT') || subCat.includes('LAYOUT') || name.includes('LAYOUT') || sku.startsWith('LO-') || sku.startsWith('LAY-') || name.includes('BỐ CỤC') || name.includes('TIỂU CẢNH');

      if (segment === 'LAYOUTS') {
          // Hàng hoá / Thành phẩm Layout (Ưu tiên độc lập)
          return isLayout;
      }

      if (segment === 'TANKS') {
          // Thành phẩm: Bể kính
          return isTank && !isLayout;
      }

      if (segment === 'MATERIALS') {
          // Nguyên vật liệu: Kính tấm, Keo silicone, Hóa chất, Xốp
          if (isTank || isLayout) return false;
          return cat.includes('DANH MỤC SẢN XUẤT') || cat.includes('NGUYÊN LIỆU') || cat.includes('VẬT TƯ') || 
                 subCat.includes('KÍNH') || subCat.includes('KEO') || subCat.includes('SILICONE') ||
                 name.includes('KÍNH TẤM') || name.includes('KEO SILICONE') || name.includes('KÍNH KHỔ') || name.includes('APOLLO');
      }

      if (segment === 'STONES') {
          // Đá, Lũa & Cát thô / rời
          // TUYỆT ĐỐI KHÔNG MATCH BỂ NÂNG ĐÁY hoặc HÀNG HOÁ LAYOUT
          if (isTank || isLayout) return false;

          // Kiểm tra từ "ĐÁ" bằng regex ranh giới từ để tránh nhầm với "NÂNG ĐÁY"
          const hasStone = /(^|\s|[,\-_/])(ĐÁ|DA)(\s|[,\-_/]|$)/i.test(name) || subCat.includes('ĐÁ') || cat.includes('ĐÁ');
          const hasWood = name.includes('LŨA') || subCat.includes('LŨA') || cat.includes('LŨA');
          const hasSand = name.includes('CÁT') || subCat.includes('CÁT') || cat.includes('CÁT') || name.includes('PHÂN NỀN') || subCat.includes('PHÂN NỀN');

          return hasStone || hasWood || hasSand;
      }

      if (segment === 'ACCESSORIES') {
          // Phụ kiện sàn: Đèn, Lọc, Máy bơm, Thức ăn, Cây giả, Lưới, Nhiệt kế
          if (isTank || isLayout) return false;
          return cat.includes('PHỤ KIỆN') || cat.includes('HÀNG HOÁ') || 
                 subCat.includes('ĐÈN') || subCat.includes('LỌC') || subCat.includes('BƠM') || subCat.includes('MÁY') || subCat.includes('SƯỞI') || subCat.includes('PHỤ KIỆN') ||
                 name.includes('ĐÈN') || name.includes('LỌC') || name.includes('BƠM') || name.includes('MÁY') || name.includes('SƯỞI');
      }

      return true;
  }, []);

  // Lọc sản phẩm theo tìm kiếm và segment
  const filteredProducts = React.useMemo(() => {
      let list = uniqueProducts;
      if (activeSegment !== 'ALL' && activeSegment !== 'RETURNS') {
          list = list.filter(p => isItemInSegment(p, activeSegment));
      }
      if (subCatFilter) {
          list = list.filter(p => String(p.sub_category || '').toUpperCase().trim() === subCatFilter);
      }
      if (deferredSearch && deferredSearch.trim()) {
          const q = deferredSearch.toLowerCase().trim();
          list = list.filter(p => 
              String(p.sku || '').toLowerCase().includes(q) || 
              String(p.name || '').toLowerCase().includes(q) || 
              String(p.category || '').toLowerCase().includes(q) ||
              String(p.sub_category || '').toLowerCase().includes(q)
          );
      }
      return list;
  }, [uniqueProducts, activeSegment, subCatFilter, deferredSearch, isItemInSegment]);

  // Bộ 4 Metric Cards
  const lowStockCount = React.useMemo(() => {
      return uniqueProducts.filter(p => Number(p.quantity || 0) <= Number(p.minStock || 0)).length;
  }, [uniqueProducts]);

  const totalInventoryCapital = React.useMemo(() => {
      return uniqueProducts.reduce((sum, p) => {
          const q = Math.max(0, Number(p.quantity || 0));
          const c = Number(p.costPrice || 0);
          return sum + (q * c);
      }, 0);
  }, [uniqueProducts]);

  const totalPhysicalUnits = React.useMemo(() => {
      return uniqueProducts.reduce((sum, p) => sum + Math.max(0, Number(p.quantity || 0)), 0);
  }, [uniqueProducts]);

  // Xử lý xuất Excel
  const handleExportExcel = () => {
      const columns = [
          { key: 'sku', label: 'Mã SKU' },
          { key: 'name', label: 'Tên Mặt Hàng' },
          { key: 'category', label: 'Danh Mục' },
          { key: 'sub_category', label: 'Phân Loại' },
          { key: 'quantity', label: 'Tồn Thực Tế' },
          { key: 'unit', label: 'Đơn Vị' },
          { key: 'minStock', label: 'Định Mức Tối Thiểu' }
      ];
      if (canViewCost) {
          columns.push({ key: 'costPrice', label: 'Giá Vốn (VNĐ)' });
          columns.push({ key: 'price', label: 'Giá Bán (VNĐ)' });
      }
      if (typeof exportToExcel === 'function') {
          exportToExcel(filteredProducts, columns, `Ton_Kho_RichFish_${new Date().toISOString().slice(0,10)}.xlsx`);
      } else {
          alert('Tính năng xuất excel đang nạp...');
      }
  };

  // Drawer Handler: Mở Drawer cho sản phẩm
  const handleOpenProductDrawer = (prod) => {
      setSelectedDrawerItem(prod);
      setSelectedDrawerReturn(null);
      setDrawerActiveTab('STOCK_CARD');
      setStockAdjQty('');
      setStockAdjNote('');
  };

  // Drawer Handler: Mở Drawer cho đơn hàng hoàn
  const handleOpenReturnDrawer = (retItem) => {
      setSelectedDrawerReturn(retItem);
      setSelectedDrawerItem(null);
      setDrawerActiveTab('RETURN_INSPECT');
      setInspectPhoto(retItem.inspectionPhoto || '');
      setInspectNote(retItem.inspectionNote || '');
  };

  // Đóng Drawer
  const handleCloseDrawer = () => {
      setSelectedDrawerItem(null);
      setSelectedDrawerReturn(null);
  };

  // Xử lý Thao tác Kho 1 Chạm (+ Nhập Kho / - Xuất SX) kèm Quy Đổi UOM
  const handleExecuteStockAdj = async () => {
      if (!selectedDrawerItem) return;
      const rawNum = parseFloat(stockAdjQty);
      if (isNaN(rawNum) || rawNum <= 0) {
          return triggerToast('Vui lòng nhập số lượng hợp lệ (> 0)!', 'fa-exclamation-triangle', 'warning');
      }

      let convertedQty = rawNum;
      let conversionDescription = `${rawNum} ${selectedDrawerItem.unit || 'đơn vị'}`;

      // Quy đổi UOM tự động:
      // Tấm kính lớn (1.8m x 2.0m = 3.6m²) -> ra m²
      if (stockAdjUnit === 'LARGE_SHEET') {
          convertedQty = Math.round(rawNum * 3.6 * 100) / 100;
          conversionDescription = `${rawNum} Tấm lớn (= ${convertedQty} m²)`;
      } else if (stockAdjUnit === 'BOX') {
          // Thùng keo (24 chai/thùng) -> ra chai
          convertedQty = rawNum * 24;
          conversionDescription = `${rawNum} Thùng (= ${convertedQty} Chai)`;
      }

      setIsSubmittingAdj(true);
      try {
          const deltaQty = stockAdjType === 'IN' ? convertedQty : -convertedQty;
          const newQty = Math.max(0, Number(selectedDrawerItem.quantity || 0) + deltaQty);

          const updatedProd = {
              ...selectedDrawerItem,
              quantity: newQty
          };

          // Ghi nhận chứng từ vào ImportExport
          const newTicket = {
              id: 'IE_' + Date.now(),
              type: stockAdjType === 'IN' ? 'Nhập' : 'Xuất',
              target: stockAdjType === 'IN' ? 'Nhập bổ sung kho' : 'Xuất phục vụ sản xuất',
              date: new Date().toISOString().replace('T', ' ').slice(0, 19),
              note: `[1-Chạm] ${stockAdjType === 'IN' ? 'Nhập' : 'Xuất'} ${conversionDescription} (${selectedDrawerItem.name}). Lý do: ${stockAdjNote || 'Điều chỉnh tức thì'}`,
              totalAmount: (Number(selectedDrawerItem.costPrice || 0) * convertedQty),
              itemsData: JSON.stringify([{
                  id: selectedDrawerItem.id,
                  sku: selectedDrawerItem.sku,
                  name: selectedDrawerItem.name,
                  qty: convertedQty,
                  unit: selectedDrawerItem.unit,
                  price: selectedDrawerItem.costPrice || 0
              }])
          };

          const payload = {
              Products: [updatedProd],
              ImportExport: [newTicket]
          };

          await pushDeltas(payload, `Đã ${stockAdjType === 'IN' ? 'nhập' : 'xuất'} ${conversionDescription}!`, 'fa-box-archive');
          setSelectedDrawerItem(updatedProd);
          setStockAdjQty('');
          setStockAdjNote('');
      } catch (err) {
          triggerToast('Lỗi khi điều chỉnh tồn kho: ' + err.message, 'fa-times', 'danger');
      } finally {
          setIsSubmittingAdj(false);
      }
  };

  // Xử lý Kiểm Định Hàng Hoàn Đảo Chiều (Reverse Logistics)
  const handleResolveReturn = async (decision) => {
      if (!selectedDrawerReturn) return;
      setIsProcessingReturn(true);

      try {
          const isRestock = decision === 'RESTOCK';
          const nowStr = new Date().toISOString().replace('T', ' ').slice(0, 19);

          // 1. Cập nhật trạng thái đơn hàng trong Orders
          const updatedOrder = {
              id: selectedDrawerReturn.id,
              returnStatus: isRestock ? 'RESTOCKED' : 'SCRAPPED',
              inspectedBy: currentUser || 'Thủ kho',
              inspectedAt: nowStr,
              inspectionPhoto: inspectPhoto || selectedDrawerReturn.inspectionPhoto,
              inspectionNote: inspectNote || (isRestock ? 'Hàng nguyên vẹn đạt chuẩn - Đã nhập lại kho thành phẩm' : 'Hàng vỡ nát / phế liệu - Đã chuyển thanh lý tiêu hủy')
          };

          let payload = {
              Orders: [updatedOrder]
          };

          // 2. Nếu HÀNG NGUYÊN VẸN -> Tự động tìm SKU thành phẩm để cộng lại kho
          if (isRestock) {
              const matchedSku = selectedDrawerItem?.sku || null;
              if (matchedSku) {
                  const targetProd = uniqueProducts.find(p => p.sku === matchedSku);
                  if (targetProd) {
                      payload.Products = [{
                          ...targetProd,
                          quantity: Number(targetProd.quantity || 0) + 1
                      }];
                  }
              }
          }

          const msg = isRestock 
              ? `🟢 ĐÃ NHẬP KHO THÀNH PHẨM! Kiện ${selectedDrawerReturn.returnTrackingCode} nguyên vẹn.` 
              : `🔴 ĐÃ XÁC NHẬN PHẾ LIỆU! Kiện ${selectedDrawerReturn.returnTrackingCode} chuyển thanh lý, không cộng kho.`;

          await pushDeltas(payload, msg, isRestock ? 'fa-check-circle' : 'fa-dumpster');
          handleCloseDrawer();
      } catch (err) {
          triggerToast('Lỗi khi xử lý kiểm định: ' + err.message, 'fa-times', 'danger');
      } finally {
          setIsProcessingReturn(false);
      }
  };

  // Tính toán diện tích kính theo công thức chuẩn Hiến pháp: S = (DxR + 2DC + 2RC) x 1.05 m²
  const computedGlassArea = React.useMemo(() => {
      const L = (parseFloat(bomLength) || 0) / 100;
      const W = (parseFloat(bomWidth) || 0) / 100;
      const H = (parseFloat(bomHeight) || 0) / 100;
      const qty = parseInt(bomQty, 10) || 1;
      
      const singleArea = (L * W + 2 * L * H + 2 * W * H) * 1.05; // 5% hao hụt chuẩn
      const totalArea = singleArea * qty;
      const sheetCount = totalArea / 3.6; // 1 tấm khổ 180x200cm = 3.6 m²
      
      return {
          singleArea: Math.round(singleArea * 1000) / 1000,
          totalArea: Math.round(totalArea * 1000) / 1000,
          sheetCount: Math.round(sheetCount * 100) / 100,
          perimeterMeters: Math.round(((L + W) * 2 * qty) * 100) / 100
      };
  }, [bomLength, bomWidth, bomHeight, bomQty]);

      <div className="bg-[#202228] p-1.5 rounded-2xl flex items-center gap-1.5 overflow-x-auto hide-scrollbar border-0 shadow-md">

          { id: 'ALL', label: 'Tất Cả', icon: 'fa-layer-group', count: uniqueProducts.length },

          { id: 'ACCESSORIES', label: '📦 Phụ Kiện Sàn', icon: 'fa-plug' },
          { id: 'RETURNS', label: '⚠️ Chờ Kiểm Định Hàng Hoàn', icon: 'fa-truck-ramp-box', badge: waitingInspectionReturns.length, badgeColor: 'bg-[#A7226F] text-white font-bold' }
        ].map(tab => {

            </button>

        {/* Card 1: Tổng Mặt Hàng */}

            </div>

            {uniqueProducts.length} <span className="text-xs font-normal text-zinc-500 font-sans">mã</span>
          </div>
          <p className="text-[10px] text-zinc-400 mt-0.5">Danh mục hàng hóa chuẩn xưởng</p>

        {/* Card 4: Kiện Hàng Hoàn Chờ Rạch Thùng (Sunset Orange) */}

            {waitingInspectionReturns.length} <span className="text-xs font-normal text-zinc-400 font-sans">kiện chờ KCS</span>
          </div>
          <p className="text-[10px] text-zinc-400 mt-0.5">Tuyệt đối cấm cộng kho tự động</p>
        </div>
      </div>

      {/* 3. TOOLBAR TÌM KIẾM & THAO TÁC QUẢN TRỊ (FOUR SEASONS SOLID MATTE) */}
      <div className="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between w-full">

          <input

          {search && (

        <div className="overflow-x-auto rounded-2xl border border-white/[0.06] bg-[#121214] shadow-sm">
