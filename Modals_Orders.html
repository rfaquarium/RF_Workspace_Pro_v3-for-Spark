                                            const newOrder = { ..._order, status: 'Hoàn Thành' };

                                            if (recForm.createTx && amt > 0) {
                                                if (!recForm.accountId) return triggerToast('Vui lòng chọn tài khoản', 'fa-times', 'danger');
                                                const newTx = {
                                                    id: 'TX_RECONCILE_' + Date.now(),
                                                    type: 'Thu',
                                                    category: 'Doanh Thu Bán Hàng',
                                                    amount: amt,
                                                    fromAccount: '',
                                                    toAccount: recForm.accountId,
                                                    title: `Đơn hàng ${mainOrderCode}`,
                                                    date: safeDateFull.replace('T', ' ').slice(0, 16),
                                                    note: `Kênh: ${_order.channel} | Khách: ${_order.customer}`,
                                                    payerName: _order.channel,
                                                    isAuto: true
                                                };
                                                setOptimisticOrder(newOrder);
                                                setShowReconcile(false);
                                                pushDeltas({ orders: [newOrder], Transactions: [newTx] }, 'Đã đối soát và tạo phiếu thu!', 'fa-check-double').catch(() => { });
                                            } else {
                                                setOptimisticOrder(newOrder);
                                                setShowReconcile(false);
                                                pushDeltas({ orders: [newOrder] }, 'Đã chuyển trạng thái Hoàn Thành (Không sinh phiếu thu)!', 'fa-check-double').catch(() => { });
                                            }
                                        }} className="flex-[2] py-2 bg-[#d4af37] hover:bg-[#7c3aed] text-white font-black text-[10px] rounded-lg shadow-sm">
                                            {recForm.createTx && Number(recForm.amount) > 0 ? 'XÁC NHẬN & TẠO PHIẾU' : 'CHỈ ĐỔI TRẠNG THÁI'}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {(() => {
                        const hasBottomAction = !isReturn && (
                            (isBuKho && handleConfirmStockIn && _order.status !== 'Đã nhập kho') ||
                            (isReadyPack && isPacking && !isPackOwner)
                        );
                        if (!hasBottomAction) return null;
                        return (
                            <div className="mt-1 pt-3 border-t border-[#222] flex gap-2">
                                {isBuKho ? (
                                    handleConfirmStockIn && _order.status !== 'Đã nhập kho' && (
                                        prods.every(p => String(p.status || '').toUpperCase() === 'DONE' || String(p.status || '').toUpperCase() === 'ĐÃ XONG') ?
                                            <button onClick={() => handleConfirmStockIn(_order)} className="flex-1 py-2.5 bg-[#10b981] text-white text-[10px] font-black uppercase tracking-wide rounded-xl active:scale-95 transition-all shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:bg-[#059669]">NHẬP KHO BÙ LỆNH NÀY</button> :
                                            <button disabled className="flex-1 py-2.5 bg-[#1a1a1a] text-[#555] text-[10px] font-black uppercase tracking-wider rounded-xl border border-[#333] cursor-not-allowed">ĐANG SẢN XUẤT</button>
                                    )
                                ) : (
                                    <>
                                        {isReadyPack && isPacking && !isPackOwner && (
                                            <div className="w-full py-2 text-[10px] font-black text-[#fbbf24] bg-[#fbbf24]/10 border border-[#fbbf24]/30 rounded-xl text-center uppercase tracking-wider flex items-center justify-center gap-2">
                                                <i className="fas fa-spinner fa-spin text-xs"></i><span>{currentPackingTask?.user?.split(' ').pop()} ĐANG GÓI...</span>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        );
                    })()}



                    {showInvoiceModal && (
                        <OrderInvoiceModal
                            order={_order}
                            prods={effectiveProds}
                            accessories={effectiveAccessories}
                            erpProducts={erpProducts || erpData?.Products || []}
                            onClose={() => setShowInvoiceModal(false)}
                            triggerToast={triggerToast}
                        />
                    )}
                </div>
            </div>
        );
    }

    // ==========================================
    // 4. COMPONENT QUÉT NHÃN VẬN ĐƠN TỰ ĐỘNG (BƠM ĐƠN TRỰC TIẾP GIỐNG EXCEL)
    // ==========================================
    function ScanLabelModal({ onClose, pushDeltas, existingOrders = [], products = [], triggerToast }) {
        const [imageFile, setImageFile] = React.useState(null);
        const [preview, setPreview] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [parsedOrder, setParsedOrder] = React.useState(null);
        const [manualMatchIndex, setManualMatchIndex] = React.useState(null);
        const [productSearch, setProductSearch] = React.useState('');

        const handleSelectProduct = (selectedProd) => {
            if (manualMatchIndex === null || !parsedOrder) return;
            const updatedItems = [...parsedOrder.items];
            updatedItems[manualMatchIndex] = {
                ...updatedItems[manualMatchIndex],
                name: selectedProd.name,
                matchedProd: selectedProd
            };
            setParsedOrder({
                ...parsedOrder,
                items: updatedItems
            });
            setManualMatchIndex(null);
            setProductSearch('');
            triggerToast(`Đã khớp thủ công với: ${selectedProd.name}`, 'fa-link', 'success');
        };

        const formatMoney = (val) => Math.round(Number(val || 0)).toLocaleString('vi-VN');

        const handleCapture = (e) => {
            const file = e.target.files[0];
            if (file) {
                setImageFile(file);
                const reader = new FileReader();
                reader.onload = (ev) => setPreview(ev.target.result);
                reader.readAsDataURL(file);
            }
        };

        const handlePasteClick = async () => {
            try {
                if (!navigator.clipboard || !navigator.clipboard.read) {
                    triggerToast('Trình duyệt không hỗ trợ nút dán ảnh trực tiếp, vui lòng bấm phím Ctrl+V (hoặc Command+V) để dán!', 'fa-exclamation', 'warning');
                    return;
                }
                const clipboardItems = await navigator.clipboard.read();
                for (const clipboardItem of clipboardItems) {
                    const validTypes = clipboardItem.types.filter(type => type.startsWith('image/') || type === 'application/pdf');
                    if (validTypes.length > 0) {
                        const blob = await clipboardItem.getType(validTypes[0]);
                        setImageFile(blob);
                        const reader = new FileReader();
                        reader.onload = (ev) => setPreview(ev.target.result);
                        reader.readAsDataURL(blob);
                        triggerToast('Đã nhận tài liệu từ bộ nhớ tạm!', 'fa-check', 'success');
                        return;
                    }
                }
                triggerToast('Không tìm thấy tệp hợp lệ trong bộ nhớ tạm!', 'fa-exclamation', 'warning');
            } catch (err) {
                triggerToast('Vui lòng cấp quyền xem bộ nhớ tạm hoặc dùng phím Ctrl+V để dán!', 'fa-times', 'danger');
            }
        };

        React.useEffect(() => {
            const handleGlobalPaste = (e) => {
                const items = (e.clipboardData || e.originalEvent?.clipboardData || window.clipboardData)?.items;
                if (!items) return;
                for (let index in items) {
                    const item = items[index];
                    if (item.kind === 'file' && (item.type.startsWith('image/') || item.type === 'application/pdf')) {
                        const blob = item.getAsFile();
                        if (blob) {
                            setImageFile(blob);
                            const reader = new FileReader();
                            reader.onload = (ev) => setPreview(ev.target.result);
                            reader.readAsDataURL(blob);
                            triggerToast('Đã dán tài liệu thành công!', 'fa-check', 'success');
                            e.preventDefault();
                        }
                    }
                }
            };
            window.addEventListener('paste', handleGlobalPaste);
            return () => window.removeEventListener('paste', handleGlobalPaste);
        }, []);

        const processImage = async () => {
            if (!imageFile) return;
            setIsProcessing(true);
            try {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(imageFile);
                });

                triggerToast('Đang quét và mổ xẻ dữ liệu...', 'fa-spinner fa-spin', 'info');

                let textResult = "";
                if (typeof runGAS === 'function') {
                    try {
                        textResult = await runGAS('processOCR', base64Data);
                    } catch (e) {
                        textResult = "";
                    }
                }

                if (!textResult) {
                    setIsProcessing(false);
                    triggerToast('Không thể quét được dữ liệu từ ảnh (mờ hoặc lỗi). Vui lòng thử lại!', 'fa-exclamation-triangle', 'error');
                    return;
                }

                // BỘ LỌC THÔNG MINH (ĐỌC TỪNG DÒNG)
                const lines = textResult.split('\n').map(l => l.trim()).filter(l => l);
                let draft = { orderCode: '', trackingId: '', customer: '', address: '', phone: '', retailTotal: 0, items: [] };

                let isReadingCustomer = false;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    // 1. Mã Vận Đơn (Bắt SPX, GHN, J&T... hỗ trợ dấu cách/gạch ngang)
                    const trackMatch = line.match(/(SPX[\s-]*[A-Z0-9]+|GYX[\s-]*[A-Z0-9]+|JT[\s-]*[A-Z0-9]+|GHN[\s-]*[A-Z0-9]+)/i);
                    if (trackMatch) draft.trackingId = trackMatch[0].replace(/[^A-Z0-9]/gi, '').toUpperCase();

                    // 2. Mã Đơn Hàng Shopee (Bắt chuẩn format 6 số ngày tháng + 8,9 chữ/số, hỗ trợ dấu cách/gạch ngang)
                    const orderMatch = line.match(/\b([0-9]{6}[\s-]*[A-Z0-9]{8,9})\b/);
                    if (orderMatch) draft.orderCode = orderMatch[1].replace(/[^A-Z0-9]/gi, '').toUpperCase();

                    // 3. Tiền Thu
                    if (line.includes('VND') || line.includes('Tiền thu')) {
                        const moneyMatch = line.match(/([0-9]{1,3}(,[0-9]{3})*|[0-9]+)\s*VND/i);
                        if (moneyMatch) draft.retailTotal = parseInt(moneyMatch[1].replace(/,/g, ''));
                    }

                    // 4. Số điện thoại (Loại trừ số của shop)
                    const phoneMatch = line.match(/(?:84|0[3|5|7|8|9])([0-9]{8})\b/);
                    if (phoneMatch && !line.includes('945445497') && !line.includes('Từ:')) {
                        draft.phone = phoneMatch[0].replace(/^84/, '0');
                    }

                    // 5. Tên Khách & Địa chỉ
                    if (/^(Đến:|To:)$/i.test(line)) {
                        isReadingCustomer = true;
                        if (lines[i + 1]) draft.customer = lines[i + 1].replace(/^Đến:\s*/i, '');
                        if (lines[i + 2]) draft.address = lines[i + 2];
                    } else if (/^Đến:\s*(.+)/i.test(line)) {
                        draft.customer = line.replace(/^Đến:\s*/i, '').trim();
                        if (lines[i + 1] && !lines[i + 1].includes('Nội dung hàng')) draft.address = lines[i + 1];
                    }

                    // 6. Hàng hoá (Bắt đầu bằng số thứ tự "1.", "2." ...)
                    if (/^\d+\.\s/.test(line)) {
                        // Lấy số lượng
                        let qty = 1;
                        const qtyMatch = line.match(/(?:SL|Số lượng)[:\s]*(\d+)/i);
                        if (qtyMatch) qty = parseInt(qtyMatch[1], 10);

                        // Gọt rác tên Shopee (Bỏ số đếm, bỏ mọi thứ sau dấu '|' hoặc dấu phẩy)
                        let rawName = line.replace(/^\d+\.\s/, '');
                        let cleanName = rawName.split(/\||,/)[0].trim();

                        // Trích xuất SKU từ dấu ngoặc vuông nếu có [SKU]
                        let extractedSku = '';
                        const bracketMatch = line.match(/\[(.*?)\]/);
                        if (bracketMatch) {
                            const parts = bracketMatch[1].trim().split(/\s+/).filter(Boolean);
                            extractedSku = parts[parts.length - 1] || bracketMatch[1].trim();
                        }

                        // Dò với kho hàng thực tế (ƯU TIÊN THEO SKU KHO HÀNG)
                        let finalName = cleanName;
                        let matchedProd = null;
                        if (products && products.length > 0) {
                            if (extractedSku) {
                                const extClean = extractedSku.trim().toUpperCase();
                                const extAlphanum = extClean.replace(/[^A-Z0-9]/g, '');
                                matchedProd = products.find(p => {
                                    const pSku = String(p.sku || '').trim().toUpperCase();
                                    return pSku === extClean || (extAlphanum.length >= 3 && pSku.replace(/[^A-Z0-9]/g, '') === extAlphanum);
                                });
                            }

                            if (!matchedProd) {
                                const searchStr = cleanName.toLowerCase();
                                // Bước 1: Khớp tên chính xác 100%
                                matchedProd = products.find(p => p.name && p.name.toLowerCase() === searchStr);
                            }

                            if (!matchedProd) {
                                // Bước 2: Khớp chuỗi con xếp tên dài nhất lên trước
                                const sortedProds = [...products].sort((a, b) => (b.name || '').length - (a.name || '').length);
                                matchedProd = sortedProds.find(p => p.name && p.name.length > 3 && searchStr.includes(String(p.name).toLowerCase()));
                            }

                            if (matchedProd) {
                                finalName = matchedProd.name;
                            }
                        }

                        draft.items.push({ name: finalName, qty: qty, sku: (matchedProd && matchedProd.sku) ? matchedProd.sku : extractedSku, matchedProd: matchedProd });
                    }
                }

                // Fallback nếu Regex lỗi không tìm thấy tên khách
                if (!draft.customer) draft.customer = 'Khách Quét Mã (Cần check lại)';

                // Kiểm tra trùng lặp
                const baseCode = draft.orderCode;
                const existing = (existingOrders || []).find(o => {
                    const oBase = (o.orderCode || '').split(' | MVĐ: ')[0].trim().toLowerCase();
                    return oBase === baseCode.toLowerCase();
                });

                let isDuplicate = false;
                let isUpdate = false;
                let existingId = null;
                let existingRecord = null;

                if (existing) {
                    existingId = existing.id;
                    existingRecord = existing;
                    const existingTrack = (existing.orderCode || '').split(' | MVĐ: ')[1] || '';
                    const existingCustomer = existing.customer || '';
                    const existingRevenue = Number(existing.revenue || 0);

                    const hasNewTrack = draft.trackingId && !existingTrack;
                    const hasNewCustomer = (draft.customer && draft.customer !== 'Khách') && (!existingCustomer || existingCustomer === 'Khách');
                    const hasNewRevenue = draft.retailTotal > 0 && existingRevenue === 0;

                    if (hasNewTrack || hasNewCustomer || hasNewRevenue) {
                        isUpdate = true;
                    } else {
                        isDuplicate = true;
                    }
                }

                setParsedOrder({
                    ...draft,
                    isDuplicate,
                    isUpdate,
                    existingId,
                    existingRecord
                });

                triggerToast(`Bóc tách chuẩn ${draft.items.length} món hàng!`, 'fa-check', 'success');
            } catch (err) {
                triggerToast('Lỗi phân tích ảnh!', 'fa-times', 'danger');
            }
            setIsProcessing(false);
        };

        const submitOrder = async () => {
            if (!parsedOrder) return;
            if (parsedOrder.isDuplicate) {
                alert('Đơn hàng này đã tồn tại trên hệ thống!');
                return;
            }

            setIsSubmitting(true);
            const activeUser = localStorage.getItem('rf_user') || 'Hệ thống';

            try {
                let newOrders = [];
                let newProdItems = [];
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ') : new Date().toISOString().slice(0, 16).replace('T', ' ');
                const finalOrderCode = parsedOrder.trackingId ? `${parsedOrder.orderCode} | MVĐ: ${parsedOrder.trackingId}` : parsedOrder.orderCode;

                if (parsedOrder.isUpdate && parsedOrder.existingRecord) {
                    newOrders.push({
                        id: parsedOrder.existingId,
                        orderCode: finalOrderCode,
                        channel: parsedOrder.existingRecord.channel || 'Shopee VN',
                        customer: (parsedOrder.customer && parsedOrder.customer !== 'Khách') ? parsedOrder.customer : (parsedOrder.existingRecord.customer || 'Khách'),
                        createdAt: parsedOrder.existingRecord.createdAt || safeDateFull,
                        deadline: parsedOrder.existingRecord.deadline,
                        date: parsedOrder.existingRecord.date || safeDateFull.split(' ')[0],
                        status: parsedOrder.existingRecord.status || 'Sẵn Sàng Đóng Gói',
                        accessories: parsedOrder.existingRecord.accessories || '[]',
                        hasProduction: parsedOrder.existingRecord.hasProduction !== undefined ? parsedOrder.existingRecord.hasProduction : true,
                        updatedBy: activeUser,
                        revenue: Number(parsedOrder.retailTotal || 0) > 0 ? Number(parsedOrder.retailTotal) : Number(parsedOrder.existingRecord.revenue || 0)
                    });
                } else {
                    const orderId = 'ORD_' + Date.now();
                    let d = new Date(); d.setDate(d.getDate() + 2); d.setHours(12, 0, 0, 0);
                    const defaultDeadline = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

                    let accessories = [];
                    let orderStatus = 'Sẵn Sàng Đóng Gói';

                    parsedOrder.items.forEach((item, itemIdx) => {
                        const prodInfo = checkProductionItemType(item, products);
                        let matchedItem = prodInfo.matchedProd;
                        let realStockQty = matchedItem ? Number(matchedItem.quantity || 0) : 0;

                        if (!prodInfo.isProd) {
                            accessories.push({ name: item.name, quantity: item.qty, price: 0 });
                        } else {
                            const orderQty = Number(item.qty || 1);
                            const isGlass = prodInfo.isGlass;
                            const workerPhases = isGlass ?
                                { phase1: { name: 'Cắt Dán', status: 'Pending' }, phase2: { name: 'Gọt Keo', status: 'Pending' } } :
                                { phase1: { name: 'Dựng Khung', status: 'Pending' }, phase2: { name: 'Gia Cố', status: 'Pending' } };

                            let currentAvailable = realStockQty;
                            if (prodInfo.isBeLeSize) {
                                const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + itemIdx + '_0';
                                if (currentAvailable >= orderQty) {
                                    newProdItems.push({
                                        id: prodId, orderId: orderId,
                                        type: 'Bể Kính',
                                        name: item.name,
                                        note: `Bể lẻ size có sẵn ở kho (Tạo 1 lệnh bù kho x${orderQty})`,
                                        status: 'Pending', fulfilledFromStock: true,
                                        phases: workerPhases,
                                        deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
                                    });
                                } else {
                                    orderStatus = 'Chờ Sản Xuất';
                                    newProdItems.push({
                                        id: prodId, orderId: orderId,
                                        type: 'Bể Kính',
                                        name: item.name,
                                        note: `Sản xuất BỂ LẺ SIZE cho đơn ${parsedOrder.orderCode || ''} (SL: ${orderQty})`,
                                        status: 'Pending', fulfilledFromStock: false,
                                        phases: workerPhases,
                                        deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Shopee VN') : defaultDeadline
                                    });
                                }
                            } else {
                                for (let q = 0; q < orderQty; q++) {
                                    const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + itemIdx + '_' + q;
                                    if (currentAvailable > 0) {
                                        newProdItems.push({
                                            id: prodId, orderId: orderId,
                                            type: isGlass ? 'Bể Kính' : 'Layout',
                                            name: item.name,
                                            note: `Sản xuất bù kho cho đơn ${parsedOrder.orderCode || ''} (Cái ${q + 1}/${orderQty})`,
                                            status: 'Pending', fulfilledFromStock: true,
                                            phases: workerPhases,
                                            deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
                                        });
                                        currentAvailable--;
                                    } else {
                                        orderStatus = 'Chờ Sản Xuất';
                                        newProdItems.push({
                                            id: prodId, orderId: orderId,
                                            type: isGlass ? 'Bể Kính' : 'Layout',
                                            name: item.name,
                                            note: `Sản xuất mới cho đơn ${parsedOrder.orderCode || ''} (Cái ${q + 1}/${orderQty})`,
                                            status: 'Pending', fulfilledFromStock: false,
                                            phases: workerPhases,
                                            deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Shopee VN') : defaultDeadline
                                        });
                                    }
                                }
                            }
                        }
                    });

                    newOrders.push({
                        id: orderId, orderCode: finalOrderCode, channel: 'Shopee VN', customer: parsedOrder.customer,
                        createdAt: safeDateFull, deadline: defaultDeadline, date: safeDateFull.split(' ')[0],
                        status: orderStatus, accessories: JSON.stringify(accessories),
                        hasProduction: newProdItems.length > 0, updatedBy: activeUser,
                        revenue: Number(parsedOrder.retailTotal || 0)
                    });
                }

                const isUpdate = parsedOrder.isUpdate;
                const msg = isUpdate ? `Đã cập nhật thông tin cho đơn hàng!` : `Đã bơm 1 đơn mới & kích hoạt ${newProdItems.length} lệnh xưởng!`;

                await pushDeltas({ orders: newOrders, prodItems: newProdItems }, msg, 'fa-rocket');
                setIsSubmitting(false);
                onClose();
            } catch (e) {
                alert('Lỗi khi bơm đơn: ' + e.message);
                setIsSubmitting(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[9999] bg-black/90 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in">
                <div className="bg-[#141414] w-full max-w-md rounded-2xl border border-[#333] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                    <div className="p-4 border-b border-[#222] bg-[#1a1a1a] flex justify-between items-center shrink-0">
                        <h2 className="font-black text-[13px] text-[#a78bfa] tracking-wider uppercase flex items-center gap-2"><i className="fas fa-camera text-base"></i>BƠM ĐƠN TỪ ẢNH MÃ VẬN ĐƠN</h2>
                        <button onClick={onClose} disabled={isProcessing || isSubmitting} className="w-8 h-8 bg-[#222] rounded-full text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors"><i className="fas fa-times"></i></button>
                    </div>

                    <div className="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                        {!parsedOrder ? (
                            <>
                                {!preview ? (
                                    <div className="w-full space-y-3">
                                        <label className="w-full h-44 flex flex-col items-center justify-center cursor-pointer rounded-2xl border-2 border-dashed border-purple-500/30 bg-purple-500/5 text-purple-400 hover:bg-purple-500/10 hover:border-purple-500/50 transition-all gap-3 shadow-inner">
                                            <i className="fas fa-camera text-4xl mb-1 text-purple-500 animate-pulse"></i>
                                            <span className="text-[12px] font-black uppercase tracking-widest text-zinc-100">Chọn ảnh nhãn vận đơn</span>
                                            <span className="text-[9px] text-gray-500 font-bold text-center px-4">Chụp trực tiếp nhãn Shopee SPX hoặc tải ảnh chụp nhãn từ thiết bị của bạn</span>
                                            <input type="file" accept="image/png, image/jpeg, image/jpg, image/webp, application/pdf" className="hidden" onChange={handleCapture} />
                                        </label>
                                        <button onClick={handlePasteClick} className="w-full py-3.5 rounded-xl border border-[#333] bg-[#222] text-gray-300 font-bold text-[11px] tracking-widest uppercase hover:bg-[#333] hover:border-purple-500/50 hover:text-white transition-all flex items-center justify-center gap-2 shadow-sm">
                                            <i className="fas fa-paste text-purple-400"></i>
                                            HOẶC DÁN TÀI LIỆU (PASTE / CTRL+V)
                                        </button>

    function GHNPushModal({ order, prods, onClose, pushDeltas, triggerToast, showCopyModal }) {
        const [apiToken, setApiToken] = React.useState("5c588da0-1d0a-11ef-b3d7-824e1db0c320");

        const [loading, setLoading] = React.useState(true);

        const [shops, setShops] = React.useState([]);

        const [shifts, setShifts] = React.useState([]);

        const [provinces, setProvinces] = React.useState([]);
        const [districts, setDistricts] = React.useState([]);
        const [wards, setWards] = React.useState([]);
        const [availableServices, setAvailableServices] = React.useState([]);

        const [selectedProv, setSelectedProv] = React.useState("");
        const [selectedDist, setSelectedDist] = React.useState("");
        const [selectedWard, setSelectedWard] = React.useState("");
        const [selectedService, setSelectedService] = React.useState("");

            weight: 200,

            cod: Math.max(0, order.cod !== undefined ? order.cod : (Number(order.revenue || order.total || 0) - Number(order.discount || 0) + Number(order.shippingFee || 0) - Number(order.prePaid || order.deposit || 0))),
            insurance: Math.min(5000000, Number(order.revenue || order.total || 0)),
            noteCode: "CHOTHUHANG",
            paymentTypeId: 2
        });

        const norm = (str) => {
            if (!str) return "";
            return String(str).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/[^a-z0-9\s]/g, "");
        };

        const formatPhone = (p) => {
            let s = String(p || '').replace(/[^0-9]/g, '');
            if (s.startsWith('84')) s = '0' + s.slice(2);
            if (s && !s.startsWith('0') && s.length === 9) s = '0' + s;
            return s;
        };
        const [customerName, setCustomerName] = React.useState(order.customer || "");
        const [customerPhone, setCustomerPhone] = React.useState(formatPhone(order.phone) || "");

        const fetchDistricts = async (provId, headers) => {
            if (!provId) { setDistricts([]); setWards([]); setSelectedDist(""); setSelectedWard(""); setAvailableServices([]); setSelectedService(""); return; }
            try {
                const data = await window.safeFetchJSON(`https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/master-data\/district?province_id=${provId}`, { headers: headers });
                setDistricts(data.data || []);
                setWards([]); setSelectedDist(""); setSelectedWard("");
                setAvailableServices([]); setSelectedService("");
            } catch (e) { }
        };

        const fetchWards = async (distId, headers) => {
            if (!distId) { setWards([]); setSelectedWard(""); setAvailableServices([]); setSelectedService(""); return; }
            try {
                const data = await window.safeFetchJSON(`https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/master-data\/ward?district_id=${distId}`, { headers: headers });
                setWards(data.data || []);
                setSelectedWard("");
            } catch (e) { }
            
            fetchServices(distId, shopId, apiToken);
        };

        const fetchServices = async (toDistId, currentShopId, currentToken) => {
            if (!toDistId) return;
            try {
                const targetShop = (shops || []).find(s => String(s._id) === String(currentShopId));
                const fromDist = targetShop?.district_id || 1704;
                const data = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/v2\/shipping-order\/available-services", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Token": currentToken },
                    body: JSON.stringify({ shop_id: Number(currentShopId), from_district: Number(fromDist), to_district: Number(toDistId) })
                });
                if (data && data.code === 200 && Array.isArray(data.data) && data.data.length > 0) {
                    setAvailableServices(data.data);
                    setSelectedService(String(data.data[0].service_type_id || data.data[0].service_id || 2));
                } else {
                    // Fallback mặc định dịch vụ Chuẩn
                    setAvailableServices([{ service_type_id: 2, short_name: "Giao Hàng Chuẩn (Mặc định)" }, { service_type_id: 1, short_name: "Giao Hàng Nhanh" }]);
                    setSelectedService("2");

                setAvailableServices([{ service_type_id: 2, short_name: "Giao Hàng Chuẩn (Mặc định)" }, { service_type_id: 1, short_name: "Giao Hàng Nhanh" }]);
                setSelectedService("2");

        };

        React.useEffect(() => {
            if (!selectedProv || !selectedDist || !selectedWard) return;
            const pName = provinces.find(p => String(p.ProvinceID) === String(selectedProv))?.ProvinceName || "";
            const dName = districts.find(d => String(d.DistrictID) === String(selectedDist))?.DistrictName || "";
            const wName = wards.find(w => String(w.WardCode) === String(selectedWard))?.WardName || "";

            let parts = String(order.address || "").split(',');
            let street = parts[0];
            if (parts.length > 3) {
                street = parts.slice(0, parts.length - 3).join(',').trim();
            } else if (parts.length > 1) {
                street = parts[0].trim();
            } else {
                street = (order.address || '').trim();
            }

            const generated = `${street}, ${wName}, ${dName}, ${pName}`;
            setFinalAddress(generated);
        }, [selectedProv, selectedDist, selectedWard, provinces, districts, wards]);

        React.useEffect(() => {
            const init = async () => {
                try {
                    let configToken = apiToken;
                    let configShopId = shopId;
                    try {
                        const conf = await new Promise((resolve) => {
                            google.script.run.withSuccessHandler(resolve).withFailureHandler(() => resolve(null)).getGHNConfig();
                        });
                        if (conf && conf.token) {
                            configToken = conf.token;
                            configShopId = conf.shopId;
                            setApiToken(configToken);
                            setShopId(configShopId);
                        }
                    } catch (e) { console.error("Lỗi lấy cấu hình GHN:", e); }

                    const headers = { "Content-Type": "application/json", "Token": configToken, "ShopId": configShopId };

                    let sId = configShopId;
                    try {
                        const shopData = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/v2\/shop\/all", { headers: headers });
                        if (shopData.code === 200 && shopData.data && shopData.data.shops) {
                            const targetShop = shopData.data.shops.find(s => String(s._id) === sId);
                            setShops(targetShop ? [targetShop] : shopData.data.shops.filter(s => String(s._id) === sId));
                            if (!targetShop && shopData.data.shops.length > 0) setShops(shopData.data.shops);
                            else if (!targetShop) setShops([{ _id: sId, name: sId + " - Richfish Aquarium" }]);
                        } else {
                            setShops([{ _id: sId, name: sId + " - Richfish Aquarium" }]);
                        }
                    } catch (e) { setShops([{ _id: sId, name: sId + " - Richfish Aquarium" }]); }

                    try {
                        const shiftData = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/v2\/shift\/date", { headers: headers });
                        if (shiftData && shiftData.code === 200 && Array.isArray(shiftData.data) && shiftData.data.length > 0) {
                            setShifts(shiftData.data);
                            const now = new Date();
                            let defaultIdx = (now.getHours() >= 12 && shiftData.data.length > 1) ? 1 : 0;
                            if (now.getHours() >= 18 && shiftData.data.length > 2) defaultIdx = 2;
                            else if (now.getHours() >= 18) defaultIdx = shiftData.data.length - 1;
                            setSelectedShift(String(shiftData.data[defaultIdx].id));
                        }
                    } catch (e) { console.error("Lỗi lấy ca GHN:", e); }

                    const provData = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/master-data\/province", { headers: headers });
                    let provs = provData.data || [];
                    setProvinces(provs);

                    const addr = String(order.address || "");
                    let matchedProv = null;
                    for (let p of provs) {
                        const pName = norm(p.ProvinceName);
                        const pExt = p.NameExtension ? p.NameExtension.map(e => norm(e)) : [];
                        if (norm(addr).includes(pName) || pExt.some(e => norm(addr).includes(e))) {
                            matchedProv = p; break;
                        }
                    }

                    if (matchedProv) {
                        setSelectedProv(matchedProv.ProvinceID);
                        const distData = await window.safeFetchJSON(`https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/master-data\/district?province_id=${matchedProv.ProvinceID}`, { headers: headers });
                        let dists = distData.data || [];
                        setDistricts(dists);

                        let matchedDist = null;
                        for (let d of dists) {
                            const dName = norm(d.DistrictName);
                            const dExt = d.NameExtension ? d.NameExtension.map(e => norm(e)) : [];
                            if (norm(addr).includes(dName) || dExt.some(e => norm(addr).includes(e))) {
                                matchedDist = d; break;
                            }
                        }

                        if (matchedDist) {
                            setSelectedDist(matchedDist.DistrictID);
                            fetchServices(matchedDist.DistrictID, configShopId, configToken);

                            const wardData = await window.safeFetchJSON(`https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/master-data\/ward?district_id=${matchedDist.DistrictID}`, { headers: headers });
                            let wrds = wardData.data || [];
                            setWards(wrds);

                            let matchedWard = null;
                            for (let w of wrds) {
                                const wName = norm(w.WardName);
                                const wExt = w.NameExtension ? w.NameExtension.map(e => norm(e)) : [];
                                if (norm(addr).includes(wName) || wExt.some(e => norm(addr).includes(e))) {
                                    matchedWard = w; break;
                                }
                            }
                            if (matchedWard) {
                                setSelectedWard(matchedWard.WardCode);
                            }
                        }
                    }
                } catch (e) {
                    console.error(e);
                    triggerToast("Lỗi tải dữ liệu GHN", "fa-exclamation-triangle", "warning");
                }
                setLoading(false);

            init();
        }, []);

        const handleCreate = async () => {
            let phoneClean = String(customerPhone || '').replace(/[^0-9]/g, '');
            if (phoneClean.startsWith('84')) phoneClean = '0' + phoneClean.slice(2);
            if (!phoneClean.startsWith('0') && phoneClean.length === 9) phoneClean = '0' + phoneClean;

            if (!phoneClean || phoneClean.length < 10) {
                triggerToast("Số điện thoại người nhận chưa hợp lệ (cần đủ 10 số bắt đầu bằng 0)!", "fa-phone", "warning");
                return;
            }
            if (!selectedProv || !selectedDist || !selectedWard) {
                triggerToast("Vui lòng chọn đầy đủ Tỉnh/Thành, Quận/Huyện, Phường/Xã!", "fa-map-marker-alt", "warning");
                return;

            setSubmitting(true);
            try {
                let weightTotal = Number(formData.weight) || 200;
                let validItems = prods && prods.length > 0 ? prods.map(p => {
                    let w = Math.floor(weightTotal / prods.length);
                    if (w < 10) w = 10;
                    return {
                        name: String(p.name || 'Sản phẩm Rich Fish').substring(0, 50).trim(),
                        quantity: Math.max(1, Number(p.qty) || 1),
                        weight: w
                    };
                }) : [{ name: "Sản phẩm Rich Fish", quantity: 1, weight: Math.max(10, weightTotal) }];

                const body = {
                    payment_type_id: Number(formData.paymentTypeId) || 2,

    // ==========================================
