            const statusUpper = String(i.status || '').toUpperCase();
            const qcUpper = String(i.qc_status || '').toUpperCase();
            const isStock = i.fulfilledFromStock === true || String(i.fulfilledFromStock).toUpperCase() === 'TRUE';
            const itemNoteLower = String(i.note || '').toLowerCase();
            const isKhoAm = itemNoteLower.includes('kho âm') && itemNoteLower.includes('chờ sản xuất');

            const isStatusDone = statusUpper === 'DONE' || statusUpper === 'ĐÃ XONG';
            const isFinalQcPassed = qcUpper === 'ĐẠT' || qcUpper.includes('TỰ ĐỘNG KCS') || qcUpper.includes('ĐÃ DUYỆT KCS') || isStatusDone;
            const isStockValid = (statusUpper === 'HOÀN KHO ĐẠT' || isStock) && !isKhoAm;

            // LIÊN KẾT TRẠNG THÁI ĐƠN HÀNG MẸ (PARENT-CHILD CASCADE)
            const parentOrder = getParentOrder(i.orderId);
            const parentStatusUpper = String(parentOrder.status || '').toUpperCase().trim();
            const isParentDelivered = parentStatusUpper === 'ĐÃ BÀN GIAO' || parentStatusUpper === 'HOÀN THÀNH' || 
                                      parentStatusUpper === 'ĐỐI SOÁT THÀNH CÔNG' || parentStatusUpper === 'ĐÃ GIAO' || 
                                      parentStatusUpper === 'DELIVERED' || parentStatusUpper === 'COMPLETED';
            const isParentCancelled = parentStatusUpper === 'ĐƠN HUỶ' || parentStatusUpper === 'ĐƠN HỦY' || 
                                      parentStatusUpper.includes('HUỶ') || parentStatusUpper.includes('HỦY') || 
                                      parentStatusUpper.includes('CANCEL');

            const hasAnyWorkerStarted = (p1 === 'Done') || (p2 === 'Done') ||

            if (statusUpper === 'ĐÃ HUỶ' || statusUpper === 'HUỶ' || statusUpper === 'CANCEL' || statusUpper === 'HỦY' || isParentCancelled) {

            } else if (isParentDelivered && !hasAnyWorkerStarted) {
                // Đơn đã giao/bàn giao nhưng thợ CHƯA TỪNG ĐỤNG TAY VÀO (kho đã lấy hàng có sẵn xuất đi)

        const workerTodayKPI = React.useMemo(() => {

            listWithStatus.forEach(i => {

        const workerFilteredStats = React.useMemo(() => {

                if ((p1Status === 'Done' || p1Status === 'ĐÃ XONG') && isStaffMatch(p1User, currentUser)) {
                    if (checkTimeFilter(p1Date, filterTime, customMonth)) {
                        if (isBeKinh) beKinhP1++;

                    }
                }

                // Phase 2 (Gọt Keo / Gia Cố)

                const p2User = item?.phases?.phase2?.user || item.p2_user;
                const p2Date = item?.phases?.phase2?.endTime || item?.phases?.phase2?.start || item?.phases?.phase2?.date || item.p2_endTime || item.p2_start || item.createdAt;

                if ((p2Status === 'Done' || p2Status === 'ĐÃ XONG') && isStaffMatch(p2User, currentUser)) {

        }, [prodItems, currentUser, filterTime, customMonth]);

        const allWorkersReport = React.useMemo(() => {
            if (!prodItems) return [];

            const statsMap = {};
            const EXCLUDED_USERS = ['Nguyễn Thị Huyền Trang', 'Trung Kiên', 'Nguyễn Thị Diệu Hương', 'Huyền Trang', 'Diệu Hương'];

            // 1. Khởi tạo danh sách thợ từ userConfigs (Config_NhanSu)
            const rawUserList = [
                ...(Array.isArray(userConfigs?.users) ? userConfigs.users : []),
                ...Object.values(userConfigs?.pins || {}).map(u => u?.name).filter(Boolean)
            ];
            rawUserList.forEach(fullNameRaw => {
                const fullName = String(fullNameRaw || '').trim();
                if (fullName && !EXCLUDED_USERS.includes(fullName) && !statsMap[fullName] && fullName !== 'Kho Hàng' && fullName !== 'Hàng') {

                        fullName: fullName,

                    const entry = { fullName: userName, name: userName.split(' ').pop(), dungKhung: 0, giaCo: 0, catDan: 0, gotKeo: 0, reworkCount: 0, overdueCount: 0 };

                            else if (w2) w2.reworkCount++;

        const counts = { 'CHỜ SẢN XUẤT': 0, 'KIỂM ĐỊNH': 0, 'ĐÃ XONG': 0, 'ĐÃ HUỶ': 0, 'TẤT CẢ': typeFiltered.length };
        let countChoKhau1 = 0;

                if (prodPhaseSubFilter === 'PHASE1' && p1Done) return false;
                if (prodPhaseSubFilter === 'PHASE2' && (!p1Done || p2Done)) return false;

        const role = localStorage.getItem('rf_role') || '';
        const adminCheck = isBossRole || (typeof isAdmin !== 'undefined' && isAdmin) || (currentUser && (currentUser.includes('Vinh') || currentUser.includes('Long') || currentUser === 'Đỗ Tiến' || ['SẢN XUẤT', 'QUẢN LÝ SẢN XUẤT', 'QUẢN LÝ KHO', 'TỐI CAO', 'FOUNDER', 'ADMIN'].includes(String(role).toUpperCase())));

        // ==========================================
        // LOGIC ĐẾM NGƯỢC THỜI GIAN CA LÀM VIỆC REALTIME (LEAN SHIFT TIMER)
        // ==========================================
        const [shiftTimeText, setShiftTimeText] = React.useState('Chưa vào ca');
        const [shiftTimeColor, setShiftTimeColor] = React.useState('text-zinc-500');

        React.useEffect(() => {
            const updateShiftTimer = () => {
                if (!attendance || !currentUser) return;

                // Tìm bản ghi check-in hôm nay của thợ hiện tại
                const todayCheckin = attendance.find(a =>
                    isStaffMatch(a.user, currentUser) && a.timeIn && !a.timeOut
                );

                if (!todayCheckin) {
                    setShiftTimeText('Chưa vào ca');
                    setShiftTimeColor('text-zinc-500 font-bold');
                    return;
                }

                // Định mức ca làm việc tiêu chuẩn: 8 tiếng = 28,800,000 ms
                const shiftDurationMs = 8 * 60 * 60 * 1000;

                // Xử lý parse thời gian an toàn (hỗ trợ cả format 08:00 và datetime)
                let inStr = String(todayCheckin.timeIn).trim();
                let timeInMs = NaN;
                if (inStr.length === 5 && inStr.includes(':')) {
                    const datePart = todayCheckin.date || new Date().toISOString().split('T')[0];
                    timeInMs = new Date(`${datePart}T${inStr}:00`).getTime();
                } else {
                    if (inStr.includes(' ') && !inStr.includes('T')) inStr = inStr.replace(' ', 'T');
                    if (inStr.includes('T') && inStr.split(':').length === 2) inStr += ':00';
                    timeInMs = new Date(inStr).getTime();
                }

                if (isNaN(timeInMs)) {
                    setShiftTimeText('Đang làm việc');
                    setShiftTimeColor('text-emerald-400');
                    return;
                }

                const elapsedMs = Date.now() - timeInMs;
                const remainingMs = shiftDurationMs - elapsedMs;

                if (remainingMs <= 0) {
                    setShiftTimeText('Hết ca tiêu chuẩn');
                    setShiftTimeColor('text-rose-500 font-black animate-pulse');
                } else {
                    const remH = Math.floor(remainingMs / 3600000);
                    const remM = Math.floor((remainingMs % 3600000) / 60000);
                    const remS = Math.floor((remainingMs % 60000) / 1000);

                    setShiftTimeText(`Ca: ${remH}h:${String(remM).padStart(2, '0')}m:${String(remS).padStart(2, '0')}s`);
                    setShiftTimeColor(remainingMs < 30 * 60 * 1000 ? 'text-amber-500 font-black animate-pulse' : 'text-emerald-400 font-bold');
                }
            };

            updateShiftTimer();
            const shiftInterval = setInterval(updateShiftTimer, 1000);
            return () => clearInterval(shiftInterval);

                {/* SUB-FILTER KANBAN THEO KHÂU: CHO PHÉP THỢ BẤM 1 CHẠM ĐỂ KÉO VIỆC (LEAN PULL FLOW) */}
                {statusTab === 'CHỜ SẢN XUẤT' && (
                    <div className="flex items-center gap-2 mb-3.5 px-1 animate-fade-in flex-wrap">
                        <span className="text-[10px] font-black text-gray-400 uppercase tracking-wider flex items-center gap-1 mr-1">
                            <i className="fas fa-filter text-amber-400 text-[9px]"></i> Phân Khâu:
                        </span>
                        {[
                            { id: 'ALL', label: 'Tất Cả Khâu', count: counts['CHỜ SẢN XUẤT'] || 0, icon: 'fa-stream' },
                            { id: 'PHASE1', label: typeTab === 'Bể Kính' ? 'Cắt Dán Kính' : 'Dựng Khung Phôi', count: countChoKhau1, icon: 'fa-cube', highlight: 'text-amber-300' },
                            { id: 'PHASE2', label: typeTab === 'Bể Kính' ? 'Gọt Keo Bể' : 'Gia Cố / Gọt Keo', count: countChoKhau2, icon: 'fa-shield-alt', highlight: 'text-emerald-300' }
                        ].map(sub => {
                            const isSubActive = prodPhaseSubFilter === sub.id;
                            return (
                                <button
                                    key={sub.id}
                                    onClick={() => setProdPhaseSubFilter(sub.id)}
                                    className={`px-3 py-1.5 rounded-lg text-[10.5px] font-black flex items-center gap-1.5 transition-all active:scale-95 cursor-pointer ${
                                        isSubActive
                                            ? 'bg-amber-500 text-zinc-950 shadow-md ring-1 ring-amber-400'
                                            : 'bg-white/[0.04] text-zinc-300 border border-white/[0.08] hover:bg-white/[0.08] hover:text-white'
                                    }`}
                                >
                                    <i className={`fas ${sub.icon} text-[9px] ${isSubActive ? 'text-zinc-950' : (sub.highlight || 'text-zinc-400')}`}></i>
                                    <span>{sub.label}</span>
                                    <span className={`px-1.5 py-0.2 rounded text-[9px] min-w-[18px] text-center font-black ${
                                        isSubActive ? 'bg-black/30 text-amber-200' : 'bg-black/40 text-zinc-400 border border-white/5'
                                    }`}>
                                        {sub.count}
                                    </span>
                                </button>
                            );
                        })}
                    </div>
                )}


                {/* DANH SÁCH LỆNH SẢN XUẤT RESPONSIVE CHUẨN ĐỒNG BỘ MỌI THIẾT BỊ */}
                <div className="w-full space-y-4 mt-1 pb-6">
                    {list.length === 0 ? (
                        <div className="text-center py-16 text-[#8a8a8a] font-bold text-[13px] bg-[#0f0f11] rounded-2xl border-2 border-dashed border-white/[0.07] flex flex-col items-center justify-center">
                            <i className="fas fa-clipboard-check text-4xl block mb-3 opacity-50"></i> KHÔNG CÓ LỆNH THỢ
                        </div>
                    ) : (
                        (() => {
                            const normalizeProductionChannel = (rawChan) => {
                                const ch = String(rawChan || '').toUpperCase().trim();

                                // 1. TikTok Shop
                                if (ch.includes('TIKTOK') || ch.includes('TIK TOK') || ch === 'TT') {
                                    return 'TikTok Shop';
                                }

                                // 2. Shopee (VN, TH, SG, MA, PH, TW)
                                if (ch.includes('SHOPEE') || ch.includes('SPX')) {
                                    if (ch.includes('TH') || ch.includes('THÁI')) return 'Shopee TH';
                                    if (ch.includes('SG') || ch.includes('SING')) return 'Shopee SG';
                                    if (ch.includes('MA') || ch.includes('MY') || ch.includes('MALAY')) return 'Shopee MA';
                                    if (ch.includes('PH') || ch.includes('PHILIP')) return 'Shopee PH';
                                    if (ch.includes('TW') || ch.includes('ĐÀI')) return 'Shopee TW';
                                    return 'Shopee VN';
                                }

                                // 3. Cộng Tác Viên
                                if (ch.includes('CỘNG TÁC') || ch.includes('CỘNG TAC') || ch.includes('CTV') || ch === 'CTV') {
                                    return 'Cộng Tác Viên';
                                }

                                // 4. Bán Sỉ
                                if (ch.includes('BÁN SỈ') || ch.includes('BAN SI') || ch.includes('SỈ') || ch.includes('WHOLESALE') || ch.includes('ĐẠI LÝ')) {
                                    return 'Bán Sỉ';
                                }

                                // 5. Bảo Hành
                                if (ch.includes('BẢO HÀNH') || ch.includes('BAO HANH') || ch.includes('SỬA CHỮA') || ch.includes('LÀM LẠI')) {
                                    return 'Bảo Hành';
                                }

                                // 6. Sản Xuất Tồn
                                if (ch.includes('SẢN XUẤT TỒN') || ch.includes('SẢN XUẤT BÙ KHO') || ch.includes('TỒN XƯỞNG') || ch.includes('TỒN') || rawChan === 'SẢN XUẤT TỒN') {
                                    return 'Sản Xuất Tồn';
                                }

                                // 7. Bán Lẻ
                                return 'Bán Lẻ';
                            };

                            const channelPriority = {
                                'BẢO HÀNH': 1,
                                'TIKTOK SHOP': 2,
                                'SHOPEE VN': 3,
                                'SHOPEE TH': 4,
                                'SHOPEE SG': 5,
                                'SHOPEE MA': 6,
                                'SHOPEE PH': 7,
                                'SHOPEE TW': 8,
                                'CỘNG TÁC VIÊN': 9,
                                'BÁN LẺ': 10,
                                'BÁN SỈ': 11,
                                'SẢN XUẤT TỒN': 12
                            };

                            const getChannelPrio = (chan) => {
                                const upper = String(chan || '').toUpperCase();
                                return channelPriority[upper] || 99;
                            };

                            const getEffectiveDeadline = (item, order) => {
                                if (item && item.deadline) {
                                    const t = new Date(item.deadline).getTime();
                                    if (!isNaN(t)) return t;
                                }
                                if (order && order.deadline) {
                                    const t = new Date(order.deadline).getTime();
                                    if (!isNaN(t)) return t;
                                }
                                if (typeof getAutoDeadline === 'function' && order) {
                                    const auto = getAutoDeadline(order.channel, order.createdAt || order.date, order.shippingMethod);
                                    if (auto) {
                                        const t = new Date(auto).getTime();
                                        if (!isNaN(t)) return t;
                                    }
                                }
                                return Infinity;
                            };

                            const sortedList = [...list].sort((a, b) => {
                                const oA = (orders || []).find(x => x.id === a.orderId || x.orderCode === a.orderId) || {};
                                const oB = (orders || []).find(x => x.id === b.orderId || x.orderCode === b.orderId) || {};

                                const aUrgent = a.isUrgent === true || String(a.isUrgent).toUpperCase() === 'TRUE' || oA.isUrgent === true || String(oA.isUrgent).toUpperCase() === 'TRUE';
                                const bUrgent = b.isUrgent === true || String(b.isUrgent).toUpperCase() === 'TRUE' || oB.isUrgent === true || String(oB.isUrgent).toUpperCase() === 'TRUE';
                                if (aUrgent !== bUrgent) return bUrgent ? 1 : -1;

                                if (statusTab === 'ĐÃ XONG' || statusTab === 'KIỂM ĐỊNH') {
                                    const getEnd = (i) => i.phases?.phase2?.endTime || i.phases?.phase1?.endTime || i.phases?.phase2?.date || i.phases?.phase1?.date || '0';
                                    const comp = String(getEnd(b)).localeCompare(String(getEnd(a)));
                                    if (comp !== 0) return comp;
                                } else {
                                    // ƯU TIÊN HẠN BÀN GIAO SỚM NHẤT (EARLIEST DEADLINE FIRST - BẢO VỆ SLA GIAO HÀNG TRÁNH NGHẼN CUỐI NGÀY)
                                    const dlA = getEffectiveDeadline(a, oA);
                                    const dlB = getEffectiveDeadline(b, oB);
                                    if (dlA !== dlB) return dlA - dlB;
                                }

                                const pA = getChannelPrio(normalizeProductionChannel(oA.channel));
                                const pB = getChannelPrio(normalizeProductionChannel(oB.channel));
                                if (pA !== pB) return pA - pB;

                                const dateA = oA.createdAt || oA.date || '0';
                                const dateB = oB.createdAt || oB.date || '0';
                                const dateComp = String(dateA).localeCompare(String(dateB));
                                if (dateComp !== 0) return dateComp;

                                return String(a.id).localeCompare(String(b.id));
                            });

                            const channelGroups = [];
                            sortedList.forEach(item => {
                                const order = item._parentOrder && item._parentOrder.id ? item._parentOrder : getParentOrder(item.orderId);
                                const isItemUrgent = item.isUrgent === true || String(item.isUrgent).toUpperCase() === 'TRUE' || order.isUrgent === true || String(order.isUrgent).toUpperCase() === 'TRUE';
                                const groupKey = normalizeProductionChannel(order.channel || (item.orderId === 'SẢN XUẤT TỒN' ? 'SẢN XUẤT TỒN' : ''));

                                const pA = getChannelPrio(groupKey);
                                let group = channelGroups.find(g => g.groupKey === groupKey);
                                if (!group) {
                                    group = { groupKey, items: [], priority: pA, hasUrgent: false };
                                    channelGroups.push(group);
                                }
                                if (isItemUrgent) group.hasUrgent = true;
                                group.items.push(item);
                            });

                            // Đưa nhóm kênh có chứa đơn hỏa tốc lên đầu tiên
                            channelGroups.sort((a, b) => {
                                if (a.hasUrgent !== b.hasUrgent) return b.hasUrgent ? 1 : -1;
                                return a.priority - b.priority;
                            });

                            return channelGroups.map((channelGroup) => {
                                const { groupKey, items } = channelGroup;
                                let isGroupCollapsed = collapsedGroups[groupKey];
                                if (isGroupCollapsed === undefined) {
                                    isGroupCollapsed = statusTab === 'ĐÃ XONG';
                                }

                                if (filterChannel !== 'ALL') {
                                    const uKey = groupKey.toUpperCase();
                                    const isInterGroup = uKey.includes('XUẤT KHẨU') || uKey.includes('EXPORT') || uKey.includes('QUỐC TẾ') ||
                                        uKey.includes('SHOPEE SG') || uKey.includes('SHOPEE TH') || uKey.includes('SHOPEE TW') ||
                                        uKey.includes('SHOPEE PH') || uKey.includes('SHOPEE MA') || uKey.includes('SHOPEE MY');

                                    if (filterChannel === 'EXPORT' && !isInterGroup) return null;
                                    if (filterChannel === 'SHOPEE' && (isInterGroup || !uKey.includes('SHOPEE'))) return null;
                                    if (filterChannel === 'TIKTOK' && !uKey.includes('TIKTOK')) return null;
                                    if (filterChannel === 'BÁN LẺ' && !uKey.includes('BÁN LẺ')) return null;
                                    if (filterChannel === 'CTV' && !uKey.includes('CỘNG TÁC') && !uKey.includes('CTV')) return null;
                                }

                                const groupHeader = (
                                    <div
                                        key={'hdr-' + groupKey}
                                        onClick={() => setCollapsedGroups(prev => ({ ...prev, [groupKey]: !isGroupCollapsed }))}
                                        style={getChannelInlineStyle(groupKey)}
                                        className="w-full py-3 px-4 mt-4 mb-3 flex items-center justify-between gap-2 rounded-2xl uppercase tracking-wider shadow-lg select-none transition-all font-black cursor-pointer hover:border-white/20"
                                    >
                                        <div className="text-[13px] font-black flex items-center gap-2 truncate text-white">
                                            <i className="fas fa-layer-group opacity-90 text-[12px]"></i>
                                            <span className="truncate">{groupKey}</span>
                                        </div>
                                        <div className="flex items-center gap-2 shrink-0">
                                            <div className="flex items-center gap-1.5 bg-black/40 text-gray-300 px-2.5 py-1 rounded-xl border border-white/5 font-black text-[11px]">
                                                <span>{items.length} LỆNH</span>
                                                <i className={`fas fa-chevron-${isGroupCollapsed ? 'down' : 'up'} text-[10px]`}></i>
                                            </div>
                                        </div>
                                    </div>
                                );

                                if (isGroupCollapsed) {
                                    return <React.Fragment key={groupKey}>{groupHeader}</React.Fragment>;
                                }

                                // Render items inside this channel
                                let content = items.map((item, idx) => {
                                    const order = item._parentOrder && item._parentOrder.id ? item._parentOrder : getParentOrder(item.orderId);
                                    return (
                                        <WorkerCardV2
                                            key={item.id}
                                            item={item}
                                            order={order}
                                            prodItems={prodItems}
                                            erpProducts={erpProducts}
                                            currentUser={currentUser}
                                            pushDeltas={pushDeltas}
                                            userConfigs={userConfigs}
                                            triggerToast={triggerToast}
                                            kpiConfig={kpiConfig}
                                            idx_num={idx + 1}
                                            isAdmin={adminCheck}
                                            orders={orders}
                                            models3D={models3D}
                                            attendance={attendance}
                                            selectedProdIds={selectedProdIds}
                                            toggleSelectProd={toggleSelectProd}
                                            configs={typeTab === 'Bể Kính' ? CONFIGS_BE_KINH : CONFIGS_KHUNG}
                                            onEditItem={setEditingProdItem}
                                            erpData={erpData}
                                        />
                                    );
                                });

                                return (
                                    <React.Fragment key={groupKey}>
                                        {groupHeader}
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3">
                                            {content}
                                        </div>
                                    </React.Fragment>
                                );
                            });
                        })()
                    )}
                </div>

                {/* THA BARS CHO BULK ACTION */}
                {selectedProdIds.length > 0 && (
                    <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] bg-[#1a1a1a] border border-[#d4af37]/50 shadow-[0_10px_40px_rgba(0,0,0,0.8)] rounded-2xl px-5 py-3 flex items-center gap-4 animate-slide-up">
                        <div className="flex items-center gap-2">
                            <span className="w-6 h-6 rounded-full bg-[#d4af37] text-black font-black flex items-center justify-center text-[12px]">{selectedProdIds.length}</span>
                            <span className="text-[#d4af37] font-black uppercase text-[12px] tracking-wider">Đã Chọn</span>
                        </div>
                        <div className="h-6 w-px bg-white/20"></div>
                        <button onClick={handleBulkDelete} className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-black text-[12px] uppercase flex items-center gap-1.5 shadow-md active:scale-95 transition-all">
                            <i className="fas fa-trash"></i> Xoá Hàng Loạt
                        </button>
                        <button onClick={() => setSelectedProdIds([])} className="px-4 py-1.5 bg-gray-600 hover:bg-gray-500 text-white rounded-lg font-black text-[12px] uppercase flex items-center gap-1.5 shadow-md active:scale-95 transition-all">
                            Bỏ Chọn
                        </button>
                    </div>
                )}

                {globalPreview && (
                    <div className="fixed inset-0 z-[99999] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in select-none" onClick={() => setGlobalPreview(null)}>
                        {/* Nút Đóng Luôn Hiển Thị Cố Định Ở Góc Trên Phải */}
                        <button
                            onClick={() => setGlobalPreview(null)}
                            className="fixed top-4 right-4 z-[100000] text-white hover:text-rose-400 text-lg w-10 h-10 flex items-center justify-center bg-black/70 hover:bg-rose-600 border border-white/20 rounded-full transition-all shadow-xl backdrop-blur-md active:scale-95"
                            title="Đóng xem ảnh"
                        >
                            <i className="fas fa-times"></i>
                        </button>

                        <div className="relative max-w-lg w-full flex flex-col items-center animate-slide-up my-auto" onClick={e => e.stopPropagation()}>
                            <img src={globalPreview} alt="Ảnh nghiệm thu" className="w-full h-auto max-h-[75vh] object-contain rounded-2xl shadow-[0_0_30px_rgba(16,185,129,0.3)] border border-white/10 bg-black cursor-pointer" onClick={() => setGlobalPreview(null)} />
                            <div className="mt-4 flex items-center justify-center gap-3 flex-wrap">
                                <div className="flex items-center gap-2 text-[#10b981] text-[11px] font-black uppercase tracking-[0.15em] bg-[#141414] px-4 py-2 rounded-full border border-[#10b981]/30 shadow-md">
                                    <i className="fas fa-check-circle"></i> ẢNH KẾT QUẢ SẢN XUẤT CHÍNH XÁC
                                </div>
                                <button
                                    onClick={() => setGlobalPreview(null)}
                                    className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-black text-[11px] uppercase tracking-wider rounded-full shadow-lg flex items-center gap-1.5 active:scale-95 transition-all"
                                >
                                    <i className="fas fa-times"></i> ĐÓNG LẠI
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showAddSXTModal && (() => {
                    const AddModalComp = window.AddModal || (typeof AddModal !== 'undefined' ? AddModal : null);
                    if (!AddModalComp) {
                        console.warn('AddModal chưa sẵn sàng');
                        return null;
                    }
                    return (
                        <AddModalComp
                            onClose={() => {
                                setShowAddSXTModal(false);
                                setSxtDraftData(null);
                            }}
                            pushDeltas={pushDeltas}
                            products={erpProducts}
                            erpData={erpData}
                            triggerToast={triggerToast}
                            userConfigs={userConfigs}
                            configGiaLayout={erpData?.Config_GiaLayout || []}
                            kpiConfig={kpiConfig || window.kpiConfig || erpData?.Config_KPI || []}
                            forceSXTOnly={true}
                            draftData={sxtDraftData}
                        />
                    );
                })()}

                {editingProdItem && (
                    <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={() => setEditingProdItem(null)}>
                        <div className="bg-[#141414] border border-[#333] w-full max-w-sm rounded-[24px] p-5 shadow-2xl flex flex-col relative animate-slide-up" onClick={e => e.stopPropagation()}>
                            <button onClick={() => setEditingProdItem(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>
                            <h3 className="text-white font-black text-[16px] uppercase tracking-widest mb-4 flex items-center gap-2"><i className="fas fa-edit text-[#d4af37]"></i> CHỈNH SỬA LỆNH</h3>

                            <div className="space-y-4">
                                <div>
                                    <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Ghi chú Lệnh</label>
                                    <textarea
                                        value={editingProdItem.note || ''}
                                        onChange={e => setEditingProdItem({ ...editingProdItem, note: e.target.value })}
                                        className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3 text-[12px] font-bold text-white outline-none focus:border-[#d4af37] min-h-[80px]"
                                        placeholder="Nhập ghi chú hoặc cảnh báo cho thợ..."
                                    ></textarea>
                                </div>

                                <div>
                                    <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Giao đích danh (Bỏ trống = Ai cũng nhận được)</label>
                                    <select
                                        value={editingProdItem.assignee || ''}
                                        onChange={e => setEditingProdItem({ ...editingProdItem, assignee: e.target.value })}
                                        className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[12px] font-bold text-[#d4af37] outline-none focus:border-[#d4af37]"
                                    >
                                        <option value="">-- KHÔNG GIAO ĐÍCH DANH --</option>
                                        {(Array.from(new Set([
                                            ...(Array.isArray(userConfigs?.users) ? userConfigs.users : []),
                                            ...Object.values(userConfigs?.pins || {}).map(u => u?.name).filter(Boolean)
                                        ])).filter(name => name && name !== 'Kho Hàng' && name !== 'Hàng' && name.toLowerCase() !== 'khách')).map(uName => (
                                            <option key={uName} value={uName}>{uName}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Hạn bàn giao</label>
                                    <input
                                        type="datetime-local"
                                        value={editingProdItem.deadline ? String(editingProdItem.deadline).replace(' ', 'T').substring(0, 16) : ''}
                                        onChange={e => setEditingProdItem({ ...editingProdItem, deadline: e.target.value })}
                                        className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[12px] font-bold text-white outline-none focus:border-[#d4af37]"
                                    />
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    const upd = { ...editingProdItem };
                                    pushDeltas({ prodItems: [upd] }, 'Đã lưu thay đổi', 'fa-save');
                                    setEditingProdItem(null);
                                }}
                                className="w-full mt-6 py-3.5 bg-[#d4af37] hover:bg-yellow-500 text-black font-black rounded-xl text-[12px] uppercase tracking-wider flex items-center justify-center gap-2 shadow-md active:scale-95 transition-all"
                            >
                                <i className="fas fa-check-circle"></i> LƯU THAY ĐỔI
                            </button>
                        </div>
                    </div>
                )}

                {annotationData && (window.ImageAnnotationModal || typeof ImageAnnotationModal !== 'undefined') && (() => {
                    const AnnotationComp = window.ImageAnnotationModal || ImageAnnotationModal;
                    return (
                        <AnnotationComp
                            item={annotationData.item || annotationData}
                            readOnly={annotationData.readOnly ?? annotationData._readOnly ?? false}
                            onClose={() => setAnnotationData(null)}
                            onSave={(updatedItem) => {
                                pushDeltas({ prodItems: [updatedItem] }, 'Từ chối khung, đã báo lỗi cho thợ!', 'fa-exclamation-triangle');
                                setAnnotationData(null);
                            }}
                        />
                    );
                })()}

                {/* MODAL HỘP ĐEN ĐỐI SOÁT THAO TÁC THỢ (CHỈ DÀNH CHO BOSS TỐI CAO) */}
                {isBossRole && (
                    <WorkerActionAuditModal
                        isOpen={showAuditModal}
                        onClose={() => setShowAuditModal(false)}
                        prodItems={prodItems}
                        orders={orders}
                        packings={packings || erpData?.packings || []}
                        erpData={erpData}
                        userConfigs={userConfigs}
                        triggerToast={triggerToast}
                    />
                )}

                {/* MODAL TRA CỨU BỂ KÍNH & LAYOUT HẾT KHO */}
                {showOutOfStockModal && (
                    <OutOfStockProductsModal
                        isOpen={showOutOfStockModal}
                        onClose={() => setShowOutOfStockModal(false)}
                        erpProducts={erpProducts || []}
                        onQuickCreateSXT={(selectedItemsList) => {
                            const items = Array.isArray(selectedItemsList) ? selectedItemsList : (selectedItemsList ? [{ product: selectedItemsList, qty: 1 }] : []);
                            const draftItems = items.map(it => ({
                                name: it.product.name,

                            }));
                            setSxtDraftData({
                                channel: 'Sản Xuất Tồn',
                                customer: currentUser || 'Kho Tổng',
                                responsibleUser: currentUser,
                                items: draftItems
                            });
                            setShowAddSXTModal(true);
                        }}
                        triggerToast={triggerToast}
                    />
                )}

                {/* MODAL PHÁT TÍN HIỆU SOS KHẨN CẤP XƯỞNG SẢN XUẤT */}
                {showSOSModal && (
                    <div className="fixed inset-0 z-[9999] bg-black/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 animate-fade-in">
                        <div className="bg-[#09090b] border border-rose-500/40 rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-[0_0_50px_rgba(244,63,94,0.25)] relative text-zinc-100 animate-scale-up">
                            {/* Header Modal */}
                            <div className="flex items-center justify-between pb-4 border-b border-rose-500/20">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 shadow-sm animate-pulse">
                                        <i className="fas fa-triangle-exclamation text-lg"></i>
                                    </div>
                                    <div>
                                        <div className="font-black text-base sm:text-lg text-rose-400 tracking-tight flex items-center gap-2">
                                            PHÁT TÍN HIỆU SOS XƯỞNG
                                            <span className="text-[9px] bg-rose-500/30 text-rose-300 font-mono px-2 py-0.5 rounded-full border border-rose-500/40 font-black">KHẨN CẤP</span>
                                        </div>
                                        <div className="text-zinc-400 text-xs mt-0.5">Báo động trực tiếp tới Ban Quản Lý, Thợ Trưởng & KCS</div>
                                    </div>
                                </div>
                                <button
                                    onClick={() => setShowSOSModal(false)}
                                    className="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition-all cursor-pointer"
                                >
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>

                            {/* Body Modal */}
                            <div className="mt-4 space-y-4">
                                <div>
                                    <label className="text-xs font-black text-zinc-300 uppercase tracking-wider block mb-2">
                                        1. Loại sự cố / Yêu cầu khẩn cấp:
                                    </label>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        {[
                                            { id: 'Vỡ Kính / Hỏng Phôi', icon: 'fa-burst', color: 'text-rose-400', border: 'border-rose-500/30', bg: 'bg-rose-500/10' },
                                            { id: 'Hỏng Máy Mài / Cắt CNC', icon: 'fa-gears', color: 'text-amber-400', border: 'border-amber-500/30', bg: 'bg-amber-500/10' },
                                            { id: 'Hết Vật Tư Cấp Bách (Keo/Kính)', icon: 'fa-boxes-packing', color: 'text-orange-400', border: 'border-orange-500/30', bg: 'bg-orange-500/10' },
                                            { id: 'Cần Trợ Giúp Thợ Gấp', icon: 'fa-hands-holding-child', color: 'text-purple-400', border: 'border-purple-500/30', bg: 'bg-purple-500/10' },
                                            { id: 'Sự Cố An Toàn Lao Động', icon: 'fa-shield-halved', color: 'text-red-400', border: 'border-red-500/30', bg: 'bg-red-500/10' }
                                        ].map(item => {
                                            const isSelected = sosType === item.id;
                                            return (
                                                <button
                                                    key={item.id}
                                                    type="button"
                                                    onClick={() => {
                                                        if (typeof window.triggerHaptic === 'function') window.triggerHaptic('light');
                                                        setSosType(item.id);
                                                    }}
                                                    className={`p-3 rounded-2xl text-left border transition-all flex items-center gap-2.5 cursor-pointer ${
                                                        isSelected
                                                            ? 'bg-rose-500/20 border-rose-500 text-white shadow-[0_0_12px_rgba(244,63,94,0.3)] font-black'
                                                            : `${item.bg} ${item.border} text-zinc-300 hover:border-white/20`
                                                    }`}
                                                >
                                                    <i className={`fas ${item.icon} ${item.color} text-sm`}></i>
                                                    <span className="text-xs">{item.id}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-black text-zinc-300 uppercase tracking-wider block mb-1.5">
                                        2. Chi tiết sự cố / Ghi chú cho xưởng:
                                    </label>
                                    <textarea
                                        value={sosNote}
                                        onChange={e => setSosNote(e.target.value)}
                                        placeholder="Mô tả cụ thể: Vị trí bàn làm việc, mã đơn bị ảnh hưởng, kích thước bể vỡ, cần thợ nào qua hỗ trợ..."
                                        rows={3}
                                        className="w-full bg-[#141418] border border-white/10 focus:border-rose-500 rounded-2xl p-3 text-xs text-zinc-100 placeholder-zinc-500 outline-none transition-all resize-none"
                                    ></textarea>
                                </div>

                                <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-2xl flex items-start gap-2.5 text-[11px] text-rose-300">
                                    <i className="fas fa-bullhorn text-rose-400 mt-0.5 shrink-0"></i>
                                    <span>
                                        Khi bấm xác nhận, hệ thống sẽ kích hoạt <b>Còi Báo Động (Web Audio)</b>, <b>Rung Haptic dồn dập</b> và gửi <b>Web Push Notification</b> khẩn cấp tới toàn bộ thiết bị đang mở app.
                                    </span>
                                </div>
                            </div>

                            {/* Actions */}
                            <div className="mt-6 flex items-center justify-end gap-3">
                                <button
                                    type="button"
                                    onClick={() => setShowSOSModal(false)}
                                    className="px-4 py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white hover:bg-white/5 transition-all cursor-pointer"
                                >
                                    HỦY BỎ
                                </button>
                                <button
                                    type="button"
                                    disabled={isSendingSOS}
                                    onClick={async () => {
                                        setIsSendingSOS(true);
                                        try {
                                            if (typeof window.triggerHaptic === 'function') window.triggerHaptic('sos');
                                            if (typeof window.playEmergencyAlarm === 'function') window.playEmergencyAlarm('sos');

                                            const sosMsg = `[SOS XƯỞNG] ${sosType}: ${sosNote ? sosNote.trim() : 'Cần trợ giúp khẩn cấp!'} (Báo bởi: ${currentUser || 'Thợ Xưởng'})`;

                                            // 1. Broadcast Firebase Realtime
                                            if (typeof window.firebase !== 'undefined' && window.firebase.database) {
                                                try {
                                                    window.firebase.database().ref('rf_realtime_delta').set({
                                                        client_id: window._rf_client_id || 'sos_trigger',
                                                        timestamp: Date.now(),
                                                        trigger_by: currentUser || 'Thợ Xưởng',
                                                        alert_type: 'FACTORY_SOS',
                                                        is_sos: true,
                                                        message: sosMsg,
                                                        payload: {
                                                            Tracking_Log: [{
                                                                id: 'SOS_' + Date.now(),
                                                                'Thời gian': new Date().toISOString(),
                                                                'Tên nhân sự': currentUser || 'Thợ Xưởng',
                                                                'Hoàn thành': 'PHÁT TÍN HIỆU SOS',
                                                                'Hỏi AI': sosType,
                                                                'Ghi chú thêm': sosNote || ''
                                                            }]
                                                        }
                                                    });
                                                } catch (fbErr) {
                                                    console.warn('Firebase SOS broadcast error:', fbErr);
                                                }
                                            }

                                            // 2. Ghi nhận Tracking Log qua pushDeltas
                                            if (typeof pushDeltas === 'function') {
                                                pushDeltas({
                                                    Tracking_Log: [{
                                                        id: 'SOS_' + Date.now(),
                                                        'Thời gian': new Date().toISOString(),
                                                        'Tên nhân sự': currentUser || 'Thợ Xưởng',
                                                        'Hoàn thành': 'PHÁT TÍN HIỆU SOS',
                                                        'Hỏi AI': sosType,
                                                        'Ghi chú thêm': sosNote || ''
                                                    }]
                                                }, 'Đã gửi tín hiệu SOS khẩn cấp', 'fa-triangle-exclamation');
                                            }

                                            triggerToast('🚨 ĐÃ PHÁT TÍN HIỆU SOS TỚI TOÀN BỘ HỆ THỐNG!', 'fa-triangle-exclamation', 'danger');
                                            setShowSOSModal(false);
                                            setSosNote('');
                                        } finally {
                                            setIsSendingSOS(false);
                                        }
                                    }}
                                    className="px-5 py-2.5 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-black text-xs uppercase tracking-wider rounded-xl shadow-[0_0_20px_rgba(244,63,94,0.4)] flex items-center gap-2 active:scale-95 transition-all cursor-pointer"
                                >
                                    {isSendingSOS ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-bullhorn"></i>}
                                    <span>PHÁT TÍN HIỆU SOS NGAY</span>
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    });
</script>
