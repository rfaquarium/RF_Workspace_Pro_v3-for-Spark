<script type="text/babel">
// =========================================================================
// 📊 FILE: Tab_Dashboard.txt
// CHỨC NĂNG: Dashboard điều hành, phân tích tài chính & giám sát xưởng realtime

// -------------------------------------------------------------------------
// 🚨 WIDGET CẢNH BÁO VẬN HÀNH (SLA, BOTTLENECK, INVENTORY)
// -------------------------------------------------------------------------
const OperationsHealthWidget = React.memo(function OperationsHealthWidget() {
  const [alerts, setAlerts] = React.useState({ sla: [], bottleneck: [], inventory: [] });
  const [loading, setLoading] = React.useState(true);
  const [isExpanded, setIsExpanded] = React.useState(false);

  React.useEffect(() => {
    if (typeof window.runGAS === 'function') {
      window.runGAS('getOperationsHealth')
        .then(res => {
          if (res && res.success && res.data) {
            setAlerts(res.data);
          }
        })
        .catch(err => console.error('Lỗi khi fetch Health Alerts:', err))
        .finally(() => setLoading(false));
    }
  }, []);

  if (loading) return null;

  const totalAlerts = (alerts.sla?.length || 0) + (alerts.bottleneck?.length || 0) + (alerts.inventory?.length || 0);
  if (totalAlerts === 0) return null;

  return (
    <div className="vision-card p-4 sm:p-5 mb-4 relative overflow-hidden transition-all border-rose-500/30">
      
      {/* Header bar */}
      <div 
        onClick={() => setIsExpanded(!isExpanded)}
        className="flex items-center justify-between cursor-pointer select-none"
      >
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center">
              <i className="fas fa-exclamation-triangle text-rose-400 animate-pulse text-[12px]"></i>
          </div>
          <div>
            <span className="font-display font-extrabold text-[15px] text-white tracking-tight">Cảnh Báo Vận Hành</span>
            <span className="ml-2.5 text-[10.5px] font-bold text-rose-300 bg-rose-500/20 border border-rose-500/30 px-2.5 py-0.5 rounded-full font-mono">
              {totalAlerts} vấn đề
            </span>
          </div>
        </div>
        
        <button className="text-[11px] font-semibold text-zinc-300 hover:text-white flex items-center gap-1.5 bg-white/[0.06] hover:bg-white/[0.1] px-3.5 py-1.5 rounded-full border border-white/10 transition-all font-display">
          <span>{isExpanded ? 'Thu gọn' : 'Chi tiết'}</span>
          <i className={`fas fa-chevron-${isExpanded ? 'up' : 'down'} text-[9px]`}></i>
        </button>
      </div>

      {/* Expanded content with strict max-height scrolling */}
      {isExpanded && (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3 pt-3 border-t border-[#27272a] animate-fade-in">
          {alerts.packingEmergency && (
            <div className="col-span-1 md:col-span-3 bg-red-950/40 border border-red-500/50 rounded-lg p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div className="text-[11px] font-bold text-red-200 flex items-center gap-2">
                <i className="fas fa-exclamation-circle text-red-400 text-[13px] animate-pulse"></i>
                <span>{alerts.packingEmergency.message} (Nhân sự: <strong className="text-white underline">{alerts.packingEmergency.staff}</strong>)</span>
              </div>
              <button 
                onClick={() => window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { detail: { tab: 'orders', trigger: 'filterReadyPack', mode: 'WORKSPACE' } }))}
                className="text-[9px] font-black uppercase bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded transition-colors w-fit shrink-0"
              >
                Mở Đơn Đóng Gói
              </button>
            </div>
          )}
          {alerts.sla.length > 0 && (
            <div className="bg-[#121214] border border-[#27272a] rounded-lg p-3">
              <div className="text-[10px] font-black text-orange-400 uppercase mb-2 flex items-center justify-between">
                <span className="flex items-center gap-1.5"><i className="fas fa-clock"></i> Trễ SLA Đơn</span>
                <span className="bg-orange-500/10 text-orange-400 px-1.5 py-0.2 rounded font-mono text-[9px]">{alerts.sla.length}</span>
              </div>
              <ul className="space-y-1.5 max-h-36 overflow-y-auto pr-1 custom-scrollbar">
                {alerts.sla.map((msg, idx) => (
                  <li key={idx} className="text-[10px] font-medium text-zinc-300 flex items-start gap-1.5 leading-snug">
                    <span className="text-orange-500/60 mt-0.5">•</span> 
                    <span>{msg}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
          {alerts.bottleneck.length > 0 && (
            <div className="bg-[#121214] border border-[#27272a] rounded-lg p-3">
              <div className="text-[10px] font-black text-amber-400 uppercase mb-2 flex items-center justify-between">
                <span className="flex items-center gap-1.5"><i className="fas fa-hammer"></i> Nghẽn Xưởng</span>
                <span className="bg-amber-500/10 text-amber-400 px-1.5 py-0.2 rounded font-mono text-[9px]">{alerts.bottleneck.length}</span>
              </div>
              <ul className="space-y-1.5 max-h-36 overflow-y-auto pr-1 custom-scrollbar">
                {alerts.bottleneck.map((msg, idx) => (
                  <li key={idx} className="text-[10px] font-medium text-zinc-300 flex items-start gap-1.5 leading-snug">
                    <span className="text-amber-500/60 mt-0.5">•</span> 
                    <span>{msg}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
          {alerts.inventory.length > 0 && (
            <div className="bg-[#121214] border border-[#27272a] rounded-lg p-3">
              <div className="text-[10px] font-black text-sky-400 uppercase mb-2 flex items-center justify-between">
                <span className="flex items-center gap-1.5"><i className="fas fa-box-open"></i> Kho/Hết Hàng</span>
                <span className="bg-sky-500/10 text-sky-400 px-1.5 py-0.2 rounded font-mono text-[9px]">{alerts.inventory.length}</span>
              </div>
              <ul className="space-y-1.5 max-h-36 overflow-y-auto pr-1 custom-scrollbar">
                {alerts.inventory.map((msg, idx) => (
                  <li key={idx} className="text-[10px] font-medium text-zinc-300 flex items-start gap-1.5 leading-snug">
                    <span className="text-sky-500/60 mt-0.5">•</span> 
                    <span>{msg}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      )}
    </div>
  );
});

// -------------------------------------------------------------------------
// 🚀 COMPONENT 1: BẢNG NHẮC VIỆC SẢN XUẤT & ĐÓNG GÓI PHÂN LUỒNG THEO THỢ
// TÂN (DỰNG KHUNG) - TÂM (GIA CỐ) - DƯƠNG (CẮT DÁN) - HƯƠNG (ĐÓNG GÓI)
// -------------------------------------------------------------------------
const ProductionStaffDispatchBoard = React.memo(function ProductionStaffDispatchBoard({
  prodItems = [],
  orders = [],
  packings = [],
  currentUser = '',
  isAdmin = false,
  isBoss = false,
  pushDeltas,
  triggerToast,
  kpiConfig = [],
  erpData = {}
}) {
  // selectedStaff: null (mặc định đóng gọn) | 'TAN' | 'TAM' | 'DUONG' | 'HUONG'
  const [selectedStaff, setSelectedStaff] = React.useState(null);

  // 1. Phân luồng DỰNG KHUNG -> BÁO TÂN (Trần Duy Tân)
  const tanTasks = React.useMemo(() => {
    return (prodItems || []).filter(item => {
      if (!item || item.orderId === 'MATERIAL_REQ') return false;
      const s = String(item.status || '').toUpperCase().trim();
      if (s === 'DONE' || s === 'ĐÃ XONG' || s === 'ĐÃ HUỶ' || s === 'HỦY/VỠ' || s === 'HOÀN KHO ĐẠT' || item.fulfilledFromStock) return false;
      
      const typeUpper = String(item.type || item.category || '').toUpperCase();
      const isGlass = typeUpper.includes('BỂ KÍNH') || String(item.name || '').toLowerCase().includes('bể');
      if (isGlass) return false; // Bể kính dành cho Dương

      // Khâu 1 chưa hoàn thành
      const p1Status = String(item.phases?.phase1?.status || '').toUpperCase().trim();
      return p1Status !== 'DONE' && p1Status !== 'ĐÃ XONG' && p1Status !== 'HOÀN THÀNH';
    });
  }, [prodItems]);

  // 2. Phân luồng GIA CỐ -> BÁO TÂM (Lại Trường Tâm)
  const tamTasks = React.useMemo(() => {
    return (prodItems || []).filter(item => {
      if (!item || item.orderId === 'MATERIAL_REQ') return false;
      const s = String(item.status || '').toUpperCase().trim();
      if (s === 'DONE' || s === 'ĐÃ XONG' || s === 'ĐÃ HUỶ' || s === 'HỦY/VỠ' || s === 'HOÀN KHO ĐẠT' || item.fulfilledFromStock) return false;
      
      const typeUpper = String(item.type || item.category || '').toUpperCase();
      const isGlass = typeUpper.includes('BỂ KÍNH') || String(item.name || '').toLowerCase().includes('bể');
      if (isGlass) return false;

      // Khâu 1 ĐÃ XONG nhưng Khâu 2 CHƯA XONG -> Chuyển giao sang Tâm gia cố/gắn rêu
      const p1Status = String(item.phases?.phase1?.status || '').toUpperCase().trim();
      const p2Status = String(item.phases?.phase2?.status || '').toUpperCase().trim();
      const isP1Done = p1Status === 'DONE' || p1Status === 'ĐÃ XONG' || p1Status === 'HOÀN THÀNH';
      const isP2Done = p2Status === 'DONE' || p2Status === 'ĐÃ XONG' || p2Status === 'HOÀN THÀNH';

      return isP1Done && !isP2Done;
    });
  }, [prodItems]);

  // 3. Phân luồng CẮT DÁN BỂ KÍNH -> BÁO DƯƠNG (Nguyễn Hoàng Dương)
  const duongTasks = React.useMemo(() => {
    return (prodItems || []).filter(item => {
      if (!item || item.orderId === 'MATERIAL_REQ') return false;
      const s = String(item.status || '').toUpperCase().trim();
      if (s === 'DONE' || s === 'ĐÃ XONG' || s === 'ĐÃ HUỶ' || s === 'HỦY/VỠ' || s === 'HOÀN KHO ĐẠT' || item.fulfilledFromStock) return false;
      
      const typeUpper = String(item.type || item.category || '').toUpperCase();
      const nameLower = String(item.name || '').toLowerCase();
      const isGlass = typeUpper.includes('BỂ KÍNH') || nameLower.includes('bể') || nameLower.includes('kính') || nameLower.includes('bán cạn') || nameLower.includes('terarium');
      if (!isGlass) return false;

      const p1Status = String(item.phases?.phase1?.status || '').toUpperCase().trim();
      const p2Status = String(item.phases?.phase2?.status || '').toUpperCase().trim();
      const isBothDone = (p1Status === 'DONE' || p1Status === 'ĐÃ XONG') && (p2Status === 'DONE' || p2Status === 'ĐÃ XONG');
      return !isBothDone;
    });
  }, [prodItems]);

  // 4. Phân luồng ĐÓNG GÓI -> BÁO HƯƠNG (Nguyễn Thị Diệu Hương)
  const huongTasks = React.useMemo(() => {
    const allPackings = packings || erpData?.Packings || [];
    return (orders || []).filter(o => {
      if (!o) return false;
      const ch = String(o.channel || '').toUpperCase().trim();
      if (ch === 'SẢN XUẤT TỒN' || ch === 'SẢN XUẤT BÙ KHO' || ch.includes('SẢN XUẤT TỒN') || ch.includes('BÙ KHO') || ch.includes('SX TỒN')) {
        return false;
      }

      const s = String(o._effectiveStatus || o.status || '').toUpperCase().trim();
      const exclude = ['ĐÃ BÀN GIAO', 'HOÀN THÀNH', 'ĐƠN HUỶ', 'HÀNG HOÀN', 'ĐÃ NHẬP KHO', 'ĐỐI SOÁT THÀNH CÔNG', 'ĐÃ GIAO', 'DELIVERED', 'COMPLETED', 'CANCELLED', 'RETURNED'];
      if (exclude.includes(s)) return false;

      const oIdStr = String(o.id || '').trim();
      const oCodeStr = String(o.orderCode || '').trim();
      const baseCodeStr = oCodeStr.split(' | ')[0].split('|')[0].trim();

      const hasDonePack = allPackings.some(p => {
        const pOrd = String(p.orderId || '').trim();
        const isMatch = pOrd && (pOrd === oIdStr || pOrd === oCodeStr || pOrd === baseCodeStr);
        const ps = String(p.status || '').toUpperCase().trim();
        return isMatch && (ps === 'DONE' || ps === 'ĐÃ ĐÓNG GÓI' || ps === 'HOÀN THÀNH' || ps === 'ĐÃ XONG') && (!p.note || !p.note.includes('kho'));
      });
      if (hasDonePack) return false;

      const linkedProds = (prodItems || []).filter(p => {
        const pOrd = String(p.orderId || '').trim();
        return pOrd && (pOrd === oIdStr || pOrd === oCodeStr || pOrd === baseCodeStr);
      });

      if (linkedProds.length > 0) {
        return linkedProds.every(p => {
          const ps = String(p.status || '').toUpperCase().trim();
          return ps === 'DONE' || ps === 'ĐÃ XONG' || ps === 'HOÀN KHO ĐẠT' || p.fulfilledFromStock;
        });
      }

      return s === 'SẴN SÀNG ĐÓNG GÓI' || s === 'SẴN SÀNG' || s === 'READY_PACK';
    });
  }, [orders, prodItems, packings, erpData?.Packings]);

  const effectiveKpi = React.useMemo(() => {
    return (kpiConfig && kpiConfig.length > 0) ? kpiConfig : (erpData?.Config_KPI || []);
  }, [kpiConfig, erpData?.Config_KPI]);

  // Helper tính thưởng công khoán đóng gói từ Config_KPI chuẩn hoá
  const calcOrderPackingReward = React.useCallback((order) => {
    if (!order) return 0;
    if (typeof getPackingReward === 'function') {
      return getPackingReward(order, effectiveKpi, order.channel || '');
    }
    if (typeof calculatePackingReward === 'function') {
      return calculatePackingReward(order, effectiveKpi);
    }
    return 0;
  }, [effectiveKpi]);

  // Helper tính thưởng công khoán sản xuất từ Config_KPI chuẩn hoá
  const calcProdItemReward = React.useCallback((item, phase) => {
    if (!item) return 0;
    if (phase === 'phase1') {
      let r = Number(item.phases?.phase1?.reward_vnd || item.p1_reward_vnd || 0);
      if (r === 0 && typeof calculateKPI === 'function') {
        r = calculateKPI(item.name || item.type || '', 'khâu 1', effectiveKpi, item.channel || '').reward || 0;
      }
      return r;
    }
    if (phase === 'phase2') {
      let r = Number(item.phases?.phase2?.reward_vnd || item.p2_reward_vnd || 0);
      if (r === 0 && typeof calculateKPI === 'function') {
        r = calculateKPI(item.name || item.type || '', 'khâu 2', effectiveKpi, item.channel || '').reward || 0;
      }
      return r;
    }
    if (phase === 'both') {
      let r1 = Number(item.phases?.phase1?.reward_vnd || item.p1_reward_vnd || 0);
      let r2 = Number(item.phases?.phase2?.reward_vnd || item.p2_reward_vnd || 0);
      if (r1 === 0 && typeof calculateKPI === 'function') {
        r1 = calculateKPI(item.name || item.type || '', 'khâu 1', effectiveKpi, item.channel || '').reward || 0;
      }
      if (r2 === 0 && typeof calculateKPI === 'function') {
        r2 = calculateKPI(item.name || item.type || '', 'khâu 2', effectiveKpi, item.channel || '').reward || 0;
      }
      return r1 + r2;
    }
    return 0;
  }, [effectiveKpi]);

  // Tổng số việc đang chờ
  const totalTasks = tanTasks.length + tamTasks.length + duongTasks.length + huongTasks.length;

  // Tính tổng thưởng công khoán đang chờ nhận cho từng thợ từ Config_KPI thực tế
  const tanReward = React.useMemo(() => {
    return tanTasks.reduce((sum, item) => sum + calcProdItemReward(item, 'phase1'), 0);
  }, [tanTasks, calcProdItemReward]);

  const tamReward = React.useMemo(() => {
    return tamTasks.reduce((sum, item) => sum + calcProdItemReward(item, 'phase2'), 0);
  }, [tamTasks, calcProdItemReward]);

  const duongReward = React.useMemo(() => {
    return duongTasks.reduce((sum, item) => sum + calcProdItemReward(item, 'both'), 0);
  }, [duongTasks, calcProdItemReward]);

const huongReward = React.useMemo(() => {
    return huongTasks.reduce((sum, order) => sum + calcOrderPackingReward(order), 0);
  }, [huongTasks, calcOrderPackingReward]);

  // Điều hướng nhanh đến Tab Sản Xuất / Đơn Hàng
  const handleNavigateToProduction = (itemId) => {
    window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', {
      detail: { tab: 'production', trigger: 'focusItem', data: { id: itemId } }
    }));
  };

  const handleNavigateToPacking = (order) => {
    window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', {
      detail: { tab: 'orders', trigger: 'filterReadyPack', mode: 'WORKSPACE' }
    }));
  };

  // Cấu hình metadata cho 4 thợ theo bảng màu Four Seasons
  const staffConfigs = [
    {
      key: 'TAN',
      name: 'Trần Duy Tân',
      shortName: 'Tân',
      role: 'Khâu 1: Dựng Khung',
      phaseLabel: 'Khâu 1 Layout',
      icon: 'fa-hammer',
      tasks: tanTasks,
      reward: tanReward,
      color: '#F46C3F', // Sunset Orange
      textColor: '#ffffff',
      badgeClass: 'bg-[#F46C3F] text-white',
      theme: {
        badge: 'bg-[#F46C3F] text-white border-transparent',
        hoverBorder: 'hover:border-[#F46C3F]/50',
        border: 'border-[#F46C3F]/20'
      }
    },
    {
      key: 'TAM',
      name: 'Lại Trường Tâm',
      shortName: 'Tâm',
      role: 'Khâu 2: Gia Cố & Rêu',
      phaseLabel: 'Khâu 2 Gắn Rêu',
      icon: 'fa-shield-alt',
      tasks: tamTasks,
      reward: tamReward,
      color: '#2E9599', // Spring Teal
      textColor: '#ffffff',
      badgeClass: 'bg-[#2E9599] text-white',
      theme: {
        badge: 'bg-[#2E9599] text-white border-transparent',
        hoverBorder: 'hover:border-[#2E9599]/50',
        border: 'border-[#2E9599]/20'
      }
    },
    {
      key: 'DUONG',
      name: 'Nguyễn Hoàng Dương',
      shortName: 'Dương',
      role: 'Khâu 3: Cắt Dán Bể',
      phaseLabel: 'Bể Kính / Mài Keo',
      icon: 'fa-cube',
      tasks: duongTasks,
      reward: duongReward,
      color: '#F7DC68', // Warm Yellow
      textColor: '#1e2026',
      badgeClass: 'bg-[#F7DC68] text-[#1e2026]',
      theme: {
        badge: 'bg-[#F7DC68] text-[#1e2026] border-transparent',
        hoverBorder: 'hover:border-[#F7DC68]/50',
        border: 'border-[#F7DC68]/20'
      }
    },
    {
      key: 'HUONG',
      name: 'Nguyễn Thị Diệu Hương',
      shortName: 'Hương',
      role: 'Khâu 4: Đóng Gói Xuất',
      phaseLabel: 'Đóng Gói / Giao Vận',
      icon: 'fa-boxes',
      tasks: huongTasks,
      reward: huongReward,
      color: '#A7226F', // Berry Magenta
      textColor: '#ffffff',
      badgeClass: 'bg-[#A7226F] text-white',
      theme: {
        badge: 'bg-[#A7226F] text-white border-transparent',
        hoverBorder: 'hover:border-[#A7226F]/50',
        border: 'border-[#A7226F]/20'
      }
    }
  ];

  // Nhân sự hiện đang được chọn mở danh sách
  const activeStaffConfig = React.useMemo(() => {
    return staffConfigs.find(s => s.key === selectedStaff) || null;
  }, [selectedStaff, tanTasks, tamTasks, duongTasks, huongTasks]);

  // Toggle nhân sự
  const handleToggleStaff = (staffKey) => {
    setSelectedStaff(prev => (prev === staffKey ? null : staffKey));
  };

  return (
    <div className="vision-card p-4 sm:p-5 mb-4 relative overflow-hidden transition-all">
      {/* Background Subtle Ambient Glow */}
      <div className="absolute top-0 left-1/4 w-80 h-28 bg-white/[0.03] rounded-full blur-[60px] pointer-events-none"></div>

      {/* HEADER SECTION */}
      <div className="flex items-center justify-between gap-3 pb-3 border-b border-white/[0.08] relative z-10">
        <div className="flex items-center gap-2.5 min-w-0">
          <div className="w-8 h-8 rounded-xl bg-white/[0.06] border border-white/10 flex items-center justify-center text-zinc-200 shadow-sm shrink-0">
            <i className="fas fa-clipboard-list text-[13px]"></i>
          </div>
          <div className="min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <h2 className="font-display font-extrabold text-[15px] sm:text-[17px] text-white tracking-tight">
                Tiến Độ Xưởng & Phân Việc
              </h2>
              {totalTasks > 0 ? (
                <span className="pill-ongoing">
                  {totalTasks} việc cần xử lý
                </span>
              ) : (
                <span className="pill-complete">
                  Đã hoàn thành 100%
                </span>
              )}
            </div>
            <p className="text-[11px] text-zinc-400 font-medium truncate mt-0.5 font-display">
              Chạm vào thợ để xem và cập nhật tiến độ công việc
            </p>
          </div>
        </div>

        {/* Trạng thái xem hiện tại */}
        {activeStaffConfig && (
          <button 
            onClick={() => setSelectedStaff(null)}
            className="hidden sm:flex items-center gap-1.5 text-[11px] font-semibold text-zinc-300 hover:text-white bg-white/[0.06] hover:bg-white/[0.1] px-3 py-1.5 rounded-full border border-white/10 transition-all shrink-0 cursor-pointer"
            title="Thu gọn danh sách việc"
          >
            <i className="fas fa-chevron-up text-[9px] text-zinc-400"></i>
            <span>Đóng việc {activeStaffConfig.shortName}</span>
          </button>
        )}
      </div>

      {/* 4 THẺ THỢ CỐT LÕI (BẤM VÀO THỢ ĐỂ THẢ DANH SÁCH VIỆC) */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 my-3 relative z-10">
        {staffConfigs.map((staff) => {
          const isSelected = selectedStaff === staff.key;
          const count = staff.tasks.length;

          return (
            <div 
              key={staff.key}
              onClick={() => handleToggleStaff(staff.key)}
              className={`p-3.5 rounded-2xl border transition-all duration-200 cursor-pointer select-none relative overflow-hidden group active:scale-[0.98] ${
                isSelected 
                  ? 'bg-white/[0.12] border-white/30 shadow-[0_8px_24px_rgba(0,0,0,0.6)] ring-1 ring-white/30' 
                  : 'bg-white/[0.04] hover:bg-white/[0.08] border-white/[0.08] hover:border-white/20'
              }`}
            >
              {/* Layout ngang trên Mobile, cân đối trên Desktop */}
              <div className="flex items-center justify-between gap-3">
                
                {/* Cột trái: Icon + Role + Name */}
                <div className="flex items-center gap-3 min-w-0 flex-1">
                  <div 
                    className="w-10 h-10 rounded-xl flex items-center justify-center text-sm shrink-0 border"
                    style={{
                      backgroundColor: isSelected ? staff.color : `${staff.color}18`,
                      borderColor: isSelected ? staff.color : `${staff.color}40`,
                      color: isSelected ? staff.textColor : staff.color
                    }}
                  >
                    <i className={`fas ${staff.icon}`}></i>
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="text-[11px] font-semibold font-display truncate" style={{ color: staff.color }}>
                      {staff.role}
                    </div>
                    <div className="text-[14px] font-bold text-zinc-100 font-display group-hover:text-white transition-colors truncate">
                      {staff.name}
                    </div>
                  </div>
                </div>

                {/* Cột phải: Task Count + Reward + Indicator */}
                <div className="flex flex-col items-end shrink-0 pl-1">
                  {count > 0 ? (
                    <span 
                      className="font-bold text-[11px] px-3 py-0.5 rounded-full"
                      style={{
                        backgroundColor: staff.color,
                        color: staff.textColor
                      }}
                    >
                      {count} việc
                    </span>
                  ) : (
                    <span className="bg-white/[0.05] text-zinc-400 font-semibold text-[11px] px-2.5 py-0.5 rounded-full border border-white/[0.08]">
                      0 việc
                    </span>
                  )}

                  <div className="flex items-center gap-1.5 mt-1.5">
                    {staff.reward > 0 && (
                      <span className="font-mono text-[9.5px] font-bold text-[#d4af37]">
                        +{staff.reward.toLocaleString('vi-VN')}đ
                      </span>
                    )}
                    <i className={`fas fa-chevron-down text-[9px] transition-transform duration-200 ${isSelected ? 'rotate-180 text-white' : 'text-zinc-500'}`}></i>
                  </div>
                </div>

              </div>
            </div>
          );
        })}
      </div>

      {/* DANH SÁCH VIỆC THẢ XUỐNG CỦA THỢ ĐƯỢC CHỌN (ACCORDION DRAWER) */}
      {activeStaffConfig && (
        <div className={`mt-3 pt-3 border-t ${activeStaffConfig.theme.border} relative z-10 animate-in fade-in duration-200`}>
          {/* Thanh tiêu đề của danh sách được mở */}
          <div className="flex items-center justify-between mb-2.5 px-1">
            <div className="flex items-center gap-2 flex-wrap">
              <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded border ${activeStaffConfig.theme.badge}`}>
                <i className={`fas ${activeStaffConfig.icon} mr-1`}></i>
                Việc của {activeStaffConfig.shortName}
              </span>
              <span className="text-[11px] font-bold text-zinc-300">
                ({activeStaffConfig.tasks.length} việc cần xử lý)
              </span>
              {activeStaffConfig.reward > 0 && (
                <span className="text-[10px] font-mono font-bold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">
                  Tổng thưởng: +{activeStaffConfig.reward.toLocaleString('vi-VN')} đ
                </span>
              )}
            </div>

            <button 
              onClick={() => setSelectedStaff(null)}
              className="text-zinc-400 hover:text-zinc-200 text-[10.5px] font-bold flex items-center gap-1 hover:underline cursor-pointer"
            >
              <i className="fas fa-times text-[10px]"></i> Thu gọn
            </button>
          </div>

          {/* Danh sách các công việc cụ thể */}
          <div className="space-y-2 max-h-[360px] overflow-y-auto pr-1 custom-scrollbar">
            {activeStaffConfig.tasks.length === 0 ? (
              <div className="text-center py-7 bg-[#121214] rounded-xl border border-dashed border-[#27272a] text-zinc-500 text-[11px] font-medium">
                <i className="fas fa-check-circle text-emerald-500/70 text-base mb-1 block"></i>
                Tuyệt vời! <strong className="text-zinc-300">{activeStaffConfig.name}</strong> không có việc nào đang bị tồn đọng.
              </div>
            ) : (
              activeStaffConfig.tasks.map((item, idx) => {
                const isOrder = activeStaffConfig.key === 'HUONG';
                const itemReward = isOrder 
                  ? calcOrderPackingReward(item)
                  : (activeStaffConfig.key === 'TAN' 
                      ? calcProdItemReward(item, 'phase1')
                      : (activeStaffConfig.key === 'TAM'
                          ? calcProdItemReward(item, 'phase2')
                          : calcProdItemReward(item, 'both')
                        )
                    );

                return (
                  <div 
                    key={item.id || idx}
                    className={`p-2.5 sm:p-3 bg-[#121214] border border-[#27272a] rounded-xl flex items-center justify-between gap-2.5 transition-all ${activeStaffConfig.theme.hoverBorder} group`}
                  >
                    {/* Cột trái: Thông tin lệnh / đơn */}
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-1.5 flex-wrap mb-1">
                        <span className={`text-[9px] font-black uppercase px-1.5 py-0.5 rounded border ${activeStaffConfig.theme.badge}`}>
                          {activeStaffConfig.role}
                        </span>
                        <span className="text-[9.5px] font-mono font-bold text-zinc-400 bg-[#121214] px-1.5 py-0.5 rounded border border-[#27272a]">
                          {isOrder ? (item.orderCode || item.id) : (item.orderId || 'Sản Xuất Tồn')}
                        </span>
                        {item.channel && (
                          <span className="text-[9px] font-bold text-zinc-400">
                            ({item.channel})
                          </span>
                        )}
                      </div>

                      <div className="text-[11.5px] font-extrabold text-zinc-100 truncate group-hover:text-white transition-colors">
                        {isOrder ? (item.customer ? `${item.customer} - ${item.phone || ''}` : `Đơn hàng ${item.orderCode}`) : item.name}
                      </div>

                      {/* Chi tiết phụ kiện / ghi chú */}
                      <div className="text-[10px] text-zinc-400 mt-1 flex items-center gap-2 flex-wrap">
                        {item.note && (
                          <span className="text-zinc-400 italic truncate max-w-xs sm:max-w-md">
                            <i className="fas fa-info-circle mr-1 text-[8.5px]"></i>{item.note}
                          </span>
                        )}
                        {item.deadline && (
                          <span className="text-amber-400/90 font-medium font-mono text-[9px] shrink-0">
                            <i className="fas fa-clock mr-1"></i>Hạn: {item.deadline.split('T')[0] || item.deadline}
                          </span>
                        )}
                      </div>
                    </div>

                    {/* Cột phải: Thưởng & Nút làm việc nhanh */}
                    <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                      {itemReward > 0 && (
                        <div className="text-right hidden sm:block">
                          <span className="text-[10.5px] font-black font-mono text-emerald-400">
                            +{itemReward.toLocaleString('vi-VN')} đ
                          </span>
                          <span className="text-[8.5px] text-zinc-500 block">Thưởng khâu</span>
                        </div>
                      )}

                      {isOrder ? (
                        <button 
                          onClick={() => handleNavigateToPacking(item)}
                          className="px-2.5 sm:px-3 py-1.5 bg-purple-500 hover:bg-purple-600 text-white font-black text-[9.5px] uppercase tracking-wide rounded-lg transition-all flex items-center gap-1.5 shadow-sm active:scale-95 cursor-pointer"
                        >
                          <i className="fas fa-box-open"></i> Đóng Gói
                        </button>
                      ) : (
                        <button 
                          onClick={() => handleNavigateToProduction(item.id)}
                          className="px-2.5 sm:px-3 py-1.5 bg-[#1f1f23] hover:bg-[#27272a] text-zinc-200 hover:text-white border border-[#333] hover:border-amber-500/40 font-bold text-[9.5px] uppercase tracking-wide rounded-lg transition-all flex items-center gap-1.5 shadow-sm active:scale-95 cursor-pointer"
                        >
                          <i className="fas fa-tools text-amber-400"></i> Xem / Làm
                        </button>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      )}
    </div>
  );
});

// -------------------------------------------------------------------------
// 📋 COMPONENT 2: BẢNG LỊCH SỬ BỊ TRỪ LƯƠNG TRONG THÁNG (GỌN GÀNG & DROPDOWN)
// -------------------------------------------------------------------------
const MonthlyPenaltyLedger = React.memo(function MonthlyPenaltyLedger({
  bonusPenalty = [],
  attendance = [],
  currentUser = '',
  isAdmin = false,
  isBoss = false,
  pushDeltas,
  triggerToast
}) {
  const currentMonthStr = React.useMemo(() => {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  }, []);

  const [selectedMonth, setSelectedMonth] = React.useState(currentMonthStr);
  const [isOpenDetails, setIsOpenDetails] = React.useState(false);
  const [processingId, setProcessingId] = React.useState(null);

  // 1. Quét và chuẩn hoá toàn bộ dữ liệu bị trừ lương (BonusPenalty + Attendance Penalties)
  const allPenaltyRecords = React.useMemo(() => {
    let list = [];

    // Nguồn 1: BonusPenalty (Chỉ lấy các khoản PHẠT / VI PHẠM THẬT SỰ - LOẠI TRỪ TUYỆT ĐỐI TẠM ỨNG & CHO VAY)
    (bonusPenalty || []).forEach(bp => {
      if (!bp) return;
      const typeStr = String(bp.type || '').trim();
      const typeUpper = typeStr.toUpperCase();
      const noteUpper = String(bp.note || '').toUpperCase();

      // Loại trừ TUYỆT ĐỐI các giao dịch tài chính cá nhân (Tạm ứng, cho vay, hoàn ứng, thanh toán lương)
      if (
        typeUpper.includes('TẠM ỨNG') || 
        typeUpper.includes('CHO VAY') || 
        typeUpper.includes('ĐÃ TRẢ') || 
        typeUpper.includes('THƯỞNG') || 
        typeUpper.includes('VAY') ||
        typeUpper.includes('ỨNG LƯƠNG') ||
        noteUpper.includes('TẠM ỨNG') ||
        noteUpper.includes('CHO VAY') ||
        noteUpper.includes('THANH TOÁN DỨT ĐIỂM')
      ) {
        return;
      }

      const amt = Number(bp.amount || 0);
      const isPenaltyType = typeStr.includes('Phạt') || typeStr.includes('Trừ') || typeStr.includes('Bảo Hành') || typeStr.includes('Vi Phạm') || typeStr.includes('SLA') || typeStr.includes('Kỷ Luật') || typeStr.includes('Chậm') || typeStr.includes('Vỡ') || typeStr.includes('Lỗi') || noteUpper.includes('PHẠT') || noteUpper.includes('TRỪ');
      
      if (isPenaltyType && amt !== 0) {
        const absAmt = Math.abs(amt);
        list.push({
          id: bp.id,
          rawId: bp.id,
          user: bp.user || 'Nhân sự',
          amount: absAmt,
          type: bp.type || 'Phạt Vi Phạm',
          note: bp.note || 'Trừ lương vi phạm',
          date: bp.date || '',
          orderCode: bp.orderCode || '',
          source: 'BonusPenalty'
        });
      }
    });

    // Nguồn 2: Attendance (Phạt đi trễ / chấm công)
    (attendance || []).forEach(att => {
      if (!att) return;
      const pen = Number(att.penalty || 0);
      if (pen > 0) {
        list.push({
          id: 'ATT_PEN_' + (att.id || (att.user + '_' + att.date)),
          rawId: att.id,
          user: att.user || 'Nhân sự',
          amount: pen,
          type: 'Đi trễ / Chấm công',
          note: att.note ? `Chấm công: ${att.note}` : `Vi phạm giờ giấc ca làm (${att.timeIn || att.morningIn || 'Đi trễ'})`,
          date: att.date || '',
          orderCode: '',
          source: 'Attendance',
          attRecord: att
        });
      }
    });

    // Sắp xếp thời gian mới nhất lên đầu
    list.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    return list;
  }, [bonusPenalty, attendance]);

  // 2. Lọc theo Tháng được chọn
  const filteredRecords = React.useMemo(() => {
    if (selectedMonth === 'ALL') return allPenaltyRecords;
    return allPenaltyRecords.filter(rec => String(rec.date || '').startsWith(selectedMonth));
  }, [allPenaltyRecords, selectedMonth]);

  // 3. Thống Kê Tổng Quan Trong Tháng Được Chọn
  const totalDeductedAmount = filteredRecords.reduce((sum, r) => sum + r.amount, 0);
  const totalIncidents = filteredRecords.length;

  // Danh sách các tháng có dữ liệu phạt
  const monthOptions = React.useMemo(() => {
    const set = new Set();
    set.add(currentMonthStr);
    allPenaltyRecords.forEach(r => {
      if (r.date && r.date.length >= 7) {
        set.add(r.date.slice(0, 7));
      }
    });
    return Array.from(set).sort().reverse();
  }, [allPenaltyRecords, currentMonthStr]);

  // Xoá / Miễn phạt (Chỉ dành cho Admin / Boss)
  const handleForgivePenalty = async (record) => {
    if (!isAdmin && !isBoss) {
      triggerToast('Chỉ Ban Quản Trị mới có quyền miễn trừ khoản phạt!', 'fa-lock', 'warning');
      return;
    }

    if (!window.confirm(`Xác nhận XOÁ / MIỄN PHẠM cho ${record.user} số tiền -${record.amount.toLocaleString('vi-VN')}đ?\nLý do: ${record.note}`)) {
      return;
    }

    setProcessingId(record.id);
    try {
      if (record.source === 'BonusPenalty') {
        await pushDeltas({ deletes: { BonusPenalty: [record.rawId] } }, `Đã miễn phạt -${record.amount.toLocaleString('vi-VN')}đ cho ${record.user}!`, 'fa-trash');
      } else if (record.source === 'Attendance' && record.attRecord) {
        const updAtt = { ...record.attRecord, penalty: 0, note: (record.attRecord.note || '') + ' [Đã miễn phạt]' };
        await pushDeltas({ Attendance: [updAtt] }, `Đã miễn phạt chấm công cho ${record.user}!`, 'fa-check');
      }
      triggerToast('Đã xoá bản ghi phạt thành công!', 'fa-check', 'success');
    } catch (e) {
      triggerToast('Lỗi khi xoá bản ghi phạt!', 'fa-times', 'danger');
    }
    setProcessingId(null);
  };

  return (
    <div className="vision-card p-4 sm:p-5 mb-4 relative overflow-hidden transition-all">
      {/* Accent Glow */}
      <div className="absolute top-0 right-1/4 w-60 h-24 bg-white/[0.02] rounded-full blur-[50px] pointer-events-none"></div>

      {/* HEADER SECTION */}
      <div className="flex items-center justify-between gap-2 pb-3 border-b border-white/[0.08] relative z-10">
        <div className="flex items-center gap-2.5 min-w-0">
          <div className="w-8 h-8 rounded-xl bg-white/[0.06] border border-white/10 flex items-center justify-center text-rose-400 shadow-sm shrink-0">
            <i className="fas fa-gavel text-[12px]"></i>
          </div>
          <div className="min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <h2 className="font-display font-extrabold text-[15px] sm:text-[17px] text-white tracking-tight truncate">
                Lịch Sử Trừ Lương & Kỷ Luật
              </h2>
              <span className="bg-rose-500/15 text-rose-300 border border-rose-500/25 px-2 py-0.5 rounded-full text-[10px] font-bold font-mono">
                {filteredRecords.length} vi phạm
              </span>
            </div>
          </div>
        </div>

        {/* Nút Phạt Nhanh & Lọc Tháng */}
        <div className="flex items-center gap-2 shrink-0">
          <select 
            value={selectedMonth} 
            onChange={e => setSelectedMonth(e.target.value)}
            className="bg-white/[0.06] hover:bg-white/[0.1] border border-white/10 focus:border-rose-500/50 text-white text-[11px] font-semibold rounded-full px-3 py-1.5 outline-none cursor-pointer font-display transition-colors"
          >
            <option value="ALL" className="bg-[#18191e] text-white">Tất cả tháng</option>
            {monthOptions.map(m => (
              <option key={m} value={m} className="bg-[#18191e] text-white">Tháng {m.split('-')[1]}/{m.split('-')[0]}</option>
            ))}
          </select>

          {(isAdmin || isBoss) && (
            <button 
              onClick={() => window.dispatchEvent(new Event('openQuickPenaltyModal'))}
              className="bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 border border-rose-500/30 hover:border-rose-500/50 font-bold text-[11px] px-3.5 py-1.5 rounded-full flex items-center gap-1.5 transition-all cursor-pointer active:scale-95 shadow-sm"
              title="Lập biên bản phạt vi phạm"
            >
              <i className="fas fa-plus text-[9px]"></i> Phạt
            </button>
          )}
        </div>
      </div>

      {/* COMPACT SUMMARY METRICS (2 COLUMNS) */}
      <div className="grid grid-cols-2 gap-3 my-3 relative z-10">
        
        {/* Card 1: Tổng tiền trừ lương */}
        <div className="p-3.5 bg-white/[0.04] hover:bg-white/[0.07] border border-white/[0.08] rounded-2xl flex items-center justify-between transition-all">
          <div>
            <div className="text-[10.5px] font-semibold text-zinc-400 font-display flex items-center gap-1.5">
              <i className="fas fa-money-bill-wave text-rose-400 text-[11px]"></i>
              <span>Tổng Đã Trừ</span>
            </div>
            <div className="text-[17px] sm:text-[20px] font-extrabold font-display text-rose-400 mt-0.5 tracking-tight">
              -{totalDeductedAmount.toLocaleString('vi-VN')}đ
            </div>
          </div>
          <div className="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 text-base shrink-0">
            <i className="fas fa-hand-holding-usd"></i>
          </div>
        </div>

        {/* Card 2: Số lượt vi phạm */}
        <div className="p-2.5 sm:p-3 bg-[#121214] border border-[#27272a] rounded-xl flex items-center justify-between">
          <div>
            <div className="text-[9.5px] sm:text-[10px] font-bold text-zinc-400 uppercase tracking-tight flex items-center gap-1.5">
              <i className="fas fa-exclamation-triangle text-amber-400 text-[10px]"></i>
              <span>Số Vụ Vi Phạm</span>
            </div>
            <div className="text-[14px] sm:text-[16px] font-black font-mono text-amber-400 mt-0.5">
              {totalIncidents} lượt
            </div>
          </div>
          <div className="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-sm shrink-0">
            <i className="fas fa-clipboard-list"></i>
          </div>
        </div>

      </div>

      {/* ACCORDION TOGGLE BUTTON */}
      <div className="pt-1.5 border-t border-[#1f1f23] relative z-10">
        <button
          onClick={() => setIsOpenDetails(prev => !prev)}
          className={`w-full py-2 px-3 rounded-xl border text-[10.5px] font-bold flex items-center justify-between transition-all cursor-pointer active:scale-[0.99] ${
            isOpenDetails 
              ? 'bg-rose-500/10 border-rose-500/30 text-rose-300' 
              : 'bg-[#121214] hover:bg-[#121214] border-[#27272a] hover:border-zinc-700 text-zinc-300'
          }`}
        >
          <div className="flex items-center gap-2">
            <i className={`fas fa-list-ul ${isOpenDetails ? 'text-rose-400' : 'text-zinc-400'}`}></i>
            <span>
              {isOpenDetails ? 'Thu gọn danh sách vi phạm' : `Xem chi tiết ${filteredRecords.length} vi phạm`}
            </span>
          </div>
          <div className="flex items-center gap-1.5 font-mono text-[9.5px] text-zinc-400">
            <span>{isOpenDetails ? 'Ẩn' : 'Mở'}</span>
            <i className={`fas fa-chevron-down text-[8.5px] transition-transform duration-200 ${isOpenDetails ? 'rotate-180 text-rose-400' : ''}`}></i>
          </div>
        </button>
      </div>

      {/* DROPDOWN VIOLATION DETAIL LIST */}
      {isOpenDetails && (
        <div className="space-y-1.5 mt-2.5 max-h-[340px] overflow-y-auto pr-1 custom-scrollbar relative z-10 animate-in fade-in duration-200">
          {filteredRecords.length === 0 ? (
            <div className="text-center py-6 bg-[#121214] rounded-xl border border-dashed border-[#27272a] text-zinc-500 text-[10.5px] font-bold">
              <i className="fas fa-medal text-amber-400/60 text-base mb-1 block"></i>
              Tuyệt vời! Không có bản ghi trừ lương nào trong tháng này.
            </div>
          ) : (
            filteredRecords.map((rec, idx) => {
              const isAttendance = rec.source === 'Attendance';
              const badgeBg = isAttendance 
                ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' 
                : 'bg-rose-500/10 text-rose-400 border-rose-500/30';

              return (
                <div 
                  key={rec.id || idx}
                  className="p-2.5 bg-[#121214] border border-[#27272a] hover:border-rose-900/40 rounded-xl flex items-center justify-between gap-2.5 transition-all group"
                >
                  {/* Cột trái: Thông tin người bị trừ & lý do */}
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-1.5 flex-wrap mb-0.5">
                      <span className="text-[11.5px] font-black text-zinc-100 group-hover:text-rose-300 transition-colors">
                        {rec.user}
                      </span>
                      <span className={`text-[8.5px] font-bold uppercase px-1.5 py-0.5 rounded border ${badgeBg}`}>
                        {rec.type}
                      </span>
                      {rec.orderCode && (
                        <span className="text-[9px] font-mono font-bold text-zinc-400 bg-[#121214] px-1.5 py-0.5 rounded border border-[#27272a]">
                          Đơn: {rec.orderCode}
                        </span>
                      )}
                    </div>

                    <div className="text-[10.5px] text-zinc-300 font-medium line-clamp-2">
                      {rec.note}
                    </div>

                    <div className="text-[9px] text-zinc-500 font-mono mt-1 flex items-center gap-2">
                      <span><i className="fas fa-calendar-alt mr-1"></i>{rec.date}</span>
                      <span>• {isAttendance ? 'Chấm công tự động' : 'Kỷ luật / Vận hành'}</span>
                    </div>
                  </div>

                  {/* Cột phải: Số tiền trừ & Nút xoá phạt */}
                  <div className="flex items-center gap-2 shrink-0">
                    <div className="text-right">
                      <span className="text-[12px] sm:text-[13px] font-black font-mono text-rose-400 block">
                        -{rec.amount.toLocaleString('vi-VN')}đ
                      </span>
                    </div>

                    {(isAdmin || isBoss) && (
                      <button 
                        onClick={() => handleForgivePenalty(rec)}
                        disabled={processingId === rec.id}
                        className="w-6 h-6 flex items-center justify-center bg-[#121214] hover:bg-rose-500/20 text-zinc-400 hover:text-rose-400 border border-[#27272a] hover:border-rose-500/40 rounded-lg transition-colors cursor-pointer"
                        title="Ân xá / Miễn trừ khoản phạt này"
                      >
                        <i className={`fas ${processingId === rec.id ? 'fa-spinner fa-spin' : 'fa-trash'} text-[9px]`}></i>
                      </button>
                    )}
                  </div>
                </div>
              );
            })
          )}
        </div>
      )}
    </div>
  );
});

const DashboardTasksSection = React.memo(function DashboardTasksSection({ importExport = [], currentUser, pushDeltas, triggerToast, isAdmin, userConfigs, reimbursements = [], products = [], isBoss }) {
  const [showAddReminder, setShowAddReminder] = React.useState(false);
  // States for material order request
  const [inputMode, setInputMode] = React.useState('CATALOG'); // 'CATALOG' | 'CUSTOM'
  const [selectedProdId, setSelectedProdId] = React.useState('');
  const [customName, setCustomName] = React.useState('');
  const [customCategory, setCustomCategory] = React.useState('Công cụ / Dụng cụ');
  const [customUnit, setCustomUnit] = React.useState('cái');
  const [customPrice, setCustomPrice] = React.useState('');
  const [reqQty, setReqQty] = React.useState('1');
  const [reqNote, setReqNote] = React.useState('');
  const [remText, setRemText] = React.useState('');
  const [processing, setProcessing] = React.useState(false);

  // Filter products for category PHỤ KIỆN & SẢN XUẤT
  const selectableProducts = React.useMemo(() => {
      const filtered = (products || []).filter(p => {
          const cat = String(p.category || '').toUpperCase();
          return cat.includes('PHỤ KIỆN') || cat.includes('SẢN XUẤT') || cat.includes('NGUYÊN LIỆU') || !p.category;
      });
      return filtered.length > 0 ? filtered : (products || []);
  }, [products]);

  // Lọc danh sách phiếu đặt hàng từ bảng ImportExport (Chứng từ Kho Hàng)
  const materialRequests = React.useMemo(() => {
    return (importExport || []).filter(ie => ie && (ie.type === 'ĐẶT HÀNG' || ie.type === 'YÊU CẦU NHẬP HÀNG'));
  }, [importExport]);

  const parseReqDetails = React.useCallback((req) => {
    let items = [];
    try {
      if (req.itemsData) {
        items = typeof req.itemsData === 'string' ? JSON.parse(req.itemsData) : req.itemsData;
      }
    } catch(e) { items = []; }
    const firstItem = items[0] || {};
    const itemName = firstItem.name || req.target || 'Vật tư / Hàng hoá';
    const itemQty = firstItem.quantity || 1;
    const itemUnit = firstItem.unit || 'cái';
    const isOrdered = Boolean(req.note && req.note.includes('[ĐÃ ĐẶT HÀNG]'));
    const isManual = Boolean(firstItem.isManual || firstItem.sku === 'MANUAL' || firstItem.sku === 'TOOL_MANUAL' || (req.note && (req.note.includes('công cụ') || req.note.includes('thiết bị') || req.note.includes('Báo mua'))));
    
    let creator = 'Nhân viên';
    if (req.note) {
      const match = req.note.match(/(?:báo nhập|báo mua)[^:]*từ:?\s*([^(]+)/i);
      if (match) creator = match[1].trim();
      else if (req.note.includes('từ:')) creator = req.note.split('từ:')[1].split('(')[0].trim();
    }

    return {
      displayName: `${itemName} x${itemQty} ${itemUnit}`,
      itemName,
      itemQty,
      itemUnit,
      creator,
      isOrdered,
      isManual,
      firstItem,
      cleanNote: req.note ? req.note.replace(/\[ĐÃ ĐẶT HÀNG\]/g, '').trim() : ''
    };
  }, []);

  const pendingOrderRequests = React.useMemo(() => {
    return materialRequests.filter(r => !parseReqDetails(r).isOrdered);
  }, [materialRequests, parseReqDetails]);

  const orderedRequests = React.useMemo(() => {
    return materialRequests.filter(r => parseReqDetails(r).isOrdered);
  }, [materialRequests, parseReqDetails]);

  const handleCreateMaterialRequest = async () => {
    const isCustom = inputMode === 'CUSTOM';
    const qty = Math.max(1, Number(reqQty) || 1);

    let prodName = '';
    let prodSku = '';
    let prodUnit = 'cái';
    let prodCostPrice = 0;
    let selectedProd = null;
    let categoryTag = 'Vật tư';

    if (isCustom) {
      if (!customName.trim()) {
        triggerToast('Vui lòng nhập tên công cụ / trang thiết bị cần mua!', 'fa-exclamation-triangle', 'warning');
        return;
      }
      prodName = customName.trim();
      prodSku = 'TOOL_MANUAL';
      prodUnit = customUnit.trim() || 'cái';
      prodCostPrice = parseInt(String(customPrice).replace(/[^0-9]/g, '')) || 0;
      categoryTag = customCategory || 'Công cụ / Dụng cụ';
    } else {
      if (!selectedProdId) {
        triggerToast('Vui lòng chọn hàng hoá / vật tư cần nhập từ kho!', 'fa-exclamation-triangle', 'warning');
        return;
      }
      selectedProd = selectableProducts.find(p => String(p.id) === String(selectedProdId));
      if (!selectedProd) {
        triggerToast('Hàng hoá đã chọn không hợp lệ!', 'fa-exclamation-triangle', 'warning');
        return;
      }
      prodName = selectedProd.name;
      prodSku = selectedProd.sku || '';
      prodUnit = selectedProd.unit || 'cái';
      prodCostPrice = Number(selectedProd.costPrice || selectedProd.price || 0);
      categoryTag = selectedProd.category || 'Vật tư';
    }

    const totalCost = prodCostPrice * qty;
    setProcessing(true);
    try {
      const nowIso = new Date().toISOString();
      const nowStr = nowIso.slice(0, 19).replace('T', ' ');

      // Tạo DUY NHẤT phiếu ĐẶT HÀNG trong bảng ImportExport (Chứng từ Kho)
      const ieTicket = {
        id: 'IE_' + Date.now(),
        type: 'ĐẶT HÀNG',
        target: isCustom ? (customCategory || 'Công cụ / Dụng cụ') : ((selectedProd && selectedProd.supplier) ? selectedProd.supplier : 'Khác'),
        totalAmount: totalCost,
        date: nowStr,
        note: `Báo mua [${categoryTag}] từ: ${currentUser}${reqNote ? ' (' + reqNote.trim() + ')' : ''}`,
        itemsData: JSON.stringify([{
          id: isCustom ? ('TOOL_' + Date.now()) : selectedProd.id,
          sku: prodSku,
          name: prodName,
          quantity: qty,
          unit: prodUnit,
          costPrice: prodCostPrice,
          category: categoryTag,
          isManual: isCustom
        }])
      };

      await pushDeltas({ ImportExport: [ieTicket] }, `Đã gửi yêu cầu & lên list đặt: ${prodName} x${qty}`, 'fa-boxes');
      triggerToast(`Đã lên list mua [${prodName}] thành công!`, 'fa-check', 'success');
      
      setSelectedProdId('');
      setCustomName('');
      setCustomPrice('');
      setCustomUnit('cái');
      setReqQty('1');
      setReqNote('');
      setRemText('');
      setShowAddReminder(false);
    } catch(e) {
      triggerToast('Lỗi khi tạo phiếu đặt hàng!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  const handleMarkAsOrdered = async (req) => {
    const details = parseReqDetails(req);
    if (!window.confirm(`Xác nhận ĐÃ ĐẶT HÀNG cho: ${details.displayName}?`)) return;
    setProcessing(true);
    try {
      const upd = { ...req, note: (req.note || '') + ' [ĐÃ ĐẶT HÀNG]' };
      await pushDeltas({ ImportExport: [upd] }, `Xác nhận đã đặt hàng: ${details.displayName}`, 'fa-truck-loading');
      triggerToast('Đã cập nhật trạng thái Đã đặt hàng!', 'fa-truck-loading', 'success');
    } catch(e) {
      triggerToast('Lỗi cập nhật!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  const handleMarkAsImported = (req) => {
    const details = parseReqDetails(req);
    // Kích hoạt việc mở form nhập kho bên Tab Nhập Xuất
    window.pendingAction = 'createImportTicket';
    window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { 
        detail: { 
            tab: 'import_export', 
            trigger: 'triggerCreateImportTicket', 
            data: { linkedRequestId: req.id, linkedMaterialName: details.displayName, itemsData: req.itemsData }, 
            mode: 'ERP' 
        } 
    }));
  };

  const handleDeleteRequest = async (req) => {
    if (!window.confirm('Xác nhận huỷ/xoá phiếu báo đặt hàng này?')) return;
    setProcessing(true);
    try {
      await pushDeltas({ deletes: { ImportExport: [req.id] } }, 'Đã xoá phiếu đặt hàng', 'fa-trash');
      triggerToast('Đã xoá phiếu đặt hàng thành công!', 'fa-trash', 'success');
    } catch(e) {
      triggerToast('Lỗi khi xoá!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  return (
    <div className="space-y-4 animate-fade-in w-full">
      
      {/* ==================== 0. KHUNG YÊU CẦU HOÀN TIỀN VẬT TƯ ==================== */}
      {isAdmin && reimbursements && reimbursements.length > 0 && (
          <div className="vision-card p-4 sm:p-5 mb-4 relative overflow-hidden">
            <div className="flex items-center gap-2 border-b border-white/[0.08] pb-3 mb-4">
              <div className="w-8 h-8 rounded-xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center text-rose-400">
                <i className="fas fa-receipt text-[12px]"></i>
              </div>
              <span className="font-display font-extrabold text-[15px] sm:text-[17px] text-white tracking-tight">Yêu Cầu Hoàn Tiền Vật Tư ({reimbursements.length})</span>
            </div>
            <div className="space-y-2">
              {reimbursements.map(rb => (
                <div key={rb.id} className="p-3 bg-white/[0.04] border border-white/[0.08] rounded-xl flex items-center justify-between gap-3 flex-wrap">
                  <div className="flex-1 min-w-0">
                    <span className="font-bold text-[13px] text-white block">{rb.reason || rb.name}</span>
                    <span className="text-[11px] font-medium text-zinc-400 block mt-0.5">Người yêu cầu: <span className="text-rose-400 font-bold">{rb.staffName || rb.user}</span> - Số tiền: <span className="text-emerald-400 font-bold font-mono">{Number(rb.amount || 0).toLocaleString('vi-VN')}đ</span></span>
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => {
                        window.dispatchEvent(new CustomEvent('openAdminApprovalModal', { detail: rb }));
                      }} 
                      className="px-3.5 py-1.5 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white rounded-full text-[11px] font-bold uppercase tracking-wide flex items-center gap-1.5 cursor-pointer shadow-sm transition-all"
                    >
                      <i className="fas fa-money-check-alt"></i> Duyệt Chi
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
      )}

      {/* ==================== 1. KHUNG BÁO NHẬP HÀNG / ĐẶT HÀNG ==================== */}
      <div className="bg-[#09090b] border border-[#27272a] rounded-xl p-4 shadow-sm relative overflow-hidden">
        <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
        <div className="flex items-center justify-between border-b border-[#27272a] pb-3 mb-4">
          <div className="flex items-center gap-2">
            <div className="w-6 h-6 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <i className="fas fa-boxes text-emerald-500 text-[11px]"></i>
            </div>
            <span className="font-black text-[12px] text-zinc-100 uppercase tracking-widest">Bảng Báo Nhập Hàng</span>
          </div>
          <button 
            onClick={() => {
              setRemText('');
              setShowAddReminder(!showAddReminder);
            }} 
            className="bg-[#121214] hover:bg-[#121214] text-emerald-500 border border-[#27272a] hover:border-emerald-500/50 font-bold text-[10px] px-3 py-1.5 rounded flex items-center gap-1.5 uppercase tracking-wide transition-all cursor-pointer"
          >
            <i className={`fas ${showAddReminder ? 'fa-times text-zinc-400' : 'fa-plus'}`}></i> {showAddReminder ? 'Đóng' : 'Báo Nhập'}
          </button>
        </div>

        {/* Form Yêu cầu nhập hàng của Nhân sự */}
        {showAddReminder && (
          <div className="bg-[#121214] border border-[#27272a] p-4 rounded-xl space-y-4 mb-4 text-[12px] animate-fade-in shadow-lg">
            {/* Thanh chuyển đổi chế độ: Chọn từ Kho vs Nhập Thủ Công */}
            <div className="flex items-center gap-2 p-1 bg-[#09090b] rounded-lg border border-[#27272a]">
              <button
                type="button"
                onClick={() => setInputMode('CATALOG')}
                className={`flex-1 py-1.5 px-3 rounded text-[11px] font-bold flex items-center justify-center gap-2 transition-all cursor-pointer ${
                  inputMode === 'CATALOG'
                    ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-sm'
                    : 'text-zinc-400 hover:text-zinc-200'
                }`}
              >
                <i className="fas fa-boxes text-[10px]"></i> Chọn Từ Kho Hàng
              </button>
              <button
                type="button"
                onClick={() => setInputMode('CUSTOM')}
                className={`flex-1 py-1.5 px-3 rounded text-[11px] font-bold flex items-center justify-center gap-2 transition-all cursor-pointer ${
                  inputMode === 'CUSTOM'
                    ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-sm'
                    : 'text-zinc-400 hover:text-zinc-200'
                }`}
              >
                <i className="fas fa-tools text-[10px]"></i> Nhập Thủ Công (Công Cụ / Thiết Bị)
              </button>
            </div>

            {inputMode === 'CATALOG' ? (
              /* Chế độ 1: Chọn từ danh mục hàng hóa kho */
              <div>
                <label className="text-[10px] font-bold text-zinc-400 block mb-1.5 uppercase tracking-wide">
                  Chọn Hàng Hoá / Vật Tư Có Sẵn Trong Kho <span className="text-rose-500">*</span>
                </label>
                <select 
                  value={selectedProdId} 
                  onChange={e => {
                    if (e.target.value === '__SWITCH_CUSTOM__') {
                      setInputMode('CUSTOM');
                      setSelectedProdId('');
                    } else {
                      setSelectedProdId(e.target.value);
                    }
                  }} 
                  className="w-full bg-[#09090b] border border-[#27272a] text-zinc-100 font-medium rounded-lg px-3 py-2 outline-none focus:border-emerald-500/50 transition-colors cursor-pointer"
                >
                  <option value="">-- Chọn vật tư / phụ kiện trong kho --</option>
                  {selectableProducts.map(p => (
                    <option key={p.id} value={p.id}>
                      [{p.category || 'Vật tư'}] {p.name} {p.sku ? `(${p.sku})` : ''} - {Number(p.costPrice || p.price || 0).toLocaleString('vi-VN')}đ
                    </option>
                  ))}
                  <option value="__SWITCH_CUSTOM__">✍️ + Nhập thủ công công cụ / thiết bị khác ngoài kho...</option>
                </select>
              </div>
            ) : (
              /* Chế độ 2: Nhập tên thủ công cho công cụ, trang thiết bị ngoài kho */
              <div className="space-y-3">
                <div>
                  <label className="text-[10px] font-bold text-amber-400 block mb-1.5 uppercase tracking-wide flex items-center gap-1.5">
                    <i className="fas fa-pen-to-square text-[10px]"></i>

                  </label>
                  <input 
                    type="text"

                    className="w-full bg-[#09090b] border border-amber-500/30 text-white font-semibold rounded-lg px-3 py-2 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all placeholder-zinc-600"

                      <option value="Trang thiết bị xưởng">⚙️ Trang thiết bị xưởng</option>
                      <option value="Vật tư tiêu hao">📦 Vật tư tiêu hao</option>
                      <option value="Đồ bảo hộ lao động">🦺 Đồ bảo hộ lao động</option>

                      <option value="Khác">🏷️ Khác</option>

                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-zinc-400 block mb-1.5 uppercase tracking-wide">
                      Đơn Vị Tính
                    </label>
                    <input 
                      type="text" 
                      value={customUnit} 
                      onChange={e => setCustomUnit(e.target.value)} 
                      placeholder="cái, bộ, cuộn, hộp..."
                      className="w-full bg-[#09090b] border border-[#27272a] text-zinc-200 text-xs rounded-lg px-3 py-2 outline-none focus:border-amber-500/50 font-mono"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-zinc-400 block mb-1.5 uppercase tracking-wide">
                      Đơn Giá Dự Kiến (Nếu có)
                    </label>
                    <input 
                      type="text" 
                      value={customPrice ? parseInt(String(customPrice).replace(/[^0-9]/g, '')).toLocaleString('vi-VN') : ''} 
                      onChange={e => setCustomPrice(e.target.value.replace(/[^0-9]/g, ''))} 
                      placeholder="0 ₫"
                      className="w-full bg-[#09090b] border border-[#27272a] text-amber-400 font-mono font-bold text-xs rounded-lg px-3 py-2 outline-none focus:border-amber-500/50"
                    />
                  </div>
                </div>
              </div>
            )}

            {/* Số lượng & Ghi chú dùng chung */}

                </label>
                <input 
                  type="number" 
                  min="1"
                  value={reqQty} 
                  onChange={e => setReqQty(e.target.value)}

              <button 
                type="button"
                onClick={() => { 
                  setSelectedProdId(''); 
                  setCustomName('');
                  setCustomPrice('');
                  setReqQty('1'); 
                  setReqNote(''); 
                  setShowAddReminder(false);

              {orderedRequests.map(req => {

                  <div key={req.id} className="p-3 bg-[#121214] border border-[#27272a] rounded-lg flex items-center justify-between gap-3 flex-wrap group hover:border-blue-500/30 transition-colors">

                            <i className="fas fa-tools text-[8px]"></i> {details.firstItem?.category || 'Công cụ / Thiết bị'}
                          </span>

                    </div>
                    <div className="flex gap-2">
                      {(isAdmin || isBoss || currentUser === details.creator) && (
                          <button onClick={() => handleDeleteRequest(req)} disabled={processing} className="text-[10px] font-bold w-7 h-7 flex items-center justify-center bg-[#121214] hover:bg-rose-500/10 text-zinc-400 hover:text-rose-500 border border-[#27272a] hover:border-rose-500/30 rounded transition-colors cursor-pointer"><i className="fas fa-trash"></i></button>
                      )}
                      {['QUẢN LÝ KHO', 'KẾ TOÁN', 'TỐI CAO', 'KHO VẬN', 'QUẢN LÝ KHO VẬN'].includes(String(localStorage.getItem('rf_role')).toUpperCase()) && (
                          <button onClick={() => handleMarkAsImported(req)} className="text-[10px] font-bold px-3 h-7 bg-blue-500 hover:bg-blue-600 text-[#09090b] rounded uppercase tracking-wide flex items-center gap-1.5 cursor-pointer">
