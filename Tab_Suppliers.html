<script type="text/babel">
// =========================================================================
// 🤝 FILE: Tab_Suppliers.html
// CHỨC NĂNG: Quản lý Nhà Cung Cấp, Đối Tác Cung Ứng Vật Tư & Sổ Nợ Phải Trả (AP)
// THIẾT KẾ: Hallmark Royal Workbench & Linear UX (Deep Obsidian #09090b)
// BẢO MẬT: Role-Based Masking (Ẩn 100% công nợ với Thợ Xưởng/Thủ Kho)
// =========================================================================

const SuppliersTab = React.memo(function SuppliersTab({ 
    data, 
    pushData, 
    isAdmin: propIsAdmin, 
    isBoss: propIsBoss, 
    userRole: propUserRole, 
    currentUser: propCurrentUser, 
    hasPerm: propHasPerm, 
    triggerToast,
    documents
}) {
    const currentRole = propUserRole || localStorage.getItem('rf_role') || '';
    const currentUser = propCurrentUser || localStorage.getItem('rf_user') || '';
    const isBoss = propIsBoss !== undefined ? propIsBoss : (localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO' || currentUser.includes('Tiến'));
    const isAdmin = propIsAdmin !== undefined ? propIsAdmin : (localStorage.getItem('rf_admin') === 'true' || isBoss);

    const hasPerm = React.useCallback((actionCode) => {
        if (isBoss || currentRole === 'TỐI CAO') return true;
        if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
        if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
        return isAdmin;
    }, [propHasPerm, currentRole, currentUser, isAdmin, isBoss]);

    // Phân quyền xem công nợ & giá tiền: Chỉ Boss & Kế toán
    const canViewDebt = isBoss || currentRole === 'TỐI CAO' || ['KẾ TOÁN', 'KIỂM TOÁN'].includes(currentRole) || hasPerm('SUP_MANAGE_DEBT');
    const canAddSup = isBoss || currentRole === 'TỐI CAO' || ['KẾ TOÁN', 'THỦ KHO'].includes(currentRole) || hasPerm('SUP_ADD');
    const canEditSup = isBoss || currentRole === 'TỐI CAO' || ['KẾ TOÁN'].includes(currentRole) || hasPerm('SUP_EDIT');
    const canDeleteSup = isBoss || currentRole === 'TỐI CAO' || hasPerm('SUP_DELETE');

    // State bộ lọc & tìm kiếm
    const [searchTerm, setSearchTerm] = React.useState('');
    const [selectedGroup, setSelectedGroup] = React.useState('ALL'); // ALL, GLASS, SILICONE, HARDSCAPE, PACKAGING, LOGISTICS, OTHER
    const [debtStatusFilter, setDebtStatusFilter] = React.useState('ALL'); // ALL, HAS_DEBT, OVERDUE, CLEAR

    // State Modals & Drawers
    const [selectedSupplierDrawer, setSelectedSupplierDrawer] = React.useState(null);
    const [showAddSupplierModal, setShowAddSupplierModal] = React.useState(false);
    const [showQuickPOModal, setShowQuickPOModal] = React.useState(false);
    const [showPaymentModal, setShowPaymentModal] = React.useState(false);
    const [isSaving, setIsSaving] = React.useState(false);

    // Dữ liệu nhà cung cấp & giao dịch
    const suppliers = data?.Suppliers || [];
    const importLogs = data?.ImportExport || [];
    const transactions = data?.Transactions || [];
    const accounts = data?.Accounts || [];
    const products = data?.Products || [];

    // Helper format tiền tệ
    const formatMoney = React.useCallback((val) => {
        return Math.round(Number(val || 0)).toLocaleString('vi-VN');
    }, []);

    // Danh mục phân nhóm đối tác chuẩn v3.0
    const SUPPLIER_GROUPS = [
        { id: 'ALL', name: 'Tất Cả Đối Tác', icon: 'fa-layer-group', color: 'text-zinc-400' },
        { id: 'GLASS', name: '🧱 Nhà Kính', icon: 'fa-square', color: 'text-sky-400', keywords: ['kính', 'indo', 'việt nhật', 'siêu trong'] },
        { id: 'SILICONE', name: '🧪 Keo & Hóa Chất', icon: 'fa-flask', color: 'text-amber-400', keywords: ['keo', 'silicone', 'wacker', 'apollo', 'a500', 'a600'] },
        { id: 'HARDSCAPE', name: '🌿 Đá, Cát & Lũa', icon: 'fa-mountain', color: 'text-emerald-400', keywords: ['đá', 'cát', 'lũa', 'tiger', 'sa thạch', 'bonsai', 'nắng vàng'] },
        { id: 'PACKAGING', name: '📦 Bao Bì & Carton', icon: 'fa-box', color: 'text-orange-400', keywords: ['carton', 'thùng', 'bao bì', 'mút', 'xốp', 'ngã ba'] },
        { id: 'LOGISTICS', name: '🚚 Vận Chuyển', icon: 'fa-truck-fast', color: 'text-purple-400', keywords: ['viettel', 'spx', 'ghn', 'ahamove', 'vận chuyển', 'ship'] }
    ];

    // Nhận diện phân nhóm đối tác
    const detectSupplierGroup = React.useCallback((sup) => {
        const cat = String(sup.category || '').toUpperCase();
        const name = String(sup.name || '').toLowerCase();
        const note = String(sup.note || '').toLowerCase();
        const text = `${cat} ${name} ${note}`;

        if (text.includes('kính') || text.includes('indo') || text.includes('việt nhật')) return 'GLASS';
        if (text.includes('keo') || text.includes('silicone') || text.includes('apollo') || text.includes('wacker')) return 'SILICONE';
        if (text.includes('đá') || text.includes('cát') || text.includes('lũa') || text.includes('tiger')) return 'HARDSCAPE';
        if (text.includes('carton') || text.includes('thùng') || text.includes('bao bì') || text.includes('xốp')) return 'PACKAGING';
        if (text.includes('vận chuyển') || text.includes('viettel') || text.includes('spx') || text.includes('ghn')) return 'LOGISTICS';
        return 'OTHER';
    }, []);

    // 1. TÍNH TOÁN CÔNG NỢ CHI TIẾT THEO TỪNG ĐỐI TÁC (Nợ đầu kỳ, Nhập trong kỳ, Đã trả, Còn nợ)
    const enrichedSuppliers = React.useMemo(() => {
        const now = Date.now();
        const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
        const sixtyDaysMs = 60 * 24 * 60 * 60 * 1000;

        return suppliers.map(sup => {
            const sName = String(sup.name || '').trim();
            const group = detectSupplierGroup(sup);

            // Quét phiếu nhập kho từ ImportExport
            const relatedImports = importLogs.filter(log => log.type === 'Nhập' && String(log.target || '').trim().toLowerCase() === sName.toLowerCase());
            
            // Quét phiếu chi từ Transactions
            const relatedTxs = transactions.filter(t => {
                if (t.type !== 'Chi') return false;
                const note = String(t.note || '').toLowerCase();
                const title = String(t.title || '').toLowerCase();
                return note.includes(sName.toLowerCase()) || title.includes(sName.toLowerCase());
            });

            // Tổng nhập trong 60 ngày
            const recentImports = relatedImports.filter(log => {
                const d = new Date(log.date || 0).getTime();
                return !isNaN(d) && (now - d) <= sixtyDaysMs;
            });
            const import60d = recentImports.reduce((sum, log) => sum + (Number(log.totalAmount) || 0), 0);

            // Tổng chi trả trong 60 ngày
            const recentTxs = relatedTxs.filter(t => {
                const d = new Date(t.date || 0).getTime();
                return !isNaN(d) && (now - d) <= sixtyDaysMs;
            });
            const paid60d = recentTxs.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

            // Công nợ hiện tại (Single source of truth: sup.totalDebt)
            const currentDebt = Math.max(0, Number(sup.totalDebt) || 0);

            // Kiểm tra nợ quá hạn (>30 ngày có phiếu chưa thanh toán hết)
            const hasOverdue = relatedImports.some(log => {
                const d = new Date(log.date || 0).getTime();
                return !log.isPaid && !isNaN(d) && (now - d) > thirtyDaysMs && (Number(log.debtAmount) > 0 || Number(log.totalAmount) > 0);
            });

            let status = 'CLEAR'; // ĐÃ THANH TOÁN ĐỦ
            if (currentDebt > 0) {
                status = hasOverdue ? 'OVERDUE' : 'HAS_DEBT';
            }

            // Gộp lịch sử 60 ngày kết hợp (phiếu nhập + phiếu chi)
            const combinedHistory = [
                ...recentImports.map(item => ({
                    id: item.id,
                    type: 'IMPORT',
                    date: item.date,
                    title: item.note || `Phiếu nhập ${item.id}`,
                    amount: Number(item.totalAmount) || 0,
                    status: item.isPaid ? 'PAID' : 'UNPAID',
                    itemsData: item.itemsData
                })),
                ...recentTxs.map(item => ({
                    id: item.id,
                    type: 'PAYMENT',
                    date: item.date,
                    title: item.title || item.note || 'Chi trả công nợ',
                    amount: Number(item.amount) || 0,
                    status: 'CONFIRMED'
                }))
            ].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

            return {
                ...sup,
                group,
                currentDebt,
                import60d,
                paid60d,
                status,
                hasOverdue,
                history: combinedHistory
            };
        });
    }, [suppliers, importLogs, transactions, detectSupplierGroup]);

    // 2. LỌC DANH SÁCH THEO TOOLBAR
    const filteredSuppliers = React.useMemo(() => {
        return enrichedSuppliers.filter(sup => {
            // Lọc theo nhóm
            if (selectedGroup !== 'ALL' && sup.group !== selectedGroup) return false;

            // Lọc theo trạng thái nợ
            if (debtStatusFilter === 'HAS_DEBT' && sup.currentDebt <= 0) return false;
            if (debtStatusFilter === 'OVERDUE' && sup.status !== 'OVERDUE') return false;
            if (debtStatusFilter === 'CLEAR' && sup.currentDebt > 0) return false;

            // Lọc theo tìm kiếm
            if (searchTerm.trim()) {
                const term = searchTerm.toLowerCase().trim();
                const name = String(sup.name || '').toLowerCase();
                const phone = String(sup.phone || '').toLowerCase();
                const note = String(sup.note || '').toLowerCase();
                if (!name.includes(term) && !phone.includes(term) && !note.includes(term)) return false;
            }

            return true;
        });
    }, [enrichedSuppliers, selectedGroup, debtStatusFilter, searchTerm]);

    // 3. TÍNH TOÁN CÁC CHỈ SỐ KPI TỔNG QUAN
    const summaryStats = React.useMemo(() => {
        let totalPayable = 0;
        let overdueCount = 0;
        let partnersWithDebt = 0;

        enrichedSuppliers.forEach(s => {
            if (s.currentDebt > 0) {
                totalPayable += s.currentDebt;
                partnersWithDebt++;
            }
            if (s.status === 'OVERDUE') overdueCount++;
        });

        return {
            totalPartners: suppliers.length,
            totalPayable,
            partnersWithDebt,
            overdueCount
        };
    }, [enrichedSuppliers, suppliers.length]);

    // Form thêm/sửa đối tác
    const [supplierForm, setSupplierForm] = React.useState({
        id: null,
        name: '',
        phone: '',
        category: '🧱 Nhà Kính',
        note: '',
        bankName: '',
        accountNumber: '',
        accountOwner: '',
        totalDebt: 0
    });

    const openAddSupplier = () => {
        setSupplierForm({
            id: null,
            name: '',
            phone: '',
            category: '🧱 Nhà Kính',
            note: '',
            bankName: '',
            accountNumber: '',
            accountOwner: '',
            totalDebt: 0
        });
        setShowAddSupplierModal(true);
    };

    const openEditSupplier = (sup) => {
        setSupplierForm({
            id: sup.id,
            name: sup.name || '',
            phone: sup.phone || '',
            category: sup.category || '🧱 Nhà Kính',
            note: sup.note || '',
            bankName: sup.bankName || '',
            accountNumber: sup.accountNumber || '',
            accountOwner: sup.accountOwner || '',
            totalDebt: Number(sup.totalDebt) || 0
        });
        setShowAddSupplierModal(true);
    };

    // Lưu đối tác vào CSDL
    const handleSaveSupplier = async () => {
        if (!supplierForm.name.trim()) {
            return triggerToast ? triggerToast('Vui lòng nhập tên đối tác!', 'fa-exclamation-triangle', 'warning') : alert('Vui lòng nhập tên đối tác!');
        }

        setIsSaving(true);
        try {
            const isEdit = !!supplierForm.id;
            const supId = supplierForm.id || ('SUP_' + Date.now());
            const payload = {
                id: supId,
                name: supplierForm.name.trim(),
                phone: supplierForm.phone.trim(),
                category: supplierForm.category,
                note: supplierForm.note.trim(),
                bankName: supplierForm.bankName.trim(),
                accountNumber: supplierForm.accountNumber.trim(),
                accountOwner: supplierForm.accountOwner.trim(),
                totalDebt: Number(supplierForm.totalDebt) || 0
            };

            await pushData({ Suppliers: [payload] }, isEdit ? `Cập nhật đối tác ${payload.name}` : `Thêm đối tác mới ${payload.name}`, 'fa-handshake');
            setShowAddSupplierModal(false);
            if (triggerToast) triggerToast(`Đã lưu đối tác ${payload.name} thành công!`, 'fa-check', 'success');
        } catch(err) {
            if (triggerToast) triggerToast('Lỗi khi lưu đối tác: ' + err.message, 'fa-times', 'danger');
        } finally {
            setIsSaving(false);
        }
    };

    // Form thanh toán 1-chạm
    const [paymentForm, setPaymentForm] = React.useState({
        supplier: null,
        amount: '',
        fromAccount: '',
        note: ''
    });

    const openPaymentForSupplier = (sup) => {
        setPaymentForm({
            supplier: sup,
            amount: sup.currentDebt > 0 ? sup.currentDebt : '',
            fromAccount: accounts.length > 0 ? accounts[0].id : '',
            note: `Thanh toán công nợ cho ${sup.name}`
        });
        setShowPaymentModal(true);
    };

    const handleConfirmPayment = async () => {
        const amt = Number(paymentForm.amount);
        if (amt <= 0) return triggerToast ? triggerToast('Số tiền thanh toán phải lớn hơn 0!', 'fa-exclamation', 'warning') : alert('Số tiền không hợp lệ!');
        if (!paymentForm.fromAccount) return triggerToast ? triggerToast('Vui lòng chọn quỹ tiền chi trả!', 'fa-wallet', 'warning') : alert('Chọn quỹ tiền!');

        setIsSaving(true);
        try {
            const sup = paymentForm.supplier;
            const acc = accounts.find(a => a.id === paymentForm.fromAccount);
            const newDebt = Math.max(0, (Number(sup.totalDebt) || 0) - amt);

            const tx = {
                id: 'TX_' + Date.now(),
                type: 'Chi',
                category: 'Thanh Toán Công Nợ',
                amount: amt,
                fromAccount: paymentForm.fromAccount,
                toAccount: '',
                title: `Chi trả nợ: ${sup.name}`,
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                note: paymentForm.note || `Thanh toán công nợ đối tác ${sup.name} (${formatMoney(amt)} đ)`
            };

            await pushData({
                Transactions: [tx],
                Accounts: [{ ...acc, balance: (Number(acc?.balance) || 0) - amt }],
                Suppliers: [{ ...sup, totalDebt: newDebt }]
            }, `Chi trả ${formatMoney(amt)}đ cho ${sup.name}`, 'fa-money-bill-wave');

            setShowPaymentModal(false);
            if (triggerToast) triggerToast(`Đã thanh toán ${formatMoney(amt)}đ cho ${sup.name}!`, 'fa-check', 'success');
        } catch(err) {
            if (triggerToast) triggerToast('Lỗi thanh toán: ' + err.message, 'fa-times', 'danger');
        } finally {
            setIsSaving(false);
        }
    };

    // Form Tạo Phiếu Nhập Vật Tư Nhanh (PO) gắn UOM
    const [poForm, setPoForm] = React.useState({
        supplierId: '',
        date: new Date().toISOString().slice(0, 10),
        items: [{ name: '', uom: 'Tấm lớn', qty: 1, price: '' }],
        isPaid: false,
        payAccId: '',
        note: ''
    });

    const UOM_OPTIONS = ['Tấm lớn (Kính)', 'm² (Kính)', 'Thùng (Keo)', 'Chai/Tuýp', 'Bao (Cát)', 'Kg (Đá/Lũa)', 'Thùng (Carton)', 'Cuộn (Băng dính/Xốp)', 'Chiếc/Cái'];

    const openQuickPO = () => {
        setPoForm({
            supplierId: suppliers.length > 0 ? suppliers[0].id : '',
            date: new Date().toISOString().slice(0, 10),
            items: [{ name: '', uom: 'Tấm lớn (Kính)', qty: 1, price: '' }],
            isPaid: false,
            payAccId: accounts.length > 0 ? accounts[0].id : '',
            note: ''
        });
        setShowQuickPOModal(true);
    };

    const handlePoItemChange = (idx, field, val) => {
        setPoForm(prev => {
            const nextItems = [...prev.items];
            nextItems[idx] = { ...nextItems[idx], [field]: val };
            return { ...prev, items: nextItems };
        });
    };

    const addPoItem = () => {
        setPoForm(prev => ({
            ...prev,
            items: [...prev.items, { name: '', uom: 'Tấm lớn (Kính)', qty: 1, price: '' }]
        }));
    };

    const removePoItem = (idx) => {
        if (poForm.items.length <= 1) return;
        setPoForm(prev => ({
            ...prev,
            items: prev.items.filter((_, i) => i !== idx)
        }));
    };

    const poTotalAmount = React.useMemo(() => {
        return poForm.items.reduce((sum, it) => sum + (Number(it.qty || 0) * Number(it.price || 0)), 0);
    }, [poForm.items]);

    const handleSavePO = async () => {
        if (!poForm.supplierId) return triggerToast ? triggerToast('Vui lòng chọn nhà cung cấp!', 'fa-building', 'warning') : alert('Chọn NCC!');
        if (poTotalAmount <= 0) return triggerToast ? triggerToast('Vui lòng nhập vật tư và đơn giá!', 'fa-exclamation', 'warning') : alert('Nhập vật tư!');

        setIsSaving(true);
        try {
            const targetSup = suppliers.find(s => s.id === poForm.supplierId);
            const poId = 'PO_' + Date.now();
            const timestamp = new Date().toISOString().slice(0, 16).replace('T', ' ');

            const importLog = {
                id: poId,
                type: 'Nhập',
                target: targetSup?.name || 'Nhà Cung Cấp',
                totalAmount: poTotalAmount,
                date: poForm.date,
                note: poForm.note || `Nhập vật tư từ ${targetSup?.name}`,
                itemsData: JSON.stringify(poForm.items),
                isPaid: poForm.isPaid,
                paidAmount: poForm.isPaid ? poTotalAmount : 0,
                debtAmount: poForm.isPaid ? 0 : poTotalAmount,
                createdAt: timestamp
            };

            const updates = {
                ImportExport: [importLog]
            };

            // Nếu thanh toán ngay: trừ tiền quỹ và ghi Transactions
            if (poForm.isPaid && poForm.payAccId) {
                const acc = accounts.find(a => a.id === poForm.payAccId);
                updates.Accounts = [{ ...acc, balance: (Number(acc?.balance) || 0) - poTotalAmount }];
                updates.Transactions = [{
                    id: 'TX_' + Date.now(),
                    type: 'Chi',
                    category: 'Nhập Hàng Vật Tư',
                    amount: poTotalAmount,
                    fromAccount: poForm.payAccId,
                    toAccount: '',
                    title: `Thanh toán phiếu nhập ${poId}`,
                    date: timestamp,
                    note: `Chi tiền nhập vật tư ${targetSup?.name} (${formatMoney(poTotalAmount)}đ)`
                }];
            } else {
                // Ghi nợ gối đầu: tăng totalDebt của nhà cung cấp
                const currentDebt = Number(targetSup?.totalDebt) || 0;
                updates.Suppliers = [{ ...targetSup, totalDebt: currentDebt + poTotalAmount }];
            }

            await pushData(updates, `Nhập kho PO ${poId} (${formatMoney(poTotalAmount)}đ)`, 'fa-boxes');
            setShowQuickPOModal(false);
            if (triggerToast) triggerToast(`Đã lập phiếu nhập ${poId} thành công!`, 'fa-check', 'success');
        } catch(err) {
            if (triggerToast) triggerToast('Lỗi tạo phiếu nhập: ' + err.message, 'fa-times', 'danger');
        } finally {
            setIsSaving(false);
        }
    };

    // Xuất biên bản đối soát công nợ A4
    const handlePrintReconciliation = (sup) => {
        window.print();
    };

    return (
        <div className="space-y-4 sm:space-y-5 pb-8 w-full relative bg-[#09090b] text-zinc-100 font-sans">
            
            {/* 1. HEADER: TIÊU ĐỀ & 4 METRIC CARDS NÉN PHẲNG */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/[0.06] pb-3.5">
                <div>
                    <div className="flex items-center gap-2">
                        <h1 className="text-xl sm:text-2xl font-black text-white tracking-tight uppercase">
                            Nhà Cung Cấp & Sổ Nợ Phải Trả
                        </h1>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-white/[0.04] border border-white/[0.08] text-zinc-400 font-bold">
                            Accounts Payable v3.0
                        </span>
                    </div>
                    <p className="text-zinc-500 text-[11px] font-medium mt-0.5">
                        Quản lý danh bạ cung ứng vật tư (Kính, Keo, Lũa, Carton, Vận chuyển) và dòng tiền công nợ gối đầu.
                    </p>
                </div>

                {/* Top Action Buttons */}
                <div className="flex items-center gap-2">
                    {canAddSup && (
                        <>
                            <button
                                onClick={openQuickPO}
                                className="h-9 px-3.5 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-xl flex items-center gap-1.5 text-xs font-bold transition-all cursor-pointer shadow-sm active:scale-95"
                            >
                                <i className="fas fa-boxes text-xs"></i>
                                <span>Phiếu Nhập PO</span>
                            </button>
                            <button
                                onClick={openAddSupplier}
                                className="h-9 px-3.5 bg-[#d4af37] hover:brightness-110 text-black rounded-xl flex items-center gap-1.5 text-xs font-black transition-all cursor-pointer shadow-sm active:scale-95"
                            >
                                <i className="fas fa-plus text-xs"></i>
                                <span>Thêm Đối Tác</span>
                            </button>
                        </>
                    )}
                </div>
            </div>

            {/* 2. 4 METRIC CARDS CHỈ SỐ CÔNG NỢ */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                {/* Thẻ 1: Tổng Nợ Phải Trả */}
                <div className="bg-[#121214] border border-white/[0.06] rounded-xl p-3.5 flex flex-col justify-between">
                    <div>
                        <div className="flex items-center justify-between text-[10px] font-black uppercase text-zinc-400 tracking-wider mb-1">
                            <span>Tổng Nợ Phải Trả (AP)</span>
                            <span className="text-rose-400 bg-rose-500/10 px-1.5 py-0.5 rounded text-[9px] font-mono">GỐI ĐẦU</span>
                        </div>
                        <div className="text-xl sm:text-2xl font-black text-rose-400 font-mono tracking-tight">
                            {canViewDebt ? formatMoney(summaryStats.totalPayable) + ' đ' : '****** đ'}
                        </div>
                    </div>
                    <div className="mt-2 pt-2 border-t border-white/[0.04] text-[10.5px] font-mono text-zinc-500">
                        {summaryStats.partnersWithDebt} đối tác đang có dư nợ
                    </div>
                </div>

                                    placeholder="VD: 5000000"
                                    value={paymentForm.amount}
                                    onChange={(e) => setPaymentForm(prev => ({ ...prev, amount: e.target.value }))}
                                    className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2.5 text-sm font-mono font-bold text-white outline-none focus:border-[#d4af37]"
                                />
                            </div>

                            <div>
                                <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Trừ từ quỹ tiền nào:</label>
                                <select
                                    value={paymentForm.fromAccount}
                                    onChange={(e) => setPaymentForm(prev => ({ ...prev, fromAccount: e.target.value }))}
                                    className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2.5 text-xs text-white outline-none focus:border-[#d4af37]"
                                >
                                    {accounts.map(a => (
                                        <option key={a.id} value={a.id}>
                                            {a.accountName || a.name} (Số dư: {formatMoney(a.balance)}đ)
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Ghi chú phiếu chi:</label>
                                <input
                                    type="text"
                                    placeholder="Nội dung thanh toán..."
                                    value={paymentForm.note}
                                    onChange={(e) => setPaymentForm(prev => ({ ...prev, note: e.target.value }))}
                                    className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                                />
                            </div>
                        </div>

                        <div className="flex items-center justify-end gap-2 pt-1">
                            <button onClick={() => setShowPaymentModal(false)} className="px-3.5 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:bg-[#27272a] transition-colors cursor-pointer">Hủy</button>
                            <button 
                                onClick={handleConfirmPayment} 
                                disabled={isSaving}
                                className="px-4 py-2 rounded-lg text-xs font-black text-white bg-rose-600 hover:bg-rose-500 transition-all cursor-pointer shadow-sm active:scale-95"
                            >
                                {isSaving ? 'Đang ghi nhận...' : 'Xác Nhận Chi Tiền'}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* 7. MODAL PHIẾU NHẬP VẬT TƯ NHANH (PO GẮN UOM) */}
            {showQuickPOModal && (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-xs animate-fade-in" onClick={() => setShowQuickPOModal(false)}>
                    <div className="bg-[#121214] border border-white/[0.1] w-full max-w-xl rounded-2xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-white/[0.06] pb-3">
                            <h3 className="text-white font-black text-sm uppercase tracking-wider flex items-center gap-2">
                                <i className="fas fa-boxes text-blue-400"></i>
                                Ghi Nhận Phiếu Nhập Vật Tư (PO)
                            </h3>
                            <button onClick={() => setShowQuickPOModal(false)} className="text-zinc-400 hover:text-white cursor-pointer"><i className="fas fa-times"></i></button>
                        </div>

                        <div className="space-y-3 bg-[#09090b] p-3.5 rounded-xl border border-white/[0.06]">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                <div>
                                    <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Nhà Cung Cấp:</label>
                                    <select
                                        value={poForm.supplierId}
                                        onChange={(e) => setPoForm(prev => ({ ...prev, supplierId: e.target.value }))}
                                        className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                                    >
                                        {suppliers.map(s => <option key={s.id} value={s.id}>{s.name} ({s.category})</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Ngày nhập hàng:</label>
                                    <input
                                        type="date"
                                        value={poForm.date}
                                        onChange={(e) => setPoForm(prev => ({ ...prev, date: e.target.value }))}
                                        className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                                    />
                                </div>
                            </div>

                            {/* Danh sách mặt hàng nhập */}
                            <div className="space-y-2 pt-2 border-t border-white/[0.04]">
                                <div className="flex items-center justify-between text-[11px] font-bold text-zinc-300">
                                    <span>Chi Tiết Vật Tư / UOM</span>
                                    <button onClick={addPoItem} className="text-[10px] text-blue-400 hover:underline flex items-center gap-1 cursor-pointer">
                                        <i className="fas fa-plus"></i> Thêm dòng
                                    </button>
                                </div>

                                {poForm.items.map((it, idx) => (
                                    <div key={idx} className="grid grid-cols-12 gap-1.5 items-center bg-white/[0.02] p-2 rounded-lg border border-white/[0.04]">
                                        <input
                                            type="text"
                                            placeholder="Tên vật tư (VD: Kính Indo 10mm...)"
                                            value={it.name}
                                            onChange={(e) => handlePoItemChange(idx, 'name', e.target.value)}
                                            className="col-span-5 bg-[#121214] border border-white/[0.08] rounded p-1.5 text-xs text-white outline-none"
                                        />
                                        <select
                                            value={it.uom}
                                            onChange={(e) => handlePoItemChange(idx, 'uom', e.target.value)}
                                            className="col-span-3 bg-[#121214] border border-white/[0.08] rounded p-1.5 text-[10px] text-zinc-300 outline-none"
                                        >
                                            {UOM_OPTIONS.map(u => <option key={u} value={u}>{u}</option>)}
                                        </select>
                                        <input
                                            type="number"
                                            placeholder="SL"
                                            value={it.qty}
                                            onChange={(e) => handlePoItemChange(idx, 'qty', e.target.value)}
                                            className="col-span-1 bg-[#121214] border border-white/[0.08] rounded p-1.5 text-xs text-white font-mono text-center outline-none"
                                        />
                                        <input
                                            type="number"
                                            placeholder="Đơn giá"
                                            value={it.price}
                                            onChange={(e) => handlePoItemChange(idx, 'price', e.target.value)}
                                            className="col-span-2 bg-[#121214] border border-white/[0.08] rounded p-1.5 text-xs text-white font-mono outline-none"
                                        />
                                        <button 
                                            onClick={() => removePoItem(idx)}
                                            className="col-span-1 text-zinc-500 hover:text-rose-400 text-center cursor-pointer"
                                        >
                                            <i className="fas fa-trash-alt text-xs"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>

                            {/* Tổng tiền & Hình thức thanh toán */}
                            <div className="pt-2 border-t border-white/[0.04] space-y-2">
                                <div className="flex items-center justify-between text-xs font-mono font-bold">
                                    <span className="text-zinc-400">Tổng Giá Trị Phiếu:</span>
                                    <span className="text-lg text-emerald-400 font-black">{formatMoney(poTotalAmount)} đ</span>
                                </div>

                                <div className="flex items-center gap-4 pt-1">
                                    <label className="flex items-center gap-2 cursor-pointer text-xs font-bold">
                                        <input
                                            type="checkbox"
                                            checked={poForm.isPaid}
                                            onChange={(e) => setPoForm(prev => ({ ...prev, isPaid: e.target.checked }))}
                                            className="accent-[#d4af37] w-4 h-4 rounded"
                                        />
                                        <span className="text-zinc-200">Đã thanh toán ngay</span>
                                    </label>

                                    {poForm.isPaid && (
                                        <select
                                            value={poForm.payAccId}
                                            onChange={(e) => setPoForm(prev => ({ ...prev, payAccId: e.target.value }))}
                                            className="flex-1 bg-[#121214] border border-white/[0.08] rounded-lg p-1.5 text-xs text-white outline-none"
                                        >
                                            {accounts.map(a => <option key={a.id} value={a.id}>{a.accountName || a.name}</option>)}
                                        </select>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center justify-end gap-2 pt-1">
                            <button onClick={() => setShowQuickPOModal(false)} className="px-3.5 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:bg-[#27272a] transition-colors cursor-pointer">Hủy</button>
                            <button 
                                onClick={handleSavePO} 
                                disabled={isSaving}
                                className="px-4 py-2 rounded-lg text-xs font-black text-black bg-gradient-to-r from-blue-400 to-blue-500 hover:brightness-110 transition-all cursor-pointer shadow-sm active:scale-95"
                            >
                                {isSaving ? 'Đang lưu PO...' : 'Nhập Kho & Ghi Sổ'}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* 8. MODAL THÊM / CHỈNH SỬA NHÀ CUNG CẤP */}
            {showAddSupplierModal && (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-xs animate-fade-in" onClick={() => setShowAddSupplierModal(false)}>
                    <div className="bg-[#121214] border border-white/[0.1] w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-white/[0.06] pb-3">
                            <h3 className="text-white font-black text-sm uppercase tracking-wider flex items-center gap-2">
                                <i className="fas fa-handshake text-[#d4af37]"></i>
                                {supplierForm.id ? 'Cập Nhật Đối Tác' : 'Thêm Nhà Cung Cấp Mới'}
                            </h3>
                            <button onClick={() => setShowAddSupplierModal(false)} className="text-zinc-400 hover:text-white cursor-pointer"><i className="fas fa-times"></i></button>
                        </div>

                        <div className="space-y-3 bg-[#09090b] p-3.5 rounded-xl border border-white/[0.06]">
                            <div>
                                <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Tên đối tác / Nhà cung cấp:</label>
                                <input
                                    type="text"
                                    placeholder="VD: Kính Indo Quang Minh, Keo Apollo..."
                                    value={supplierForm.name}
                                    onChange={(e) => setSupplierForm(prev => ({ ...prev, name: e.target.value }))}
                                    className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Phân nhóm vật tư:</label>
                                    <select
                                        value={supplierForm.category}
                                        onChange={(e) => setSupplierForm(prev => ({ ...prev, category: e.target.value }))}
                                        className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                                    >
                                        <option value="🧱 Nhà Kính">🧱 Nhà Kính</option>
                                        <option value="🧪 Keo & Hóa Chất">🧪 Keo & Hóa Chất</option>
                                        <option value="🌿 Đá, Cát & Lũa">🌿 Đá, Cát & Lũa</option>
                                        <option value="📦 Bao Bì & Carton">📦 Bao Bì & Carton</option>
                                        <option value="🚚 Vận Chuyển">🚚 Vận Chuyển</option>
                                        <option value="Khác">Vật tư khác</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Số điện thoại liên hệ:</label>
                                    <input
                                        type="text"
                                        placeholder="0987..."
                                        value={supplierForm.phone}
                                        onChange={(e) => setSupplierForm(prev => ({ ...prev, phone: e.target.value }))}
                                        className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white font-mono outline-none focus:border-[#d4af37]"
                                    />
                                </div>
                            </div>

                            <div className="pt-2 border-t border-white/[0.04] space-y-2">
                                <div className="text-[10.5px] font-bold text-zinc-400">Thông tin Ngân hàng & STK:</div>
                                <div className="grid grid-cols-2 gap-2">
                                    <input
                                        type="text"
                                        placeholder="Tên NH (MB, VCB...)"
                                        value={supplierForm.bankName}
                                        onChange={(e) => setSupplierForm(prev => ({ ...prev, bankName: e.target.value }))}
                                        className="bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none"
                                    />
                                    <input
                                        type="text"
                                        placeholder="Số tài khoản"
                                        value={supplierForm.accountNumber}
                                        onChange={(e) => setSupplierForm(prev => ({ ...prev, accountNumber: e.target.value }))}
                                        className="bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white font-mono outline-none"
                                    />
                                </div>
                                <input
                                    type="text"
                                    placeholder="Tên chủ tài khoản"
                                    value={supplierForm.accountOwner}
                                    onChange={(e) => setSupplierForm(prev => ({ ...prev, accountOwner: e.target.value }))}
                                    className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs text-white outline-none"
                                />
                            </div>

                            {canViewDebt && (
                                <div className="pt-2 border-t border-white/[0.04]">
                                    <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Dư nợ ban đầu (VNĐ):</label>
                                    <input
                                        type="number"
                                        placeholder="0"
                                        value={supplierForm.totalDebt}
                                        onChange={(e) => setSupplierForm(prev => ({ ...prev, totalDebt: e.target.value }))}
                                        className="w-full bg-[#121214] border border-white/[0.08] rounded-lg p-2 text-xs font-mono font-bold text-white outline-none"
                                    />
                                </div>
                            )}
                        </div>

                        <div className="flex items-center justify-end gap-2 pt-1">
                            <button onClick={() => setShowAddSupplierModal(false)} className="px-3.5 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:bg-[#27272a] transition-colors cursor-pointer">Hủy</button>
                            <button 
                                onClick={handleSaveSupplier} 
                                disabled={isSaving}
                                className="px-4 py-2 rounded-lg text-xs font-black text-black bg-[#d4af37] hover:brightness-110 transition-all cursor-pointer shadow-sm active:scale-95"
                            >
                                {isSaving ? 'Đang lưu...' : 'Lưu Đối Tác'}
                            </button>
                        </div>
                    </div>
                </div>
            )}

        </div>
    );
});
</script>
