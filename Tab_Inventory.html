              <tr className="bg-[#09090b] text-zinc-400 border-b border-white/[0.06] uppercase text-[10px] font-bold tracking-wider h-11">
                <th className="p-3 pl-4">SKU & Hình Ảnh</th>
                <th className="p-3">Tên Mặt Hàng</th>
                <th className="p-3">Danh Mục</th>
                <th className="p-3">Đơn Vị (UOM)</th>
                <th className="p-3 text-center">Tồn Thực Tế</th>
                <th className="p-3 text-center">Định Mức An Toàn</th>
                {canViewCost && <th className="p-3 text-right">Giá Vốn</th>}
                <th className="p-3 text-center">Trạng Thái</th>
                <th className="p-3 text-center pr-4">Thao Tác</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-white/[0.04]">
              {filteredProducts.length === 0 ? (
                <tr>
                  <td colSpan={canViewCost ? 9 : 8} className="text-center py-12 text-zinc-500 font-bold">
                    <i className="fas fa-boxes text-2xl text-zinc-600 block mb-2"></i>
                    Không tìm thấy sản phẩm nào phù hợp!
                  </td>
                </tr>
              ) : (
                filteredProducts.map(p => {
                  const qty = Number(p.quantity || 0);
                  const min = Number(p.minStock || 0);
                  const isLow = qty <= min;
                  const isOut = qty <= 0;
                  const imgUrl = formatImageUrl(p.image) || formatImageUrl(p.realImage);

                  return (
                    <tr 
                      key={p.id} 
                      onClick={() => handleOpenProductDrawer(p)}
                      className="hover:bg-white/[0.02] transition-colors cursor-pointer group h-14"
                    >
                      {/* SKU & Hình ảnh */}
                      <td className="p-3 pl-4">
                        <div className="flex items-center gap-2.5">
                          <div className="w-8 h-8 rounded-lg bg-black/40 border border-white/[0.08] overflow-hidden flex items-center justify-center shrink-0">
                            {imgUrl ? (
                              <img src={imgUrl} alt="" className="w-full h-full object-cover" />
                            ) : (
                              <i className={`fas ${getSubCategoryIcon(p.name)} text-zinc-600 text-xs`}></i>
                            )}
                          </div>
                          <span className="font-mono font-bold text-zinc-200 text-[11px] group-hover:text-white">
                            {p.sku || 'N/A'}
                          </span>
                        </div>
                      </td>

                      {/* Tên Mặt Hàng */}
                      <td className="p-3 font-bold text-white">
                        <div className="truncate max-w-sm" title={p.name}>{p.name}</div>
                        {p.sub_category && <div className="text-[10px] text-zinc-400 font-normal">{p.sub_category}</div>}
                      </td>

                      {/* Danh Mục */}
                      <td className="p-3">
                        <span className="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-[#18191d] text-zinc-300 border-0">
                          {p.category || 'Mặc định'}
                        </span>
                      </td>

                      {/* Đơn vị tính */}
                      <td className="p-3 font-medium text-zinc-300">
                        {p.unit || 'Cái'}
                      </td>

                      {/* Tồn thực tế */}
                      <td className="p-3 text-center font-mono font-black text-sm">
                        <span className={isOut ? 'text-rose-400' : isLow ? 'text-amber-400' : 'text-white'}>
                          {Math.round(qty * 100) / 100}
                        </span>
                      </td>

                      {/* Định mức an toàn */}
                      <td className="p-3 text-center font-mono text-zinc-400 text-xs">
                        {min > 0 ? min : '---'}
                      </td>

                      {/* Giá vốn (Chỉ Admin/Kế toán) */}
                      {canViewCost && (
                        <td className="p-3 text-right font-mono text-zinc-300 font-bold">
                          {formatMoney(p.costPrice)}đ
                        </td>
                      )}

                      {/* Trạng thái */}
                      <td className="p-3 text-center">
                        {isOut ? (
                          <span className="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-[#18191d] text-rose-400 border-0">
                            Cháy Hàng
                          </span>
                        ) : isLow ? (
                          <span className="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-[#18191d] text-amber-400 border-0">
                            Cảnh Báo
                          </span>
                        ) : (
                          <span className="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-[#18191d] text-zinc-300 border-0">
                            An Toàn
                          </span>
                        )}
                      </td>

                      {/* Thao tác */}
                      <td className="p-3 text-center pr-4">
                        <div className="flex items-center justify-center gap-1.5">
                          <button 
                            onClick={(e) => { e.stopPropagation(); handleOpenProductDrawer(p); }}
                            className="h-7 px-2.5 rounded-lg bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 text-[10px] font-bold border border-white/[0.08] transition-all cursor-pointer"
                          >
                            Thẻ Kho
                          </button>
                          {isAdminRole && (
                            <button 
                              onClick={(e) => { e.stopPropagation(); setEditProd(p); }}
                              className="h-7 px-2 rounded-lg bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white text-[10px] border border-white/[0.08] transition-all cursor-pointer"
                            >
                              <i className="fas fa-edit"></i>
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        </div>
      )}

      {/* 5. SIDE DRAWER ĐIỀU HÀNH KHO & KIỂM ĐỊNH HÀNG HOÀN (SLIDE-OVER PANEL) */}
      {(selectedDrawerItem || selectedDrawerReturn) && (
        <div className="fixed inset-0 z-50 overflow-hidden flex justify-end">
          {/* Backdrop Blur */}
          <div 
            onClick={handleCloseDrawer} 
            className="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity animate-fade-in"
          ></div>

          {/* Drawer Surface */}
          <div className="relative w-full max-w-xl bg-[#18181b] backdrop-blur-xl border-l border-white/[0.06] shadow-2xl h-full flex flex-col z-10 animate-slide-in-right overflow-hidden">
            {/* Drawer Header */}
            <div className="p-4 border-b border-white/[0.06] flex items-center justify-between bg-[#121214]">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-[#d4af37]/15 border border-[#d4af37]/30 flex items-center justify-center text-[#d4af37] text-sm">
                  <i className={selectedDrawerReturn ? 'fas fa-truck-ramp-box' : 'fas fa-boxes'}></i>
                </div>
                <div>
                  <h3 className="text-sm font-black text-white uppercase tracking-wider">
                    {selectedDrawerReturn ? 'Kiểm Định Kiện Hàng Hoàn' : selectedDrawerItem?.name}
                  </h3>
                  <p className="text-[10px] text-zinc-400 font-mono">
                    {selectedDrawerReturn ? `Mã vận đơn: ${selectedDrawerReturn.returnTrackingCode}` : `SKU: ${selectedDrawerItem?.sku || 'N/A'}`}
                  </p>
                </div>
              </div>
              <button 
                onClick={handleCloseDrawer}
                className="w-8 h-8 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
              >
                <i className="fas fa-times"></i>
              </button>
            </div>

            {/* Drawer Sub-Tabs Control */}
            <div className="p-2.5 bg-[#121214] border-b border-white/[0.06] flex items-center gap-1.5">
              {selectedDrawerItem && (
                <>
                  <button
                    onClick={() => setDrawerActiveTab('STOCK_CARD')}
                    className={`flex-1 py-1.5 rounded-xl text-[11px] font-bold uppercase transition-all flex items-center justify-center gap-1.5 cursor-pointer ${
                      drawerActiveTab === 'STOCK_CARD' ? 'bg-[#d4af37] text-zinc-950 font-black shadow-sm' : 'text-zinc-400 hover:text-white'
                    }`}
                  >
                    <i className="fas fa-clipboard-list text-xs"></i>
                    <span>Thẻ Kho 1-Chạm</span>
                  </button>
                  <button
                    onClick={() => setDrawerActiveTab('BOM_CALC')}
                    className={`flex-1 py-1.5 rounded-xl text-[11px] font-bold uppercase transition-all flex items-center justify-center gap-1.5 cursor-pointer ${
                      drawerActiveTab === 'BOM_CALC' ? 'bg-[#d4af37] text-zinc-950 font-black shadow-sm' : 'text-zinc-400 hover:text-white'
                    }`}
                  >
                    <i className="fas fa-calculator text-xs"></i>
                    <span>BOM Bể Kính (+5%)</span>
                  </button>
                </>
              )}
              {selectedDrawerReturn && (
                <button
                  onClick={() => setDrawerActiveTab('RETURN_INSPECT')}
                  className="flex-1 py-1.5 rounded-xl text-[11px] font-black uppercase bg-amber-500 text-zinc-950 shadow-sm flex items-center justify-center gap-1.5 cursor-pointer"
                >
                  <i className="fas fa-shield-halved text-xs"></i>
                  <span>Quy Trình Kiểm Định Hàng Hoàn</span>
                </button>
              )}
            </div>

            {/* Drawer Body Content */}
            <div className="flex-1 p-4 overflow-y-auto space-y-4 custom-scrollbar text-xs">
              
              {/* TAB 1: THẺ KHO & XUẤT NHẬP 1 CHẠM */}
              {drawerActiveTab === 'STOCK_CARD' && selectedDrawerItem && (
                <div className="space-y-4 animate-fade-in">
                  {/* Tồn hiện tại card */}
                  <div className="bg-[#121214] p-4 rounded-2xl border border-white/[0.06] flex items-center justify-between">
                    <div>
                      <span className="text-[10.5px] uppercase font-bold text-zinc-400 block mb-1">Tồn Kho Hiện Tại</span>
                      <div className="text-2xl font-mono font-black text-white">
                        {selectedDrawerItem.quantity} <span className="text-xs font-normal text-zinc-400 font-sans">{selectedDrawerItem.unit || 'Cái'}</span>
                      </div>
                    </div>
                    {canViewCost && (
                      <div className="text-right">
                        <span className="text-[10.5px] uppercase font-bold text-zinc-400 block mb-1">Giá Vốn Xuất Xưởng</span>
                        <div className="text-xl font-mono font-bold text-[#d4af37]">
                          {formatMoney(selectedDrawerItem.costPrice)}đ
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Bảng quy đổi UOM tự động */}
                  <div className="bg-[#121214] p-4 rounded-2xl border border-white/[0.06] space-y-3">
                    <div className="font-bold text-[11px] uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                      <i className="fas fa-scale-unbalanced"></i>
                      <span>Thao Tác Kho 1-Chạm & Quy Đổi Đơn Vị Tính (UOM)</span>
                    </div>

                    {/* Loại thao tác: Nhập hay Xuất */}
                    <div className="grid grid-cols-2 gap-2 bg-[#09090b] p-1 rounded-xl border border-white/[0.06]">
                      <button
                        onClick={() => setStockAdjType('IN')}
                        className={`py-2 rounded-lg font-bold text-xs uppercase flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                          stockAdjType === 'IN' ? 'bg-emerald-500 text-zinc-950 font-black shadow-sm' : 'text-zinc-400 hover:text-white'
                        }`}
                      >
                        <i className="fas fa-plus-circle"></i> Nhập Kho (+)
                      </button>
                      <button
                        onClick={() => setStockAdjType('OUT')}
                        className={`py-2 rounded-lg font-bold text-xs uppercase flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                          stockAdjType === 'OUT' ? 'bg-rose-500 text-white font-black shadow-sm' : 'text-zinc-400 hover:text-white'
                        }`}
                      >
                        <i className="fas fa-minus-circle"></i> Xuất Sản Xuất (-)
                      </button>
                    </div>

                    {/* Chọn đơn vị tính đầu vào */}
                    <div>
                      <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Đơn Vị Quy Đổi Nhập/Xuất:</label>
                      <select
                        value={stockAdjUnit}
                        onChange={(e) => setStockAdjUnit(e.target.value)}
                        className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-3 py-2 text-white font-bold outline-none"
                      >
                        <option value="DEFAULT">Đơn vị mặc định ({selectedDrawerItem.unit || 'Cái'})</option>
                        <option value="LARGE_SHEET">Tấm lớn (180x200cm = 3.6 m² kính)</option>
                        <option value="BOX">Thùng đóng gói (24 chai/hộp)</option>
                      </select>
                    </div>

                    {/* Nhập số lượng */}
                    <div>
                      <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Số Lượng Thực Tế:</label>
                      <input 
                        type="number"
                        placeholder="Nhập số lượng..."
                        value={stockAdjQty}
                        onChange={(e) => setStockAdjQty(e.target.value)}
                        className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-3 py-2 text-white font-mono font-bold text-base outline-none focus:border-[#d4af37]"
                      />
                    </div>

                    {/* Xem trước quy đổi */}
                    {stockAdjQty && parseFloat(stockAdjQty) > 0 && (
                      <div className="p-2.5 rounded-xl bg-[#09090b] border border-amber-500/30 text-amber-300 text-[11px] font-mono flex items-center justify-between">
                        <span>Hệ thống sẽ {stockAdjType === 'IN' ? 'cộng' : 'trừ'}:</span>
                        <b className="text-white text-xs">
                          {stockAdjUnit === 'LARGE_SHEET' ? `${Math.round(parseFloat(stockAdjQty) * 3.6 * 100) / 100} m² kính` :
                           stockAdjUnit === 'BOX' ? `${parseFloat(stockAdjQty) * 24} Chai` :
                           `${stockAdjQty} ${selectedDrawerItem.unit || 'Cái'}`}
                        </b>
                      </div>
                    )}

                    {/* Lý do / Ghi chú */}
                    <div>
                      <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Lý Do / Ghi Chú:</label>
                      <input 
                        type="text"
                        placeholder="Nhập lý do xuất/nhập..."
                        value={stockAdjNote}
                        onChange={(e) => setStockAdjNote(e.target.value)}
                        className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-3 py-2 text-white outline-none focus:border-[#d4af37]"
                      />
                    </div>

                    {/* Nút xác nhận */}
                    <button
                      onClick={handleExecuteStockAdj}
                      disabled={isSubmittingAdj}
                      className={`w-full py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95 shadow-md ${
                        stockAdjType === 'IN' 
                          ? 'bg-emerald-500 hover:bg-emerald-400 text-zinc-950' 
                          : 'bg-rose-500 hover:bg-rose-400 text-white'
                      }`}
                    >
                      <i className={`fas ${isSubmittingAdj ? 'fa-spinner fa-spin' : 'fa-check-circle'}`}></i>
                      <span>{isSubmittingAdj ? 'Đang Lưu Phiếu...' : `Xác Nhận ${stockAdjType === 'IN' ? 'Nhập Kho' : 'Xuất Kho'}`}</span>
                    </button>
                  </div>
                </div>
              )}

              {/* TAB 2: ĐỊNH MỨC TIÊU HAO SẢN XUẤT (BOM CALCULATOR) */}
              {drawerActiveTab === 'BOM_CALC' && (
                <div className="space-y-4 animate-fade-in">
                  <div className="bg-[#121214] p-4 rounded-2xl border border-white/[0.06] space-y-3">
                    <div className="font-bold text-[11px] uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                      <i className="fas fa-calculator"></i>
                      <span>Định Mức Tiêu Hao Bể Kính Tử Diện (+5% Hao Hụt)</span>
                    </div>
                    <p className="text-[11px] text-zinc-400 leading-relaxed">
                      Công thức chuẩn Hiến pháp: $S = (D \times R + 2DC + 2RC) \times 1.05\text{ m}^2$ (đã tính 5% hao hụt do đường cắt và cấn mài).
                    </p>

                    {/* Kích thước D x R x C */}
                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Dài (L - cm):</label>
                        <input 
                          type="number" 
                          value={bomLength} 
                          onChange={e => setBomLength(e.target.value)} 
                          className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-2.5 py-1.5 text-white font-mono font-bold text-center"
                        />
                      </div>
                      <div>
                        <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Rộng (W - cm):</label>
                        <input 
                          type="number" 
                          value={bomWidth} 
                          onChange={e => setBomWidth(e.target.value)} 
                          className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-2.5 py-1.5 text-white font-mono font-bold text-center"
                        />
                      </div>
                      <div>
                        <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Cao (H - cm):</label>
                        <input 
                          type="number" 
                          value={bomHeight} 
                          onChange={e => setBomHeight(e.target.value)} 
                          className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-2.5 py-1.5 text-white font-mono font-bold text-center"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Số lượng bể cần làm (chiếc):</label>
                      <input 
                        type="number" 
                        value={bomQty} 
                        onChange={e => setBomQty(e.target.value)} 
                        className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-3 py-2 text-white font-mono font-bold text-base"
                      />
                    </div>

                    {/* Kết quả tính toán */}
                    <div className="p-3.5 rounded-xl bg-[#09090b] border border-white/[0.06] space-y-2 font-mono text-xs">
                      <div className="flex items-center justify-between">
                        <span className="text-zinc-400">Diện tích 1 chiếc (+5% hao hụt):</span>
                        <b className="text-emerald-400">{computedGlassArea.singleArea} m²</b>
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-zinc-400">Tổng diện tích kính cần trừ kho:</span>
                        <b className="text-[#d4af37] text-sm font-black">{computedGlassArea.totalArea} m²</b>
                      </div>
                      <div className="flex items-center justify-between border-t border-white/[0.06] pt-2">
                        <span className="text-zinc-400">Tương đương tấm kính lớn (1.8x2m):</span>
                        <b className="text-sky-400">{computedGlassArea.sheetCount} tấm nguyên</b>
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-zinc-400">Chu vi mài vi tính:</span>
                        <b className="text-zinc-300">{computedGlassArea.perimeterMeters} mét</b>
                      </div>
                    </div>

                    {/* Nút trừ kho trực tiếp */}
                    <button
                      onClick={() => {
                        setStockAdjType('OUT');
                        setStockAdjUnit('DEFAULT');
                        setStockAdjQty(String(computedGlassArea.totalArea));
                        setStockAdjNote(`Xuất kính làm ${bomQty} bể ${bomLength}x${bomWidth}x${bomHeight}cm (+5% hao hụt)`);
                        setDrawerActiveTab('STOCK_CARD');
                      }}
                      className="w-full py-2.5 rounded-xl bg-[#d4af37] hover:brightness-110 text-zinc-950 font-black text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95 shadow-sm"
                    >
                      <i className="fas fa-arrow-right"></i>
                      <span>Đưa Vào Thẻ Kho Để Trừ Tồn ({computedGlassArea.totalArea} m²)</span>
                    </button>
                  </div>
                </div>
              )}

              {/* TAB 3: QUY TRÌNH KIỂM ĐỊNH HÀNG HOÀN (REVERSE LOGISTICS) */}
              {drawerActiveTab === 'RETURN_INSPECT' && selectedDrawerReturn && (
                <div className="space-y-4 animate-fade-in">
                  <div className="bg-[#121214] p-4 rounded-2xl border border-amber-500/40 space-y-3">
                    <div className="font-bold text-[11px] uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                      <i className="fas fa-box-open"></i>
                      <span>Kiểm Tra Vật Lý Kiện Hàng Sau Khi Rạch Thùng</span>
                    </div>

                    {/* Thông tin đơn */}
                    <div className="bg-[#09090b] p-3 rounded-xl border border-white/[0.06] space-y-1.5 font-mono text-xs">
                      <div className="flex justify-between">
                        <span className="text-zinc-400">Mã vận đơn hoàn:</span>
                        <b className="text-amber-400">{selectedDrawerReturn.returnTrackingCode}</b>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-zinc-400">Mã đơn hàng gốc:</span>
                        <b className="text-white">{selectedDrawerReturn.orderCode}</b>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-zinc-400">Khách hàng:</span>
                        <b className="text-zinc-300">{selectedDrawerReturn.customer}</b>
                      </div>
                      <div className="border-t border-white/[0.06] pt-1.5 text-zinc-400">
                        <span>Sản phẩm: </span><span className="text-zinc-200 font-sans">{selectedDrawerReturn.productSummary}</span>
                      </div>
                    </div>

                    {/* Ảnh chụp kiểm định vật lý */}
                    <div>
                      <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Link Ảnh Hiện Trạng Vật Lý Sau Rạch Thùng:</label>
                      <input 
                        type="text"
                        placeholder="Dán link ảnh chụp thực tế kiện hàng..."
                        value={inspectPhoto}
                        onChange={e => setInspectPhoto(e.target.value)}
                        className="w-full bg-[#09090b] border border-white/[0.06] rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-amber-400"
                      />
                      {inspectPhoto && (
                        <div className="mt-2 w-full h-40 rounded-xl overflow-hidden bg-black/50 border border-white/[0.08] flex items-center justify-center">
                          <img src={formatImageUrl(inspectPhoto)} alt="Hiện trạng hàng hoàn" className="w-full h-full object-contain" />
                        </div>
                      )}
                    </div>

                    {/* Ghi chú tình trạng */}
                    <div>
                      <label className="text-[10.5px] font-bold text-zinc-400 mb-1 block">Ghi Chú Đánh Giá Vật Lý:</label>
                      <textarea 
                        rows="3"
                        placeholder="Bể nguyên vẹn, keo không nứt hở... hoặc Kính đáy bể vỡ nát do vận chuyển..."
                        value={inspectNote}
                        onChange={e => setInspectNote(e.target.value)}

// 6. COMPONENT: MODAL TẠO & CÂN BẰNG PHIẾU KIỂM KHO (CreateStockTakeModal)
// =========================================================================
const CreateStockTakeModal = React.memo(function CreateStockTakeModal({ onClose, onSave, data, userConfigs, currentUser, initialVoucher }) {
    const products = React.useMemo(() => data?.Products || [], [data?.Products]);
    const users = React.useMemo(() => userConfigs?.users || ['Nguyễn Hoàng Dương', 'Nguyễn Ngọc Tiến', 'Nguyễn Thị Diệu Hương', 'Đoàn Quang Trí', 'Võ Thành Tâm', 'Lại Trường Tâm'], [userConfigs]);

    // Default inspector is Dương or currentUser
    const defaultInspector = React.useMemo(() => {
        if (initialVoucher?.checkedBy && !initialVoucher.checkedBy.includes('Kiểm kho')) return initialVoucher.checkedBy;
        if (currentUser && currentUser.includes('Dương')) return currentUser;
        const duong = users.find(u => u.includes('Dương'));
        return duong || currentUser || 'Nguyễn Hoàng Dương';
    }, [initialVoucher, currentUser, users]);

    const [checkedBy, setCheckedBy] = React.useState(defaultInspector);
    const [voucherDate, setVoucherDate] = React.useState(initialVoucher?.date ? String(initialVoucher.date).slice(0, 16).replace(' ', 'T') : new Date().toISOString().slice(0, 16));
    const [userNote, setUserNote] = React.useState(initialVoucher?.userNote || '');

    const [catFilter, setCatFilter] = React.useState('ALL');
    const [subCatFilter, setSubCatFilter] = React.useState('ALL');
    const [searchTerm, setSearchTerm] = React.useState('');
    const [onlyDiff, setOnlyDiff] = React.useState(false);
    const [isSaving, setIsSaving] = React.useState(false);

    // Categories and sub-categories
    const categories = React.useMemo(() => {
        const set = new Set();
        products.forEach(p => { if (p.category) set.add(String(p.category).trim()); });
        return Array.from(set);
    }, [products]);

    const subCategories = React.useMemo(() => {
        const set = new Set();
        products.forEach(p => {
            if (catFilter === 'ALL' || String(p.category).trim() === catFilter) {
                if (p.sub_category) set.add(String(p.sub_category).trim());
            }
        });
        return Array.from(set);
    }, [products, catFilter]);

    // Initial actual counts map: prodId -> actualQty
    const [actualCounts, setActualCounts] = React.useState(() => {
        const map = {};
        if (initialVoucher && initialVoucher.items && Array.isArray(initialVoucher.items)) {
            initialVoucher.items.forEach(it => {
                map[it.id] = it.actualQty !== undefined ? it.actualQty : it.systemQty;
            });
        }
        return map;
    });

    const setCount = React.useCallback((prodId, val) => {
        setActualCounts(prev => ({ ...prev, [prodId]: val }));
    }, []);

    // Filtered list of products for the modal
    const filteredProducts = React.useMemo(() => {
        return products.filter(p => {
            if (catFilter !== 'ALL' && String(p.category).trim() !== catFilter) return false;
            if (subCatFilter !== 'ALL' && String(p.sub_category).trim() !== subCatFilter) return false;
            if (searchTerm) {
                const s = searchTerm.toLowerCase();
                const matchSku = String(p.sku || '').toLowerCase().includes(s);
                const matchName = String(p.name || '').toLowerCase().includes(s);
                if (!matchSku && !matchName) return false;
            }
            if (onlyDiff) {
                const sys = Number(p.quantity || 0);
                const act = actualCounts[p.id] !== undefined && actualCounts[p.id] !== '' ? Number(actualCounts[p.id]) : sys;
                if (act === sys) return false;
            }
            return true;
        });
    }, [products, catFilter, subCatFilter, searchTerm, onlyDiff, actualCounts]);

    // Summary calculation
    const summary = React.useMemo(() => {
        let totalItems = 0;
        let totalActualQty = 0;
        let totalDiffQty = 0;
        let totalDiffIncrease = 0;
        let totalDiffDecrease = 0;
        let totalDiffValue = 0;

        products.forEach(p => {
            const sys = Number(p.quantity || 0);
            const act = actualCounts[p.id] !== undefined && actualCounts[p.id] !== '' ? Number(actualCounts[p.id]) : sys;
            const diff = act - sys;
            const price = Number(p.costPrice || p.price || 0);

            if (actualCounts[p.id] !== undefined) {
                totalItems++;
                totalActualQty += act;
                totalDiffQty += diff;
                if (diff > 0) totalDiffIncrease += diff;
                if (diff < 0) totalDiffDecrease += diff;
                totalDiffValue += Math.abs(diff) * price;
            }
        });

        return {
            totalItems: totalItems || products.length,
            totalActualQty,
            totalDiffQty,
            totalDiffIncrease,
            totalDiffDecrease,
            totalDiffValue
        };
    }, [products, actualCounts]);

    // Quick set actions
    const handleSetAllToStock = () => {
        const map = {};
        filteredProducts.forEach(p => { map[p.id] = Number(p.quantity || 0); });
        setActualCounts(prev => ({ ...prev, ...map }));
    };

    const handleSetAllToZero = () => {
        const map = {};
        filteredProducts.forEach(p => { map[p.id] = 0; });
        setActualCounts(prev => ({ ...prev, ...map }));
    };

    // Save handler
    const handleSubmit = async (isBalanceNow) => {
        if (isSaving) return;
        setIsSaving(true);

        const itemsToSave = [];
        products.forEach(p => {
            const sys = Number(p.quantity || 0);
            const hasExplicitCount = actualCounts[p.id] !== undefined && actualCounts[p.id] !== '';
            
            if (hasExplicitCount || catFilter === 'ALL') {
                const act = hasExplicitCount ? Number(actualCounts[p.id]) : sys;
                const diff = act - sys;
                const price = Number(p.costPrice || 0);
                itemsToSave.push({
                    id: p.id,
                    sku: p.sku || '',
                    name: p.name || '',
                    unit: p.unit || '',
                    category: p.category || '',
                    sub_category: p.sub_category || '',
                    systemQty: sys,
                    actualQty: act,
                    diffQty: diff,
                    costPrice: price,
                    diffAmount: Math.abs(diff) * price
                });
            }
        });

        if (itemsToSave.length === 0) {
            alert('Vui lòng chọn ít nhất 1 mặt hàng để kiểm!');
            setIsSaving(false);
            return;
        }

        try {
            await onSave({
                id: initialVoucher?.id,
                date: voucherDate ? voucherDate.replace('T', ' ') + (voucherDate.length <= 16 ? ':00' : '') : '',
                checkedBy: checkedBy || 'Nguyễn Hoàng Dương',
                userNote,
                items: itemsToSave
            }, isBalanceNow);
            onClose();
        } catch (e) {
            alert('Lỗi lưu phiếu kiểm: ' + e.message);
        } finally {
            setIsSaving(false);
        }
    };

    return (
        <div className="fixed inset-0 z-[300] bg-black/85 backdrop-blur-md flex items-center justify-center sm:p-4 animate-fade-in overflow-y-auto">
            <div className="bg-[#101014] border border-white/[0.12] w-full max-w-6xl sm:rounded-2xl shadow-2xl flex flex-col h-full sm:h-auto sm:max-h-[95vh] overflow-hidden my-auto">
                {/* Modal Header */}
                <div className="p-3.5 sm:p-5 border-b border-white/[0.08] bg-[#141418] flex items-center justify-between shrink-0">
                    <div className="flex items-center gap-3">
                        <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
                            <i className="fas fa-clipboard-check text-base sm:text-lg"></i>
                        </div>
                        <div className="min-w-0">
                            <h2 className="text-sm sm:text-lg font-black text-white flex items-center gap-2 truncate">
                                {initialVoucher ? 'Sửa Phiếu Kiểm Kho' : 'Tạo Phiếu Kiểm Kho Mới'}
                                <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#d4af37]/20 text-[#d4af37] border border-[#d4af37]/30 font-mono font-bold shrink-0">
                                    {initialVoucher?.id || 'KK...'}
                                </span>
                            </h2>
                            <p className="text-[10px] sm:text-[11px] text-zinc-400 mt-0.5 truncate">Kiểm kê số lượng thực tế & cân bằng sai lệch kho tức thì (0ms)</p>

const StockTakeKiotVietView = React.memo(function StockTakeKiotVietView({ data, pushData, pushDeltas, userConfigs, currentUser, triggerToast, isAdmin, isBoss }) {
    const [searchTerm, setSearchTerm] = React.useState('');
    const [dateFilter, setDateFilter] = React.useState('ALL');
    const [customStartDate, setCustomStartDate] = React.useState('');
    const [customEndDate, setCustomEndDate] = React.useState('');
    const [selectedStatus, setSelectedStatus] = React.useState('ALL'); // 'ALL', 'BALANCED', 'DRAFT', 'CANCELLED'
    const [groupMode, setGroupMode] = React.useState('BY_DATE'); // 'BY_DATE' (Mặc định), 'BY_CATEGORY', 'RAW'

    const [expandedVoucherId, setExpandedVoucherId] = React.useState(null);
    const [isCreateModalOpen, setIsCreateModalOpen] = React.useState(false);
    const [editingVoucher, setEditingVoucher] = React.useState(null);
    const [printVoucher, setPrintVoucher] = React.useState(null);

    // Detail items filter inside expanded card (Bỏ ô tìm kiếm, chỉ giữ lọc hàng lệch)
    const [detailOnlyDiff, setDetailOnlyDiff] = React.useState(false);

    const users = React.useMemo(() => userConfigs?.users || ['Nguyễn Hoàng Dương', 'Nguyễn Ngọc Tiến', 'Nguyễn Thị Diệu Hương', 'Đoàn Quang Trí', 'Võ Thành Tâm', 'Lại Trường Tâm'], [userConfigs]);
    const products = React.useMemo(() => data?.Products || [], [data?.Products]);

    const formatMoney = (val) => Math.round(Number(val || 0)).toLocaleString('vi-VN');
    const formatQty = (val) => Number(val || 0).toLocaleString('vi-VN');

    // Parse all raw stocktake logs from ImportExport
    const rawStockTakeVouchers = React.useMemo(() => {
        const rawLogs = data?.ImportExport || [];
        const list = [];

        rawLogs.forEach(log => {
            const isStockTakeType = log.type === 'Kiểm Kho' || log.type === 'KIEM_KHO';
            const isLegacyStockTake = log.id && (String(log.id).startsWith('KK') || String(log.id).startsWith('IE_GCHK'));

            if (!isStockTakeType && !isLegacyStockTake) return;

            let meta = {};
            try {
                if (log.note && log.note.startsWith('{') && log.note.endsWith('}')) {
                    meta = JSON.parse(log.note);
                }
            } catch (e) { }

            let rawItems = [];
            try {
                if (log.itemsData) {
                    rawItems = typeof log.itemsData === 'string' ? JSON.parse(log.itemsData) : log.itemsData;
                }
            } catch (e) { }

            // Determine status
            let status = meta.status || 'BALANCED';
            if (String(log.id).startsWith('IE_GCHK')) {
                status = 'BALANCED';
            }
            if (log.isDraft || meta.status === 'DRAFT') {
                status = 'DRAFT';
            }
            if (log.isCancelled || meta.status === 'CANCELLED') {
                status = 'CANCELLED';
            }

            // Accurate inspector detection
            let inspector = meta.checkedBy || log.user || '';
            if (!inspector || inspector.includes('Kiểm kho') || inspector === 'Hệ thống') {
                inspector = 'Nguyễn Hoàng Dương';
            }

            let creator = meta.createdBy || log.target || 'RF Aquarium';
            if (creator.includes('Kiểm kho')) creator = 'RF Aquarium';

            let balancer = meta.balancedBy || (status === 'BALANCED' ? 'Nguyễn Ngọc Tiến' : '');
            if (balancer.includes('Kiểm kho')) balancer = 'Nguyễn Ngọc Tiến';

            // Summary stats calculation
            let totalActualQty = meta.totalActualQty || 0;
            let totalActualValue = meta.totalActualValue || log.totalAmount || 0;
            let totalDiffQty = meta.totalDiffQty !== undefined ? meta.totalDiffQty : 0;
            let totalDiffIncrease = meta.totalDiffIncrease || 0;
            let totalDiffDecrease = meta.totalDiffDecrease || 0;
            let totalDiffAmount = meta.totalDiffAmount || 0;

            const isLegacyN = String(log.id).includes('_N_') || log.type === 'Nhập';
            const isLegacyX = String(log.id).includes('_X_') || log.type === 'Xuất';

            const parsedItems = (rawItems || []).map(it => {
                const matchProd = products.find(p => p.name === it.name || (it.id && p.id === it.id) || (it.sku && p.sku === it.sku));
                let sku = it.sku || matchProd?.sku || '';
                let unit = (matchProd && matchProd.unit) ? matchProd.unit : (it.unit || '');
                let price = Number(it.costPrice || it.price || matchProd?.costPrice || matchProd?.price || 0);
                let category = it.category || matchProd?.category || 'Phụ kiện';
                let sub_category = it.sub_category || matchProd?.sub_category || '';
                if (!category) category = 'Phụ kiện';

                let sys = Number(it.systemQty !== undefined ? it.systemQty : (isLegacyX ? (it.qty || 0) : 0));
                let act = Number(it.actualQty !== undefined ? it.actualQty : (isLegacyN ? (it.qty || 0) : 0));
                let diff = Number(it.diffQty !== undefined ? it.diffQty : (isLegacyN ? (it.qty || 0) : (isLegacyX ? -(it.qty || 0) : (act - sys))));
                let diffAmt = Number(it.diffAmount !== undefined ? it.diffAmount : (Math.abs(diff) * price));

                return {
                    id: it.id,
                    sku: sku || it.id || '',
                    name: it.name || 'Sản phẩm',
                    category: category,
                    sub_category: sub_category,
                    unit: unit,
                    systemQty: sys,
                    actualQty: act,
                    diffQty: diff,
                    costPrice: price,
                    diffAmount: diffAmt
                };
            });

            // Calculate totals from items if meta is missing
            if (meta.totalDiffQty === undefined && parsedItems.length > 0) {
                totalDiffQty = 0;
                totalDiffIncrease = 0;
                totalDiffDecrease = 0;
                totalActualQty = 0;
                totalDiffAmount = 0;

                parsedItems.forEach(it => {
                    totalDiffQty += it.diffQty;
                    if (it.diffQty > 0) totalDiffIncrease += it.diffQty;
                    if (it.diffQty < 0) totalDiffDecrease += it.diffQty;
                    totalActualQty += it.actualQty;
                    totalDiffAmount += it.diffAmount;
                });
            }

            const itemCategories = Array.from(new Set(parsedItems.map(it => it.category).filter(Boolean)));

            list.push({
                id: log.id,
                date: log.date || '',
                createdAt: meta.createdAt || log.date || '',
                createdBy: creator,
                balancedAt: meta.balancedAt || (status === 'BALANCED' ? (log.date || '') : ''),
                balancedBy: balancer,
                checkedBy: inspector,
                userNote: meta.userNote || (!log.note?.startsWith('{') ? log.note : ''),
                status: status,
                totalAmount: log.totalAmount || totalActualValue || totalDiffAmount,
                totalActualQty,
                totalActualValue: totalActualValue || log.totalAmount || totalDiffAmount,
                totalDiffQty,
                totalDiffIncrease,
                totalDiffDecrease,
                totalDiffAmount,
                diffItemsCount: parsedItems.filter(it => Number(it.diffQty || 0) !== 0).length,
                totalItems: parsedItems.length,
                categories: itemCategories,
                items: parsedItems
            });
        });

        list.sort((a, b) => new Date(b.date || b.createdAt || 0).getTime() - new Date(a.date || a.createdAt || 0).getTime());
        return list;
    }, [data?.ImportExport, products]);

    // Consolidate vouchers based on groupMode ('BY_DATE', 'BY_CATEGORY', 'RAW')
    const displayedVouchers = React.useMemo(() => {
        if (groupMode === 'RAW') {
            return rawStockTakeVouchers;
        }

        if (groupMode === 'BY_DATE') {
            const dateGroups = {};
            rawStockTakeVouchers.forEach(v => {
                const dateStr = String(v.date || v.createdAt || '').slice(0, 10) || 'Khác';
                if (!dateGroups[dateStr]) {
                    dateGroups[dateStr] = [];
                }
                dateGroups[dateStr].push(v);
            });

            const result = [];
            Object.entries(dateGroups).forEach(([dateStr, vList]) => {
                if (vList.length === 1 && !String(vList[0].id).includes('_N_') && !String(vList[0].id).includes('_X_')) {
                    const single = vList[0];
                    result.push({
                        ...single,
                        displayName: single.id,
                        isConsolidated: false,
                        subVouchers: [single],
                        rawVoucherIds: [single.id]
                    });
                    return;
                }

                // Merge multiple vouchers on the same date into a unified voucher
                const itemMap = new Map();
                let latestDate = vList[0].date || '';
                let earliestCreatedAt = vList[0].createdAt || '';
                let latestBalancedAt = vList[0].balancedAt || '';
                let inspector = vList[0].checkedBy || 'Nguyễn Hoàng Dương';
                let creator = vList[0].createdBy || 'RF Aquarium';
                let balancer = vList[0].balancedBy || (vList.some(x => x.status === 'BALANCED') ? 'Nguyễn Ngọc Tiến' : '');

                let status = 'BALANCED';
                if (vList.some(x => x.status === 'DRAFT')) status = 'DRAFT';
                else if (vList.every(x => x.status === 'CANCELLED')) status = 'CANCELLED';

                vList.forEach(v => {
                    if (v.date && v.date > latestDate) latestDate = v.date;
                    if (v.createdAt && (!earliestCreatedAt || v.createdAt < earliestCreatedAt)) earliestCreatedAt = v.createdAt;
                    if (v.balancedAt && v.balancedAt > latestBalancedAt) latestBalancedAt = v.balancedAt;
                    if (v.checkedBy && v.checkedBy !== 'Nguyễn Hoàng Dương') inspector = v.checkedBy;
                    if (v.balancedBy) balancer = v.balancedBy;

                    (v.items || []).forEach(it => {
                        const key = it.sku || it.id || it.name;
                        if (!itemMap.has(key)) {
                            itemMap.set(key, { ...it });
                        } else {
                            const existing = itemMap.get(key);
                            existing.systemQty = Math.max(existing.systemQty || 0, it.systemQty || 0);
                            existing.actualQty = it.actualQty !== undefined ? it.actualQty : existing.actualQty;
                            existing.diffQty = (existing.diffQty || 0) + (it.diffQty || 0);
                            existing.diffAmount = Math.abs(existing.diffQty) * (existing.costPrice || it.costPrice || 0);
                        }
                    });
                });

                const mergedItems = Array.from(itemMap.values());
                let totalActualQty = 0;
                let totalActualValue = 0;
                let totalDiffQty = 0;
                let totalDiffIncrease = 0;
                let totalDiffDecrease = 0;
                let totalDiffAmount = 0;

                mergedItems.forEach(it => {
                    const act = Number(it.actualQty || 0);
                    const price = Number(it.costPrice || 0);
                    const diff = Number(it.diffQty || 0);
                    const diffAmt = Number(it.diffAmount || Math.abs(diff) * price);

                    totalActualQty += act;
                    totalActualValue += act * price;
                    totalDiffQty += diff;
                    if (diff > 0) totalDiffIncrease += diff;
                    if (diff < 0) totalDiffDecrease += diff;
                    totalDiffAmount += diffAmt;
                });

                const categories = Array.from(new Set(mergedItems.map(it => it.category).filter(Boolean)));
                const rawVoucherIds = vList.map(x => x.id);
                const displayId = `KK_${dateStr.replace(/-/g, '')}`;
                const dateFormatted = dateStr.length === 10 ? `${dateStr.slice(8, 10)}/${dateStr.slice(5, 7)}/${dateStr.slice(0, 4)}` : dateStr;

                result.push({
                    id: displayId,
                    displayName: `Đợt kiểm ngày ${dateFormatted}`,
                    dateStr: dateStr,
                    isConsolidated: vList.length > 1 || String(vList[0].id).includes('IE_GCHK'),
                    subVouchers: vList,
                    rawVoucherIds: rawVoucherIds,
                    date: latestDate || dateStr,
                    createdAt: earliestCreatedAt || dateStr,
                    createdBy: creator,
                    balancedAt: latestBalancedAt,
                    balancedBy: balancer,
                    checkedBy: inspector,
                    userNote: vList.map(x => x.userNote).filter(Boolean).join(' | '),
                    status: status,
                    totalAmount: totalActualValue || totalDiffAmount,
                    totalActualQty,
                    totalActualValue,
                    totalDiffQty,
                    totalDiffIncrease,
                    totalDiffDecrease,
                    totalDiffAmount,
                    diffItemsCount: mergedItems.filter(it => Number(it.diffQty || 0) !== 0).length,
                    totalItems: mergedItems.length,
                    categories: categories,
                    items: mergedItems
                });
            });

            result.sort((a, b) => new Date(b.date || 0).getTime() - new Date(a.date || 0).getTime());
            return result;
        }

        if (groupMode === 'BY_CATEGORY') {
            const catGroups = {};
            rawStockTakeVouchers.forEach(v => {
                const dateStr = String(v.date || v.createdAt || '').slice(0, 10) || 'Khác';
                (v.items || []).forEach(it => {
                    const cat = it.category || 'Phụ kiện';
                    const key = `${dateStr}__${cat}`;
                    if (!catGroups[key]) {
                        catGroups[key] = {
                            dateStr,
                            category: cat,
                            vList: [],
                            itemsMap: new Map()
                        };
                    }
                    if (!catGroups[key].vList.some(x => x.id === v.id)) {
                        catGroups[key].vList.push(v);
                    }

                    const itemKey = it.sku || it.id || it.name;
                    const iMap = catGroups[key].itemsMap;
                    if (!iMap.has(itemKey)) {
                        iMap.set(itemKey, { ...it });
                    } else {
                        const existing = iMap.get(itemKey);
                        existing.systemQty = Math.max(existing.systemQty || 0, it.systemQty || 0);
                        existing.actualQty = it.actualQty !== undefined ? it.actualQty : existing.actualQty;
                        existing.diffQty = (existing.diffQty || 0) + (it.diffQty || 0);
                        existing.diffAmount = Math.abs(existing.diffQty) * (existing.costPrice || it.costPrice || 0);
                    }
                });
            });

            const result = [];
            Object.entries(catGroups).forEach(([key, grp]) => {
                const { dateStr, category, vList, itemsMap } = grp;
                const mergedItems = Array.from(itemsMap.values());
                let totalActualQty = 0;
                let totalActualValue = 0;
                let totalDiffQty = 0;
                let totalDiffIncrease = 0;
                let totalDiffDecrease = 0;
                let totalDiffAmount = 0;

                mergedItems.forEach(it => {
                    const act = Number(it.actualQty || 0);
                    const price = Number(it.costPrice || 0);
                    const diff = Number(it.diffQty || 0);
                    const diffAmt = Number(it.diffAmount || Math.abs(diff) * price);

                    totalActualQty += act;
                    totalActualValue += act * price;
                    totalDiffQty += diff;
                    if (diff > 0) totalDiffIncrease += diff;
                    if (diff < 0) totalDiffDecrease += diff;
                    totalDiffAmount += diffAmt;
                });

                const dateFormatted = dateStr.length === 10 ? `${dateStr.slice(8, 10)}/${dateStr.slice(5, 7)}` : dateStr;
                const cleanCatSlug = category.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6) || 'CAT';
                const displayId = `KK_${dateStr.replace(/-/g, '')}_${cleanCatSlug}`;

                const baseV = vList[0] || {};
                result.push({
                    id: displayId,
                    displayName: `${dateFormatted} • ${category}`,
                    category: category,
                    dateStr: dateStr,
                    isConsolidated: true,
                    subVouchers: vList,
                    rawVoucherIds: vList.map(x => x.id),
                    date: baseV.date || dateStr,
                    createdAt: baseV.createdAt || dateStr,
                    createdBy: baseV.createdBy || 'RF Aquarium',
                    balancedAt: baseV.balancedAt || '',
                    balancedBy: baseV.balancedBy || '',
                    checkedBy: baseV.checkedBy || 'Nguyễn Hoàng Dương',
                    userNote: `Nhóm hàng: ${category}`,
                    status: vList.some(x => x.status === 'DRAFT') ? 'DRAFT' : 'BALANCED',
                    totalAmount: totalActualValue || totalDiffAmount,
                    totalActualQty,
                    totalActualValue,
                    totalDiffQty,
                    totalDiffIncrease,
                    totalDiffDecrease,
                    totalDiffAmount,
                    diffItemsCount: mergedItems.filter(it => Number(it.diffQty || 0) !== 0).length,
                    totalItems: mergedItems.length,
                    categories: [category],
                    items: mergedItems
                });
            });

            result.sort((a, b) => new Date(b.date || 0).getTime() - new Date(a.date || 0).getTime());
            return result;
        }

        return rawStockTakeVouchers;
    }, [rawStockTakeVouchers, groupMode]);

    // Filter vouchers
    const filteredVouchers = React.useMemo(() => {
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().slice(0, 10);
        const thisMonthStr = now.toISOString().slice(0, 7);
        const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const lastMonthStr = lastMonth.toISOString().slice(0, 7);

        return displayedVouchers.filter(v => {
            if (selectedStatus !== 'ALL' && v.status !== selectedStatus) return false;

            const vDateStr = String(v.date || v.createdAt || '').slice(0, 10);
            if (dateFilter === 'TODAY' && vDateStr !== todayStr) return false;
            if (dateFilter === 'YESTERDAY' && vDateStr !== yesterdayStr) return false;
            if (dateFilter === 'THIS_MONTH' && !vDateStr.startsWith(thisMonthStr)) return false;
            if (dateFilter === 'LAST_MONTH' && !vDateStr.startsWith(lastMonthStr)) return false;
            if (dateFilter === 'CUSTOM') {
                if (customStartDate && vDateStr < customStartDate) return false;
                if (customEndDate && vDateStr > customEndDate) return false;
            }

            if (searchTerm) {
                const s = searchTerm.toLowerCase();
                const matchId = String(v.id || '').toLowerCase().includes(s);
                const matchName = String(v.displayName || '').toLowerCase().includes(s);
                const matchUser = String(v.checkedBy || v.createdBy || '').toLowerCase().includes(s);
                const matchNote = String(v.userNote || '').toLowerCase().includes(s);
                const matchCategory = (v.categories || []).some(c => String(c).toLowerCase().includes(s));
                const matchItem = (v.items || []).some(it => 
                    String(it.name || '').toLowerCase().includes(s) || 
                    String(it.sku || '').toLowerCase().includes(s)
                );
                if (!matchId && !matchName && !matchUser && !matchNote && !matchCategory && !matchItem) return false;
            }

            return true;
        });
    }, [displayedVouchers, selectedStatus, dateFilter, customStartDate, customEndDate, searchTerm]);

    // Save handler
    const handleSaveStockTake = async (voucherData, isBalanceNow) => {
        const items = voucherData.items || [];
        let totalActualQty = 0;
        let totalActualValue = 0;
        let totalDiffQty = 0;
        let totalDiffIncrease = 0;
        let totalDiffDecrease = 0;
        let totalDiffAmount = 0;

        const diffProductsToUpdate = [];
        const productsList = data?.Products || [];

        items.forEach(it => {
            const sys = Number(it.systemQty || 0);
            const act = Number(it.actualQty !== undefined ? it.actualQty : sys);
            const diff = act - sys;
            const price = Number(it.costPrice || 0);
            const diffAmt = Math.abs(diff) * price;

            totalActualQty += act;
            totalActualValue += act * price;
            totalDiffQty += diff;
            if (diff > 0) totalDiffIncrease += diff;
            if (diff < 0) totalDiffDecrease += diff;
            totalDiffAmount += diffAmt;

            if (diff !== 0 && isBalanceNow) {
                const p = productsList.find(x => x.id === it.id || (it.sku && x.sku === it.sku));
                if (p) {
                    diffProductsToUpdate.push({ ...p, quantity: act, _diff: diff });
                }
            }
        });

        const nowStr = new Date().toISOString().replace('T', ' ').slice(0, 19);
        const voucherId = voucherData.id || ('KK' + String(Date.now()).slice(-6));
        const status = isBalanceNow ? 'BALANCED' : 'DRAFT';
        const statusLabel = isBalanceNow ? 'Đã cân bằng kho' : 'Phiếu tạm';

        const voucherRecord = {
            id: voucherId,
            type: 'Kiểm Kho',
            target: voucherData.checkedBy || currentUser || 'Nguyễn Hoàng Dương',
            totalAmount: totalActualValue || totalDiffAmount,
            date: voucherData.date || nowStr,
            note: JSON.stringify({
                status: status,
                statusLabel: statusLabel,
                userNote: voucherData.userNote || '',
                createdBy: voucherData.createdBy || currentUser || 'RF Aquarium',
                createdAt: voucherData.createdAt || nowStr,
                balancedBy: isBalanceNow ? (currentUser || 'Nguyễn Ngọc Tiến') : '',
                balancedAt: isBalanceNow ? nowStr : '',
                checkedBy: voucherData.checkedBy || currentUser || 'Nguyễn Hoàng Dương',
                totalActualQty,
                totalActualValue,
                totalDiffQty,
                totalDiffIncrease,
                totalDiffDecrease,
                totalDiffAmount
            }),
            itemsData: JSON.stringify(items)
        };

        const payload = { ImportExport: [voucherRecord] };
        if (isBalanceNow && diffProductsToUpdate.length > 0) {
            payload.Products = diffProductsToUpdate;
        }

        const pushFn = pushDeltas || pushData;
        if (typeof pushFn === 'function') {
            await pushFn(payload, isBalanceNow ? `Đã cân bằng kho thành công phiếu ${voucherId}!` : `Đã lưu tạm phiếu kiểm ${voucherId}!`, 'fa-clipboard-check');
        }
    };

    // Balance a draft voucher
    const handleBalanceDraft = async (voucher) => {
        if (!window.confirm(`Xác nhận CÂN BẰNG KHO cho phiếu ${voucher.id}?\nSố lượng thực tế trong phiếu sẽ được cập nhật trực tiếp vào Tồn kho sản phẩm!`)) return;
        await handleSaveStockTake({
            id: voucher.id,
            date: voucher.date,
            createdAt: voucher.createdAt,
            createdBy: voucher.createdBy,
            checkedBy: voucher.checkedBy,
            userNote: voucher.userNote,
            items: voucher.items
        }, true);
    };

    // Cancel voucher
    const handleCancelVoucher = async (voucher) => {
        if (!window.confirm(`Bạn có chắc muốn HỦY phiếu kiểm kho ${voucher.id}?`)) return;
        const nowStr = new Date().toISOString().replace('T', ' ').slice(0, 19);
        const voucherRecord = {
            id: voucher.id,
            type: 'Kiểm Kho',
            target: voucher.checkedBy || currentUser || 'Nguyễn Hoàng Dương',
            totalAmount: voucher.totalAmount || 0,
            date: voucher.date || nowStr,
            note: JSON.stringify({
                status: 'CANCELLED',
                statusLabel: 'Đã hủy',
                userNote: voucher.userNote || '',
                createdBy: voucher.createdBy || '',
                createdAt: voucher.createdAt || '',
                cancelledBy: currentUser || 'RF Aquarium',
                cancelledAt: nowStr
            }),
            itemsData: JSON.stringify(voucher.items || [])
        };

        const pushFn = pushDeltas || pushData;
        if (typeof pushFn === 'function') {
            await pushFn({ ImportExport: [voucherRecord] }, `Đã hủy phiếu kiểm ${voucher.id}!`, 'fa-ban');
        }
    };

    // Permanently Delete voucher (Xóa vĩnh viễn phiếu kiểm)
    const handleDeleteVoucher = async (voucher) => {
        const idsToDelete = (voucher.isConsolidated && voucher.rawVoucherIds?.length > 0)
            ? voucher.rawVoucherIds
            : [voucher.id];

        let confirmMsg = `Bạn có chắc muốn XOÁ VĨNH VIỄN phiếu kiểm kho ${voucher.id}?\n\nThao tác này sẽ xoá hoàn toàn chứng từ kiểm kê (${idsToDelete.length} phiếu) khỏi cơ sở dữ liệu.`;
        if (voucher.status === 'BALANCED') {
            confirmMsg += `\n\n⚠️ Lưu ý: Phiếu này đã CÂN BẰNG kho. Xoá phiếu sẽ xoá chứng từ lưu vết kiểm kê nhưng giữ nguyên số lượng tồn kho hiện tại.`;
        }

        if (!window.confirm(confirmMsg)) return;

        const payload = {
            deletes: {
                ImportExport: idsToDelete
            }
        };

        const pushFn = pushDeltas || pushData;
        if (typeof pushFn === 'function') {
            try {
                await pushFn(payload, `Đã xoá vĩnh viễn phiếu kiểm ${voucher.id}!`, 'fa-trash-alt');
                if (typeof triggerToast === 'function') {
                    triggerToast(`Đã xoá vĩnh viễn phiếu kiểm ${voucher.id}!`, 'fa-trash-alt', 'success');
                }
                setExpandedVoucherId(null);
            } catch (err) {
                alert('Lỗi xoá phiếu kiểm: ' + (err?.message || err));
            }
        }
    };

    // Export Excel
    const handleExportExcel = (voucher) => {
        try {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += `PHIẾU KIỂM KÊ KHO: ${voucher.id}\n`;
            csvContent += `Thời gian: ${voucher.date}\n`;
            csvContent += `Người kiểm: ${voucher.checkedBy}\n`;
            csvContent += `Trạng thái: ${voucher.status === 'BALANCED' ? 'Đã cân bằng' : 'Phiếu tạm'}\n\n`;
            csvContent += "Mã SKU,Tên Sản Phẩm,Nhóm Hàng,ĐVT,Tồn Hệ Thống,Thực Tế,Lệch,Giá Trị Lệch (VNĐ)\n";

            (voucher.items || []).forEach(it => {
                const row = [
                    `"${it.sku || ''}"`,
                    `"${(it.name || '').replace(/"/g, '""')}"`,
                    `"${it.category || ''}"`,
                    `"${it.unit || ''}"`,
                    it.systemQty || 0,
                    it.actualQty || 0,
                    it.diffQty || 0,
                    it.diffAmount || 0
                ].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `KiemKho_${voucher.id}_${(voucher.date || '').slice(0, 10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } catch (e) {
            console.error(e);
            alert("Lỗi xuất file Excel: " + e.message);
        }
    };

    return (
        <div className="w-full space-y-3.5 animate-fade-in">
            {/* 1. SIGNATURE ROYAL WORKBENCH FILTER & CONTROL BAR */}
            <div className="bg-[#121215] border border-white/[0.08] rounded-2xl p-3 sm:p-4 space-y-3 shadow-sm">
                {/* Row 1: Search Input, Group Mode Switch & CTA Button */}
                <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-2.5 w-full">
                    {/* Search Input */}
                    <div className="relative flex-1 bg-[#09090b] border border-white/[0.08] rounded-xl flex items-center px-3 py-1.5 focus-within:border-[#d4af37]/60 focus-within:ring-1 focus-within:ring-[#d4af37]/25 transition-all">
                        <i className="fas fa-search text-zinc-500 text-xs mr-2.5 shrink-0"></i>
                        <input 
                            type="text" 
                            placeholder="Tìm kiếm mã kiểm kho, nhóm hàng, tên sản phẩm..."
                            value={searchTerm}
                            onChange={e => setSearchTerm(e.target.value)}
                            className="w-full text-xs font-semibold bg-transparent text-white placeholder-zinc-500 focus:outline-none min-w-0"
                        />
                        {searchTerm && (
                            <button 
                                type="button"
                                onClick={() => setSearchTerm('')} 
                                className="text-zinc-500 hover:text-zinc-300 p-0.5 shrink-0 transition-colors cursor-pointer"
                            >
                                <i className="fas fa-times-circle text-xs"></i>
                            </button>
                        )}
                    </div>

                    {/* Group Mode Segmented Switch & Create Button */}
                    <div className="flex items-center gap-2 justify-between sm:justify-end shrink-0">
                        {/* Group Mode Segmented Control */}
                        <div className="flex items-center bg-[#09090b] p-1 rounded-xl border border-white/[0.06] shrink-0">
                            <button
                                type="button"
                                onClick={() => setGroupMode('BY_DATE')}
                                className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 ${
                                    groupMode === 'BY_DATE'
                                        ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-black shadow-sm'
                                        : 'text-zinc-400 hover:text-zinc-200'
                                }`}
                                title="Gộp tất cả các phiếu kiểm trong cùng 1 ngày thành 1 đợt kiểm hoàn chỉnh"
                            >
                                <i className="far fa-calendar-check text-[11px]"></i>
                                <span>Gộp Ngày</span>
                            </button>
                            <button
                                type="button"
                                onClick={() => setGroupMode('BY_CATEGORY')}
                                className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 ${
                                    groupMode === 'BY_CATEGORY'
                                        ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-black shadow-sm'
                                        : 'text-zinc-400 hover:text-zinc-200'
                                }`}
                                title="Gộp theo từng nhóm hàng kiểm trong ngày"
                            >
                                <i className="fas fa-layer-group text-[11px]"></i>
                                <span>Nhóm Hàng</span>
                            </button>
                            <button
                                type="button"
                                onClick={() => setGroupMode('RAW')}
                                className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 ${
                                    groupMode === 'RAW'
                                        ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 font-black shadow-sm'
                                        : 'text-zinc-400 hover:text-zinc-200'
                                }`}
                                title="Xem chi tiết từng phiếu gốc đơn lẻ"
                            >
                                <i className="fas fa-list-ul text-[11px]"></i>
                                <span>Phiếu Gốc</span>
                            </button>
                        </div>

                        {/* Create StockTake CTA Button */}
                        <button
                            type="button"
                            onClick={() => {
                                setEditingVoucher(null);
                                setIsCreateModalOpen(true);
                            }}
                            className="px-3.5 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-xs rounded-xl shadow-md shadow-emerald-950/40 flex items-center gap-1.5 cursor-pointer active:scale-95 shrink-0 transition-all"
                        >
                            <i className="fas fa-plus"></i>
                            <span>Kiểm Kho</span>
                        </button>
                    </div>
                </div>
