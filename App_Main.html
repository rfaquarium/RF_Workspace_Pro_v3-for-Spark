    // HÀM PARSE ACCESSORIES AN TOÀN TOÀN CỤC
    window.safeParseAccessories = function (accData) {
        if (!accData) return [];
        if (Array.isArray(accData)) return accData;
        try {
            if (typeof accData === 'string') {
                var trimmed = accData.trim();
                if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
                    var parsed = JSON.parse(trimmed);
                    if (typeof parsed === 'string') parsed = JSON.parse(parsed);
                    return Array.isArray(parsed) ? parsed : (typeof parsed === 'object' && parsed !== null ? [parsed] : []);
                } else if (trimmed.includes(',')) {
                    return trimmed.split(',').map(function (s) { return { name: s.trim(), quantity: 1 }; }).filter(function (x) { return x.name; });
                } else if (trimmed.length > 0) {
                    return [{ name: trimmed, quantity: 1 }];
                }
            }
            return [];
        } catch (e) {
            return [];
        }
    };

    // HÀM FETCH JSON AN TOÀN ĐỂ TRÁNH LỖI HTML ERROR PAGES (SYNTAX ERROR)
    window.safeFetchJSON = async function (url, options = {}) {
        const response = await fetch(url, options);
        const contentType = response.headers.get("content-type");
        if (contentType && contentType.indexOf("application/json") !== -1) {
            return await response.json();
        } else {
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                console.warn("safeFetchJSON: API returned non-JSON response from", url, text.substring(0, 200));
                throw new Error("Máy chủ đối tác trả về dữ liệu không hợp lệ (không phải JSON). Vui lòng thử lại sau.");
            }
        }
    };

    // KHAI BÁO HÀM ĐỒNG BỘ DỮ LIỆU TỪ SERVER (APP SCRIPT) XUỐNG CLIENT
    window.runGAS = function (serverFunctionName, ...args) {
        return new Promise((resolve, reject) => {
            try {
                let finalArgs = args;
                if (serverFunctionName === 'getAppData' || serverFunctionName === 'syncDeltas' || serverFunctionName === 'getArchivedData' || serverFunctionName === 'getArchivedOrders' || serverFunctionName === 'archiveReconciledOrders' || serverFunctionName === 'getArchiveStats' || serverFunctionName === 'setupAutoArchiveTrigger') {
                    const pin = localStorage.getItem('rf_pin') || '';
                    finalArgs = [...args, pin];
                }

                if (typeof google === 'undefined' || !google.script || !google.script.run) {
                    console.warn('Môi trường không hỗ trợ google.script.run');
                    return resolve({ success: false, message: 'Môi trường không hỗ trợ google.script.run' });
                }

                const runner = google.script.run
                    .withSuccessHandler((res) => {
                        if (res && (res._AUTH_FAILED || res.isAuthFailed || res.error === "AUTH_FAILED")) {
                            alert('Phiên làm việc chưa xác thực hoặc đã hết hạn! Vui lòng đăng nhập lại.');
                            localStorage.clear();
                            window.location.reload();
                            return;
                        }
                        resolve(res);
                    })
                    .withFailureHandler((err) => {
                        if (err && err.message && err.message.includes('AUTH_FAILED')) {
                            alert('Lỗi xác thực! Vui lòng đăng nhập lại.');
                            localStorage.clear();
                            window.location.reload();
                            return;
                        }
                        reject(err);
                    });

                if (typeof runner[serverFunctionName] !== 'function') {
                    console.warn(`Hàm backend ${serverFunctionName} chưa tồn tại trên Google Apps Script.`);
                    return resolve({ success: false, message: `Hàm ${serverFunctionName} chưa sẵn sàng` });
                }

                runner[serverFunctionName](...finalArgs);
            } catch (e) {
                console.error(`Lỗi gọi runGAS (${serverFunctionName}):`, e);
                reject(e);
            }
        });
    };

    // CHUYỂN ĐỔI VAPID PUBLIC KEY DẠNG BASE64 SANG UINT8ARRAY
    window.urlBase64ToUint8Array = function (base64String) {
        const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    };

    window.get100LevelInfo = function(totalExp) {
        let exp = 0;
        if (typeof totalExp === 'object' && totalExp !== null) {
            exp = Math.max(0, Number(totalExp.totalExp) || 0);
        } else {
            exp = Math.max(0, Number(totalExp) || 0);
        }
        if (isNaN(exp)) exp = 0;

        const MAX_EXP = 2000000000; // 2 Tỷ EXP (Lũy tiến 20 năm cống hiến)

        const getExpForLevel = (l) => {
            if (l <= 1) return 0;
            if (l >= 100) return MAX_EXP;
            return Math.round(MAX_EXP * Math.pow((l - 1) / 99, 2.35));
        };

        if (exp >= MAX_EXP) {
            return {
                level: 100,
                currentBaseExp: MAX_EXP,
                nextBaseExp: MAX_EXP,
                expInLevel: 0,
                neededForNext: 0,
                progressPct: 100,
                title: 'TỐI CAO GRANDMASTER',
                colorStyle: window.getLevelColorStyle(100),
                totalExp: exp
            };
        }

        let level = Math.floor(Math.pow(exp / MAX_EXP, 1 / 2.35) * 99) + 1;
        level = Math.max(1, Math.min(99, level));

        const currentBaseExp = getExpForLevel(level);
        const nextBaseExp = getExpForLevel(level + 1);
        const expInLevel = exp - currentBaseExp;
        const neededForNext = Math.max(1, nextBaseExp - currentBaseExp);
        const progressPct = Math.min(100, Math.max(0, (expInLevel / neededForNext) * 100));

        let title = 'Tân Thủ Khởi Nghiệp';
        if (level >= 90) title = 'Huyền Thoại Xưởng';
        else if (level >= 75) title = 'Đại Tôn Sư';
        else if (level >= 50) title = 'Tối Cao Thần Thoại';
        else if (level >= 40) title = 'Thái Dương Chi Tôn';
        else if (level >= 35) title = 'Hoả Phụng Tiên Phong';
        else if (level >= 30) title = 'Huyết Tướng Chiến Binh';
        else if (level >= 25) title = 'Thạch Anh Huyền Bí';
        else if (level >= 20) title = 'Lam Ngọc Cao Thủ';
        else if (level >= 15) title = 'Lục Bảo Tiên Phong';
        else if (level >= 10) title = 'Hổ Phách Tinh Anh';

        return {
            level,
            currentBaseExp,
            nextBaseExp,
            expInLevel,
            neededForNext,
            progressPct,
            title,
            colorStyle: window.getLevelColorStyle(level),
            totalExp: exp
        };
    };

    window.computeUserTotalExp = function(u, erpData, userConfigs, prodItems, packings) {
        if (!u) return { totalExp: 0, totalXu: 0, totalAttendanceSalary: 0, totalProdReward: 0, totalPackingReward: 0, totalKPIVnd: 0 };
        
        const matchUser = (u1, u2) => {
            if (!u1 || !u2) return false;
            const s1 = String(u1).toLowerCase().trim();
            const s2 = String(u2).toLowerCase().trim();
            if (s1 === s2) return true;

            const nonUserTerms = [
                'tiền mặt', 'tien mat', 'tiền gửi', 'tien gui', 'ngân hàng', 'ngan hang', 
                'chuyển khoản', 'chuyen khoan', 'công nợ', 'cong no', 'chi phí', 'chi phi', 
                'kho tổng', 'kho layout', 'kho bể kính', 'shopee', 'tiktok', 'ghn', 'viettel',
                'quỹ phát triển', 'quỹ lương', 'tài khoản'
            ];
            if (nonUserTerms.some(t => s1 === t || s1.startsWith(t) || s2 === t)) return false;

            const words1 = s1.split(/\s+/);
            const words2 = s2.split(/\s+/);
            if (words1.length === 1 && words2.includes(words1[0])) return true;
            if (words2.length === 1 && words1.includes(words2[0])) return true;
            if (s1.includes(s2) || s2.includes(s1)) return true;

            const stripAccents = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
            const hasAcc1 = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(s1);
            const hasAcc2 = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(s2);
            if (hasAcc1 && hasAcc2) return false;

            const c1 = stripAccents(s1);
            const c2 = stripAccents(s2);
            if (c1 === c2) return true;

            const w1 = c1.split(/\s+/);
            const w2 = c2.split(/\s+/);
            if (w1.length === 1 && w2.includes(w1[0])) return true;
            if (w2.length === 1 && w1.includes(w2[0])) return true;
            if (c1.includes(c2) || c2.includes(c1)) return true;

            return false;
        };

        // 1. Chấm công & Chuyên cần
        const rawAttData = erpData?.Attendance || [];
        const userAttRecords = rawAttData.filter(a => matchUser(a.user, u));
        const userSal = userConfigs?.salaries?.[u] || userConfigs?.pins?.[u] || (userConfigs?.raw || []).find(ns => matchUser(ns['Tên Nhân Sự'] || ns.name, u)) || {};
        const rawBaseSalary = Number(userSal?.baseSalary || userSal?.['Lương Cơ Bản'] || 0);
        const baseHourlyRate = Number(userSal?.hourlyRate || (rawBaseSalary > 0 ? Math.round(rawBaseSalary / 208 / 1000) * 1000 : 20000)) || 20000;
        let totalAttHours = 0;
        userAttRecords.forEach(a => {
            const hrs = Number(a.totalHours) || ((a.morningIn && a.morningOut ? 4 : 0) + (a.afternoonIn && a.afternoonOut ? 4 : 0));
            if (hrs > 0) totalAttHours += hrs;
        });
        const totalAttendanceSalary = Math.round(totalAttHours * baseHourlyRate);

        // 2. Sản xuất đạt chuẩn KCS
        let totalProdReward = 0;
        const safeProdItems = prodItems || erpData?.Production || [];
        safeProdItems.forEach(item => {
            ['phase1', 'phase2'].forEach(phKey => {
                const ph = item?.phases?.[phKey];
                if (ph && ph.status === 'Done' && matchUser(ph.user, u)) {
                    totalProdReward += (Number(ph.reward_vnd) || 0);
                }
            });
            if (!item?.phases) {
                if (item.p1_status === 'Done' && matchUser(item.p1_user, u)) totalProdReward += (Number(item.p1_reward_vnd) || 0);
                if (item.p2_status === 'Done' && matchUser(item.p2_user, u)) totalProdReward += (Number(item.p2_reward_vnd) || 0);
            }
        });

        // 3. Đóng gói & Xuất kho
        const safePackings = packings || erpData?.Packings || [];
        const userPackings = safePackings.filter(p => matchUser(p.user, u) && (p.status === 'Done' || p.status === 'Đã đóng gói'));
        const totalPackingReward = userPackings.reduce((sum, p) => sum + (Number(p.reward_vnd) || 0), 0);

        // 4. KPI đạt mốc (Lũy kế toàn bộ các kỳ)
        const kpiData = erpData?.KPI_Progress || [];
        const claimedKPIs = kpiData.filter(k => matchUser(k.user, u) && (k.isClaimed === 'true' || k.isClaimed === true));
        const kpiVndList = claimedKPIs.filter(k => !(String(k.unit || '').toLowerCase() === 'xu' || String(k.id || '').startsWith('KPI_XU_')));
        const totalKPIVnd = kpiVndList.reduce((sum, k) => sum + (Number(k.reward) || 0), 0);

        // 5. Quỹ Xu Tích Lũy (Thống Kê Xu, Nhiệm vụ Xu, BonusPenalty Xu)
        const xuSheetData = erpData?.ThongKe_TichLuyXu || erpData?.xuTransactions || [];
        const xuFromSheet = xuSheetData.filter(x => matchUser(x.user, u)).map(x => ({
            id: String(x.id || `XU_${Math.random()}`),
            amount: Number(x.amount_xu !== undefined && x.amount_xu !== '' ? x.amount_xu : (x.amount || 0))
        }));

        const xuTasksKPI = claimedKPIs.filter(k => String(k.unit || '').toLowerCase() === 'xu' || String(k.id || '').startsWith('KPI_XU_')).map(k => ({
            id: String(k.id),
            amount: Number(k.reward) || 0
        }));

        const bpData = erpData?.BonusPenalty || [];
        const xuTasksBP = bpData.filter(b => matchUser(b.user, u) && (b.type === 'XU_REWARD' || b.type === 'Thưởng Xu' || b.type === 'XU' || (String(b.note || '').toLowerCase().includes('xu') && !String(b.note || '').toLowerCase().includes('xuất')))).map(b => ({
            id: String(b.id),
            amount: Number(b.amount) || 0
        }));

        const seenXuIds = new Set();
        const xuLogs = [...xuFromSheet, ...xuTasksKPI, ...xuTasksBP].filter(x => {
            if (!x.id || seenXuIds.has(x.id)) return false;
            seenXuIds.add(x.id);
            return Number(x.amount) > 0;
        });
        const totalXu = xuLogs.reduce((sum, x) => sum + x.amount, 0);

        const totalUserExp = totalAttendanceSalary + totalProdReward + totalPackingReward + totalKPIVnd + totalXu;

        return {
            totalExp: totalUserExp,
            totalXu,
            totalAttendanceSalary,
            totalProdReward,
            totalPackingReward,
            totalKPIVnd
        };
    };

    // =========================================================================
    // HAPTIC FEEDBACK & SENSORY ENGINE (HỖ TRỢ ĐA NỀN TẢNG iOS / ANDROID / PWA)
    // =========================================================================
    window.triggerHaptic = function(type = 'medium') {
        try {
            const hasVibrate = typeof navigator !== 'undefined' && Boolean(navigator.vibrate);
            if (hasVibrate) {
                switch(type) {
                    case 'light': navigator.vibrate(15); break;
                    case 'medium': navigator.vibrate(35); break;
                    case 'heavy': navigator.vibrate(70); break;
                    case 'selection': navigator.vibrate(10); break;
                    case 'success': navigator.vibrate([30, 40, 50]); break;
                    case 'warning': navigator.vibrate([80, 50, 80]); break;
                    case 'urgent': navigator.vibrate([150, 80, 150, 80, 300, 100, 300]); break;
                    case 'sos': navigator.vibrate([400, 100, 400, 100, 400, 100, 600, 200, 600]); break;
                    default: navigator.vibrate(35);
                }
            } else {
                // Fallback âm thanh xúc giác cho iOS / Safari khi navigator.vibrate bị khóa
                if (type === 'sos') window.playEmergencyAlarm('sos');
                else if (type === 'urgent') window.playEmergencyAlarm('urgent');
                else if (type === 'heavy' || type === 'success') window.playExpChime(2);
                else if (type === 'medium') window.playExpChime(1);
            }
        } catch(e) {}
    };

    // Bộ Tổng Hợp Âm Thanh Cảnh Báo Khẩn Cấp (Emergency Web Audio Synthesizer)
    window.playEmergencyAlarm = function(type = 'urgent') {
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            if (!window._rfAlarmAudioCtx) {
                window._rfAlarmAudioCtx = new AudioContextClass();
            }
            const ctx = window._rfAlarmAudioCtx;
            if (ctx.state === 'suspended') ctx.resume();

            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            if (type === 'sos') {
                // Còi Báo Động SOS Dồn Dập (880Hz <-> 1320Hz Pulsing Siren)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.linearRampToValueAtTime(1320, now + 0.15);
                osc.frequency.linearRampToValueAtTime(880, now + 0.30);
                osc.frequency.linearRampToValueAtTime(1320, now + 0.45);
                osc.frequency.linearRampToValueAtTime(880, now + 0.60);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.75);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.80);
            } else {
                // Âm Báo Đơn Hàng Gấp SLA (Triple High Chime: 659Hz -> 880Hz -> 1174Hz)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(659.25, now);
                osc.frequency.setValueAtTime(880, now + 0.08);
                osc.frequency.setValueAtTime(1174.66, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            }
        } catch(e) {}
    };

    // Web Audio Synthesizer cho âm thanh xúc giác arcade
    window.playExpChime = function(combo = 1) {
        try {
            if (navigator.vibrate) navigator.vibrate(35);
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            if (!window._rfExpAudioCtx) {
                window._rfExpAudioCtx = new AudioContextClass();
            }
            const ctx = window._rfExpAudioCtx;
            if (ctx.state === 'suspended') ctx.resume();

            const baseFreq = combo > 1 ? 784 : 587.33;
            const highFreq = combo > 1 ? 1046.5 : 880;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
            osc.frequency.setValueAtTime(highFreq, ctx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.24);
        } catch(e){}
    };

    // Bắn hạt hiệu ứng +EXP lơ lửng tại điểm chạm ngón tay
    window.triggerExpGain = function(amount = 50, eOrPos = null, label = '') {
        try {
            let x = window.innerWidth / 2;
            let y = window.innerHeight / 2;

            if (eOrPos) {
                if (typeof eOrPos.clientX === 'number') {
                    x = eOrPos.clientX;
                    y = eOrPos.clientY;
                } else if (typeof eOrPos.x === 'number') {
                    x = eOrPos.x;
                    y = eOrPos.y;
                }
            }

            const offsetX = (Math.random() - 0.5) * 24;
            const offsetY = (Math.random() - 0.5) * 12;

            const particle = document.createElement('div');
            particle.className = 'rf-exp-float-particle';
            particle.style.left = `${x + offsetX}px`;
            particle.style.top = `${y + offsetY}px`;
            
            const text = label ? label : `+${amount} EXP ✨`;
            particle.innerHTML = text;

            document.body.appendChild(particle);
            window.playExpChime();

            setTimeout(() => {
                if (particle && particle.parentNode) {
                    particle.parentNode.removeChild(particle);
                }
            }, 850);
        } catch(err){}
    };

            if (targetBtn.closest('aside, nav, header, .rf-tab-nav, .pagination, .filter-group')) return;
            
            const btnText = String(targetBtn.textContent || '').trim().toLowerCase();
            const btnTitle = String(targetBtn.getAttribute('title') || '').trim().toLowerCase();
            const fullText = `${btnText} ${btnTitle}`;

            ].some(w => fullText.includes(w));

            if (isNavOrClose && !targetBtn.hasAttribute('data-exp')) return;

            // 2. NHẬN DIỆN CÁC NÚT TÁC VỤ THỰC THI (Hoàn thành, Nhận việc, Lưu, Xuất/Nhập kho, Đóng gói, Claim, Duyệt, Thêm...)

                'duyệt', 'duyet', 'approve', 'in đơn', 'in tem', 'chấm công', 'check-in', 'check-out',
                'gán thợ', 'chuyển kho', 'kcs', 'nghiệm thu', 'thanh toán', 'ghi nhận'
            ].some(w => fullText.includes(w)) || targetBtn.classList.contains('btn-action') || targetBtn.classList.contains('btn-submit');

            if (!isActionBtn) return;

            let amount = 50;
            if (customExp) {

            } else if (fullText.includes('hoàn thành') || fullText.includes('xong') || fullText.includes('đóng gói') || fullText.includes('xuất kho') || fullText.includes('nhận thưởng') || fullText.includes('claim')) {

    function App() {
        const getDisplayRole = (role) => {

            if (role === 'CỘNG TÁC VIÊN' || role === 'CTV' || role === 'KHÁCH') return role;
            if (role.includes('QUẢN LÝ')) return role;
            return `QUẢN LÝ ${role}`;
        };
        const safeGet = (k, d) => {
            try {
                let v = localStorage.getItem(k);
                if (!v) {
                    const m = document.cookie.match(new RegExp('(^| )' + k + '=([^;]+)'));
                    if (m) v = m[2];
                }
                return v || d;
            } catch (e) { return d; }
        };
        const safeSet = (k, v) => {
            try {
                localStorage.setItem(k, v);
                document.cookie = `${k}=${v}; max-age=31536000; path=/`;
            } catch (e) { }
        };

        const [mode, setMode] = React.useState('WORKSPACE');
        const [activeTab, setActiveTab] = React.useState(() => { const r = safeGet('rf_role', ''); return (r === 'CỘNG TÁC VIÊN' || r === 'CTV') ? 'orders' : 'dashboard'; });
        const [mountedTabs, setMountedTabs] = React.useState([activeTab]);
        const [deferredReady, setDeferredReady] = React.useState(false);
        
        React.useEffect(() => {
            setMountedTabs(prev => prev.includes(activeTab) ? prev : [...prev, activeTab]);
        }, [activeTab]);

        // Callback Phase 2 boot: khi deferred tabs biên dịch xong → re-render
        React.useEffect(() => {
            window.__rfOnDeferredLoaded = () => setDeferredReady(true);
            return () => { delete window.__rfOnDeferredLoaded; };
        }, []);

        const [isMenuOpen, setIsMenuOpen] = React.useState(false);
        // Ghi nhớ trạng thái thu gọn Sidebar Desktop (Mini-Rail 68px)
        const [isSidebarCollapsed, setIsSidebarCollapsed] = React.useState(() => safeGet('rf_sidebar_collapsed', 'false') === 'true');

        const toggleSidebar = React.useCallback(() => {
            setIsSidebarCollapsed(prev => {
                const next = !prev;
                safeSet('rf_sidebar_collapsed', next ? 'true' : 'false');
                return next;
            });
        }, []);

        // Phím tắt toàn cục Ctrl + B / Cmd + B đóng/mở sidebar trên Desktop
        React.useEffect(() => {
            const handleKeyDown = (e) => {
                if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
                    const tag = e.target?.tagName?.toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || e.target?.isContentEditable) return;
                    e.preventDefault();
                    toggleSidebar();
                }
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
        }, [toggleSidebar]);

        // Rung xúc giác Haptic feedback nhẹ nhàng trên thiết bị di động
        const triggerHaptic = React.useCallback((type = 'light') => {
            try {
                if (typeof window !== 'undefined' && typeof window.triggerHaptic === 'function') {
                    window.triggerHaptic(type);
                } else if (typeof navigator !== 'undefined' && navigator.vibrate) {
                    if (type === 'light') navigator.vibrate(10);
                    else if (type === 'medium') navigator.vibrate(20);
                    else if (type === 'heavy') navigator.vibrate(35);
                }
            } catch (e) { }
        }, []);

        const handleNavigateTab = React.useCallback((tabId, tabMode = 'WORKSPACE') => {
            if (activeTab === tabId && mode === tabMode) {
                setIsMenuOpen(false);
                return;
            }
            // 1. Đóng menu ngay lập tức để CSS transition trượt êm mượt trên GPU
            setIsMenuOpen(false);

            // 2. Chuyển tab qua startTransition hoặc requestAnimationFrame để animation trượt không bị khựng/drop frame
            if (typeof React.startTransition === 'function') {
                React.startTransition(() => {
                    setActiveTab(tabId);
                    if (tabMode) setMode(tabMode);
                });
            } else {
                requestAnimationFrame(() => {
                    setActiveTab(tabId);
                    if (tabMode) setMode(tabMode);
                });
            }
        }, [activeTab, mode]);

        const [currentUser, setCurrentUser] = React.useState(() => {
            const p = safeGet('rf_pin', '');
            const u = safeGet('rf_user', '');
            return (p && u) ? u : '';
        });
        const [isAdmin, setIsAdmin] = React.useState(() => safeGet('rf_admin', 'false') === 'true');
        const [isBoss, setIsBoss] = React.useState(() => safeGet('rf_boss', 'false') === 'true');
        const [userRole, setUserRole] = React.useState(() => safeGet('rf_role', ''));

            Suppliers: _instantCache?.Suppliers || [],
            Transactions: _instantCache?.Transactions || [],

            BOM_Config: _instantCache?.BOM_Config || [],
            Workspaces: _instantCache?.Workspaces || []
        }));
        const [userConfigs, setUserConfigs] = React.useState({});
        const [kpiConfig, setKpiConfig] = React.useState([]);
        const [documents, setDocuments] = React.useState([]);
        const [trainings, setTrainings] = React.useState([]);
        const [models3D, setModels3D] = React.useState([]);
        const [reimbursements, setReimbursements] = React.useState([]);

            const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
            return !isStandalone;
        });

        // Kiểm tra quyền hạn chi tiết dựa trên Ma Trận Phân Quyền RBAC chuẩn
        const hasPerm = React.useCallback((actionCode) => {
            if (isBoss || userRole === 'TỐI CAO' || currentUser.includes('Tiến')) return true;
            if (typeof canUserDo === 'function') {
                return canUserDo(actionCode, userRole, currentUser);
            }
            const pin = Object.keys(userConfigs?.pins || {}).find(p => userConfigs.pins[p]?.name === currentUser);
            if (!pin) return isAdmin;
            const perms = userConfigs?.pins?.[pin]?.permissions || [];
            return perms.includes(actionCode) || isAdmin;
        }, [isBoss, userRole, currentUser, isAdmin, userConfigs]);

        const [loading, setLoading] = React.useState(true);
        const [isInitialFetching, setIsInitialFetching] = React.useState(true);
        const [syncing, setSyncing] = React.useState(false);
        const [isArchiveLoaded, setIsArchiveLoaded] = React.useState(false);
        const [isLoadingArchive, setIsLoadingArchive] = React.useState(false);
        const clientId = React.useMemo(() => Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15), []);

        const [showBulkImport, setShowBulkImport] = React.useState(false);

        const [showDocumentUpload, setShowDocumentUpload] = React.useState(false);
        const [stockHistoryItem, setStockHistoryItem] = React.useState(null);

        const [toasts, setToasts] = React.useState([]);
        const [globalLightbox, setGlobalLightbox] = React.useState(null);

        React.useEffect(() => {

                delete window.previewImage;

        const smartMerge = React.useCallback((localArray, serverArray) => {
            if (!serverArray || !Array.isArray(serverArray)) return localArray || [];
            if (!localArray || !Array.isArray(localArray) || localArray.length === 0) return serverArray;

            const serverMap = new Map();
            serverArray.forEach(item => { if (item && item.id != null) serverMap.set(String(item.id), item); });

            const localMap = new Map();
            localArray.forEach(item => { if (item && item.id != null) localMap.set(String(item.id), item); });

            // 1. Duyệt qua serverArray và merge với local nếu có
            const result = serverArray.map(serverItem => {
                if (!serverItem || serverItem.id == null) return serverItem;
                const localItem = localMap.get(String(serverItem.id));
                if (!localItem) return serverItem;
                
                // Chống Stale Overwrite: Nếu localItem vừa có thao tác optimistic gần nhất (< 60s),
                // ưu tiên giữ các trường thay đổi cục bộ của localItem thay vì bị server cũ đè lên!
                const isRecentLocalEdit = localItem._optimisticTime && (Date.now() - localItem._optimisticTime < 60000);
                if (isRecentLocalEdit) {
                    return { ...serverItem, ...localItem };
                }
                return { ...localItem, ...serverItem };
            });

            // 2. Bảo lưu items vừa tạo local (đang chờ sync hoặc vừa sync < 180s)
            localArray.forEach(localItem => {
                if (localItem && localItem.id != null && !serverMap.has(String(localItem.id))) {
                    const isRecent = localItem._optimisticTime && (Date.now() - localItem._optimisticTime < 180000);
                    if (isRecent) {
                        result.unshift(localItem);
                    }
                }
            });

            return result;
        }, []);

            const localMap = new Map();
            localArray.forEach(o => { if (o && o.id != null) localMap.set(String(o.id), o); });

            const result = serverArray.map(serverOrder => {
                if (!serverOrder || serverOrder.id == null) return serverOrder;
                const localOrder = localMap.get(String(serverOrder.id));
                if (!localOrder) return serverOrder;

                // Bảo toàn accessories logic
                let mergedAcc = serverOrder.accessories;
                const isIncomingEmpty = !mergedAcc || mergedAcc === '[]' || mergedAcc === '' || (Array.isArray(mergedAcc) && mergedAcc.length === 0);
                if (isIncomingEmpty && localOrder.accessories) {
                    const isLocalEmpty = !localOrder.accessories || localOrder.accessories === '[]' || localOrder.accessories === '' || (Array.isArray(localOrder.accessories) && localOrder.accessories.length === 0);
                    if (!isLocalEmpty) mergedAcc = localOrder.accessories;
                }

                // Chống Stale Overwrite: Nếu đơn hàng vừa có thao tác optimistic gần nhất (< 60s),
                // ưu tiên giữ các trường thay đổi cục bộ của localOrder!
                const isRecentLocalEdit = localOrder._optimisticTime && (Date.now() - localOrder._optimisticTime < 60000);
                if (isRecentLocalEdit) {
                    return { ...serverOrder, ...localOrder, accessories: mergedAcc };
                }
                return { ...localOrder, ...serverOrder, accessories: mergedAcc };
            });

            localArray.forEach(localOrder => {

                    if (isArchived || isRecent) {

                }
            });

        }, []);

        const applyDeltaToState = React.useCallback((payload) => {
            if (!payload) return;
            lastStateMutationTimestampRef.current = Date.now();
            const optimisticMerge = (currentArray, newItems, deleteIds) => {
                let result = [...(currentArray || [])];
                if (deleteIds && deleteIds.length > 0) {
                    result = result.filter(x => !deleteIds.some(dId => String(dId) === String(x.id)));
                }
                if (newItems && newItems.length > 0) {
                    newItems.forEach(item => {
                        const idx = result.findIndex(x => String(x.id) === String(item.id));
                        if (idx >= 0) {
                            const existing = result[idx];
                            let mergedAcc = item.accessories;
                            const isIncomingEmpty = mergedAcc === undefined || mergedAcc === null || mergedAcc === '' || mergedAcc === '[]' || (Array.isArray(mergedAcc) && mergedAcc.length === 0);
                            if (isIncomingEmpty && existing && existing.accessories) {
                                const isExistingEmpty = !existing.accessories || existing.accessories === '[]' || existing.accessories === '' || (Array.isArray(existing.accessories) && existing.accessories.length === 0);
                                if (!isExistingEmpty) {
                                    mergedAcc = existing.accessories;
                                }
                            }
                            result[idx] = { ...existing, ...item, accessories: mergedAcc, _optimisticTime: Date.now() };
                        } else {
                            result.unshift({ ...item, _optimisticTime: Date.now() });
                        }
                    });
                }
                return result;
            };

            // --- ĐỒNG BỘ TRẠNG THÁI ĐƠN HÀNG CHUẨN ---
            let cleanOrders = payload.orders;
            if (cleanOrders && Array.isArray(cleanOrders)) {
                cleanOrders = cleanOrders.map(order => {
                    if (order.status) {
                        const s = String(order.status).trim().toLowerCase();
                        let cleanStatus = s;
                        if (s.includes('hủy') || s.includes('huỷ') || s === 'cancelled') cleanStatus = 'Đơn Huỷ';
                        else if (s.includes('đang sản xuất')) cleanStatus = 'Đang Sản Xuất';
                        else if (s === 'đã bàn giao' || s === 'delivered') cleanStatus = 'Đã Bàn Giao';
                        else if (s === 'đối soát thành công' || s === 'completed') cleanStatus = 'Đối Soát Thành Công';
                        else if (s.includes('sẵn sàng đóng gói')) cleanStatus = 'Sẵn Sàng Đóng Gói';
                        else if (s === 'hàng hoàn' || s === 'returned') cleanStatus = 'Hàng Hoàn';
                        else if (s === 'chờ sản xuất') cleanStatus = 'Chờ Sản Xuất';
                        else if (s === 'đã nhập kho') cleanStatus = 'Đã Nhập Kho';
                        else cleanStatus = s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

                        return { ...order, status: cleanStatus };
                    }
                    return order;
                });
            }

            const deletes = payload.deletes || {};

            if (cleanOrders || deletes.Orders || deletes.orders) {
                setOrders(prev => {
                    const next = optimisticMerge(prev, cleanOrders, deletes.Orders || deletes.orders);
                    window.GLOBAL_ALL_ORDERS = next;

            }
            if (payload.prodItems || deletes.Production || deletes.prodItems) {
                setProdItems(prev => optimisticMerge(prev, payload.prodItems, deletes.Production || deletes.prodItems));
            }
            if (payload.packings || deletes.Packings || deletes.packings) {
                setPackings(prev => optimisticMerge(prev, payload.packings, deletes.Packings || deletes.packings));
            }
            if (payload.attendance || deletes.Attendance || deletes.attendance) {
                setAttendance(prev => optimisticMerge(prev, payload.attendance, deletes.Attendance || deletes.attendance));

            if (payload.ctvTransactions) {

            setErpData(prev => ({
                ...prev,
                ...(payload.Documents || payload.documents || deletes.Documents || deletes.documents ? {

                    // CHỐNG RACE CONDITION: Hủy bỏ nếu đổi phiên, hoặc có lượt tải mới hơn, hoặc đang sync
                    if (activeSessionIdRef.current !== sessionAtStart) return;

                                isMenuOpen
                                    ? 'text-white font-bold bg-white/[0.12] border border-white/20'
                                    : 'text-zinc-400 hover:text-zinc-200'
                            }`}
                            aria-label="Tất cả Menu"
                        >
                            <div className="w-5 h-5 flex items-center justify-center text-[14px]">
                                <i className="fas fa-bars-staggered"></i>
                            </div>
                            <span className="text-[9.5px] font-medium tracking-tight mt-0.5 leading-none">Menu</span>
                        </button>
                    </nav>

                    {/* NÚT TẢI LẠI TRANG & TRỢ LÝ ĐIỀU PHỐI XƯỞNG */}
                    {typeof ReloadAppButton !== 'undefined' && <ReloadAppButton />}
                    {typeof WorkshopAssistantWidget !== 'undefined' && <WorkshopAssistantWidget currentUser={currentUser} activeTab={activeTab} />}
                    {typeof RFAgentControlTower !== 'undefined' && (
                        <RFAgentControlTower 
                            currentUser={currentUser} 
                            activeTab={activeTab}
                            orders={orders}
                            prodItems={prodItems}
                            packings={packings}
                            attendance={attendance}
                            erpData={erpData}
                            userConfigs={userConfigs}
                            kpiConfig={kpiConfig}
                        />
                    )}

                    {/* CÁC MODAL TOÀN CỤC CHẠY NGẦM */}
                    {showBulkImport && typeof BulkImportModal !== 'undefined' && <BulkImportModal onClose={() => setShowBulkImport(false)} pushDeltas={pushDeltas} existingOrders={orders} products={erpData.Products} existingProdItems={prodItems} />}
                    {showScanLabel && typeof ScanLabelModal !== 'undefined' && <ScanLabelModal onClose={() => setShowScanLabel(false)} pushDeltas={pushDeltas} existingOrders={orders} products={erpData.Products} triggerToast={triggerToast} />}
                    {showDocumentUpload && typeof DocumentUploadModal !== 'undefined' && <DocumentUploadModal onClose={() => setShowDocumentUpload(false)} pushDeltas={pushDeltas} triggerToast={triggerToast} />}
                    {stockHistoryItem && typeof StockHistoryModal !== 'undefined' && <StockHistoryModal product={stockHistoryItem} onClose={() => setStockHistoryItem(null)} importExport={erpData?.ImportExport} products={erpData?.Products} pushDeltas={pushDeltas} triggerToast={triggerToast} isAdmin={isAdmin} isBoss={isBoss} />}

                    <>
                        {typeof ConfirmModal !== 'undefined' && <ConfirmModal visible={confirmModal.visible} title={confirmModal.title} message={confirmModal.message} onConfirm={() => { if (confirmModal.onConfirm) confirmModal.onConfirm(); closeModals(); }} onCancel={closeModals} />}
                        {typeof AlertModal !== 'undefined' && <AlertModal visible={alertModal.visible} title={alertModal.title} message={alertModal.message} onClose={closeModals} />}
                        {typeof InputModal !== 'undefined' && <InputModal visible={inputModal.visible} title={inputModal.title} placeholder={inputModal.placeholder} onConfirm={(value) => { if (inputModal.onConfirm) inputModal.onConfirm(value); closeModals(); }} onCancel={closeModals} />}
                        {typeof FreightCalculatorModal !== 'undefined' && <FreightCalculatorModal visible={freightModal} onClose={closeModals} />}
                        {typeof TankPriceModal !== 'undefined' && <TankPriceModal visible={tankPriceModal} onClose={closeModals} />}
                        {typeof LayoutCalculatorModal !== 'undefined' && <LayoutCalculatorModal visible={layoutCalcModal} onClose={closeModals} configGiaLayout={configGiaLayout || []} />}
                        {typeof PriceListModal !== 'undefined' && <PriceListModal visible={priceListModal} onClose={closeModals} triggerToast={triggerToast} erpProducts={erpData?.Products || []} />}
                        {typeof StaffReimbursementModal !== 'undefined' && <StaffReimbursementModal visible={staffReimbModal} onClose={closeModals} pushDeltas={pushDeltas} currentUser={currentUser} triggerToast={triggerToast} />}
                        {typeof AdminApprovalModal !== 'undefined' && <AdminApprovalModal data={adminApproveModalData} onClose={closeModals} pushDeltas={pushDeltas} triggerToast={triggerToast} accounts={erpData?.Accounts || []} />}
                        {typeof QuickPenaltyModal !== 'undefined' && <QuickPenaltyModal visible={quickPenaltyModal} onClose={closeModals} pushDeltas={pushDeltas} triggerToast={triggerToast} userConfigs={userConfigs} />}
                        {typeof QuickExpenseModal !== 'undefined' && <QuickExpenseModal visible={quickExpenseModal} onClose={closeModals} pushDeltas={pushDeltas} triggerToast={triggerToast} accounts={erpData?.Accounts || []} />}
                    </>


                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
