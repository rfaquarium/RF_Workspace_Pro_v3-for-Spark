<script type="text/babel">
    // ==========================================
    // 1. MÀN HÌNH ĐĂNG NHẬP & MỞ KHOÁ (HALLMARK CLEAN DARK MATTE & TACTILE)
    // ==========================================
    function Login({ onLogin }) {
        const [pin, setPin] = React.useState("");
        const [loading, setLoading] = React.useState(false);
        const [errorShake, setErrorShake] = React.useState(false);

        const submitPin = React.useCallback(async (value) => {
            if (!value || value.length < 4 || loading) return;
            setLoading(true);
            try {
                const result = await runGAS('validatePin', value);
                if (result && result.valid && result.user) {
                    localStorage.setItem('rf_pin', value);
                    document.cookie = `rf_pin=${value}; max-age=31536000; path=/`;

                    if (result.isAdmin) {
                        localStorage.setItem('rf_admin', 'true');
                        document.cookie = `rf_admin=true; max-age=31536000; path=/`;
                    }
                    if (result.isBoss) {
                        localStorage.setItem('rf_boss', 'true');
                        document.cookie = `rf_boss=true; max-age=31536000; path=/`;
                    }
                    if (result.role) {
                        localStorage.setItem('rf_role', result.role);
                        document.cookie = `rf_role=${result.role}; max-age=31536000; path=/`;
                    }

                    onLogin(result.user, result.isAdmin || false, result.isBoss || false, result.role || '');
                } else {
                    setErrorShake(true);
                    setTimeout(() => setErrorShake(false), 500);
                    setPin('');
                }
            } catch (err) {
                setErrorShake(true);
                setTimeout(() => setErrorShake(false), 500);
                setPin('');
            }
            setLoading(false);
        }, [loading, onLogin]);

        const handleKeyClick = React.useCallback((digit) => {
            if (loading) return;
            setPin(prev => {
                if (prev.length >= 6) return prev;
                const nextPin = prev + digit;
                if (nextPin.length === 6) {
                    setTimeout(() => submitPin(nextPin), 60);
                }
                return nextPin;
            });
        }, [loading, submitPin]);

        const handleBackspace = React.useCallback(() => {
            if (loading) return;
            setPin(prev => prev.slice(0, -1));
        }, [loading]);

        const handleClear = React.useCallback(() => {
            if (loading) return;
            setPin('');
        }, [loading]);

        // LẮNG NGHE BÀN PHÍM VẬT LÝ MÁY TÍNH - KHÔNG DÙNG THẺ INPUT ẨN ĐỂ TRÁNH BÀN PHÍM OS MOBILE BUNG LÊN GÂY GIẬT MÀN HÌNH
        React.useEffect(() => {
            const onKeyDown = (e) => {
                if (loading) return;
                if (/^[0-9]$/.test(e.key)) {
                    e.preventDefault();
                    handleKeyClick(e.key);
                } else if (e.key === 'Backspace') {
                    e.preventDefault();
                    handleBackspace();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    handleClear();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (pin.length >= 4) {
                        submitPin(pin);
                    }
                }
            };
            window.addEventListener('keydown', onKeyDown);
            return () => window.removeEventListener('keydown', onKeyDown);
        }, [loading, handleKeyClick, handleBackspace, handleClear, submitPin, pin]);

        const keypadLetters = {
            '1': '', '2': 'ABC', '3': 'DEF',
            '4': 'GHI', '5': 'JKL', '6': 'MNO',
            '7': 'PQRS', '8': 'TUV', '9': 'WXYZ'
        };

        const canSubmit = pin.length >= 4 && !loading;

        const submitBtnText = React.useMemo(() => {
            if (loading) return 'ĐANG XÁC THỰC...';
            if (canSubmit) return 'MỞ KHÓA HỆ THỐNG';
            if (pin.length > 0) return 'ĐÃ NHẬP ' + pin.length + '/6 SỐ';
            return 'NHẬP MÃ PIN (4 - 6 SỐ)';
        }, [loading, canSubmit, pin.length]);

        const submitBtnClass = React.useMemo(() => {
            const base = 'w-full rounded-2xl font-black text-[13px] tracking-wider uppercase transition-colors duration-150 flex items-center justify-center gap-2.5 box-border border select-none ';
            if (canSubmit) {
                return base + 'bg-gradient-to-r from-amber-400 via-[#d4af37] to-amber-500 text-zinc-950 border-amber-400/80 shadow-[0_4px_20px_rgba(212,175,55,0.35)] hover:brightness-110 cursor-pointer';
            }
            if (loading) {
                return base + 'bg-zinc-800 text-[#d4af37] border-[#d4af37]/30 cursor-wait';
            }
            return base + 'bg-zinc-800/40 text-zinc-600 border-white/[0.06] cursor-not-allowed opacity-75';
        }, [canSubmit, loading]);

        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-3 sm:p-4 bg-[#08080a] text-white select-none overflow-hidden overscroll-none touch-none">
                {/* Subtle Ambient Background Glow */}
                <div className="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_50%_15%,_rgba(212,175,55,0.06)_0%,_transparent_65%)]"></div>

                {/* MODAL CỐ ĐỊNH KÍCH THƯỚC TUYỆT ĐỐI - ZERO LAYOUT SHIFT (ĐỨNG IM 100%) */}
                <div 
                    className={'w-full max-w-[360px] sm:max-w-[390px] bg-[#121216] px-5 py-5 sm:px-7 sm:py-6 rounded-[28px] sm:rounded-[32px] border border-white/[0.08] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.95)] flex flex-col items-center relative z-10 box-border ' + (errorShake ? 'animate-shake' : '')}
                    style={{ minHeight: '520px' }}
                >
                    {/* Brand Lock Badge Cố Định */}
                    <div className="w-13 h-13 sm:w-14 sm:h-14 rounded-2xl bg-zinc-900/90 border border-white/[0.08] flex items-center justify-center mb-2.5 shadow-inner shrink-0" style={{ width: '52px', height: '52px' }}>
                        <i className={'fas text-xl transition-colors duration-150 ' + (canSubmit ? 'fa-unlock-alt text-[#d4af37]' : 'fa-lock text-zinc-400')}></i>
                    </div>

                    <h1 className="text-white font-extrabold text-[18px] sm:text-[20px] tracking-tight text-center leading-tight">
                        RF Workspace Pro
                    </h1>
                    <p className="text-zinc-400 text-[12px] font-medium mb-4 text-center h-4 flex items-center justify-center">
                        Nhập mã PIN 4 - 6 số để mở khóa
                    </p>

                    {/* PIN Visual Dots: CỐ ĐỊNH CHIỀU CAO VÀ KÍCH THƯỚC (KHÔNG SCALE LÀM NHẢY LAYOUT) */}
                    <div className="flex items-center justify-center gap-3 mb-5 py-1 h-5 shrink-0" style={{ height: '20px' }}>
                        {[0, 1, 2, 3, 4, 5].map(idx => {
                            const isFilled = idx < pin.length;
                            let dotBg = 'bg-zinc-800 border border-white/[0.12]';
                            if (errorShake) dotBg = 'bg-rose-500';
                            else if (isFilled) dotBg = 'bg-[#d4af37]';
                            return (
                                <div 
                                    key={idx}
                                    className={'rounded-full transition-colors duration-100 ' + dotBg}
                                    style={{ width: '13px', height: '13px', minWidth: '13px', minHeight: '13px' }}
                                ></div>
                            );
                        })}
                    </div>

                    {/* BÀN PHÍM SỐ CỐ ĐỊNH - TOUCH ACTION MANIPULATION ĐỨNG IM BẤT ĐỘNG */}
                    <div 
                        className="grid grid-cols-3 gap-2 sm:gap-2.5 w-full mb-3.5 select-none" 
                        style={{ touchAction: 'manipulation' }}
                    >
                        {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(num => (
                            <button
                                key={num}
                                type="button"
                                onClick={() => handleKeyClick(num)}
                                disabled={loading}
                                style={{ touchAction: 'manipulation' }}
                                className="h-13 sm:h-14 rounded-2xl bg-[#1c1c22] hover:bg-[#25252e] active:bg-[#d4af37] active:text-zinc-950 border border-white/[0.07] text-white flex flex-col items-center justify-center transition-colors duration-75 cursor-pointer shadow-sm disabled:opacity-50 group select-none"
                            >
                                <span className="font-extrabold text-xl sm:text-2xl leading-none group-active:text-zinc-950">{num}</span>
                                {keypadLetters[num] && (
                                    <span className="text-[9px] font-bold tracking-widest text-zinc-500 group-active:text-zinc-800 leading-none mt-1">
                                        {keypadLetters[num]}
                                    </span>
                                )}
                            </button>
                        ))}
                        <button
                            type="button"
                            onClick={handleClear}
                            disabled={loading || pin.length === 0}
                            style={{ touchAction: 'manipulation' }}
                            className="h-13 sm:h-14 rounded-2xl bg-[#15151a] hover:bg-zinc-800 border border-white/[0.06] text-zinc-400 hover:text-zinc-200 text-[11.5px] sm:text-[12px] font-bold uppercase transition-colors duration-75 cursor-pointer flex items-center justify-center disabled:opacity-20 select-none"
                        >
                            XÓA HẾT
                        </button>
                        <button
                            type="button"
                            onClick={() => handleKeyClick('0')}
                            disabled={loading}
                            style={{ touchAction: 'manipulation' }}
                            className="h-13 sm:h-14 rounded-2xl bg-[#1c1c22] hover:bg-[#25252e] active:bg-[#d4af37] active:text-zinc-950 border border-white/[0.07] text-white flex items-center justify-center font-extrabold text-xl sm:text-2xl transition-colors duration-75 cursor-pointer shadow-sm disabled:opacity-50 select-none"
                        >
                            0
                        </button>
                        <button
                            type="button"
                            onClick={handleBackspace}
                            disabled={loading || pin.length === 0}
                            style={{ touchAction: 'manipulation' }}
                            className="h-13 sm:h-14 rounded-2xl bg-[#15151a] hover:bg-zinc-800 border border-white/[0.06] text-zinc-400 hover:text-zinc-200 text-base transition-colors duration-75 cursor-pointer flex items-center justify-center disabled:opacity-20 select-none"
                            title="Xóa 1 số"
                        >
                            <i className="fas fa-backspace text-base"></i>
                        </button>
                    </div>

                    {/* NÚT SUBMIT: CỐ ĐỊNH KÍCH THƯỚC CHIỀU CAO (50PX) & ĐỘ DÀY VIỀN 1PX CẢ 2 TRẠNG THÁI (KHÔNG GIẬT DÙ 0.1 PIXEL) */}
                    <button
                        type="button"
                        onClick={() => submitPin(pin)}
                        disabled={!canSubmit}
                        style={{ height: '50px', touchAction: 'manipulation' }}
                        className={submitBtnClass}
                    >
                        <i className={'fas text-sm w-4 text-center ' + (loading ? 'fa-spinner fa-spin text-[#d4af37]' : (canSubmit ? 'fa-unlock-alt' : 'fa-lock'))}></i>
                        <span className={loading ? 'font-bold' : ''}>{submitBtnText}</span>
                    </button>

                    <div className="mt-3.5 text-[10px] text-zinc-500 font-semibold tracking-wider uppercase text-center shrink-0">
                        Bảo mật nội bộ • Rich Fish Aquarium
                    </div>
                </div>
            </div>
        );
    }

    // ==========================================
    // 2. CÁC MODAL THÔNG BÁO HỆ THỐNG
    // ==========================================
    function ConfirmModal({ visible, title, message, onConfirm, onCancel, confirmText = "XÁC NHẬN", cancelText = "HỦY" }) {
        if (!visible) return null;
        return (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[9999] p-4 animate-fade-in">
                <div className="rf-premium-glass rounded-[28px] p-7 text-white border border-white/10 shadow-[0_25px_70px_-15px_rgba(0,0,0,0.9)] transition-all transform scale-100 w-full max-w-sm">
                    <div className="w-12 h-12 rounded-full bg-sky-100 text-[#0284c7] border border-sky-200/50 flex items-center justify-center text-xl mb-5"><i className="fas fa-question-circle"></i></div>
                    <div className="text-zinc-100 font-extrabold tracking-wide text-base mb-3">{title}</div>
                    <div className="text-zinc-400 font-normal text-[12px] leading-relaxed mb-6">{message}</div>
                    <div className="flex gap-3"><button onClick={onCancel} className="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-black active:scale-95 transition-all">{cancelText}</button><button onClick={onConfirm} className="flex-1 py-3.5 bg-[#d4af37] text-[#111] rounded-xl font-black active:scale-95 shadow-md transition-all">{confirmText}</button></div>
                </div>
            </div>
        );
    }

    function AlertModal({ visible, title, message, onClose, buttonText = "ĐÃ HIỂU" }) {
        if (!visible) return null;
        return (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[9999] p-4 animate-fade-in">
                <div className="rf-premium-glass rounded-[28px] p-7 text-white border border-white/10 shadow-[0_25px_70px_-15px_rgba(0,0,0,0.9)] transition-all transform scale-100 w-full max-w-sm flex flex-col items-center text-center">
                    <div className="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center text-2xl mb-5"><i className="fas fa-info-circle"></i></div>
                    <div className="text-zinc-100 font-extrabold tracking-wide text-base mb-3">{title}</div>
                    <div className="text-zinc-400 font-normal text-[12px] leading-relaxed mb-6">{message}</div>
                    <button onClick={onClose} className="w-full py-3.5 bg-[#d4af37] hover:bg-[#b8972e] text-[#111] rounded-xl font-black active:scale-95 shadow-md transition-all">{buttonText}</button>
                </div>
            </div>
        );
    }

    function InputModal({ visible, title, placeholder, defaultValue = "", onConfirm, onCancel }) {
        const [value, setValue] = React.useState(defaultValue);
        if (!visible) return null;
        const handleConfirm = () => { onConfirm(value); setValue(""); };
        return (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[9999] p-4 animate-fade-in">
                <div className="rf-premium-glass rounded-[28px] p-7 text-white border border-white/10 shadow-[0_25px_70px_-15px_rgba(0,0,0,0.9)] transition-all transform scale-100 w-full max-w-sm">
                    <div className="text-zinc-100 font-extrabold tracking-wide text-base mb-5">{title}</div>
                    <input type="text" value={value} onChange={(e) => setValue(e.target.value)} placeholder={placeholder} className="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full mb-6" autoFocus />
                    <div className="flex gap-3"><button onClick={() => { onCancel(); setValue(""); }} className="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-black active:scale-95 transition-all">HỦY</button><button onClick={handleConfirm} className="flex-1 py-3.5 bg-[#d4af37] hover:bg-[#b8972e] text-[#111] rounded-xl font-black active:scale-95 shadow-md transition-all">XÁC NHẬN</button></div>
                </div>
            </div>
        );
    }

    // ==========================================
    // 3. MODAL XỬ LÝ SỰ CỐ (S.O.S) 
    // ==========================================
    function ReturnSosModal({ sosTarget, erpProducts, order, packRecord, onClose, pushDeltas, triggerToast, setOptimisticOrder, prods = [], accessories = [] }) {
        const { type, item } = sosTarget;
        const defaultQty = type === 'acc' ? (Number(item.quantity) || 1) : 1;
        const [recoveredQty, setRecoveredQty] = React.useState(defaultQty);
        const [reason, setReason] = React.useState('');
        const [condition, setCondition] = React.useState('REPAIR');
        const [processing, setProcessing] = React.useState(false);

        const erpP = (erpProducts || []).find(x => x.name === item.name) || {};
        const costPrice = Number(erpP.costPrice) || 0;

        const p1User = item.phases?.phase1?.user || '';
        const p2User = item.phases?.phase2?.user || '';
        const p1Reward = Number(item.phases?.phase1?.reward_vnd) || 0;
        const p2Reward = Number(item.phases?.phase2?.reward_vnd) || 0;
        const packUser = packRecord?.user || packRecord?.updatedBy || '';
        const packReward = Number(packRecord?.reward_vnd) || 0;

        const missingQty = Math.max(0, defaultQty - Number(recoveredQty || 0));

        const p1Label = item.phases?.phase1?.name || 'Khâu 1';
        const p2Label = item.phases?.phase2?.name || 'Khâu 2';

        const handleSubmit = async () => {
            if (!reason) return triggerToast('Vui lòng chọn nguyên nhân!', 'fa-exclamation', 'warning');
            setProcessing(true);
            try {
                let payload = {};
                let payloadMsg = '';
                const safeDate = new Date().toISOString().replace('T', ' ').slice(0, 23);
                const safeDateOnly = safeDate.split(' ')[0];

                if (type === 'acc') {
                    if (Number(recoveredQty) > 0 && erpP.id) {
                        payload.Products = [{ id: erpP.id, quantity: Number(erpP.quantity) + Number(recoveredQty), _diff: Number(recoveredQty) }];
                    }

                    if (missingQty > 0) {
                        payload.ImportExport = payload.ImportExport || [];
                        payload.ImportExport.push({
                            id: 'IE_LOSS_' + Date.now(),
                            type: 'Xuất',
                            target: 'Hủy Hàng',
                            totalAmount: 0,
                            date: safeDate,
                            note: `Hủy phụ kiện thiếu/vỡ - Đơn ${order.orderCode}`,
                            itemsData: JSON.stringify([{ name: item.name, qty: missingQty, price: costPrice }])
                        });

                        if (reason === 'DONG_GOI' && packUser) {
                            const penaltyAmount = missingQty * costPrice;
                            payload.packings = [{
                                id: 'PENALTY_' + Date.now(),
                                orderId: order.id,
                                user: packUser,
                                date: safeDateOnly,
                                status: 'Penalty',
                                reward_vnd: -penaltyAmount,
                                note: `Phạt đền phụ kiện mất/thiếu: ${item.name}`
                            }];
                        }
                    }

                    let accList = order.accessories || [];
                    while (typeof accList === 'string') {
                        try { accList = JSON.parse(accList); } catch (e) { break; }
                    }
                    if (!Array.isArray(accList)) accList = [];
                    const newAccs = accList.map(a => a.name === item.name ? { ...a, _retStatus: 'SOS' } : a);
                    payload.orders = [{ ...order, accessories: JSON.stringify(newAccs) }];
                    setOptimisticOrder({ ...order, accessories: newAccs });
                    payloadMsg = 'Đã ghi nhận sự cố phụ kiện!';
                }
                else if (type === 'prod') {
                    let penaltyUser = '';
                    let penaltyKPI = 0;

                    if (reason === 'PHASE1') { penaltyUser = p1User; penaltyKPI = p1Reward; }
                    else if (reason === 'PHASE2') { penaltyUser = p2User; penaltyKPI = p2Reward; }
                    else if (reason === 'DONG_GOI') { penaltyUser = packUser; penaltyKPI = packReward; }

                    if (condition === 'REPAIR') {
                        const newProdId = 'REP_' + Date.now();
                        const repItem = {
                            ...item,
                            id: newProdId,
                            status: 'Pending',
                            fulfilledFromStock: false,
                            note: `SỬA CHỮA HOÀN (Lỗi: ${reason})`,
                            phases: {
                                phase1: { status: 'Pending', user: reason === 'PHASE1' ? p1User : '', reward_vnd: 0, start: '', endTime: '', photo: '' },
                                phase2: { status: 'Pending', user: reason === 'PHASE2' ? p2User : '', reward_vnd: 0, start: '', endTime: '', photo: '' }
                            }
                        };
                        payload.prodItems = [{ ...item, status: 'Đã tạo lệnh sửa' }, repItem];
                        payloadMsg = 'Đã đẩy lệnh sửa chữa về xưởng!';

                        if (penaltyUser && penaltyKPI > 0) {
                            payload.packings = payload.packings || [];
                            payload.packings.push({
                                id: 'PENALTY_' + Date.now(),
                                orderId: order.id,
                                user: penaltyUser,
                                date: safeDateOnly,
                                status: 'Penalty',
                                reward_vnd: -penaltyKPI,
                                note: `Trừ KPI do hàng lỗi phải sửa lại: ${item.name}`
                            });
                        }
                    }
                    else if (condition === 'BROKEN') {
                        payload.ImportExport = [{
                            id: 'IE_LOSS_' + Date.now(),
                            type: 'Xuất',
                            target: 'Hủy Hàng',
                            totalAmount: 0,
                            date: safeDate,
                            note: `Hủy hàng vỡ nát - Đơn ${order.orderCode}`,
                            itemsData: JSON.stringify([{ name: item.name, qty: 1, price: costPrice }])
                        }];

                        if (penaltyUser && penaltyKPI > 0) {
                            payload.packings = payload.packings || [];
                            payload.packings.push({
                                id: 'PENALTY_' + Date.now(),
                                orderId: order.id,
                                user: penaltyUser,
                                date: safeDateOnly,
                                status: 'Penalty',
                                reward_vnd: -penaltyKPI,
                                note: `Trừ KPI do làm vỡ nát hàng: ${item.name}`
                            });
                        }
                        payload.prodItems = [{ ...item, status: 'Hủy/Vỡ' }];
                        payloadMsg = 'Đã ghi nhận vỡ nát & Thu hồi KPI!';
                    }
                }

                let tempAccs = [...accessories];
                let tempProds = [...prods];
                if (type === 'acc') {
                    tempAccs = tempAccs.map(a => a.name === item.name ? { ...a, _retStatus: 'SOS' } : a);
                } else if (type === 'prod') {
                    const newStatus = condition === 'REPAIR' ? 'Đã tạo lệnh sửa' : 'Hủy/Vỡ';
                    tempProds = tempProds.map(p => p.id === item.id ? { ...p, status: newStatus } : p);
                }
                const isAllProcessed = tempAccs.every(a => a._retStatus) && tempProds.every(p => p.status === 'Hoàn Kho Đạt' || p.status === 'Hủy/Vỡ' || p.status === 'Đã tạo lệnh sửa');

                if (isAllProcessed) {
                    if (!payload.orders) {
                        payload.orders = [{ ...order, status: 'Hoàn Thành' }];
                    } else {
                        payload.orders[0].status = 'Hoàn Thành';
                    }
                    setOptimisticOrder(payload.orders[0]);
                }

                await pushDeltas(payload, payloadMsg, 'fa-check');
                onClose();
            } catch (e) {
                triggerToast('Lỗi xử lý!', 'fa-times', 'danger');
            }
            setProcessing(false);
        };

        return (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[9999] p-4 animate-fade-in">
                <div className="rf-premium-glass rounded-[28px] p-7 text-white border border-white/10 shadow-[0_25px_70px_-15px_rgba(0,0,0,0.9)] transition-all transform scale-100 w-full max-w-sm">
                    <h3 className="font-black text-[#fb7185] text-[15px] uppercase tracking-widest mb-1 flex items-center gap-2">
                        <i className="fas fa-exclamation-triangle"></i> BÁO CÁO SỰ CỐ
                    </h3>
                    <div className="text-[12px] font-bold text-gray-400 mb-4 pb-3 border-b border-[#222] truncate">{item.name}</div>

                    <div className="space-y-4">
                        {type === 'acc' ? (
                            <>
                                <div>
                                    <label className="text-[10px] font-black text-gray-500 block mb-1">Số lượng THỰC TẾ thu hồi được</label>
                                    <input type="number" min="0" max={defaultQty} value={recoveredQty} onChange={e => setRecoveredQty(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2.5 text-white font-bold outline-none focus:border-[#fb7185] transition-colors" />

    // ==========================================
    // TÍNH GIÁ LAYOUT
    // ==========================================
    function LayoutCalculatorModal({ visible, onClose, configGiaLayout }) {
        const [l, setL] = React.useState(50);
        const [w, setW] = React.useState(30);
        const [h, setH] = React.useState(30);
        const [kieuDang, setKieuDang] = React.useState(1.0);
        const [optDongGoi, setOptDongGoi] = React.useState(false);
        const [optReu, setOptReu] = React.useState(false);
        const [chiPhiPhu, setChiPhiPhu] = React.useState('');

        if (!visible) return null;

        const parseNum = (val) => {
            if (!val && val !== 0) return 0;
            const num = Number(String(val).replace(/[^0-9.-]+/g, ''));
            return isNaN(num) ? 0 : num;
        };

        const lNum = parseNum(l);
        const wNum = parseNum(w);
        const hNum = parseNum(h);
        const maxSize = Math.max(lNum, wNum, hNum);
        const currentVolume = (lNum * wNum * hNum) / 1000;

        const LAYOUT_BASE_MODES = [
            { length: 20, width: 20, height: 20, volume: 8, basePrice: 350000 },
            { length: 30, width: 20, height: 20, volume: 12, basePrice: 500000 },
            { length: 40, width: 23, height: 25, volume: 23, basePrice: 700000 },
            { length: 40, width: 30, height: 30, volume: 36, basePrice: 800000 },
            { length: 50, width: 30, height: 30, volume: 45, basePrice: 900000 },
            { length: 60, width: 30, height: 30, volume: 54, basePrice: 1100000 },
            { length: 60, width: 40, height: 40, volume: 96, basePrice: 1250000 }
        ];

        const sortedModes = [...LAYOUT_BASE_MODES].sort((a, b) => a.volume - b.volume);

        let baseActualPrice = 0;
        const minMode = sortedModes[0];
        const maxMode = sortedModes[sortedModes.length - 1];

        if (currentVolume <= minMode.volume) {
            baseActualPrice = minMode.basePrice;
        } else if (currentVolume >= maxMode.volume) {
            baseActualPrice = maxMode.basePrice + (currentVolume - maxMode.volume) * 10000;
        } else {
            for (let i = 0; i < sortedModes.length - 1; i++) {
                if (currentVolume >= sortedModes[i].volume && currentVolume <= sortedModes[i + 1].volume) {
                    const modeA = sortedModes[i];
                    const modeB = sortedModes[i + 1];
                    baseActualPrice = modeA.basePrice + ((currentVolume - modeA.volume) / (modeB.volume - modeA.volume)) * (modeB.basePrice - modeA.basePrice);
                    break;
                }
            }
        }

        let matchingRows = configGiaLayout ? configGiaLayout.filter(r => parseNum(r.Size_Max) >= maxSize).sort((a, b) => parseNum(a.Size_Max) - parseNum(b.Size_Max)) : [];

        const layoutGoc = baseActualPrice * kieuDang;

    function StaffReimbursementModal({ visible, onClose, pushDeltas, currentUser, triggerToast }) {
        const [amount, setAmount] = React.useState('');
        const [reason, setReason] = React.useState('');
        const [receiptPhotoUrl, setReceiptPhotoUrl] = React.useState('');
        const [qrCodeUrl, setQrCodeUrl] = React.useState('');
        const [uploadingReceipt, setUploadingReceipt] = React.useState(false);
        const [uploadingQR, setUploadingQR] = React.useState(false);

        if (!visible) return null;

        const formatDisplayMoney = (val) => {
            if (!val && val !== 0) return '';
            const num = String(val).replace(/\D/g, '');
            if (!num) return '';
            return Number(num).toLocaleString('vi-VN');
        };

        const handleAmountChange = (e) => {
            const rawVal = e.target.value;
            const cleanDigits = rawVal.replace(/\D/g, '');
            setAmount(cleanDigits);
        };

        const handleQuickAmount = (val) => {
            setAmount(String(val));
        };

        const handleUpload = async (e, type) => {
            const file = e.target.files[0];
            if (!file) return;
            if (type === 'receipt') setUploadingReceipt(true);
            else setUploadingQR(true);

            try {
                let base64 = "";
                if (typeof resizeImage === 'function') {
                    const resImg = await resizeImage(file, 1000, 1000);
                    base64 = resImg.includes(',') ? resImg.split(',')[1] : resImg;
                } else {
                    base64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (ev) => resolve(ev.target.result.split(',')[1]);
                        reader.readAsDataURL(file);
                    });
                }

                if (triggerToast) triggerToast("Đang tải ảnh lên máy chủ...", "fa-spinner fa-spin", "info");
                const prefix = type === 'receipt' ? 'BILL_REIM' : 'QR_REIM';
                const url = await runGAS('uploadImage', base64, `${prefix}_${Date.now()}.jpg`);

                if (url) {
                    if (type === 'receipt') setReceiptPhotoUrl(url);
                    else setQrCodeUrl(url);
                    if (triggerToast) triggerToast("Tải ảnh thành công!", "fa-check", "success");
                } else {
                    if (triggerToast) triggerToast("Lỗi khi upload ảnh", "fa-times", "danger");
                }
            } catch (err) {
                if (triggerToast) triggerToast("Lỗi xử lý ảnh", "fa-times", "danger");
            } finally {
                if (type === 'receipt') setUploadingReceipt(false);
                else setUploadingQR(false);
            }
        };

        const handleSubmit = () => {
            const numAmount = Number(amount);
            if (!numAmount || numAmount <= 0) {
                if (triggerToast) triggerToast("Vui lòng nhập số tiền hợp lệ (> 0đ)!", "fa-exclamation-triangle", "warning");
                return;
            }
            if (!reason.trim()) {
                if (triggerToast) triggerToast("Vui lòng nhập lý do ứng / hoàn tiền!", "fa-exclamation-triangle", "warning");
                return;
            }
            if (!receiptPhotoUrl) {
                if (triggerToast) triggerToast("Vui lòng tải ảnh hóa đơn / hàng hóa để đối chứng!", "fa-camera", "warning");
                return;
            }
            if (!qrCodeUrl) {
                if (triggerToast) triggerToast("Vui lòng tải ảnh mã QR nhận tiền!", "fa-qrcode", "warning");
                return;
            }
            const req = {
                id: 'REIM_' + Date.now(),
                staffName: currentUser,
                reason: reason.trim(),
                amount: numAmount,
                qrCodeUrl: qrCodeUrl,
                receiptPhotoUrl: receiptPhotoUrl,
                status: 'Chờ Duyệt',
                createdAt: new Date().toISOString()
            };
            pushDeltas({ Reimbursements: [req] });
            if (triggerToast) triggerToast("Đã gửi yêu cầu thanh khoản kèm ảnh hoá đơn!", "fa-check", "success");
            setAmount('');
            setReason('');
            setReceiptPhotoUrl('');
            setQrCodeUrl('');
            onClose();
        };

        return (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[9999] p-3 sm:p-4 animate-fade-in" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>

    function AdminApprovalModal({ data, onClose, pushDeltas, triggerToast, accounts = [] }) {
        if (!data) return null;
        const requestData = data;

        const accountsList = React.useMemo(() => {
            if (accounts && accounts.length > 0) return accounts;
            return [
                { id: 'ACC_TIENMAT', accountName: 'Tiền Mặt', balance: 0 },
                { id: 'ACC_BANK', accountName: 'Tài Khoản Ngân Hàng', balance: 0 }
            ];
        }, [accounts]);

        const [fromAccount, setFromAccount] = React.useState('');
        const [category, setCategory] = React.useState('Mua Vật Tư');
        const [amount, setAmount] = React.useState(() => String(requestData.amount || ''));
        const [title, setTitle] = React.useState(() => `Hoàn tiền: ${requestData.reason || requestData.name || 'Vật tư xưởng'}`);
        const [note, setNote] = React.useState(() => `Chi hoàn tiền cho nhân viên ${requestData.staffName || requestData.user || ''}`);
        const [submitting, setSubmitting] = React.useState(false);

        React.useEffect(() => {
            if (accountsList.length > 0 && !fromAccount) {
                setFromAccount(accountsList[0].id || accountsList[0].accountName);
            }
        }, [accountsList, fromAccount]);

        const EXPENSE_CATEGORIES = [
            { value: 'Mua Vật Tư', label: 'Mua vật tư sản xuất' },
            { value: 'Mua Nguyên Liệu', label: 'Mua nguyên liệu' },
            { value: 'Trang Thiết Bị', label: 'Trang thiết bị & Dụng cụ' },
            { value: 'Máy Móc & Công Cụ', label: 'Máy móc & công cụ' },
            { value: 'Thanh Toán Hoá Đơn', label: 'Thanh toán hoá đơn / NCC' },
            { value: 'Chi Phí Khác', label: 'Chi phí khác' }
        ];

        const handleCopyQR = async () => {
            try {
                if (!requestData.qrCodeUrl) return;
                if (requestData.qrCodeUrl.startsWith('data:image')) {
                    const response = await fetch(requestData.qrCodeUrl);
                    const blob = await response.blob();
                    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                    triggerToast('Đã copy mã QR thành công!', 'fa-check', 'success');
                } else {
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.src = requestData.qrCodeUrl;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        canvas.toBlob(async (blob) => {
                            try {
                                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                                triggerToast('Đã copy mã QR thành công!', 'fa-check', 'success');
                            } catch (err) {
                                triggerToast('Trình duyệt chặn copy. Hãy Chuột Phải -> Sao chép hình ảnh', 'fa-info-circle', 'warning');
                            }
                        }, 'image/png');
                    };
                    img.onerror = () => {
                        triggerToast('Trình duyệt chặn tải ảnh. Hãy Chuột Phải -> Sao chép hình ảnh', 'fa-info-circle', 'warning');
                    };
                }
            } catch (e) {
                triggerToast('Hãy bấm Chuột Phải -> Sao chép hình ảnh', 'fa-info-circle', 'warning');
            }
        };

        const handleApprove = async () => {
            const finalAmount = Number(amount) || Number(requestData.amount) || 0;
            if (finalAmount <= 0) {
                if (triggerToast) triggerToast('Vui lòng nhập số tiền chi hợp lệ lớn hơn 0!', 'fa-exclamation-circle', 'warning');
                return;
            }

            setSubmitting(true);
            try {
                const nowIso = new Date().toISOString().replace('T', ' ').slice(0, 19);
                const logId = 'TX_EXP_' + Date.now();
                
                const selectedAcc = accountsList.find(a => (a.id && a.id === fromAccount) || (a.accountName && a.accountName === fromAccount)) || accountsList[0];
                const fromAccName = selectedAcc ? (selectedAcc.accountName || selectedAcc.id) : (fromAccount || 'Tiền Mặt');

                const txRecord = {
                    id: logId,
                    type: 'Chi',
                    category: category,
                    amount: finalAmount,
                    fromAccount: fromAccName,
                    toAccount: '',
                    title: (title || '').trim() || `Hoàn tiền: ${requestData.reason || ''}`,
                    date: nowIso,
                    note: (note || '').trim() || `Hoàn cho nhân viên ${requestData.staffName || ''}`,
                    isAuto: 'FALSE'
                };

                const payload = {
                    deletes: { Reimbursements: [requestData.id] },
                    Transactions: [txRecord]
                };

                if (selectedAcc && selectedAcc.id) {
                    payload.Accounts = [{
                        ...selectedAcc,
                        balance: Number(selectedAcc.balance || 0) - finalAmount
                    }];
                }

                await pushDeltas(payload, `Đã duyệt chi -${finalAmount.toLocaleString('vi-VN')}đ cho ${requestData.staffName}!`, 'fa-file-invoice-dollar');
                if (triggerToast) triggerToast(`Đã duyệt chi & tạo phiếu chi ${finalAmount.toLocaleString('vi-VN')}đ thành công!`, 'fa-check', 'success');
                onClose();
            } catch (err) {
                console.error('Lỗi khi duyệt chi:', err);
                if (triggerToast) triggerToast('Lỗi khi lưu phiếu chi!', 'fa-times', 'danger');
            } finally {
                setSubmitting(false);
            }
        };

        return (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[9999] p-3 sm:p-4 animate-fade-in" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                <div className="bg-[#111015] border border-yellow-500/40 rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden animate-scale-up text-white flex flex-col max-h-[92vh]">

                    {/* Header */}
                    <div className="bg-[#181620] p-4 border-b border-[#282535] flex justify-between items-center shrink-0">
                        <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 rounded-xl bg-yellow-500/10 border border-yellow-500/30 flex items-center justify-center text-yellow-400 shadow-sm">
                                <i className="fas fa-money-check-alt text-sm"></i>
                            </div>
                            <div>
                                <h2 className="text-[13px] sm:text-sm font-black text-yellow-400 uppercase tracking-wider">DUYỆT CHI & HOÀN TIỀN VẬT TƯ</h2>
                                <p className="text-[10px] text-zinc-400 font-medium">Quét QR chuyển khoản và tạo phiếu chi tự động vào sổ quỹ</p>
                            </div>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-full bg-zinc-800 hover:bg-rose-600 flex items-center justify-center text-gray-400 hover:text-white transition-colors cursor-pointer text-sm font-bold">&times;</button>
                    </div>

                    {/* Body */}
                    <div className="p-4 sm:p-5 space-y-4 overflow-y-auto custom-scrollbar flex-1">
                        
                        {/* Thông tin tóm tắt yêu cầu */}
                        <div className="bg-[#181620] border border-[#2d293b] rounded-xl p-3.5 flex items-center justify-between gap-3 flex-wrap">
                            <div className="flex-1 min-w-[200px]">
                                <div className="text-[10px] text-zinc-400 font-bold uppercase tracking-wider mb-0.5">Nhân Sự Yêu Cầu</div>
                                <div className="text-sm font-bold text-white flex items-center gap-1.5">
                                    <i className="fas fa-user-circle text-rose-400"></i>
                                    <span>{requestData.staffName || requestData.user}</span>
                                </div>
                                <div className="text-[11px] text-yellow-300 font-medium mt-1">
                                    <i className="fas fa-tag text-[10px] mr-1 text-yellow-500"></i>
                                    {requestData.reason || requestData.name}
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-[10px] text-zinc-400 font-bold uppercase tracking-wider mb-0.5">Số Tiền Yêu Cầu</div>
                                <div className="text-xl font-mono font-black text-emerald-400">
                                    {Number(requestData.amount || 0).toLocaleString('vi-VN')} đ
                                </div>
                            </div>
                        </div>

                        {/* VÙNG ĐỐI CHỨNG: ẢNH HOÁ ĐƠN & MÃ QR CHUYỂN KHOẢN */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {/* Ảnh hoá đơn / hàng hoá */}
                            <div className="bg-[#181620] border border-rose-900/30 rounded-xl p-3 flex flex-col items-center">
                                <div className="text-[10px] font-black text-rose-400 uppercase tracking-wider mb-2 flex items-center gap-1.5 self-start">
                                    <i className="fas fa-receipt text-[11px]"></i> 1. Hoá Đơn / Chứng Từ
                                </div>
                                {requestData.receiptPhotoUrl ? (
                                    <div className="w-full flex flex-col items-center">
                                        <div className="w-full h-36 bg-black/60 rounded-lg overflow-hidden border border-zinc-700/60 flex items-center justify-center relative group">
                                            <img 
                                                src={requestData.receiptPhotoUrl} 
                                                alt="Hoá đơn" 
                                                className="w-full h-full object-contain cursor-pointer transition-transform group-hover:scale-105" 
                                                onClick={() => {
                                                    if (typeof window.previewImage === 'function') {
                                                        window.previewImage(requestData.receiptPhotoUrl, 'Ảnh Hoá Đơn / Chứng Từ');
                                                    } else if (typeof openSafeImageTab === 'function') {

                                                        window.open(requestData.receiptPhotoUrl, '_blank');

                                                    openSafeImageTab(requestData.receiptPhotoUrl);
                                                } else {
                                                    window.open(requestData.receiptPhotoUrl, '_blank');

                                            className="mt-2 px-3 py-1 bg-white/5 hover:bg-white/10 text-gray-300 text-[10px] font-bold rounded-lg border border-white/10 transition-colors flex items-center gap-1 cursor-pointer"

                                        <i className="fas fa-image text-zinc-600 text-lg mb-1"></i>
                                        <span>Không có ảnh hoá đơn</span>
                                    </div>
                                )}
                            </div>

                            {/* Mã QR Chuyển Tiền */}
                            <div className="bg-[#181620] border border-yellow-900/30 rounded-xl p-3 flex flex-col items-center">
                                <div className="text-[10px] font-black text-yellow-400 uppercase tracking-wider mb-2 flex items-center gap-1.5 self-start">
                                    <i className="fas fa-qrcode text-[11px]"></i> 2. Mã QR Nhận Tiền
                                </div>
                                {requestData.qrCodeUrl ? (
                                    <div className="w-full flex flex-col items-center">
                                        <div className="bg-white p-1.5 rounded-xl border border-yellow-500/40 shadow-md">
                                            <img src={requestData.qrCodeUrl} alt="QR Code" className="w-32 h-32 object-contain" />

    function ImageAnnotationModal({ item, readOnly: isReadOnlyProp, onClose, onSave }) {
        const readOnly = isReadOnlyProp ?? item?._readOnly ?? false;
        const [selectedImg, setSelectedImg] = React.useState('front');
        const [pinsFront, setPinsFront] = React.useState([]);
        const [pinsSide, setPinsSide] = React.useState([]);
        const [activePin, setActivePin] = React.useState(null);
        const [quickNotes, setQuickNotes] = React.useState([]);
        const [extraText, setExtraText] = React.useState('');
        const imgRef = React.useRef(null);

        React.useEffect(() => {
            if (item.qc_note) {
                try {
                    const parsed = JSON.parse(item.qc_note);
                    setPinsFront(parsed.front || []);
                    setPinsSide(parsed.side || []);
                    if (parsed.front && parsed.front.length === 0 && parsed.side && parsed.side.length > 0) {
                        setSelectedImg('side');
                    }
                } catch (e) { }
            }
        }, [item]);

        const QUICK_REASONS = [
            "Sai bố cục / Tỷ lệ",
            "Rễ đơ / Sai hướng",
            "Ghép đá lộ mí",
            "Không giống mẫu",
            "Form chưa bay",
            "Làm quá ẩu"
        ];

        const handleImgClick = (e) => {
            if (activePin) { setActivePin(null); return; }
            if (readOnly) return;

            const currentPins = selectedImg === 'front' ? pinsFront : pinsSide;
            if (currentPins.length >= 5) {
                alert('Chỉ được gắn tối đa 5 điểm lỗi trên mỗi ảnh!');
                return;
            }

            const rect = e.target.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;

            const newPin = { x, y, text: '' };
            if (selectedImg === 'front') {
                setPinsFront([...pinsFront, newPin]);
                setActivePin({ imgType: 'front', index: pinsFront.length });
            } else {
                setPinsSide([...pinsSide, newPin]);
                setActivePin({ imgType: 'side', index: pinsSide.length });
            }
        };

        const updatePinText = (text) => {
            if (!activePin) return;
            const { imgType, index } = activePin;
            if (imgType === 'front') {
                const newPins = [...pinsFront];
                newPins[index].text = text;
                setPinsFront(newPins);
            } else {
                const newPins = [...pinsSide];
                newPins[index].text = text;
                setPinsSide(newPins);
            }
        };

        const toggleQuickNote = (reason) => {
            if (readOnly) return;
            const isSelected = quickNotes.includes(reason);
            let nextQuickNotes;
            if (isSelected) {
                nextQuickNotes = quickNotes.filter(r => r !== reason);
            } else {
                nextQuickNotes = [...quickNotes, reason];
            }
            setQuickNotes(nextQuickNotes);

            // Đồng bộ trực tiếp vào ô lý do / mô tả chung để hiển thị rõ ràng 100%
            setExtraText(prev => {
                let parts = prev.split(',').map(s => s.trim()).filter(Boolean);
                if (isSelected) {
                    parts = parts.filter(p => p !== reason);
                } else {
                    if (!parts.includes(reason)) parts.push(reason);
                }
                return parts.join(', ');
            });

            // Nếu đang ghim điểm trên ảnh, tự động gán luôn lý do này vào điểm ghim
            if (activePin) {
                updatePinText(reason);
            }
        };

        const handleSave = () => {
            const hasAnyPin = pinsFront.length > 0 || pinsSide.length > 0;

            let finalReasonList = [...new Set([...quickNotes, ...(extraText ? extraText.split(',').map(s => s.trim()).filter(Boolean) : [])])];

            let note = "TỪ CHỐI KHUNG";
            if (finalReasonList.length > 0) note += `: ${finalReasonList.join(' | ')}`;
            if (hasAnyPin) note += " (Có ghim lỗi cụ thể trên ảnh)";

            const upd = JSON.parse(JSON.stringify(item));
            upd.qc_status = 'Từ chối';
            upd.status = 'In Progress'; // Đặt lại trạng thái chung để thoát khỏi tab ĐÃ XONG
            if (upd.phases && upd.phases['phase1']) {
                upd.phases['phase1'].status = 'In Progress';
            }
            upd.note = note + (upd.note ? ' | ' + upd.note : '');

            if (hasAnyPin) {
                upd.qc_note = JSON.stringify({
                    front: pinsFront,
                    side: pinsSide
                });
            } else {
                upd.qc_note = '';
            }

            onSave(upd);
        };

        const currentImgSrc = selectedImg === 'front' ? item.qc_front_photo : item.qc_side_photo;
        const currentPins = selectedImg === 'front' ? pinsFront : pinsSide;

        return (
            <div className="fixed inset-0 z-[99999] bg-[#000000]/95 flex flex-col p-2 md:p-4 animate-fade-in pb-10" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                <div className="relative max-w-lg w-full mx-auto flex flex-col bg-[#111] rounded-2xl border border-white/10 shadow-2xl overflow-hidden h-full max-h-[90vh]" onClick={e => e.stopPropagation()}>

                    {/* Header */}
                    <div className="flex justify-between items-center p-3 border-b border-white/10 bg-[#1a1a1a] shrink-0">
                        <h3 className="text-[#fb7185] font-black text-[12px] uppercase tracking-wider"><i className="fas fa-exclamation-circle mr-2"></i> {readOnly ? 'CHI TIẾT LỖI KCS' : 'Báo lỗi khung'}</h3>
                        <button onClick={onClose} className="text-gray-400 hover:text-white w-8 h-8 flex items-center justify-center bg-white/5 rounded-full"><i className="fas fa-times"></i></button>
                    </div>

                    {/* Body scrollable */}
                    <div className="flex-1 overflow-y-auto hide-scrollbar flex flex-col">
                        {/* Tabs */}
                        <div className="flex bg-[#0a0a0a] border-b border-white/10 p-2 gap-2 shrink-0">
                            <button onClick={() => setSelectedImg('front')} className={`flex-1 py-2 rounded-xl font-black text-[11px] uppercase tracking-wide transition-colors ${selectedImg === 'front' ? 'bg-[#d4af37] text-black shadow-md' : 'bg-[#121214] text-gray-400 hover:text-white'}`}>
                                MẶT TRƯỚC {pinsFront.length > 0 && <span className="ml-1 bg-rose-600 text-white px-2 py-0.5 rounded-md text-[9px] shadow-inner">{pinsFront.length}</span>}
                            </button>
                            {item.qc_side_photo && (
                                <button onClick={() => setSelectedImg('side')} className={`flex-1 py-2 rounded-xl font-black text-[11px] uppercase tracking-wide transition-colors ${selectedImg === 'side' ? 'bg-[#d4af37] text-black shadow-md' : 'bg-[#121214] text-gray-400 hover:text-white'}`}>
                                    MẶT NGHIÊNG {pinsSide.length > 0 && <span className="ml-1 bg-rose-600 text-white px-2 py-0.5 rounded-md text-[9px] shadow-inner">{pinsSide.length}</span>}
                                </button>
                            )}
                        </div>

                        {/* Image Container */}
                        <div className="relative w-full bg-[#000] min-h-[250px] md:min-h-[350px] shrink-0 flex items-center justify-center overflow-hidden group select-none">
                            <img
                                ref={imgRef}
                                src={currentImgSrc}
                                className={`w-full h-auto max-h-[50vh] object-contain transition-opacity duration-300 ${!readOnly ? 'cursor-crosshair' : ''}`}
                                onClick={handleImgClick}
                                alt="QC Image"
                                draggable="false"
                            />

                            {currentPins.map((pin, i) => (
                                <div
                                    key={i}
                                    className="absolute"
                                    style={{ left: `${pin.x}%`, top: `${pin.y}%`, transform: 'translate(-50%, -50%)' }}
                                >
                                    <div
                                        className="w-10 h-10 flex items-center justify-center cursor-pointer relative z-10"
                                        onClick={(e) => { e.stopPropagation(); setActivePin({ imgType: selectedImg, index: i }); }}
                                    >
                                        <div className="absolute inset-2 bg-yellow-500 rounded-full animate-ping opacity-60"></div>
                                        <div className="absolute inset-3 bg-[#d4af37] rounded-full shadow-[0_0_10px_rgba(212,175,55,0.8)] border border-white flex items-center justify-center text-black font-black text-[10px]">{i + 1}</div>
                                    </div>

                                    {activePin && activePin.imgType === selectedImg && activePin.index === i && (
                                        <div className="absolute top-10 left-1/2 -translate-x-1/2 w-[220px] bg-[#1a1a1a] rounded-xl shadow-2xl p-2 z-50 border border-yellow-500/30" onClick={e => e.stopPropagation()}>
                                            {readOnly ? (
                                                <div className="w-full text-[#d4af37] text-[12px] font-black bg-[#0a0a0a] p-3 rounded-lg border border-white/10 break-words whitespace-pre-wrap">
                                                    {pin.text || 'Không có ghi chú.'}
                                                </div>
                                            ) : (
                                                <textarea
                                                    autoFocus
                                                    value={pin.text}
                                                    onChange={e => updatePinText(e.target.value)}
                                                    placeholder="Ghi chú chi tiết cho điểm này..."
                                                    className="w-full text-white text-[12px] bg-[#0a0a0a] p-3 rounded-lg outline-none border border-white/10 focus:border-[#d4af37] resize-none h-20 transition-colors"
                                                ></textarea>
                                            )}
                                            <div className="flex justify-between mt-2 gap-2">
                                                {!readOnly && (
                                                    <button
                                                        onClick={() => {
                                                            if (selectedImg === 'front') setPinsFront(pinsFront.filter((_, idx) => idx !== i));
                                                            else setPinsSide(pinsSide.filter((_, idx) => idx !== i));
                                                            setActivePin(null);
                                                        }}
                                                        className="flex-1 bg-rose-500/10 text-rose-500 text-[10px] font-black uppercase tracking-wider py-2 rounded-lg hover:bg-rose-500 hover:text-white transition-colors"
                                                    >
                                                        XÓA
                                                    </button>
                                                )}
                                                <button
                                                    onClick={() => setActivePin(null)}
                                                    className="flex-[2] bg-[#d4af37] text-black text-[10px] font-black uppercase tracking-wider py-2 rounded-lg hover:bg-yellow-500 transition-colors shadow-md"
                                                >
                                                    XONG
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {(!activePin || activePin.index !== i) && pin.text && (
                                        <div className="absolute top-7 left-1/2 -translate-x-1/2 bg-black/90 text-[#d4af37] text-[10px] font-black uppercase px-3 py-1.5 rounded-lg whitespace-nowrap border border-[#d4af37]/40 pointer-events-none shadow-xl">
                                            {pin.text.length > 25 ? pin.text.substring(0, 25) + '...' : pin.text}
                                        </div>
                                    )}
                                </div>
                            ))}

                            {!currentPins.length && !readOnly && (
                                <div className="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-sm text-gray-300 text-[10px] font-black uppercase tracking-wider px-4 py-2 rounded-full pointer-events-none border border-white/10 flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div> Bấm vào vị trí lỗi để đánh dấu
                                </div>
                            )}
                        </div>

                        {/* Quick Reject / Hybrid UI */}
                        {!readOnly && (
                            <div className="p-3 bg-[#0a0a0a] flex-1 shrink-0">
                                <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Lý do nhanh (Tùy chọn)</div>
                                <div className="flex flex-wrap gap-2 mb-3">
                                    {QUICK_REASONS.map(r => {
                                        const isSelected = quickNotes.includes(r);
                                        return (
                                            <button
                                                key={r}
                                                type="button"
                                                onClick={(e) => {
                                                    e.preventDefault();
                                                    e.stopPropagation();
                                                    toggleQuickNote(r);
                                                }}
                                                className={`px-3 py-1.5 rounded-full text-[11px] font-bold border transition-all flex items-center gap-1.5 active:scale-95 cursor-pointer shadow-sm ${
                                                    isSelected
                                                        ? 'bg-rose-600 text-white font-black border-rose-500 shadow-md shadow-rose-900/50 ring-2 ring-rose-400/50 scale-105'
                                                        : 'bg-[#18181b] border-zinc-700 text-zinc-300 hover:border-zinc-500 hover:text-white hover:bg-zinc-800'
                                                }`}
                                            >
                                                <i className={`fas ${isSelected ? 'fa-check-circle text-white' : 'fa-circle text-zinc-600 text-[8px]'}`}></i>
                                                <span>{r}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                                <textarea
                                    value={extraText}
                                    onChange={e => setExtraText(e.target.value)}
                                    placeholder="Nhập thêm lý do hoặc mô tả chung (nếu có)..."
                                    className="w-full text-white text-[12px] font-bold bg-[#141414] p-3 rounded-xl outline-none border border-[#333] focus:border-rose-500 resize-none h-16 transition-colors"
                                ></textarea>
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <div className="p-3 bg-[#1a1a1a] flex gap-2 border-t border-white/10 shrink-0">
                        <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-zinc-800 text-zinc-400 font-black hover:bg-zinc-700 transition-colors text-[11px] uppercase tracking-wider">
                            ĐÓNG
                        </button>
                        {!readOnly && (
                            <button onClick={handleSave} className="flex-[2] py-3 rounded-xl bg-[#e11d48] text-white font-black hover:bg-rose-500 transition-colors text-[11px] uppercase tracking-wider shadow-[0_0_15px_rgba(225,29,72,0.3)] flex items-center justify-center gap-2">
                                <i className="fas fa-paper-plane"></i> GỬI LỖI VỀ XƯỞNG
                            </button>
                        )}
                    </div>
                </div>
            </div>
        );
    }
    // ==========================================
    // MODAL PHẠT NHANH (QUICK PENALTY)
    // ==========================================
    function QuickPenaltyModal({ visible, onClose, pushDeltas, triggerToast, userConfigs }) {
        const [user, setUser] = React.useState('');
        const [amount, setAmount] = React.useState(20000);
        const [reason, setReason] = React.useState('Trễ giờ đóng gói đơn');
        const [orderCode, setOrderCode] = React.useState('');
        const [customReason, setCustomReason] = React.useState('');
        const [proofPhotoUrl, setProofPhotoUrl] = React.useState('');
        const [uploadingProof, setUploadingProof] = React.useState(false);
        const [submitting, setSubmitting] = React.useState(false);

        const staffList = React.useMemo(() => {
            if (userConfigs && userConfigs.pins) {
                return Object.values(userConfigs.pins).map(p => p.name || p.username || p.user).filter(Boolean);
            }
            return ['Nguyễn Thị Diệu Hương', 'Nguyễn Hoàng Dương', 'Huỳnh Đức Tâm', 'Lê Hữu Phúc'];
        }, [userConfigs]);

        React.useEffect(() => {
            if (staffList.length > 0 && !user) setUser(staffList[0]);
        }, [staffList, user]);

        if (!visible) return null;

        const QUICK_AMOUNTS = [10000, 20000, 50000, 100000, 200000];
        const QUICK_REASONS = [
            'Trễ giờ đóng gói đơn',
            'Ảnh đóng gói không khớp đơn',
            'Đi làm muộn / Chưa chấm công',
            'Làm vỡ/hỏng sản phẩm',
            'Bỏ vị trí / Vi phạm quy chế xưởng',
            'Khác'
        ];

        const handleUploadProof = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setUploadingProof(true);
            try {
                let base64 = "";
                if (typeof resizeImage === 'function') {
                    const resImg = await resizeImage(file, 1000, 1000);
                    base64 = resImg.includes(',') ? resImg.split(',')[1] : resImg;
                } else {
                    base64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (ev) => resolve(ev.target.result.split(',')[1]);
                        reader.readAsDataURL(file);
                    });
                }
                if (triggerToast) triggerToast("Đang tải ảnh bằng chứng...", "fa-spinner fa-spin", "info");
                const url = await runGAS('uploadImage', base64, `PENALTY_${Date.now()}.jpg`);
                if (url) {
                    setProofPhotoUrl(url);
                    if (triggerToast) triggerToast("Đã tải ảnh bằng chứng thành công!", "fa-check", "success");
                } else {
                    if (triggerToast) triggerToast("Lỗi khi tải ảnh lên máy chủ", "fa-times", "danger");
                }
            } catch (err) {
                if (triggerToast) triggerToast("Lỗi xử lý ảnh", "fa-times", "danger");
            } finally {
                setUploadingProof(false);
            }
        };

        const handleSubmit = async () => {
            if (!user) {
                if (triggerToast) triggerToast('Vui lòng chọn nhân sự bị phạt!', 'fa-exclamation-circle', 'warning');
                return;
            }
            const finalAmount = Number(amount) || 0;
            if (finalAmount <= 0) {
                if (triggerToast) triggerToast('Vui lòng nhập số tiền phạt lớn hơn 0!', 'fa-exclamation-circle', 'warning');
                return;
            }
            const finalReason = reason === 'Khác' ? customReason : reason;
            if (!finalReason.trim()) {
                if (triggerToast) triggerToast('Vui lòng nhập lý do phạt!', 'fa-exclamation-circle', 'warning');
                return;
            }

            setSubmitting(true);
            try {
                const safeDateOnly = typeof getLocalISODate === 'function' ? getLocalISODate().split('T')[0] : new Date().toISOString().split('T')[0];
                const nowIso = new Date().toISOString().replace('T', ' ').slice(0, 19);
                const noteText = `${finalReason}${orderCode ? ` (Đơn: ${orderCode})` : ''}${proofPhotoUrl ? ` [Ảnh: ${proofPhotoUrl}]` : ''}`;
                const bpRecord = {
                    id: 'BP_PENALTY_' + Date.now(),
                    user: user,
                    amount: -Math.abs(finalAmount),
                    type: 'Phạt Vi Phạm',
                    note: noteText,
                    date: safeDateOnly,
                    orderCode: orderCode.trim()
                };
                const logRecord = {
                    'Thời gian': nowIso,
                    'Tên nhân sự': user,
                    'Hoàn thành': 'Bị Phạt Vi Phạm',
                    'Hỏi AI': '',
                    'Ghi chú thêm': `Phạt -${finalAmount.toLocaleString('vi-VN')}đ: ${finalReason}${orderCode ? ` - Đơn: ${orderCode}` : ''}${proofPhotoUrl ? ` - Link ảnh: ${proofPhotoUrl}` : ''}`
                };

                await pushDeltas({ BonusPenalty: [bpRecord], Tracking_Log: [logRecord] }, `Đã ghi nhận phạt -${finalAmount.toLocaleString('vi-VN')}đ cho ${user}!`, 'fa-gavel');
                if (triggerToast) triggerToast(`Đã lưu phạt vào bảng lương của ${user}!`, 'fa-check', 'success');
                setProofPhotoUrl('');
                onClose();
            } catch (err) {
                if (triggerToast) triggerToast('Lỗi khi lưu phạt vi phạm!', 'fa-times', 'danger');
            } finally {
                setSubmitting(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                <div className="bg-[#111015] border border-rose-900/50 rounded-2xl p-5 max-w-md w-full shadow-2xl relative text-white animate-scale-up max-h-[92vh] flex flex-col">
                    <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-[#1e1c24] text-gray-400 hover:text-white hover:bg-rose-600 transition-colors">
                        <i className="fas fa-times"></i>
                    </button>

                    <div className="flex items-center gap-2.5 mb-3 pb-3 border-b border-[#221f2b] shrink-0">
                        <div className="w-8 h-8 rounded-lg bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
                            <i className="fas fa-gavel"></i>
                        </div>
                        <div>
                            <h3 className="text-sm font-black text-rose-400 uppercase tracking-wider">Phạt Vi Phạm Nhanh</h3>
                            <p className="text-[10px] text-zinc-400">Ghi nhận trực tiếp vào bảng lương tháng này</p>
                        </div>
                    </div>

                    <div className="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1 pb-1">
                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Nhân sự bị phạt</label>
                            <select value={user} onChange={e => setUser(e.target.value)} className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-xs font-bold text-white outline-none focus:border-rose-500">
                                {staffList.map(u => <option key={u} value={u}>{u}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Mức tiền phạt (VNĐ)</label>
                            <div className="flex gap-1.5 flex-wrap mb-2">
                                {QUICK_AMOUNTS.map(a => (
                                    <button key={a} type="button" onClick={() => setAmount(a)} className={`px-2.5 py-1 text-[10px] font-mono font-bold rounded border transition-all ${amount === a ? 'bg-rose-600 text-white border-rose-500' : 'bg-[#181620] text-zinc-300 border-[#2d293b] hover:border-zinc-500'}`}>
                                        -{a.toLocaleString('vi-VN')}đ
                                    </button>
                                ))}
                            </div>
                            <input type="number" value={amount} onChange={e => setAmount(Number(e.target.value))} className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-xs font-mono font-bold text-rose-400 outline-none focus:border-rose-500" placeholder="Số tiền phạt..." />
                        </div>

                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Lý do phạt</label>
                            <div className="flex gap-1.5 flex-wrap mb-2">
                                {QUICK_REASONS.map(r => (
                                    <button key={r} type="button" onClick={() => setReason(r)} className={`px-2 py-1 text-[9.5px] font-bold rounded border transition-all ${reason === r ? 'bg-rose-950/80 text-rose-300 border-rose-500' : 'bg-[#181620] text-zinc-400 border-[#2d293b] hover:text-zinc-200'}`}>
                                        {r}
                                    </button>
                                ))}
                            </div>
                            {reason === 'Khác' && (
                                <input type="text" value={customReason} onChange={e => setCustomReason(e.target.value)} placeholder="Nhập lý do phạt chi tiết..." className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-rose-500 mb-2" />
                            )}
                        </div>

                        <div>
                            <label className="block text-[10px] font-bold text-zinc-400 mb-1 uppercase tracking-wider">Mã đơn hàng liên quan (Nếu có)</label>
                            <input type="text" value={orderCode} onChange={e => setOrderCode(e.target.value)} placeholder="Ví dụ: RF24082101..." className="w-full bg-[#181620] border border-[#2d293b] rounded-lg px-3 py-2 text-xs font-mono text-white outline-none focus:border-rose-500 uppercase" />
                        </div>

                        <div>
                            <div className="flex justify-between items-center mb-1">
                                <label className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Ảnh bằng chứng (Tuỳ chọn)</label>
                                {proofPhotoUrl && (
                                    <button type="button" onClick={() => setProofPhotoUrl('')} className="text-rose-400 hover:text-rose-300 text-[9.5px] font-bold underline cursor-pointer">
                                        <i className="fas fa-trash-alt mr-1"></i>Xoá ảnh
                                    </button>
